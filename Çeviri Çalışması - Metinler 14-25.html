<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Çeviri Çalışması — Metinler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Amiri:wght@400;700&display=swap">
<style>
:root{
  --paper:#F5F4EF;--card:#FFFFFF;--ink:#20221E;--muted:#626459;--line:#DEDCD2;--soft:#EEECE4;--accent:#7A4B16;--gloss:#2F5E9E;--ok-bg:#E2F2E6;--ok:#1F7A3E;
  --f-display:"Alegreya",Georgia,serif;--f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --f-ar:"Amiri","Scheherazade New","Traditional Arabic","Noto Naskh Arabic",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141412;--card:#1D1D1A;--ink:#ECEAE2;--muted:#A6A497;--line:#33322C;--soft:#26251F;--accent:#E3B36E;--gloss:#95B9F0;--ok-bg:#17301F;--ok:#6FD08E;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#141412;--card:#1D1D1A;--ink:#ECEAE2;--muted:#A6A497;--line:#33322C;--soft:#26251F;--accent:#E3B36E;--gloss:#95B9F0;--ok-bg:#17301F;--ok:#6FD08E;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 var(--f-body)}
.wrap{max-width:920px;margin:0 auto;padding:18px 16px 70px}
header h1{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.15;margin:6px 0 2px;color:var(--accent)}
header .ar-title{font-family:var(--f-ar);font-size:36px;direction:rtl;margin:0}
header p{color:var(--muted);margin:6px 0 0}
.tabs{display:flex;gap:6px;margin:18px 0 14px;overflow-x:auto;padding-bottom:4px}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--card)}
.lbl{font-family:var(--f-display);font-weight:700;color:var(--accent);margin:0 0 8px;font-size:15px;letter-spacing:.02em}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0;margin:10px 0 10px;display:flex;flex-wrap:wrap;gap:6px}
.sw{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 12px;font:inherit;font-size:15px;cursor:pointer}
.sw.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
.card{padding:12px 14px}
.s{padding:8px 0 10px;border-top:1px dashed var(--line)}
.s:first-of-type{border-top:0;padding-top:2px}
.words{display:flex;flex-wrap:wrap;direction:rtl;gap:6px 5px}
.w{display:inline-flex;flex-direction:column;align-items:center;min-width:46px;max-width:150px;padding:2px 6px 5px;border:1px solid var(--line);border-radius:9px;background:var(--soft);text-align:center}
.w .a{font-family:var(--f-ar);font-size:26px;line-height:1.65}
.w .k{font-family:var(--f-ar);font-size:16px;line-height:1.3;color:var(--accent);direction:rtl}
.w .k.n{font-family:var(--f-body);font-size:12.5px;font-style:italic;color:var(--muted);direction:ltr}
.w .g{direction:ltr;font-size:14px;line-height:1.2;color:var(--gloss);margin-top:1px}
.ct{margin:6px 0 0;padding:6px 10px;border-inline-start:3px solid var(--ok);background:var(--ok-bg);border-radius:6px;font-size:16.5px;line-height:1.4}
.pt{margin:6px 0 0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);line-height:1.5}
.pt b{display:block;font-family:var(--f-display);color:var(--accent);font-size:14.5px}
body.nk .w:not(.ac) .k,body.ng .w:not(.ac) .g{display:none}
body.nc .ct:not(.ac) span,body.np .pt:not(.ac) span{visibility:hidden}
.w,.ct,.pt{cursor:pointer;-webkit-tap-highlight-color:transparent}
.w:not(.ac) .g{visibility:hidden}
.w.ac{border-color:var(--gloss)}
.ct:not(.ac),.pt:not(.ac){background:transparent;border:1px dashed var(--line);border-inline-start:3px solid var(--line)}
.ct:not(.ac) span,.pt:not(.ac) span{display:none}
.ct:not(.ac)::before{content:"Cümle çevirisi — görmek için dokun";color:var(--muted);font-size:14.5px}
.pt:not(.ac) b{color:var(--muted);font-family:var(--f-body);font-weight:400}
.pt:not(.ac) b::after{content:" — görmek için dokun"}
.nav{display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0}
.nav select{flex:1;min-width:0;font:inherit;font-weight:500;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.nav .btn{padding:8px 13px}
.nav .btn:disabled{opacity:.35;cursor:default}
header .ar-title{line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
<div class="nav">
  <button class="btn" id="geri" aria-label="Önceki metin">◀</button>
  <select id="sec" aria-label="Metin seç"></select>
  <button class="btn" id="ileri" aria-label="Sonraki metin">▶</button>
</div>
<header>
  <p class="ar-title" id="arb"></p>
  <h1 id="trb"></h1>
  <p>Anlamlar ve çeviriler kapalıdır. Bir kelimeye dokununca anlamı, cümlenin ya da paragrafın altındaki kutuya dokununca çevirisi açılır; tekrar dokununca kapanır.</p>
</header>
<div id="liste"></div>
</div>

yunları vardır: Futbol, hentbol, voleybol ve basketbol gibi. Bunlar genel olarak gençler, özel olarak da arkadaşlar arasındaki sevgiyi güçlendirir."},{"k":[["وَهِيَ","ve onlar"],["تَحْتَاجُ","ihtiyaç duyar"],["إِلَى","-e"],["فَرِيقَيْنِ","iki takım"]],"tr":"Bu oyunlar iki takıma ihtiyaç duyar (iki takımla oynanır)."}]},{"tr":"Zihinsel (fikrî) etkinlikler: Bunlar insanın boş vakitlerinde yaptığı en önemli etkinliklerdendir; her türüyle kitap okumak ve yabancı dil öğrenmeye önem vermek gibi. Nitekim atasözünde dendiği gibi: “Bir lisan bir insan.”","s":[{"k":[["النَّشَاطَاتُ","etkinlikler"],["الفِكْرِيَّةُ","fikrî, zihinsel"]],"tr":"Zihinsel (fikrî) etkinlikler:"},{"k":[["وَهِيَ","ve onlar"],["مِنْ","-den"],["أَهَمِّ","en önemli"],["النَّشَاطَاتِ","etkinlikler"],["الَّتِي","ki"],["يَقُومُ","yapar (يَقُومُ بِـ: yapmak)"],["بِهَا","onları"],["الإِنْسَانُ","insan"],["فِي","-de"],["أَوْقَاتِ","vakitleri"],["فَرَاغِهِ","onun boşluğu (→ boş vakitleri)"],["مِثْلُ","gibi"],["قِرَاءَةِ","okumak"],["الكُتُبِ","kitaplar"],["بِكُلِّ","bütün … ile"],["أَنْوَاعِهَا","onların türleri"],["وَالاهْتِمَامِ","ve önem vermek, ilgilenmek"],["بِتَعَلُّمِ","öğrenmeye"],["اللُّغَاتِ","diller"],["الأَجْنَبِيَّةِ","yabancı"]],"tr":"Bunlar insanın boş vakitlerinde yaptığı en önemli etkinliklerdendir; her türüyle kitap okumak ve yabancı dil öğrenmeye önem vermek gibi."},{"k":[["فَكَمَا","nitekim … gibi"],["يَقُولُ","der"],["المَثَلُ","atasözü"],["لِسَانٌ","dil, lisan"],["وَاحِدٌ","bir"],["إِنْسَانٌ","insan"],["وَاحِدٌ","bir"]],"tr":"Nitekim atasözünde dendiği gibi: “Bir lisan bir insan.”"}]},{"tr":"Hz. Ömer (r.a.) şöyle demiştir: “Çocuklarınıza yüzmeyi, atıcılığı ve ata binmeyi öğretin.”","s":[{"k":[["قَالَ","dedi"],["عُمَرُ","Ömer"],["رَضِيَ","razı oldu"],["اللهُ","Allah"],["عَنْهُ","ondan"],["عَلِّمُوا","öğretin"],["أَوْلَادَكُمُ","çocuklarınıza"],["السِّبَاحَةَ","yüzmeyi"],["وَالرِّمَايَةَ","ve atıcılığı (ok atmayı)"],["وَرُكُوبَ","ve binmeyi"],["الخَيْلِ","at"]],"tr":"Hz. Ömer (r.a.) şöyle demiştir: “Çocuklarınıza yüzmeyi, atıcılığı ve ata binmeyi öğretin.”"}]}]},{"n":15,"ar":"الإِنْسَانُ وَوَسَائِلُ النَّقْلِ","tr":"İnsan ve Ulaşım Araçları","bk":[["الإِنْسَانُ","insan"],["وَوَسَائِلُ","ve araçları"],["النَّقْلِ","taşıma, ulaşım"]],"p":[{"tr":"Ulaşım araçları, geçmişte ve günümüzde insan hayatındaki en önemli şeylerdendir. Çünkü bunlar, insanın gitmek istediği yerlere mümkün olan en kısa sürede ulaşmasına yardımcı olur ve insani ilişkileri geliştirir; ayrıca insanların birbirleriyle tanışmasını kolaylaştırır.","s":[{"k":[["وَسَائِلُ","araçlar(ı)"],["النَّقْلِ","taşıma, ulaşım"],["مِنْ","-den"],["أَهَمِّ","en önemli"],["الأُمُورِ","işler, şeyler"],["فِي","-de"],["حَيَاةِ","hayatı"],["الإِنْسَانِ","insan(ın)"],["فِي","-de"],["المَاضِي","geçmiş"],["وَالحَاضِرِ","ve şimdiki zaman (günümüz)"]],"tr":"Ulaşım araçları, geçmişte ve günümüzde insan hayatındaki en önemli şeylerdendir."},{"k":[["فَهِيَ","çünkü onlar"],["تُسَاعِدُ","yardım eder"],["الإِنْسَانَ","insana"],["عَلَى","-e (yardım etmek: سَاعَدَ عَلَى)"],["الوُصُولِ","ulaşmak"],["إِلَى","-e"],["الأَمَاكِنِ","yerler"],["الَّتِي","ki onlar (-diği)"],["يُرِيدُ","ister"],["الذَّهَابَ","gitmeyi"],["إِلَيْهَا","onlara"],["بِأَسْرَعِ","en hızlı … ile"],["وَقْتٍ","vakit, süre"],["مُمْكِنٍ","mümkün (→ en kısa sürede)"]],"tr":"Çünkü bunlar, insanın gitmek istediği yerlere mümkün olan en kısa sürede ulaşmasına yardımcı olur,"},{"k":[["وَتُطَوِّرُ","ve geliştirir"],["العَلَاقَاتِ","ilişkileri"],["الإِنْسَانِيَّةَ","insani"],["إِضَافَةً","ek olarak"],["إِلَى","-e"],["أَنَّهَا","onların … olması (ki onlar)"],["تُسَهِّلُ","kolaylaştırır"],["تَعَارُفَ","tanışmasını"],["النَّاسِ","insanlar(ın)"],["بَعْضِهِمْ","onların bazısı"],["بِبَعْضٍ","bazısıyla (→ birbirleriyle)"]],"tr":"insani ilişkileri geliştirir; ayrıca insanların birbirleriyle tanışmasını kolaylaştırır."}]},{"tr":"Ulaşım araçları, bilimsel gelişme sayesinde, özellikle son yüzyıllarda büyük ölçüde gelişti; böylece basit ve ilkel biçimlerden gelişmiş biçimlere geçti.","s":[{"k":[["تَطَوَّرَتْ","gelişti"],["وَسَائِلُ","araçlar(ı)"],["النَّقْلِ","taşıma, ulaşım"],["بِشَكْلٍ","bir şekilde"],["كَبِيرٍ","büyük"],["وَخَاصَّةً","ve özellikle"],["فِي","-de"],["القُرُونِ","yüzyıllar"],["الأَخِيرَةِ","son"],["بِسَبَبِ","sebebiyle"],["التَّطَوُّرِ","gelişme"],["العِلْمِيِّ","bilimsel"]],"tr":"Ulaşım araçları, bilimsel gelişme sebebiyle, özellikle son yüzyıllarda büyük ölçüde gelişti;"},{"k":[["فَانْتَقَلَتْ","böylece geçti"],["مِنَ","-den"],["الأَشْكَالِ","biçimler, şekiller"],["البَسِيطَةِ","basit"],["البِدَائِيَّةِ","ilkel"],["إِلَى","-e"],["الأَشْكَالِ","biçimler, şekiller"],["المُتَطَوِّرَةِ","gelişmiş"]],"tr":"böylece basit ve ilkel biçimlerden gelişmiş biçimlere geçti."}]},{"tr":"Geçmişte insan, yolculuğunda ve işlerinde eşekleri, katırları, atları ve yelkenli tekneleri kullandı. Allah Teâlâ şöyle buyurmuştur: “Hem binesiniz diye hem de süs olarak atları, katırları ve eşekleri (yarattı). O, sizin bilmediğiniz şeyleri de yaratır.” (Nahl sûresi: 8). İnsan bu araçlarla yaptığı yolculukta günler ve geceler geçirir, yolculuğun ve zorluklarının sıkıntısını çeker, tehlikelere maruz kalır, güçlüklerle karşılaşır, malını ve vaktini boşa harcardı. Çünkü bu araçlar çoğunlukla yavaştı ve yolculukta çok vakit alırdı.","s":[{"k":[["فِي","-de"],["المَاضِي","geçmiş"],["اسْتَخْدَمَ","kullandı"],["الإِنْسَانُ","insan"],["فِي","-de"],["سَفَرِهِ","onun yolculuğu"],["وَأَعْمَالِهِ","ve onun işleri"],["الحَمِيرَ","eşekleri"],["وَالبِغَالَ","ve katırları"],["وَالخَيْلَ","ve atları"],["وَالمَرَاكِبَ","ve tekneleri, binekleri"],["الشِّرَاعِيَّةَ","yelkenli"]],"tr":"Geçmişte insan, yolculuğunda ve işlerinde eşekleri, katırları, atları ve yelkenli tekneleri kullandı."},{"k":[["قَالَ","dedi, buyurdu"],["تَعَالَى","yüce oldu (→ Allah Teâlâ)"],["وَالْخَيْلَ","ve atları"],["وَالْبِغَالَ","ve katırları"],["وَالْحَمِيرَ","ve eşekleri"],["لِتَرْكَبُوهَا","onlara binesiniz diye"],["وَزِينَةً","ve süs olarak"],["وَيَخْلُقُ","ve yaratır"],["مَا","şey(ler)"],["لَا","değil, -mez"],["تَعْلَمُونَ","bilirsiniz (→ bilmediğiniz)"],["سُورَةُ","sûresi"],["النَّحْلِ","arı (→ Nahl sûresi)"],["٨","8"]],"tr":"Allah Teâlâ şöyle buyurmuştur: “Hem binesiniz diye hem de süs olarak atları, katırları ve eşekleri (yarattı). O, sizin bilmediğiniz şeyleri de yaratır.” (Nahl sûresi: 8)."},{"k":[["وَكَانَ","ve idi (-rdi)"],["الإِنْسَانُ","insan"],["يَقْضِي","geçirir"],["فِي","-de"],["سَفَرِهِ","onun yolculuğu"],["بِهَذِهِ","bu … ile"],["الوَسَائِلِ","araçlar"],["الأَيَّامَ","günleri"],["وَاللَّيَالِيَ","ve geceleri"]],"tr":"İnsan bu araçlarla yaptığı yolculukta günler ve geceler geçirir,"},{"k":[["وَيُعَانِي","ve sıkıntı çeker"],["مِنَ","-den"],["السَّفَرِ","yolculuk"],["وَصُعُوبَاتِهِ","ve onun zorlukları"],["وَيَتَعَرَّضُ","ve maruz kalır"],["لِلْأَخْطَارِ","tehlikelere"],["وَيُوَاجِهُ","ve karşılaşır"],["المَصَاعِبَ","güçlükler(le)"],["وَيُهْدِرُ","ve boşa harcar"],["مَالَهُ","onun malını"],["وَوَقْتَهُ","ve onun vaktini"]],"tr":"yolculuğun ve zorluklarının sıkıntısını çeker, tehlikelere maruz kalır, güçlüklerle karşılaşır, malını ve vaktini boşa harcardı."},{"k":[["فَقَدْ","çünkü gerçekten"],["كَانَتْ","idi"],["هَذِهِ","bu"],["الوَسَائِلُ","araçlar"],["بَطِيئَةً","yavaş"],["غَالِبًا","çoğunlukla"],["وَتَسْتَغْرِقُ","ve (zaman) alır, sürer"],["الكَثِيرَ","çoğunu"],["مِنَ","-den"],["الوَقْتِ","vakit"],["فِي","-de"],["السَّفَرِ","yolculuk"]],"tr":"Çünkü bu araçlar çoğunlukla yavaştı ve yolculukta çok vakit alırdı."}]},{"tr":"Şimdi ise otomobil, otobüs, gemi, uçak, hızlı tren, metro ve diğer modern ulaşım araçları vardır. Bu araçlar güvenli ve rahattır; yolculara değerli vakitlerini kazandırır. Modern taşıma ve ulaşım araçları, insana sanayiyi, ticareti, tarımı ve hayatın tamamını geliştirmede yardımcı olmuştur.","s":[{"k":[["أَمَّا","-e gelince"],["الآنَ","şimdi"],["فَهُنَاكَ","ise vardır"],["السَّيَّارَةُ","otomobil, araba"],["وَالحَافِلَةُ","ve otobüs"],["وَالسَّفِينَةُ","ve gemi"],["وَالطَّائِرَةُ","ve uçak"],["وَالقِطَارُ","ve tren"],["السَّرِيعُ","hızlı"],["وَمِتْرُو","ve metrosu"],["الأَنْفَاقِ","tüneller (→ metro)"],["وَغَيْرُهَا","ve onların dışındakiler (diğerleri)"],["مِنْ","-den"],["وَسَائِلِ","araçlar(ı)"],["المُوَاصَلَاتِ","ulaşım"],["الحَدِيثَةِ","modern"]],"tr":"Şimdi ise otomobil, otobüs, gemi, uçak, hızlı tren, metro ve diğer modern ulaşım araçları vardır."},{"k":[["هَذِهِ","bu"],["الوَسَائِلُ","araçlar"],["آمِنَةٌ","güvenli"],["وَمُرِيحَةٌ","ve rahat"],["وَتُوَفِّرُ","ve tasarruf ettirir, sağlar"],["الوَقْتَ","vakti"],["الثَّمِينَ","değerli"],["لِلرُّكَّابِ","yolcular için"]],"tr":"Bu araçlar güvenli ve rahattır; yolculara değerli vakti kazandırır."},{"k":[["وَقَدْ","ve gerçekten (-miştir)"],["سَاعَدَتْ","yardım etti"],["وَسَائِلُ","araçlar(ı)"],["النَّقْلِ","taşıma"],["وَالمُوَاصَلَاتُ","ve ulaşım"],["الحَدِيثَةُ","modern"],["الإِنْسَانَ","insana"],["فِي","-de"],["تَطْوِيرِ","geliştirme"],["الصِّنَاعَةِ","sanayi"],["وَالتِّجَارَةِ","ve ticaret"],["وَالزِّرَاعَةِ","ve tarım"],["وَالحَيَاةِ","ve hayat"],["كُلِّهَا","onun tamamı"]],"tr":"Modern taşıma ve ulaşım araçları, insana sanayiyi, ticareti, tarımı ve hayatın tamamını geliştirmede yardımcı olmuştur."}]}]},{"n":16,"ar":"الشَّيْخُ مُحَمَّد مُتَوَلِّي الشَّعْرَاوِيُّ","tr":"Şeyh Şa‘râvî","bk":[["الشَّيْخُ","şeyh"],["مُحَمَّد","Muhammed"],["مُتَوَلِّي","Mütevellî"],["الشَّعْرَاوِيُّ","eş-Şa‘râvî"]],"p":[{"tr":"Şeyh Muhammed Mütevellî eş-Şa‘râvî, Mısırlı bir din âlimi ve eski vakıflar bakanıdır. Modern çağda Kur’an-ı Kerim’in en meşhur müfessirlerinden sayılır; Kur’an-ı Kerim’i sadeleştirilmiş yöntemlerle tefsir etmiş, bazıları da ona “Davetçilerin İmamı” lakabını vermiştir.","s":[{"k":[["الشَّيْخُ","şeyh"],["مُحَمَّد","Muhammed"],["مُتَوَلِّي","Mütevellî"],["الشَّعْرَاوِيُّ","eş-Şa‘râvî"],["عَالِمُ","âlimi"],["دِينٍ","din"],["وَوَزِيرُ","ve bakanı"],["أَوْقَافٍ","vakıflar"],["مِصْرِيٌّ","Mısırlı"],["سَابِقٌ","eski, önceki"]],"tr":"Şeyh Muhammed Mütevellî eş-Şa‘râvî, Mısırlı bir din âlimi ve eski vakıflar bakanıdır."},{"k":[["يُعَدُّ","sayılır  oldu"],["فِيهَا","ondan (orada)"],["عَامَ","yılında"],["١٩٤٠م","1940 (milâdî)"]],"tr":"Şa‘râvî 1937 yılında Arap Dili Fakültesi’nde okudu ve 1940 yılında oradan mezun oldu."},{"k":[["وَبَعْدَ","ve sonra"],["تَخَرُّجِهِ","onun mezuniyeti"],["عَمِلَ","çalıştı"],["فِي","-de"],["المَعْهَدِ","enstitü"],["الدِّينِيِّ","dinî"],["بِمَدِينَةِ","şehrinde"],["طَنْطَا","Tanta"]],"tr":"Mezuniyetinden sonra Tanta şehrindeki dinî enstitüde çalıştı;"},{"k":[["ثُمَّ","sonra"],["انْتَقَلَ","geçti, nakloldu"],["بَعْدَ","sonra"],["ذَلِكَ","bu, o (→ bundan sonra)"],["إِلَى","-e"],["المَعْهَدِ","enstitü"],["الدِّينِيِّ","dinî"],["بِمَدِينَةِ","şehrinde"],["الزَّقَازِيقِ","Zekâzîk"],["ثُمَّ","sonra"],["المَعْهَدِ","enstitü"],["الدِّينِيِّ","dinî"],["بِالإِسْكَنْدَرِيَّةِ","İskenderiye’de"]],"tr":"daha sonra Zekâzîk şehrindeki dinî enstitüye, ardından İskenderiye’deki dinî enstitüye geçti."}]},{"tr":"Şeyh Şa‘râvî, uzun bir tecrübenin ardından 1950 yılında Suudi Arabistan’da çalışmaya geçti ve Ümmü’l-Kurâ Üniversitesi Şeriat Fakültesi’nde hocalık yaptı. 1963 yılında Mısır’a döndü; daha sonra öğretmenlik yapmak üzere Cezayir’e gitti ve orada yaklaşık yedi yıl geçirdi.","s":[{"k":[["بَعْدَ","sonra"],["خِبْرَةٍ","bir tecrübe"],["طَوِيلَةٍ","uzun"],["انْتَقَلَ","geçti"],["الشَّيْخُ","şeyh"],["الشَّعْرَاوِيُّ","eş-Şa‘râvî"],["إِلَى","-e"],["العَمَلِ","çalışma"],["فِي","-de"],["السُّعُودِيَّةِ","Suudi Arabistan"],["عَامَ","yılında"],["١٩٥٠م","1950 (milâdî)"]],"tr":"Şeyh Şa‘râvî, uzun bir tecrübenin ardından 1950 yılında Suudi Arabistan’da çalışmaya geçti;"},{"k":[["فَعَمِلَ","ve çalıştı"],["أُسْتَاذًا","hoca, profesör olarak"],["فِي","-de"],["كُلِّيَّةِ","fakültesi"],["الشَّرِيعَةِ","şeriat (İslam hukuku)"],["بِجَامِعَةِ","üniversitesinde"],["أُمِّ","anası"],["القُرَى","şehirler (→ Ümmü’l-Kurâ: Mekke)"]],"tr":"Ümmü’l-Kurâ Üniversitesi Şeriat Fakültesi’nde hoca olarak çalıştı."},{"k":[["وَفِي","ve -de"],["عَامِ","yılı"],["١٩٦٣م","1963 (milâdî)"],["رَجَعَ","döndü"],["الشَّيْخُ","şeyh"],["الشَّعْرَ n) 17 Haziran 1998’de vefat etti."}]}]},{"n":17,"ar":"أَعْيَادُ المُسْلِمِينَ","tr":"Müslümanların Bayramları","bk":[["أَعْيَادُ","bayramları"],["المُسْلِمِينَ","Müslümanlar(ın)"]],"p":[{"tr":"Müslümanlar her yıl iki bayram kutlarlar: Ramazan Bayramı ve Kurban Bayramı. Ramazan Bayramı, ramazan ayı orucundan sonra gelir; oruç tutanlar için bir mükâfattır, çünkü onlar ramazan ayını oruçla geçirmiş ve Rablerine itaat etmişlerdir. Kurban Bayramı ise hac farizasının yerine getirilmesinden sonra gelir.","s":[{"k":[["يَحْتَفِلُ","kutlar"],["المُسْلِمُونَ","Müslümanlar"],["كُلَّ","her"],["عَامٍ","yıl"],["بِعِيدَيْنِ","iki bayramı"],["هُمَا","o ikisi (→ bunlar)"],["عِيدُ","bayramı"],["الفِطْرِ","oruç açma (→ Ramazan Bayramı)"],["وَعِيدُ","ve bayramı"],["الأَضْحَى","kurban (→ Kurban Bayramı)"]],"tr":"Müslümanlar her yıl iki bayram kutlarlar; bunlar Ramazan Bayramı ve Kurban Bayramı’dır."},{"k":[["عِيدُ","bayramı"],["الفِطْرِ","oruç açma (→ Ramazan Bayramı)"],["يَأْتِي","gelir"],["بَعْدَ","sonra"],["صِيَامِ","orucu"],["شَهْرِ","ayı"],["رَمَضَانَ","ramazan"],["وَهُوَ","ve o"],["مُكَافَأَةٌ","bir mükâfat, ödül"],["لِلصَّائِمِينَ","oruç tutanlar için"],["لِأَنَّهُمْ","çünkü onlar"],["صَامُوا","oruç tuttular"],["شَهْرَ","ayını"],["رَمَضَانَ","ramazan"],["وَأَطَاعُوا","ve itaat ettiler"],["رَبَّهُمْ","Rablerine"]],"tr":"Ramazan Bayramı, ramazan ayı orucundan sonra gelir; o, oruç tutanlar için bir mükâfattır, çünkü onlar ramazan ayını oruçla geçirmiş ve Rablerine itaat etmişlerdir."},{"k":[["وَعِيدُ","ve bayramı"],["الأَضْحَى","kurban (→ Kurban Bayramı)"],["يَأْتِي","gelir"],["بَعْدَ","sonra"],["أَدَاءِ","yerine getirme, eda"],["فَرِيضَةِ","farizası"],["الحَجِّ","hac"]],"tr":"Kurban Bayramı ise hac farizasının yerine getirilmesinden sonra gelir."}]},{"tr":"Bayramdan bir gece önce aile fertleri evi düzenlemek, elbiseleri hazırlamak ve tatlı satın almak için yardımlaşırlar; Türklerde baklava, Araplarda bayram keki (kâhk) gibi. Bu kek hurma, fıstık ya da cevizle doldurulmuş olur.","s":[{"k":[["وَقَبْلَ","ve önce"],["العِيدِ","bayram(dan)"],["بِلَيْلَةٍ","bir gece (ile)"],["يَتَعَاوَنُ","yardımlaşır"],["أَفْرَادُ","fertleri"],["الأُسْرَةِ","aile(nin)"],["فِي","-de (→ konusunda)"],["تَرْتِيبِ","düzenleme"],["البَيْتِ","ev(i)"],["وَتَجْهِيزِ","ve hazırlama"],["الثِّيَابِ","elbiseler(i)"],["وَشِرَاءِ","ve satın alma"],["الحَلَوِيَّاتِ","tatlılar"],["كَالبَقْلَاوَةِ","baklava gibi"],["عِنْدَ","yanında, -de"],["الأَتْرَاكِ","Türkler"],["وَكَعْكِ","ve keki, çöreği"],["العِيدِ","bayram"],["عِنْدَ","yanında, -de"],["العَرَبِ","Araplar"]],"tr":"Bayramdan bir gece önce aile fertleri evi düzenlemek, elbiseleri hazırlamak ve tatlı satın almak için yardımlaşırlar; Türklerde baklava, Araplarda bayram keki (kâhk) gibi."},{"k":[["وَيَكُونُ","ve olur"],["الكَعْكُ","kek, çörek"],["مَحْشُوًّا","doldurulmuş, içli"],["بِالتَّمْرِ","hurmayla"],["أَوِ","veya"],["الفُسْتُقِ","fıstık"],["أَوِ","veya"],["الجَوْزِ","ceviz"]],"tr":"Bu kek hurma, fıstık ya da cevizle doldurulmuş olur."}]},{"tr":"Bayram günü sabahı Müslümanlar, küçük büyük hep birlikte, yeni elbiseleriyle ve tekbir getirerek bayram namazına çıkarlar; sonra bayramlaşmak, misafirleri karşılamak, karşılıklı ziyaretlerde bulunmak ve tebrikleşmek için evlerine dönerler.","s":[{"k":[["وَفِي","ve -de"],["صَبَاحِ","sabahı"],["يَوْمِ","günü(nün)"],["العِيدِ","bayram"],["يَخْرُجُ","çıkar"],["المُسْلِمُونَ","Müslümanlar"],["صِغَارًا","küçükler olarak"],["وَكِبَارًا","ve büyükler olarak"],["إِلَى","-e"],["صَلَاةِ","namazı"],["العِيدِ","bayram"],["بِالمَلَابِسِ","elbiselerle"],["الجَدِيدَةِ","yeni"],["وَهُمْ","ve onlar"],["يُكَبِّرُونَ","tekbir getirirler"]],"tr":"Bayram günü sabahı Müslümanlar, küçük büyük hep birlikte, yeni elbiseleriyle ve tekbir getirerek bayram namazına çıkarlar."},{"k":[["ثُمَّ","sonra"],["يَعُودُونَ","dönerler"],["إِلَى","-e"],["بُيُوتِهِمْ","evlerine"],["لِلْمُعَايَدَةِ","bayramlaşmak için"],["وَلِاسْتِقْبَالِ","ve karşılamak için"],["الضُّيُوفِ","misafirler(i)"],["وَتَبَادُلِ","ve karşılıklı yapma"],["الزِّيَارَاتِ","ziyaretler"],["وَالتَّهَانِي","ve tebrikler"]],"tr":"Sonra bayramlaşmak, misafirleri karşılamak, karşılıklı ziyaretlerde bulunmak ve tebrikleşmek için evlerine dönerler."}]},{"tr":"Bu bayramda, gusledip yeni elbiselerimi giymek ve ardından arkadaşlarım Muhammed, Hüsam ve Ahmed ile birlikte sabah namazını kılmaya gitmek için fecirden önce uyanmaya karar verdim. Sonra tekbir getirmek, bayram namazını kılmak ve hutbeyi dinlemek için mescitte kaldık. Ardından ailelerimizin bayramını tebrik etmek ve arkadaşları ziyaret etmek için evlerimize döndük. Ben ve arkadaşlarım bazı mesire yerlerine ve lunaparka gitmeye de karar verdik; çünkü bayram günü mutluluk ve sevinç günüdür.","s":[{"k":[["فِي","-de"],["هَذَا","bu"],["العِيدِ","bayram"],["قَرَّرْتُ","karar verdim"],["أَنْ","-meye, -mesi"],["أَسْتَيْقِظَ","uyanayım"],["قَبْلَ","önce"],["الفَجْرِ","fecir, tan vakti"],["لِأَغْتَسِلَ","yıkanmam (gusletmem) için"],["وَأَرْتَدِيَ","ve giyeyim"],["مَلَابِسِي","elbiselerimi"],["الجَدِيدَةَ","yeni"],["وَأَتَوَجَّهَ","ve yöneleyim, gideyim"],["بَعْدَ","sonra"],["ذَلِكَ","bu(ndan)"],["إِلَى","-e"],["أَدَاءِ","yerine getirme, kılma"],["صَلَاةِ","namazı"],["الفَجْرِ","sabah, fecir"],["مَعَ","ile birlikte"],["أَصْدِقَائِي","arkadaşlarım"],["مُحَمَّدٍ","Muhammed"],["وَحُسَامٍ","ve Hüsam"],["وَأَحْمَدَ","ve Ahmed"]],"tr":"Bu bayramda, gusledip yeni elbiselerimi giymek ve ardından arkadaşlarım Muhammed, Hüsam ve Ahmed ile birlikte sabah namazını kılmaya gitmek için fecirden önce uyanmaya karar verdim."},{"k":[["ثُمَّ","sonra"],["بَقِينَا","kaldık"],["فِي","-de"],["المَسْجِدِ","mescit"],["لِنُكَبِّرَ","tekbir getirmemiz için"],["وَنُصَلِّيَ","ve kılalım"],["صَلَاةَ","namazını"],["العِيدِ","bayram"],["وَنَسْتَمِعَ","ve dinleyelim"],["إِلَى","-e"],["الخُطْبَةِ","hutbe"]],"tr":"Sonra tekbir getirmek, bayram namazını kılmak ve hutbeyi dinlemek için mescitte kaldık."},{"k":[["ثُمَّ","sonra"],["رَجَعْنَا","döndük"],["إِلَى","-e"],["بُيُوتِنَا","evlerimize"],["لِنُهَنِّئَ","tebrik etmemiz için"],["عَائِلَاتِنَا","ailelerimizi"],["بِالعِيدِ","bayramla (→ bayramını)"],["وَنَزُورَ","ve ziyaret edelim"],["الأَصْدِقَاءَ","arkadaşları"]],"tr":"Ardından ailelerimizin bayramını tebrik etmek ve arkadaşları ziyaret etmek için evlerimize döndük."},{"k":[["وَقَدْ","ve gerçekten (pekiştirme)"],["قَرَّرْتُ","karar verdim"],["أَنَا","ben"],["وَأَصْدِقَائِي","ve arkadaşlarım"],["الذَّهَابَ","gitmeye"],["إِلَى","-e"],["بَعْضِ","bazı"],["المُتَنَزَّهَاتِ","mesire yerleri, parklar"],["وَمَدِينَةِ","ve şehri"],["الأَلْعَابِ","oyunlar (→ lunapark)"],["لِأَنَّ","çünkü"],["يَوْمَ","günü"],["العِيدِ","bayram"],["يَوْمُ","günü(dür)"],["سَعَادَةٍ","mutluluk"],["وَسُرُورٍ","ve sevinç"]],"tr":"Ben ve arkadaşlarım bazı mesire yerlerine ve lunaparka gitmeye de karar verdik; çünkü bayram günü mutluluk ve sevinç günüdür."}]}]},{"n":18,"ar":"إِسْطَنْبُولُ","tr":"İstanbul","bk":[["إِسْطَنْبُولُ","İstanbul"]],"p":[{"tr":"İstanbul güzel bir şehirdir; İstanbul Boğazı üzerinde yer alır. Dünyada iki kıta, yani Asya ve Avrupa üzerinde bulunan tek şehirdir. Bu yüzden dünyanın her tarafından turist çeker.","s":[{"k":[["إِسْطَنْبُولُ","İstanbul"],["مَدِينَةٌ","bir şehir"],["جَمِيلَةٌ","güzel"],["تَقَعُ","yer alır, bulunur"],["عَلَى","üzerinde"],["مَضِيقِ","boğazı"],["البُوسْفُورِ","Bosfor (→ İstanbul Boğazı)"],["وَهِيَ","ve o"],["المَدِينَةُ","şehir"],["الوَحِيدَةُ","tek, yegâne"],["فِي","-de"],["العَالَمِ","dünya"],["الَّتِي","ki o"],["تَقَعُ","yer alır, bulunur"],["عَلَى","üzerinde"],["قَارَّتَيْنِ","iki kıta"],["آسْيَا","Asya"],["وَأُورُوبَّا","ve Avrupa"]],"tr":"İstanbul güzel bir şehirdir; İstanbul Boğazı üzerinde yer alır ve dünyada iki kıta, yani Asya ve Avrupa üzerinde bulunan tek şehirdir."},{"k":[["لِذَلِكَ","bu yüzden"],["تَجْذِبُ","çeker, cezbeder"],["السَّائِحِينَ","turistleri"],["مِنْ","-den"],["كُلِّ","her, bütün"],["أَنْحَاءِ","tarafları, yöreleri"],["العَالَمِ","dünya(nın)"]],"tr":"Bu yüzden dünyanın her tarafından turist çeker."}]},{"tr":"İstanbul tarihte “Bizans” ve “Konstantiniyye” adlarıyla bilinir; tarihi milattan öncesine uzanır. Nüfus bakımından Türkiye’nin en büyük şehridir; aynı zamanda dünyanın en kalabalık şehirlerindendir.","s":[{"k":[["تُعْرَفُ","bilinir, tanınır"],["إِسْطَنْبُولُ","İstanbul"],["تَارِيخِيًّا","tarihî olarak"],["بِاسْمَيْ","iki adıyla"],["بِيزَنْطَةَ","Bizans"],["وَالقُسْطَنْطِينِيَّةِ","ve Konstantiniyye"],["وَيَعُودُ","ve uzanır, dayanır"],["تَارِيخُهَا","onun tarihi"],["إِلَى","-e"],["مَا","şey (→ … olan zaman)"],["قَبْلَ","önce"],["المِيلَادِ","milat"]],"tr":"İstanbul tarihte “Bizans” ve “Konstantiniyye” adlarıyla bilinir; tarihi milattan öncesine uzanır."},{"k":[["وَهِيَ","ve o"],["أَكْبَرُ","en büyüğü"],["المُدُنِ","şehirler(in)"],["فِي","-de"],["تُرْكِيَا","Türkiye"],["مِنْ","-den"],["حَيْثُ","bakımından (مِنْ حَيْثُ: … bakımından)"],["عَدَدُ","sayısı"],["السُّكَّانِ","sakinler (→ nüfus)"]],"tr":"O, nüfus bakımından Türkiye’nin en büyük şehridir."},{"k":[["وَهِيَ","ve o"],["أَيْضًا","ayrıca, aynı zamanda"],["مِنْ","-den"],["أَكْثَرِ","en çok"],["المُدُنِ","şehirler"],["ازْدِحَامًا","kalabalıklık bakımından (→ en kalabalık)"],["فِي","-de"],["العَالَمِ","dünya"]],"tr":"Aynı zamanda dünyanın en kalabalık şehirlerindendir."}]},{"tr":"İstanbul, milâdî 1453 yılında Fatih Sultan Mehmed tarafından fethedildi; bu, önemli bir tarihî olaydır. Müslümanlar sahâbe devrinden beri, Peygamber’in (s.a.v.) şu sözündeki övgüsüne nail olmak için bu şehri fethetmeye çalışıyorlardı: “Konstantiniyye mutlaka fethedilecektir. Onu fetheden kumandan ne güzel kumandan, onu fetheden ordu ne güzel ordudur!” Bu yüzden, başta Ebû Eyyûb el-Ensârî olmak üzere sahâbeden pek çok kişi bu şerefe ermek için geldi; o da burada vefat etti ve buraya defnedildi. Bu şeref ise Sultan Mehmed’e nasip oldu; bu yüzden ona “Fatih” adı verildi.","s":[{"k":[["فُتِحَتْ","fethedildi"],["إِسْطَنْبُولُ","İstanbul"],["سَنَةَ","yılında"],["١٤٥٣","1453"],["لِلْمِيلَادِ","milâdî (milada göre)"],["مِنْ","-den"],["قِبَلِ","taraf (مِنْ قِبَلِ: tarafından)"],["السُّلْطَانِ","Sultan"],["مُحَمَّدٍ","Muhammed (Mehmed)"],["الفَاتِحِ","Fatih (fetheden)"],["وَهُوَ","ve o"],["حَدَثٌ","bir olay"],["تَارِيخِيٌّ","tarihî"],["مُهِمٌّ","önemli"]],"tr":"İstanbul, milâdî 1453 yılında Fatih Sultan Mehmed tarafından fethedildi; bu, önemli bir tarihî olaydır."},{"k":[["وَكَانَ","ve idi (→ -yorlardı)"],["المُسْلِمُونَ","Müslümanlar"],["مُنْذُ","-den beri"],["عَصْرِ","devri"],["الصَّحَابَةِ","sahâbe(nin)"],["يُحَاوِلُونَ","çalışıyorlar"],["فَتْحَ","fethetmeye"],["هَذِهِ","bu"],["المَدِينَةِ","şehir(i)"],["لِيَنَالُوا","elde etsinler diye, nail olmak için"],["مَدْحَ","övgüsünü"],["النَّبِيِّ","Peygamber(in)"],["ﷺ","sallallâhu aleyhi ve sellem"],["فِي","-de"],["قَوْلِهِ","onun sözü"]],"tr":"Müslümanlar sahâbe devrinden beri, Peygamber’in (s.a.v.) şu sözündeki övgüsüne nail olmak için bu şehri fethetmeye çalışıyorlardı:"},{"k":[["لَتُفْتَحَنَّ","mutlaka fethedilecektir"],["القُسْطَنْطِينِيَّةُ","Konstantiniyye (İstanbul)"],["فَلَنِعْمَ","ne güzeldir"],["الأَمِيرُ","kumandan, emîr"],["أَمِيرُهَا","onun kumandanı"],["وَلَنِعْمَ","ve ne güzeldir"],["الجَيْشُ","ordu"],["ذَلِكَ","o"],["الجَيْشُ","ordu"]],"tr":"“Konstantiniyye mutlaka fethedilecektir. Onu fetheden kumandan ne güzel kumandan, onu fetheden ordu ne güzel ordudur!”"},{"k":[["لِهَذَا","bu yüzden"],["جَاءَ","geldi"],["كَثِيرٌ","birçoğu"],["مِنَ","-den"],["الصَّحَابَةِ","sahâbe"],["وَعَلَى","ve üzerinde"],["رَأْسِهِمْ","onların başı (عَلَى رَأْسِهِمْ: başta … olmak üzere)"],["أَبُو","Ebû (babası)"],["أَيُّوبَ","Eyyûb"],["الأَنْصَارِيُّ","el-Ensârî (Ensar’dan)"],["لِيَنَالَ","elde etsin diye, ermek için"],["هَذَا","bu"],["الشَّرَفَ","şeref(i)"],["فَمَاتَ","ve öldü, vefat etti"],["وَدُفِنَ","ve defnedildi"],["فِيهَا","orada (onun içinde)"]],"tr":"Bu yüzden, başta Ebû Eyyûb el-Ensârî olmak üzere sahâbeden pek çok kişi bu şerefe ermek için geldi; o da burada vefat etti ve buraya defnedildi."},{"k":[["وَكَانَ","ve oldu"],["هَذَا","bu"],["الشَّرَفُ","şeref"],["لِلسُّلْطَانِ","Sultan’a (Sultan için)"],["مُحَمَّدٍ","Muhammed (Mehmed)"],["وَلِهَذَا","ve bu yüzden"],["سُمِّيَ","adlandırıldı"],["بِـالفَاتِحِ","“Fatih” (adıyla)"]],"tr":"Bu şeref ise Sultan Mehmed’e nasip oldu; bu yüzden ona “Fatih” adı verildi."}]},{"tr":"İstanbul, çeşitlilik gösteren doğal ortamıyla ünlüdür; bu doğa yeşil dağları, tarım ovalarını ve güzel adaları bir araya getirir. Bu güzel doğa, ılıman hava ve bol suyla birlikte, İstanbul’u yurt içinden ve yurt dışından gelenler için harika bir yazlık yer hâline getirmiştir.","s":[{"k":[["تَشْتَهِرُ","ünlüdür, meşhurdur"],["إِسْطَنْبُولُ","İstanbul"],["بِبِيئَةٍ","bir çevreyle, ortamla"],["طَبِيعِيَّةٍ","doğal"],["مُتَنَوِّعَةٍ","çeşitli"],["تَجْمَعُ","bir araya getirir"],["هَذِهِ","bu"],["الطَّبِيعَةُ","doğa, tabiat"],["بَيْنَ","arasında (تَجْمَعُ بَيْنَ: …i bir araya getirir)"],["الجِبَالِ","dağlar"],["الخَضْرَاءِ","yeşil"],["وَالسُّهُولِ","ve ovalar"],["الزِّرَاعِيَّةِ","tarımsal"],["وَالجُزُرِ","ve adalar"],["الجَمِيلَةِ","güzel"]],"tr":"İstanbul, çeşitlilik gösteren doğal ortamıyla ünlüdür; bu doğa yeşil dağları, tarım ovalarını ve güzel adaları bir araya getirir."},{"k":[["وَهَذِهِ","ve bu"],["الطَّبِيعَةُ","doğa, tabiat"],["الجَمِيلَةُ","güzel"],["إِضَافَةً","ek olarak"],["إِلَى","-e"],["الجَوِّ","hava"],["المُعْتَدِلِ","ılıman"],["وَالمِيَاهِ","ve sular"],["الوَفِيرَةِ","bol"],["جَعَلَتْ","kıldı, hâline getirdi"],["إِسْطَنْبُولَ","İstanbul’u"],["مَصِيفًا","bir yazlık (yaz geçirilen yer)"],["رَائِعًا","harika"],["لِمَنْ","kimse(ler) için"],["يَحْضُرُ","gelir"],["إِلَيْهَا","ona"],["مِنَ","-den"],["الدَّاخِلِ","iç (→ yurt içi)"],["وَالخَارِجِ","ve dış (→ yurt dışı)"]],"tr":"Bu güzel doğa, ılıman hava ve bol suyla birlikte, İstanbul’u yurt içinden ve yurt dışından gelenler için harika bir yazlık yer hâline getirmiştir."}]},{"tr":"İstanbul, Türkiye’nin en önemli turistik yerlerindendir; içinde binlerce otel ve turistik mekân vardır. Ayrıca cami, kilise, mabet, saray ve kule gibi çok sayıda tarihî eser bulunur. En önemli tarihî yapılarından bazıları şunlardır: Ayasofya, Sultan Ahmed Camii, Topkapı Sarayı, Boğaz Köprüsü, Galata Kulesi, Kız Kulesi ve Yıldız Sarayı.","s":[{"k":[["إِسْطَنْبُولُ","İstanbul"],["مِنْ","-den"],["أَهَمِّ","en önemli"],["المَوَاقِعِ","yerler, mevkiler"],["السِّيَاحِيَّةِ","turistik"],["فِي","-de"],["تُرْكِيَا","Türkiye"],["فِيهَا","onda (vardır)"],["آلَافُ","binlerce(si)"],["الفَنَادِقِ","oteller"],["وَالمَوَاقِعِ","ve yerler, mekânlar"],["السِّيَاحِيَّةِ","turistik"]],"tr":"İstanbul, Türkiye’nin en önemli turistik yerlerindendir; içinde binlerce otel ve turistik mekân vardır."},{"k":[["وَفِيهَا","ve onda (vardır)"],["عَدَدٌ","bir sayı"],["كَبِيرٌ","büyük (→ çok sayıda)"],["مِنَ","-den"],["المَعَالِمِ","simge yapılar, eserler"],["الأَثَرِيَّةِ","tarihî (arkeolojik)"],["مِثْلُ","gibi"],["المَسَاجِدِ","camiler, mescitler"],["وَالكَنَائِسِ","ve kiliseler"],["وَالمَعَابِدِ","ve mabetler"],["وَالقُصُورِ","ve saraylar"],["وَالأَبْرَاجِ","ve kuleler"]],"tr":"Ayrıca orada cami, kilise, mabet, saray ve kule gibi çok sayıda tarihî eser bulunur."},{"k":[["وَمِنْ","ve -den"],["أَهَمِّ","en önemli"],["مَعَالِمِهَا","onun simge yapıları"],["التَّارِيخِيَّةِ","tarihî"],["آيَا","Aya (→ Ayasofya)"],["صُوفْيَا","Sofya"],["وَمَسْجِدُ","ve camii"],["السُّلْطَانِ","Sultan"],["أَحْمَدَ","Ahmed"],["وَقَصْرُ","ve sarayı"],["طُوبْقَابِي","Topkapı"],["وَجِسْرُ","ve köprüsü"],["البُوسْفُورِ","Bosfor (→ Boğaz Köprüsü)"],["وَبُرْجُ","ve kulesi"],["غَلَطَةَ","Galata"],["وَبُرْجُ","ve kulesi"],["البِنْتِ","kız (→ Kız Kulesi)"],["وَقَصْرُ","ve sarayı"],["يِلْدِز","Yıldız"]],"tr":"En önemli tarihî yapılarından bazıları şunlardır: Ayasofya, Sultan Ahmed Camii, Topkapı Sarayı, Boğaz Köprüsü, Galata Kulesi, Kız Kulesi ve Yıldız Sarayı."}]},{"tr":"İstanbul şehrinin tarihî, turistik ve ekonomik önemi sebebiyle hükûmet ona büyük önem vermiş; ulaşım araçlarının hareketini kolaylaştırmak için yollar, köprüler ve tünellerden oluşan bir ağ kurmuştur.","s":[{"k":[["وَلِأَهَمِّيَّةِ","ve önemi sebebiyle"],["مَدِينَةِ","şehri(nin)"],["إِسْطَنْبُولَ","İstanbul"],["التَّارِيخِيَّةِ","tarihî"],["وَالسِّيَاحِيَّةِ","ve turistik"],["وَالاقْتِصَادِيَّةِ","ve ekonomik"],["اهْتَمَّتِ","önem verdi, ilgilendi"],["الحُكُومَةُ","hükûmet"],["بِهَا","ona"],["اهْتِمَامًا","bir önem verişle"],["كَبِيرًا","büyük"]],"tr":"İstanbul şehrinin tarihî, turistik ve ekonomik önemi sebebiyle hükûmet ona büyük önem vermiştir."},{"k":[["فَأَنْشَأَتْ","böylece kurdu, inşa etti"],["شَبَكَةً","bir ağ"],["مِنَ","-den"],["الطُّرُقِ","yollar"],["وَالجُسُورِ","ve köprüler"],["وَالأَنْفَاقِ","ve tüneller"],["لِتَسْهِيلِ","kolaylaştırmak için"],["حَرَكَةِ","hareketi(ni)"],["وَسَائِلِ","araçlar(ı)"],["النَّقْلِ","taşıma, ulaşım"]],"tr":"Böylece ulaşım araçlarının hareketini kolaylaştırmak için yollar, köprüler ve tünellerden oluşan bir ağ kurmuştur."}]}]},{"n":19,"ar":"مَدِينَتَانِ مُقَدَّسَتَانِ","tr":"İki Kutsal Şehir","bk":[["مَدِينَتَانِ","iki şehir"],["مُقَدَّسَتَانِ","kutsal (iki)"]],"p":[{"tr":"Mekke-i Mükerreme ve Medine-i Münevvere, Müslümanlar nezdinde iki kutsal şehirdir. Mekke-i Mükerreme İslam’ın en kutsal şehridir; Resûl Muhammed (s.a.v.) orada doğmuş, İslam’a davet de oradan başlamıştır.","s":[{"k":[["مَكَّةُ","Mekke"],["المُكَرَّمَةُ","mükerrem, şerefli kılınmış"],["وَالمَدِينَةُ","ve Medine"],["المُنَوَّرَةُ","münevver, nurlu"],["مَدِينَتَانِ","iki şehir"],["مُقَدَّسَتَانِ","kutsal (iki)"],["عِنْدَ","nezdinde, katında"],["المُسْلِمِينَ","Müslümanlar"]],"tr":"Mekke-i Mükerreme ve Medine-i Münevvere, Müslümanlar nezdinde iki kutsal şehirdir."},{"k":[["مَكَّةُ","Mekke"],["المُكَرَّمَةُ","mükerrem, şerefli kılınmış"],["هِيَ","o (dişil)"],["أَقْدَسُ","en kutsal"],["مَدِينَةٍ","bir şehir"],["فِي","-de"],["الإِسْلَامِ","İslam"]],"tr":"Mekke-i Mükerreme, İslam’ın en kutsal şehridir."},{"k":[["وُلِدَ","doğdu (doğuruldu)"],["فِيهَا","orada (onun içinde)"],["الرَّسُولُ","Resûl, peygamber"],["مُحَمَّدٌ","Muhammed"],["ﷺ","sallallâhu aleyhi ve sellem"]],"tr":"Resûl Muhammed (s.a.v.) orada doğdu,"},{"k":[["وَمِنْهَا","ve oradan"],["بَدَأَتِ","başladı"],["الدَّعْوَةُ","davet"],["إِلَى","-e"],["الإِسْلَامِ","İslam"]],"tr":"İslam’a davet de oradan başladı."}]},{"tr":"Oranın en önemli simge yapılarından biri Mescid-i Haram’dır. O, yeryüzünde insanlar için Allah’a ibadet edilsin diye kurulan ilk evdir; Müslümanlar umre ve hac farizasını yerine getirmek için oraya yönelirler. Bir diğeri Kâbe-i Muazzama’dır; o, Allah’ın Beyt-i Haram’ı ve Müslümanların kıblesidir. Küp biçiminde bir yapı olduğu için bu adla anılmıştır ve yeryüzünün en kutsal yeridir. Zemzem kuyusu ile kutsal hac mekânları olan Arafat, Müzdelife, Mina, Safâ ve Merve’nin hepsi Mekke-i Mükerreme sınırları içinde yer alır.","s":[{"k":[["مِنْ","-den"],["أَهَمِّ","en önemli"],["مَعَالِمِهَا","onun simge yapıları, önemli yerleri"],["المَسْجِدُ","mescid"],["الحَرَامُ","haram, dokunulmaz (→ Mescid-i Haram)"]],"tr":"Oranın en önemli simge yapılarından biri Mescid-i Haram’dır."},{"k":[["وَهُوَ","ve o"],["أَوَّلُ","ilk"],["بَيْتٍ","ev"],["وُضِعَ","kuruldu, konuldu"],["لِلنَّاسِ","insanlar için"],["عَلَى","üzerinde"],["الأَرْضِ","yer, yeryüzü"],["لِعِبَادَةِ","ibadet için"],["اللهِ","Allah’a (Allah’ın)"]],"tr":"O, yeryüzünde insanlar için Allah’a ibadet edilsin diye kurulan ilk evdir."},{"k":[["يَتَوَجَّهُ","yönelir"],["إِلَيْهِ","ona doğru, oraya"],["المُسْلِمُونَ","Müslümanlar"],["لِلْعُمْرَةِ","umre için"],["وَأَدَاءِ","ve yerine getirme"],["فَرِيضَةِ","farizası, farzı"],["الحَجِّ","hac"]],"tr":"Müslümanlar umre ve hac farizasını yerine getirmek için oraya yönelirler."},{"k":[["وَالكَعْبَةُ","ve Kâbe"],["المُشَرَّفَةُ","şerefli kılınmış (→ Kâbe-i Muazzama)"],["وَهِيَ","ve o"],["بَيْتُ","evi"],["اللهِ","Allah’ın"],["الحَرَامُ","haram, dokunulmaz (→ Beyt-i Haram)"],["وَقِبْلَةُ","ve kıblesi"],["المُسْلِمِينَ","Müslümanlar(ın)"]],"tr":"Bir diğeri Kâbe-i Muazzama’dır; o, Allah’ın Beyt-i Haram’ı ve Müslümanların kıblesidir."},{"k":[["سُمِّيَتْ","adlandırıldı"],["بِهَذَا","bu … ile"],["الاسْمِ","ad, isim"],["لِأَنَّهَا","çünkü o"],["بِنَاءٌ","bir yapı, bina"],["مُكَعَّبُ","küp (biçimli)"],["الشَّكْلِ","şekil, biçim"]],"tr":"Küp biçiminde bir yapı olduğu için bu adla anılmıştır."},{"k":[["وَهِيَ","ve o"],["أَقْدَسُ","en kutsal"],["مَكَانٍ","yer, mekân"],["عَلَى","üzerinde"],["وَجْهِ","yüzü"],["الأَرْضِ","yer (→ yeryüzü)"]],"tr":"O, yeryüzünün en kutsal yeridir."},{"k":[["وَبِئْرُ","ve kuyusu"],["مَاءِ","suyu"],["زَمْزَمَ","Zemzem"],["وَالمَشَاعِرُ","ve hac ibadet yerleri (meş‘arler)"],["المُقَدَّسَةُ","kutsal"],["عَرَفَاتٌ","Arafat"],["وَمُزْدَلِفَةُ","ve Müzdelife"],["وَمِنًى","ve Mina"],["وَالصَّفَا","ve Safâ"],["وَالمَرْوَةُ","ve Merve"]],"tr":"Zemzem kuyusu ile kutsal hac mekânları olan “Arafat, Müzdelife, Mina, Safâ ve Merve”,"},{"k":[["كُلُّهَا","onların hepsi"],["تَقَعُ","yer alır, bulunur"],["فِي","-de, içinde"],["حُدُودِ","sınırlar(ı)"],["مَكَّةَ","Mekke"],["المُكَرَّمَةِ","mükerrem, şerefli kılınmış"]],"tr":"bunların hepsi Mekke-i Mükerreme sınırları içinde yer alır."}]},{"tr":"Medine-i Münevvere’ye gelince, o, Peygamber Muhammed’in (s.a.v.) hicret ettiği ve Mescid-i Şerif’ini inşa ettiği mübarek şehirdir. Medine’de “Bakî‘” denilen bir yer vardır; Uhud Gazvesi şehitlerinin, Peygamber Muhammed’in (s.a.v.) hanımlarının, kızlarının ve sahâbe ile tâbiînden pek çok kişinin kabirleri oradadır; Allah hepsine rahmet eylesin. Peygamber Muhammed (s.a.v.) Medine’de vefat etmiş ve kendi mübarek odasına defnedilmiştir.","s":[{"k":[["أَمَّا","-e gelince"],["المَدِينَةُ","Medine"],["المُنَوَّرَةُ","münevver, nurlu"],["فَهِيَ","ise o"],["المَدِينَةُ","şehir"],["المُبَارَكَةُ","mübarek"],["الَّتِي","ki o"],["هَاجَرَ","hicret etti"],["إِلَيْهَا","ona, oraya"],["النَّبِيُّ","Peygamber"],["مُحَمَّدٌ","Muhammed"],["ﷺ","sallallâhu aleyhi ve sellem"],["وَبَنَى","ve inşa etti"],["فِيهَا","orada"],["مَسْجِدَهُ","onun mescidini"],["الشَّرِيفَ","şerefli (→ Mescid-i Şerif)"]],"tr":"Medine-i Münevvere’ye gelince, o, Peygamber Muhammed’in (s.a.v.) hicret ettiği ve Mescid-i Şerif’ini inşa ettiği mübarek şehirdir."},{"k":[["وَفِي","ve -de"],["المَدِينَةِ","Medine"],["بُقْعَةٌ","bir yer, bölge"],["يُقَالُ","denilir"],["لَهَا","ona"],["البَقِيعُ","Bakî‘ (Medine mezarlığı)"]],"tr":"Medine’de “Bakî‘” denilen bir yer vardır."},{"k":[["وَفِيهَا","ve orada"],["قُبُورُ","kabirleri"],["شُهَدَاءِ","şehitler(i)"],["غَزْوَةِ","gazvesi, savaşı"],["أُحُدٍ","Uhud"],["وَزَوْجَاتِ","ve hanımları"],["النَّبِيِّ","Peygamber’in"],["مُحَمَّدٍ","Muhammed"],["ﷺ","sallallâhu aleyhi ve sellem"],["وَبَنَاتِهِ","ve onun kızları"],["وَكَثِيرٍ","ve birçoğu"],["مِنَ","-den"],["الصَّحَابَةِ","sahâbe"],["وَالتَّابِعِينَ","ve tâbiîn"],["رَحِمَهُمُ","onlara rahmet etsin"],["اللهُ","Allah"],["جَمِيعًا","hepsine, topluca"]],"tr":"Uhud Gazvesi şehitlerinin, Peygamber Muhammed’in (s.a.v.) hanımlarının, kızlarının ve sahâbe ile tâbiînden pek çok kişinin kabirleri oradadır; Allah hepsine rahmet eylesin."},{"k":[["وَفِي","ve -de"],["المَدِينَةِ","Medine"],["تُوُفِّيَ","vefat etti"],["النَّبِيُّ","Peygamber"],["مُحَمَّدٌ","Muhammed"],["ﷺ","sallallâhu aleyhi ve sellem"],["وَدُفِنَ","ve defnedildi"],["فِي","-de, içine"],["حُجْرَتِهِ","onun odası"],["الكَرِيمَةِ","değerli, mübarek"]],"tr":"Peygamber Muhammed (s.a.v.) Medine’de vefat etti ve kendi mübarek odasına defnedildi."}]},{"tr":"Resûlullah (s.a.v.), kendisi ve ilk Müslümanlar Mekke müşriklerinden şiddetli eziyet gördüklerinde Medine-i Münevvere’ye hicret etti. Peygamber Muhammed (s.a.v.) Medine’ye girdiğinde şehrin halkı onu şu meşhur beyitlerle karşıladı:","s":[{"k":[["هَاجَرَ","hicret etti"],["الرَّسُولُ","Resûl, peygamber"],["ﷺ","sallallâhu aleyhi ve sellem"],["إِلَى","-e"],["المَدِينَةِ","Medine"],["المُنَوَّرَةِ","münevver, nurlu"],["عِنْدَمَا","-dığı zaman"],["لَقِيَ","karşılaştı, gördü"],["هُوَ","o, kendisi"],["وَالمُسْلِمُونَ","ve Müslümanlar"],["الأَوَائِلُ","ilkler, ilk (Müslümanlar)"],["العَذَابَ","azap, eziyet"],["الشَّدِيدَ","şiddetli"],["مِنْ","-den"],["مُشْرِكِي","müşrikleri"],["مَكَّةَ","Mekke"]],"tr":"Resûlullah (s.a.v.), kendisi ve ilk Müslümanlar Mekke müşriklerinden şiddetli eziyet gördüklerinde Medine-i Münevvere’ye hicret etti."},{"k":[["وَعِنْدَمَا","ve -dığı zaman"],["دَخَلَ","girdi"],["النَّبِيُّ","Peygamber"],["مُحَمَّدٌ","Muhammed"],["ﷺ","sallallâhu aleyhi ve sellem"],["المَدِينَةَ","Medine’ye"],["اسْتَقْبَلَهُ","onu karşıladı"],["أَهْلُهَا","onun (şehrin) halkı"],["بِالأَبْيَاتِ","beyitlerle"],["الشِّعْرِيَّةِ","şiir (beyitleri)"],["المَشْهُورَةِ","meşhur"]],"tr":"Peygamber Muhammed (s.a.v.) Medine’ye girdiğinde, şehrin halkı onu şu meşhur beyitlerle karşıladı:"}]},{"tr":"Vedâ tepelerinden üzerimize dolunay doğdu.","s":[{"k":[["طَلَعَ","doğdu"],["البَدْرُ","dolunay"],["عَلَيْنَا","üzerimize"],["مِنْ","-den"],["ثَنِيَّاتِ","tepeler, dağ yolları"],["الوَدَاعِ","veda (→ Seniyyetü’l-Vedâ, Vedâ tepeleri)"]],"tr":"Vedâ tepelerinden üzerimize dolunay doğdu."}]},{"tr":"Allah’a çağıran bir davetçi bulundukça şükretmek bize vacip oldu.","s":[{"k":[["وَجَبَ","vacip oldu, gerekli oldu"],["الشُّكْرُ","şükür"],["عَلَيْنَا","üzerimize, bize"],["مَا","-dıkça, sürece"],["دَعَا","çağırdı, dua etti"],["لِلَّهِ","Allah’a"],["دَاعِ","çağıran, davetçi"]],"tr":"Allah’a çağıran bir davetçi bulundukça şükretmek bize vacip oldu."}]},{"tr":"Ey aramızdan gönderilen elçi! Sen itaat edilen bir emirle geldin.","s":[{"k":[["أَيُّهَا","ey!"],["المَبْعُوثُ","gönderilen (elçi)"],["فِينَا","içimizde, aramızda"],["جِئْتَ","geldin"],["بِالأَمْرِ","emirle (emri getirdin)"],["المُطَاعِ","itaat edilen"]],"tr":"Ey aramızdan gönderilen elçi! Sen itaat edilen bir emirle geldin."}]},{"tr":"Geldin, Medine’yi şereflendirdin; hoş geldin, ey davetçilerin en hayırlısı!","s":[{"k":[["جِئْتَ","geldin"],["شَرَّفْتَ","şereflendirdin"],["المَدِينَةَ","Medine’yi"],["مَرْحَبًا","merhaba, hoş geldin"],["يَا","ey!"],["خَيْرَ","en hayırlısı"],["دَاعِ","davetçi (çağıran)"]],"tr":"Geldin, Medine’yi şereflendirdin; hoş geldin, ey davetçilerin en hayırlısı!"}]},{"tr":"O zamandan itibaren Medine-i Münevvere, Peygamber Muhammed’in (s.a.v.), sonra da halifeleri Ebû Bekir, Ömer, Osman ve Ali’nin (Allah hepsinden razı olsun) hayatı boyunca İslam devletinin başkenti oldu. Medine’ye hicretten önce “Yesrib” denirdi; sonra bugünkü adıyla anılmaya başlandı.","s":[{"k":[["وَمُنْذُ","ve -den beri, itibaren"],["ذَلِكَ","o"],["الوَقْتِ","vakit, zaman"],["أَصْبَحَتِ","oldu, hâline geldi"],["المَدِينَةُ","Medine"],["المُنَوَّرَةُ","münevver, nurlu"],["عَاصِمَةً","başkent"],["لِلدَّوْلَةِ","devlet için (devletin)"],["الإِسْلَامِيَّةِ","İslâmî (→ İslam devleti)"],["طَوَالَ","boyunca"],["حَيَاةِ","hayatı"],["النَّبِيِّ","Peygamber’in"],["مُحَمَّدٍ","Muhammed"],["ﷺ","sallallâhu aleyhi ve sellem"]],"tr":"O zamandan itibaren Medine-i Münevvere, Peygamber Muhammed’in (s.a.v.) hayatı boyunca İslam devletinin başkenti oldu;"},{"k":[["ثُمَّ","sonra"],["خُلَفَائِهِ","onun halifeleri"],["أَبِي","Ebû (babası) → Ebû Bekir"],["بَكْرٍ","Bekir"],["وَعُمَرَ","ve Ömer"],["وَعُثْمَانَ","ve Osman"],["وَعَلِيٍّ","ve Ali"],["رَضِيَ","razı oldu (olsun)"],["اللهُ","Allah"],["عَنْهُمْ","onlardan"],["أَجْمَعِينَ","hepsi, tamamı"]],"tr":"sonra da halifeleri “Ebû Bekir, Ömer, Osman ve Ali”nin (hayatı boyunca); Allah onların hepsinden razı olsun."},{"k":[["وَكَانَتِ","ve idi"],["المَدِينَةُ","Medine"],["قَبْلَ","önce"],["الهِجْرَةِ","hicret"],["تُسَمَّى","adlandırılır (→ denirdi)"],["يَثْرِبَ","Yesrib"]],"tr":"Medine’ye hicretten önce “Yesrib” denirdi,"},{"k":[["ثُمَّ","sonra"],["سُمِّيَتْ","adlandırıldı"],["بِاسْمِهَا","onun adıyla"],["الحَالِيِّ","şimdiki, bugünkü"]],"tr":"sonra bugünkü adıyla adlandırıldı."}]}]},{"n":20,"ar":"بَيْنَ الرِّيفِ وَالمَدِينَةِ","tr":"Köy ile Şehir Arasında","bk":[["بَيْنَ","arasında"],["الرِّيفِ","kır, köy (kırsal)"],["وَالمَدِينَةِ","ve şehir"]],"p":[{"tr":"Ömer şehri ve orada bulunan hizmetleri duydu; bunun üzerine oraya gitmeye ve orada iş aramaya karar verdi. Sabah erkenden şehre doğru yola çıktı ve akşam vakti oraya vardı. İlk gecesini şehir merkezindeki eski bir mahallede geçirdi. Ertesi sabah şehrin geniş caddelerinde dolaşmak, yüksek binalarını ve dükkânlarını seyretmek, aynı zamanda da iş aramak için dışarı çıktı; fakat iş bulamadı.","s":[{"k":[["سَمِعَ","duydu, işitti"],["عُمَرُ","Ömer"],["عَنِ","hakkında"],["المَدِينَةِ","şehir"],["وَعَنِ","ve hakkında"],["الخَدَمَاتِ","hizmetler"],["المُتَوَفِّرَةِ","mevcut olan, bulunan"],["فِيهَا","orada (onun içinde)"]],"tr":"Ömer şehri ve orada bulunan hizmetleri duydu,"},{"k":[["فَقَرَّرَ","bunun üzerine karar verdi"],["السَّفَرَ","yolculuğa, gitmeye"],["إِلَيْهَا","oraya"],["وَالبَحْثَ","ve aramaya"],["عَنْ","-i (بَحَثَ عَنْ: aramak)"],["عَمَلٍ","bir iş"],["فِيهَا","orada"]],"tr":"bunun üzerine oraya yolculuk etmeye ve orada iş aramaya karar verdi."},{"k":[["وَفِي","ve -de"],["الصَّبَاحِ","sabah"],["البَاكِرِ","erken"],["انْطَلَقَ","yola çıktı"],["نَحْوَ","-e doğru"],["المَدِينَةِ","şehir"],["وَقَدْ","ve (gerçekten)"],["وَصَلَ","vardı, ulaştı"],["إِلَيْهَا","oraya"],["عِنْدَ","vaktinde, sırasında"],["المَسَاءِ","akşam"]],"tr":"Sabah erkenden şehre doğru yola çıktı ve akşam vakti oraya vardı."},{"k":[["فَقَضَى","böylece geçirdi"],["لَيْلَتَهُ","onun gecesini"],["الأُولَى","ilk"],["فِي","-de"],["حَيٍّ","bir mahalle"],["قَدِيمٍ","eski"],["فِي","-de"],["مَرْكَزِ","merkezi"],["المَدِينَةِ","şehir(in)"]],"tr":"İlk gecesini şehir merkezindeki eski bir mahallede geçirdi."},{"k":[["وَفِي","ve -de"],["صَبَاحِ","sabahı"],["اليَوْمِ","gün(ün)"],["التَّالِي","sonraki, ertesi"],["خَرَجَ","çıktı"],["لِيَتَجَوَّلَ","dolaşmak için"],["فِي","-de"],["شَوَارِعِهَا","onun caddeleri"],["الوَاسِعَةِ","geniş"]],"tr":"Ertesi günün sabahında şehrin geniş caddelerinde dolaşmak,"},{"k":[["وَيُشَاهِدَ","ve seyretmek (için)"],["أَبْنِيَتَهَا","onun binalarını"],["العَالِيَةَ","yüksek"],["وَمَحَلَّاتِهَا","ve onun dükkânlarını"],["التِّجَارِيَّةَ","ticarî"]],"tr":"yüksek binalarını ve ticarî dükkânlarını seyretmek"},{"k":[["وَيَبْحَثَ","ve aramak (için)"],["عَنْ","-i (بَحَثَ عَنْ: aramak)"],["عَمَلٍ","bir iş"],["فِي","-de"],["الوَقْتِ","vakit, zaman"],["نَفْسِهِ","kendisi, aynı (→ aynı zamanda)"],["لَكِنَّهُ","fakat o"],["لَمْ","-medi (olumsuzluk)"],["يَجِدْ","bulur (→ bulamadı)"]],"tr":"ve aynı zamanda iş aramak için dışarı çıktı; fakat bulamadı."}]},{"tr":"Günden güne kaygı ve üzüntü duymaya başladı, uyuyamaz hâle geldi. Gürültü, yoğun duman, kalabalık ve araba gürültüsü yüzünden sıkıntı duymaya başladı.","s":[{"k":[["وَيَوْمًا","ve bir gün"],["بَعْدَ","sonra"],["يَوْمٍ","bir gün (→ günden güne)"],["بَدَأَ","başladı"],["يَشْعُرُ","hisseder (→ hissetmeye)"],["بِالقَلَقِ","kaygıyı, endişeyi"],["وَالحُزْنِ","ve üzüntü(yü)"]],"tr":"Günden güne kaygı ve üzüntü duymaya başladı,"},{"k":[["وَأَصْبَحَ","ve oldu, hâle geldi"],["لَا","değil, -mez"],["يَسْتَطِيعُ","gücü yeter (→ -emez)"],["النَّوْمَ","uyumaya"]],"tr":"uyuyamaz hâle geldi,"},{"k":[["وَبَدَأَ","ve başladı"],["يَشْعُرُ","hisseder (→ hissetmeye)"],["بِالضِّيقِ","sıkıntıyı, darlığı"],["بِسَبَبِ","sebebiyle, yüzünden"],["الضَّوْضَاءِ","gürültü"],["وَالدُّخَانِ","ve duman"],["الكَثِيرِ","çok, yoğun"],["وَالازْدِحَامِ","ve kalabalık, izdiham"],["وَضَجِيجِ","ve gürültüsü, patırtısı"],["السَّيَّارَاتِ","arabalar(ın)"]],"tr":"ve gürültü, yoğun duman, kalabalık ve araba gürültüsü yüzünden sıkıntı duymaya başladı."}]},{"tr":"Ömer ailesine, sakin köyüne, köyünün temiz ve hoş havasına ve güzel manzaralarına dönmeyi düşünmeye başladı; sonunda dönmeye karar verdi. Ailesi Ömer’in dönüşüne sevindi. Köy halkı da ona “Geçmiş olsun, sağ salim döndüğün için Allah’a hamdolsun” demek için geldi ve ona köyü ile şehir arasındaki farkı sordular. O da onlara şöyle dedi:","s":[{"k":[["بَدَأَ","başladı"],["عُمَرُ","Ömer"],["يُفَكِّرُ","düşünür (→ düşünmeye)"],["فِي","-i, hakkında"],["العَوْدَةِ","dönüş, dönmek"],["إِلَى","-e"],["أُسْرَتِهِ","onun ailesi"],["وَإِلَى","ve -e"],["قَرْيَتِهِ","onun köyü"],["الهَادِئَةِ","sakin"],["وَهَوَائِهَا","ve onun (köyün) havası"],["العَلِيلِ","hafif ve hoş (hava), serin"],["وَمَنَاظِرِهَا","ve onun manzaraları"],["الجَمِيلَةِ","güzel"],["فَقَرَّرَ","bunun üzerine karar verdi"],["العَوْدَةَ","dönmeye"]],"tr":"Ömer ailesine, sakin köyüne, köyünün temiz ve hoş havasına ve güzel manzaralarına dönmeyi düşünmeye başladı; sonunda dönmeye karar verdi."},{"k":[["فَرِحَتِ","sevindi"],["العَائِلَةُ","aile"],["بِعَوْدَةِ","dönüşüne"],["عُمَرَ","Ömer(’in)"]],"tr":"Aile, Ömer’in dönüşüne sevindi,"},{"k":[["وَحَضَرَ","ve geldi, hazır bulundu"],["أَهْلُ","halkı"],["القَرْيَةِ","köy(ün)"],["لِيَقُولُوا","desinler diye, demek için"],["لَهُ","ona"],["الحَمْدُ","hamd, övgü"],["لِلَّهِ","Allah’a (aittir)"],["عَلَى","üzerine, için"],["السَّلَامَةِ","selâmet, sağ salim olma"]],"tr":"köy halkı da ona “Sağ salim döndüğün için Allah’a hamdolsun (geçmiş olsun)” demek için geldi"},{"k":[["وَسَأَلُوهُ","ve ona sordular"],["عَنِ","-i, hakkında"],["الفَرْقِ","fark"],["بَيْنَ","arasında"],["قَرْيَتِهِ","onun köyü"],["وَالمَدِينَةِ","ve şehir"],["فَقَالَ","bunun üzerine dedi"],["لَهُمْ","onlara"]],"tr":"ve ona köyü ile şehir arasındaki farkı sordular; o da onlara şöyle dedi:"}]},{"tr":"“Şehir, insanların hayatı ve işleri bakımından köyden farklıdır. Köy sakinleri bazı el sanatlarının yanı sıra çoğunlukla tarım, hayvancılık ve balıkçılıkla uğraşır; şehir sakinleri ise ticaret, sanayi, hizmet ve eğitim sektörlerinde çalışır. Köydeki ve şehirdeki bu işler insanların hayatını etkiler. Mesela köydeki sosyal bağlar, şehir halkı arasındaki sosyal ilişkilere kıyasla güçlüdür; şehir halkı arasındaki ilişkiler ise hayatın zorluğu, pahalılık, çalışma saatlerinin uzunluğu ve benzeri sebeplerle zayıftır. Havaya gelince, şehrin havası kirli, köyün havası temizdir.","s":[{"k":[["المَدِينَةُ","şehir"],["تَخْتَلِفُ","farklıdır, ayrılır"],["عَنِ","-den"],["القَرْيَةِ","köy"],["فِي","-de, bakımından"],["حَيَاةِ","hayatı"],["النَّاسِ","insanlar(ın)"],["وَأَعْمَالِهِمْ","ve onların işleri"]],"tr":"“Şehir, insanların hayatı ve işleri bakımından köyden farklıdır."},{"k":[["فَسُكَّانُ","zira sakinleri"],["القَرْيَةِ","köy(ün)"],["يَعْمَلُونَ","çalışırlar"],["بِالزِّرَاعَةِ","tarımla"],["وَالرَّعْيِ","ve çobanlık, hayvan otlatma"],["وَصَيْدِ","ve avı, avcılığı"],["السَّمَكِ","balık (→ balıkçılık)"],["غَالِبًا","çoğunlukla"],["بِالإِضَافَةِ","ek olarak (ilaveten)"],["إِلَى","-e"],["بَعْضِ","bazı"],["الحِرَفِ","meslekler, zanaatlar"],["اليَدَوِيَّةِ","el ile ilgili (→ el sanatları)"]],"tr":"Köy sakinleri, bazı el sanatlarının yanı sıra çoğunlukla tarım, hayvancılık ve balıkçılıkla uğraşır;"},{"k":[["أَمَّا","-e gelince"],["سُكَّانُ","sakinleri"],["المَدِينَةِ","şehir(in)"],["فَيَعْمَلُونَ","ise çalışırlar"],["فِي","-de"],["التِّجَارَةِ","ticaret"],["وَالصِّنَاعَةِ","ve sanayi"],["وَقِطَاعَيِ","ve iki sektörü"],["الخَدَمَاتِ","hizmetler"],["وَالتَّعْلِيمِ","ve eğitim"]],"tr":"şehir sakinleri ise ticaret, sanayi ile hizmet ve eğitim sektörlerinde çalışır."},{"k":[["وَهَذِهِ","ve bu"],["الأَعْمَالُ","işler"],["فِي","-de"],["القَرْيَةِ","köy"],["وَالمَدِينَةِ","ve şehir"],["تُؤَثِّرُ","etkiler"],["فِي","-de (أَثَّرَ فِي: -i etkilemek)"],["حَيَاةِ","hayatı"],["النَّاسِ","insanlar(ın)"]],"tr":"Köydeki ve şehirdeki bu işler insanların hayatını etkiler."},{"k":[["فَمَثَلًا","mesela, örneğin"],["الرَّوَابِطُ","bağlar"],["الاجْتِمَاعِيَّةُ","sosyal"],["فِي","-de"],["القَرْيَةِ","köy"],["قَوِيَّةٌ","güçlü"],["مُقَارَنَةً","kıyasla, karşılaştırıldığında"],["بِالعَلَاقَاتِ","ilişkilerle (→ ilişkilere)"],["الاجْتِمَاعِيَّةِ","sosyal"],["بَيْنَ","arasında"],["أَهْلِ","halkı"],["المَدِينَةِ","şehir(in)"]],"tr":"Mesela köydeki sosyal bağlar, şehir halkı arasındaki sosyal ilişkilere kıyasla güçlüdür;"},{"k":[["فَالعَلَاقَاتُ","zira ilişkiler"],["بَيْنَ","arasında"],["أَهْلِ","halkı"],["المَدِينَةِ","şehir(in)"],["ضَعِيفَةٌ","zayıf"],["بِسَبَبِ","sebebiyle, yüzünden"],["صُعُوبَةِ","zorluğu"],["الحَيَاةِ","hayat(ın)"],["وَالغَلَاءِ","ve pahalılık"],["وَطُولِ","ve uzunluğu"],["أَوْقَاتِ","vakitleri, saatleri"],["العَمَلِ","iş, çalışma"],["وَغَيْرِهَا","ve bunların dışındakiler (ve benzeri)"]],"tr":"şehir halkı arasındaki ilişkiler ise hayatın zorluğu, pahalılık, çalışma saatlerinin uzunluğu ve benzeri sebeplerle zayıftır."},{"k":[["وَبِالنِّسْبَةِ","ve -e nispetle, gelince"],["لِلْجَوِّ","hava için (→ havaya)"],["فَالمَدِينَةُ","şehir ise"],["جَوُّهَا","onun havası"],["مُلَوَّثٌ","kirli"],["وَالقَرْيَةُ","ve köy"],["جَوُّهَا","onun havası"],["نَظِيفٌ","temiz"]],"tr":"Havaya gelince; şehrin havası kirli, köyün havası temizdir."}]},{"tr":"Son olarak, şehrin de köyün de olumlu ve olumsuz yanları vardır. Bu mesele kişinin kendisine ve yaşamayı sevdiği hayat tarzına bağlıdır.”","s":[{"k":[["وَأَخِيرًا","ve son olarak"],["لِكُلٍّ","her biri için (her birinin vardır)"],["مِنَ","-den"],["المَدِينَةِ","şehir"],["وَالقَرْيَةِ","ve köy"],["إِيجَابِيَّاتٌ","olumlu yanlar"],["وَسَلْبِيَّاتٌ","ve olumsuz yanlar"]],"tr":"Son olarak, şehrin de köyün de olumlu ve olumsuz yanları vardır;"},{"k":[["وَهَذَا","ve bu"],["الأَمْرُ","iş, mesele"],["يَعُودُ","döner (يَعُودُ إِلَى: -e bağlıdır)"],["إِلَى","-e"],["الشَّخْصِ","kişi, şahıs"],["نَفْسِهِ","kendisi"],["وَإِلَى","ve -e"],["طَبِيعَةِ","tabiatı, niteliği (tarzı)"],["الحَيَاةِ","hayat(ın)"],["الَّتِي","ki o"],["يُحِبُّ","sever, ister"],["أَنْ","-mesi, -mek"],["يَعِيشَهَا","onu yaşaması (→ yaşamayı)"]],"tr":"bu mesele kişinin kendisine ve yaşamayı sevdiği hayat tarzına bağlıdır.”"}]}]},{"n":21,"ar":"العَادَاتُ الرَّمَضَانِيَّةُ","tr":"Ramazan Âdetleri","bk":[["العَادَاتُ","âdetler, gelenekler"],["الرَّمَضَانِيَّةُ","Ramazan’a ait"]],"p":[{"tr":"Oruç, İslam’ın şartlarından biridir; Ramazan da Kur’an-ı Kerim’in indirildiği aydır. Allah Teâlâ şöyle buyurmuştur: “Ramazan ayı, insanlara yol gösterici, doğrunun ve doğruyu eğriden ayırmanın açık delilleri olarak Kur’an’ın indirildiği aydır. Öyle ise sizden kim bu aya ulaşırsa onu oruçla geçirsin. Kim de hasta veya yolculukta olursa, tutamadığı günler sayısınca başka günlerde tutsun. Allah sizin için kolaylık ister, sizin için zorluk istemez…” (Bakara: 185). O; rahmet, mağfiret ve tövbe ayıdır. Bu yüzden Müslümanlar onu her yıl sabırsızlıkla bekler; onun Müslümanların kalbinde özel bir yeri vardır.","s":[{"k":[["الصِّيَامُ","oruç"],["رُكْنٌ","bir rükün, bir şart"],["مِنْ","-den"],["أَرْكَانِ","rükünler(i), şartlar(ı)"],["الإِسْلَامِ","İslam"]],"tr":"Oruç, İslam’ın şartlarından (rükünlerinden) biridir."},{"k":[["وَرَمَضَانُ","ve Ramazan"],["هُوَ","o"],["الشَّهْرُ","ay"],["الَّذِي","ki o"],["أُنْزِلَ","indirildi"],["فِيهِ","onda, onun içinde"],["القُرْآنُ","Kur’an"],["الكَرِيمُ","Kerîm (değerli)"]],"tr":"Ramazan da Kur’an-ı Kerim’in indirildiği aydır."},{"k":[["قَالَ","dedi, buyurdu"],["تَعَالَى","yüce oldu (→ Allah Teâlâ)"],["شَهْرُ","ayı"],["رَمَضَانَ","Ramazan"],["الَّذِي","ki o"],["أُنْزِلَ","indirildi"],["فِيهِ","onda"],["الْقُرْآنُ","Kur’an"],["هُدًى","hidayet, yol gösterici olarak"],["لِلنَّاسِ","insanlar için"],["وَبَيِّنَاتٍ","ve açık deliller olarak"],["مِنَ","-den"],["الْهُدَى","hidayet, doğru yol"],["وَالْفُرْقَانِ","ve Furkân (hakkı bâtıldan ayıran)"]],"tr":"Allah Teâlâ şöyle buyurmuştur: “Ramazan ayı, insanlara yol gösterici, doğrunun ve doğruyu eğriden ayırmanın açık delilleri olarak Kur’an’ın indirildiği aydır."},{"k":[["فَمَنْ","öyleyse kim"],["شَهِدَ","şahit oldu (→ ulaşırsa)"],["مِنْكُمُ","sizden"],["الشَّهْرَ","aya"],["فَلْيَصُمْهُ","onu oruçla geçirsin"]],"tr":"Öyle ise sizden kim bu aya ulaşırsa onu oruçla geçirsin."},{"k":[["وَمَنْ","ve kim"],["كَانَ","oldu (→ olursa)"],["مَرِيضًا","hasta"],["أَوْ","veya"],["عَلَى","üzerinde"],["سَفَرٍ","yolculuk (→ yolculukta)"],["فَعِدَّةٌ","o hâlde (belli) bir sayı"],["مِنْ","-den"],["أَيَّامٍ","günler"],["أُخَرَ","başka"]],"tr":"Kim de hasta veya yolculukta olursa, tutamadığı günler sayısınca başka günlerde tutsun."},{"k":[["يُرِيدُ","ister"],["اللَّهُ","Allah"],["بِكُمُ","sizin için"],["الْيُسْرَ","kolaylığı"],["وَلَا","ve … değil (olumsuzluk)"],["يُرِيدُ","ister (→ istemez)"],["بِكُمُ","sizin için"],["الْعُسْرَ","zorluğu"],["البقرة","Bakara (sûresi)"],["١٨٥","185"]],"tr":"Allah sizin için kolaylık ister, sizin için zorluk istemez…” (Bakara: 185)."},{"k":[["وَهُوَ","ve o"],["شَهْرُ","ayı"],["الرَّحْمَةِ","rahmet"],["وَالمَغْفِرَةِ","ve mağfiret (bağışlanma)"],["وَالتَّوْبَةِ","ve tövbe"]],"tr":"O; rahmet, mağfiret ve tövbe ayıdır."},{"k":[["لِذَلِكَ","bu yüzden"],["يَنْتَظِرُهُ","onu bekler"],["المُسْلِمُونَ","Müslümanlar"],["كُلَّ","her"],["سَنَةٍ","yıl"],["بِفَارِغِ","boş, tükenmiş … ile"],["الصَّبْرِ","sabır (→ sabırsızlıkla)"]],"tr":"Bu yüzden Müslümanlar onu her yıl sabırsızlıkla bekler."},{"k":[["وَلَهُ","ve onun vardır"],["مَكَانَةٌ","bir yer, bir konum"],["خَاصَّةٌ","özel"],["فِي","-de"],["قُلُوبِ","kalpleri"],["المُسْلِمِينَ","Müslümanlar(ın)"]],"tr":"Onun, Müslümanların kalbinde özel bir yeri vardır."}]},{"tr":"Bu mübarek ayda yemekler çeşitlenir, bütün şehirlerde binalar ve cami minareleri kandillerle süslenir, sokaklar insanlarla ve arabalarla dolup taşar, dükkânlar ve çarşılar kapılarını gecenin geç saatlerine kadar açık tutar. Ramazan ayında aile ziyaretleri, akraba ziyareti (sıla-i rahim) ve komşularla karşılıklı ziyaretler ile yemek alışverişi çoğalır; herkes bir diğerini sofrasında iftar etmesi için misafir eder.","s":[{"k":[["فِي","-de"],["هَذَا","bu"],["الشَّهْرِ","ay"],["المُبَارَكِ","mübarek"],["تَتَنَوَّعُ","çeşitlenir"],["الأَطْعِمَةُ","yemekler"]],"tr":"Bu mübarek ayda yemekler çeşitlenir."},{"k":[["وَتَتَزَيَّنُ","ve süslenir"],["المَبَانِي","binalar"],["وَمَآذِنُ","ve minareleri"],["الجَوَامِعِ","camiler(in)"],["فِي","-de"],["كُلِّ","bütün"],["المُدُنِ","şehirler"],["بِالمَصَابِيحِ","kandillerle, lambalarla"]],"tr":"Bütün şehirlerde binalar ve cami minareleri kandillerle süslenir."},{"k":[["وَتَزْدَحِمُ","ve kalabalıklaşır"],["الشَّوَارِعُ","sokaklar, caddeler"],["بِالنَّاسِ","insanlarla"],["وَالسَّيَّارَاتِ","ve arabalar"]],"tr":"Sokaklar insanlarla ve arabalarla dolup taşar."},{"k":[["وَتَفْتَحُ","ve açar"],["المَحَلَّاتُ","dükkânlar"],["التِّجَارِيَّةُ","ticarî (→ iş yerleri)"],["وَالأَسْوَاقُ","ve çarşılar"],["أَبْوَابَهَا","kapılarını"],["إِلَى","-e kadar"],["سَاعَاتٍ","saatler"],["مُتَأَخِّرَةٍ","geç"],["مِنَ","-den"],["اللَّيْلِ","gece"]],"tr":"Dükkânlar ve çarşılar kapılarını gecenin geç saatlerine kadar açık tutar."},{"k":[["وَفِي","ve -de"],["شَهْرِ","ayı"],["رَمَضَانَ","Ramazan"],["تَكْثُرُ","çoğalır"],["الزِّيَارَاتُ","ziyaretler"],["العَائِلِيَّةُ","ailevî (aile)"],["وَصِلَةُ","ve bağ(ı), ilişki(si)"],["الأَرْحَامِ","akrabalar (→ sıla-i rahim)"],["وَتَبَادُلُ","ve karşılıklı alıp verme"],["الزِّيَارَاتِ","ziyaretler"],["وَالمَأْكُولَاتِ","ve yiyecekler"],["مَعَ","ile"],["الجِيرَانِ","komşular"]],"tr":"Ramazan ayında aile ziyaretleri, akraba ziyareti (sıla-i rahim) ve komşularla karşılıklı ziyaretler ile yemek alışverişi çoğalır."},{"k":[["وَيَسْتَضِيفُ","ve misafir eder"],["كُلٌّ","her biri"],["مِنْهُمُ","onlardan"],["الآخَرَ","diğerini"],["لِتَنَاوُلِ","yemek için (→ iftar etmek için)"],["الإِفْطَارِ","iftar"],["عَلَى","üzerinde (-de)"],["مَائِدَتِهِ","onun sofrası"]],"tr":"Onlardan her biri diğerini, sofrasında iftar etmesi için misafir eder."}]},{"tr":"İslam şehirlerinin, atalarından miras aldıkları birbirine benzer Ramazan âdetleri ve gelenekleri vardır. Bu âdetlerden bazıları şunlardır: Sahur topuyla uyanmak ve yine topla iftar etmek; oruçluları sahur yemeğini yesinler diye uyandırmak için mahallelerde dolaşan sahur davulcusu. Bunlara ek olarak bu faziletli aya özgü tatlılar ve içecekler de vardır.","s":[{"k":[["وَلِلْمُدُنِ","ve şehirlerin vardır"],["الإِسْلَامِيَّةِ","İslâmî (İslam)"],["عَادَاتٌ","âdetler"],["وَتَقَالِيدُ","ve gelenekler"],["رَمَضَانِيَّةٌ","Ramazan’a ait"],["مُتَشَابِهَةٌ","birbirine benzer"],["وَرِثُوهَا","onu miras aldılar"],["عَنْ","-den"],["أَجْدَادِهِمْ","onların ataları, dedeleri"]],"tr":"İslam şehirlerinin, atalarından miras aldıkları birbirine benzer Ramazan âdetleri ve gelenekleri vardır."},{"k":[["وَمِنْ","ve -den"],["هَذِهِ","bu"],["العَادَاتِ","âdetler"],["الاسْتِيقَاظُ","uyanmak"],["عَلَى","üzerine (→ … ile)"],["مِدْفَعِ","topu"],["السَّحُورِ","sahur"],["وَالإِفْطَارُ","ve iftar etmek"],["عَلَيْهِ","onun üzerine (→ onunla)"]],"tr":"Bu âdetlerden bazıları şunlardır: Sahur topuyla uyanmak ve yine topla iftar etmek;"},{"k":[["وَالمُسَحِّرَاتِيُّ","ve sahurcu (sahur davulcusu)"],["الَّذِي","ki o"],["يَتَجَوَّلُ","dolaşır"],["فِي","-de"],["الأَحْيَاءِ","mahalleler"],["لِإِيقَاظِ","uyandırmak için"],["الصَّائِمِينَ","oruçlular(ı)"],["حَتَّى","-sinler diye"],["يَتَنَاوَلُوا","yesinler"],["طَعَامَ","yemeğini"],["السَّحُورِ","sahur"]],"tr":"oruçluları sahur yemeğini yesinler diye uyandırmak için mahallelerde dolaşan sahur davulcusu."},{"k":[["إِضَافَةً","ek olarak"],["إِلَى","-e"],["ذَلِكَ","o, bu (→ buna)"],["هُنَاكَ","vardır"],["الحَلَوِيَّاتُ","tatlılar"],["وَالمَشْرُوبَاتُ","ve içecekler"],["الخَاصَّةُ","özgü, özel"],["بِهَذَا","bu … -e"],["الشَّهْرِ","ay"],["الفَضِيلِ","faziletli"]],"tr":"Bunlara ek olarak bu faziletli aya özgü tatlılar ve içecekler de vardır."}]},{"tr":"Mübarek ayın son günlerinde Müslümanlar bayramı karşılamak için giysi ve tatlı almaya başlar. Şamlıların meşhur bir sözü vardır: “Ramazan’ın ilk on günü et suyu (çorba) içindir”, yani yemek öğünlerini hazırlamak içindir; “ortadaki on gün bezler (kumaşlar) içindir”, yani bayramlık elbise almak içindir; “son on gün ise kâğıda sarmak içindir”, yani bayram tatlısını hazırlamak içindir.","s":[{"k":[["وَفِي","ve -de"],["الأَيَّامِ","günler"],["الأَخِيرَةِ","son"],["مِنَ","-den"],["الشَّهْرِ","ay"],["المُبَارَكِ","mübarek"],["يَبْدَأُ","başlar"],["المُسْلِمُونَ","Müslümanlar"],["بِشِرَاءِ","satın almaya"],["المَلَابِسِ","giysiler"],["وَالحَلَوِيَّاتِ","ve tatlılar"],["لِاسْتِقْبَالِ","karşılamak için"],["العِيدِ","bayram(ı)"]],"tr":"Mübarek ayın son günlerinde Müslümanlar bayramı karşılamak için giysi ve tatlı almaya başlar."},{"k":[["فَهُنَاكَ","zira vardır"],["مَثَلٌ","bir atasözü, bir söz"],["مَشْهُورٌ","meşhur"],["لَدَى","yanında, nezdinde"],["أَهْلِ","halkı, ahalisi"],["دِمَشْقَ","Şam (Dımaşk)"],["يَقُولُ","der"]],"tr":"Şamlıların şöyle diyen meşhur bir sözü vardır:"},{"k":[["العَشْرُ","on (gün)"],["الأُوَلُ","ilk"],["مِنْ","-den"],["رَمَضَانَ","Ramazan"],["لِلْمَرَقِ","et suyu, çorba için"],["أَيْ","yani"],["لِتَحْضِيرِ","hazırlamak için"],["وَجَبَاتِ","öğünleri(ni)"],["الطَّعَامِ","yemek"]],"tr":"“Ramazan’ın ilk on günü et suyu (çorba) içindir”, yani yemek öğünlerini hazırlamak içindir;"},{"k":[["وَالعَشْرُ","ve on (gün)"],["الأَوْسَطُ","orta, ortadaki"],["لِلْخِرَقِ","bezler, kumaş parçaları için"],["أَيْ","yani"],["لِشِرَاءِ","satın almak için"],["ثِيَابِ","elbiseleri(ni)"],["العِيدِ","bayram"]],"tr":"“ortadaki on gün bezler (kumaşlar) içindir”, yani bayramlık elbise almak içindir;"},{"k":[["وَالعَشْرُ","ve on (gün)"],["الأَخِيرُ","son"],["لِصَرِّ","sarmak, bohçalamak için"],["الوَرَقِ","kâğıt"],["أَيْ","yani"],["لِإِعْدَادِ","hazırlamak için"],["حَلْوَى","tatlısı(nı)"],["العِيدِ","bayram"]],"tr":"“son on gün ise kâğıda sarmak içindir”, yani bayram tatlısını hazırlamak içindir."}]}]},{"n":22,"ar":"عِبَادَةُ الحَجِّ","tr":"Hac İbadeti","bk":[["عِبَادَةُ","ibadeti"],["الحَجِّ","hac"]],"p":[{"tr":"Hac, İslam’ın şartlarının beşincisidir ve “oraya gitmeye gücü yetenler için” ömürde bir defa farzdır. Çünkü Peygamber Hz. Muhammed (s.a.v.) şöyle buyurmuştur: “İslam beş şey üzerine kurulmuştur: Allah’tan başka ilâh olmadığına ve Muhammed’in Allah’ın elçisi olduğuna şahitlik etmek, namazı dosdoğru kılmak, zekâtı vermek, Ramazan orucunu tutmak ve gitmeye gücü yetenin Kâbe’yi haccetmesi.”","s":[{"k":[["الحَجُّ","hac"],["هُوَ","o"],["الرُّكْنُ","rükün, şart"],["الخَامِسُ","beşinci"],["مِنْ","-den"],["أَرْكَانِ","rükünler(i), şartlar(ı)"],["الإِسْلَامِ","İslam"]],"tr":"Hac, İslam’ın şartlarının (rükünlerinin) beşincisidir."},{"k":[["وَهُوَ","ve o"],["وَاجِبٌ","vacip, farz"],["لِمَرَّةٍ","bir defa için"],["وَاحِدَةٍ","bir, tek"],["فِي","-de"],["العُمُرِ","ömür"],["لِمَنِ","kimse için"],["اسْتَطَاعَ","gücü yetti"],["إِلَيْهِ","ona"],["سَبِيلًا","bir yol (→ yol bulmaya)"]],"tr":"O, “oraya gitmeye gücü yetenler için” ömürde bir defa farzdır."},{"k":[["لِقَوْلِ","sözünden dolayı"],["ا rik günlerini geçirmek için Mina’ya döner; sonra vedâ tavafını yapmak ve kutsal mekânlardan ayrılmak üzere bir kez daha Mekke’ye döner.","s":[{"k":[["تَبْدَأُ","başlar"],["عِبَادَةُ","ibadeti"],["الحَجِّ","hac"],["فِي","-de"],["اليَوْمِ","gün"],["الثَّامِنِ","sekizinci"],["مِنْ","-den"],["شَهْرِ","ayı"],["ذِي","sahibi (Zilhicce’nin ilk parçası)"],["الحِجَّةِ","hac (→ Zilhicce)"]],"tr":"Hac ibadeti Zilhicce ayının sekizinci günü başlar;"},{"k":[["حَيْثُ","ki orada, o sırada"],["يَقُومُ","yapar (يَقُومُ بِـ: yapmak)"],["الحَاجُّ","hacı"],["بِالإِحْرَامِ","ihrama girmeyi"],["مِنَ","-den"],["المِيقَاتِ","mîkat (ihrama girme yeri)"]],"tr":"o zaman hacı mîkatta ihrama girer,"},{"k":[["ثُمَّ","sonra"],["يَتَوَجَّهُ","yönelir"],["إِلَى","-e"],["مَكَّةَ","Mekke"],["لِيَقُومَ","yapması için"],["بِطَوَافِ","tavafını"],["القُدُومِ","kudüm (geliş)"]],"tr":"sonra kudüm tavafını yapmak için Mekke’ye yönelir,"},{"k":[["بَعْدَهَا","ondan sonra"],["يَتَّجِهُ","yönelir, gider"],["إِلَى","-e"],["مِنًى","Mina"],["ثُمَّ","sonra"],["إِلَى","-e"],["عَرَفَةَ","Arafat"],["لِلْوَقْفَةِ","vakfe için"]],"tr":"ardından Mina’ya, sonra da vakfe için Arafat’a gider."},{"k":[["بَعْدَ","sonra"],["ذَلِكَ","o, bu (→ bundan)"],["يَرْمِي","atar"],["الحَاجُّ","hacı"],["الجَمَرَاتِ","(şeytan taşlamada atılan) taşları"],["فِي","-de"],["جَمْرَةِ","cemresi"],["العَقَبَةِ","Akabe"],["الكُبْرَى","büyük"]],"tr":"Bundan sonra hacı Büyük Akabe Cemresi’nde taşları atar,"},{"k":[["ثُمَّ","sonra"],["يَعُودُ","döner"],["إِلَى","-e"],["مَكَّةَ","Mekke"],["لِيَقُومَ","yapması için"],["بِطَوَافِ","tavafını"],["الإِفَاضَةِ","ifâza (ziyaret)"]],"tr":"sonra ifâza tavafını yapmak için Mekke’ye döner,"},{"k":[["بَعْدَهَا","ondan sonra"],["يَعُودُ","döner"],["إِلَى","-e"],["مِنًى","Mina"],["لِقَضَاءِ","geçirmek için"],["أَيَّامِ","günleri(ni)"],["التَّشْرِيقِ","teşrik"]],"tr":"ardından teşrik günlerini geçirmek için Mina’ya döner,"},{"k":[["ثُمَّ","sonra"],["يَرْجِعُ","döner"],["مَرَّةً","bir kez"],["أُخْرَى","başka (→ bir kez
