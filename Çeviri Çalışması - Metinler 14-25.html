ını ulaştırmak için yüksek yerlerde ateş yakardı. Buna ek olarak, belirli bir bölgesi olan görevli bir kişi kullanılırdı. Bu görevli, mektupları başka bir bölgedeki diğer bir görevliye ulaştırırdı ve bu böylece sürüp giderdi…","s":[{"k":[["كَانَتْ","idi"],["أَوَّلُ","ilk"],["وَسِيلَةٍ","araç"],["لِلتَّوَاصُلِ","iletişim için"],["بَيْنَ","arasında"],["النَّاسِ","insanlar"],["هِيَ","o (dişil; vurgu zamiri)"],["اللُّغَةَ","dil"],["وَذَلِكَ","ve bu"],["عَنْ","-den (عَنْ طَرِيقِ: yoluyla)"],["طَرِيقِ","yol"],["الكَلَامِ","konuşma, söz"],["بِشَكْلٍ","bir şekilde"],["مُبَاشِرٍ","doğrudan"]],"tr":"İnsanlar arasındaki ilk iletişim aracı dildi; bu da doğrudan konuşma yoluyla oluyordu."},{"k":[["ثُمَّ","sonra"],["اخْتَرَعَ","icat etti"],["الإِنْسَانُ","insan"],["طُرُقًا","yollar"],["أُخْرَى","başka"],["بَسِيطَةً","basit"],["مِنْ","-den"],["هَذِهِ","bu"],["الطُّرُقِ","yollar"],["وَالوَسَائِلِ","ve araçlar"],["الحَمَامُ","güvercin"],["الزَّاجِلُ","posta (güvercini)"],["وَالدُّخَانُ","ve duman"],["وَالنَّارُ","ve ateş"]],"tr":"Sonra insan başka basit yollar icat etti; bu yol ve araçlardan bazıları şunlardır: posta güvercini, duman ve ateş."},{"k":[["فَكَانَ","nitekim … idi (-rdi)"],["الإِنْسَانُ","insan"],["يُدَرِّبُ","eğitir"],["الحَمَامَ","güvercini"],["وَيُرْسِلُ","ve gönderir"],["رِسَالَتَهُ","onun mektubunu"],["إِلَى","-e"],["الأَمَاكِنِ","yerler"],["البَعِيدَةِ","uzak"],["أَوْ","veya"],["يُشْعِلُ","yakar, tutuşturur"],["النَّارَ","ateşi"],["فِي","-de"],["الأَمَاكِنِ","yerler"],["المُرْتَفِعَةِ","yüksek"],["لِإِيصَالِ","ulaştırmak için"],["رِسَالَتِهِ","onun mesajını"]],"tr":"İnsan güvercini eğitir ve mektubunu uzak yerlere gönderirdi; ya da mesajını ulaştırmak için yüksek yerlerde ateş yakardı."},{"k":[["إِضَافَةً","ek olarak"],["إِلَى","-e"],["اسْتِخْدَامِ","kullanmak"],["شَخْصٍ","bir kişi"],["مُوَظَّفٍ","görevli, memur"],["لَهُ","onun vardır"],["مِنْطَقَةٌ","bir bölge"],["مُعَيَّنَةٌ","belirli"]],"tr":"Buna ek olarak, belirli bir bölgesi olan görevli bir kişi kullanılırdı."},{"k":[["وَهَذَا","ve bu"],["المُوَظَّفُ","görevli"],["كَانَ","idi (-rdi)"],["يَقُومُ","yapar (يَقُومُ بِـ: yapmak)"],["بِإِيصَالِ","ulaştırma (işini)"],["الرَّسَائِلِ","mektuplar(ı)"],["إِلَى","-e"],["مُوَظَّفٍ","bir görevli"],["آخَرَ","başka, diğer"],["فِي","-de"],["مِنْطَقَةٍ","bir bölge"],["أُخْرَى","başka"],["وَهَكَذَا","ve böylece"]],"tr":"Bu görevli, mektupları başka bir bölgedeki diğer bir görevliye ulaştırırdı ve bu böylece sürüp giderdi…"}]},{"tr":"İletişim araçlarının gelişimi devam etti ve Çinliler matbaayı icat etti. Matbaanın icadından sonra bilimsel uyanış çağı başladı ve iletişim araçları gittikçe daha fazla gelişmeye başladı. Böylece gazeteler ve dergiler ortaya çıktı ve haberleri daha hızlı bir şekilde aktardı; insan da bunları okuyarak pek çok haberi öğrenebildi. Sonra insan telgrafı, ondan sonra da iletişim araçlarını ileri bir aşamaya taşıyan telefonu icat etti. Sonra insan faksı icat etti; ondan sonra kablosuz iletişim araçları keşfedildi; ardından radyo, televizyon ve bilgisayar icat edildi. Son olarak insan, iletişim araçlarının gelişmesine çok büyük ölçüde yardımcı olan internet ağına ulaştı.","s":[{"k":[["اسْتَمَرَّ","devam etti"],["تَطَوُّرُ","gelişimi"],["وَسَائِلِ","araçları(nın)"],["الاتِّصَالِ","iletişim"],["فَاخْتَرَعَ","ve (böylece) icat etti"],["الصِّينِيُّونَ","Çinliler"],["الطِّبَاعَةَ","matbaayı, baskıyı"]],"tr":"İletişim araçlarının gelişimi devam etti ve Çinliler matbaayı icat etti."},{"k":[["وَبَعْدَ","ve sonra"],["اخْتِرَاعِ","icadı"],["الطِّبَاعَةِ","matbaa(nın)"],["بَدَأَ","başladı"],["عَصْرُ","çağı"],["النَّهْضَةِ","uyanış, kalkınma"],["العِلْمِيَّةِ","bilimsel"],["وَبَدَأَتْ","ve başladı"],["وَسَائِلُ","araçları"],["الاتِّصَالِ","iletişim"],["بِالتَّطَوُّرِ","gelişmeye"],["أَكْثَرَ","daha çok"],["فَأَكْثَرَ","ve daha da çok (→ gittikçe)"]],"tr":"Matbaanın icadından sonra bilimsel uyanış çağı başladı ve iletişim araçları gittikçe daha fazla gelişmeye başladı."},{"k":[["فَظَهَرَتِ","böylece ortaya çıktı"],["الصُّحُفُ","gazeteler"],["وَالمَجَلَّاتُ","ve dergiler"],["وَنَقَلَتِ","ve aktardı"],["الأَخْبَارَ","haberleri"],["بِشَكْلٍ","bir şekilde"],["أَسْرَعَ","daha hızlı"],["فَاسْتَطَاعَ","böylece -ebildi (gücü yetti)"],["الإِنْسَانُ","insan"],["مِنْ","-den"],["خِلَالِ","arası (مِنْ خِلَالِ: yoluyla)"],["قِرَاءَتِهَا","onları okuma(sı)"],["مَعْرِفَةَ","bilmeyi, öğrenmeyi"],["الكَثِيرِ","çoğu, pek çok"],["مِنَ","-den"],["الأَخْبَارِ","haberler"]],"tr":"Böylece gazeteler ve dergiler ortaya çıktı ve haberleri daha hızlı bir şekilde aktardı; insan da bunları okuyarak pek çok haberi öğrenebildi."},{"k":[["ثُمَّ","sonra"],["اخْتَرَعَ","icat etti"],["الإِنْسَانُ","insan"],["التِّلِغْرَافَ","telgrafı"],["وَبَعْدَهُ","ve ondan sonra"],["الهَاتِفَ","telefonu"],["الَّذِي","ki o"],["نَقَلَ","taşıdı, aktardı"],["وَسَائِلَ","araçları(nı)"],["الاتِّصَالِ","iletişim"],["إِلَى","-e"],["مَرْحَلَةٍ","bir aşama"],["مُتَطَوِّرَةٍ","gelişmiş, ileri"]],"tr":"Sonra insan telgrafı, ondan sonra da iletişim araçlarını ileri bir aşamaya taşıyan telefonu icat etti."},{"k":[["ثُمَّ","sonra"],["ابْتَكَرَ","icat etti, geliştirdi"],["الإِنْسَانُ","insan"],["الفَاكْسَ","faksı"],["وَبَعْدَهُ","ve ondan sonra"],["اكْتُشِفَتْ","keşfedildi"],["وَسَائِلُ","araçları"],["الاتِّصَالَاتِ","iletişimler, haberleşme"],["اللَّاسِلْكِيَّةِ","kablosuz, telsiz"],["ثُمَّ","sonra"],["اخْتُرِعَتِ","icat edildi"],["الإِذَاعَةُ","radyo (yayın)"],["وَالتِّلِفِزْيُونُ","ve televizyon"],["وَالحَاسِبُ","ve hesaplayıcı (→ bilgisayar)"],["الآلِيُّ","otomatik (→ bilgisayar)"]],"tr":"Sonra insan faksı icat etti; ondan sonra kablosuz iletişim araçları keşfedildi; ardından radyo, televizyon ve bilgisayar icat edildi."},{"k":[["وَأَخِيرًا","ve son olarak"],["تَوَصَّلَ","ulaştı"],["الإِنْسَانُ","insan"],["إِلَى","-e"],["شَبَكَةِ","ağı"],["الإِنْتَرْنِتِ","internet"],["الَّتِي","ki o"],["سَاعَدَتْ","yardım etti"],["فِي","-de (→ -e)"],["تَطَوُّرِ","gelişme(si)"],["وَسَائِلِ","araçları(nın)"],["الاتِّصَالِ","iletişim"],["بِشَكْلٍ","bir şekilde"],["كَبِيرٍ","büyük"],["جِدًّا","çok"]],"tr":"Son olarak insan, iletişim araçlarının gelişmesine çok büyük ölçüde yardımcı olan internet ağına ulaştı."}]},{"tr":"Böylece modern iletişim araçları geniş ve büyük dünyayı küçük bir köy hâline getirdi ve içinde dolaşmayı kolaylaştırdı. Aynı şekilde, orada meydana gelen bütün olayları anında öğrenmeyi de kolaylaştırdı.","s":[{"k":[["وَهَكَذَا","ve böylece"],["جَعَلَتْ","kıldı, hâline getirdi"],["وَسَائِلُ","araçları"],["الاتِّصَالِ","iletişim"],["الحَدِيثَةُ","modern"],["العَالَمَ","dünyayı"],["الوَاسِعَ","geniş"],["الكَبِيرَ","büyük"],["قَرْيَةً","bir köy"],["صَغِيرَةً","küçük"],["وَسَهَّلَتِ","ve kolaylaştırdı"],["التَّجَوُّلَ","dolaşmayı"],["فِيهَا","onda, onun içinde"]],"tr":"Böylece modern iletişim araçları geniş ve büyük dünyayı küçük bir köy hâline getirdi ve içinde dolaşmayı kolaylaştırdı."},{"k":[["كَمَا","aynı şekilde, nitekim"],["سَهَّلَتْ","kolaylaştırdı"],["مَعْرِفَةَ","bilmeyi, öğrenmeyi"],["كُلِّ","her, bütün"],["مَا","şey(ler)"],["يَجْرِي","cereyan eder, olup biter"],["فِيهَا","onda, orada"],["مِنْ","-den (açıklama: … olarak)"],["أَحْدَاثٍ","olaylar"],["فِي","-de"],["نَفْسِ","aynı"],["اللَّحْظَةِ","an (→ aynı anda)"]],"tr":"Aynı şekilde, orada meydana gelen bütün olayları anında öğrenmeyi de kolaylaştırdı."}]}]},{"n":24,"ar":"المَسْجِدُ الأُمَوِيُّ","tr":"Emevî Camii","bk":[["المَسْجِدُ","cami, mescit"],["الأُمَوِيُّ","Emevî"]],"p":[{"tr":"Şam’daki büyük Emevî Camii, İslam mimari sanatının şaheserlerinden sayılır. Mekke, Medine ve Mescid-i Aksâ’dan sonra en meşhur eski İslam mescitlerinden kabul edilir. Eski şehrin kalbinde yer alır; Hamidiye Çarşısı ve Selâhaddîn-i Eyyûbî’nin türbesi gibi önemli tarihî mekânlar onu çevreler.","s":[{"k":[["يُعَدُّ","sayılır"],["المَسْجِدُ","cami, mescit"],["الأُمَوِيُّ","Emevî"],["الكَبِيرُ","büyük"],["فِي","-de"],["دِمَشْقَ","Şam (Dımaşk)"],["مِنْ","-den"],["رَوَائِعِ","şaheserler(i)"],["الفَنِّ","sanat(ı)"],["المِعْمَارِيِّ","mimari"],["الإِسْلَامِيِّ","İslâmî"]],"tr":"Şam’daki büyük Emevî Camii, İslam mimari sanatının şaheserlerinden sayılır."},{"k":[["وَيُعْتَبَرُ","ve kabul edilir, sayılır"],["مِنْ","-den"],["أَشْهَرِ","en meşhur"],["المَسَاجِدِ","mescitler, camiler"],["الإِسْلَامِيَّةِ","İslâmî"],["القَدِيمَةِ","eski"],["بَعْدَ","-den sonra"],["مَكَّةَ","Mekke"],["وَالمَدِينَةِ","ve Medine"],["وَالمَسْجِدِ","ve Mescid"],["الأَقْصَى","en uzak (→ Mescid-i Aksâ)"]],"tr":"Mekke, Medine ve Mescid-i Aksâ’dan sonra en meşhur eski İslam mescitlerinden kabul edilir."},{"k":[["يَقَعُ","yer alır, bulunur"],["فِي","-de"],["قَلْبِ","kalbi"],["المَدِينَةِ","şehir"],["القَدِيمَةِ","eski"],["وَتَحُدُّهُ","ve onu sınırlar, çevreler"],["أَمَاكِنُ","yerler, mekânlar"],["أَثَرِيَّةٌ","tarihî (eser niteliğinde)"],["مُهِمَّةٌ","önemli"],["كَسُوقِ","çarşısı gibi"],["الحَمِيدِيَّةِ","Hamidiye"],["وَضَرِيحِ","ve türbesi"],["صَلَاحِ","salâh, iyilik (→ Selâhaddîn)"],["الدِّينِ","din (→ Selâhaddîn)"],["الأَيُّوبِيِّ","Eyyûbî"]],"tr":"Eski şehrin kalbinde yer alır; Hamidiye Çarşısı ve Selâhaddîn-i Eyyûbî’nin türbesi gibi önemli tarihî mekânlar onu çevreler."}]},{"tr":"Caminin yeri İslam’dan önce bir tapınaktı, sonra kiliseye dönüştü. Müslümanlar Şam’a girince yarısı mescit, diğer yarısı kilise oldu. Sonra Emevî halifesi Velîd b. Abdülmelik milâdî 705 yılında kiliseyi mescide çevirdi. Onu yeniden inşa etti, kaplattı, süsleme ve nakışlarla süsledi; yapımı yaklaşık on yıl sürdü.","s":[{"k":[["كَانَ","idi"],["مَكَانُ","yeri"],["المَسْجِدِ","cami(nin)"],["مَعْبَدًا","bir tapınak"],["قَبْلَ","önce"],["الإِسْلَامِ","İslam"],["ثُمَّ","sonra"],["تَحَوَّلَ","dönüştü"],["إِلَى","-e"],["كَنِيسَةٍ","bir kilise"]],"tr":"Caminin yeri İslam’dan önce bir tapınaktı, sonra kiliseye dönüştü."},{"k":[["وَلَمَّا","ve -ince"],["دَخَلَ","girdi"],["المُسْلِمُونَ","Müslümanlar"],["إِلَى","-e"],["دِمَشْقَ","Şam"],["صَارَ","oldu"],["نِصْفُهُ","onun yarısı"],["مَسْجِدًا","mescit"],["وَنِصْفُهُ","ve onun yarısı"],["الآخَرُ","diğer"],["كَنِيسَةً","kilise"]],"tr":"Müslümanlar Şam’a girince yarısı mescit, diğer yarısı kilise oldu."},{"k":[["ثُمَّ","sonra"],["قَامَ","yaptı (قَامَ بِـ: yapmak)"],["الخَلِيفَةُ","halife"],["الأُمَوِيُّ","Emevî"],["الوَلِيدُ","Velîd"],["بْنُ","oğlu"],["عَبْدِ","kul (→ Abdülmelik)"],["المَلِكِ","Melik, hükümdar (→ Abdülmelik)"],["سَنَةَ","yılında"],["٧٠٥","705"],["مِيلَادِيَّةً","milâdî"],["بِتَحْوِيلِ","çevirme (işini)"],["الكَنِيسَةِ","kilise(yi)"],["إِلَى","-e"],["مَسْجِدٍ","bir mescit"]],"tr":"Sonra Emevî halifesi Velîd b. Abdülmelik milâdî 705 yılında kiliseyi mescide çevirdi."},{"k":[["وَأَعَادَ","ve tekrarladı (→ yeniden yaptı)"],["بِنَاءَهُ","onun inşasını"],["مِنْ","-den"],["جَدِيدٍ","yeni (مِنْ جَدِيدٍ: yeniden)"],["وَكَسَاهُ","ve onu kapladı (giydirdi)"],["وَزَيَّنَهُ","ve onu süsledi"],["بِالزَّخْرَفَةِ","süslemeyle"],["وَالنُّقُوشِ","ve nakışlar"],["وَاسْتَغْرَقَ","ve sürdü, zaman aldı"],["بِنَاؤُهُ","onun inşası"],["عَشْرَ","on"],["سَنَوَاتٍ","yıllar"],["تَقْرِيبًا","yaklaşık"]],"tr":"Onu yeniden inşa etti, kaplattı, süsleme ve nakışlarla süsledi; yapımı yaklaşık on yıl sürdü."}]},{"tr":"Caminin alanı yaklaşık 15.000 metrekaredir (m²). Cami, genişliği 97 metre, uzunluğu 156 metre olan bir avludan oluşur. Camide dört mihrap bulunur; bunların en önemlisi, duvarın yaklaşık ortasında yer alan büyük Sahâbe Mihrabı’dır.","s":[{"k":[["تَبْلُغُ","ulaşır, bulur"],["مِسَاحَةُ","alanı, yüzölçümü"],["المَسْجِدِ","cami(nin)"],["تَقْرِيبًا","yaklaşık"],["١٥٠٠٠","15.000"],["مِتْرٍ","metre"],["مُرَبَّعٍ","kare"],["م","metre (م²: metrekare)"]],"tr":"Caminin alanı yaklaşık 15.000 metrekaredir (m²)."},{"k":[["وَيَتَكَوَّنُ","ve oluşur"],["المَسْجِدُ","cami"],["مِنْ","-den"],["فِنَاءٍ","bir avlu"],["عَرْضُهُ","onun genişliği"],["٩٧","97"],["مِتْرًا","metre"],["وَطُولُهُ","ve onun uzunluğu"],["١٥٦","156"],["مِتْرًا","metre"]],"tr":"Cami, genişliği 97 metre, uzunluğu 156 metre olan bir avludan oluşur."},{"k":[["وَيَحْتَوِي","ve içerir"],["المَسْجِدُ","cami"],["عَلَى","üzerine (يَحْتَوِي عَلَى: içermek)"],["أَرْبَعَةِ","dört"],["مَحَارِيبَ","mihraplar"],["أَهَمُّهَا","onların en önemlisi"],["مِحْرَابُ","mihrabı"],["الصَّحَابَةِ","sahâbe"],["الكَبِيرُ","büyük"],["الَّذِي","ki o"],["يَقَعُ","yer alır, bulunur"],["وَسَطَ","ortasında"],["الجِدَارِ","duvar"],["تَقْرِيبًا","yaklaşık"]],"tr":"Camide dört mihrap bulunur; bunların en önemlisi, duvarın yaklaşık ortasında yer alan büyük Sahâbe Mihrabı’dır."}]},{"tr":"Emevî Camii’nin ayrıca dört ana kapısı ve dört kubbesi vardır. Minarelere gelince; doğu ve batı minareleri, bunlara ek olarak da kuzey minaresi vardır. Bunun adı Arûs (Gelin) Minaresi’dir; caminin minareleri arasında en eski minaredir. Tarihi Velîd b. Abdülmelik dönemine uzanır.","s":[{"k":[["وَلِلْمَسْجِدِ","ve caminin vardır"],["الأُمَوِيِّ","Emevî"],["أَيْضًا","ayrıca, de"],["أَرْبَعَةُ","dört"],["أَبْوَابٍ","kapılar"],["رَئِيسَةٍ","ana, başlıca"],["وَأَرْبَعُ","ve dört"],["قِبَابٍ","kubbeler"]],"tr":"Emevî Camii’nin ayrıca dört ana kapısı ve dört kubbesi vardır."},{"k":[["أَمَّا","-e gelince"],["المَآذِنُ","minareler"],["فَهُنَاكَ","ise vardır"],["المِئْذَنَةُ","minare"],["الشَّرْقِيَّةُ","doğu(daki)"],["وَالغَرْبِيَّةُ","ve batı(daki)"],["إِضَافَةً","ek olarak"],["إِلَى","-e"],["المِئْذَنَةِ","minare"],["الشَّمَالِيَّةِ","kuzey(deki)"]],"tr":"Minarelere gelince; doğu ve batı minareleri, bunlara ek olarak da kuzey minaresi vardır."},{"k":[["وَاسْمُهَا","ve onun adı"],["مِئْذَنَةُ","minaresi"],["العَرُوسِ","gelin"],["وَهِيَ","ve o"],["أَقْدَمُ","en eski"],["مِئْذَنَةٍ","minare"],["بَيْنَ","arasında"],["مَآذِنِهِ","onun minareleri"]],"tr":"Bunun adı Arûs (Gelin) Minaresi’dir; caminin minareleri arasında en eski minaredir."},{"k":[["وَيَعُودُ","ve döner (→ uzanır, dayanır)"],["تَارِيخُهَا","onun tarihi"],["إِلَى","-e"],["عَهْدِ","dönemi"],["الوَلِيدِ","Velîd"],["بْنِ","oğlu"],["عَبْدِ","kul (→ Abdülmelik)"],["المَلِكِ","Melik, hükümdar (→ Abdülmelik)"]],"tr":"Tarihi Velîd b. Abdülmelik dönemine uzanır."}]}]},{"n":25,"ar":"الشَّرْقُ الأَوْسَطُ: مَوْقِعُهُ وَأَهَمِّيَّتُهُ","tr":"Orta Doğu: Konumu ve Önemi","bk":[["الشَّرْقُ","doğu"],["الأَوْسَطُ","orta"],["مَوْقِعُهُ","onun konumu"],["وَأَهَمِّيَّتُهُ","ve onun önemi"]],"p":[{"tr":"Orta Doğu, Akdeniz’in çevresinde yer alan ve Basra Körfezi’ne kadar uzanan coğrafi bölgedir. “Orta Doğu” terimi, bu coğrafi bölgede bulunan devletlere ve medeniyetlere işaret etmek için kullanılır. Orta Doğu’nun dinî, tarihî, coğrafi ve ekonomik önemi vardır.","s":[{"k":[["الشَّرْقُ","doğu"],["الأَوْسَطُ","orta"],["هِيَ","o (dişil)"],["المِنْطَقَةُ","bölge"],["الجُغْرَافِيَّةُ","coğrafi"],["الوَاقِعَةُ","yer alan, bulunan"],["حَوْلَ","çevresinde"],["البَحْرِ","deniz"],["الأَبْيَضِ","beyaz (→ Akdeniz)"],["وَتَمْتَدُّ","ve uzanır"],["حَتَّى","-e kadar"],["الخَلِيجِ","körfez"],["العَرَبِيِّ","Arap (→ Basra Körfezi)"]],"tr":"Orta Doğu, Akdeniz’in çevresinde yer alan ve Basra Körfezi’ne (Arap Körfezi’ne) kadar uzanan coğrafi bölgedir."},{"k":[["يُسْتَخْدَمُ","kullanılır"],["مُصْطَلَحُ","terimi"],["الشَّرْقِ","doğu"],["الأَوْسَطِ","orta"],["لِلْإِشَارَةِ","işaret etmek için"],["إِلَى","-e"],["الدُّوَلِ","devletler"],["وَالحَضَارَاتِ","ve medeniyetler"],["المَوْجُودَةِ","bulunan, mevcut"],["فِي","-de"],["هَذِهِ","bu"],["المِنْطَقَةِ","bölge"],["الجُغْرَافِيَّةِ","coğrafi"]],"tr":"“Orta Doğu” terimi, bu coğrafi bölgede bulunan devletlere ve medeniyetlere işaret etmek için kullanılır."},{"k":[["وَلِلشَّرْقِ","ve doğunun vardır"],["الأَوْسَطِ","orta"],["أَهَمِّيَّةٌ","önem"],["دِينِيَّةٌ","dinî"],["وَتَارِيخِيَّةٌ","ve tarihî"],["وَجُغْرَافِيَّةٌ","ve coğrafi"],["وَاقْتِصَادِيَّةٌ","ve ekonomik"]],"tr":"Orta Doğu’nun dinî, tarihî, coğrafi ve ekonomik önemi vardır."}]},{"tr":"Dinî ve tarihî açıdan Orta Doğu, üç semavi dinin, yani İslam, Yahudilik ve Hristiyanlığın beşiği sayılır ve pek çok kutsal mekânı barındırır. Filistin’de Müslümanların ilk kıblesi olan Mescid-i Aksâ vardır. Mekke-i Mükerreme’de ise Mescid-i Haram ve Kâbe-i Muazzama bulunur; orası İslam dünyasının kalbi ve merkezidir, her yıl milyonlarca Müslüman hac ve umre ibadetlerini yerine getirmek için oraya akın eder. Buna ek olarak, önceki medeniyetlerden kalma pek çok tarihî eser de vardır.","s":[{"k":[["فَمِنَ","-den (→ … açısından)"],["النَّاحِيَةِ","yön, açı"],["الدِّينِيَّةِ","dinî"],["وَالتَّارِيخِيَّةِ","ve tarihî"],["يُعْتَبَرُ","sayılır, kabul edilir"],["الشَّرْقُ","doğu"],["الأَوْسَطُ","orta"],["مَهْدَ","beşiği"],["الدِّيَانَاتِ","dinler"],["السَّمَاوِيَّةِ","semavi"],["الثَّلَاثَةِ","üç"],["الإِسْلَامِ","İslam"],["وَاليَهُودِيَّةِ","ve Yahudilik"],["وَالمَسِيحِيَّةِ","ve Hristiyanlık"]],"tr":"Dinî ve tarihî açıdan Orta Doğu, üç semavi dinin, yani “İslam, Yahudilik ve Hristiyanlığın” beşiği sayılır;"},{"k":[["وَيَضُمُّ","ve barındırır, içine alır"],["كَثِيرًا","birçoğunu"],["مِنَ","-den"],["الأَمَاكِنِ","mekânlar, yerler"],["المُقَدَّسَةِ","kutsal"]],"tr":"ve pek çok kutsal mekânı barındırır."},{"k":[["فَفِي","nitekim -de"],["فِلَسْطِينَ","Filistin"],["هُنَاكَ","(orada) vardır"],["المَسْجِدُ","mescit"],["الأَقْصَى","en uzak (→ Mescid-i Aksâ)"],["وَهُوَ","ve o"],["قِبْلَةُ","kıblesi"],["المُسْلِمِينَ","Müslümanlar(ın)"],["الأُولَى","ilk"]],"tr":"Filistin’de Mescid-i Aksâ vardır; o, Müslümanların ilk kıblesidir."},{"k":[["وَفِي","ve -de"],["مَكَّةَ","Mekke"],["المُكَرَّمَةِ","mükerrem, şerefli"],["المَسْجِدُ","mescit"],["الحَرَامُ","haram, dokunulmaz (→ Mescid-i Haram)"],["وَالكَعْبَةُ","ve Kâbe"],["المُشَرَّفَةُ","şerefli (→ Kâbe-i Muazzama)"],["وَهِيَ","ve o (dişil)"],["قَلْبُ","kalbi"],["العَالَمِ","dünya"],["الإِسْلَامِيِّ","İslam (İslamî)"],["وَمَرْكَزُهُ","ve onun merkezi"]],"tr":"Mekke-i Mükerreme’de ise Mescid-i Haram ve Kâbe-i Muazzama bulunur; orası İslam dünyasının kalbi ve merkezidir."},{"k":[["يَتَوَافَدُ","akın eder, peş peşe gelir"],["إِلَيْهَا","ona, oraya"],["مَلَايِينُ","milyonlar(ca)"],["المُسْلِمِينَ","Müslümanlar"],["كُلَّ","her"],["عَامٍ","yıl"],["لِأَدَاءِ","yerine getirmek için"],["مَنَاسِكِ","ibadetleri (menâsik)"],["الحَجِّ","hac"],["وَالعُمْرَةِ","ve umre"]],"tr":"Her yıl milyonlarca Müslüman, hac ve umre ibadetlerini yerine getirmek için oraya akın eder."},{"k":[["إِضَافَةً","ek olarak"],["إِلَى","-e"],["ذَلِكَ","o, bu (→ buna)"],["فَهُنَاكَ","ayrıca (orada) vardır"],["الكَثِيرُ","çok, birçok"],["مِنَ","-den"],["المَعَالِمِ","eserler, simge yapılar"],["التَّارِيخِيَّةِ","tarihî"],["مِنَ","-den"],["الحَضَارَاتِ","medeniyetler"],["السَّابِقَةِ","önceki, geçmiş"]],"tr":"Buna ek olarak, önceki medeniyetlerden kalma pek çok tarihî eser vardır."}]},{"tr":"Coğrafi açıdan Orta Doğu dünyanın ortasında yer alır ve pek çok önemli denize ve okyanusa kıyısı vardır. Hayati öneme sahip pek çok geçidi ve boğazı vardır; bunlardan bazıları Basra Körfezi üzerindeki Hürmüz Boğazı, Hint Okyanusu üzerindeki Bâbülmendeb Boğazı, Atlas Okyanusu üzerindeki Cebelitarık Boğazı, Asya ve Avrupa kıtaları arasındaki İstanbul Boğazı ve Akdeniz’i Kızıldeniz’e bağlayan Süveyş Kanalı’dır.","s":[{"k":[["وَمِنَ","ve -den (→ … açısından)"],["النَّاحِيَةِ","yön, açı"],["الجُغْرَافِيَّةِ","coğrafi"],["يَقَعُ","yer alır, bulunur"],["الشَّرْقُ","doğu"],["الأَوْسَطُ","orta"],["وَسَطَ","ortasında"],["العَالَمِ","dünya(nın)"]],"tr":"Coğrafi açıdan Orta Doğu dünyanın ortasında yer alır,"},{"k":[["وَيُشْرِفُ","ve bakar, hâkim konumdadır"],["عَلَى","-e, üzerine"],["كَثِيرٍ","birçok"],["مِنَ","-den"],["البِحَارِ","denizler"],["وَالمُحِيطَاتِ","ve okyanuslar"],["المُهِمَّةِ","önemli"]],"tr":"pek çok önemli denize ve okyanusa bakar (kıyısı vardır),"},{"k":[["وَلَهُ","ve onun vardır"],["كَثِيرٌ","birçok"],["مِنَ","-den"],["المَنَافِذِ","geçitler, çıkış kapıları"],["وَالمَضِيقَاتِ","ve boğazlar"],["الحَيَوِيَّةِ","hayati"]],"tr":"ve hayati öneme sahip pek çok geçidi ve boğazı vardır."},{"k":[["مِنْهَا","onlardan"],["مَضِيقُ","boğazı"],["هُرْمُزَ","Hürmüz"],["عَلَى","üzerinde"],["الخَلِيجِ","körfez"],["العَرَبِيِّ","Arap (→ Basra Körfezi)"],["وَمَضِيقُ","ve boğazı"],["بَابِ","kapısı"],["المَنْدَبِ","Mendeb (→ Bâbülmendeb)"],["عَلَى","üzerinde"],["المُحِيطِ","okyanus"],["الهِنْدِيِّ","Hint"]],"tr":"Bunlardan bazıları: Basra Körfezi üzerindeki “Hürmüz” Boğazı, Hint Okyanusu üzerindeki “Bâbülmendeb” Boğazı,"},{"k":[["وَمَضِيقُ","ve boğazı"],["جَبَلِ","dağı"],["طَارِقٍ","Târık (→ Cebelitarık)"],["عَلَى","üzerinde"],["المُحِيطِ","okyanus"],["الأَطْلَسِيِّ","Atlas (Atlantik)"],["وَمَضِيقُ","ve boğazı"],["البُوسْفُورِ","Bosfor (İstanbul Boğazı)"],["بَيْنَ","arasında"],["قَارَّتَيْ","iki kıtası"],["آسِيَا","Asya"],["وَأُورُوبَّا","ve Avrupa"]],"tr":"Atlas Okyanusu üzerindeki “Cebelitarık” Boğazı, Asya ve Avrupa kıtaları arasındaki İstanbul Boğazı (Bosfor)"},{"k":[["وَقَنَاةُ","ve kanalı"],["السُّوَيْسِ","Süveyş"],["الَّتِي","ki o"],["تَرْبِطُ","bağlar"],["البَحْرَ","denizi"],["الأَبْيَضَ","beyaz (→ Akdeniz’i)"],["بِالبَحْرِ","denize"],["الأَحْمَرِ","kırmızı (→ Kızıldeniz’e)"]],"tr":"ve Akdeniz’i Kızıldeniz’e bağlayan “Süveyş Kanalı”dır."}]},{"tr":"Ekonomik açıdan ise Orta Doğu pek çok doğal kaynağa ve maden zenginliğine sahiptir; bunların başında bugün hayatımızda önemli bir yeri olan petrol zenginliği gelir. Ayrıca Orta Doğu’da demir, bakır, potas ve alüminyum gibi pek çok maden bulunur. Balık varlığı Orta Doğu’nun zenginliklerinin önemli bir bölümünü oluşturur; aynı şekilde Orta Doğu bölgeleri tarıma elverişli verimli topraklara sahiptir.","s":[{"k":[["أَمَّا","-e gelince"],["مِنَ","-den (→ … açısından)"],["النَّاحِيَةِ","yön, açı"],["الاقْتِصَادِيَّةِ","ekonomik"],["فَإِنَّ","ise şüphesiz (pekiştirme)"],["الشَّرْقَ","doğu"],["الأَوْسَطَ","orta"],["يَحْتَوِي","içerir, barındırır"],["عَلَى","-i (üzerine)"],["كَثِيرٍ","birçok"],["مِنَ","-den"],["الثَّرَوَاتِ","servetler, zenginlikler"],["الطَّبِيعِيَّةِ","doğal"],["وَالمَعْدِنِيَّةِ","ve madenî"]],"tr":"Ekonomik açıdan ise Orta Doğu pek çok doğal ve madenî zenginliği barındırır;"},{"k":[["وَعَلَى","ve üzerinde"],["رَأْسِهَا","onların başı (→ başında)"],["الثَّرْوَةُ","servet, zenginlik"],["النِّفْطِيَّةُ","petrol (ile ilgili)"],["المُهِمَّةُ","önemli"],["فِي","-de"],["حَيَاتِنَا","hayatımız"],["اليَوْمَ","bugün"]],"tr":"bunların başında, b function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function ls(k,v){try{if(v===undefined)return localStorage.getItem('bosvakit:'+k)||'';localStorage.setItem('bosvakit:'+k,v);}catch(e){return '';}}
function temiz(w){return w.replace(/[،.:؟!«»,؛;()\[\]﴿﴾…✦ۚۖۗۘۙۛ²"“”]/g,'');}
function kelime(t){return '<span class="w"><span class="a">'+esc(t[0])+'</span><span class="g">'+esc(t[1])+'</span></span>';}
var sec=document.getElementById('sec'),cur=0;
sec.innerHTML=D.map(function(m,i){return '<option value="'+i+'">'+m.n+'. '+esc(m.tr)+'</option>';}).join('');
function ciz(i){
  cur=i;var m=D[i];sec.value=i;
  document.getElementById('arb').textContent=m.ar;
  document.getElementById('trb').textContent=m.n+'. '+m.tr;
  document.getElementById('geri').disabled=i===0;document.getElementById('ileri').disabled=i===D.length-1;
  var h='<div class="card"><div class="lbl">Başlık</div><div class="s"><div class="words">'+m.bk.map(kelime).join('')+'</div><div class="ct"><span>'+esc(m.tr)+'</span></div></div></div>';
  m.p.forEach(function(p,j){
    h+='<div class="card"><div class="lbl">Paragraf '+(j+1)+'</div>';
    p.s.forEach(function(s){h+='<div class="s"><div class="words">'+s.k.map(kelime).join('')+'</div><div class="ct"><span>'+esc(s.tr)+'</span></div></div>';});
    h+='<div class="pt"><b>Paragraf çevirisi</b><span>'+esc(p.tr)+'</span></div></div>';
  });
  document.getElementById('liste').innerHTML=h;
  try{history.replaceState(null,'','#'+m.n);localStorage.setItem('ceviri-metin',m.n);}catch(e){}
  window.scrollTo(0,0);
}
sec.onchange=function(){ciz(+sec.value);};
document.getElementById('geri').onclick=function(){if(cur>0)ciz(cur-1);};
document.getElementById('ileri').onclick=function(){if(cur<D.length-1)ciz(cur+1);};
var bas=location.hash.slice(1);try{bas=bas||localStorage.getItem('ceviri-metin');}catch(e){}
var ix=D.findIndex(function(m){return String(m.n)===String(bas);});ciz(ix<0?0:ix);
document.addEventListener('click',function(e){var x=e.target.closest('.w,.ct,.pt');if(x)x.classList.toggle('ac');});
</script>
