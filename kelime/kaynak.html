<style>
/*CSS*/
/* --- bu programa özel --- */
.viz { grid-template-columns: minmax(0, 1fr); }
.viz > * { max-width: 100%; min-width: 0; }
.chunk.r-dash .w { background: transparent; border-bottom-color: transparent; color: var(--muted); }
.sent .plain { font-family: var(--f-ar); font-size: 1.55rem; line-height: 1.6; color: var(--muted); align-self: center; padding: 0 2px; }
.tagbtn.findbtn.on .w { border-style: solid; border-color: var(--y); background: color-mix(in srgb, var(--y) 14%, transparent); }
.tagbtn.findbtn.miss .w { outline: 2px dashed var(--good); outline-offset: 2px; }
.srcline { font-size: .85rem; color: var(--muted); }
.sumgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.sumcard { display: grid; gap: 10px; align-content: start; border-top: 5px solid var(--role); }

.sumcard ul { margin: 0; padding-inline-start: 18px; display: grid; gap: 4px; }
.sumcard .ar { font-size: 1.2rem; }
.flash-wrap { display: grid; gap: 12px; justify-items: center; }
.flash { width: 100%; max-width: 560px; min-height: 170px; perspective: 900px; border: 0; background: transparent; padding: 0; cursor: pointer; }
.flash .in { position: relative; width: 100%; min-height: 170px; transition: transform .45s; transform-style: preserve-3d; }
.flash.up .in { transform: rotateY(180deg); }
.flash .face { position: absolute; inset: 0; border-radius: 16px; display: grid; place-items: center; padding: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden; text-align: center; font-size: 1.15rem; }
.flash .front { background: var(--ink); color: var(--paper); font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; }
.flash .back { background: var(--card); border: 2px solid var(--accent); transform: rotateY(180deg); }
.flash .back .ar { font-size: 1.25rem; }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checklist label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.checklist input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--accent); }
.triad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 720px; direction: rtl; }
.triad .tcard { border-radius: 14px; padding: 12px; background: color-mix(in srgb, var(--role) 10%, var(--card)); border: 2px solid var(--role); display: grid; gap: 4px; justify-items: center; text-align: center; direction: ltr; }
.triad .tcard .big { font-family: var(--f-ar); font-size: 1.8rem; color: var(--role); line-height: 1.5; }
.triad .tcard .ex { font-family: var(--f-ar); font-size: 1.15rem; direction: rtl; }
.triad .tcard small { color: var(--muted); }
.alanlar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 720px; }
.alan { display: grid; justify-items: center; gap: 2px; padding: 10px; border-radius: 12px; background: var(--soft); text-align: center; }
.alan svg { width: 40px; height: 40px; }
.alan .ar { font-size: 1.1rem; }
.alan b { font-size: .85rem; }
.alamet { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 720px; direction: rtl; }
.alamet .tile2 { border-radius: 16px; padding: 12px; text-align: center; background: color-mix(in srgb, var(--mun) 10%, var(--card)); border: 2px solid var(--mun); display: grid; gap: 4px; direction: ltr; }
.alamet .sign { font-family: var(--f-ar); font-size: 3rem; color: var(--mun); line-height: 1.2; }
.alamet .ex { font-family: var(--f-ar); font-size: 1.25rem; direction: rtl; }
.alamet .ex b { color: var(--mun); }
.pair2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; width: 100%; max-width: 720px; }
.pair2 .box { border-radius: 12px; background: var(--soft); padding: 10px 12px; display: grid; gap: 4px; }
.pair2 .box .ar { font-size: 1.25rem; }
.merdiven { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 720px; direction: rtl; }
.merdiven .step { border-radius: 14px; padding: 12px; text-align: center; display: grid; gap: 4px; background: color-mix(in srgb, var(--role) 10%, var(--card)); border: 2px solid var(--role); direction: ltr; align-content: start; }
.merdiven .step .ar { font-size: 1.4rem; }
.merdiven .step .icons { justify-content: center; }
.icons { display: inline-flex; gap: 2px; flex-wrap: wrap; }
.icons .ico { width: 22px; height: 22px; }
.sfx { color: var(--role); font-weight: 700; }
.cemtree { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 720px; direction: rtl; }
.cemtree .leaf { border-radius: 12px; padding: 10px; background: var(--soft); text-align: center; display: grid; gap: 2px; direction: ltr; border-top: 4px solid var(--role); }
.cemtree .leaf .ar { font-size: 1.25rem; }
.broken { display: flex; gap: 6px; justify-content: center; direction: rtl; align-items: center; font-family: var(--f-ar); font-size: 1.4rem; }
.marife6 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 760px; }
.marife6 .m { border-radius: 12px; padding: 10px; text-align: center; background: color-mix(in srgb, var(--mar) 9%, var(--card)); border: 1.5px solid var(--mar); display: grid; gap: 2px; }
.marife6 .m b { color: var(--mar); }
.marife6 .m .ar { font-size: 1.2rem; }
.nm-flow { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: center; direction: rtl; }
.nm-card { border-radius: 14px; padding: 10px 16px; text-align: center; display: grid; gap: 2px; border: 2px solid var(--role); background: color-mix(in srgb, var(--role) 10%, var(--card)); }
.nm-card .ar { font-size: 1.7rem; color: var(--role); }
.qz-bars { display: grid; gap: 10px; width: 100%; max-width: 560px; }
.qz-bar { display: grid; grid-template-columns: 150px minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: .92rem; }
.qz-bar .tr2 { height: 12px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.qz-bar .tr2 div { height: 100%; background: var(--role); }
.qz-type { font-size: .85rem; color: var(--muted); }
.big5 { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.big5 button { border: 0; border-radius: 14px; padding: 12px 6px; font-weight: 800; font-family: var(--f-display); font-size: 1rem; color: var(--card); background: var(--role); cursor: pointer; display: grid; gap: 2px; justify-items: center; }
.big5 button .ar { font-weight: 400; font-size: 1.15rem; line-height: 1.4; }
.big5 button small { font-family: var(--f-body); font-weight: 500; font-size: .72rem; opacity: .85; }
.mem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.mcard { aspect-ratio: 4 / 3; max-width: 100%; perspective: 700px; border: 0; padding: 0; background: transparent; cursor: pointer; }
.mcard .in { position: relative; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d; }
.mcard.up .in, .mcard.done .in { transform: rotateY(180deg); }
.mcard .face { position: absolute; inset: 0; border-radius: 12px; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; padding: 4px; text-align: center; }
.mcard .back { background: var(--ink); color: var(--paper); font-family: var(--f-ar); font-size: 1.3rem; opacity: .92; }
.mcard .front { transform: rotateY(180deg); background: var(--card); border: 2px solid var(--line); font-family: var(--f-ar); font-size: 1.55rem; }
.mcard.done .front { border-color: var(--good); background: var(--good-bg); }
@media (max-width: 720px) {
  .triad, .alamet, .merdiven, .cemtree { grid-template-columns: 1fr; }
  .mem { grid-template-columns: repeat(3, 1fr); }
  .alanlar, .marife6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .qz-bar { grid-template-columns: 110px minmax(0, 1fr) 46px; }
}
</style>

<script>
(function () {
"use strict";
// ---------- yardımcılar ----------
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function plain(h) { return String(h).replace(/<[^>]+>/g, ""); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function chunks(str) { return str.split(" / ").map(function (p) { var i = p.lastIndexOf(":"); return { t: p.slice(0, i), r: p.slice(i + 1) }; }); }
function sentHtml(str) {
  return '<div class="sent">' + chunks(str).map(function (c) {
    if (c.r === "-") return '<span class="plain">' + c.t + '</span>';
    return '<span class="chunk r-' + c.r + '"><span class="w">' + c.t + '</span><span class="t">' + (ROLES[c.r] ? ROLES[c.r].tr : "&nbsp;") + '</span></span>';
  }).join("") + '</div>';
}
function legendHtml(roles) { return '<div class="legend">' + roles.map(function (r) { return '<span class="r-' + r + '"><i></i>' + ROLES[r].tr + ' <span class="ar" style="color:var(--muted)">' + ROLES[r].ar + '</span></span>'; }).join("") + '</div>'; }
var store = {
  get: function (k, d) { try { var v = localStorage.getItem("kelime:" + k); return v === null ? d : JSON.parse(v); } catch (x) { return d; } },
  set: function (k, v) { try { localStorage.setItem("kelime:" + k, JSON.stringify(v)); } catch (x) {} }
};
function icon(kind, cls, n) {
  var one = {
    person: '<circle cx="12" cy="7" r="5" class="' + cls + '"/><path d="M3 24 Q3 13 12 13 Q21 13 21 24 Z" class="' + cls + '"/>',
    camel: '<path d="M2 20 L2 14 Q2 11 5 11 L8 11 Q9 6 12 9 Q14 5 17 9 L19 9 Q20 5 22 6 L22 9 L20 11 L20 20 L18 20 L18 14 L6 14 L6 20 Z" class="' + cls + '"/>',
    leaf: '<path d="M4 20 Q4 4 21 3 Q20 20 4 20 Z" class="' + cls + '"/><path d="M4 20 L15 9" stroke="var(--card)" stroke-width="1.5" fill="none"/>',
    pin: '<path d="M12 2 Q20 2 20 10 Q20 15 12 23 Q4 15 4 10 Q4 2 12 2 Z" class="' + cls + '"/><circle cx="12" cy="10" r="3" fill="var(--card)"/>',
    clock: '<circle cx="12" cy="12" r="10" class="' + cls + '"/><path d="M12 6 L12 12 L16 14" stroke="var(--card)" stroke-width="2" fill="none" stroke-linecap="round"/>',
    pen: '<path d="M4 20 L5 15 L16 4 L20 8 L9 19 Z" class="' + cls + '"/><path d="M14 6 L18 10" stroke="var(--card)" stroke-width="1.5"/>'
  }[kind];
  var s = ""; for (var i = 0; i < (n || 1); i++) s += '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">' + one + '</svg>';
  return '<span class="icons">' + s + '</span>';
}

// ---------- rütbe, ses, konfeti ----------
var LEVELS = [[0, "Mübtedî", "yeni başlayan"], [100, "Talebe", "öğrenci"], [300, "Kâtip", "yazan"], [600, "Edîb", "dil ustası"], [1000, "Nahvî", "dil bilgini"], [1600, "Allâme", "çok bilen"]];
function getXP() { return store.get("xp", 0); }
function levelOf(x) { var i = 0; for (var k = 0; k < LEVELS.length; k++) if (x >= LEVELS[k][0]) i = k; return i; }
function renderXP() {
  var box = document.getElementById("xpbox"), x = getXP(), i = levelOf(x), cur = LEVELS[i], nx = LEVELS[i + 1];
  var pct = nx ? (x - cur[0]) / (nx[0] - cur[0]) * 100 : 100;
  box.innerHTML = '<div class="row"><span class="lbl">Rütben</span><span class="tabular muted">' + x + ' puan</span></div><div class="row"><b class="rank">' + cur[1] + '</b><span class="muted">' + (nx ? "sonra: " + nx[1] : "en yüksek rütbe") + '</span></div><div class="xpbar"><div style="width:' + pct + '%"></div></div>';
}
var toastT;
function toast(m) { var t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("show"); }, 2000); }
function addXP(n, quiet) {
  n = Math.max(0, Math.round(n)); if (!n) return;
  var b = levelOf(getXP()), v = getXP() + n; store.set("xp", v); renderXP();
  var a = levelOf(v);
  if (a > b) { toast("Yeni rütbe: " + LEVELS[a][1] + " (" + LEVELS[a][2] + ")"); confetti(); beep("win"); }
  else if (!quiet) toast("+" + n + " puan");
}
var SND = { on: store.get("snd", true), ctx: null };
function beep(type) {
  if (!SND.on) return;
  try {
    SND.ctx = SND.ctx || new (window.AudioContext || window.webkitAudioContext)();
    var c = SND.ctx, notes = type === "ok" ? [660, 880] : type === "win" ? [523, 659, 784, 1046] : type === "tick" ? [1200] : [220, 160];
    notes.forEach(function (f, i) {
      var o = c.createOscillator(), g = c.createGain(); o.type = type === "no" ? "sawtooth" : "triangle"; o.frequency.value = f;
      var t = c.currentTime + i * 0.09, vol = type === "tick" ? 0.04 : 0.12;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.2);
    });
  } catch (x) {}
}
function confetti() {
  try { if (matchMedia("(prefers-reduced-motion: reduce)").matches) return; } catch (x) {}
  var cv = document.createElement("canvas"); cv.className = "confetti"; document.body.appendChild(cv);
  var W = cv.width = innerWidth, H = cv.height = innerHeight, ctx = cv.getContext("2d"), cs = getComputedStyle(document.documentElement);
  var cols = ["--ism", "--fiil", "--harf", "--mun", "--cem", "--mar"].map(function (v) { return cs.getPropertyValue(v).trim() || "#888"; }), ps = [];
  for (var i = 0; i < 150; i++) ps.push({ x: W / 2 + (Math.random() - .5) * W * .5, y: H * .4, vx: (Math.random() - .5) * 12, vy: -Math.random() * 11 - 4, r: Math.random() * 7 + 4, c: cols[i % 6], a: Math.random() * 6 });
  var t0 = performance.now();
  (function step(t) { ctx.clearRect(0, 0, W, H); ps.forEach(function (p) { p.vy += .33; p.x += p.vx; p.y += p.vy; p.a += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); }); if (t - t0 < 2000) requestAnimationFrame(step); else cv.remove(); })(t0);
}
function starsHtml(n) { var s = ""; for (var i = 1; i <= 3; i++) s += i <= n ? "★" : '<span class="off">★</span>'; return '<div class="stars" aria-label="' + n + ' yıldız">' + s + '</div>'; }

// ---------- görseller ----------
function vizU1() {
  var alan = [["person", "İnsan", "مُحَمَّدٌ، حَسَنٌ"], ["camel", "Hayvan", "جَمَلٌ، بَقَرَةٌ"], ["leaf", "Bitki", "جَوْزٌ، تُفَّاحٌ"], ["pin", "Mekân", "تُرْكِيَا، مَسْجِدٌ"], ["clock", "Zaman", "صَبَاحٌ، يَوْمٌ"], ["pen", "Cansız", "قَلَمٌ، كِتَابٌ"]];

    '<div class="tcard" style="--role:var(--fiil)"><div class="big">فِعْلٌ</div><b>Fiil</b><small>zamanlı iş</small><div class="ex">رَجَعَ · قَرَأَ · ذَهَبَ</div></div>' +
    '<div class="tcard" style="--role:var(--harf)"><div class="big">حَرْفٌ</div><b>Harf</b><small>başkasıyla anlam kazanır</small><div class="ex">فِي · مِنْ · إِلَى</div></div>' +

    alan.map(function (a) { return '<div class="alan">' + icon(a[0], "s-ism") + '<b>' + a[1] + '</b><span class="ar">' + a[2] + '</span></div>'; }).join("") + '</div>';

function vizU4() {

    ex.items.forEach(function (it) { var c = {}; for (var k in it) c[k] = it[k]; c.kind = ex.type; out.push(c); });
  }

}

}

}

      (c ? '<div class="fb">' + (c === it.a ? '<span class="ok">Doğru.</span> ' : '<span class="no">Yanlış.</span> Doğrusu: <b>' + right[1] + '</b>. ') + (it.why || '') + '</div>' + trAfter(it) + retryBtn(key) : '');
  }
  if (it.kind === "tag" || it.kind === "find") {
    var cs = chunks(it.c), find = it.kind === "find";
    if (!L.tags) L.tags = cs.map(function () { return null; });
    var res = L.res;
    var line = cs.map(function (ch, ci) {
      if (ch.r === "-") return '<span class="plain">' + ch.t + '</span>';
      if (find) {
        var on = !!L.tags[ci], target = ch.r === "y";
        var cl = "tagbtn findbtn" + (on ? " on" : "") + (res && on !== target ? (on ? " wrong" : " miss") : "");
        return '<button class="' + cl + '" data-act="find" data-key="' + key + '" data-ci="' + ci + '"' + (res === "ok" ? " disabled" : "") + '><span class="w">' + ch.t + '</span><span class="t">' + (on ? ROLES[ex.target].tr : "&nbsp;") + '</span></button>';
      }
      var r = res === "ok" ? ch.r : L.tags[ci], wrong = res === "no" && L.tags[ci] !== ch.r;
      return '<button class="tagbtn' + (r ? " has r-" + r : "") + (wrong ? " wrong" : "") + '" data-act="tag" data-key="' + key + '" data-ci="' + ci + '"' + (res === "ok" ? " disabled" : "") + '><span class="w">' + ch.t + '</span><span class="t">' + (r ? ROLES[r].tr : "dokun") + '</span></button>';
    }).join("");
    return num + '<div class="sent" style="gap:8px">' + (it.pre ? '<span class="plain">' + it.pre + '</span>' : '') + line + (it.post ? '<span class="plain">' + it.post + '</span>' : '') + '</div>' + (it.src ? '<div class="srcline ar">(' + it.src + ')</div>' : '') +
      (res === "ok" ? '<div class="fb"><span class="ok">Doğru.</span> ' + (it.why || '') + '</div>' + trAfter(it) :
        '<div class="row-btns"><button class="btn small solid" data-act="tcheck" data-key="' + key + '">Kontrol et</button>' + (res === "no" ? '<button class="btn small" data-act="tshow" data-key="' + key + '">Doğrusunu göster</button>' : '') + '</div>' +
        (res === "no" ? '<div class="fb"><span class="no">Henüz olmadı.</span> ' + (find ? 'Kırmızı çerçeveliler yanlış seçildi; yeşil kesik çizgililer atlandı.' : 'Kırmızı çerçeveli kelimeleri yeniden düşün.') + '</div>' : ''));
  }
  if (it.kind === "combo") {
    var slots = it.p.filter(function (x) { return typeof x !== "string"; });
    if (!L.sel) L.sel = slots.map(function () { return -1; });
    var r3 = L.res, si = -1;
    var ln = it.p.map(function (part) {
      if (typeof part === "string") return '<span>' + part + '</span>';
      si++; var v = L.sel[si];
      return '<button class="slot' + (v < 0 ? " empty" : "") + (r3 === "ok" ? " right" : "") + (r3 === "no" ? " wrong" : "") + '" data-act="cycle" data-key="' + key + '" data-si="' + si + '"' + (r3 === "ok" ? " disabled" : "") + '>' + (v < 0 ? "؟" : part.o[v]) + '</button>';
    }).join("");
    var trc = Array.isArray(it.tr) ? it.tr[Math.max(0, it.ok.findIndex(function (cmb) { return cmb.every(function (v, i) { return L.sel[i] === v; }); }))] : it.tr;
    return num + (it.q ? '<div class="q" style="font-size:1.3rem">' + it.q + '</div>' : '') + '<div class="combo-line">' + ln + '</div>' +
      (r3 === "ok" ? '<div class="fb"><span class="ok">Doğru.</span> ' + (it.why || '') + '</div>' + (trc ? '<div class="trline">' + trc + '</div>' : '') :
        '<div class="row-btns"><button class="btn small solid" data-act="ccheck" data-key="' + key + '">Kontrol et</button>' + (r3 === "no" ? '<button class="btn small" data-act="cshow" data-key="' + key + '">Doğrusunu göster</button>' : '') + '</div>' +
        (r3 === "no" ? '<div class="fb"><span class="no">Henüz olmadı.</span> Kutulara dokunarak seçenekleri değiştir.</div>' : ''));
  }
  return "";
}
function rerenderItem(key) {
  var p = key.split("-"), u = unitById(p[0]), ei = +p[1], ii = +p[2], ex = u.ex[ei];
  var el = document.getElementById("it-" + key); if (!el) return;
  el.innerHTML = itemInner(u, ei, ii, expand(ex)[ii], ex);
  el.className = "item " + (LIVE[key] && LIVE[key].res === "ok" ? "ok" : LIVE[key] && LIVE[key].res === "no" ? "no" : "");
}
function itemFromKey(key) { var p = key.split("-"), u = unitById(p[0]), ex = u.ex[+p[1]]; return { u: u, ex: ex, it: expand(ex)[+p[2]] }; }

// sözcük bankası (eşleştirme ya da metin içi boşluk)
function renderBank(u, ex, ei) {
  var key = u.id + "-" + ei + "-bank";
  var slots = ex.parts ? ex.parts.filter(function (p) { return typeof p !== "string"; }) : ex.items;
  var L = LIVE[key] || (LIVE[key] = { fill: slots.map(function () { return -1; }), sel: -1 });
  var used = {}; L.fill.forEach(function (b) { if (b >= 0) used[b] = 1; });
  function slotBtn(ii) {
    var f = L.fill[ii], res = L.res ? L.res[ii] : null;
    return '<button class="slot' + (f < 0 ? " empty" : "") + (res === true ? " right" : res === false ? " wrong" : "") + '" data-act="bput" data-key="' + key + '" data-ii="' + ii + '"' + (res === true ? " disabled" : "") + '>' + (f < 0 ? "؟" : ex.bank[f]) + '</button>';
  }
  var body;
  if (ex.parts) {
    var si = -1;
    body = '<p class="story" style="line-height:2.4">' + ex.parts.map(function (p) { if (typeof p === "string") return ' ' + p + ' '; si++; return slotBtn(si); }).join("") + '</p>' +
      (L.res && L.res.every(Boolean) && ST.tr ? '<p class="trline">' + ex.tr + '</p>' : '');
  } else {
    body = '<div class="items">' + ex.items.map(function (it, ii) {
      var res = L.res ? L.res[ii] : null;
      return '<div class="item' + (res === true ? " ok" : res === false ? " no" : "") + '"><span class="qn tabular">' + (ii + 1) + '</span><div class="combo-line">' + (it.pre ? '<span>' + it.pre + '</span>' : '') + slotBtn(ii) + (it.h ? '<span>' + it.h + '</span>' : '') + '</div>' + (res === true ? trAfter(it) + (it.why ? '<div class="trline">' + it.why + '</div>' : '') : '') + '</div>';
    }).join("") + '</div>';
  }
  return '<div class="bank">' + ex.bank.map(function (b, bi) { return '<button class="tile" data-act="bsel" data-key="' + key + '" data-bi="' + bi + '" aria-pressed="' + (L.sel === bi ? "true" : "false") + '"' + (used[bi] ? " disabled" : "") + '>' + b + '</button>'; }).join("") + '</div>' + body +
    '<div class="row-btns"><button class="btn small solid" data-act="bcheck" data-key="' + key + '">Kontrol et</button><button class="btn small" data-act="breset" data-key="' + key + '">Sıfırla</button></div>' + (L.msg ? '<div class="fb">' + L.msg + '</div>' : '');
}
// okuma (diyalog) alıştırması
function renderReading(u, ex, ei) {
  return readingText(ex) +
    '<div class="stack">' + ex.qa.map(function (q, qi) {
      var k = u.id + "-" + ei + "-q" + qi, open = LIVE[k] && LIVE[k].open;
      return '<div class="qa"><div class="ar">' + ["أ", "ب", "ج", "د"][qi] + ' ـ ' + q.q + '</div>' + (open ? '<div class="ar" style="color:var(--accent)">' + q.a + '</div><div class="trline">' + q.tr + '</div>' : '<div><button class="btn small" data-act="qa" data-key="' + k + '">Örnek cevabı göster</button></div>') + '</div>';
    }).join("") + '</div>' +
    subCls(ex).map(function (sc) {
      return '<div class="exer-head"><div class="ar">' + sc[1].ar + '</div><div><b>' + sc[1].tr + '</b></div></div><div class="items">' +
        sc[1].items.map(function (it, ii) { var key = u.id + "-" + ei + "-" + sc[0] + ii; return '<div class="item" id="it-' + key + '">' + clsInner(key, it, ii, sc[1].opts) + '</div>'; }).join("") + '</div>';
    }).join("");
}
function clsInner(key, it, ii, opts) {
  var L = LIVE[key] || (LIVE[key] = {}), c = L.ch, right = opts.filter(function (o) { return o[0] === it.a; })[0];
  return '<span class="qn tabular">' + (ii + 1) + '</span><div class="q">' + it.s + '</div><div class="cls-btns">' + opts.map(function (b) {
    var cl = c ? (b[0] === it.a ? " sel-ok" : (b[0] === c ? " sel-no" : "")) : "";
    return '<button class="opt lat' + cl + '" data-act="rcls" data-key="' + key + '" data-ii="' + ii + '" data-v="' + b[0] + '"' + (c ? " disabled" : "") + '>' + b[1] + ' <span class="ar" style="font-weight:400">' + b[2] + '</span></button>';
  }).join("") + '</div>' + (c ? '<div class="fb">' + (c === it.a ? '<span class="ok">Doğru.</span> ' : '<span class="no">Yanlış.</span> Doğrusu: <b>' + right[1] + '</b>. ') + (it.why || '') + '</div>' : '');
}

// ---------- olaylar ----------
main.addEventListener("click", function (ev) {
  var b = ev.target.closest("button"); if (!b) return;
  var d = b.dataset, key = d.key;
  if (d.go) { setTab(d.go); window.scrollTo({ top: 0 }); return; }
  if (d.trtoggle) { ST.tr = !ST.tr; store.set("tr", ST.tr); var y = window.scrollY; render(); window.scrollTo({ top: y }); return; }
  if (d.snd) { SND.on = !SND.on; store.set("snd", SND.on); render(); if (SND.on) beep("ok"); return; }
  if (d.flip) { LIVE.fu = !LIVE.fu; b.classList.toggle("up", LIVE.fu); return; }
  if (d.fnext || d.fprev || d.fshuf) {
    var fi = LIVE.fi || 0;
    if (d.fshuf) { KARTLAR.sort(function () { return Math.random() - .5; }); fi = 0; }
    else fi = (fi + (d.fnext ? 1 : -1) + KARTLAR.length) % KARTLAR.length;
    var y2 = window.scrollY; LIVE = { fi: fi, fu: false }; main.innerHTML = renderOzet(); window.scrollTo({ top: y2 }); return;
  }
  if (!d.act) return;
  var L = LIVE[key] || (LIVE[key] = {}), o;
  switch (d.act) {
    case "pick":
      o = itemFromKey(key); L.ch = +d.i;
      var ai = typeof o.it.a === "number" ? o.it.a : o.it.o.indexOf(o.it.a);
      L.res = L.ch === ai ? "ok" : "no"; mark(key, L.ch === ai); rerenderItem(key); break;
    case "cls": o = itemFromKey(key); L.ch = d.v; L.res = d.v === o.it.a ? "ok" : "no"; mark(key, d.v === o.it.a); rerenderItem(key); break;
    case "retry": LIVE[key] = {}; rerenderItem(key); break;
    case "tag":
      o = itemFromKey(key);
      var roles = o.ex.roles, cur = L.tags[+d.ci], idx = cur ? roles.indexOf(cur) : -1;
      L.tags[+d.ci] = roles[(idx + 1) % roles.length]; L.res = null; rerenderItem(key); break;
    case "find": L.tags[+d.ci] = !L.tags[+d.ci]; L.res = null; rerenderItem(key); break;
    case "tcheck":
      o = itemFromKey(key);
      var cs = chunks(o.it.c), good = cs.every(function (c, i) { if (c.r === "-") return true; if (o.it.kind === "find") return !!L.tags[i] === (c.r === "y"); return L.tags[i] === c.r; });
      L.res = good ? "ok" : "no"; mark(key, good); rerenderItem(key); break;
    case "tshow":
      o = itemFromKey(key); L.tags = chunks(o.it.c).map(function (c) { return o.it.kind === "find" ? c.r === "y" : c.r; }); L.res = "ok"; rerenderItem(key); break;
    case "cycle":
      o = itemFromKey(key);
      var sl = o.it.p.filter(function (x) { return typeof x !== "string"; }), si = +d.si;
      L.sel[si] = (L.sel[si] + 1) % sl[si].o.length; L.res = null; rerenderItem(key); break;
    case "ccheck":
      o = itemFromKey(key);
      var gc = o.it.ok.some(function (cmb) { return cmb.every(function (v, i) { return L.sel[i] === v; }); });
      L.res = gc ? "ok" : "no"; mark(key, gc); rerenderItem(key); break;
    case "cshow": o = itemFromKey(key); L.sel = o.it.ok[0].slice(); L.res = "ok"; rerenderItem(key); break;
    case "bsel": L.sel = L.sel === +d.bi ? -1 : +d.bi; rerenderExercise(key); break;
    case "bput":
      var ii = +d.ii;
      if (L.sel >= 0) { L.fill = L.fill.map(function (f) { return f === L.sel ? -1 : f; }); L.fill[ii] = L.sel; L.sel = -1; }
      else if (L.fill[ii] >= 0) L.fill[ii] = -1;
      if (L.res) L.res[ii] = null; L.msg = ""; rerenderExercise(key); break;
    case "breset": LIVE[key] = { fill: L.fill.map(function () { return -1; }), sel: -1 }; rerenderExercise(key); break;
    case "bcheck":
      var pb = key.split("-"), ub = unitById(pb[0]), exb = ub.ex[+pb[1]];
      var acc = exb.parts ? exb.parts.filter(function (p) { return typeof p !== "string"; }) : exb.items;
      L.res = acc.map(function (it, i) { return L.fill[i] >= 0 && it.a.indexOf(L.fill[i]) >= 0; });
      L.res.forEach(function (r, i) { if (L.fill[i] >= 0) mark(ub.id + "-" + pb[1] + "-" + i, r); });
      var nOk = L.res.filter(Boolean).length;
      L.msg = nOk === acc.length ? '<span class="ok">Hepsi doğru!</span>' : '<span class="no">' + nOk + ' / ' + acc.length + ' doğru.</span> Kırmızı kutuları değiştir.';
      if (nOk === acc.length) confetti();
      rerenderExercise(key); break;
    case "qa": L.open = true; rerenderExercise(key); break;
    case "rcls":
      var pr = key.split("-"), exr = unitById(pr[0]).ex[+pr[1]], sub = pr[2].charAt(0) === "c" ? exr.cls : exr.cls2, itr = sub.items[+d.ii];
      L.ch = d.v; mark(key, d.v === itr.a);
      document.getElementById("it-" + key).innerHTML = clsInner(key, itr, +d.ii, sub.opts); break;
  }
});
main.addEventListener("change", function (ev) {
  var t = ev.target; if (!t.dataset || t.dataset.chk == null) return;
  var ch = store.get("check", {}); ch[t.dataset.chk] = t.checked; store.set("check", ch);
  var all = CHECK.every(function (_, i) { return ch[i]; }); if (all && t.checked) { confetti(); toast("Hepsi işaretli: quize hazırsın!"); }
});
function rerenderExercise(key) {
  var p = key.split("-"), u = unitById(p[0]), ei = +p[1], el = document.getElementById("ex-" + u.id + "-" + ei);
  if (!el) return;
  var tmp = document.createElement("div"); tmp.innerHTML = renderExercise(u, u.ex[ei], ei); el.replaceWith(tmp.firstChild);
}

/*OYUNLAR*/

document.getElementById("tabs").addEventListener("click", function (ev) {
  var b = ev.target.closest("button[data-tab]"); if (!b) return; setTab(b.dataset.tab); window.scrollTo({ top: 0 });
});
renderTabs(); renderXP(); setTab(ST.tab);
})();
</script>
