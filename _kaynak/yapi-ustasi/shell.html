<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="author" content="Hüseyin KAYA – Marmara Üniversitesi İlahiyat Fakültesi">
<title>Yapı Ustası</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/*__FONTS__*/
/* Layout: "Yapı Ustası" — İngilizce yapılar (Units 26–97): modal, if/wish, passive, reported speech, sorular, -ing/to, isimler ve article; Dönüştürücü, kelimeler, oyunlar, sınav. */
:root{
  --bg:#12100e; --panel:#1b1815; --panel2:#24201c; --ink:#f4efe9; --muted:#aaa196; --line:#3a332c;
  --gold:#f0a35c; --gold-ink:#2a1405; --gold-s:rgb(240 163 92 / .15);
  --good:#62d3a0; --good-s:rgb(98 211 160 / .14); --bad:#ff7d8b; --bad-s:rgb(255 125 139 / .14);
  --p1:#e8a05c; --p2:#5ec4b0; --p3:#8aa8f0; --p4:#d68ad8; --p5:#e8d36a; --p6:#ff8a7a; --p7:#7fd38a; --p8:#b9a0ff; --p9:#6ec8f0; --p10:#f0b8c8;
  --f-ui:"BLex","Segoe UI",system-ui,sans-serif; --f-ar:"BAmiri","Amiri","Traditional Arabic","Times New Roman",serif; --f-kufi:"BKufi","BAmiri",serif;
  --r:16px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f7f3ee; --panel:#ffffff; --panel2:#efe7dd; --ink:#211a14; --muted:#6a5e52; --line:#e0d4c5;
  --gold:#b4530f; --gold-ink:#fff; --gold-s:rgb(180 83 15 / .1);
  --good:#167a50; --good-s:rgb(22 122 80 / .11); --bad:#c23a4c; --bad-s:rgb(194 58 76 / .1);
  --p1:#b8641e; --p2:#14826f; --p3:#3a5fc0; --p4:#8f3fa6; --p5:#8a7410; --p6:#c2402e; --p7:#2e8a3c; --p8:#6a4fc4; --p9:#1f7fae; --p10:#b04a6e; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f7f3ee; --panel:#ffffff; --panel2:#efe7dd; --ink:#211a14; --muted:#6a5e52; --line:#e0d4c5;
  --gold:#b4530f; --gold-ink:#fff; --gold-s:rgb(180 83 15 / .1);
  --good:#167a50; --good-s:rgb(22 122 80 / .11); --bad:#c23a4c; --bad-s:rgb(194 58 76 / .1);
  --p1:#b8641e; --p2:#14826f; --p3:#3a5fc0; --p4:#8f3fa6; --p5:#8a7410; --p6:#c2402e; --p7:#2e8a3c; --p8:#6a4fc4; --p9:#1f7fae; --p10:#b04a6e; color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
h1,h2,h3{line-height:1.25;margin:0;text-wrap:balance;font-weight:700}
h2{font-size:1.35rem} h3{font-size:1.05rem}
p{margin:.45em 0}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;line-height:1.9}
.muted{color:var(--muted)} .small{font-size:.87rem} .tiny{font-size:.76rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .bar1{display:flex;align-items:center;gap:12px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand svg{flex:none}
.brand div{min-width:0}
.brand b{display:block;font-size:1.03rem;white-space:nowrap}
.brand span{display:block;font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.lvl{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.lvl .bar{width:70px;flex:none;height:6px;border-radius:9px;background:var(--panel2);overflow:hidden}
.lvl .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}
@media (max-width:560px){#lvlName{display:none}.lvl .bar{width:44px}}
.ib{border:1px solid var(--line);background:var(--panel2);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;flex:none}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 0 8px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);padding:7px 13px;border-radius:999px;font-size:.9rem;font-weight:600;border:1px solid transparent}
nav.tabs a.on{color:var(--gold-ink);background:var(--gold)}
nav.tabs a:not(.on):hover{border-color:var(--line);color:var(--ink)}
main{padding-block:20px 48px}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 15px;font-weight:600;font-size:.93rem;text-decoration:none;color:inherit;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;min-height:32px;font-size:.84rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:.8rem;background:var(--panel2)}
.chip.gold{border-color:transparent;background:var(--gold-s);color:var(--gold)}
.chip.good{border-color:transparent;background:var(--good-s);color:var(--good)}
.btn.good{border-color:var(--good);background:var(--good-s);color:var(--good)}
.btn.bad{border-color:var(--bad);background:var(--bad-s);color:var(--bad)}
.chip.bad{border-color:transparent;background:var(--bad-s);color:var(--bad)}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:28px 0 12px;flex-wrap:wrap}
.sec-h:first-child{margin-top:0}
.stars{color:var(--gold);letter-spacing:1px;font-size:.9rem}
.stars .off{color:var(--line)}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(1.8rem,4.4vw,2.6rem);letter-spacing:-.01em}
.hero .kufi{font-family:var(--f-kufi);font-size:clamp(1.9rem,5vw,2.9rem);color:var(--gold);direction:rtl;line-height:1.35}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat div{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px 14px;min-width:92px}
.stat b{display:block;font-size:1.25rem}
.stat span{font-size:.74rem;color:var(--muted)}
.scalebox{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:22px;padding:12px;display:grid;place-items:center}
.scalebox svg{width:100%;max-width:380px;height:auto}
.beam{transform-origin:200px 70px;transition:transform 1s cubic-bezier(.5,1.6,.4,1)}
/* path */
.path{display:grid;gap:10px;counter-reset:st}
.stop{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px;position:relative;transition:border-color .15s,transform .15s}
.stop:hover{border-color:var(--c,var(--gold));transform:translateX(2px)}
.stop .n{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:color-mix(in srgb,var(--c,var(--gold)) 20%,var(--panel2));border:2px solid var(--c,var(--gold))}
.stop.done .n{background:var(--c,var(--gold));color:#111}
.stop .t b{display:block}
.stop .t span{font-size:.84rem;color:var(--muted)}
.stop.lock{opacity:.55}
.part{display:flex;gap:10px;align-items:baseline;margin:22px 0 8px;flex-wrap:wrap}
.part b{font-size:1.02rem}
.part .ar{color:var(--muted)}
/* lesson */
.lhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.lbody{font-size:1.02rem}
.lbody p{margin:.6em 0}
.lbody ul,.lbody ol{padding-inline-start:1.3em;margin:.5em 0}
.lbody li{margin:.25em 0}
.term{border-bottom:1px dotted var(--gold);cursor:help}
.quote{border-inline-start:4px solid var(--c,var(--gold));background:color-mix(in srgb,var(--c,var(--gold)) 7%,var(--panel));border-radius:0 14px 14px 0;padding:10px 14px;margin:12px 0}
.quote .ar{font-size:1.32rem;display:block;text-align:right}
.quote .tr{display:block}
.quote .src{display:block;font-size:.78rem;color:var(--muted);margin-top:4px}
.say{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:2px 10px;font-size:.78rem;margin-inline-start:6px;vertical-align:middle}
.keybox{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel2);margin:14px 0}
.keybox h3{font-size:.92rem;margin-bottom:6px;color:var(--gold)}
.tbl{width:100%;border-collapse:collapse;font-size:.93rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:start;vertical-align:top}
.tbl th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tblw{overflow-x:auto}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle;font-weight:700;font-size:.92em;margin:0 2px}
.frac i{font-style:normal;border-bottom:1.5px solid currentColor;padding:0 3px 1px}
.frac u{text-decoration:none;padding:1px 3px 0}
.tree{display:flex;flex-direction:column;align-items:center;gap:8px;margin:12px 0}
.tree .lv{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tree .nd{border:1px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--panel2);font-size:.88rem;text-align:center}
.tree .nd.me{background:var(--gold);color:var(--gold-ink);border-color:transparent;font-weight:700}
.tree .ln{width:2px;height:12px;background:var(--line)}
/* quiz */
.q{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--panel);margin:10px 0}
.q .qt{font-weight:600;margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{text-align:start;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 13px;min-height:42px}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt.ok{border-color:var(--good);background:var(--good-s)}
.opt.no{border-color:var(--bad);background:var(--bad-s)}
.opt[disabled]{cursor:default}
.why{margin-top:8px;font-size:.9rem;color:var(--muted)}
.why b{color:var(--ink)}
.prog{height:8px;border-radius:9px;background:var(--panel2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
/* calculator */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
@media (max-width:860px){.calc{grid-template-columns:1fr}}
.heir{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.heir:last-child{border-bottom:none}
.heir .nm b{display:block;font-size:.95rem}
.heir .nm span{font-size:.76rem;color:var(--muted)}
.stp{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel2)}
.stp button{width:38px;height:38px;border:none;background:transparent;font-size:1.1rem;font-weight:700}
.stp output{min-width:30px;text-align:center;font-weight:700}
.tg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel2)}
.tg button{border:none;background:transparent;padding:7px 12px;font-weight:600;font-size:.86rem;min-height:38px}
.tg button.on{background:var(--gold);color:var(--gold-ink)}
.mini{font-size:.74rem;border:1px solid var(--line);border-radius:8px;padding:2px 7px;background:transparent;color:var(--muted)}
.mini.on{background:var(--bad-s);color:var(--bad);border-color:transparent}
.pie{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pie svg{width:190px;height:190px;flex:none}
.legend{display:grid;gap:6px;flex:1;min-width:200px}
.legend div{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.9rem}
.legend i{width:14px;height:14px;border-radius:4px}
.stack{display:flex;height:34px;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin:12px 0}
.stack div{display:grid;place-items:center;font-size:.72rem;font-weight:700;color:#111;min-width:0;overflow:hidden;white-space:nowrap;transition:flex .5s}
.steps{counter-reset:s;display:grid;gap:8px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:.92rem}
.steps li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--gold-s);color:var(--gold);font-weight:700;font-size:.8rem}
.res td:last-child,.res th:last-child{text-align:end}
.res .m td{color:var(--bad)}
.inp{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 12px;min-height:40px;width:100%}
/* games */
.gcard{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;transition:transform .15s,border-color .15s}
.gcard:hover{transform:translateY(-2px);border-color:var(--gold)}
.gcard .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--gold-s);color:var(--gold);margin-bottom:10px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:7px 14px;font-weight:600;min-height:40px}
.pill.on{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.pill.ok{background:var(--good-s);border-color:var(--good);color:var(--good)}
.pill.no{background:var(--bad-s);border-color:var(--bad);color:var(--bad)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.mt{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 12px;text-align:start;min-height:44px}
.mt.sel{border-color:var(--gold);background:var(--gold-s)}
.mt.done{opacity:.35;pointer-events:none}
.mt.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.big2{font-size:1.15rem;font-weight:600}
.verdict{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.verdict button{min-height:56px;font-size:1rem}
/* flashcards */
.fc{perspective:1200px;max-width:560px;margin:0 auto}
.fc .in{position:relative;min-height:240px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.f .in{transform:rotateY(180deg)}
.fc .sd{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:20px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;gap:8px}
.fc .bk{transform:rotateY(180deg);background:var(--panel2)}
.fc .ar{font-size:1.8rem}
/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:600;z-index:60;max-width:calc(100vw - 32px);box-shadow:0 8px 30px rgb(0 0 0 / .3)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:70}
.badge{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--panel2);border:2px solid var(--line);font-size:1.6rem}
.badge.on{border-color:var(--gold);background:var(--gold-s)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;text-align:center}
.bgrid .small{margin-top:6px}
details.more{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:10px 0;background:var(--panel)}
details.more summary{cursor:pointer;font-weight:600}

/* zaman makinesi */
.en{font-family:var(--f-ui);font-size:1.02rem}
.ex{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline;margin:6px 0}
.ex .tr{grid-column:2;font-size:.85rem;color:var(--muted)}
.spk{border:1px solid var(--line);background:var(--panel2);border-radius:999px;width:30px;height:30px;font-size:.8rem;display:inline-grid;place-items:center}
.formula{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:700;margin:8px 0}
.formula span{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.formula span.k{background:var(--gold-s);border-color:transparent;color:var(--gold)}
.wrong{color:var(--bad);text-decoration:line-through}
.rightc{color:var(--good);font-weight:600}
.tl svg{width:100%;max-width:560px;height:auto;display:block;margin:6px auto}
.fillin{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fillin input{flex:1;min-width:180px}
.hint{font-size:.82rem;color:var(--muted)}
.order{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:8px;border:1px dashed var(--line);border-radius:12px;margin:8px 0}
.conj{font-size:1.35rem;font-weight:700;line-height:1.5}
.conj .s{color:var(--p3)}.conj .a{color:var(--p6)}.conj .v{color:var(--p2)}.conj .o{color:var(--muted);font-weight:500}
.vtab td,.vtab th{padding:6px 8px}
.eyebrow{text-transform:none;letter-spacing:.05em;font-size:.78rem}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar1">
      <a class="brand" href="#home" aria-label="Ana sayfa">
        <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="22" width="13" height="11" rx="2" fill="var(--p2)"/><rect x="22" y="22" width="13" height="11" rx="2" fill="var(--p3)"/><rect x="13" y="9" width="14" height="11" rx="2" fill="var(--gold)"/></svg>
        <div><b>Yapı Ustası</b><span>English Structures · Units 26–97</span></div>
      </a>
      <span class="sp"></span>
      <div class="lvl" title="Seviye ve puan"><span id="lvlName">Starter</span><span class="bar"><i id="lvlBar"></i></span><b id="xp">0</b></div>
      <button class="ib" id="themeB" aria-label="Tema değiştir"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#home" data-v="home">Ana Sayfa</a>
      <a href="#yol" data-v="yol">Üniteler</a>
      <a href="#lab" data-v="lab">Dönüştürücü</a>
      <a href="#kelime" data-v="kelime">Kelimeler</a>
      <a href="#oyun" data-v="oyun">Oyunlar</a>
      <a href="#sinav" data-v="sinav">Sınav</a>
      <a href="#hakkinda" data-v="hakkinda">Program hakkında</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div><canvas id="cf" hidden></canvas>
