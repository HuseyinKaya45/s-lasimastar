<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="author" content="Hüseyin KAYA – Marmara Üniversitesi İlahiyat Fakültesi">
<title>En Sık 3000 Kelime</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="İngilizcede en sık kullanılan 3000 kelime: Türkçe anlam, örnek cümle, aralıklı tekrar, oyunlar ve sınav. Çevrimdışı çalışır.">
<style>
/*__FONTS__*/
</style>
<style>
/* Layout: "En Sık 3000 Kelime" — günlük çalışma, oyunlar, sözlük, ilerleme */
:root{
  --bg:#f6f4ee;--panel:#fff;--panel2:#eee9dd;--ink:#1d2a2e;--muted:#5d6b6f;--line:#ddd6c4;
  --acc:#b45309;--acc-ink:#fff;--acc-s:rgb(180 83 9/.1);--gold:#c98a12;--gold-s:rgb(201 138 18/.14);
  --good:#0c8f5e;--good-s:rgb(12 143 94/.14);--bad:#c2410c;--bad-s:rgb(194 65 12/.13);--r:16px;
  --f-ui:"Readex Pro","Segoe UI",system-ui,sans-serif;--f-ar:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1719;--panel:#162124;--panel2:#1d2b2f;--ink:#e8efef;--muted:#97aaae;--line:#2a3a3f;
  --acc:#fbbf24;--acc-ink:#2b1b03;--acc-s:rgb(251 191 36/.14);--gold:#ffc857;--gold-s:rgb(255 200 87/.14);
  --good:#3ddc97;--good-s:rgb(61 220 151/.14);--bad:#ff8a6b;--bad-s:rgb(255 138 107/.14);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719;--panel:#162124;--panel2:#1d2b2f;--ink:#e8efef;--muted:#97aaae;--line:#2a3a3f;
  --acc:#fbbf24;--acc-ink:#2b1b03;--acc-s:rgb(251 191 36/.14);--gold:#ffc857;--gold-s:rgb(255 200 87/.14);
  --good:#3ddc97;--good-s:rgb(61 220 151/.14);--bad:#ff8a6b;--bad-s:rgb(255 138 107/.14);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;font-weight:300;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}b,strong{font-weight:600}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-weight:700;line-height:1.2;margin:0}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;line-height:1.9}
.muted{color:var(--muted)}.small{font-size:.85rem}.tiny{font-size:.74rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
header.top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.top-in{max-width:980px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0}
.logo .m{width:34px;height:34px;border-radius:10px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-family:var(--f-ar);font-size:1.2rem;font-weight:700}
.logo b{font-size:1.02rem}
.nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.nav a{padding:6px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-size:.92rem;border:1px solid transparent}
.nav a.on{background:var(--acc-s);color:var(--ink);border-color:var(--acc);font-weight:600}
.hud{display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--panel2);font-size:.82rem;font-weight:600;white-space:nowrap}
.ib{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:34px;height:34px}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 16px;font-weight:600;color:var(--ink);text-decoration:none;display:inline-block;text-align:center}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.ghost{background:none}.btn.sm{padding:5px 11px;font-size:.88rem}.btn:disabled{opacity:.45;cursor:default}
.btn.good{background:var(--good-s);border-color:var(--good)}.btn.bad{background:var(--bad-s);border-color:var(--bad)}.btn.mid{background:var(--gold-s);border-color:var(--gold)}
.sec-h{display:flex;justify-content:space-between;align-items:end;margin:18px 0 10px;gap:10px}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.gcard{display:block;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--ink)}
.gcard:hover{border-color:var(--acc)}.gcard .ico{font-family:var(--f-ar);font-size:1.7rem;color:var(--acc);line-height:1.4;direction:rtl}
.gcard h3{font-size:1rem;margin:4px 0}.gcard p{margin:0;font-size:.84rem;color:var(--muted)}
.bar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;display:flex}.bar i{display:block;height:100%}
.stage{max-width:720px;margin:12px auto 0}.stage .hud2{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.q{text-align:center;margin:6px 0 12px;font-weight:600}
.qar{font-family:var(--f-ar);direction:rtl;text-align:center;font-size:2.4rem;line-height:1.7;font-weight:700}
.qs{font-family:var(--f-ar);direction:rtl;text-align:center;font-size:1.5rem;line-height:2;background:var(--panel2);border-radius:14px;padding:10px 14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}.opts.rtl{direction:rtl}
.opt{border:1.5px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px;font-weight:400;text-align:center}
.opt.ar{font-size:1.5rem;line-height:1.7}.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{background:var(--good-s);border-color:var(--good)}.opt.no{background:var(--bad-s);border-color:var(--bad)}
.fb{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--panel2);font-size:.92rem}
.fb.ok{background:var(--good-s)}.fb.no{background:var(--bad-s)}
.fb .ar{font-size:1.25rem}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;direction:rtl;margin:10px 0}
.tile{min-width:52px;height:60px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-family:var(--f-ar);font-size:1.8rem;display:grid;place-items:center;padding:0 8px}
.tile.ghost{opacity:.3}.slots{min-height:72px;border:2px dashed var(--line);border-radius:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;direction:rtl;padding:6px}
.timer{font-weight:700}.timer.low{color:var(--bad)}
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;cursor:pointer;text-align:center}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match .col{display:grid;gap:8px;align-content:start}
.mbtn{border:1.5px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 8px;min-height:50px}
.mbtn.ar{font-size:1.4rem;line-height:1.6}.mbtn.sel{border-color:var(--gold);background:var(--gold-s)}.mbtn.done{visibility:hidden}.mbtn.no{border-color:var(--bad);background:var(--bad-s)}
.scorebig{font-size:3rem;font-weight:700;color:var(--acc);text-align:center}
.wl{display:grid;gap:6px}.wi{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer}
.wi .ar{font-size:1.4rem;font-weight:700}.wd{grid-column:1/-1;display:none;font-size:.9rem}.wi.open .wd{display:block}
.wd .ar{font-size:1.15rem;font-weight:400}
input[type=search],input[type=text]{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);font-size:1rem}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.9rem;z-index:60}
.hud{margin-inline-start:auto}
@media (max-width:700px){.nav{order:3;flex:none;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.nav a{white-space:nowrap}.logo .m{width:auto;min-width:40px;padding:0 8px;height:32px;font-size:1rem}}
.qar{font-family:var(--f-ui);direction:ltr;font-weight:700;font-size:2.1rem;line-height:1.3;padding:8px 0}
.qs{font-family:var(--f-ui);direction:ltr;font-size:1.3rem;line-height:1.6}
.tile{font-family:var(--f-ui);font-size:1.5rem;font-weight:600;min-width:44px;height:52px}.tiles,.slots{direction:ltr}
.wi{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);align-items:baseline}.wi b{font-size:1.02rem}
select{padding:6px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);max-width:100%}
.flash .qar{font-size:2.2rem}
@media (max-width:560px){.qar{font-size:1.7rem}.nav a{padding:5px 9px;font-size:.86rem}.logo b{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="logo" href="#bugun" aria-label="En Sık 3000 Kelime"><span class="m">3000</span><b>En Sık 3000 Kelime</b></a>
  <nav class="nav" id="nav" aria-label="Bölümler">
    <a href="#bugun" data-v="bugun">Bugün</a><a href="#oyun" data-v="oyun">Oyunlar</a><a href="#sozluk" data-v="sozluk">Sözlük</a><a href="#ilerleme" data-v="ilerleme">İlerleme</a><a href="#hakkinda" data-v="hakkinda">Hakkında</a>
  </nav>
  <div class="hud"><span class="chip" id="hudXp">★ 0</span><button class="ib" id="tTheme" title="Tema" aria-label="Tema">◐</button></div>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>
