<meta charset="utf-8">
<meta name="author" content="Hüseyin KAYA – Marmara Üniversitesi İlahiyat Fakültesi">
<title>Lafız Pusulası</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*__FONTS__*/
/* Layout: "Lafız Pusulası" — Hanefî usulünün dört ayrımı bir pusulanın dört yönü: Kuzey vaz‘, Doğu isti‘mâl, Güney açıklık-kapalılık, Batı delâlet şekli. Nass Tahlil Masası, açıklık merdiveni, haml matrisi ve kuvvet terazisi. */
:root{
  --bg:#0b1517; --panel:#112124; --panel2:#182e32; --ink:#ecf3f1; --muted:#93aaa7; --line:#24413f;
  --gold:#e3b25c; --gold-ink:#1c1405; --gold-s:rgb(227 178 92 / .14);
  --root:#5fd3a0; --root-s:rgb(95 211 160 / .15); --zaid:#ff9f6e; --zaid-s:rgb(255 159 110 / .16);
  --good:#5fd3a0; --bad:#ff7a8a; --blue:#7fb2ff; --blue-s:rgb(127 178 255 / .15);
  --c-amil:#e3b25c; --c-mamul:#62c0ea; --c-irab:#bb94f0;
  --c-r:#5fd3a0; --c-n:#ffb454; --c-j:#7fb2ff; --c-z:#ff7a8a; --c-b:#b8b0d9;
  --g1:#f0995a; --g2:#4fc7b2; --g3:#86a6f0; --g4:#cf8ae0;
  --f-ui:"BLex","Segoe UI",system-ui,sans-serif; --f-ar:"BAmiri","Amiri","Traditional Arabic","Times New Roman",serif; --f-kufi:"BKufi","BAmiri",serif;
  --r:16px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f0e8; --panel:#fffdf8; --panel2:#ece6d8; --ink:#14282b; --muted:#56696a; --line:#d9d0bd;
  --gold:#9a6a12; --gold-ink:#fff; --gold-s:rgb(154 106 18 / .12);
  --root:#16855a; --root-s:rgb(22 133 90 / .11); --zaid:#c4582a; --zaid-s:rgb(196 88 42 / .11);
  --good:#16855a; --bad:#c43a4e; --blue:#2c5fc4; --blue-s:rgb(44 95 196 / .1);
  --c-amil:#9a6a12; --c-mamul:#1f7fae; --c-irab:#7a4fc0;
  --c-r:#16855a; --c-n:#b86e08; --c-j:#2c5fc4; --c-z:#c43a4e; --c-b:#6d6690;
  --g1:#b9581c; --g2:#13826f; --g3:#3a5fc0; --g4:#8c3fa6; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f0e8; --panel:#fffdf8; --panel2:#ece6d8; --ink:#14282b; --muted:#56696a; --line:#d9d0bd;
  --gold:#9a6a12; --gold-ink:#fff; --gold-s:rgb(154 106 18 / .12);
  --root:#16855a; --root-s:rgb(22 133 90 / .11); --zaid:#c4582a; --zaid-s:rgb(196 88 42 / .11);
  --good:#16855a; --bad:#c43a4e; --blue:#2c5fc4; --blue-s:rgb(44 95 196 / .1);
  --c-amil:#9a6a12; --c-mamul:#1f7fae; --c-irab:#7a4fc0;
  --c-r:#16855a; --c-n:#b86e08; --c-j:#2c5fc4; --c-z:#c43a4e; --c-b:#6d6690;
  --g1:#b9581c; --g2:#13826f; --g3:#3a5fc0; --g4:#8c3fa6; color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--panel)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
h1,h2,h3{line-height:1.2;margin:0;text-wrap:balance;font-weight:700}
h2{font-size:1.35rem} h3{font-size:1.05rem}
p{margin:.4em 0}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;line-height:1.85}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand svg{flex:none}
.brand b{display:block;font-size:1.02rem;white-space:nowrap}
.brand span{display:block;font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.lvl{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.lvl .bar{width:70px;flex:none;height:6px;border-radius:9px;background:var(--panel2);overflow:hidden}
.lvl .bar i{display:block;height:100%;background:var(--gold);width:0}
.brand div{min-width:0}
@media (max-width:560px){#lvlName{display:none}.lvl .bar{width:44px}}
.ib{border:1px solid var(--line);background:var(--panel2);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;flex:none}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 0 8px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);padding:7px 13px;border-radius:999px;font-size:.9rem;font-weight:600;border:1px solid transparent}
nav.tabs a.on{color:var(--gold-ink);background:var(--gold)}
nav.tabs a:not(.on):hover{border-color:var(--line);color:var(--ink)}
main{padding-block:20px 40px}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* generic */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 15px;font-weight:600;font-size:.93rem;text-decoration:none;color:inherit;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;min-height:32px;font-size:.84rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:.8rem;background:var(--panel2)}
.chip.gold{border-color:transparent;background:var(--gold-s);color:var(--gold)}
.chip.root{border-color:transparent;background:var(--root-s);color:var(--root)}
.chip.zaid{border-color:transparent;background:var(--zaid-s);color:var(--zaid)}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:26px 0 12px;flex-wrap:wrap}
.sec-h:first-child{margin-top:0}
.stars{color:var(--gold);letter-spacing:1px;font-size:.9rem}
.stars .off{color:var(--line)}
/* Hero / palace */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(1.7rem,4.2vw,2.5rem);letter-spacing:-.01em}
.hero .kufi{font-family:var(--f-kufi);font-size:clamp(1.8rem,5vw,2.8rem);color:var(--gold);direction:rtl;line-height:1.3}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat div{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px 14px;min-width:92px}
.stat b{display:block;font-size:1.25rem}
.stat span{font-size:.74rem;color:var(--muted)}
.palace{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:22px;padding:14px 12px 10px;position:relative;overflow:hidden}
.palace .dome{display:block;margin:0 auto -2px;width:100%;max-width:360px;height:auto}
.floor{border:1px solid var(--line);border-bottom:none;background:var(--panel);padding:8px 8px 6px;position:relative}
.floor:last-child{border-bottom:1px solid var(--line);border-radius:0 0 12px 12px}
.floor .fl{display:flex;justify-content:space-between;gap:6px;font-size:.68rem;color:var(--muted);margin-bottom:5px;font-weight:600;letter-spacing:.03em}
.wins{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;direction:rtl}
.win{width:46px;height:56px;border-radius:23px 23px 6px 6px;border:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:4px;font-size:.68rem;color:var(--muted);text-decoration:none;position:relative;transition:transform .15s}
.win:hover{transform:translateY(-2px);border-color:var(--gold)}
.win .ar{font-size:.72rem;line-height:1.2}
.win.l1{background:color-mix(in srgb,var(--gold) 18%,var(--panel2))}
.win.l2{background:color-mix(in srgb,var(--gold) 40%,var(--panel2));color:var(--ink)}
.win.l3{background:var(--gold);color:var(--gold-ink);box-shadow:0 0 16px color-mix(in srgb,var(--gold) 60%,transparent)}
.win b{font-size:.78rem}
/* bâb list */
.grp{border-inline-start:4px solid var(--c,var(--gold));padding-inline-start:12px;margin:22px 0 10px}
.grp h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.grp h3 .ar{font-weight:400;color:var(--muted);font-size:1.05rem}
.bcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.bcard{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:relative;transition:border-color .15s,transform .15s}
.bcard:hover{border-color:var(--c,var(--gold));transform:translateY(-1px)}
.bcard .vz{font-family:var(--f-ar);font-size:1.32rem;direction:rtl;text-align:right;line-height:1.7}
.bcard .mv{font-family:var(--f-ar);font-size:1.02rem;direction:rtl;text-align:right;color:var(--muted)}
.bcard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.76rem;color:var(--muted)}
.num{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:8px;background:var(--c,var(--gold));color:#fff;font-weight:700;font-size:.78rem;padding:0 6px}
/* lesson */
.lhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.lhead .big{font-family:var(--f-ar);font-size:clamp(1.9rem,6vw,2.9rem);direction:rtl;text-align:right;line-height:1.6}
.vbox{border:2px solid var(--c,var(--gold));border-radius:18px;padding:6px 18px;display:inline-block;background:color-mix(in srgb,var(--c,var(--gold)) 8%,transparent)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:14px}
.info .card h3{font-size:.95rem;display:flex;gap:8px;align-items:center;margin-bottom:6px}
.info .card .ar{font-size:1.12rem;color:var(--muted);text-align:right;margin-top:4px}
.ex{display:flex;flex-direction:column;gap:8px}
.ex div{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px dashed var(--line);border-radius:12px;padding:6px 12px;flex-wrap:wrap}
.ex .ar{font-size:1.3rem;color:var(--ink)!important;margin:0!important}
/* arrow map */
.maps{display:flex;gap:12px;flex-wrap:wrap;direction:rtl;justify-content:flex-start}
.map{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel);direction:ltr;flex:0 0 auto}
.map .mh,.map .mf{text-align:center;font-family:var(--f-ar);font-size:1.15rem;padding:2px 10px;background:color-mix(in srgb,var(--c,var(--gold)) 22%,var(--panel2))}
.map .mh small,.map .mf small{display:block;font-family:var(--f-ui);font-size:.64rem;color:var(--muted);line-height:1.2;padding-top:2px}
.cols{display:flex;direction:rtl;justify-content:center}
.col{width:30px;display:flex;flex-direction:column;align-items:center;padding:4px 0}
.col .t,.col .b{font-family:var(--f-ar);font-size:1.25rem;line-height:1.45;height:36px;display:flex;align-items:center}
.col.r{background:var(--root-s)}
.col.z{background:var(--zaid-s)}
.col.r .b{color:var(--root);font-weight:700}
.col.z .b{color:var(--zaid)}
.col .arr{width:2px;height:30px;background:currentColor;position:relative;color:var(--muted);transform-origin:top;animation:grow .5s ease both}
.col.r .arr{color:var(--root)} .col.z .arr{color:var(--zaid)}
.col .arr::after{content:"";position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top:7px solid currentColor;border-bottom:none}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
/* tables (RTL like the book) */
.tbl{width:100%;border-collapse:separate;border-spacing:0;direction:rtl;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tbl th{background:color-mix(in srgb,var(--c,var(--gold)) 22%,var(--panel2));font-weight:600;font-size:.8rem;padding:8px 6px;color:var(--ink)}
.tbl th .ar{display:block;font-size:1rem;line-height:1.4;color:var(--c,var(--gold))}
.tbl td{border-top:1px solid var(--line);padding:4px;text-align:center;font-family:var(--f-ar);font-size:1.2rem;line-height:1.6}
.tbl tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 55%,transparent)}
.tbl td.m{font-weight:700;color:var(--ink)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px}
.cell{width:100%;min-height:42px;border:1px dashed var(--line);border-radius:10px;background:transparent;font-family:var(--f-ar);font-size:1.15rem;line-height:1.5;color:var(--muted);padding:2px 4px}
.cell:hover{border-color:var(--gold);color:var(--gold)}
.cell.ok{border:1px solid transparent;background:var(--root-s);color:var(--ink);cursor:default}
.cell.shown{border:1px solid transparent;background:var(--zaid-s);color:var(--ink);cursor:default}
.cell.sel{border:2px solid var(--gold);color:var(--gold)}
.cell.wrong{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.solved td{background:var(--gold-s)!important}
/* picker sheet */
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;width:min(560px,100%);padding:16px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));box-shadow:0 -10px 40px rgb(0 0 0 / .3)}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:10px 8px;font-family:var(--f-ar);font-size:1.45rem;line-height:1.6;direction:rtl}
.opt:hover{border-color:var(--gold)}
.opt.ok{background:var(--root-s);border-color:var(--root)}
.opt.no{background:color-mix(in srgb,var(--bad) 15%,transparent);border-color:var(--bad);opacity:.8}
.opt.tr{font-family:var(--f-ui);font-size:.95rem;direction:ltr}
/* quiz/game shared */
.stage{max-width:720px;margin:0 auto}
.q{font-size:1.05rem;font-weight:600;margin-bottom:6px}
.qar{font-family:var(--f-ar);font-size:clamp(2rem,8vw,3rem);direction:rtl;text-align:center;line-height:1.6;margin:8px 0}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pbar{height:8px;border-radius:9px;background:var(--panel2);overflow:hidden;flex:1;min-width:120px}
.pbar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.fb{min-height:26px;font-weight:600;margin-top:10px;text-align:center}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.gcard{display:flex;flex-direction:column;gap:8px;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;color:inherit;text-decoration:none}
.gcard:hover{border-color:var(--gold)}
.gcard .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--gold-s);color:var(--gold)}
.gcard h3{font-size:1.02rem}
/* letters (tap) */
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;direction:rtl;margin:12px 0}
.tile{min-width:54px;height:64px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-family:var(--f-ar);font-size:1.9rem;line-height:1;display:grid;place-items:center;padding:0 8px;transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile.pick{background:var(--zaid-s);border-color:var(--zaid);color:var(--zaid)}
.tile.good{background:var(--root-s);border-color:var(--root);color:var(--root)}
.tile.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);border-color:var(--bad)}
.tile.ghost{opacity:.25;pointer-events:none}
.slots{display:flex;gap:6px;justify-content:center;direction:rtl;min-height:66px;flex-wrap:wrap;padding:8px;border:2px dashed var(--line);border-radius:16px}
/* scale (mîzan) */
.scale{display:block;margin:0 auto;width:100%;max-width:420px;height:auto}
.beam{transition:transform .6s cubic-bezier(.3,1.6,.5,1);transform-origin:210px 70px}
/* elevator */
.elev{display:grid;grid-template-columns:1fr;gap:6px}
.elev button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:start;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 14px;font-weight:600}
.elev button .ar{font-weight:400;color:var(--muted)}
.elev button:hover{border-color:var(--gold)}
.elev button.ok{background:var(--root-s);border-color:var(--root)}
.elev button.no{background:color-mix(in srgb,var(--bad) 15%,transparent);border-color:var(--bad)}
/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.mem{grid-template-columns:repeat(3,1fr)}}
.mc{aspect-ratio:1/1.05;border-radius:14px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-family:var(--f-ar);font-size:1.05rem;line-height:1.35;padding:4px;direction:rtl;position:relative;overflow:hidden}
.mc .back{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold-s),var(--panel2));color:var(--gold);font-size:1.4rem}
.mc.open .back,.mc.done .back{display:none}
.mc.done{background:var(--root-s);border-color:var(--root)}
/* bins (7 kapı) */
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:8px}
.bin{border:1px solid var(--line);border-radius:14px;background:var(--panel2);padding:10px 6px;text-align:center}
.bin b{display:block;font-size:.88rem}
.bin .ar{font-size:1.05rem;color:var(--muted);line-height:1.4}
.bin:hover{border-color:var(--gold)}
.bin.ok{background:var(--root-s);border-color:var(--root)} .bin.no{background:color-mix(in srgb,var(--bad) 15%,transparent);border-color:var(--bad)}
/* exam */
.qnav{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.qnav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:.8rem;font-weight:600}
.qnav button.ans{background:var(--blue-s);border-color:var(--blue)}
.qnav button.cur{outline:2px solid var(--gold)}
.qnav button.flag{box-shadow:inset 0 -3px 0 var(--zaid)}
.qnav button.r-ok{background:var(--root-s);border-color:var(--root)}
.qnav button.r-no{background:color-mix(in srgb,var(--bad) 18%,transparent);border-color:var(--bad)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
.opt.picked{border-color:var(--blue);background:var(--blue-s)}
.scorebig{font-size:3rem;font-weight:700;line-height:1;color:var(--gold)}
.bars{display:flex;flex-direction:column;gap:8px}
