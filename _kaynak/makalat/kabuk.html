  --g1: #8FAEDC; --g2: #B6A6DC; --g3: #A8B3BC; --g4: #D9A882; --g5: #7FC2A6; --g6: #E09AA2; --g7: #C9C486; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; }

.more { display: flex; justify-content: center; padding: 18px; color: var(--muted); }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }
