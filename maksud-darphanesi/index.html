/* Layout: "Maksûd Darphânesi" — masdar maden, vezin kalıp, sîga sikke. Ana sayfada sikke vitrini (dersler bakır/gümüş/altın); Darphâne’de kök basılır; İ‘lâl Ocağı’nda kelime aslından son şekline adım adım dönüşür. */
:root{
  --bg:#14100c; --panel:#1d1712; --panel2:#272019; --ink:#f3ebdf; --muted:#b2a28c; --line:#3a2f25;
  --gold:#e4b55a; --gold-ink:#1c1405; --gold-s:rgb(228 181 90 / .15);
  --root:#5fd3a0; --root-s:rgb(95 211 160 / .15); --zaid:#ff9f6e; --zaid-s:rgb(255 159 110 / .16);
  --good:#62d39f; --bad:#ff7d8a; --blue:#86b3ff; --blue-s:rgb(134 179 255 / .15);
  --c-amil:#e4b55a; --c-mamul:#62c0ea; --c-irab:#bb94f0;
  --c-r:#5fd3a0; --c-n:#ffb454; --c-j:#7fb2ff; --c-z:#ff7a8a; --c-b:#b8b0d9;
  --s1:#e0925a; --s2:#6cc6a9; --s3:#93abeb; --s4:#cf90dc; --s5:#f08070;
  --rf:#ff8f6b; --ra:#5fd3a0; --rl:#86b3ff;
  --f-ui:"BLex","Segoe UI",system-ui,sans-serif; --f-ar:"BAmiri","Amiri","Traditional Arabic","Times New Roman",serif; --f-kufi:"BKufi","BAmiri",serif;
  --r:16px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f5efe4; --panel:#fffcf6; --panel2:#efe5d4; --ink:#2a1f15; --muted:#6c5c48; --line:#ddd0ba;
  --gold:#9a6610; --gold-ink:#fff; --gold-s:rgb(154 102 16 / .12);
  --root:#16855a; --root-s:rgb(22 133 90 / .11); --zaid:#c4582a; --zaid-s:rgb(196 88 42 / .11);
  --good:#16855a; --bad:#c43a4e; --blue:#2c5fc4; --blue-s:rgb(44 95 196 / .1);
  --c-amil:#9a6610; --c-mamul:#1f7fae; --c-irab:#7a4fc0;
  --c-r:#16855a; --c-n:#b86e08; --c-j:#2c5fc4; --c-z:#c43a4e; --c-b:#6d6690;
  --s1:#b45a1c; --s2:#13806a; --s3:#3a5fc0; --s4:#8c3fa6; --s5:#c23b2a;
  --rf:#c2410c; --ra:#047857; --rl:#1d4ed8; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f5efe4; --panel:#fffcf6; --panel2:#efe5d4; --ink:#2a1f15; --muted:#6c5c48; --line:#ddd0ba;
  --gold:#9a6610; --gold-ink:#fff; --gold-s:rgb(154 102 16 / .12);
  --root:#16855a; --root-s:rgb(22 133 90 / .11); --zaid:#c4582a; --zaid-s:rgb(196 88 42 / .11);
  --good:#16855a; --bad:#c43a4e; --blue:#2c5fc4; --blue-s:rgb(44 95 196 / .1);
  --c-amil:#9a6610; --c-mamul:#1f7fae; --c-irab:#7a4fc0;
  --c-r:#16855a; --c-n:#b86e08; --c-j:#2c5fc4; --c-z:#c43a4e; --c-b:#6d6690;
  --s1:#b45a1c; --s2:#13806a; --s3:#3a5fc0; --s4:#8c3fa6; --s5:#c23b2a;
  --rf:#c2410c; --ra:#047857; --rl:#1d4ed8; color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--panel)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
h1,h2,h3{line-height:1.2;margin:0;text-wrap:balance;font-weight:700}
h2{font-size:1.35rem} h3{font-size:1.05rem}
p{margin:.4em 0}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;line-height:1.85}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand svg{flex:none}
.brand b{display:block;font-size:1.02rem;white-space:nowrap}
.brand span{display:block;font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.lvl{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.lvl .bar{width:70px;flex:none;height:6px;border-radius:9px;background:var(--panel2);overflow:hidden}
.lvl .bar i{display:block;height:100%;background:var(--gold);width:0}
.brand div{min-width:0}
@media (max-width:560px){#lvlName{display:none}.lvl .bar{width:44px}}
.ib{border:1px solid var(--line);background:var(--panel2);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;flex:none}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 0 8px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);padding:7px 13px;border-radius:999px;font-size:.9rem;font-weight:600;border:1px solid transparent}
nav.tabs a.on{color:var(--gold-ink);background:var(--gold)}
nav.tabs a:not(.on):hover{border-color:var(--line);color:var(--ink)}
main{padding-block:20px 40px}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* generic */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 15px;font-weight:600;font-size:.93rem;text-decoration:none;color:inherit;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;min-height:32px;font-size:.84rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:.8rem;background:var(--panel2)}
.chip.gold{border-color:transparent;background:var(--gold-s);color:var(--gold)}
.chip.root{border-color:transparent;background:var(--root-s);color:var(--root)}
.chip.zaid{border-color:transparent;background:var(--zaid-s);color:var(--zaid)}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:26px 0 12px;flex-wrap:wrap}
.sec-h:first-child{margin-top:0}
.stars{color:var(--gold);letter-spacing:1px;font-size:.9rem}
.stars .off{color:var(--line)}
/* Hero / palace */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(1.7rem,4.2vw,2.5rem);letter-spacing:-.01em}
.hero .kufi{font-family:var(--f-kufi);font-size:clamp(1.8rem,5vw,2.8rem);color:var(--gold);direction:rtl;line-height:1.3}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat div{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px 14px;min-width:92px}
.stat b{display:block;font-size:1.25rem}
.stat span{font-size:.74rem;color:var(--muted)}
.palace{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:22px;padding:14px 12px 10px;position:relative;overflow:hidden}
.palace .dome{display:block;margin:0 auto -2px;width:100%;max-width:360px;height:auto}
.floor{border:1px solid var(--line);border-bottom:none;background:var(--panel);padding:8px 8px 6px;position:relative}
.floor:last-child{border-bottom:1px solid var(--line);border-radius:0 0 12px 12px}
.floor .fl{display:flex;justify-content:space-between;gap:6px;font-size:.68rem;color:var(--muted);margin-bottom:5px;font-weight:600;letter-spacing:.03em}
.wins{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;direction:rtl}
.win{width:46px;height:56px;border-radius:23px 23px 6px 6px;border:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:4px;font-size:.68rem;color:var(--muted);text-decoration:none;position:relative;transition:transform .15s}
.win:hover{transform:translateY(-2px);border-color:var(--gold)}
.win .ar{font-size:.72rem;line-height:1.2}
.win.l1{background:color-mix(in srgb,var(--gold) 18%,var(--panel2))}
.win.l2{background:color-mix(in srgb,var(--gold) 40%,var(--panel2));color:var(--ink)}
.win.l3{background:var(--gold);color:var(--gold-ink);box-shadow:0 0 16px color-mix(in srgb,var(--gold) 60%,transparent)}
.win b{font-size:.78rem}
/* bâb list */
.grp{border-inline-start:4px solid var(--c,var(--gold));padding-inline-start:12px;margin:22px 0 10px}
.grp h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.grp h3 .ar{font-weight:400;color:var(--muted);font-size:1.05rem}
.bcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.bcard{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:relative;transition:border-color .15s,transform .15s}
.bcard:hover{border-color:var(--c,var(--gold));transform:translateY(-1px)}
.bcard .vz{font-family:var(--f-ar);font-size:1.32rem;direction:rtl;text-align:right;line-height:1.7}
.bcard .mv{font-family:var(--f-ar);font-size:1.02rem;direction:rtl;text-align:right;color:var(--muted)}
.bcard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.76rem;color:var(--muted)}
.num{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:8px;background:var(--c,var(--gold));color:#fff;font-weight:700;font-size:.78rem;padding:0 6px}
/* lesson */
.lhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.lhead .big{font-family:var(--f-ar);font-size:clamp(1.9rem,6vw,2.9rem);direction:rtl;text-align:right;line-height:1.6}
.vbox{border:2px solid var(--c,var(--gold));border-radius:18px;padding:6px 18px;display:inline-block;background:color-mix(in srgb,var(--c,var(--gold)) 8%,transparent)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:14px}
.info .card h3{font-size:.95rem;display:flex;gap:8px;align-items:center;margin-bottom:6px}
.info .card .ar{font-size:1.12rem;color:var(--muted);text-align:right;margin-top:4px}
.ex{display:flex;flex-direction:column;gap:8px}
.ex div{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px dashed var(--line);border-radius:12px;padding:6px 12px;flex-wrap:wrap}
.ex .ar{font-size:1.3rem;color:var(--ink)!important;margin:0!important}
/* arrow map */
.maps{display:flex;gap:12px;flex-wrap:wrap;direction:rtl;justify-content:flex-start}
.map{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel);direction:ltr;flex:0 0 auto}
.map .mh,.map .mf{text-align:center;font-family:var(--f-ar);font-size:1.15rem;padding:2px 10px;background:color-mix(in srgb,var(--c,var(--gold)) 22%,var(--panel2))}
.map .mh small,.map .mf small{display:block;font-family:var(--f-ui);font-size:.64rem;color:var(--muted);line-height:1.2;padding-top:2px}
.cols{display:flex;direction:rtl;justify-content:center}
.col{width:30px;display:flex;flex-direction:column;align-items:center;padding:4px 0}
.col .t,.col .b{font-family:var(--f-ar);font-size:1.25rem;line-height:1.45;height:36px;display:flex;align-items:center}
.col.r{background:var(--root-s)}
.col.z{background:var(--zaid-s)}
.col.r .b{color:var(--root);font-weight:700}
.col.z .b{color:var(--zaid)}
.col .arr{width:2px;height:30px;background:currentColor;position:relative;color:var(--muted);transform-origin:top;animation:grow .5s ease both}
.col.r .arr{color:var(--root)} .col.z .arr{color:var(--zaid)}
.col .arr::after{content:"";position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top:7px solid currentColor;border-bottom:none}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
/* tables (RTL like the book) */
.tbl{width:100%;border-collapse:separate;border-spacing:0;direction:rtl;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tbl th{background:color-mix(in srgb,var(--c,var(--gold)) 22%,var(--panel2));font-weight:600;font-size:.8rem;padding:8px 6px;color:var(--ink)}
.tbl th .ar{display:block;font-size:1rem;line-height:1.4;color:var(--c,var(--gold))}
.tbl td{border-top:1px solid var(--line);padding:4px;text-align:center;font-family:var(--f-ar);font-size:1.2rem;line-height:1.6}
.tbl tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 55%,transparent)}
.tbl td.m{font-weight:700;color:var(--ink)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px}
.cell{width:100%;min-height:42px;border:1px dashed var(--line);border-radius:10px;background:transparent;font-family:var(--f-ar);font-size:1.15rem;line-height:1.5;color:var(--muted);padding:2px 4px}
.cell:hover{border-color:var(--gold);color:var(--gold)}
.cell.ok{border:1px solid transparent;background:var(--root-s);color:var(--ink);cursor:default}
.cell.shown{border:1px solid transparent;background:var(--zaid-s);color:var(--ink);cursor:default}
.cell.sel{border:2px solid var(--gold);color:var(--gold)}
.cell.wrong{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.solved td{background:var(--gold-s)!important}
/* picker sheet */
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;width:min(560px,100%);padding:16px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));box-shadow:0 -10px 40px rgb(0 0 0 / .3)}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:10px 8px;font-family:var(--f-ar);font-size:1.45rem;line-height:1.6;direction:rtl}
.opt:hover{border-color:var(--gold)}
.opt.ok{background:var(--root-s);border-color:var(--root)}
.opt.no{background:color-mix(in srgb,var(--bad) 15%,transparent);border-color:var(--bad);opacity:.8}
.opt.tr{font-family:var(--f-ui);font-size:.95rem;direction:ltr}
/* quiz/game shared */
.stage{max-width:720px;margin:0 auto}
.q{font-size:1.05rem;font-weight:600;margin-bottom:6px}
.qar{font-family:var(--f-ar);font-size:clamp(2rem,8vw,3rem);direction:rtl;text-align:center;line-height:1.6;margin:8px 0}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pbar{height:8px;border-radius:9px;background:var(--panel2);overflow:hidden;flex:1;min-width:120px}
.pbar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.fb{min-height:26px;font-weight:600;margin-top:10px;text-align:center}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.gcard{display:flex;flex-direction:column;gap:8px;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;color:inherit;text-decoration:none}
.gcard:hover{border-color:var(--gold)}
.gcard .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--gold-s);color:var(--gold)}
.gcard h3{font-size:1.02rem}
/* letters (tap) */
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;direction:rtl;margin:12px 0}
.tile{min-width:54px;height:64px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-family:var(--f-ar);font-size:1.9rem;line-height:1;display:grid;place-items:center;padding:0 8px;transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile.pick{background:var(--zaid-s);border-color:var(--zaid);color:var(--zaid)}
.tile.good{background:var(--root-s);border-color:var(--root);color:var(--root)}
.tile.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);border-color:var(--bad)}
.tile.ghost{opacity:.25;pointer-events:none}
.slots{display:flex;gap:6px;justify-content:center;direction:rtl;min-height:66px;flex-wrap:wrap;padding:8px;border:2px dashed var(--line);border-radius:16px}
/* scale (mîzan) */
.scale{display:block;margin:0 auto;width:100%;max-width:420px;height:auto}
.beam{transition:transform .6s cubic-bezier(.3,1.6,.5,1);transform-origin:210px 70px}
/* elevator */
.elev{display:grid;grid-template-columns:1fr;gap:6px}
.elev button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:start;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 14px;font-weight:600}
.elev button .ar{font-weight:400;color:var(--muted)}
.elev button:hover{border-color:var(--gold)}
.elev button.ok{background:var(--root-s);border-color:var(--root)}
.elev button.no{background:color-mix(in srgb,var(--bad) 15%,transparent);border-color:var(--bad)}
/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.mem{grid-template-columns:repeat(3,1fr)}}
.mc{aspect-ratio:1/1.05;border-radius:14px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-family:var(--f-ar);font-size:1.05rem;line-height:1.35;padding:4px;direction:rtl;position:relative;overflow:hidden}
.mc .back{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold-s),var(--panel2));color:var(--gold);font-size:1.4rem}
.mc.open .back,.mc.done .back{display:none}
.mc.done{background:var(--root-s);border-color:var(--root)}
/* bins (7 kapı) */
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:8px}
.bin{border:1px solid var(--line);border-radius:14px;background:var(--panel2);padding:10px 6px;text-align:center}
.bin b{display:block;font-size:.88rem}
.bin .ar{font-size:1.05rem;color:var(--muted);line-height:1.4}
.bin:hover{border-color:var(--gold)}
.bin.ok{background:var(--root-s);border-color:var(--root)} .bin.no{background:color-mix(in srgb,var(--bad) 15%,transparent);border-color:var(--bad)}
/* exam */
.qnav{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.qnav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:.8rem;font-weight:600}
.qnav button.ans{background:var(--blue-s);border-color:var(--blue)}
.qnav button.cur{outline:2px solid var(--gold)}
.qnav button.flag{box-shadow:inset 0 -3px 0 var(--zaid)}
.qnav button.r-ok{background:var(--root-s);border-color:var(--root)}
.qnav button.r-no{background:color-mix(in srgb,var(--bad) 18%,transparent);border-color:var(--bad)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
.opt.picked{border-color:var(--blue);background:var(--blue-s)}
.scorebig{font-size:3rem;font-weight:700;line-height:1;color:var(--gold)}
.bars{display:flex;flex-direction:column;gap:8px}
.bars div{display:grid;grid-template-columns:minmax(110px,170px) 1fr 46px;gap:8px;align-items:center;font-size:.86rem}
.bars .pbar{height:10px}
.rev{border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:8px}
.rev.ok{border-inline-start:4px solid var(--good)} .rev.no{border-inline-start:4px solid var(--bad)}
.check{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);cursor:pointer}
.check input{margin-top:4px;accent-color:var(--gold)}
.field{display:flex;flex-direction:column;gap:4px;font-size:.86rem}
.field input,.field select{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 10px}
/* certificate (print) */
.cert{border:3px double var(--gold);border-radius:18px;padding:26px;text-align:center;background:var(--panel)}
.cert .kufi{font-family:var(--f-kufi);font-size:2rem;color:var(--gold);direction:rtl}
@media print{
  .top,nav,.noprint,footer.credit-foot,#toast{display:none!important}
  body{background:#fff;color:#000}
  .cert{border-color:#b9831b;color:#000;background:#fff}
}
/* tree diagrams */
.tree{display:flex;flex-direction:column;align-items:center;gap:0}
.tnode{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:6px 12px;font-family:var(--f-ar);font-size:1.1rem;line-height:1.5;text-align:center;direction:rtl}
.tnode small{display:block;font-family:var(--f-ui);font-size:.68rem;color:var(--muted);direction:ltr;line-height:1.2}
.tkids{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;direction:rtl;position:relative;padding-top:18px}
.tkids::before{content:"";position:absolute;top:0;left:50%;width:2px;height:12px;background:var(--line)}
.tbranch{display:flex;flex-direction:column;align-items:center;gap:8px}
.tleaf{border-radius:10px;padding:3px 10px;font-family:var(--f-ar);font-size:1.05rem;background:var(--gold-s);color:var(--gold)}
.idg{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center}
.idg .tag{font-weight:700;color:var(--gold)}
/* flashcard */
.flash{perspective:1000px;max-width:420px;margin:10px auto}
.flash .in{position:relative;height:230px;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
.flash .bk{transform:rotateY(180deg);background:linear-gradient(160deg,var(--panel),var(--panel2))}
/* toast etc */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:80;font-weight:600;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 30px rgb(0 0 0 / .3)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:90;width:100%;height:100%}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:.82rem;background:var(--panel2);opacity:.45}
.badge.on{opacity:1;border-color:var(--gold);background:var(--gold-s)}
.kbd{display:flex;flex-wrap:wrap;gap:5px;direction:rtl;justify-content:center}
.kbd button{width:38px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-family:var(--f-ar);font-size:1.3rem}
.kbd button:hover{border-color:var(--gold)}
.rootbox{display:flex;gap:6px;direction:rtl;justify-content:center}
.rootbox span{width:52px;height:56px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-ar);font-size:1.8rem;color:var(--root)}
.rootbox span.f{border-style:solid;border-color:var(--root);background:var(--root-s)}
.gen{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.gen>div{border:1px solid var(--line);border-radius:12px;padding:6px 10px;text-align:center;background:var(--panel2)}
.gen>div .ar{font-size:1.4rem}
.steps{display:flex;gap:6px;margin-bottom:10px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--panel2)}
.steps i.on{background:var(--gold)}
.filter{display:flex;gap:6px;flex-wrap:wrap}
.filter button{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:600}
.filter button.on{background:var(--gold);color:var(--gold-ink);border-color:transparent}
input.search{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 12px;min-width:0;flex:1}
/* Arapça akış: bâblar, çekimler ve Arapça seçenekler sağdan sola dizilir */
.bcards,.gen,.opts,.mem,#bs,.wins{direction:rtl}
.bcard,.gen>div,.mc{direction:ltr}
.opt.tr{direction:ltr}
/* ---- ortak bileşenler ---- */
.sky{position:relative;border-radius:22px;overflow:hidden;background:radial-gradient(120% 90% at 70% 0%,var(--sky1),var(--sky2));border:1px solid var(--line);color:#eef0fb}
.sky svg{display:block;width:100%;height:auto}
.sky .star{cursor:pointer}
.sky .star circle.core{transition:r .3s}
.sky .star:hover circle.halo,.sky .star:focus circle.halo{opacity:.9}
.sky text{font-family:var(--f-ui);fill:#cfd5f5}
.sky .cname{font-family:var(--f-kufi);font-size:20px;fill:currentColor;opacity:.9}
.sky .tip{position:absolute;pointer-events:none;background:#0b1030ee;color:#eef0fb;border:1px solid #3a4580;border-radius:10px;padding:6px 10px;font-size:.8rem;transform:translate(-50%,-120%);white-space:nowrap}
.legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px;vertical-align:-1px}
.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.tw{animation:none}}
.counter{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.counter div{border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center;background:var(--panel)}
.counter b{display:block;font-size:1.9rem;line-height:1.1}
.counter .ar{font-size:1rem;color:var(--muted);display:block;line-height:1.4}
/* lesson */
.matn{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,var(--panel),var(--panel2));padding:16px 18px;position:relative}
.matn::before{content:"المتن";position:absolute;top:-11px;inset-inline-end:18px;background:var(--gold);color:var(--gold-ink);font-family:var(--f-ar);font-size:.85rem;padding:0 10px;border-radius:8px;line-height:1.6}
.matn p{font-family:var(--f-ar);direction:rtl;text-align:justify;font-size:1.32rem;line-height:2.05;margin:.2em 0}
.serh{font-size:1rem;line-height:1.7}
.serh ul,.serh ol{padding-inline-start:20px;margin:.4em 0}
.serh li{margin:.2em 0}
.serh .ar,.ex .ar{font-size:1.15em}
table.mini{border-collapse:collapse;margin:.5em 0;font-size:.92rem}
table.mini td,table.mini th{border:1px solid var(--line);padding:4px 10px;text-align:start}
.qz{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px;background:var(--panel)}
.qz .opts{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.qz .opt{font-size:1rem}
.qz .opt.ar1{font-family:var(--f-ar);font-size:1.3rem;direction:rtl}
.lnav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lcard{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.lcard:hover{border-color:var(--c,var(--gold))}
.lcard .num{flex:none}
.lcard .tt{flex:1;min-width:0}
.lcard .tt b{display:block;font-size:.95rem}
.lcard .tt .ar{font-size:1rem;color:var(--muted);line-height:1.5;display:block}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
/* lab */

/* ---------- 0. MUKADDİME ---------- */
{id:'d1',k:0,p:3,t:'Mukaddime: Arapça ve tasrîf',ar:'الْعَرَبِيَّةُ وَسِيلَةٌ',
 m:['الْحَمْدُ لِلّٰهِ الْوَهَّابِ لِلْمُؤْمِنِينَ سَبِيلَ الصَّوَابِ، وَالصَّلَاةُ وَالسَّلَامُ عَلَى نَبِيِّهِ مُحَمَّدٍ الزَّاجِرِ عَنِ الْإِذْنَابِ، الْحَاثِّ عَلَى طَلَبِ الثَّوَابِ، وَعَلَى آلِهِ وَأَصْحَابِهِ خَيْرِ الْآلِ وَخَيْرِ الْأَصْحَابِ.','أَمَّا بَعْدُ: فَإِنَّ الْعَرَبِيَّةَ وَسِيلَةٌ إِلَى الْعُلُومِ الشَّرْعِيَّةِ، وَأَحَدُ أَرْكَانِهَا «التَّصْرِيفُ»، لِأَنَّهُ بِهِ يَصِيرُ الْقَلِيلُ مِنَ الْأَفْعَالِ كَثِيرًا. وَاللّٰهُ الْمُوَفِّقُ وَالْمُرْشِدُ.'],
 tr:'<p>Kitâbü’l-Maksûd, müellifi kesin bilinmeyen (İmam-ı A‘zam Ebû Hanîfe’ye de nispet edilen), medreselerde Emsile ve Binâ’dan sonra okunan özlü bir sarf metnidir. Müellif, Arapçanın şer‘î ilimlere <b>vesile</b> olduğunu, onun rükünlerinden birinin de <b>tasrîf</b> (sarf) olduğunu söyler; çünkü tasrîf sayesinde <b>az sayıdaki fiil çoğalır</b>: tek bir kökten onlarca kelime “basılır”.</p><p class="small muted">Dipnotta tasrîf ilmi: “Kelimelerin i‘râb dışındaki hâllerinin bilindiği ilim”; Zencânî’ye göre: “Tek bir aslı, ancak onlarla elde edilebilecek maksûd mânâlar için farklı misallere dönüştürmek.” Kitabın adı da buradan gelir: <i>el-Maksûd</i>.</p>',
 ex:[['التَّصْرِيفُ','Tasrîf: değiştirmek, çevirmek.'],['يَصِيرُ الْقَلِيلُ مِنَ الْأَفْعَالِ كَثِيرًا','Az fiil, tasrîf ile çok olur.']],
 q:[['Müellife göre tasrîf neden önemlidir?',['Onunla az fiil çok olur','İ‘râbı öğretir','Belâgatın temelidir','Kelimeleri ezberletir'],0,'«لِأَنَّهُ بِهِ يَصِيرُ الْقَلِيلُ مِنَ الْأَفْعَالِ كَثِيرًا»'],['Arapça hangi ilimlere vesiledir?',['Şer‘î ilimlere','Tıbba','Matematiğe','Mantığa'],0,'«وَسِيلَةٌ إِلَى الْعُلُومِ الشَّرْعِيَّةِ»'],['Tasrîf ilmi kelimelerin hangi hâllerini inceler?',['İ‘râb dışındaki bina hâllerini','Yalnız i‘râbını','Mânâ inceliklerini','Yazılışını'],0,'Dipnottaki tarif.']]},
/* ---------- 1. BÂBLAR ---------- */
{id:'d2',k:1,p:4,t:'Sülâsî mücerredin altı bâbı',ar:'أَبْوَابُ الثُّلَاثِيِّ الْمُجَرَّدِ',
 m:['الْأَفْعَالُ عَلَى ضَرْبَيْنِ: أَصْلِيٌّ، وَذُو زِيَادَةٍ. فَالْأَصْلِيُّ: ثُلَاثِيٌّ، وَرُبَاعِيٌّ. فَالثُّلَاثِيُّ: مَا كَانَ مَاضِيهِ عَلَى ثَلَاثَةِ أَحْرُفٍ. وَهُوَ سِتَّةُ أَبْوَابٍ:','الْأَوَّلُ: فَعَلَ يَفْعُلُ، بِفَتْحِ الْعَيْنِ فِي الْمَاضِي وَضَمِّهَا فِي الْغَابِرِ. وَالثَّانِي: فَعَلَ يَفْعِلُ، بِفَتْحِهَا فِي الْمَاضِي وَكَسْرِهَا فِي الْغَابِرِ. وَالثَّالِثُ: فَعَلَ يَفْعَلُ، بِفَتْحِهَا فِي الْمَاضِي وَالْغَابِرِ. وَالرَّابِعُ: فَعِلَ يَفْعَلُ، بِكَسْرِهَا فِي الْمَاضِي وَفَتْحِهَا فِي الْغَابِرِ. وَالْخَامِسُ: فَعُلَ يَفْعُلُ، بِضَمِّهَا فِي الْمَاضِي وَالْغَابِرِ. وَالسَّادِسُ: فَعِلَ يَفْعِلُ، بِكَسْرِهَا فِي الْمَاضِي وَالْغَابِرِ.','وَمَا كَانَ مُخْتَصًّا بِالْبَابِ الثَّالِثِ لَا يَكُونُ عَيْنُهُ أَوْ لَامُهُ إِلَّا حَرْفًا مِنْ حُرُوفِ الْحَلْقِ، إِلَّا «أَبَى يَأْبَى»، وَهُوَ شَاذٌّ. وَحُرُوفُ الْحَلْقِ سِتَّةٌ: الْحَاءُ، وَالْخَاءُ، وَالْعَيْنُ، وَالْغَيْنُ، وَالْهَاءُ، وَالْهَمْزَةُ.'],
 tr:'<p>Fiiller iki türlüdür: <b>aslî</b> (mücerred) ve <b>zâid</b> (mezîd). Aslî fiil ya <b>sülâsî</b> ya <b>rubâî</b>dir. Sülâsî, mâzisi üç harfli olandır ve <b>altı bâb</b>ı vardır. Bâbları ayıran, aynü’l-fiilin mâzideki ve <b>gâbir</b>deki (muzâri) harekesidir.</p><table class="mini"><tr><th>Bâb</th><th>Vezin</th><th>Misal</th><th>Mâzi / gâbir</th></tr><tr><td>1</td><td class="a">فَعَلَ يَفْعُلُ</td><td class="a">نَصَرَ يَنْصُرُ</td><td>üstün / ötre</td></tr><tr><td>2</td><td class="a">فَعَلَ يَفْعِلُ</td><td class="a">ضَرَبَ يَضْرِبُ</td><td>üstün / esre</td></tr><tr><td>3</td><td class="a">فَعَلَ يَفْعَلُ</td><td class="a">فَتَحَ يَفْتَحُ</td><td>üstün / üstün</td></tr><tr><td>4</td><td class="a">فَعِلَ يَفْعَلُ</td><td class="a">عَلِمَ يَعْلَمُ</td><td>esre / üstün</td></tr><tr><td>5</td><td class="a">فَعُلَ يَفْعُلُ</td><td class="a">كَرُمَ يَكْرُمُ</td><td>ötre / ötre</td></tr><tr><td>6</td><td class="a">فَعِلَ يَفْعِلُ</td><td class="a">حَسِبَ يَحْسِبُ</td><td>esre / esre</td></tr></table><p><b>Dikkat:</b> Maksûd’un sırası Emsile’den farklıdır: Maksûd’da <b>5. bâb كَرُمَ</b>, <b>6. bâb حَسِبَ</b>’dir.</p><p><b>Üçüncü bâb kuralı:</b> Yalnız bu bâba ait fiillerin ayn veya lâmı mutlaka <b>boğaz harfi</b>dir: ح خ ع غ ه ء. <span class="ar">أَبَى يَأْبَى</span> bunun dışında kalan <b>şâz</b> bir örnektir.</p>',
 ex:[['نَصَرَ يَنْصُرُ','1. bâb'],['ضَرَبَ يَضْرِبُ','2. bâb'],['فَتَحَ يَفْتَحُ','3. bâb: ayn ح (boğaz harfi)'],['عَلِمَ يَعْلَمُ','4. bâb'],['كَرُمَ يَكْرُمُ','5. bâb'],['حَسِبَ يَحْسِبُ','6. bâb'],['أَبَى يَأْبَى','3. bâbda şâz: boğaz harfi yok']],
 q:[['Maksûd’a göre beşinci bâb hangisidir?',['فَعُلَ يَفْعُلُ','فَعِلَ يَفْعِلُ','فَعِلَ يَفْعَلُ','فَعَلَ يَفْعَلُ'],0,'Maksûd’da 5. bâb كَرُمَ يَكْرُمُ.'],['“Gâbir” ne demektir?',['Muzâri (geniş/gelecek zaman)','Mâzi','Emir','Masdar'],0,'Metin muzâri için “gâbir” der.'],['Üçüncü bâba has fiillerin ayn veya lâmı nedir?',['Boğaz harfi','Harf-i illet','Hemze','Şeddeli harf'],0,'حروف الحلق: ح خ ع غ ه ء.'],['أَبَى يَأْبَى neden şâzdır?',['3. bâbdan olduğu hâlde ayn ve lâmında boğaz harfi yok','Mezîd olduğu için','Rubâî olduğu için','Mehmûz olduğu için'],0,'Hemze fâdadır, ayn ve lâmda değil.'],['Boğaz harfleri kaç tanedir?',['Altı','Dört','Beş','Yedi'],0,'ح خ ع غ ه ء']]},
{id:'d3',k:1,p:5,t:'Rubâî mücerred ve mülhakları',ar:'الرُّبَاعِيُّ الْمُجَرَّدُ وَالْمُلْحَقُ بِهِ',
 m:['وَالرُّبَاعِيُّ الْمُجَرَّدُ: مَا كَانَ مَاضِيهِ عَلَى أَرْبَعَةِ أَحْرُفٍ. وَهُوَ: بَابُ «فَعْلَلَ»، نَحْوُ: «دَحْرَجَ». وَهُوَ بَابٌ وَاحِدٌ.','وَقَدْ يَكُونُ سِتَّةَ أَبْوَابٍ يُقَالُ لَهَا: «الْمُلْحَقُ بِالرُّبَاعِيِّ». وَهُوَ بَابُ: فَوْعَلَ، نَحْوُ: «حَوْقَلَ». وَفَعْوَلَ، نَحْوُ: «جَهْوَرَ». وَفَيْعَلَ، نَحْوُ: «بَيْطَرَ». وَفَعْيَلَ، نَحْوُ: «عَثْيَرَ». وَفَعْلَى، نَحْوُ: «سَلْقَى». وَفَعْلَلَ، نَحْوُ: «جَلْبَبَ».'],
 tr:'<p><b>Rubâî mücerred</b>: mâzisi dört aslî harfli fiil. Tek bâbı vardır: <span class="ar">فَعْلَلَ</span> (<span class="ar">دَحْرَجَ</span> yuvarladı).</p><p><b>Mülhak bi’r-rubâî</b>: sülâsî bir köke bir harf eklenerek rubâî vezne <b>ilhak</b> edilmiş (benzetilmiş) altı bâb. Bunlar rubâî gibi çekilir: <span class="ar">حَوْقَلَ يُحَوْقِلُ حَوْقَلَةً</span>.</p><table class="mini"><tr><th>#</th><th>Vezin</th><th>Misal</th><th>Eklenen</th></tr><tr><td>1</td><td class="a">فَوْعَلَ</td><td class="a">حَوْقَلَ</td><td>fâdan sonra vav</td></tr><tr><td>2</td><td class="a">فَعْوَلَ</td><td class="a">جَهْوَرَ</td><td>aynden sonra vav</td></tr><tr><td>3</td><td class="a">فَيْعَلَ</td><td class="a">بَيْطَرَ</td><td>fâdan sonra yâ</td></tr><tr><td>4</td><td class="a">فَعْيَلَ</td><td class="a">عَثْيَرَ</td><td>aynden sonra yâ</td></tr><tr><td>5</td><td class="a">فَعْلَى</td><td class="a">سَلْقَى</td><td>sonda yâ (elif)</td></tr><tr><td>6</td><td class="a">فَعْلَلَ</td><td class="a">جَلْبَبَ</td><td>lâmın tekrarı</td></tr></table>',
 ex:[['دَحْرَجَ يُدَحْرِجُ دَحْرَجَةً وَدِحْرَاجًا','Rubâî mücerred'],['حَوْقَلَ','فَوْعَلَ'],['جَهْوَرَ','فَعْوَلَ'],['بَيْطَرَ','فَيْعَلَ'],['عَثْيَرَ','فَعْيَلَ'],['سَلْقَى','فَعْلَى'],['جَلْبَبَ','فَعْلَلَ (lâm tekrarı)']],
 q:[['Rubâî mücerredin kaç bâbı vardır?',['Bir','İki','Üç','Altı'],0,'Yalnız فَعْلَلَ.'],['حَوْقَلَ hangi vezindedir?',['فَوْعَلَ','فَعْوَلَ','فَيْعَلَ','فَعْيَلَ'],0,'Fâdan sonra vav.'],['بَيْطَرَ hangi vezindedir?',['فَيْعَلَ','فَعْيَلَ','فَوْعَلَ','فَعْلَى'],0,'Fâdan sonra yâ.'],['Mülhak bâblar kaç tanedir?',['Altı','Üç','Beş','On dört'],0,'سِتَّةُ أَبْوَابٍ'],['جَلْبَبَ’de ilhak nasıl olmuştur?',['Lâm tekrarlanmıştır','Vav eklenmiştir','Yâ eklenmiştir','Hemze eklenmiştir'],0,'فَعْلَلَ: ج ل ب + ب']]},
{id:'d4',k:1,p:5,t:'Mezîd sülâsî: on dört bâb',ar:'الْمَزِيدُ فِيهِ عَلَى الثُّلَاثِيِّ',
 m:['وَأَمَّا «الْمَزِيدُ فِيهِ» فَنَوْعَانِ: مَزِيدٌ عَلَى الثُّلَاثِيِّ، وَمَزِيدٌ عَلَى الرُّبَاعِيِّ. فَمَزِيدُ الثُّلَاثِيِّ أَرْبَعَةَ عَشَرَ بَابًا، وَهِيَ ثَلَاثَةُ أَنْوَاعٍ: رُبَاعِيٌّ، وَخُمَاسِيٌّ، وَسُدَاسِيٌّ.','فَالرُّبَاعِيُّ عَلَى ثَلَاثَةِ أَبْوَابٍ: أَفْعَلَ، وَفَعَّلَ -بِتَشْدِيدِ الْعَيْنِ-، وَفَاعَلَ.','وَالْخُمَاسِيُّ خَمْسَةُ أَبْوَابٍ: اِنْفَعَلَ، وَافْتَعَلَ، وَافْعَلَّ -بِتَشْدِيدِ اللَّامِ-، وَتَفَعَّلَ -بِتَشْدِيدِ الْعَيْنِ-، وَتَفَاعَلَ.','وَالسُّدَاسِيُّ سِتَّةُ أَبْوَابٍ: اِسْتَفْعَلَ، وَافْعَوْعَلَ، وَافْعَوَّلَ -بِتَشْدِيدِ الْوَاوِ-، وَافْعَنْلَلَ [اِقْعَنْسَسَ]، وَافْعَنْلَى [اِسْلَنْقَى]، وَافْعَالَّ -بِتَشْدِيدِ اللَّامِ-.'],
 tr:'<p>Sülâsî köke harf eklenmesiyle <b>14 bâb</b> oluşur. Bunlar mâzinin harf sayısına göre üç gruptur:</p><ul><li><b>Rubâî (4 harfli) — 3 bâb:</b> <span class="ar">أَفْعَلَ، فَعَّلَ، فَاعَلَ</span></li><li><b>Humâsî (5 harfli) — 5 bâb:</b> <span class="ar">اِنْفَعَلَ، اِفْتَعَلَ، اِفْعَلَّ، تَفَعَّلَ، تَفَاعَلَ</span></li><li><b>Südâsî (6 harfli) — 6 bâb:</b> <span class="ar">اِسْتَفْعَلَ، اِفْعَوْعَلَ، اِفْعَوَّلَ، اِفْعَنْلَلَ، اِفْعَنْلَى، اِفْعَالَّ</span></li></ul><p class="small">Sağlama: 3 + 5 + 6 = <b>14</b>. Buradaki “rubâî”, mezîd fiilin dört harfli olması demektir; rubâî mücerred ile karıştırılmamalıdır.</p>',
 ex:[['أَكْرَمَ · فَرَّحَ · قَاتَلَ','Rubâî mezîd'],['اِنْكَسَرَ · اِكْتَسَبَ · اِحْمَرَّ · تَكَسَّرَ · تَصَالَحَ','Humâsî'],['اِسْتَغْفَرَ · اِعْشَوْشَبَ · اِجْلَوَّذَ · اِقْعَنْسَسَ · اِسْلَنْقَى · اِشْهَابَّ','Südâsî']],
 q:[['Sülâsînin mezîd bâbları kaç tanedir?',['On dört','On iki','Altı','Üç'],0,'3 + 5 + 6.'],['Humâsî bâbların sayısı?',['Beş','Üç','Altı','Dört'],0,'اِنْفَعَلَ، اِفْتَعَلَ، اِفْعَلَّ، تَفَعَّلَ، تَفَاعَلَ'],['اِسْتَفْعَلَ hangi gruptandır?',['Südâsî','Humâsî','Rubâî','Mülhak'],0,'Altı harf: ا س ت ف ع ل'],['فَاعَلَ hangi gruptandır?',['Rubâî mezîd','Humâsî','Südâsî','Rubâî mücerred'],0,'Dört harfli mezîd.'],['اِفْعَنْلَى bâbına kitabın misali?',['اِسْلَنْقَى','اِقْعَنْسَسَ','اِشْهَابَّ','اِجْلَوَّذَ'],0,'Köşeli parantezde verilmiştir.']]},
{id:'d5',k:1,p:6,t:'Mezîd rubâî: üç bâb',ar:'الْمَزِيدُ فِيهِ عَلَى الرُّبَاعِيِّ',
 m:['وَمَزِيدُ الرُّبَاعِيِّ ثَلَاثَةُ أَبْوَابٍ: اِفْعَنْلَلَ، وَافْعَلَلَّ -بِتَشْدِيدِ اللَّامِ الْأَخِيرَةِ-، وَتَفَعْلَلَ.'],
 tr:'<p>Rubâî mücerred köke harf eklenerek <b>3 bâb</b> oluşur:</p><table class="mini"><tr><th>Vezin</th><th>Misal (kitabın tasrîf bölümünden)</th></tr><tr><td class="a">اِفْعَنْلَلَ</td><td class="a">اِحْرَنْجَمَ يَحْرَنْجِمُ اِحْرِنْجَامًا</td></tr><tr><td class="a">اِفْعَلَلَّ</td><td class="a">اِقْشَعَرَّ يَقْشَعِرُّ اِقْشِعْرَارًا</td></tr><tr><td class="a">تَفَعْلَلَ</td><td class="a">تَدَحْرَجَ يَتَدَحْرَجُ تَدَحْرُجًا</td></tr></table><p>Böylece kitapta fiil bâblarının tamamı: 6 sülâsî mücerred + 1 rubâî mücerred (+6 mülhak) + 14 mezîd sülâsî + 3 mezîd rubâî.</p>',
 ex:[['اِحْرَنْجَمَ','اِفْعَنْلَلَ'],['اِقْشَعَرَّ','اِفْعَلَلَّ'],['تَدَحْرَجَ','تَفَعْلَلَ']],
 q:[['تَدَحْرَجَ hangi bâbdandır?',['تَفَعْلَلَ','تَفَعَّلَ','اِفْعَنْلَلَ','فَعْلَلَ'],0,'Rubâînin mezîdi.'],['اِقْشَعَرَّ hangi vezindedir?',['اِفْعَلَلَّ','اِفْعَلَّ','اِفْعَالَّ','اِفْعَنْلَلَ'],0,'Son lâm şeddeli.'],['Mezîd rubâî kaç bâbdır?',['Üç','Beş','Altı','On dört'],0,'ثَلَاثَةُ أَبْوَابٍ']]},
/* ---------- 2. ALTI VECİH ---------- */
{id:'d6',k:2,p:7,t:'Altı vecih ve masdar',ar:'الْمَصْدَرُ',
 m:['فَصْلٌ فِي الْوُجُوهِ الَّتِي اشْتَدَّتِ الْحَاجَةُ إِلَى إِخْرَاجِهَا مِنَ الْمَصْدَرِ، وَهِيَ سِتَّةٌ: الْمَاضِي، وَالْمُضَارِعُ، وَالْأَمْرُ، وَالنَّهْيُ، وَاسْمُ الْفَاعِلِ، وَاسْمُ الْمَفْعُولِ.','أَمَّا «الْمَصْدَرُ» فَلَا يَخْلُو مِنْ أَنْ يَكُونَ: مِيمِيًّا، أَوْ غَيْرَ مِيمِيٍّ. فَإِنْ كَانَ «غَيْرَ مِيمِيٍّ» فَهُوَ سَمَاعِيٌّ. وَنَعْنِي بِـ«السَّمَاعِيِّ»: أَنَّهُ يُحْفَظُ كُلُّ مَصْدَرٍ عَلَى مَا جَاءَ مِنَ الْعَرَبِ، وَلَا يُقَاسُ عَلَيْهِ، لِأَنَّهُ لَا قِيَاسَ لِمَصْدَرِ الثُّلَاثِيِّ. وَمَصْدَرُ غَيْرِ الثُّلَاثِيِّ قِيَاسِيٌّ.'],
 tr:'<p>Müellife göre <b>masdar asıldır</b>; ihtiyaç duyulan <b>altı vecih</b> ondan çıkarılır: mâzi, muzâri, emir, nehiy, ism-i fâil, ism-i mef‘ûl. (Programın adı da buradan: masdar madendir, vecihler ondan basılan sikkeler.)</p><p>Masdar ikidir:</p><ul><li><b>Gayr-ı mîmî</b>: Sülâsîde <b>semâî</b>dir; her masdar Araplardan nasıl işitildiyse öyle ezberlenir, kıyas yapılmaz: <span class="ar">نَصْرٌ، كِتَابَةٌ، خُرُوجٌ، ذَهَابٌ</span>. Sülâsî dışındakilerin masdarı ise <b>kıyâsî</b>dir: <span class="ar">إِكْرَامٌ، تَفْعِيلٌ، اِسْتِفْعَالٌ</span>.</li><li><b>Mîmî</b>: başında zâid mim bulunan masdar (sonraki ders).</li></ul>',
 ex:[['نَصْرٌ · كِتَابَةٌ · خُرُوجٌ','Sülâsî masdarları semâî'],['إِخْرَاجٌ · تَخْرِيجٌ · اِسْتِغْفَارٌ','Gayr-ı sülâsî masdarları kıyâsî']],
 q:[['Masdardan çıkarılan vecihler kaç tanedir?',['Altı','Dört','On dört','Yedi'],0,'Mâzi, muzâri, emir, nehiy, fâil, mef‘ûl.'],['Sülâsînin gayr-ı mîmî masdarı nasıldır?',['Semâî','Kıyâsî','Mîmî','Mebnî'],0,'Araplardan işitildiği gibi ezberlenir.'],['Gayr-ı sülâsînin masdarı nasıldır?',['Kıyâsî','Semâî','Şâz','Mîmî'],0,'«وَمَصْدَرُ غَيْرِ الثُّلَاثِيِّ قِيَاسِيٌّ»'],['Hangisi altı vecihten değildir?',['İsm-i âlet','Nehiy','İsm-i mef‘ûl','Mâzi'],0,'Maksûd altı vecihte âleti saymaz.']]},
{id:'d7',k:2,p:7,t:'Mîmî masdar, ism-i zaman ve mekân',ar:'الْمَصْدَرُ الْمِيمِيُّ وَالزَّمَانُ وَالْمَكَانُ',
 m:['وَإِنْ كَانَ «مِيمِيًّا» فَيُنْظَرُ فِي عَيْنِ الْفِعْلِ الْمُضَارِعِ: فَإِنْ كَانَ مَضْمُومًا أَوْ مَفْتُوحًا: فَالْمَصْدَرُ الْمِيمِيُّ، وَالزَّمَانُ، وَالْمَكَانُ مِنْهُ: «مَفْعَلٌ» -بِفَتْحِ الْمِيمِ وَالْعَيْنِ، وَسُكُونِ الْفَاءِ-، إِلَّا مَا شَذَّ، نَحْوُ: «الْمَطْلِعِ»، وَ«الْمَغْرِبِ»، وَ«الْمَسْجِدِ»، وَ«الْمَنْسِكِ»، وَ«الْمَشْرِقِ»، وَ«الْمَجْزِرِ»، وَ«الْمَسْكِنِ»، وَ«الْمَنْبِتِ»، وَ«الْمَفْرِقِ»، وَ«الْمَسْقِطِ»، وَ«الْمَحْشِرِ»، وَ«الْمَرْفِقِ»، وَ«الْمَجْمِعِ» -بِكَسْرِ الْعَيْنِ فِي الْكُلِّ، وَإِنْ كَانَ الْقِيَاسُ الْفَتْحَ-.','وَإِنْ كَانَ مَكْسُورًا: فَالْمَصْدَرُ الْمِيمِيُّ مِنْهُ: «مَفْعَلٌ» -بِفَتْحِ الْمِيمِ وَالْعَيْنِ، وَسُكُونِ الْفَاءِ-، إِلَّا «الْمَرْجِعَ»، وَ«الْمَصِيرَ»، فَإِنَّهُمَا مَصْدَرَانِ وَقَدْ جَاءَا بِكَسْرِ الْعَيْنِ؛ وَالزَّمَانُ وَالْمَكَانُ مِنْهُ: «مَفْعِلٌ» -بِكَسْرِ الْعَيْنِ-.'],
 tr:'<p>Mîmî masdar, zaman ve mekân ismi için <b>muzârinin aynına</b> bakılır:</p><table class="mini"><tr><th>Muzâride ayn</th><th>Mîmî masdar</th><th>Zaman / mekân</th></tr><tr><td>ötre veya üstün</td><td class="a">مَفْعَلٌ</td><td class="a">مَفْعَلٌ</td></tr><tr><td>esre</td><td class="a">مَفْعَلٌ</td><td class="a">مَفْعِلٌ</td></tr></table><p><b>Şâzlar (kıyas fetha iken kesreli gelenler — 13 kelime):</b> <span class="ar">الْمَطْلِعُ، الْمَغْرِبُ، الْمَسْجِدُ، الْمَنْسِكُ، الْمَشْرِقُ، الْمَجْزِرُ، الْمَسْكِنُ، الْمَنْبِتُ، الْمَفْرِقُ، الْمَسْقِطُ، الْمَحْشِرُ، الْمَرْفِقُ، الْمَجْمِعُ</span>. Esreli bâbda kesreyle gelen iki masdar: <span class="ar">الْمَرْجِعُ، الْمَصِيرُ</span>.</p>',
 ex:[['مَنْصَرٌ','يَنْصُرُ (ötre) → masdar, zaman, mekân hepsi مَفْعَلٌ'],['مَفْتَحٌ','يَفْتَحُ (üstün) → مَفْعَلٌ'],['مَضْرَبٌ / مَضْرِبٌ','يَضْرِبُ (esre) → masdar مَضْرَبٌ, zaman-mekân مَضْرِبٌ'],['مَسْجِدٌ','سَجَدَ يَسْجُدُ: kıyas مَسْجَدٌ iken şâz olarak kesreli'],['مَرْجِعٌ · مَصِيرٌ','Esreli bâbdan kesreli gelen iki masdar']],
 q:[['يَنْصُرُ’dan ism-i mekân?',['مَنْصَرٌ','مَنْصِرٌ','مُنْصَرٌ','مِنْصَرٌ'],0,'Ayn ötre → مَفْعَلٌ.'],['يَضْرِبُ’dan ism-i mekân?',['مَضْرِبٌ','مَضْرَبٌ','مُضْرَبٌ','مِضْرَبٌ'],0,'Ayn esre → مَفْعِلٌ.'],['يَضْرِبُ’dan mîmî masdar?',['مَضْرَبٌ','مَضْرِبٌ','ضَرْبٌ','مُضْرِبٌ'],0,'Esreli bâbda da masdar مَفْعَلٌ.'],['مَسْجِدٌ neden şâzdır?',['Muzârisi ötreli olduğu hâlde ayn kesreli gelmiştir','Mezîddir','Muzâaftır','Âlet ismidir'],0,'Kıyas fethadır.'],['Esreli bâbdan kesreyle gelen iki masdar?',['الْمَرْجِعُ ve الْمَصِيرُ','الْمَسْجِدُ ve الْمَشْرِقُ','الْمَطْلِعُ ve الْمَغْرِبُ','الْمَجْمِعُ ve الْمَحْشِرُ'],0,'«فَإِنَّهُمَا مَصْدَرَانِ»']]},
{id:'d8',k:2,p:8,t:'Mîmî masdar: illetli ve mezîd fiillerde',ar:'الْمِيمِيُّ فِي الْمُعْتَلِّ وَالْمَزِيدِ',
 m:['هٰذَا فِي «الصَّحِيحِ»، وَ«الْأَجْوَفِ»، وَ«الْمُضَاعَفِ»، وَ«الْمَهْمُوزِ». وَأَمَّا فِي «النَّاقِصِ»: فَالْمَصْدَرُ الْمِيمِيُّ، وَالزَّمَانُ، وَالْمَكَانُ مِنْهُ: «مَفْعَلٌ» -بِفَتْحِ الْمِيمِ وَالْعَيْنِ، وَسُكُونِ الْفَاءِ- مِنْ جَمِيعِ الْأَبْوَابِ. وَفِي «الْمُعْتَلِّ الْفَاءِ»: «مَفْعِلٌ» -بِكَسْرِ الْعَيْنِ- مِنْ جَمِيعِ الْأَبْوَابِ. وَ«اللَّفِيفُ الْمَقْرُونُ» كَالنَّاقِصِ؛ وَ«اللَّفِيفُ الْمَفْرُوقُ» كَالْمُعْتَلِّ الْفَاءِ.','وَإِنْ كَانَ الْفِعْلُ زَائِدًا عَلَى الثُّلَاثِيِّ: فَالْمَصْدَرُ الْمِيمِيُّ، وَالزَّمَانُ، وَالْمَكَانُ، وَاسْمُ الْمَفْعُولِ مِنْ كُلِّ بَابٍ: يَكُونُ عَلَى وَزْنِ مُضَارِعِ مَجْهُولِ ذٰلِكَ الْبَابِ، إِلَّا أَنَّكَ تُبْدِلُ حَرْفَ الْمُضَارَعَةِ بِالْمِيمِ الْمَضْمُومَةِ. وَاسْمُ الْفَاعِلِ مِنْهُ: بِكَسْرِ الْعَيْنِ.'],
 tr:'<ul><li>Önceki kural <b>sahîh, ecvef, muzâaf ve mehmûz</b> içindir.</li><li><b>Nâkıs</b> (ve lefîf-i makrûn): bütün bâblarda <span class="ar">مَفْعَلٌ</span> → <span class="ar">مَرْمًى</span> (يَرْمِي esreli olduğu hâlde).</li><li><b>Misâl</b> (ve lefîf-i mefrûk): bütün bâblarda <span class="ar">مَفْعِلٌ</span> → <span class="ar">مَوْعِدٌ</span>.</li><li><b>Mezîd fiiller</b>: mîmî masdar, zaman, mekân ve ism-i mef‘ûl, o bâbın <b>muzâri meçhûlü</b> vezninde olur; yalnız muzâraat harfi yerine <b>ötreli mim</b> gelir: <span class="ar">يُخْرَجُ → مُخْرَجٌ</span>. <b>İsm-i fâil</b> ise aynı kalıpta ama <b>aynı esreli</b>: <span class="ar">مُخْرِجٌ</span>.</li></ul>',
 ex:[['مَرْمًى','رَمَى يَرْمِي (nâkıs): مَفْعَلٌ'],['مَوْعِدٌ','وَعَدَ يَعِدُ (misâl): مَفْعِلٌ'],['يُسْتَخْرَجُ → مُسْتَخْرَجٌ','Mezîd: muzâri meçhûl + ötreli mim'],['مُسْتَخْرِجٌ','İsm-i fâil: aynı esreli']],
 q:[['Nâkıs fiilde ism-i mekân hangi vezindedir?',['مَفْعَلٌ (bütün bâblarda)','مَفْعِلٌ','Bâba göre değişir','مُفْعَلٌ'],0,'مَرْمًى'],['Misâl fiilde?',['مَفْعِلٌ (bütün bâblarda)','مَفْعَلٌ','مُفْعِلٌ','Bâba göre'],0,'مَوْعِدٌ'],['Lefîf-i mefrûk hangisi gibidir?',['Misâl gibi','Nâkıs gibi','Ecvef gibi','Sahîh gibi'],0,'Fâsı illetli olduğu için.'],['اِسْتَخْرَجَ bâbından ism-i mef‘ûl?',['مُسْتَخْرَجٌ','مُسْتَخْرِجٌ','مَسْتَخْرَجٌ','اِسْتِخْرَاجٌ'],0,'Muzâri meçhûl vezni, başta ötreli mim.'],['Mezîdde ism-i fâili mef‘ûlden ayıran?',['Aynın esreli olması','Mimin fethası','Sondaki tenvîn','Şedde'],0,'«وَاسْمُ الْفَاعِلِ مِنْهُ بِكَسْرِ الْعَيْنِ»']]},
{id:'d9',k:2,p:8,t:'Mâzi-i ma‘lûm ve hemze-i vasl',ar:'الْفِعْلُ الْمَاضِي الْمَعْلُومُ',
 m:['وَأَمَّا «الْمَاضِي»: فَلَا يَخْلُو أَنْ يَكُونَ الْفِعْلُ مَعْرُوفًا أَوْ مَجْهُولًا. فَإِنْ كَانَ «مَعْرُوفًا»: فَالْحَرْفُ الْأَخِيرُ مِنَ الْمَاضِي: مَبْنِيٌّ عَلَى الْفَتْحِ فِي الْوَاحِدِ وَالتَّثْنِيَةِ -سَوَاءٌ كَانَ مُذَكَّرًا أَوْ مُؤَنَّثًا-، وَمَضْمُومٌ فِي جَمْعِ الْمُذَكَّرِ الْغَائِبِ، وَسَاكِنٌ فِي الْبَوَاقِي مِنْ جَمِيعِ الْأَبْوَابِ.','وَالْحَرْفُ الْأَوَّلُ مِنْهُ: مَفْتُوحٌ مِنْ جَمِيعِ الْأَبْوَابِ، إِلَّا مِنْ أَبْوَابِ الْخُمَاسِيِّ وَالسُّدَاسِيِّ الَّتِي فِي أَوَّلِهَا هَمْزَةُ الْوَصْلِ. وَ«هَمْزَةُ الْوَصْلِ»: تَثْبُتُ فِي الِابْتِدَاءِ، وَتَسْقُطُ فِي الدَّرْجِ.','وَهِيَ: هَمْزَةُ «ابْنٍ»، وَ«ابْنَمٍ»، وَ«ابْنَةٍ»، وَ«امْرِئٍ»، وَ«امْرَأَةٍ»، وَ«اثْنَيْنِ»، وَ«اثْنَتَيْنِ»، وَ«اسْمٍ»، وَ«اسْتٍ»، وَ«ايْمُنٍ»؛ وَهَمْزَةُ الْمَاضِي وَالْمَصْدَرِ وَالْأَمْرِ مِنَ الْخُمَاسِيِّ وَالسُّدَاسِيِّ، وَأَمْرِ الْحَاضِرِ مِنَ الثُّلَاثِيِّ؛ وَالْهَمْزَةُ الْمُتَّصِلَةُ بِلَامِ التَّعْرِيفِ [وَبِالِاسْمِ الْمَوْصُولِ].','وَ«هَمْزَةُ الْوَصْلِ»: مَحْذُوفَةٌ فِي الْوَصْلِ، وَمَكْسُورَةٌ فِي الِابْتِدَاءِ، إِلَّا: مَا اتَّصَلَتْ بِلَامِ التَّعْرِيفِ، وَهَمْزَةَ «ايْمُنٍ»، [وَهَمْزَةَ الِاسْمِ الْمَوْصُولِ]: فَإِنَّهُمَا مَفْتُوحَتَانِ فِي الِابْتِدَاءِ؛ وَمَا تَكُونُ فِي أَوَّلِ الْأَمْرِ مِنْ «يَفْعُلُ» -بِضَمِّ الْعَيْنِ-: فَإِنَّهَا مَضْمُومَةٌ فِي الِابْتِدَاءِ تَبَعًا لِلْعَيْنِ؛ وَكَذٰلِكَ مَضْمُومَةٌ فِي الْمَاضِي الْمَجْهُولِ مِنَ الْخُمَاسِيِّ وَالسُّدَاسِيِّ.'],
 tr:'<p><b>Mâzi-i ma‘lûmun son harfi:</b> müfred ve tesniyede (müzekker-müennes) <b>fetha</b> üzere mebnî; cem‘-i müzekker gâibde <b>ötre</b>; diğerlerinde <b>sâkin</b>: <span class="ar">نَصَرَ، نَصَرَا، نَصَرَتْ، نَصَرَتَا · نَصَرُوا · نَصَرْنَ، نَصَرْتَ…</span></p><p><b>İlk harfi:</b> bütün bâblarda <b>fethalı</b>; yalnız başında hemze-i vasl olan humâsî ve südâsî bâblar müstesna.</p><p><b>Hemze-i vasl</b>: söze başlarken okunur, ortada (derc) düşer.</p><ul><li><b>Nerelerde?</b> On isim (ابْنٌ، ابْنَمٌ، ابْنَةٌ، امْرُؤٌ، امْرَأَةٌ، اثْنَانِ، اثْنَتَانِ، اسْمٌ، اسْتٌ، ايْمُنٌ); humâsî-südâsînin mâzi, masdar ve emri; sülâsînin emr-i hâzırı; lâm-ı ta‘rîf ve ism-i mevsûl.</li><li><b>Harekesi:</b> başlangıçta <b>esre</b>dir. İstisnalar: lâm-ı ta‘rîf, ايْمُنٌ ve mevsûlde <b>üstün</b>; يَفْعُلُ’un emrinde aynə uyarak <b>ötre</b> (اُنْصُرْ); humâsî-südâsînin mâzi meçhûlünde <b>ötre</b> (اُنْكُسِرَ، اُسْتُغْفِرَ).</li></ul>',
 ex:[['اِبْنٌ · اِسْمٌ · اِمْرَأَةٌ','Hemze-i vasl: esre'],['اَلْكِتَابُ','Lâm-ı ta‘rîf: üstün'],['اُنْصُرْ','يَنْصُرُ’un emri: ötre'],['اِضْرِبْ','يَضْرِبُ’un emri: esre'],['اُسْتُخْرِجَ','Südâsînin mâzi meçhûlü: ötre'],['أَكْرَمَ','Hemze-i kat‘: düşmez (vasl değil)']],
 q:[['Mâzi-i ma‘lûmda cem‘-i müzekker gâibin son harfi?',['Ötreli','Fethalı','Sâkin','Esreli'],0,'نَصَرُوا'],['نَصَرْتَ’deki son aslî harfin (ر) durumu?',['Sâkin','Fethalı','Ötreli','Esreli'],0,'Bevâkîde sâkin.'],['Hemze-i vasl söz ortasında ne olur?',['Düşer','Esreli okunur','Üstünlü okunur','Kat‘ hemzesine döner'],0,'«وَتَسْقُطُ فِي الدَّرْجِ»'],['اُنْصُرْ’daki hemze neden ötrelidir?',['يَفْعُلُ’un aynına uyduğu için','Mâzi meçhûl olduğu için','Kat‘ hemzesi olduğu için','Lâm-ı ta‘rîf olduğu için'],0,'«تَبَعًا لِلْعَيْنِ»'],['Hangisinin hemzesi hemze-i vasl değildir?',['أَكْرَمَ','اِسْتَغْفَرَ','اِبْنٌ','اِنْكَسَرَ'],0,'If‘âl bâbının hemzesi kat‘ hemzesidir.'],['Lâm-ı ta‘rîfin hemzesi başlangıçta nasıl okunur?',['Üstün','Esre','Ötre','Okunmaz'],0,'«فَإِنَّهُمَا مَفْتُوحَتَانِ»']]},
{id:'d10',k:2,p:9,t:'Mâzi-i meçhûl',ar:'الْمَاضِي الْمَجْهُولُ',
 m:['وَإِنْ كَانَ الْفِعْلُ مَجْهُولًا: فَالْحَرْفُ الْأَخِيرُ مِنْهُ: يَكُونُ مِثْلَ مَا كَانَ فِي الْمَعْرُوفِ. وَالْحَرْفُ الَّذِي قَبْلَ الْأَخِيرِ: مَكْسُورٌ أَبَدًا. وَالسَّاكِنُ: سَاكِنٌ عَلَى حَالِهِ. وَمَا بَقِيَ مَضْمُومٌ.'],
 tr:'<p>Mâzi-i meçhûl yapmanın dört adımlı kuralı (bütün bâblar için):</p><ol><li><b>Son harf</b> ma‘lûmdaki gibi kalır.</li><li><b>Sondan önceki</b> harf daima <b>esre</b>.</li><li><b>Sâkin</b> harf sâkin kalır.</li><li><b>Geri kalan</b> bütün harekeli harfler <b>ötre</b> olur.</li></ol><p>Bu kural tek başına her bâbın meçhûlünü verir: <span class="ar">نَصَرَ → نُصِرَ · أَكْرَمَ → أُكْرِمَ · تَعَلَّمَ → تُعُلِّمَ · اِسْتَخْرَجَ → اُسْتُخْرِجَ</span>.</p>',
 ex:[['نُصِرَ','نَصَرَ'],['أُخْرِجَ','أَخْرَجَ'],['خُوصِمَ','خَاصَمَ: elif ötreden sonra vav olur (kitap: «وَمَجْهُولُ الْمَاضِي: خُوصِمَ»)'],['تُدُحْرِجَ','تَدَحْرَجَ'],['اُسْتُغْفِرَ','اِسْتَغْفَرَ: hemze-i vasl da ötre']],
 q:[['Mâzi meçhûlde sondan önceki harf?',['Daima esre','Daima ötre','Fetha','Sâkin'],0,'«مَكْسُورٌ أَبَدًا»'],['أَكْرَمَ’in meçhûlü?',['أُكْرِمَ','أُكْرَمَ','أَكْرِمَ','أُكُرِمَ'],0,'Kâf sâkin kalır.'],['اِسْتَخْرَجَ’in meçhûlü?',['اُسْتُخْرِجَ','اِسْتُخْرِجَ','اُسْتَخْرِجَ','يُسْتَخْرَجُ'],0,'Sâkinler kalır, kalanlar ötre.'],['Meçhûlde sâkin harf ne olur?',['Sâkin kalır','Ötre olur','Esre olur','Düşer'],0,'«وَالسَّاكِنُ سَاكِنٌ عَلَى حَالِهِ»']]},
{id:'d11',k:2,p:9,t:'Muzâri: ma‘lûm ve meçhûl',ar:'الْفِعْلُ الْمُضَارِعُ',
 m:['وَأَمَّا «الْمُضَارِعُ»: فَهُوَ الَّذِي يَكُونُ فِي أَوَّلِهِ حَرْفٌ مِنْ حُرُوفِ «أَتَيْنَ»، بِشَرْطِ أَنْ يَكُونَ ذٰلِكَ الْحَرْفُ زَائِدًا عَلَى الْمَاضِي.','فِي الْمَعْرُوفِ: حُرُوفُ الْمُضَارَعَةِ: مَفْتُوحَةٌ فِي الْمَعْرُوفِ مِنْ جَمِيعِ الْأَبْوَابِ، إِلَّا مِنَ الرُّبَاعِيِّ -أَيِّ رُبَاعِيٍّ كَانَ-، فَإِنَّهَا مَضْمُومَةٌ فِيهِ. وَمَا قَبْلَ لَامِ الْفِعْلِ الْمُضَارِعِ: مَكْسُورٌ فِي الرُّبَاعِيِّ وَالْخُمَاسِيِّ وَالسُّدَاسِيِّ، إِلَّا مِنْ «يَتَفَعَّلُ» وَ«يَتَفَاعَلُ» وَ«يَتَفَعْلَلُ»، فَإِنَّهُ مَفْتُوحٌ فِيهِنَّ.','وَفِي الْمَجْهُولِ: حَرْفُ الْمُضَارَعَةِ: مَضْمُومٌ، وَالسَّاكِنُ: سَاكِنٌ عَلَى حَالِهِ، وَمَا بَقِيَ مَفْتُوحٌ كُلُّهُ مَا عَدَا لَامَ الْفِعْلِ، فَإِنَّهَا مَرْفُوعَةٌ فِي الْمَعْرُوفِ وَالْمَجْهُولِ مَا لَمْ يَكُنْ حَرْفٌ نَاصِبٌ يَنْصِبُهَا أَوْ جَازِمٌ يَجْزِمُهَا.'],
 tr:'<p><b>Muzâri</b>: başında <b>eteyne</b> (أ ت ي ن) harflerinden biri bulunan fiil — şartı, bu harfin mâziye <b>zâid</b> olmasıdır (أَكَلَ’deki hemze aslîdir, muzâraat harfi değildir).</p><p><b>Ma‘lûmda:</b></p><ul><li>Muzâraat harfi <b>üstün</b>; yalnız <b>rubâî</b> (hangi rubâî olursa: أَفْعَلَ، فَعَّلَ، فَاعَلَ، فَعْلَلَ ve mülhakları) <b>ötre</b>: <span class="ar">يُكْرِمُ، يُدَحْرِجُ</span>.</li><li>Lâmdan önceki harf rubâî, humâsî ve südâsîde <b>esre</b>: <span class="ar">يَنْكَسِرُ، يَسْتَغْفِرُ</span>; ama يَتَفَعَّلُ، يَتَفَاعَلُ، يَتَفَعْلَلُ’de <b>üstün</b>: <span class="ar">يَتَكَسَّرُ، يَتَصَالَحُ، يَتَدَحْرَجُ</span>.</li></ul><p><b>Meçhûlde:</b> muzâraat harfi <b>ötre</b>, sâkin sâkin kalır, geri kalan hepsi <b>üstün</b>; lâm ise nâsıb veya câzim yoksa <b>merfû</b>: <span class="ar">يُنْصَرُ، يُكْرَمُ، يُسْتَغْفَرُ</span>.</p>',
 ex:[['يَنْصُرُ · يُنْصَرُ','Sülâsî: ma‘lûm üstün, meçhûl ötre'],['يُخْرِجُ · يُخْرَجُ','Rubâî: ma‘lûmda da ötre; fark lâmdan öncekinde'],['يَتَعَلَّمُ','تَفَعَّلَ: lâmdan önce üstün'],['يَسْتَخْرِجُ · يُسْتَخْرَجُ','Südâsî']],
 q:[['Muzâraat harfi ma‘lûmda hangi bâbda ötrelidir?',['Rubâîde','Humâsîde','Südâsîde','Sülâsîde'],0,'«إِلَّا مِنَ الرُّبَاعِيِّ أَيِّ رُبَاعِيٍّ كَانَ»'],['يَتَفَاعَلُ’da lâmdan önceki harf?',['Üstün','Esre','Ötre','Sâkin'],0,'İstisna üç bâbdan.'],['Muzâri meçhûlde geri kalan harfler?',['Üstün','Ötre','Esre','Sâkin'],0,'Lâm hariç.'],['أَكَلَ’deki hemze neden muzâraat harfi değildir?',['Mâziye zâid değil, aslîdir','Fethalı olduğu için','Kat‘ hemzesi olduğu için','Sonda olduğu için'],0,'Şart: «زَائِدًا عَلَى الْمَاضِي»'],['يُدَحْرِجُ’de muzâraat harfi neden ötrelidir?',['Rubâî olduğu için','Meçhûl olduğu için','Mezîd olduğu için','Emir olduğu için'],0,'Rubâî mücerred de rubâîdir.']]},
{id:'d12',k:2,p:10,t:'Emir ve nehiy',ar:'الْأَمْرُ وَالنَّهْيُ',
 m:['وَأَمَّا «الْأَمْرُ» وَ«النَّهْيُ»: فَإِنَّهُمَا يَكُونَانِ عَلَى لَفْظِ الْمُضَارِعِ، إِلَّا أَنَّهُمَا مَجْزُومَانِ. وَ«عَلَامَةُ الْجَزْمِ» فِيهِمَا: سُقُوطُ نُونِ التَّثْنِيَةِ، وَجَمْعِ الْمُذَكَّرِ، وَالْوَاحِدَةِ الْمُخَاطَبَةِ. وَفِي الْبَوَاقِي: سُكُونُ لَامِ الْفِعْلِ الصَّحِيحَةِ، وَسُقُوطُ لَامِ الْفِعْلِ الْمُعْتَلَّةِ؛ سِوَى نُونِ جَمْعِ الْمُؤَنَّثِ، فَإِنَّ نُونَهَا ثَابِتَةٌ فِي الْجَزْمِ وَغَيْرِهِ.','وَ«أَمْرُ الْحَاضِرِ مِنَ الْمَعْرُوفِ»: تَحْذِفُ مِنْهُ حَرْفَ الْمُضَارَعَةِ، وَتُدْخِلُ هَمْزَةَ الْوَصْلِ إِنْ كَانَ مَا بَعْدَ حَرْفِ الْمُضَارَعَةِ سَاكِنًا، وَإِنْ كَانَ مُتَحَرِّكًا فَتُسْكِنُ آخِرَهُ، وَهُوَ مَبْنِيٌّ عَلَى الْوَقْفِ، وَالْمَبْنِيُّ عَلَى الْوَقْفِ كَالْمَجْزُومِ فِي اللَّفْظِ.'],
 tr:'<p>Emir ve nehiy <b>muzâri lafzı</b> üzeredir, ancak <b>meczûm</b>dur. Cezm alâmeti:</p><ul><li>Tesniye, cem‘-i müzekker ve müfrede muhâtabada <b>nûnun düşmesi</b>: <span class="ar">لِيَنْصُرَا، لِيَنْصُرُوا، اُنْصُرِي</span>.</li><li>Diğerlerinde: sahîh lâmın <b>sükûnu</b> (<span class="ar">لِيَنْصُرْ</span>), illetli lâmın <b>düşmesi</b> (<span class="ar">لِيَغْزُ</span>).</li><li><b>Cem‘-i müennes nûnu</b> cezmde de kalır: <span class="ar">لِيَنْصُرْنَ، اُنْصُرْنَ</span>.</li></ul><p><b>Emr-i hâzır (ma‘lûm) yapılışı:</b></p><ol><li>Muzâraat harfini at: <span class="ar">تَنْصُرُ → نْصُرُ</span></li><li>Kalan sâkinle başlıyorsa <b>hemze-i vasl</b> getir: <span class="ar">اُنْصُرْ</span></li><li>Harekeli başlıyorsa sadece sonu sâkin et: <span class="ar">تُدَحْرِجُ → دَحْرِجْ</span></li></ol><p>Emr-i hâzır <b>vakf üzere mebnî</b>dir; lafızda meczûm gibidir.</p>',
 ex:[['لِيَنْصُرْ · لَا يَنْصُرْ','Emr-i gâib ve nehiy: sükûn'],['اُنْصُرُوا · اُنْصُرِي','Nûn düşer'],['اُنْصُرْنَ','Cem‘-i müennes nûnu kalır'],['دَحْرِجْ','Harekeyle başladığı için hemzesiz'],['قَاتِلْ · تَعَلَّمْ','تُقَاتِلُ، تَتَعَلَّمُ → harekeyle başlar']],
 q:[['Emir ve nehiy hangi lafız üzeredir?',['Muzâri','Mâzi','Masdar','İsm-i fâil'],0,'«عَلَى لَفْظِ الْمُضَارِعِ»'],['Cem‘-i müennes nûnu cezmde?',['Kalır','Düşer','Sâkin olur','Şeddelenir'],0,'«فَإِنَّ نُونَهَا ثَابِتَةٌ»'],['تُدَحْرِجُ’un emr-i hâzırı?',['دَحْرِجْ','اُدَحْرِجْ','اِدَحْرِجْ','لِتُدَحْرِجْ'],0,'Harekeli başladığı için hemze-i vasl gerekmez.'],['تَضْرِبُ’nun emr-i hâzırı?',['اِضْرِبْ','اُضْرِبْ','ضْرِبْ','أَضْرِبْ'],0,'Sâkinle başladığı için hemze; ayn esreli → esre.'],['Emr-i hâzır nasıl mebnîdir?',['Vakf (sükûn) üzere','Fetha üzere','Damme üzere','Mu‘reb’dir'],0,'«مَبْنِيٌّ عَلَى الْوَقْفِ»']]},
{id:'d13',k:2,p:10,t:'İsm-i fâil vezinleri',ar:'اسْمُ الْفَاعِلِ',
 m:['وَأَمَّا «الْفَاعِلُ»: فَيُنْظَرُ فِي عَيْنِ الْفِعْلِ الْمَاضِي: فَإِنْ كَانَ مَفْتُوحًا [أَيْ: مِنَ الْبَابِ الْأَوَّلِ، وَالثَّانِي، وَالثَّالِثِ] فَوَزْنُهُ: «نَاصِرٌ». وَإِنْ كَانَ مَضْمُومًا [أَيْ: مِنَ الْبَابِ الْخَامِسِ] فَوَزْنُهُ: «عَظِيمٌ»، وَ«ضَخْمٌ».','وَإِنْ كَانَ مَكْسُورًا [أَيْ: مِنَ الْبَابِ الرَّابِعِ، وَالسَّادِسِ] فَوَزْنُهُ: مِنَ الْمُتَعَدِّي: «عَالِمٌ». وَمِنَ اللَّازِمِ يَأْتِي عَلَى أَرْبَعَةِ أَوْزَانٍ: «مَرِيضٌ»، وَ«زَمِنٌ» -بِفَتْحِ الزَّايِ، وَكَسْرِ الْمِيمِ-، وَ«أَحْمَرُ» لِلْمُذَكَّرِ؛ وَ«حَمْرَاءُ» لِلْمُؤَنَّثِ -بِالْمَدِّ-؛ وَجَمْعُهُمَا «حُمْرٌ»؛ وَتَثْنِيَةُ «أَحْمَرَ»: «أَحْمَرَانِ»؛ وَتَثْنِيَةُ «حَمْرَاءَ»: «حَمْرَاوَانِ»، وَ«عَطْشَانُ» لِلْمُذَكَّرِ؛ وَتَثْنِيَةُ «عَطْشَانَ»: «عَطْشَانَانِ»؛ وَ«عَطْشَى» لِلْمُؤَنَّثِ؛ وَجَمْعُهُمَا: «عِطَاشٌ»؛ وَتَثْنِيَةُ «عَطْشَى»: «عَطْشَيَانِ». وَاخْتَصَرْتُ بِذِكْرِ مَا يُمْكِنُ ضَبْطُهُ مِنَ الْفَاعِلِ، وَتَرَكْتُ مَا عَدَاهُ.'],
 tr:'<p>İsm-i fâil için <b>mâzinin aynına</b> bakılır:</p><table class="mini"><tr><th>Mâzide ayn</th><th>Bâb</th><th>Vezin</th></tr><tr><td>üstün</td><td>1, 2, 3</td><td class="a">فَاعِلٌ (نَاصِرٌ)</td></tr><tr><td>ötre</td><td>5</td><td class="a">فَعِيلٌ (عَظِيمٌ) · فَعْلٌ (ضَخْمٌ)</td></tr><tr><td>esre, müteaddî</td><td>4, 6</td><td class="a">فَاعِلٌ (عَالِمٌ)</td></tr><tr><td>esre, lâzım</td><td>4, 6</td><td class="a">فَعِيلٌ · فَعِلٌ · أَفْعَلُ/فَعْلَاءُ · فَعْلَانُ/فَعْلَى</td></tr></table><p>Lâzımın dört vezni: <span class="ar">مَرِيضٌ · زَمِنٌ · أَحْمَرُ – حَمْرَاءُ (cem‘: حُمْرٌ; tesniye: أَحْمَرَانِ، حَمْرَاوَانِ) · عَطْشَانُ – عَطْشَى (cem‘: عِطَاشٌ; tesniye: عَطْشَانَانِ، عَطْشَيَانِ)</span>. Müellif yalnız zapt edilebilenleri zikrettiğini söyler.</p>',
 ex:[['نَاصِرٌ · ضَارِبٌ · فَاتِحٌ','Ayn üstün'],['عَظِيمٌ · ضَخْمٌ','Ayn ötre (5. bâb)'],['عَالِمٌ','Ayn esre, müteaddî'],['مَرِيضٌ · زَمِنٌ','Esre, lâzım'],['أَحْمَرُ · حَمْرَاءُ · حُمْرٌ','Renk/ayıp'],['عَطْشَانُ · عَطْشَى · عِطَاشٌ','Boşluk-doluluk']],
 q:[['كَرُمَ bâbından ism-i fâil hangi vezne gelir?',['فَعِيلٌ veya فَعْلٌ','فَاعِلٌ','أَفْعَلُ','فَعْلَانُ'],0,'Mâzide ayn ötre.'],['حَمْرَاءُ’nın tesniyesi?',['حَمْرَاوَانِ','حَمْرَاءَانِ','حَمْرَتَانِ','حُمْرَانِ'],0,'Hemze vava döner.'],['عَطْشَى’nın tesniyesi?',['عَطْشَيَانِ','عَطْشَاوَانِ','عَطْشَتَانِ','عَطْشَانَانِ'],0,'Kitapta: «عَطْشَيَانِ»'],['أَحْمَرُ ve حَمْرَاءُ’nın cem‘i?',['حُمْرٌ','أَحَامِرُ','حَمْرَاوَاتٌ','حِمَارٌ'],0,'«وَجَمْعُهُمَا حُمْرٌ»'],['عَلِمَ (müteaddî) bâbından fâil?',['عَالِمٌ','عَلِيمٌ','عَلِمٌ','أَعْلَمُ'],0,'Esre + müteaddî → فَاعِلٌ']]},
{id:'d14',k:2,p:11,t:'İsm-i mef‘ûl ve mübâlağa vezinleri',ar:'اسْمُ الْمَفْعُولِ وَأَوْزَانُ الْمُبَالَغَةِ',
 m:['وَأَمَّا «الْمَفْعُولُ» مِنْ جَمِيعِ الثُّلَاثِيِّ: فَوَزْنُهُ: «مَجْبُورٌ»، وَ«كَسِيرٌ». وَقَدْ ذَكَرْنَا الْفَاعِلَ وَالْمَفْعُولَ مِنَ الزَّوَائِدِ عَلَى الثُّلَاثِيِّ فِي «الْمَصْدَرِ الْمِيمِيِّ».','وَ«أَوْزَانُ الْمُبَالَغَةِ»: «جَهُولٌ»، وَ«صِدِّيقٌ»، وَ«كَذَّابٌ»، وَ«غُفُلٌ» -بِضَمِّ الْغَيْنِ وَالْفَاءِ-، وَ«يَقُظٌ» -بِفَتْحِ الْيَاءِ، وَضَمِّ الْقَافِ-، وَ«مِدْرَارٌ»، وَ«مِكْثِيرٌ»، وَ«لُعَنَةٌ» -بِضَمِّ اللَّامِ، وَفَتْحِ الْعَيْنِ-. فَإِنْ أَسْكَنْتَ الْعَيْنَ مِنَ الْوَزْنِ الْأَخِيرِ يَصِيرُ بِمَعْنَى الْمَفْعُولِ.'],
 tr:'<p><b>İsm-i mef‘ûl</b> bütün sülâsîde <span class="ar">مَفْعُولٌ</span> (<span class="ar">مَجْبُورٌ</span>) veya <span class="ar">فَعِيلٌ</span> (<span class="ar">كَسِيرٌ</span> kırılmış) vezninde gelir. Mezîdin fâil ve mef‘ûlü mîmî masdar dersinde geçti.</p><p><b>Mübâlağa vezinleri (8):</b></p><table class="mini"><tr><td class="a">فَعُولٌ</td><td class="a">جَهُولٌ</td><td>çok cahil</td></tr><tr><td class="a">فِعِّيلٌ</td><td class="a">صِدِّيقٌ</td><td>çok sâdık</td></tr><tr><td class="a">فَعَّالٌ</td><td class="a">كَذَّابٌ</td><td>çok yalancı</td></tr><tr><td class="a">فُعُلٌ</td><td class="a">غُفُلٌ</td><td>çok gâfil</td></tr><tr><td class="a">فَعُلٌ</td><td class="a">يَقُظٌ</td><td>çok uyanık</td></tr><tr><td class="a">مِفْعَالٌ</td><td class="a">مِدْرَارٌ</td><td>bol yağışlı</td></tr><tr><td class="a">مِفْعِيلٌ</td><td class="a">مِكْثِيرٌ</td><td>çok çoğaltan</td></tr><tr><td class="a">فُعَلَةٌ</td><td class="a">لُعَنَةٌ</td><td>çok lânet eden</td></tr></table><p>Son veznin aynı sâkin olursa (<span class="ar">لُعْنَةٌ</span>) mânâ <b>mef‘ûl</b>e döner: “çok lânet edilen”.</p>',
 ex:[['مَنْصُورٌ · مَجْبُورٌ','مَفْعُولٌ'],['كَسِيرٌ · قَتِيلٌ','فَعِيلٌ: mef‘ûl mânâsında'],['لُعَنَةٌ ↔ لُعْنَةٌ','Lânet eden ↔ lânet edilen'],['ضُحَكَةٌ ↔ ضُحْكَةٌ','Çok gülen ↔ kendisine çok gülünen (aynı vezin)']],
 q:[['Sülâsînin ism-i mef‘ûl vezinleri?',['مَفْعُولٌ ve فَعِيلٌ','فَاعِلٌ ve فَعِيلٌ','مُفْعَلٌ ve مَفْعَلٌ','فَعُولٌ ve فَعَّالٌ'],0,'مَجْبُورٌ، كَسِيرٌ'],['صِدِّيقٌ hangi mübâlağa vezni?',['فِعِّيلٌ','فَعِيلٌ','فَعَّالٌ','مِفْعِيلٌ'],0,'Çok sâdık.'],['Mübâlağa vezinleri kaç tane sayılmıştır?',['Sekiz','Altı','Dört','On'],0,'جَهُولٌ … لُعَنَةٌ'],['لُعَنَةٌ’nin aynı sâkin olursa?',['Mef‘ûl mânâsı kazanır','Masdar olur','Çoğul olur','Anlam değişmez'],0,'«يَصِيرُ بِمَعْنَى الْمَفْعُولِ»'],['مِدْرَارٌ hangi vezindedir?',['مِفْعَالٌ','فِعْلَالٌ','مِفْعِيلٌ','مَفْعَالٌ'],0,'Bol yağmurlu.']]},
