{id:'d15',k:3,p:13,t:'Tasrîf vecihleri ve nûn-ı te’kîd',ar:'عَدَدُ الْوُجُوهِ وَنُونَا التَّأْكِيدِ',
 m:['يَتَصَرَّفُ «الْمَاضِي»، وَ«الْمُسْتَقْبَلُ»، وَ«الْأَمْرُ»، وَ«النَّهْيُ» مِنَ الْمَعْرُوفِ وَالْمَجْهُولِ عَلَى أَرْبَعَةَ عَشَرَ وَجْهًا: ثَلَاثَةٌ لِلْغَائِبِ، وَثَلَاثَةٌ لِلْغَائِبَةِ، وَثَلَاثَةٌ لِلْمُخَاطَبِ، وَثَلَاثَةٌ لِلْمُخَاطَبَةِ، وَوَجْهَانِ لِلْمُتَكَلِّمِ رَجُلًا كَانَ أَوِ امْرَأَةً، غَيْرَ أَنَّهُ لَا يَأْتِي الْوَجْهَانِ لِلْمُتَكَلِّمِ فِي الْمَعْرُوفِ مِنَ الْأَمْرِ وَالنَّهْيِ. وَ«الْفَاعِلُ» يَتَصَرَّفُ عَلَى عَشَرَةِ أَوْجُهٍ؛ مِنْهَا جَمْعُ الْمُذَكَّرِ أَرْبَعَةُ أَلْفَاظٍ، وَجَمْعُ الْمُؤَنَّثِ لَفْظَانِ. وَ«الْمَفْعُولُ» يَتَصَرَّفُ عَلَى سَبْعَةِ أَوْجُهٍ؛ مِنْهَا جَمْعُ الْمُذَكَّرِ لَفْظَانِ، وَجَمْعُ الْمُؤَنَّثِ لَفْظٌ وَاحِدٌ.','وَ«نُونُ التَّأْكِيدِ الْمُشَدَّدَةُ»: تَدْخُلُ عَلَى جَمِيعِ [الْمُضَارِعِ وَ] الْأَمْرِ وَالنَّهْيِ مِنَ الْمَعْرُوفِ وَالْمَجْهُولِ. وَ«الْمُخَفَّفَةُ»: كَذٰلِكَ، غَيْرَ أَنَّهَا لَا تَدْخُلُ فِي التَّثْنِيَةِ وَجَمْعِ الْمُؤَنَّثِ. وَ«الْمُخَفَّفَةُ» سَاكِنَةٌ. وَ«الْمُشَدَّدَةُ» مَفْتُوحَةٌ، إِلَّا فِي التَّثْنِيَةِ وَجَمْعِ الْمُؤَنَّثِ، فَإِنَّهَا مَكْسُورَةٌ فِيهِمَا. وَمَا قَبْلَهُمَا: مَكْسُورَةٌ فِي الْوَاحِدَةِ الْحَاضِرَةِ، وَمَضْمُومٌ فِي جَمْعِ الْمُذَكَّرِ، وَمَفْتُوحٌ فِي الْبَوَاقِي.'],
 tr:'<p><b>Vecih sayıları:</b></p><ul><li>Mâzi, müstakbel, emir, nehiy (ma‘lûm ve meçhûl): <b>14</b> — 3 gâib, 3 gâibe, 3 muhâtab, 3 muhâtaba, 2 mütekellim. Ancak <b>ma‘lûm emir ve nehiyde mütekellim yoktur</b> → 12.</li><li>İsm-i fâil: <b>10</b> (cem‘-i müzekker 4 lafız, cem‘-i müennes 2 lafız).</li><li>İsm-i mef‘ûl: <b>7</b> (cem‘-i müzekker 2, cem‘-i müennes 1).</li></ul><p><b>Nûn-ı te’kîd:</b></p><table class="mini"><tr><th></th><th>Sakîle (müşedded) نّ</th><th>Hafîfe (muhaffef) نْ</th></tr><tr><td>Nereye girer?</td><td>Muzâri, emir, nehiy — hepsine</td><td>Aynı; ama tesniye ve cem‘-i müennese girmez</td></tr><tr><td>Harekesi</td><td>Fetha; tesniye ve cem‘-i müennesde esre</td><td>Sâkin</td></tr></table><p><b>Nûndan önceki harf:</b> müfrede muhâtabada <b>esre</b>, cem‘-i müzekkerde <b>ötre</b>, diğerlerinde <b>üstün</b>.</p>',
 ex:[['لَيَنْصُرَنَّ · لِيَنْصُرَانِّ · اُنْصُرْنَانِّ','Sakîle: tesniye ve cem‘-i müennesde esre'],['اُنْصُرِنَّ · اُنْصُرُنَّ · اُنْصُرَنَّ','Öncesi: esre, ötre, üstün'],['اُنْصُرَنْ · اُنْصُرُنْ · اُنْصُرِنْ','Hafîfe: yalnız üç sîga (muhâtab)']],
 q:[['Ma‘lûm emirde kaç vecih vardır?',['On iki','On dört','On','Altı'],0,'Mütekellim gelmez.'],['İsm-i fâil kaç vecih çekilir?',['On','Yedi','On dört','Altı'],0,'Cem‘-i müzekker 4, cem‘-i müennes 2 lafız.'],['İsm-i mef‘ûl kaç vecih?',['Yedi','On','On dört','Dört'],0,'مَنْصُورٌ … مَنْصُورَاتٌ'],['Nûn-ı hafîfe nereye girmez?',['Tesniye ve cem‘-i müennes','Müfred','Cem‘-i müzekker','Müfrede muhâtaba'],0,'«لَا تَدْخُلُ فِي التَّثْنِيَةِ وَجَمْعِ الْمُؤَنَّثِ»'],['Nûn-ı sakîle tesniyede nasıldır?',['Esreli','Fethalı','Sâkin','Ötreli'],0,'لِيَنْصُرَانِّ'],['اُنْصُرِنَّ’de nûndan önceki harf neden esreli?',['Müfrede muhâtaba olduğu için','Tesniye olduğu için','Cem‘ olduğu için','Meçhûl olduğu için'],0,'Hazf edilen yâya delâlet eder.']]},
{id:'d16',k:3,p:14,t:'Sülâsî mücerred misali: نَصَرَ',ar:'مِثَالُ الثُّلَاثِيِّ الْمُجَرَّدِ',
 m:['مِثَالُ الْمَاضِي مِنَ الْمَعْرُوفِ: نَصَرَ نَصَرَا نَصَرُوا، نَصَرَتْ نَصَرَتَا نَصَرْنَ، نَصَرْتَ نَصَرْتُمَا نَصَرْتُمْ، نَصَرْتِ نَصَرْتُمَا نَصَرْتُنَّ، نَصَرْتُ نَصَرْنَا. وَمِنَ الْمَجْهُولِ: نُصِرَ نُصِرَا نُصِرُوا… إِلَخْ.','وَمِثَالُ الْمُسْتَقْبَلِ: يَنْصُرُ يَنْصُرَانِ يَنْصُرُونَ، تَنْصُرُ تَنْصُرَانِ يَنْصُرْنَ، تَنْصُرُ تَنْصُرَانِ تَنْصُرُونَ، تَنْصُرِينَ تَنْصُرَانِ تَنْصُرْنَ، أَنْصُرُ نَنْصُرُ. وَمِنَ الْمَجْهُولِ: يُنْصَرُ يُنْصَرَانِ يُنْصَرُونَ… إِلَخْ.','وَمِثَالُ أَمْرِ الْغَائِبِ: لِيَنْصُرْ لِيَنْصُرَا لِيَنْصُرُوا، لِتَنْصُرْ لِتَنْصُرَا لِيَنْصُرْنَ. وَمِثَالُ أَمْرِ الْحَاضِرِ: اُنْصُرْ اُنْصُرَا اُنْصُرُوا، اُنْصُرِي اُنْصُرَا اُنْصُرْنَ. وَمِنَ الْمَجْهُولِ: لِيُنْصَرْ لِيُنْصَرَا لِيُنْصَرُوا، لِتُنْصَرْ لِتُنْصَرَا لِيُنْصَرْنَ؛ لِتُنْصَرْ لِتُنْصَرَا لِتُنْصَرُوا، لِتُنْصَرِي لِتُنْصَرَا لِتُنْصَرْنَ، لِأُنْصَرْ لِنُنْصَرْ. وَكَذٰلِكَ النَّهْيُ مِنَ الْمَعْرُوفِ وَالْمَجْهُولِ إِلَّا أَنَّهُ زِيدَ فِي أَوَّلِهِ «لَا».','وَتَقُولُ فِي نُونِ التَّأْكِيدِ الْمُشَدَّدَةِ فِي أَمْرِ الْغَائِبِ: لِيَنْصُرَنَّ لِيَنْصُرَانِّ لِيَنْصُرُنَّ، لِتَنْصُرَنَّ لِتَنْصُرَانِّ لِيَنْصُرْنَانِّ. وَفِي أَمْرِ الْحَاضِرِ: اُنْصُرَنَّ اُنْصُرَانِّ اُنْصُرُنَّ، اُنْصُرِنَّ اُنْصُرَانِّ اُنْصُرْنَانِّ. وَفِي الْمُخَفَّفَةِ: لِيَنْصُرَنْ، لِيَنْصُرُنْ، لِتَنْصُرَنْ، وَفِي الْمُخَاطَبِ: اُنْصُرَنْ، اُنْصُرُنْ، اُنْصُرِنْ.','مِثَالُ الْفَاعِلِ: نَاصِرٌ نَاصِرَانِ نَاصِرُونَ، نُصَّارٌ وَنُصَّرٌ وَنَصَرَةٌ؛ نَاصِرَةٌ نَاصِرَتَانِ نَاصِرَاتٌ وَنَوَاصِرُ. وَمِثَالُ الْمَفْعُولِ: مَنْصُورٌ مَنْصُورَانِ مَنْصُورُونَ وَمَنَاصِيرُ؛ مَنْصُورَةٌ مَنْصُورَتَانِ مَنْصُورَاتٌ.'],
 tr:'<p>Kitap bütün kuralları <span class="ar">نَصَرَ</span> üzerinde gösterir. Bunların hepsini <b>Darphâne</b> bölümünde istediğin sahîh kök ve bâbla canlı olarak basabilirsin.</p><ul><li>Mâzi ve müstakbel: 14’er sîga, ma‘lûm ve meçhûl.</li><li>Emr-i gâib (6) + emr-i hâzır (6) = ma‘lûm emir 12; meçhûl emir 14 (hepsi lâmla: <span class="ar">لِتُنْصَرْ، لِأُنْصَرْ</span>).</li><li>Nehiy: aynısı, başında <span class="ar">لَا</span>.</li><li>Nûn-ı sakîle: emir 12; hafîfe: 6.</li><li>Fâil 10, mef‘ûl 7.</li></ul><p>Meçhûl nûnlu emirde muzâraat harfi ötre, sad üstündür: <span class="ar">لِيُنْصَرَنَّ</span>; hâzır da lâmla olur.</p>',
 ex:[['نُصَّارٌ وَنُصَّرٌ وَنَصَرَةٌ','Cem‘-i müzekkerin üç teksîr lafzı (+نَاصِرُونَ = dört)'],['نَاصِرَاتٌ وَنَوَاصِرُ','Cem‘-i müennesin iki lafzı'],['مَنْصُورُونَ وَمَنَاصِيرُ','Mef‘ûlde cem‘-i müzekkerin iki lafzı'],['لِأُنْصَرْ · لِنُنْصَرْ','Meçhûl emirde mütekellim vardır']],
 q:[['نَصَرَ’nin cem‘-i müennes gâibe mâzisi?',['نَصَرْنَ','نَصَرْتُنَّ','يَنْصُرْنَ','نَصَرَتَا'],0,'«نَصَرَتْ نَصَرَتَا نَصَرْنَ»'],['Cem‘-i müennes muhâtaba müstakbeli?',['تَنْصُرْنَ','يَنْصُرْنَ','تَنْصُرِينَ','تَنْصُرُونَ'],0,'Muhâtaba cemi.'],['Emr-i hâzır meçhûlün müfred müzekkeri?',['لِتُنْصَرْ','اُنْصَرْ','لِتَنْصُرْ','تُنْصَرْ'],0,'Meçhûlde hâzır da lâmla.'],['Hangisi ism-i fâil cem‘-i müzekker lafızlarından değildir?',['نَوَاصِرُ','نُصَّارٌ','نُصَّرٌ','نَصَرَةٌ'],0,'نَوَاصِرُ müennesin cem‘idir.'],['اُنْصُرْنَانِّ hangi sîgadır?',['Cem‘-i müennes muhâtaba, nûn-ı sakîle','Tesniye, hafîfe','Cem‘-i müzekker','Müfrede muhâtaba'],0,'Elif ile nûnlar ayrılır.']]},
{id:'d17',k:3,p:15,t:'Rubâî ve rubâî mezîd misalleri',ar:'مِثَالُ الرُّبَاعِيِّ وَالرُّبَاعِيِّ الْمَزِيدِ',
 m:['وَمِثَالُ الرُّبَاعِيِّ الْمُجَرَّدِ: دَحْرَجَ، يُدَحْرِجُ، دَحْرَجَةً وَدِحْرَاجًا، فَهُوَ مُدَحْرِجٌ، وَذَاكَ مُدَحْرَجٌ، وَالْأَمْرُ: دَحْرِجْ، وَالنَّهْيُ: لَا تُدَحْرِجْ. وَكَذٰلِكَ تَصْرِيفُ الْمُلْحَقَاتِ.','أَخْرَجَ، يُخْرِجُ، إِخْرَاجًا، فَهُوَ مُخْرِجٌ، وَذَاكَ مُخْرَجٌ، وَالْأَمْرُ: أَخْرِجْ، وَالنَّهْيُ: لَا تُخْرِجْ. وَقَدْ حُذِفَتِ الْهَمْزَةُ مِنْ مُسْتَقْبَلِ هٰذَا الْبَابِ كَيْلَا يَجْتَمِعَ هَمْزَتَانِ فِي نَفْسِ الْمُتَكَلِّمِ. وَكَذٰلِكَ حُذِفَتْ مِنَ الْفَاعِلِ وَالْمَفْعُولِ وَأَمْرِ الْغَائِبِ وَالنَّهْيِ اطِّرَادًا لِلْبَابِ.','وَخَرَّجَ، يُخَرِّجُ، تَخْرِيجًا وَتَخْرِجَةً، فَهُوَ مُخَرِّجٌ، وَذَاكَ مُخَرَّجٌ، وَالْأَمْرُ: خَرِّجْ، وَالنَّهْيُ: لَا تُخَرِّجْ. وَالرَّاءُ مُشَدَّدَةٌ فِي الْجَمِيعِ إِلَّا فِي الْمَصْدَرِ. وَخَاصَمَ، يُخَاصِمُ، مُخَاصَمَةً وَخِصَامًا، فَهُوَ مُخَاصِمٌ، وَذَاكَ مُخَاصَمٌ، وَالْأَمْرُ: خَاصِمْ، وَالنَّهْيُ: لَا تُخَاصِمْ. وَمَجْهُولُ الْمَاضِي: خُوصِمَ… إِلَخْ.'],
 tr:'<p>Kitap her bâbı kısa bir <b>tasrîf zinciri</b> ile verir: mâzi, muzâri, masdar, <span class="ar">فَهُوَ</span> fâil, <span class="ar">وَذَاكَ</span> mef‘ûl, emir, nehiy.</p><p><b>If‘âl bâbında hemzenin düşmesi:</b> <span class="ar">أَخْرَجَ</span>’in muzârisi aslında <span class="ar">يُؤَخْرِجُ</span> olmalıydı. Mütekellimde <span class="ar">أُؤَخْرِجُ</span> diye <b>iki hemze</b> birleşeceği için hemze atıldı; bâb düzenli olsun diye (<b>ıttırâd</b>) fâil, mef‘ûl, emr-i gâib ve nehiyden de atıldı.</p><p><b>Tef‘îl:</b> ayn (ر) masdar hariç hepsinde şeddelidir: <span class="ar">تَخْرِيجٌ</span>.</p>',
 ex:[['دَحْرَجَ يُدَحْرِجُ دَحْرَجَةً وَدِحْرَاجًا فَهُوَ مُدَحْرِجٌ وَذَاكَ مُدَحْرَجٌ','Rubâî mücerred zinciri'],['أَخْرَجَ يُخْرِجُ إِخْرَاجًا','If‘âl'],['خَرَّجَ يُخَرِّجُ تَخْرِيجًا وَتَخْرِجَةً','Tef‘îl'],['خَاصَمَ يُخَاصِمُ مُخَاصَمَةً وَخِصَامًا','Mufâale; meçhûlü خُوصِمَ']],
 q:[['يُخْرِجُ’da hemze neden düşmüştür?',['Mütekellimde iki hemze birleşmesin diye','Vasl hemzesi olduğu için','Kıyas gereği','Lâzım olduğu için'],0,'«كَيْلَا يَجْتَمِعَ هَمْزَتَانِ»'],['Fâil ve mef‘ûlden de hemze neden atıldı?',['Bâbın düzeni (ıttırâd) için','İki hemze olduğu için','Şâz olduğu için','Ses uyumu için'],0,'«اطِّرَادًا لِلْبَابِ»'],['خَرَّجَ bâbında ayn hangi kelimede şeddesizdir?',['Masdarda (تَخْرِيجٌ)','Mâzide','Emirde','Fâilde'],0,'«إِلَّا فِي الْمَصْدَرِ»'],['خَاصَمَ’in mâzi meçhûlü?',['خُوصِمَ','خُصِمَ','خَوصِمَ','خُاصِمَ'],0,'Elif ötreden sonra vava döner.'],['دَحْرَجَ’in emri?',['دَحْرِجْ','اُدَحْرِجْ','دَحْرَجْ','أَدْحِرْجْ'],0,'Harekeli başlar.']]},
{id:'d18',k:3,p:15,t:'Humâsî ve südâsî misalleri',ar:'مِثَالُ الْخُمَاسِيِّ وَالسُّدَاسِيِّ',
 m:['اِنْكَسَرَ، يَنْكَسِرُ، اِنْكِسَارًا، فَهُوَ مُنْكَسِرٌ، وَذَاكَ مُنْكَسَرٌ بِهِ. وَاكْتَسَبَ، يَكْتَسِبُ، اِكْتِسَابًا. وَاصْفَرَّ، يَصْفَرُّ، اِصْفِرَارًا، فَهُوَ مُصْفَرٌّ. وَتَكَسَّرَ، يَتَكَسَّرُ، تَكَسُّرًا. وَتَصَالَحَ، يَتَصَالَحُ، تَصَالُحًا.','وَأَمَّا «اِدَّثَّرَ» وَ«اِثَّاقَلَ»: فَأَصْلُ الْأَوَّلِ: «تَدَثَّرَ» كَـ«تَكَسَّرَ»، وَأَصْلُ الثَّانِي: «تَثَاقَلَ» كَـ«تَصَالَحَ»، فَأُدْغِمَتِ التَّاءُ فِيهِمَا فِيمَا بَعْدَهُمَا، ثُمَّ أُدْخِلَتْ هَمْزَةُ الْوَصْلِ لِيُمْكِنَ الِابْتِدَاءُ بِهَا، لِأَنَّ السَّاكِنَ لَا يُبْتَدَأُ بِهِ. وَتَدَحْرَجَ، يَتَدَحْرَجُ، تَدَحْرُجًا.','اِسْتَغْفَرَ، يَسْتَغْفِرُ، اِسْتِغْفَارًا. وَاشْهَابَّ، يَشْهَابُّ، اِشْهِيبَابًا. وَاغْدَوْدَنَ، يَغْدَوْدِنُ، اِغْدِيدَانًا. وَاجْلَوَّذَ، يَجْلَوِّذُ، اِجْلِوَّاذًا. وَاسْحَنْكَكَ، يَسْحَنْكِكُ، اِسْحِنْكَاكًا. وَاسْلَنْقَى، يَسْلَنْقِي، اِسْلِنْقَاءً. وَاقْشَعَرَّ، يَقْشَعِرُّ، اِقْشِعْرَارًا. وَاحْرَنْجَمَ، يَحْرَنْجِمُ، اِحْرِنْجَامًا.'],
 tr:'<p>Kitabın humâsî ve südâsî tasrîf zincirlerinin tamamı <b>Darphâne → Bâb vitrini</b>nde.</p><p><b>اِدَّثَّرَ ve اِثَّاقَلَ:</b> Asılları <span class="ar">تَدَثَّرَ</span> ve <span class="ar">تَثَاقَلَ</span>’dir. Tâ, kendisinden sonraki harfe (د / ث) <b>idğam</b> edildi. Kelime sâkinle başladığı için (sâkinle başlanmaz) başa <b>hemze-i vasl</b> getirildi. Bu dönüşümü İ‘lâl Ocağı’nda adım adım izleyebilirsin.</p><p>Dikkat: <span class="ar">اِفْعَلَّ، اِفْعَالَّ، اِفْعَلَلَّ</span> bâblarında son harf masdar dışında şeddelidir: <span class="ar">اِصْفِرَارٌ، اِشْهِيبَابٌ، اِقْشِعْرَارٌ</span>.</p>',
 ex:[['اِنْكَسَرَ يَنْكَسِرُ اِنْكِسَارًا فَهُوَ مُنْكَسِرٌ وَذَاكَ مُنْكَسَرٌ بِهِ','Lâzım olduğu için mef‘ûl “bihî” ile'],['تَدَثَّرَ → اِدَّثَّرَ','Tâ idğam + hemze-i vasl'],['تَثَاقَلَ → اِثَّاقَلَ','Aynı yol'],['اِسْتَغْفَرَ يَسْتَغْفِرُ اِسْتِغْفَارًا','İstif‘âl'],['اِحْرَنْجَمَ يَحْرَنْجِمُ اِحْرِنْجَامًا','Rubâî mezîd']],
 q:[['اِدَّثَّرَ’nin aslı?',['تَدَثَّرَ','دَثَرَ','تَدَاثَرَ','أَدْثَرَ'],0,'تَفَعَّلَ bâbı.'],['Başa neden hemze-i vasl getirildi?',['Sâkinle başlanamayacağı için','Muzâri olsun diye','Meçhûl olsun diye','Ta‘diye için'],0,'«لِأَنَّ السَّاكِنَ لَا يُبْتَدَأُ بِهِ»'],['اِنْكَسَرَ’in mef‘ûlü neden مُنْكَسَرٌ بِهِ’dir?',['Fiil lâzım olduğu için','Meçhûl olduğu için','Mezîd olduğu için','Şâz olduğu için'],0,'Lâzımdan mef‘ûl harf-i cerle gelir.'],['اِشْهَابَّ’nin masdarı?',['اِشْهِيبَابٌ','اِشْهِبَابٌ','تَشَهُّبٌ','اِشْهِيبَابُّ'],0,'Kitaptaki gibi.'],['اِسْلَنْقَى’nın muzârisi?',['يَسْلَنْقِي','يَسْلَنْقَى','يَسْلَنْقُو','يُسْلَنْقِي'],0,'Sonu nâkıs gibi.']]},
/* ---------- 4. FEVÂİD ---------- */
{id:'d19',k:4,p:18,t:'Lâzım ve müteaddî',ar:'اللَّازِمُ وَالْمُتَعَدِّي',
 m:['اللَّازِمُ يَصِيرُ مُتَعَدِّيًا بِأَحَدِ ثَلَاثَةِ أَسْبَابٍ: بِزِيَادَةِ الْهَمْزَةِ فِي أَوَّلِهِ، وَحَرْفِ الْجَرِّ فِي آخِرِهِ، وَتَشْدِيدِ عَيْنِهِ، نَحْوُ: «أَخْرَجْتُهُ / وَخَرَّجْتُهُ / وَخَرَجْتُ بِهِ مِنَ الدَّارِ». وَبِحَذْفِ التَّاءِ مِنْ «تَفَعَّلَ» وَ«تَفَعْلَلَ» -مُشَدَّدَةِ الْعَيْنِ، وَمُكَرَّرَةِ اللَّامِ-.','وَالْمُتَعَدِّي يَصِيرُ لَازِمًا: بِحَذْفِ أَسْبَابِ التَّعْدِيَةِ، وَبِنَقْلِهِ إِلَى بَابِ «انْكَسَرَ»، وَبَابُ «فَعْلَلَ» يَصِيرُ لَازِمًا بِزِيَادَةِ التَّاءِ فِي أَوَّلِهِ. وَلَا يَجِيءُ: «الْمَفْعُولُ بِهِ»، وَ«الْمَجْهُولُ»، [وَ«اسْمُ الْمَفْعُولِ»] مِنَ اللَّازِمِ، لِأَنَّ «اللَّازِمَ» مِنَ الْأَفْعَالِ: هُوَ مَا لَا يَحْتَاجُ إِلَى الْمَفْعُولِ بِهِ، وَ«الْمُتَعَدِّي» بِخِلَافِهِ.'],
 tr:'<p><b>Lâzım → müteaddî</b> (dört yol):</p><ol><li>Başa <b>hemze</b>: <span class="ar">خَرَجَ → أَخْرَجْتُهُ</span></li><li>Sonra <b>harf-i cer</b>: <span class="ar">خَرَجْتُ بِهِ</span></li><li><b>Aynı şeddelemek</b>: <span class="ar">خَرَّجْتُهُ</span></li><li><span class="ar">تَفَعَّلَ</span> ve <span class="ar">تَفَعْلَلَ</span>’den <b>tâyı atmak</b>: <span class="ar">تَدَحْرَجَ → دَحْرَجَ</span></li></ol><p><b>Müteaddî → lâzım:</b> ta‘diye sebeplerini atmak; <span class="ar">اِنْكَسَرَ</span> bâbına nakletmek (<span class="ar">كَسَرَ → اِنْكَسَرَ</span>); <span class="ar">فَعْلَلَ</span>’nin başına tâ eklemek (<span class="ar">دَحْرَجَ → تَدَحْرَجَ</span>).</p><p>Lâzımdan <b>mef‘ûlün bih, meçhûl ve ism-i mef‘ûl gelmez</b>; çünkü lâzım mef‘ûle ihtiyaç duymayan fiildir.</p>',
 ex:[['أَخْرَجْتُهُ','Hemze ile'],['خَرَّجْتُهُ','Teşdîd ile'],['خَرَجْتُ بِهِ مِنَ الدَّارِ','Harf-i cer ile'],['كَسَرْتُهُ فَانْكَسَرَ','اِنْكَسَرَ bâbına nakil: lâzım'],['دَحْرَجْتُهُ فَتَدَحْرَجَ','Tâ ile lâzım']],
 q:[['Hangisi lâzımı müteaddî yapan sebeplerden değildir?',['اِنْكَسَرَ bâbına nakil','Başa hemze','Aynı şeddelemek','Harf-i cer'],0,'Nakil müteaddîyi lâzım yapar.'],['تَدَحْرَجَ nasıl müteaddî olur?',['Tâ atılarak (دَحْرَجَ)','Hemze ile','Harf-i cerle','Şedde ile'],0,'Tâ hazfı.'],['Lâzımdan hangisi gelmez?',['İsm-i mef‘ûl','İsm-i fâil','Masdar','Emir'],0,'Mef‘ûle ihtiyaç yok.'],['دَحْرَجَ nasıl lâzım olur?',['Başına tâ eklenerek','Hemze ile','Şedde ile','اِنْكَسَرَ’e nakille'],0,'تَدَحْرَجَ']]},
{id:'d20',k:4,p:18,t:'Fâale ve tefâale bâbları',ar:'أَبْنِيَةُ بَابَيْ فَاعَلَ وَتَفَاعَلَ',
 m:['وَبَابُ «فَاعَلَ» يَكُونُ لِلْمُشَارَكَةِ بَيْنَ الِاثْنَيْنِ، نَحْوُ: «نَاضَلْتُهُ»؛ إِلَّا قَلِيلًا، نَحْوُ: «طَارَقْتُ النَّعْلَ»، وَ«عَاقَبْتُ اللِّصَّ».','وَبَابُ «تَفَاعَلَ» أَيْضًا يَكُونُ بَيْنَ الِاثْنَيْنِ فَصَاعِدًا، نَحْوُ: «تَدَافَعْنَا»، وَ«تَصَالَحَ الْقَوْمُ»؛ وَقَدْ يَكُونُ لِإِظْهَارِ مَا لَيْسَ فِي الْبَاطِنِ، نَحْوُ: «تَمَارَضْتُ»، أَيْ: أَظْهَرْتُ الْمَرَضَ وَلَيْسَ لِي مَرَضٌ.'],
 tr:'<ul><li><b>فَاعَلَ</b>: iki kişi arasında <b>müşâreket</b> (karşılıklılık): <span class="ar">نَاضَلْتُهُ</span> onunla ok atışında yarıştım. Az olarak müşâreketsiz: <span class="ar">طَارَقْتُ النَّعْلَ</span> (ayakkabıyı kat kat diktim), <span class="ar">عَاقَبْتُ اللِّصَّ</span> (hırsızı cezalandırdım).</li><li><b>تَفَاعَلَ</b>: iki veya daha fazla kişi arasında: <span class="ar">تَدَافَعْنَا</span> birbirimizi ittik, <span class="ar">تَصَالَحَ الْقَوْمُ</span> kavim barıştı. Bazen <b>tezâhür</b>: içte olmayanı dışa vurmak: <span class="ar">تَمَارَضْتُ</span> hasta değilken hasta göründüm.</li></ul>',
 ex:[['نَاضَلْتُهُ','Müşâreket'],['عَاقَبْتُ اللِّصَّ','Müşâreketsiz (az)'],['تَصَالَحَ الْقَوْمُ','Çok kişi arasında'],['تَمَارَضْتُ','Tezâhür: yapar gibi görünmek']],
 q:[['فَاعَلَ’in asıl mânâsı?',['İki kişi arasında müşâreket','Talep','Ta‘diye','Mutâvaat'],0,'نَاضَلْتُهُ'],['تَمَارَضْتُ ne demektir?',['Hasta değilken hasta göründüm','Hastalandım','Hastayı ziyaret ettim','Hastalıkla mücadele ettim'],0,'«أَظْهَرْتُ الْمَرَضَ وَلَيْسَ لِي مَرَضٌ»'],['Hangisi فَاعَلَ’de müşâreketsiz örnektir?',['عَاقَبْتُ اللِّصَّ','نَاضَلْتُهُ','قَاتَلْتُهُ','خَاصَمْتُهُ'],0,'Kitaptaki istisna.']]},
{id:'d21',k:4,p:19,t:'İftiâl bâbında ibdâl',ar:'قَوَاعِدُ الْإِبْدَالِ فِي بَابِ افْتَعَلَ',
 m:['وَإِذَا كَانَ فَاءُ الْفِعْلِ مِنْ «افْتَعَلَ» حَرْفًا مِنْ «حُرُوفِ الْإِطْبَاقِ» -وَهِيَ: الصَّادُ، وَالضَّادُ، وَالطَّاءُ، وَالظَّاءُ-: تَصِيرُ تَاءُ «افْتَعَلَ» طَاءً، نَحْوُ: «اِصْطَبَرَ»، وَ«اِضْطَرَبَ»، وَ«اِطَّرَدَ»، وَ«اِظَّهَرَ».','وَإِذَا كَانَ فَاءُ «افْتَعَلَ» دَالًا أَوْ ذَالًا أَوْ زَايًا: تَصِيرُ تَاءُ «افْتَعَلَ» دَالًا، نَحْوُ: «اِدَّمَعَ»، وَ«اِدَّكَرَ» -بِإِدْغَامِ الذَّالِ فِي الدَّالِ-، وَ«اِزْدَجَرَ».','وَإِذَا كَانَ فَاؤُهُ وَاوًا أَوْ يَاءً أَوْ ثَاءً: قُلِبَتِ الْوَاوُ وَالْيَاءُ وَالثَّاءُ تَاءً، ثُمَّ أُدْغِمَتْ فِي تَاءِ «افْتَعَلَ»، نَحْوُ: «اِتَّقَى»، وَ«اِتَّسَرَ»، وَ«اِتَّغَرَ».'],
 tr:'<p>İftiâl’in <b>tâ</b>sı, fâü’l-fiile göre değişir:</p><table class="mini"><tr><th>Fâ</th><th>Ne olur?</th><th>Misal</th></tr><tr><td>ص ض ط ظ (itbâk harfleri)</td><td>tâ → <b>ط</b></td><td class="a">اِصْطَبَرَ، اِضْطَرَبَ، اِطَّرَدَ، اِظَّهَرَ</td></tr><tr><td>د ذ ز</td><td>tâ → <b>د</b></td><td class="a">اِدَّمَعَ، اِدَّكَرَ، اِزْدَجَرَ</td></tr><tr><td>و ي ث</td><td>fâ → <b>ت</b>, sonra idğam</td><td class="a">اِتَّقَى، اِتَّسَرَ، اِتَّغَرَ</td></tr></table><p><span class="ar">اِدَّكَرَ</span>’de zel, dâle dönüşüp idğam edilmiştir (<span class="ar">اِذْتَكَرَ → اِذْدَكَرَ → اِدَّكَرَ</span>). ط ve ظ ile, D ile de iki aynı harf birleşince idğam olur: <span class="ar">اِطَّرَدَ، اِدَّمَعَ</span>.</p>',
 ex:[['اِصْتَبَرَ → اِصْطَبَرَ','ص: tâ → ط'],['اِضْتَرَبَ → اِضْطَرَبَ','ض'],['اِطْتَرَدَ → اِطَّرَدَ','ط: tâ → ط ve idğam'],['اِزْتَجَرَ → اِزْدَجَرَ','ز: tâ → د'],['اِذْتَكَرَ → اِدَّكَرَ','ذ: tâ → د, ذ da د olup idğam'],['اِوْتَقَى → اِتَّقَى','و: vav → ت ve idğam'],['اِيْتَسَرَ → اِتَّسَرَ','ي → ت'],['اِثْتَغَرَ → اِثَّغَرَ / اِتَّغَرَ','ث → ت']],
 q:[['صَبَرَ’den iftiâl?',['اِصْطَبَرَ','اِصْتَبَرَ','اِصَّبَرَ','اِصْدَبَرَ'],0,'İtbâk harfi: tâ → ط.'],['زَجَرَ’den iftiâl?',['اِزْدَجَرَ','اِزْتَجَرَ','اِزَّجَرَ','اِزْطَجَرَ'],0,'ز: tâ → د.'],['وَقَى’den iftiâl?',['اِتَّقَى','اِوْتَقَى','اِيتَقَى','اِدَّقَى'],0,'Vav tâ olup idğam edilir.'],['İtbâk harfleri hangileridir?',['ص ض ط ظ','د ذ ز','و ي ث','ح خ ع غ'],0,'حروف الإطباق'],['ذَكَرَ’den iftiâl?',['اِدَّكَرَ','اِذْتَكَرَ','اِذَّكَرَ','اِتَّكَرَ'],0,'Kitapta: «بِإِدْغَامِ الذَّالِ فِي الدَّالِ»']]},
{id:'d22',k:4,p:19,t:'Ziyâde harfleri ve bâbların binası',ar:'حُرُوفُ الزِّيَادَةِ وَأَبْنِيَةُ بَعْضِ الْأَبْوَابِ',
 m:['وَالْحُرُوفُ الَّتِي تُزَادُ فِي الْأَسْمَاءِ وَالْأَفْعَالِ عَشَرَةٌ، مَجْمُوعُهَا: «اَلْيَوْمَ تَنْسَاهُ». فَإِذَا كَانَتْ كَلِمَةٌ وَعَدَدُهَا زَائِدٌ عَلَى ثَلَاثَةِ أَحْرُفٍ وَفِيهَا حَرْفٌ وَاحِدٌ مِنْ هٰذِهِ الْحُرُوفِ فَاحْكُمْ بِأَنَّهَا زَائِدَةٌ؛ إِلَّا أَنْ لَا يَكُونَ لَهَا مَعْنًى بِدُونِهَا، نَحْوُ: «وَسْوَسَ».','وَأَبْوَابُ الرُّبَاعِيِّ كُلُّهَا مُتَعَدٍّ؛ إِلَّا «دَرْبَحَ». وَأَبْوَابُ الْخُمَاسِيِّ كُلُّهَا لَوَازِمُ؛ إِلَّا ثَلَاثَةَ أَبْوَابٍ: «اِفْتَعَلَ»، وَ«تَفَعَّلَ»، وَ«تَفَاعَلَ»، فَإِنَّهَا مُشْتَرَكَةٌ بَيْنَ اللَّازِمِ وَالْمُتَعَدِّي. وَأَبْوَابُ السُّدَاسِيِّ كُلُّهَا لَوَازِمُ؛ إِلَّا: بَابَ «اِسْتَفْعَلَ»، فَإِنَّهُ مُشْتَرَكٌ بَيْنَ اللَّازِمِ وَالْمُتَعَدِّي، وَكَلِمَتَيْنِ مِنْ بَابِ «اِفْعَنْلَى»، فَإِنَّهُمَا مُتَعَدِّيَانِ، وَهُمَا: «اِسْرَنْدَاهُ»، وَ«اِغْرَنْدَاهُ»، مَعْنَاهُمَا: غَلَبَ عَلَيْهِ، وَقَهَرَهُ.'],
 tr:'<p><b>Ziyâde harfleri (10):</b> <span class="ar">اَلْيَوْمَ تَنْسَاهُ</span> → ا ل ي و م ت ن س ا ه. Üç harften uzun bir kelimede bunlardan biri varsa zâiddir; ancak harf atılınca kelimenin mânâsı kalmıyorsa aslîdir: <span class="ar">وَسْوَسَ</span> (vavlar aslî).</p><table class="mini"><tr><th>Grup</th><th>Hüküm</th><th>İstisna</th></tr><tr><td>Rubâî bâbları</td><td>hepsi müteaddî</td><td class="a">دَرْبَحَ (lâzım)</td></tr><tr><td>Humâsî</td><td>hepsi lâzım</td><td class="a">اِفْتَعَلَ، تَفَعَّلَ، تَفَاعَلَ (ikisi de olur)</td></tr><tr><td>Südâsî</td><td>hepsi lâzım</td><td class="a">اِسْتَفْعَلَ (ikisi de) · اِسْرَنْدَاهُ، اِغْرَنْدَاهُ (müteaddî)</td></tr></table>',
 ex:[['اَلْيَوْمَ تَنْسَاهُ','On ziyâde harfi'],['وَسْوَسَ','Vav aslî: atılınca mânâ kalmaz'],['دَرْبَحَ','Lâzım rubâî (istisna)'],['اِسْرَنْدَاهُ · اِغْرَنْدَاهُ','Ona galebe çaldı: müteaddî südâsî']],
 q:[['Ziyâde harflerini toplayan ifade?',['اَلْيَوْمَ تَنْسَاهُ','سَأَلْتُمُونِيهَا','أَتَيْنَ','حُرُوفُ الْحَلْقِ'],0,'On harf.'],['Humâsî bâblardan hangisi müteaddî de olabilir?',['اِفْتَعَلَ','اِنْفَعَلَ','اِفْعَلَّ','Hiçbiri'],0,'اِفْتَعَلَ، تَفَعَّلَ، تَفَاعَلَ'],['Rubâî bâblardan lâzım olan istisna?',['دَرْبَحَ','دَحْرَجَ','أَكْرَمَ','قَاتَلَ'],0,'«إِلَّا دَرْبَحَ»'],['وَسْوَسَ’teki vav neden zâid sayılmaz?',['Onsuz kelimenin mânâsı kalmaz','Başta olduğu için','Şeddeli olduğu için','İllet harfi olduğu için'],0,'İstisna.'],['Südâsîde müteaddî olabilen bâb?',['اِسْتَفْعَلَ','اِفْعَوْعَلَ','اِفْعَالَّ','اِفْعَوَّلَ'],0,'Lâzım ve müteaddî arasında müşterek.']]},
{id:'d23',k:4,p:19,t:'Ef‘ale hemzesinin mânâları',ar:'مَعَانِي هَمْزَةِ أَفْعَلَ',
 m:['وَهَمْزَةُ «أَفْعَلَ» تَجِيءُ لِمَعَانٍ: لِلتَّعْدِيَةِ، نَحْوُ: «أَكْرَمْتُهُ»، وَلِلصَّيْرُورَةِ، نَحْوُ: «أَمْشَى الرَّجُلُ»، أَيْ: صَارَ ذَا مَاشِيَةٍ، وَلِلْوِجْدَانِ، نَحْوُ: «أَبْخَلْتُهُ»، أَيْ: وَجَدْتُهُ بَخِيلًا، وَلِلْحَيْنُونَةِ، نَحْوُ: «أَحْصَدَ الزَّرْعُ»، أَيْ: حَانَ وَقْتُ حَصَادِهِ، وَلِلْإِزَالَةِ، نَحْوُ: «أَشْكَيْتُهُ»، أَيْ: أَزَلْتُ عَنْهُ الشِّكَايَةَ، وَلِلدُّخُولِ فِي الشَّيْءِ، نَحْوُ: «أَصْبَحَ الرَّجُلُ»، إِذَا دَخَلَ فِي الصَّبَاحِ، وَلِلْكَثْرَةِ، نَحْوُ: «أَلْبَنَ الرَّجُلُ»، إِذَا كَثُرَ عِنْدَهُ اللَّبَنُ.'],
 tr:'<p><span class="ar">أَفْعَلَ</span> hemzesinin <b>yedi mânâsı</b>:</p><table class="mini"><tr><td><b>Ta‘diye</b></td><td class="a">أَكْرَمْتُهُ</td><td>ona ikram ettim</td></tr><tr><td><b>Sayrûret</b></td><td class="a">أَمْشَى الرَّجُلُ</td><td>hayvan sahibi oldu</td></tr><tr><td><b>Vicdân</b></td><td class="a">أَبْخَلْتُهُ</td><td>onu cimri buldum</td></tr><tr><td><b>Haynûnet</b></td><td class="a">أَحْصَدَ الزَّرْعُ</td><td>ekinin biçme vakti geldi</td></tr><tr><td><b>İzâle</b></td><td class="a">أَشْكَيْتُهُ</td><td>şikâyetini giderdim</td></tr><tr><td><b>Duhûl</b></td><td class="a">أَصْبَحَ الرَّجُلُ</td><td>sabaha girdi</td></tr><tr><td><b>Kesret</b></td><td class="a">أَلْبَنَ الرَّجُلُ</td><td>sütü çoğaldı</td></tr></table>',

{id:'d24',k:4,p:20,t:'İstef‘ale sininin mânâları',ar:'مَعَانِي سِينِ اسْتَفْعَلَ',
 m:['وَسِينُ «اسْتَفْعَلَ» أَيْضًا تَجِيءُ لِمَعَانٍ: لِلطَّلَبِ، نَحْوُ: «أَسْتَغْفِرُ اللّٰهَ»، أَيْ: أَطْلُبُ مِنْهُ الْمَغْفِرَةَ، وَلِلسُّؤَالِ، نَحْوُ: «اِسْتَخْبَرَ»، أَيْ: سَأَلَ الْخَبَرَ، وَلِلتَّحَوُّلِ، نَحْوُ: «اِسْتَخَلَّ الْخَمْرُ»، أَيْ: تَحَوَّلَ الْخَمْرُ خَلًّا، وَلِلِاعْتِقَادِ، نَحْوُ: «اِسْتَكْرَمْتُهُ»، أَيِ: اعْتَقَدْتُ أَنَّهُ كَرِيمٌ، وَلِلْوِجْدَانِ، نَحْوُ: «اِسْتَجَدْتُ شَيْئًا»، أَيْ: وَجَدْتُهُ جَيِّدًا، وَلِلتَّسْلِيمِ، نَحْوُ قَوْلِهِمْ: «اِسْتَرْجَعَ الْقَوْمُ عِنْدَ الْمُصِيبَةِ»، أَيْ: قَالُوا: ﴿إِنَّا لِلّٰهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ﴾.'],
 tr:'<p><span class="ar">اِسْتَفْعَلَ</span> sininin <b>altı mânâsı</b>:</p><table class="mini"><tr><td><b>Taleb</b></td><td class="a">أَسْتَغْفِرُ اللّٰهَ</td><td>Allah’tan mağfiret isterim</td></tr><tr><td><b>Suâl</b></td><td class="a">اِسْتَخْبَرَ</td><td>haber sordu</td></tr><tr><td><b>Tahavvül</b></td><td class="a">اِسْتَخَلَّ الْخَمْرُ</td><td>şarap sirkeye dönüştü</td></tr><tr><td><b>İ‘tikâd</b></td><td class="a">اِسْتَكْرَمْتُهُ</td><td>onu cömert saydım</td></tr><tr><td><b>Vicdân</b></td><td class="a">اِسْتَجَدْتُ شَيْئًا</td><td>bir şeyi iyi buldum</td></tr><tr><td><b>Teslîm</b></td><td class="a">اِسْتَرْجَعَ الْقَوْمُ</td><td>“innâ lillâh…” dediler (Bakara 2/156)</td></tr></table>',

{id:'d25',k:4,p:20,t:'Yedi kısım',ar:'الْأَقْسَامُ السَّبْعَةُ',
 m:['وَحُرُوفُ «الْمَدِّ»، وَ«اللِّينِ»، وَ«الزَّوَائِدِ»، وَ«الْعِلَّةِ»: وَاحِدَةٌ، وَهِيَ: الْوَاوُ، وَالْيَاءُ، وَالْأَلِفُ. فَكُلُّ فِعْلٍ مَاضٍ فِي أَوَّلِهِ حَرْفٌ مِنْ هٰذِهِ الْحُرُوفِ يُسَمَّى: «مُعْتَلًّا»، وَ«مِثَالًا» لِمُمَاثَلَتِهِ «الصَّحِيحَ» فِي احْتِمَالِ الْحَرَكَاتِ، نَحْوُ: «وَعَدَ»، وَ«يَسَرَ». وَإِنْ كَانَ فِي وَسَطِهِ يُسَمَّى: «أَجْوَفَ»، نَحْوُ: «قَالَ»، وَ«كَالَ». وَإِنْ كَانَ فِي آخِرِهِ يُسَمَّى: «نَاقِصًا»، نَحْوُ: «غَزَا»، وَ«رَمَى».','وَإِنْ كَانَ فِيهِ حَرْفَانِ مِنْ هٰذِهِ الْحُرُوفِ: فَإِنْ كَانَا عَيْنَهُ وَلَامَهُ يُسَمَّى: «لَفِيفًا مَقْرُونًا»، نَحْوُ: «رَوَى»، وَ«شَوَى»، وَإِنْ كَانَا فَاءَهُ وَلَامَهُ يُسَمَّى: «لَفِيفًا مَفْرُوقًا»، نَحْوُ: «وَقَى». وَكُلُّ فِعْلٍ مَاضٍ عَيْنُهُ وَلَامُهُ حَرْفَانِ مِنْ جِنْسٍ وَاحِدٍ أُدْغِمَ أَوَّلُهُمَا فِي الْآخَرِ لِلثِّقَلِ يُسَمَّى: «مُضَاعَفًا»، نَحْوُ: «مَدَّ».','وَكُلُّ فِعْلٍ فِيهِ هَمْزَةٌ: فَإِنْ كَانَتْ فِي أَوَّلِهِ يُسَمَّى: «مَهْمُوزَ الْفَاءِ»، نَحْوُ: «أَخَذَ»، وَإِنْ كَانَتْ فِي وَسَطِهِ يُسَمَّى: «مَهْمُوزَ الْعَيْنِ»، نَحْوُ: «سَأَلَ»، وَإِنْ كَانَتْ فِي آخِرِهِ يُسَمَّى: «مَهْمُوزَ اللَّامِ»، نَحْوُ: «قَرَأَ». وَكُلُّ فِعْلٍ خَالٍ مِنْ هٰذِهِ الْأَقْسَامِ السِّتَّةِ يُسَمَّى: «صَحِيحًا». وَقَدْ مَرَّ بَحْثُهُ فِي «بَابِ الصَّحِيحِ»، وَسَنَذْكُرُ بَحْثَ «الْأَقْسَامِ السِّتَّةِ» عَلَى سَبِيلِ الِاخْتِصَارِ.'],
 tr:'<p><b>Medd, lîn, zevâid ve illet harfleri</b> aynıdır: <b>و ي ا</b>. Kök harflerine göre fiil yedi kısımdır:</p><table class="mini"><tr><th>Kısım</th><th>Tarif</th><th>Misal</th></tr><tr><td>Misâl (mu‘tell-i fâ)</td><td>fâsı illetli; harekeleri sahîh gibi taşıdığı için “misâl”</td><td class="a">وَعَدَ، يَسَرَ</td></tr><tr><td>Ecvef</td><td>aynı illetli</td><td class="a">قَالَ، كَالَ</td></tr><tr><td>Nâkıs</td><td>lâmı illetli</td><td class="a">غَزَا، رَمَى</td></tr><tr><td>Lefîf-i makrûn</td><td>ayn ve lâm illetli</td><td class="a">رَوَى، شَوَى</td></tr><tr><td>Lefîf-i mefrûk</td><td>fâ ve lâm illetli</td><td class="a">وَقَى</td></tr><tr><td>Muzâaf</td><td>ayn ve lâm aynı cins, idğamlı</td><td class="a">مَدَّ</td></tr><tr><td>Mehmûz</td><td>fâ / ayn / lâmda hemze</td><td class="a">أَخَذَ، سَأَلَ، قَرَأَ</td></tr><tr><td><b>Sahîh</b></td><td>bu altı kısımdan hâlî olan</td><td class="a">نَصَرَ</td></tr></table>',
 ex:[['وَعَدَ · يَسَرَ','Misâl'],['قَالَ · كَالَ','Ecvef'],['غَزَا · رَمَى','Nâkıs'],['رَوَى · شَوَى','Lefîf-i makrûn'],['وَقَى','Lefîf-i mefrûk'],['مَدَّ','Muzâaf'],['أَخَذَ · سَأَلَ · قَرَأَ','Mehmûzü’l-fâ, -ayn, -lâm']],
 q:[['Misâl neden bu adı almıştır?',['Hareke taşımada sahîhe benzediği için','Misal olarak verildiği için','İki illet harfi olduğu için','Hemzeli olduğu için'],0,'«لِمُمَاثَلَتِهِ الصَّحِيحَ»'],['رَوَى hangi kısımdandır?',['Lefîf-i makrûn','Lefîf-i mefrûk','Nâkıs','Ecvef'],0,'Ayn ve lâm illetli.'],['وَقَى?',['Lefîf-i mefrûk','Lefîf-i makrûn','Misâl','Nâkıs'],0,'Fâ ve lâm illetli.'],['سَأَلَ?',['Mehmûzü’l-ayn','Mehmûzü’l-fâ','Mehmûzü’l-lâm','Ecvef'],0,'Hemze ortada.'],['İllet harfleri?',['و ي ا','ء ه ع','ت ن س','ص ض ط'],0,'Medd ve lîn harfleri de bunlardır.'],['Yedi kısımdan hâlî fiile ne denir?',['Sahîh','Sâlim','Mücerred','Mu‘tell'],0,'«يُسَمَّى صَحِيحًا»']]},
/* ---------- 5. MU‘TELLÂT ---------- */
{id:'d26',k:5,p:22,t:'İ‘lâl 1–2: vav ve yâ elife döner',ar:'قَلْبُ الْوَاوِ وَالْيَاءِ أَلِفًا',
 m:['١، ٢- الْوَاوُ وَالْيَاءُ إِذَا تَحَرَّكَتَا، وَانْفَتَحَ مَا قَبْلَهُمَا: قُلِبَتَا أَلِفًا: نَحْوُ: «قَالَ»، وَ«كَالَ». وَمِثَالُهُمَا مِنَ النَّاقِصِ: «غَزَا»، وَ«رَمَى». وَتَقُولُ فِي تَثْنِيَتِهِمَا: «غَزَوَا»، وَ«رَمَيَا»، فَلَا تُقْلَبَانِ أَلِفًا؛ وَلَا تُقْلَبَانِ أَيْضًا فِي جَمْعِ الْمُؤَنَّثِ، وَالْمُوَاجَهَةِ، وَنَفْسِ الْمُتَكَلِّمِ، لِأَنَّ الْوَاوَ السَّاكِنَةَ وَالْيَاءَ السَّاكِنَةَ لَا تُقْلَبَانِ إِلَّا فِي مَوْضِعٍ يَكُونُ سُكُونُهُمَا غَيْرَ أَصْلِيٍّ بِأَنْ نُقِلَتْ حَرَكَتُهُمَا إِلَى مَا قَبْلَهُمَا، نَحْوُ: «أَقَامَ»، وَ«أَبَاعَ».','وَتَقُولُ فِي جَمْعِ الْمُذَكَّرِ الْغَائِبِ: «غَزَوْا»، وَ«رَمَوْا». وَالْأَصْلُ: «غَزَوُوا»، وَ«رَمَيُوا»؛ قُلِبَتَا أَلِفًا لِتَحَرُّكِهِمَا وَانْفِتَاحِ مَا قَبْلَهُمَا، فَاجْتَمَعَ سَاكِنَانِ: أَحَدُهُمَا الْأَلِفُ الْمَقْلُوبَةُ، وَالثَّانِي وَاوُ الْجَمْعِ، فَحُذِفَتِ الْأَلِفُ الْمَقْلُوبَةُ، فَبَقِيَ: «غَزَوْا»، وَ«رَمَوْا». وَتَقُولُ فِي تَثْنِيَةِ الْمُؤَنَّثِ: «غَزَتَا»، وَ«رَمَتَا». وَالْأَصْلُ: «غَزَوَتَا»، وَ«رَمَيَتَا»؛ قُلِبَتَا أَلِفًا… وَحُذِفَتِ الْأَلِفُ لِسُكُونِهَا وَسُكُونِ التَّاءِ، لِأَنَّ التَّاءَ كَانَتْ سَاكِنَةً فِي الْأَصْلِ، فَحُرِّكَتِ التَّاءُ لِأَلِفِ التَّثْنِيَةِ، فَحَرَكَتُهَا عَارِضَةٌ، وَالْعَارِضُ كَالْمَعْدُومِ.','وَتَقُولُ فِي جَمْعِ الْمُؤَنَّثِ مِنَ الْأَجْوَفِ: «قُلْنَ»، وَ«كِلْنَ». وَالْأَصْلُ: «قَوَلْنَ»، وَ«كَيَلْنَ»؛ قُلِبَتَا أَلِفًا لِتَحَرُّكِهِمَا وَانْفِتَاحِ مَا قَبْلَهُمَا، ثُمَّ حُذِفَتِ الْأَلِفُ لِسُكُونِهَا وَسُكُونِ اللَّامِ، فَبَقِيَ: «قَلْنَ»، وَ«كَلْنَ» -بِفَتْحِ الْقَافِ وَالْكَافِ-، ثُمَّ نُقِلَتْ فَتْحَةُ الْقَافِ إِلَى الضَّمَّةِ، وَفَتْحَةُ الْكَافِ إِلَى الْكَسْرَةِ، لِتَدُلَّ الضَّمَّةُ عَلَى الْوَاوِ الْمَحْذُوفَةِ، وَالْكَسْرَةُ عَلَى الْيَاءِ الْمَحْذُوفَةِ، لِأَنَّ الْمُتَوَلِّدَ مِنَ الضَّمَّةِ «الْوَاوُ»، وَمِنَ الْكَسْرَةِ «الْيَاءُ»، وَمِنَ الْفَتْحَةِ «الْأَلِفُ».'],
 tr:'<p class="rulebox"><b>Kural 1–2:</b> Vav ve yâ <b>harekeli</b> olup <b>öncesi üstün</b> ise <b>elife</b> döner: <span class="ar">قَوَلَ → قَالَ · كَيَلَ → كَالَ · غَزَوَ → غَزَا · رَمَيَ → رَمَى</span>.</p><ul><li><b>Tesniyede dönmez:</b> <span class="ar">غَزَوَا، رَمَيَا</span> (elif-i tesniye ile karışmasın).</li><li>Cem‘-i müennes, muhâtab ve mütekellimde dönmez, çünkü orada vav/yâ <b>sâkin</b>dir (<span class="ar">غَزَوْنَ، رَمَيْتُ</span>). Sâkin vav/yâ ancak sükûnu aslî değilse, yani harekesi öncesine nakledilmişse döner: <span class="ar">أَقَامَ، أَبَاعَ</span>.</li><li><b>غَزَوْا</b>: <span class="ar">غَزَوُوا → غَزَاوْا</span> (kural 1) → iki sâkin (elif + cem‘ vavı) → elif düşer.</li><li><b>غَزَتَا</b>: <span class="ar">غَزَوَتَا → غَزَاتَا</span> → elif düşer; tânın harekesi <b>ârızî</b>dir, <b>“ârızî olan yok hükmündedir.”</b></li><li><b>قُلْنَ / كِلْنَ</b>: <span class="ar">قَوَلْنَ → قَالْنَ → قَلْنَ → قُلْنَ</span>: fetha, düşen harfe işaret etsin diye vavda ötreye, yâda esreye çevrilir. (Ötreden vav, esreden yâ, fethadan elif doğar.)</li></ul>',
 ex:[['قَوَلَ → قَالَ','Kural 1'],['رَمَيَ → رَمَى','Kural 2 (yâ sûretinde elif)'],['غَزَوَا · رَمَيَا','Tesniyede kalb yok'],['أَقْوَمَ → أَقَامَ','Sükûn aslî değil: nakil + kalb'],['غَزَوُوا → غَزَوْا','Kalb + iltikâ-i sâkineyn'],['قَوَلْنَ → قُلْنَ','Kalb + hazf + hareke değişimi']],
 q:[['قَالَ’in aslı?',['قَوَلَ','قَيَلَ','قَأَلَ','قَوْلَ'],0,'Vav harekeli, öncesi üstün.'],['غَزَوَا’da vav neden elife dönmedi?',['Tesniye olduğu için','Vav sâkin olduğu için','Öncesi ötreli olduğu için','Sonda olmadığı için'],0,'«فَلَا تُقْلَبَانِ أَلِفًا»'],['غَزَتَا’da elif neden düştü?',['Kendisi ve aslen sâkin olan tâ birleştiği için','Tesniye olduğu için','Hafiflik için','Vakf için'],0,'«وَالْعَارِضُ كَالْمَعْدُومِ»'],['قُلْنَ’de kâf neden ötrelidir?',['Düşen vava delâlet etsin diye','Meçhûl olduğu için','Emir olduğu için','Kural gereği daima ötre'],0,'Ötreden vav doğar.'],['كِلْنَ’de kâfın esresi neye delâlet eder?',['Düşen yâya','Düşen vava','Elife','Hemzeye'],0,'Esreden yâ doğar.'],['Sâkin vav/yâ ne zaman elife döner?',['Sükûnu aslî değilse (harekesi nakledilmişse)','Daima','Hiçbir zaman','Sonda ise'],0,'أَقَامَ، أَبَاعَ']]},
{id:'d27',k:5,p:23,t:'İ‘lâl 3–6: yâ, vav ve esre-ötre',ar:'الْيَاءُ وَالْوَاوُ بَعْدَ الْكَسْرَةِ وَالضَّمَّةِ',
 m:['٣- وَالْيَاءُ إِذَا انْكَسَرَ مَا قَبْلَهَا: تُرِكَتْ عَلَى حَالِهَا سَاكِنَةً أَوْ مُتَحَرِّكَةً -إِذَا كَانَتِ الْحَرَكَةُ فَتْحَةً-: نَحْوُ: «خَشِيَ»، وَ«خَشِيتَ».','٤، ٥- وَالْيَاءُ السَّاكِنَةُ إِذَا انْضَمَّ مَا قَبْلَهَا: قُلِبَتْ وَاوًا: نَحْوُ: «أَيْسَرَ - يُوسِرُ»، أَصْلُهُ: «يُيْسِرُ». وَتَقُولُ فِي مَجْهُولِ الْأَجْوَفِ: «قِيلَ». وَالْأَصْلُ: «قُوِلَ»، فَاسْتُثْقِلَتْ ضَمَّةُ الْقَافِ قَبْلَ كَسْرَةِ الْوَاوِ، فَأُسْكِنَتِ الْقَافُ، وَنُقِلَتْ كَسْرَةُ الْوَاوِ إِلَيْهَا، فَصَارَتِ الْقَافُ مَكْسُورَةً وَالْوَاوُ سَاكِنَةً، ثُمَّ قُلِبَتِ الْوَاوُ يَاءً، لِأَنَّ الْوَاوَ السَّاكِنَةَ إِذَا انْكَسَرَ مَا قَبْلَهَا: قُلِبَتْ يَاءً.','٦- وَالْوَاوُ الْمُتَحَرِّكَةُ إِذَا وَقَعَتْ فِي آخِرِ الْكَلِمَةِ، وَانْكَسَرَ مَا قَبْلَهَا: قُلِبَتْ يَاءً: نَحْوُ: «غَبِيَ». وَالْأَصْلُ: «غَبِوَ» مِنَ «الْغَبَاوَةِ»، وَهِيَ: عَكْسُ الْإِدْرَاكِ. وَكَذَا «دُعِيَ» مَجْهُولُ «دَعَا»، وَالْأَصْلُ: «دُعِوَ». وَتَقُولُ فِي جَمْعِ الْمُذَكَّرِ مِنْ مَجْهُولِ النَّاقِصِ: «غُزُوا». وَالْأَصْلُ: «غُزِيُوا»، فَأُسْكِنَتِ الْيَاءُ، ثُمَّ نُقِلَتْ ضَمَّةُ الْيَاءِ إِلَى الزَّايِ، وَحُذِفَتِ الْيَاءُ لِسُكُونِهَا وَسُكُونِ الْوَاوِ، فَبَقِيَ: «غُزُوا».'],
 tr:'<p class="rulebox"><b>Kural 3:</b> Öncesi esreli yâ olduğu gibi kalır (sâkin ya da fethalı ise): <span class="ar">خَشِيَ، خَشِيتَ</span>.</p><p class="rulebox"><b>Kural 4–5:</b> <b>Sâkin yâ</b>, öncesi <b>ötreli</b> ise <b>vav</b>a döner: <span class="ar">يُيْسِرُ → يُوسِرُ</span>. Tersi de geçerli: <b>sâkin vav</b>, öncesi <b>esreli</b> ise <b>yâ</b>ya döner: <span class="ar">قُوِلَ → قِوْلَ → قِيلَ</span>.</p><p class="rulebox"><b>Kural 6:</b> <b>Kelime sonundaki harekeli vav</b>, öncesi <b>esreli</b> ise <b>yâ</b>ya döner: <span class="ar">غَبِوَ → غَبِيَ · دُعِوَ → دُعِيَ</span>.</p><p><b>غُزُوا</b> (nâkısın meçhûl cem‘-i müzekkeri): <span class="ar">غُزِيُوا</span> → yâ sâkin edilir, ötresi zâya nakledilir → yâ, cem‘ vavıyla birleşip düşer → <span class="ar">غُزُوا</span>.</p>',
 ex:[['خَشِيَ · خَشِيتَ','Kural 3: yâ kalır'],['يُيْسِرُ → يُوسِرُ','Kural 4–5'],['قُوِلَ → قِيلَ','Ağırlık → nakil → vav yâ olur'],['غَبِوَ → غَبِيَ','Kural 6'],['دُعِوَ → دُعِيَ','Kural 6 (meçhûl)'],['غُزِيُوا → غُزُوا','İskân, nakil, hazf']],
 q:[['يُوسِرُ’un aslı?',['يُيْسِرُ','يُوَسِّرُ','يَيْسِرُ','يُأْسِرُ'],0,'Sâkin yâ, öncesi ötre → vav.'],['قِيلَ’in aslı?',['قُوِلَ','قَوَلَ','قِوِلَ','قُيِلَ'],0,'Meçhûl ecvef.'],['قِيلَ’de vav neden yâ oldu?',['Sâkin ve öncesi esreli olduğu için','Harekeli ve öncesi üstün olduğu için','Sonda olduğu için','Tesniye olduğu için'],0,'Kitabın gerekçesi.'],['غَبِيَ’in aslı?',['غَبِوَ','غَبِيَ','غَبَوَ','غُبِوَ'],0,'الْغَبَاوَة’den.'],['خَشِيَ’de yâ neden değişmedi?',['Öncesi esreli, kendisi fethalı','Sâkin olduğu için','Öncesi üstün olduğu için','Tesniye olduğu için'],0,'Kural 3.'],['غُزُوا’nın aslı?',['غُزِيُوا','غَزَوُوا','غُزِوُوا','غُزُووا'],0,'Kitapta böyle.']]},
{id:'d28',k:5,p:23,t:'İ‘lâl 7–8: nakil ve iskân',ar:'نَقْلُ الْحَرَكَةِ وَالْإِسْكَانُ',
 m:['٧- وَكُلُّ وَاوٍ وَيَاءٍ مُتَحَرِّكَتَيْنِ يَكُونُ مَا قَبْلَهُمَا حَرْفًا صَحِيحًا سَاكِنًا: نُقِلَتْ حَرَكَتُهُمَا إِلَى الْحَرْفِ الصَّحِيحِ: نَحْوُ: «يَقُولُ»، وَ«يَكِيلُ»، وَ«يَخَافُ». وَالْأَصْلُ: «يَقْوُلُ»، وَ«يَكْيِلُ»، وَ«يَخْوَفُ»، وَإِنَّمَا قُلِبَتْ وَاوُ «يَخَافُ» أَلِفًا لِكَوْنِ سُكُونِهَا غَيْرَ أَصْلِيٍّ وَانْفِتَاحِ مَا قَبْلَهَا.','٨- وَكُلُّ وَاوٍ وَيَاءٍ مُتَحَرِّكَتَيْنِ إِذَا وَقَعَتَا فِي لَامِ الْفِعْلِ وَمَا قَبْلَهُمَا حَرْفٌ صَحِيحٌ مُتَحَرِّكٌ: أُسْكِنَتَا مَا لَمْ تَكُونَا مَنْصُوبَتَيْنِ: نَحْوُ: «يَغْزُو»، وَ«يَرْمِي»، وَ«يَخْشَى»، لِاسْتِثْقَالِ الضَّمَّةِ عَلَى الْوَاوِ وَالْيَاءِ. وَالْأَصْلُ: «يَغْزُوُ»، وَ«يَرْمِيُ»، وَ«يَخْشَيُ». وَقُلِبَتْ يَاءُ «يَخْشَيُ» أَلِفًا، لِتَحَرُّكِهَا وَانْفِتَاحِ مَا قَبْلَهَا. وَيَتَحَرَّكُ الْوَاوُ وَالْيَاءُ إِذَا كَانَتَا مَنْصُوبَتَيْنِ: نَحْوُ: «لَنْ يَغْزُوَ»، وَ«لَنْ يَرْمِيَ»، لِخِفَّةِ الْفَتْحَةِ عَلَيْهِمَا.','وَتَقُولُ فِي الْجَمْعِ: «يَغْزُونَ»، وَ«يَرْمُونَ»، وَ«يَخْشَوْنَ». وَالْأَصْلُ: «يَغْزُوُونَ»، وَ«يَرْمِيُونَ»، وَ«يَخْشَيُونَ»، فَأُسْكِنَتِ الْوَاوُ وَالْيَاءُ، لِوُقُوعِهِمَا فِي لَامِ الْفِعْلِ وَاسْتِثْقَالِ الضَّمَّةِ عَلَيْهِمَا، وَقُلِبَتْ يَاءُ «يَخْشَيُونَ» أَلِفًا لِتَحَرُّكِهَا وَانْفِتَاحِ مَا قَبْلَهَا، فَاجْتَمَعَ سَاكِنَانِ، وَبَعْدَهُمَا وَاوُ الْجَمْعِ، فَحُذِفَ مَا كَانَ قَبْلَ وَاوِ الْجَمْعِ، وَضُمَّتِ الْمِيمُ فِي «يَرْمُونَ» لِتَصِحَّ وَاوُ الْجَمْعِ. وَتَقُولُ فِي الْوَاحِدَةِ الْمُخَاطَبَةِ: «تَغْزِينَ». وَالْأَصْلُ: «تَغْزُوِينَ»، فَأُسْكِنَتِ الزَّايُ لِاسْتِثْقَالِ الضَّمَّةِ قَبْلَ كَسْرَةِ الْوَاوِ، وَنُقِلَتْ كَسْرَةُ الْوَاوِ إِلَى الزَّايِ، وَحُذِفَتِ الْوَاوُ لِسُكُونِهَا وَسُكُونِ الْيَاءِ.'],
 tr:'<p class="rulebox"><b>Kural 7 (nakil):</b> Harekeli vav/yâdan önce <b>sâkin sahîh</b> harf varsa, hareke o sahîh harfe <b>nakledilir</b>: <span class="ar">يَقْوُلُ → يَقُولُ · يَكْيِلُ → يَكِيلُ · يَخْوَفُ → يَخَوْفُ → يَخَافُ</span> (sükûnu aslî olmadığı ve öncesi üstün olduğu için vav elife döner).</p><p class="rulebox"><b>Kural 8 (iskân):</b> <b>Lâmü’l-fiil</b>deki harekeli vav/yâdan önce <b>harekeli sahîh</b> harf varsa, <b>mansûb değilse</b> sâkin edilir (ötre ağır gelir): <span class="ar">يَغْزُوُ → يَغْزُو · يَرْمِيُ → يَرْمِي</span>. <span class="ar">يَخْشَيُ → يَخْشَى</span> (kural 2). Mansûbda fetha hafif olduğu için kalır: <span class="ar">لَنْ يَغْزُوَ، لَنْ يَرْمِيَ</span>.</p><ul><li><b>Cem‘:</b> <span class="ar">يَغْزُوُونَ → يَغْزُونَ · يَرْمِيُونَ → يَرْمُونَ</span> (mîm, cem‘ vavı sahîh olsun diye ötrelenir) <b>·</b> <span class="ar">يَخْشَيُونَ → يَخْشَاوْنَ → يَخْشَوْنَ</span>.</li><li><b>Müfrede muhâtaba:</b> <span class="ar">تَغْزُوِينَ → تَغْزِوْينَ → تَغْزِينَ</span>.</li></ul>',
 ex:[['يَقْوُلُ → يَقُولُ','Kural 7'],['يَخْوَفُ → يَخَافُ','Kural 7 + elif'],['يَرْمِيُ → يَرْمِي','Kural 8'],['لَنْ يَغْزُوَ','Mansûb: hareke kalır'],['يَرْمِيُونَ → يَرْمُونَ','İskân, hazf, mîmin ötresi'],['تَغْزُوِينَ → تَغْزِينَ','İskân, nakil, hazf']],
 q:[['يَقُولُ’un aslı?',['يَقْوُلُ','يَقُوْلُ','يَقْوَلُ','يَقَوُلُ'],0,'Kural 7.'],['يَخَافُ’ta vav neden elife döndü?',['Sükûnu aslî değil ve öncesi üstün','Harekeli olduğu için','Sonda olduğu için','Mansûb olduğu için'],0,'Kitabın açıklaması.'],['لَنْ يَرْمِيَ’de yâ neden harekeli?',['Fetha hafif olduğu için','Ötre olduğu için','Cezm için','Tesniye için'],0,'«لِخِفَّةِ الْفَتْحَةِ»'],['يَرْمُونَ’da mîm neden ötreli?',['Cem‘ vavı sahîh olsun diye','Aslı ötreli olduğu için','Meçhûl olduğu için','Kural 8 gereği'],0,'«لِتَصِحَّ وَاوُ الْجَمْعِ»'],['تَغْزِينَ’in aslı?',['تَغْزُوِينَ','تَغْزِيِينَ','تَغْزُوْنَ','تَغْزُوِيْنَ'],0,'Kitapta böyle.'],['Kural 8 hangi harfte uygulanır?',['Lâmü’l-fiil','Fâü’l-fiil','Aynü’l-fiil','Zâid harf'],0,'«فِي لَامِ الْفِعْلِ»']]},
{id:'d29',k:5,p:24,t:'İllet harfli fâil ve mef‘ûl; İ‘lâl 9–10',ar:'الْفَاعِلُ وَالْمَفْعُولُ مِنَ الْأَجْوَفِ وَالنَّاقِصِ',
 m:['وَتَقُولُ فِي اسْمِ الْفَاعِلِ مِنَ الْأَجْوَفِ: «قَائِلٌ»، وَ«كَائِلٌ». وَكَانَ فِي الْمَاضِي: «قَالَ»، فَزِيدَتِ الْأَلِفُ لِاسْمِ الْفَاعِلِ، فَاجْتَمَعَ أَلِفَانِ: أَحَدُهُمَا أَلِفُ اسْمِ الْفَاعِلِ، وَالْآخَرُ الْأَلِفُ الْمَقْلُوبَةُ مِنْ عَيْنِ الْفِعْلِ، فَقُلِبَتِ الْأَلِفُ الْمَقْلُوبَةُ مِنْ عَيْنِ الْفِعْلِ هَمْزَةً. وَاسْمُ الْفَاعِلِ مِنَ النَّاقِصِ مَنْصُوبٌ فِي حَالَةِ النَّصْبِ، نَحْوُ: «رَأَيْتُ غَازِيًا وَرَامِيًا»، فَلَا تَتَغَيَّرُ صِيغَتُهُ. وَتَقُولُ فِي الرَّفْعِ وَالْجَرِّ: «هٰذَا غَازٍ وَرَامٍ»، وَ«مَرَرْتُ بِغَازٍ وَرَامٍ». وَالْأَصْلُ: «غَازِيٌ»، وَ«رَامِيٌ»، فَأُسْكِنَتِ الْيَاءُ كَمَا ذَكَرْنَا، فَاجْتَمَعَ سَاكِنَانِ: الْيَاءُ، وَالتَّنْوِينُ، فَحُذِفَتِ الْيَاءُ وَبَقِيَ التَّنْوِينُ، وَنُقِلَ التَّنْوِينُ إِلَى مَا قَبْلَهَا. فَإِنْ أَدْخَلْتَ الْأَلِفَ وَاللَّامَ سَقَطَ التَّنْوِينُ وَتَعُودُ الْيَاءُ سَاكِنَةً، فَتَقُولُ: «هٰذَا الْغَازِي وَالرَّامِي».','وَتَقُولُ فِي مَفْعُولِ الْأَجْوَفِ: «مَقُولٌ»، أَصْلُهُ: «مَقْوُولٌ»، فَفُعِلَ بِهِ كَمَا ذَكَرْنَا. وَتَقُولُ فِي بِنَاءِ الْيَائِيِّ: «مَكِيلٌ». وَالْأَصْلُ: «مَكْيُولٌ»، فَنُقِلَتْ حَرَكَةُ الْيَاءِ إِلَى الْكَافِ، فَحُذِفَتِ الْيَاءُ لِاجْتِمَاعِ السَّاكِنَيْنِ، وَكُسِرَتِ الْكَافُ لِتَدُلَّ عَلَى الْيَاءِ الْمَحْذُوفَةِ، فَلَمَّا انْكَسَرَتِ الْكَافُ صَارَتْ وَاوُ «الْمَفْعُولِ» يَاءً.','٩- وَإِذَا اجْتَمَعَتِ الْوَاوَانِ -الْأُولَى سَاكِنَةٌ، وَالثَّانِيَةُ مُتَحَرِّكَةٌ-: أُدْغِمَتِ الْأُولَى فِي الثَّانِيَةِ: نَحْوُ: «مَغْزُوٌّ». وَالْأَصْلُ: «مَغْزُووٌ». ١٠- وَإِذَا اجْتَمَعَتِ الْوَاوُ وَالْيَاءُ -الْأُولَى سَاكِنَةٌ، وَالثَّانِيَةُ مُتَحَرِّكَةٌ-: قُلِبَتِ الْوَاوُ يَاءً، وَكُسِرَ مَا قَبْلَ الْأُولَى لِتَصِحَّ الْيَاءُ، وَأُدْغِمَتِ الْيَاءُ فِي الْيَاءِ: نَحْوُ: «مَرْمِيٌّ»، وَ«مَخْشِيٌّ». وَالْأَصْلُ: «مَرْمُويٌ»، وَ«مَخْشُويٌ».'],
 tr:'<ul><li><b>قَائِلٌ</b>: <span class="ar">قَالَ</span>’e fâil elifi eklenince iki elif birleşir; aynü’l-fiilden dönen elif <b>hemzeye</b> çevrilir.</li><li><b>غَازٍ / رَامٍ</b>: <span class="ar">غَازِيٌ</span> → yâ sâkin edilir → yâ ile tenvîn birleşir → yâ düşer, tenvîn öncesine geçer. Nasbda değişmez: <span class="ar">غَازِيًا</span>. Lâm-ı ta‘rîfle tenvîn gider, yâ (sâkin) döner: <span class="ar">الْغَازِي</span>.</li><li><b>مَقُولٌ</b>: <span class="ar">مَقْوُولٌ</span> → nakil → iki sâkin vavdan biri düşer.</li><li><b>مَكِيلٌ</b>: <span class="ar">مَكْيُولٌ</span> → nakil → yâ düşer → kâf esrelenir → mef‘ûl vavı yâ olur.</li></ul><p class="rulebox"><b>Kural 9:</b> İki vav birleşir, ilki sâkin ikincisi harekeli ise <b>idğam</b>: <span class="ar">مَغْزُووٌ → مَغْزُوٌّ</span>.</p><p class="rulebox"><b>Kural 10:</b> Vav ile yâ birleşir, ilki sâkin ise vav <b>yâ</b> olur, yâ sahîh olsun diye öncesi <b>esrelenir</b>, yâ yâya <b>idğam</b> edilir: <span class="ar">مَرْمُويٌ → مَرْمِيٌّ · مَخْشُويٌ → مَخْشِيٌّ</span>.</p>',
 ex:[['قَاالٌ → قَائِلٌ','İki elif: hemze'],['غَازِيٌ → غَازٍ','İskân + hazf + tenvîn nakli'],['الْغَازِي','Lâm-ı ta‘rîfle yâ döner'],['مَقْوُولٌ → مَقُولٌ','Nakil + hazf'],['مَكْيُولٌ → مَكِيلٌ','Nakil, hazf, kesr, kalb'],['مَغْزُووٌ → مَغْزُوٌّ','Kural 9'],['مَرْمُويٌ → مَرْمِيٌّ','Kural 10']],
 q:[['قَائِلٌ’deki hemze nereden gelir?',['Aynü’l-fiilden dönen elif','Fâil elifi','Aslî hemze','Vakf'],0,'«فَقُلِبَتِ الْأَلِفُ الْمَقْلُوبَةُ مِنْ عَيْنِ الْفِعْلِ هَمْزَةً»'],['غَازٍ’ın aslı?',['غَازِيٌ','غَازِوٌ','غَازُوٌ','غَزِيٌ'],0,'Kitapta: «غَازِيٌ»'],['رَأَيْتُ غَازِيًا’da yâ neden kaldı?',['Nasbda fetha hafif olduğu için','Lâm-ı ta‘rîf olduğu için','Tesniye olduğu için','Mecrûr olduğu için'],0,'«فَلَا تَتَغَيَّرُ صِيغَتُهُ»'],['مَغْزُوٌّ hangi kuralla?',['Kural 9 (iki vav idğamı)','Kural 10','Kural 7','Kural 1'],0,'مَغْزُووٌ'],['مَرْمِيٌّ’nin aslı?',['مَرْمُويٌ','مَرْمُويٌّ','مَرْمِوِيٌ','مَرْمَيٌ'],0,'Kural 10.'],['مَكِيلٌ’de kâf neden esrelendi?',['Düşen yâya delâlet etsin diye','Kural 10 gereği','Meçhûl olduğu için','Hafiflik için'],0,'«لِتَدُلَّ عَلَى الْيَاءِ الْمَحْذُوفَةِ»']]},
{id:'d30',k:5,p:25,t:'Ecvef ve nâkısın emri',ar:'أَمْرُ الْأَجْوَفِ وَالنَّاقِصِ',
 m:['وَتَقُولُ فِي أَمْرِ الْغَائِبِ مِنَ الْأَجْوَفِ: «لِيَقُلْ». وَالْأَصْلُ: «لِيَقْوُلْ». وَتَقُولُ فِي أَمْرِ الْحَاضِرِ مِنَ الْأَجْوَفِ: «قُلْ». وَالْأَصْلُ: «اُقْوُلْ»، فَنُقِلَتْ حَرَكَةُ الْوَاوِ إِلَى الْقَافِ، وَحُذِفَتِ الْوَاوُ لِسُكُونِهَا وَسُكُونِ اللَّامِ، وَحُذِفَتِ الْهَمْزَةُ لِحَرَكَةِ الْقَافِ. وَتَقُولُ فِي التَّثْنِيَةِ: «قُولَا»، فَعَادَتِ الْوَاوُ لِحَرَكَةِ اللَّامِ.','وَتَقُولُ فِي أَمْرِ الْغَائِبِ مِنَ النَّاقِصِ: «لِيَغْزُ»، وَ«لِيَرْمِ»؛ وَفِي أَمْرِ الْمُخَاطَبِ: «اُغْزُ»، وَ«اِرْمِ»، بِحَذْفِ الْوَاوِ وَالْيَاءِ، لِأَنَّ جَزْمَ النَّاقِصِ وَوَقْفَهُ سُقُوطُ لَامِ فِعْلِهِ. وَفِي النَّاقِصِ الْوَاوِيِّ تُقْلَبُ الْوَاوُ يَاءً فِي: الْمُسْتَقْبَلِ، وَالْأَمْرِ، وَالنَّهْيِ الْمَجْهُولَاتِ، لِأَنَّهُنَّ فُرُوعُ الْمَاضِي، وَفِي الْمَاضِي الْمَجْهُولِ تَصِيرُ الْوَاوُ يَاءً لِتَطَرُّفِهَا وَانْكِسَارِ مَا قَبْلَهَا، نَحْوُ: «غُزِيَ»، وَالْأَصْلُ: «غُزِوَ».'],
 tr:'<ul><li><b>لِيَقُلْ</b>: <span class="ar">لِيَقْوُلْ</span> → nakil → vav ile lâm iki sâkin → vav düşer.</li><li><b>قُلْ</b>: <span class="ar">اُقْوُلْ</span> → nakil → vav düşer → kâf harekelendiği için hemze-i vasla gerek kalmaz, o da düşer.</li><li><b>قُولَا</b>: tesniyede lâm harekelenince vav <b>geri döner</b>.</li><li><b>Nâkısın emri:</b> <span class="ar">لِيَغْزُ، لِيَرْمِ، اُغْزُ، اِرْمِ</span> — nâkısın cezm ve vakfı, lâmının düşmesidir.</li><li><b>Vavî nâkıs, meçhûlde:</b> vav, muzâri, emir ve nehiy meçhûllerinde yâya döner, çünkü bunlar mâzinin fer‘idir. Mâzi meçhûlde ise vav, kelime sonunda ve öncesi esreli olduğu için yâ olur: <span class="ar">غُزِوَ → غُزِيَ</span>; buna bağlı olarak <span class="ar">يُغْزَى، لِيُغْزَ، لَا يُغْزَ</span>.</li></ul>',
 ex:[['لِيَقْوُلْ → لِيَقُلْ','Nakil + hazf'],['اُقْوُلْ → قُلْ','Nakil, hazf, hemze düşer'],['قُولَا','Vav geri döner'],['اُغْزُ · اِرْمِ','Lâm düşer'],['غُزِوَ → غُزِيَ','Vav yâ olur'],['يُغْزَى','Meçhûl muzâride vav yâ (elif sûretinde)']],
 q:[['قُلْ’ün aslı?',['اُقْوُلْ','قُوْلْ','اُقُولْ','تَقُولُ'],0,'Kitapta: «اُقْوُلْ»'],['قُلْ’de hemze neden düştü?',['Kâf harekelendiği için','Vasılda olduğu için','Kural 1 gereği','Tesniye olduğu için'],0,'«وَحُذِفَتِ الْهَمْزَةُ لِحَرَكَةِ الْقَافِ»'],['قُولَا’da vav neden döndü?',['Lâm harekelendiği için','Tesniye elifinden dolayı kural 1','Mansûb olduğu için','Vakf için'],0,'İki sâkin kalmadı.'],['يَرْمِي’nin emr-i hâzırı?',['اِرْمِ','اُرْمُ','اِرْمِي','رْمِ'],0,'Lâm düşer.'],['غُزِيَ’nin aslı?',['غُزِوَ','غَزَوَ','غُزِيَ','غُزُوَ'],0,'Sonda, öncesi esreli vav.']]},
{id:'d31',k:5,p:26,t:'Misâl ve lefîf',ar:'الْمُعْتَلُّ الْمِثَالُ وَاللَّفِيفُ',
 m:['وَأَمَّا «الْمُعْتَلُّ الْمِثَالُ» فَيَسْقُطُ فَاءُ فِعْلِهِ فِي: الْمُسْتَقْبَلِ، وَالْأَمْرِ، وَالنَّهْيِ الْمَعْرُوفَاتِ، إِذَا كَانَ فَاؤُهُ وَاوًا، مِنْ ثَلَاثَةِ أَبْوَابٍ: فَعَلَ يَفْعِلُ -بِفَتْحِ الْعَيْنِ فِي الْمَاضِي، وَكَسْرِهَا فِي الْغَابِرِ-، نَحْوُ: «وَعَدَ - يَعِدُ». وَفَعَلَ يَفْعَلُ -بِفَتْحِ الْعَيْنِ فِي الْمَاضِي وَالْغَابِرِ-، نَحْوُ: «وَهَبَ - يَهَبُ». وَفَعِلَ يَفْعِلُ -بِكَسْرِ الْعَيْنِ فِي الْمَاضِي وَالْغَابِرِ-، نَحْوُ: «وَرِثَ - يَرِثُ». وَتَقُولُ فِي الْأَمْرِ وَالنَّهْيِ: «عِدْ - لَا تَعِدْ»، وَ«هَبْ - لَا تَهَبْ»، وَ«رِثْ - لَا تَرِثْ». وَقَدْ تَسْقُطُ الْوَاوُ مِنْ بَابِ «فَعِلَ يَفْعَلُ» -بِكَسْرِ الْعَيْنِ فِي الْمَاضِي، وَفَتْحِهَا فِي الْغَابِرِ- مِنْ لَفْظَيْنِ، نَحْوُ: «وَطِئَ - يَطَأُ»، وَ«وَسِعَ - يَسَعُ».','وَأَمَّا «اللَّفِيفُ الْمَقْرُونُ»: فَحُكْمُ عَيْنِ فِعْلِهِ كَحُكْمِ الصَّحِيحِ لَا يَتَغَيَّرُ، وَحُكْمُ لَامِ فِعْلِهِ كَحُكْمِ لَامِ فِعْلِ النَّاقِصِ، نَحْوُ: «طَوَى - يَطْوِي». وَأَمَّا «اللَّفِيفُ الْمَفْرُوقُ»: فَحُكْمُ فَاءِ فِعْلِهِ كَحُكْمِ فَاءِ فِعْلِ الْمُعْتَلِّ، وَحُكْمُ لَامِ فِعْلِهِ كَحُكْمِ لَامِ فِعْلِ النَّاقِصِ، نَحْوُ: «وَقَى - يَقِي». وَتَقُولُ فِي الْأَمْرِ: «قِهْ»؛ فَحُذِفَتْ فَاءُ فِعْلِهِ كَالْمُعْتَلِّ، وَحُذِفَتْ لَامُ فِعْلِهِ فِي الْجَزْمِ وَالْوَقْفِ كَالنَّاقِصِ، فَبَقِيَتِ الْقَافُ مَكْسُورَةً، وَزِيدَتِ الْهَاءُ عِنْدَ الْوَقْفِ فِي الْوَاحِدِ الْمُذَكَّرِ. وَتَقُولُ فِي التَّثْنِيَةِ: «قِيَا»؛ وَفِي الْجَمْعِ: «قُوا»؛ وَفِي الْوَاحِدَةِ الْحَاضِرَةِ: «قِي»؛ وَفِي جَمْعِ الْمُؤَنَّثِ: «قِينَ».'],
 tr:'<p><b>Misâl (fâsı vav olan):</b> Fâ, <b>ma‘lûm</b> muzâri, emir ve nehiyde şu üç bâbda <b>düşer</b>:</p><table class="mini"><tr><td>2. bâb فَعَلَ يَفْعِلُ</td><td class="a">وَعَدَ يَعِدُ · عِدْ · لَا تَعِدْ</td></tr><tr><td>3. bâb فَعَلَ يَفْعَلُ</td><td class="a">وَهَبَ يَهَبُ · هَبْ · لَا تَهَبْ</td></tr><tr><td>6. bâb فَعِلَ يَفْعِلُ</td><td class="a">وَرِثَ يَرِثُ · رِثْ · لَا تَرِثْ</td></tr></table><p>4. bâbdan (فَعِلَ يَفْعَلُ) yalnız iki kelimede düşer: <span class="ar">وَطِئَ يَطَأُ · وَسِعَ يَسَعُ</span>.</p><p><b>Lefîf-i makrûn:</b> aynı sahîh gibi değişmez, lâmı nâkıs gibidir: <span class="ar">طَوَى يَطْوِي</span>.</p><p><b>Lefîf-i mefrûk:</b> fâsı misâl gibi, lâmı nâkıs gibidir: <span class="ar">وَقَى يَقِي</span>. Emri <span class="ar">قِهْ</span>: fâ düştü (misâl gibi), lâm cezmde düştü (nâkıs gibi), tek kâf esreli kaldı, vakfta müfred müzekkere <b>hâ</b> eklendi. Diğerleri: <span class="ar">قِيَا، قُوا، قِي، قِينَ</span>.</p>',
 ex:[['يَوْعِدُ → يَعِدُ','Fâ düşer'],['عِدْ','Emir'],['وَسِعَ يَسَعُ','4. bâbda düşen iki kelimeden'],['طَوَى يَطْوِي','Lefîf-i makrûn'],['قِهْ','Lefîf-i mefrûkun emri'],['قِيَا · قُوا · قِي · قِينَ','Diğer emir sîgaları']],
 q:[['Misâlde fâ hangi bâblarda düşer?',['فَعَلَ يَفْعِلُ, فَعَلَ يَفْعَلُ, فَعِلَ يَفْعِلُ','Bütün bâblarda','Yalnız 1. bâbda','Yalnız meçhûlde'],0,'Üç bâb.'],['وَهَبَ’in emri?',['هَبْ','اُوهُبْ','اِيهَبْ','وَهَبْ'],0,'Fâ düşer.'],['4. bâbdan fâsı düşen iki kelime?',['وَطِئَ ve وَسِعَ','وَعَدَ ve وَرِثَ','وَجِلَ ve وَحِلَ','وَهَبَ ve وَضَعَ'],0,'يَطَأُ، يَسَعُ'],['قِهْ’deki hâ ne içindir?',['Vakf için','Zamir','Te’nîs','Cem‘'],0,'«وَزِيدَتِ الْهَاءُ عِنْدَ الْوَقْفِ»'],['وَقَى’nın cem‘-i müzekker emri?',['قُوا','قِيُوا','اُوقُوا','قُو'],0,'Kitapta: «قُوا»'],['طَوَى hangi kısımdandır?',['Lefîf-i makrûn','Lefîf-i mefrûk','Ecvef','Misâl'],0,'Ayn ve lâm illetli.']]},
{id:'d32',k:5,p:27,t:'Muzâaf',ar:'الْمُضَاعَفُ',
 m:['وَأَمَّا «الْمُضَاعَفُ»: إِذَا كَانَتْ: عَيْنُ فِعْلِهِ سَاكِنَةً وَلَامُهُ مُتَحَرِّكَةً، أَوْ كِلْتَاهُمَا مُتَحَرِّكَتَيْنِ: فَالْإِدْغَامُ لَازِمٌ، نَحْوُ: «مَدَّ - يَمُدُّ». وَالْأَصْلُ: «مَدَدَ - يَمْدُدُ»، فَنُقِلَتْ حَرَكَةُ الدَّالِ الْأُولَى فِي الْمُسْتَقْبَلِ إِلَى الْمِيمِ، وَبَقِيَتْ سَاكِنَةً: فَأُدْغِمَتِ الدَّالُ الْأُولَى فِي الثَّانِيَةِ. وَإِذَا كَانَتْ عَيْنُ فِعْلِهِ مُتَحَرِّكَةً، وَلَامُهُ سَاكِنَةً [بِسُكُونٍ لَازِمٍ]: فَالْإِظْهَارُ لَازِمٌ، نَحْوُ: «مَدَدْنَ». وَإِنْ كَانَتَا سَاكِنَتَيْنِ [بِسُكُونٍ عَارِضٍ]: حُرِّكَتِ الثَّانِيَةُ، وَأُدْغِمَتِ الْأُولَى فِيهَا، نَحْوُ: «لَمْ يَمُدَّ [/ لَمْ يَمُدُّ / لَمْ يَمُدِّ]». وَالْأَصْلُ: «لَمْ يَمْدُدْ»، فَنُقِلَتْ حَرَكَةُ الدَّالِ الْأُولَى إِلَى الْمِيمِ، فَبَقِيَتَا سَاكِنَتَيْنِ، فَحُرِّكَتِ الثَّانِيَةُ وَأُدْغِمَتِ الْأُولَى فِيهَا، ثُمَّ فُتِحَتِ الدَّالُ الثَّانِيَةُ لِأَنَّ الْفَتْحَةَ أَخَفُّ الْحَرَكَاتِ، وَيَجُوزُ تَحْرِيكُهَا بِالضَّمِّ اتِّبَاعًا لِلْعَيْنِ، وَبِالْكَسْرِ لِأَنَّ السَّاكِنَ إِذَا حُرِّكَ حُرِّكَ بِالْكَسْرِ، كَمَا يُذْكَرُ فِي الْأَمْرِ.','وَتَقُولُ فِي الْأَمْرِ مِنْ «يَفْعُلُ» -بِضَمِّ الْعَيْنِ-: «مُدُّ» -بِضَمِّ الدَّالِ-، وَ«مُدَّ» -بِفَتْحِهَا-، وَ«مُدِّ» -بِكَسْرِهَا-، وَالْمِيمُ مَضْمُومَةٌ فِي الثَّلَاثِ، وَيَجُوزُ: «اُمْدُدْ» بِالْإِظْهَارِ. وَتَقُولُ مِنْ «يَفْعِلُ» -بِكَسْرِ الْعَيْنِ-: «فِرِّ» -بِالْكَسْرِ-، وَ«فِرَّ» -بِالْفَتْحِ-، وَالْفَاءُ مَكْسُورَةٌ فِيهِمَا، وَيَجُوزُ: «اِفْرِرْ» بِالْإِظْهَارِ. وَتَقُولُ مِنْ «يَفْعَلُ» -بِفَتْحِ الْعَيْنِ-: «عَضَّ» -بِالْفَتْحِ-، وَ«عَضِّ» -بِالْكَسْرِ-، وَالْعَيْنُ مَفْتُوحَةٌ فِيهِمَا، وَيَجُوزُ: «اِعْضَضْ» بِالْإِظْهَارِ. وَتَقُولُ مِنْ «أَفْعَلَ - يُفْعِلُ»: «أَحَبَّ - يُحِبُّ». وَالْأَصْلُ: «أَحْبَبَ - يُحْبِبُ»، فَنُقِلَتْ حَرَكَةُ الْبَاءِ إِلَى الْحَاءِ، وَأُدْغِمَتِ الْبَاءُ فِي الْبَاءِ. وَتَقُولُ فِي الْأَمْرِ: «أَحِبَّ [/ أَحِبِّ]» وَ«أَحْبِبْ» بِالْإِدْغَامِ وَالْإِظْهَارِ. وَكُلَّمَا أَدْغَمْتَ حَرْفًا فِي حَرْفٍ: أَدْخَلْتَ بَدَلَهُ تَشْدِيدًا.'],
 tr:'<p><b>Muzâafta idğam üç hâl:</b></p><table class="mini"><tr><th>Ayn</th><th>Lâm</th><th>Hüküm</th><th>Misal</th></tr><tr><td>sâkin veya harekeli</td><td>harekeli</td><td><b>İdğam lâzım</b></td><td class="a">مَدَدَ → مَدَّ · يَمْدُدُ → يَمُدُّ</td></tr><tr><td>harekeli</td><td>lâzım sükûnla sâkin</td><td><b>İzhâr lâzım</b></td><td class="a">مَدَدْنَ · مَدَدْتُ</td></tr><tr><td>sâkin</td><td>ârızî sükûnla sâkin</td><td>İkinci harekelenir, <b>idğam</b></td><td class="a">لَمْ يَمْدُدْ → لَمْ يَمُدَّ / يَمُدُّ / يَمُدِّ</td></tr></table><p>Üçüncü hâlde fetha en hafif hareke olduğu için tercih edilir; aynə uyarak ötre, “sâkin harekelenirse esreyle harekelenir” kuralıyla esre de câizdir.</p><p><b>Emirler:</b> يَفْعُلُ’dan <span class="ar">مُدُّ، مُدَّ، مُدِّ</span> (veya <span class="ar">اُمْدُدْ</span>) · يَفْعِلُ’dan <span class="ar">فِرِّ، فِرَّ</span> (veya <span class="ar">اِفْرِرْ</span>) · يَفْعَلُ’dan <span class="ar">عَضَّ، عَضِّ</span> (veya <span class="ar">اِعْضَضْ</span>) · if‘âlden <span class="ar">أَحِبَّ، أَحِبِّ، أَحْبِبْ</span>.</p><p><b>İdğam edilen her harfin yerine şedde konur.</b></p>',

{id:'d33',k:5,p:28,t:'Mehmûz ve gayr-ı sahîhin tasrîf yolu',ar:'الْمَهْمُوزُ وَطَرِيقَةُ تَصْرِيفِ غَيْرِ الصَّحِيحِ',
 m:['وَأَمَّا «الْمَهْمُوزُ»: فَإِنْ كَانَتِ الْهَمْزَةُ سَاكِنَةً: يَجُوزُ تَرْكُهَا عَلَى حَالِهَا، وَيَجُوزُ قَلْبُهَا: فَإِنْ كَانَ مَا قَبْلَهَا مَفْتُوحًا: قُلِبَتْ أَلِفًا، وَإِنْ كَانَ مَكْسُورًا: قُلِبَتْ يَاءً، وَإِنْ كَانَ مَضْمُومًا: قُلِبَتْ وَاوًا، نَحْوُ: «يَاكُلُ»، وَ«يُومِنُ»، وَ«اِيذَنْ» -مِنْ «أَذِنَ»-. وَإِنْ كَانَتِ الْهَمْزَةُ مُتَحَرِّكَةً: فَإِنْ كَانَ مَا قَبْلَهَا حَرْفًا مُتَحَرِّكًا: لَا تَتَغَيَّرُ الْهَمْزَةُ كَالصَّحِيحِ، نَحْوُ: «قَرَأَ». وَإِنْ كَانَ مَا قَبْلَهَا حَرْفًا سَاكِنًا: يَجُوزُ تَرْكُهَا عَلَى حَالِهَا، وَيَجُوزُ نَقْلُ حَرَكَتِهَا إِلَى مَا قَبْلَهَا. مِثَالُهُ قَوْلُهُ تَعَالَى: ﴿وَسَلِ الْقَرْيَةَ﴾، وَالْأَصْلُ: ﴿وَاسْأَلِ الْقَرْيَةَ﴾، فَنُقِلَتْ حَرَكَةُ الْهَمْزَةِ إِلَى السِّينِ، فَحُذِفَتِ الْهَمْزَةُ لِسُكُونِهَا وَسُكُونِ اللَّامِ بَعْدَهَا. وَقَدْ قُرِئَ بِإِثْبَاتِ الْهَمْزَةِ وَتَرْكِهَا. وَتَقُولُ فِي الْأَمْرِ مِنَ «الْأَخْذِ»، وَ«الْأَكْلِ»، وَ«الْأَمْرِ»: «خُذْ»، وَ«كُلْ»، وَ«مُرْ» عَلَى غَيْرِ الْقِيَاسِ. وَبَاقِي تَصْرِيفِ الْمَهْمُوزِ عَلَى قِيَاسِ الصَّحِيحِ.','وَكُلَّمَا وَجَدْتَ فِعْلًا غَيْرَ الصَّحِيحِ: فَقِسْهُ عَلَى الصَّحِيحِ فِي جَمِيعِ الْوُجُوهِ الَّتِي ذَكَرْنَاهَا فِي «بَابِ الصَّحِيحِ» مِنَ التَّصْرِيفِ: فَإِنِ اقْتَضَى الْقِيَاسُ إِبْدَالَ حَرْفٍ، أَوْ نَقْلًا، أَوْ إِسْكَانًا: فَافْعَلْ؛ وَإِلَّا: صَرِّفِ الْفِعْلَ الْغَيْرَ الصَّحِيحِ كَالصَّحِيحِ. وَقَدْ يَكُونُ فِي بَعْضِ الْمَوَاضِعِ لَا تَتَغَيَّرُ الْمُعْتَلَّاتُ فِيهِ مَعَ وُجُودِ الْمُقْتَضِي، نَحْوُ: «عَوِرَ»، وَ«اعْتَوَرَ»، وَ«اسْتَوَى»، وَغَيْرِ ذٰلِكَ، فَبَعْضُهَا لَا يَتَغَيَّرُ لِصِحَّةِ الْبِنَاءِ، وَبَعْضُهَا لِعِلَّةٍ أُخْرَى.'],
 tr:'<p><b>Mehmûz:</b></p><ul><li><b>Sâkin hemze</b>: olduğu gibi kalabilir ya da öncesinin harekesine uygun harfe çevrilebilir: üstün → <b>elif</b> (<span class="ar">يَأْكُلُ → يَاكُلُ</span>), esre → <b>yâ</b> (<span class="ar">اِئْذَنْ → اِيذَنْ</span>), ötre → <b>vav</b> (<span class="ar">يُؤْمِنُ → يُومِنُ</span>).</li><li><b>Harekeli hemze</b>, öncesi harekeli: değişmez (<span class="ar">قَرَأَ</span>). Öncesi sâkin: kalabilir ya da harekesi öncesine nakledilip kendisi düşer: <span class="ar">وَاسْأَلِ الْقَرْيَةَ → وَسَلِ الْقَرْيَةَ</span> (Yûsuf 12/82; iki türlü de okunmuştur).</li><li>Kıyas dışı emirler: <span class="ar">خُذْ، كُلْ، مُرْ</span>.</li></ul><p class="rulebox"><b>Altın kural:</b> Sahîh olmayan her fiili, bütün vecihlerde <b>sahîhe kıyas et</b>. Kıyas bir harfi ibdâli, nakli veya iskânı gerektiriyorsa uygula; gerektirmiyorsa sahîh gibi çek. Bazen sebep bulunduğu hâlde i‘lâl yapılmaz: <span class="ar">عَوِرَ، اِعْتَوَرَ، اِسْتَوَى</span> — kimi binanın sıhhati için, kimi başka bir illet yüzünden.</p>',

}
function fill(t,r){return t.replace(/F/g,r[0]).replace(/A/g,r[1]).replace(/L/g,r[2]);}
function clusters(t){const out=[];for(const ch of t){if(MARKS.test(ch)&&out.length)out[out.length-1]+=ch;else out.push(ch);}return out;}
function paint(t,r){return clusters(t).map(c=>{const b=c[0],rest=c.slice(1);if(b==="F")return `<span class="rf">${r[0]}${rest}</span>`;if(b==="A")return `<span class="ra">${r[1]}${rest}</span>`;if(b==="L")return `<span class="rl">${r[2]}${rest}</span>`;if(b===" ")return " ";return `<span class="zv">${c}</span>`;}).join("");}
function rootOf(s){const r=Array.from(String(s).replace(/[\sً-ْ]/g,""));return r.length===3?r:null;}
function checkRoot(r){if(!r)return "Üç harf gir (ör. ن ص ر).";if(r.some(ch=>!/[ب-ي]/.test(ch)||/[اويىةءأإآؤئ]/.test(ch)))return "Sahîh (sâlim) bir kök gir: harf-i illet (و ي ا) ve hemze olmasın; onlar İ‘lâl Ocağı’nda.";if(r[1]===r[2])return "Ayn ve lâm aynı: muzâaf kök. Muzâaf İ‘lâl Ocağı’nda işlenir.";return "";}

      if($('#all'))$('#all').onclick=()=>{k=X.s.length;draw();};

      else{opts=opts||formOpts(cur,s,s[1]);q=`<p class="q">${ruleBadge(s[0])} uygulanınca kelime ne olur?</p><div class="opts">${opts.map(f=>`<button class="opt ar1" data-o="${esc(f)}">${esc(f)}</button>`).join('')}</div>`;}
      $('#fur').innerHTML=frame(X,`<div class="chainv">${rows}<div class="srow cur"><div class="lab"><span class="tiny">${k?'Ocakta':'Ocakta · asıl'}</span><span class="ar">${esc(cur)}</span></div>${tilesHTML(cur,k?(k>1?X.s[k-2][1]:X.a):null)}</div></div><div class="qbox">${q}<div class="fb" id="fb"></div></div>`);
      $('#say').onclick=()=>speak(X.w);
      $$('#fur [data-o]').forEach(b=>b.onclick=()=>{const right=phase===0?s[0]:s[1];const pick=b.dataset.o;const good=pick===right||(phase===0&&KURAL[pick].t===KURAL[right].t);max++;if(good)score++;beep(good?'ok':'no');

        $('#cn').onclick=()=>{opts=null;if(phase===0)phase=1;else{phase=0;k++;}draw();};$('#cn').focus();});};

/* Kural Makinesi: vav/yânın durumunu seç, kitabın hangi kuralının işlediğini gör */
function ocakMakine(head){
  const st={h:'و',m:'a',p:'lam',b:'a',n:'x',ar:0};
  const Q=[
   ['h','Harf',[['و','و vav'],['ي','ي yâ']]],
   ['m','Kendi harekesi',[['a','üstün'],['u','ötre'],['i','esre'],['o','sâkin']]],
   ['p','Yeri',[['fa','fâü’l-fiil (başta)'],['ayn','aynü’l-fiil (ortada)'],['lam','lâmü’l-fiil (sonda)']]],
   ['b','Öncesi',[['a','üstünlü harf'],['u','ötreli harf'],['i','esreli harf'],['o','sâkin sahîh harf'],['vs','sâkin vav/yâ'],['x','yok (başta)']]],
   ['n','Sonrası',[['x','önemli değil'],['ta','tesniye elifi'],['vv','harekeli vav'],['vy','harekeli yâ'],['sk','sâkin harf (iki sâkin)']]]
  ];
  const decide=()=>{const {h,m,p,b,n}=st;
    if(m==='o'&&(n==='vv'||n==='vy')){if(h==='و'&&n==='vv')return ['k9','مَغْزُوْوٌ → مَغْزُوٌّ',35];return ['k10','مَرْمُوْيٌ → مَرْمِيٌّ',36];}
    if(b==='vs'&&m!=='o'){if(h==='و')return ['k9','مَغْزُوْوٌ → مَغْزُوٌّ',35];return ['k10','مَرْمُوْيٌ → مَرْمِيٌّ',36];}
    if(m==='o'){
      if(n==='sk')return ['hz','غَزَاوْا → غَزَوْا',4];
      if(h==='ي'&&b==='u')return ['k4','يُيْسِرُ → يُوسِرُ',13];
      if(h==='و'&&b==='i')return ['kv','قِوْلَ → قِيلَ',14];
      if(b==='a'&&st.ar)return ['k1s','يَخَوْفُ → يَخَافُ',21];
      if(b==='a')return ['none','Sükûnu aslî olan vav/yâ, öncesi üstün olsa da değişmez: غَزَوْنَ، رَمَيْتُ، قَوْلٌ.',-1];
      if(h==='ي'&&b==='i')return ['k3','خَشِيتَ: yâ kalır',12];
      return ['none','Değişmez: medd harfi olarak kalır (يَقُولُ’daki vav gibi).',-1];}
    /* harekeli */
    if(n==='ta'&&b==='a')return ['none','Tesniyede kalb yoktur: غَزَوَا، رَمَيَا (elif-i tesniye ile karışmasın).',-1];
    if(b==='o')return ['k7','يَقْوُلُ → يَقُولُ',19];
    if(b==='a')return ['k1','قَوَلَ → قَالَ',0];
    if(p==='lam'&&(b==='u'||b==='i')&&m==='a')return ['k8','لَنْ يَغْزُوَ: mansûb, hareke kalır',25];
    if(h==='و'&&b==='i'&&p==='lam')return ['k6','غَبِوَ → غَبِيَ',15];
    if(p==='lam'&&(b==='u'||b==='i')&&m==='u')return ['k8','يَغْزُوُ → يَغْزُو · يَرْمِيُ → يَرْمِي',22];
    if(p==='lam'&&m==='i'&&b==='u')return ['st','تَغْزُوِينَ → تَغْزِوْينَ',29];
    if(h==='ي'&&b==='i')return ['k3','خَشِيَ: yâ kalır',12];
    if(h==='و'&&b==='u'&&m==='i')return ['st','قُوِلَ → قِوْلَ (sonra kural 4–5)',14];
    if(b==='x')return ['none','Başta harekeli vav/yâ sahîh harf gibidir (وَعَدَ). Misâlde fâ, muzâride düşebilir: يَعِدُ.',44];
    return ['none','Bu durum için kitapta özel bir kural yoktur; fiil sahîhe kıyasla çekilir.',-1];};
  const draw=()=>{const [k,ex,ci]=decide();const R=KURAL[k];
    app.innerHTML=head+`<div class="mach"><div class="card"><h3>Durumu kur</h3>${Q.map(([key,lab,os])=>`<div class="hq"><span>${lab}</span><div class="seg">${os.map(([v,t])=>`<button data-q="${key}" data-v="${v}" class="${st[key]===v?'on':''}">${esc(t)}</button>`).join('')}</div></div>`).join('')}
      ${st.m==='o'&&st.b==='a'?`<label class="check" style="margin-top:8px"><input type="checkbox" id="ar" ${st.ar?'checked':''}><span>Sükûnu aslî değil (harekesi öncesine nakledildi)</span></label>`:''}</div>
      <div class="card mres"><div class="eyebrow">Makinenin hükmü</div>${R?`<div class="bigrule">${R.n?`<span>Kural ${R.n}</span>`:''}<b>${esc(R.t)}</b><span class="ar">${esc(R.ar)}</span></div><p>${esc(R.d)}</p>`:`<div class="bigrule"><b>Değişiklik yok</b></div>`}<div class="exl"><span class="tiny muted">Misal</span><span class="ar">${esc(R?ex:ex)}</span></div>${ci>=0?`<a class="btn sm" href="#ocak/zincir/${ci}">Bu dönüşümü ocakta izle ›</a>`:''}</div></div>
      <p class="small muted" style="margin-top:12px">Makine, kitabın 1–10 numaralı kurallarını ve onlara bağlı nakil, iskân ve hazf işlemlerini seçtiğin duruma uygular. Kitabın altın kuralı: illetli fiili sahîhe kıyas et; kıyas ibdâl, nakil veya iskân gerektiriyorsa uygula.</p>`;
    $$('[data-q]').forEach(b=>b.onclick=()=>{st[b.dataset.q]=b.dataset.v;beep('tap');draw();});
    if($('#ar'))$('#ar').onchange=e=>{st.ar=e.target.checked?1:0;draw();};};
  draw();
}

function treeHTML(n,depth=0){const has=n.k&&n.k.length;
  let h=`<li><button class="tn ${has||n.leafs?'':'leaf'}" aria-expanded="true"><span class="car">▼</span><span>${esc(n.t)}</span><span class="ar">${esc(n.ar)}</span></button>`;

  return h+'</li>';}

function mcGame(id,title,items,render,N=10){

  const round=()=>{
    if(n>=pool.length)return gameEnd(id,sc,`${pool.length} turda ${sc} puan.`,()=>mcGame(id,title,items,render,N));
    const it=pool[n++];const R=render(it);$('#gi').textContent=`${n}/${pool.length} · Puan ${sc}`;
    $('#gc').innerHTML=`${R.html}<div class="opts" style="${R.cols?`grid-template-columns:repeat(${R.cols},minmax(0,1fr))`:''}">${R.opts.map((o,j)=>`<button class="${isAr(o)?'opt ar1':'opt tr'}" data-j="${j}">${isAr(o)?esc(o):AW(esc(o))}</button>`).join('')}</div><div class="fb" id="fb"></div>`;
    $$('#gc [data-j]').forEach(b=>b.onclick=()=>{const good=+b.dataset.j===R.a;$$('#gc [data-j]').forEach(x=>{x.disabled=true;if(+x.dataset.j===R.a)x.classList.add('ok');});if(!good){b.classList.add('no');streak=0;}else{streak++;sc+=10+Math.min(streak,5)*2;}
      beep(good?'ok':'no');$('#fb').className='fb '+(good?'ok':'no');$('#fb').innerHTML=(good?'Doğru! ':'Doğrusu gösterildi. ')+`<div class="small" style="font-weight:400">${R.ex||''}</div>`;TIMERS.push(setTimeout(round,good?1200:2400));});
  };round();
}

V.kart=([dk])=>{

  const box=i=>S.cards[dk+i]||0;
  const due=()=>{const min=Math.min(...D.items.map((_,i)=>box(i)));return pick(D.items.map((_,i)=>i).filter(i=>box(i)===min));};
  let cur=due(),flip=false;

    app.innerHTML=`<div class="sec-h"><div><div class="eyebrow">Kart destesi · Leitner</div><h2>${D.t}</h2></div></div>
    <div class="filter" style="margin-bottom:10px">${Object.entries(DECKS).map(([k,d])=>`<a class="btn sm ${k===dk?'pri':''}" href="#kart/${k}">${d.t}</a>`).join('')}</div>
    <div class="stage"><div class="hud"><span class="small muted">Kutular: ${bx.map((n,i)=>`${i+1}:${n}`).join(' · ')}</span></div>
    <div class="flash ${flip?'flip':''}" id="fc"><div class="in"><div class="face"><div class="qar">${esc(it.f)}</div><p class="muted small">${D.h}</p></div><div class="face bk">${it.b}</div></div></div>
    <div class="row" style="justify-content:center"><button class="btn" id="fl">Çevir</button><button class="btn" id="no" ${flip?'':'disabled'}>Tekrar et</button><button class="btn pri" id="ok" ${flip?'':'disabled'}>Bildim</button><button class="btn ghost" id="sy" aria-label="Dinle">${ICON.play}</button></div>

const TAGS={ders:'Metin ve tarifler',bab:'Sülâsî bâblar',vezin:'Mezîd vezinler',vasl:'Hemze-i vasl',mimi:'Mîmî masdar / mekân',siga:'Sîgalar',kisim:'Yedi kısım',ibdal:'İftiâl ibdâli',mana:'Bâb mânâları',tadiye:'Lâzım–müteaddî',ilal:'İ‘lâl kuralları',asl:'Aslî şekil'};
function genExam(scopes,count){
  const gens=[];const B=k=>scopes.includes(k);
  const lessonQ=k=>()=>{const L=pick(LESSONS.filter(l=>(l.k||1)===k));const q=pick(L.q);return {tag:'ders',k,q:AW(esc(q[0])),o:q[1],a:q[2],ex:AW(esc(q[3]))+` <span class="muted">(Ders: ${esc(L.t)})</span>`};};
  const W=(tag,k,f)=>()=>{const r=f();return r&&Object.assign({tag,k},r);};
  if(B(1)){gens.push(lessonQ(1),lessonQ(1),
    W('bab',1,()=>{const x=pick(ROOTS),b=babOf(x.b);return {q:`${A(pairOf(x.r,b))} Maksûd’a göre kaçıncı bâbdır?`,o:BABS.map(y=>y.id+'. bâb ('+y.vz+')'),a:x.b-1,ex:b.ar};}),
    W('vezin',1,()=>{const v=pick(VITRIN);const m=mcOpts(v.v,VITRIN.map(y=>y.v));return {q:`${A(v.c[0])} hangi bâbın veznindedir?`,o:m.o,a:m.a,ex:esc(v.g)};}));}
  if(B(2)){gens.push(lessonQ(2),lessonQ(2),
    W('vasl',2,()=>{const it=pick(VASL);return {q:`${A(it[0])} kelimesinin hemzesi?`,o:['Hemze-i vasl','Hemze-i kat‘'],a:it[1]==='v'?0:1,ex:esc(it[2])};}),
    W('mimi',2,()=>{const x=pick(ROOTS),b=babOf(x.b),r=x.r.split('');const right=fill(mimi(b).zm,r);const o=[...new Set([right,fill('مَFْAَLٌ',r),fill('مَFْAِLٌ',r),fill('مُFْAَLٌ',r)])];return {q:`${A(pairOf(x.r,b))} fiilinden ism-i mekân?`,o,a:o.indexOf(right),ex:b.mu==='i'?'Ayn esre → مَفْعِلٌ':'Ayn ötre/üstün → مَفْعَلٌ'};}));}
  if(B(3)){gens.push(lessonQ(3),
    W('siga',3,()=>{const it=sigaItem();return {q:`${esc(it.T.tr)}: ${A(it.f)} hangi sîgadır?`,o:it.o.map(j=>SIGA[j].tr),a:it.o.indexOf(it.i),ex:''};}),
    W('siga',3,()=>{const it=sigaItem();return {q:`${esc(it.T.tr)}: ${A(it.f)} hangi sîgadır?`,o:it.o.map(j=>SIGA[j].tr),a:it.o.indexOf(it.i),ex:''};}));}
  if(B(4)){gens.push(lessonQ(4),lessonQ(4),
    W('kisim',4,()=>{const it=pick(KISMQ);const m=mcOpts(KISM[it[1]],Object.values(KISM));return {q:`${A(it[0])} hangi kısımdandır?`,o:m.o,a:m.a,ex:''};}),
    W('ibdal',4,()=>{const it=pick(IBDAL);const o=[it[1],...it[2]];return {q:`${A(it[0].split('').join(' '))} kökünden اِفْتَعَلَ?`,o,a:0,ex:''};}),
    W('mana',4,()=>{const it=pick(MANA);const m=mcOpts(it[1],MANAK);return {q:`${A(it[0])} (${esc(it[2])}) hangi mânâdadır?`,o:m.o,a:m.a,ex:''};}),
    W('tadiye',4,()=>{const it=pick(TADIYE);const m=mcOpts(TADK[it[1]],Object.values(TADK));return {q:`${AW(esc(it[0]))}: ne olmuştur?`,o:m.o,a:m.a,ex:esc(it[2])};}));}
  if(B(5)){gens.push(lessonQ(5),lessonQ(5),
    W('ilal',5,()=>{const it=pick(STEPS.filter(s=>s.from!==s.s[1]));const right=it.s[0];const o=[right,...sample(Object.keys(KURAL).filter(k=>k!==right&&KURAL[k].t!==KURAL[right].t),3)];return {q:`${A(it.from)} → ${A(it.s[1])}: hangi işlem?`,o:o.map(k=>(KURAL[k].n?'Kural '+KURAL[k].n+' · ':'')+KURAL[k].t),a:0,ex:AW(esc(it.s[2]))};}),
    W('asl',5,()=>{const x=pick(ILAL.filter(y=>y.a!==y.w));const m=mcOpts(x.a,ILAL.filter(y=>y!==x&&y.a!==x.a).map(y=>y.a));return {q:`${A(x.w)} kelimesinin aslı?`,o:m.o,a:m.a,ex:x.s.map(s=>esc(KURAL[s[0]].t)).join(' → ')};}));}
  const out=[],keys=new Set();let guard=0;
  while(out.length<count&&guard++<count*60){const q=pick(gens)();if(!q||q.a<0||new Set(q.o).size!==q.o.length)continue;if(keys.has(q.q))continue;keys.add(q.q);const idx=shuffle(q.o.map((_,i)=>i));q.o=idx.map(i=>q.o[i]);q.a=idx.indexOf(q.a);out.push(q);}
  return out;
}

    <div class="card" style="margin-top:12px"><div class="q">${q.q}</div><div class="opts">${q.o.map((o,j)=>`<button class="${isAr(o)?'opt':'opt tr'} ${EX.ans[EX.i]===j?'picked':''}" data-j="${j}">${isAr(o)?esc(o):AW(esc(o))}</button>`).join('')}</div>
    <div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn sm" id="pv" ${EX.i?'':'disabled'}>‹ Önceki</button><button class="btn sm ghost" id="fg">${EX.flag[EX.i]?'⚑ İşareti kaldır':'⚐ Sonra bak'}</button>${EX.i<EX.qs.length-1?'<button class="btn sm pri" id="nx">Sonraki ›</button>':'<button class="btn sm pri" id="fin">Bitir</button>'}</div></div>
    <div class="qnav">${EX.qs.map((_,j)=>`<button data-n="${j}" class="${EX.ans[j]!==null?'ans':''} ${j===EX.i?'cur':''} ${EX.flag[j]?'flag':''}">${j+1}</button>`).join('')}</div>
    <div class="row" style="margin-top:12px"><button class="btn sm ghost" id="fin2">Sınavı bitir</button><button class="btn sm ghost" id="quit">Vazgeç</button></div></div>`;
    $$('[data-j]').forEach(b=>b.onclick=()=>{EX.ans[EX.i]=+b.dataset.j;beep('tap');if(EX.i<EX.qs.length-1)EX.i++;draw();});
    $('#pv').onclick=()=>{EX.i--;draw();};if($('#nx'))$('#nx').onclick=()=>{EX.i++;draw();};
    $('#fg').onclick=()=>{EX.flag[EX.i]=!EX.flag[EX.i];draw();};$$('[data-n]').forEach(b=>b.onclick=()=>{EX.i=+b.dataset.n;draw();});
    const fin=()=>{const bl=EX.ans.filter(a=>a===null).length;if(bl&&!confirm(bl+' soru boş. Yine de bitirilsin mi?'))return;finishExam();};
    if($('#fin'))$('#fin').onclick=fin;$('#fin2').onclick=fin;$('#quit').onclick=()=>{if(confirm('Sınav iptal edilsin mi?')){EX=null;location.hash='#sinav';}};tick();};
  const tick=()=>{const t=$('#tm');if(!t)return;const el=Math.floor((Date.now()-EX.start)/1000);if(EX.limit){const l=EX.limit-el;if(l<=0){finishExam();return;}t.textContent='⏱ '+Math.floor(l/60)+':'+String(l%60).padStart(2,'0');t.classList.toggle('low',l<60);}else t.textContent='⏱ '+Math.floor(el/60)+':'+String(el%60).padStart(2,'0');};
  TIMERS.push(setInterval(tick,1000));draw();
}
function finishExam(){stopTimers();const n=EX.qs.length,c=EX.qs.filter((q,i)=>EX.ans[i]===q.a).length;EX.done=true;EX.c=c;EX.pct=Math.round(c/n*100);EX.time=Math.floor((Date.now()-EX.start)/1000);
  S.exams.push({at:Date.now(),n,c,pct:EX.pct});S.exams=S.exams.slice(-30);save();addXP(c*5);if(EX.pct>=85){confetti();beep('win');}location.hash='#sinav/sonuc';}
const grade=p=>p>=85?'Pekiyi':p>=70?'İyi':p>=60?'Orta':p>=50?'Geçer':'Tekrar';
function examResult(){
  const tags={},bs={};EX.qs.forEach((q,i)=>{const ok=EX.ans[i]===q.a;const t=tags[q.tag]=tags[q.tag]||{n:0,c:0};t.n++;if(ok)t.c++;const b=bs[q.k]=bs[q.k]||{n:0,c:0};b.n++;if(ok)b.c++;});
  const bar=(lab,v)=>`<div><span>${lab}</span><div class="pbar"><i style="width:${v.c/v.n*100}%;background:${v.c/v.n>=.7?'var(--good)':v.c/v.n>=.5?'var(--gold)':'var(--bad)'}"></i></div><b>${v.c}/${v.n}</b></div>`;
  app.innerHTML=`<div class="stage"><div class="card" style="text-align:center"><div class="eyebrow">Sınav sonucu</div><div class="scorebig">%${EX.pct}</div><p><b>${grade(EX.pct)}</b> · ${EX.c}/${EX.qs.length} doğru · ${Math.floor(EX.time/60)} dk ${EX.time%60} sn</p>
    <div class="row" style="justify-content:center"><button class="btn pri" id="cert">Başarı belgesi</button>${EX.c<EX.qs.length?'<button class="btn" id="wr">Yanlışlarla yeni sınav</button>':''}<a class="btn" href="#sinav">Yeni sınav</a></div></div>
  <div class="card" style="margin-top:12px"><h3>Kısım raporu</h3><div class="bars" style="margin-top:10px">${Object.entries(bs).map(([k,v])=>bar(KISIM[k].tr,v)).join('')}</div><h3 style="margin-top:14px">Konu raporu</h3><div class="bars" style="margin-top:10px">${Object.entries(tags).map(([k,v])=>bar(TAGS[k],v)).join('')}</div></div>
  <div class="card" style="margin-top:12px"><h3>Cevap anahtarı</h3>${EX.qs.map((q,i)=>{const ok=EX.ans[i]===q.a;const sh=x=>isAr(x)?A(x):AW(esc(x));return `<div class="rev ${ok?'ok':'no'}"><div class="small"><b>${i+1}.</b> ${q.q}</div><div class="small" style="margin-top:4px">${ok?'✓':'✗'} Cevabın: ${EX.ans[i]===null?'<i>boş</i>':sh(q.o[EX.ans[i]])}${ok?'':` · Doğrusu: <b>${sh(q.o[q.a])}</b>`}</div><div class="tiny muted" style="margin-top:2px">${q.ex}</div></div>`;}).join('')}</div></div>`;
  $('#cert').onclick=()=>location.hash='#sinav/belge';
  if($('#wr'))$('#wr').onclick=()=>{const w=EX.qs.filter((q,i)=>EX.ans[i]!==q.a).map(q=>Object.assign({},q));EX={qs:w,ans:w.map(()=>null),flag:w.map(()=>false),i:0,start:Date.now(),limit:0,done:false,sc:EX.sc};location.hash='#sinav/run';};
}
function examCert(){
  const d=new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
  app.innerHTML=`<div class="stage"><div class="cert"><div class="kufi">الْمَقْصُودُ</div><div class="eyebrow" style="margin-top:6px">Başarı Belgesi</div>
  <h2 style="margin-top:10px">${esc(S.name||'Değerli öğrenci')}</h2><p>Maksûd Darphânesi programında <b>Kitâbü’l-Maksûd</b> sınavını <b>${EX.qs.length}</b> soruda <b>%${EX.pct}</b> başarı ile tamamlamış ve <b>“${grade(EX.pct)}”</b> derecesini almıştır.</p>
  <p class="muted small">${d} · Rütbe: ${lvl().name} · Altın sikke: ${LESSONS.filter(l=>lstar(l.id)===3).length}/${LESSONS.length}</p>
  <p class="small" style="margin-top:16px"><b>Marmara Üniversitesi İlahiyat Fakültesi Öğretim Görevlisi Hüseyin KAYA tarafından hazırlanmıştır.</b></p></div>
  <div class="row noprint" style="justify-content:center;margin-top:14px"><button class="btn pri" id="pr">Yazdır / PDF</button><a class="btn" href="#sinav/sonuc">Sonuca dön</a></div></div>`;
  $('#pr').onclick=()=>window.print();
}
