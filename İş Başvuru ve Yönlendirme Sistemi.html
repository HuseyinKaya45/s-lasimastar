<style>

.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

.brand{font-weight:700;font-size:18px}.brand small{display:block;font-weight:400;font-size:12px;opacity:.8}

main{padding:18px 0 60px}h1{font-size:22px;margin:6px 0 14px}h3{margin:0 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}.muted{color:var(--mut)}.small{font-size:12.5px}.mt8{margin-top:8px}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;font-size:12px}

<script>
(() => {
'use strict';
/* =====================================================================  yardımcılar */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const today = () => dStr(new Date());
const fmtD = (s) => (s ? s.split('-').reverse().join('.') : '—');
const fmtT = (ts) => { if (!ts) return '—'; const d = new Date(ts); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const isDate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(Date.parse(s)) && dStr(new Date(s + 'T12:00:00')) === s;
const daysBetween = (a, b) => Math.round((Date.parse(b + 'T12:00:00') - Date.parse(a + 'T12:00:00')) / 864e5);

/* SHA-256 (eşzamanlı; sabitler asal sayılardan türetilir) */

  };
})();
function tcValid(t) {

  const d10 = (((d[0] + d[2] + d[4] + d[6] + d[8]) * 7) - (d[1] + d[3] + d[5] + d[7])) % 10; if (((d10 + 10) % 10) !== d[9]) return false;
  return d.slice(0, 10).reduce((a, b) => a + b, 0) % 10 === d[10];

const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3000); };

/* =====================================================================  sabit güvenceler ve parametreler */
const HARD = { minAgeFloor: 18 }; // parametreyle düşürülemez
// Ayrımcılık yasağı: eşleştirme puanı yalnız iş gereklerine bakar. İlan metninde şu ifadeler engellenir (İş Kanunu m.5).
const DISCRIM = /\b(bayan|bay|erkek|kad[ıi]n|k[ıi]z|gen[cç]|ya[sş][ıi]nda|ya[sş]\s*s[ıi]n[ıi]r[ıi]|evli|bek[aâ]r|t[üu]rk\s*ol|m[üu]sl[üu]man|[çc]ocuks[uü]z|hamile|askerli[ğg]ini)\b/i;
const DEFAULT_PARAMS = () => ({
  institution: 'İş Başvuru ve Yönlendirme Birimi',
  minAge: 18, maxAge: 65,
  eduLevels: ['İlköğretim', 'Lise', 'Ön lisans', 'Lisans', 'Yüksek lisans', 'Doktora'],
  fields: ['Üretim / Sanayi', 'İnşaat', 'Ticaret / Satış', 'Bilişim', 'Sağlık', 'Eğitim', 'Turizm / Konaklama', 'Ulaşım / Lojistik', 'Tarım', 'Büro / Yönetim', 'Hizmet', 'Diğer'],
  skills: ['Excel', 'Ofis yazılımları', 'Muhasebe', 'Müşteri ilişkileri', 'Satış', 'Kasa işlemleri', 'Depo / stok', 'Forklift', 'Kaynak', 'CNC / torna', 'Elektrik tesisatı', 'Su tesisatı', 'Boya / badana', 'Duvar / kalıp', 'Şoförlük', 'Yazılım geliştirme', 'Veri tabanı', 'Ağ / sistem', 'Grafik tasarım', 'Hemşirelik', 'Hasta bakımı', 'İlk yardım', 'Öğretmenlik', 'Çocuk gelişimi', 'Aşçılık', 'Garsonluk', 'Temizlik', 'Güvenlik', 'Tarımsal üretim', 'Hayvancılık', 'İngilizce', 'Almanca', 'Arapça', 'Rusça', 'Takım çalışması', 'Proje yönetimi'],
  weights: { skills: 35, pref: 10, edu: 15, exp: 15, loc: 15, salary: 7, work: 3 },
  minScore: 50,
  reqRule: 'hepsi', reqPct: 80,       // zorunlu beceriler: hepsi | yüzde
  eduGap: 0,                          // gereken eğitimin en çok kaç seviye altı kabul edilir
  expGapYears: 0,                     // gereken deneyimden en çok kaç yıl eksik kabul edilir
  locHard: true,                      // çalışılabilecek iller dışındaki ilanlar elenir
  salaryHard: false, salaryTolerancePct: 15,
  maxActiveRefs: 3, refsPerSlot: 3, responseDays: 7, interviewDays: 14, retentionDays: 730,
  fairGapPct: 15,
  consentText: 'Kişisel verilerimin iş ve işçi bulma amacıyla işlenmesine, uygun görülen işverenlere ancak benim onayımdan sonra aktarılmasına rıza veriyorum. Rızamı dilediğim an geri alabileceğimi, verilerimin silinmesini isteyebileceğimi biliyorum.'
});
function validateParams(P) {
  const e = [], num = (v, lo, hi) => Number.isFinite(+v) && +v >= lo && +v <= hi;
  if (!num(P.minAge, HARD.minAgeFloor, 100)) e.push(`En düşük yaş ${HARD.minAgeFloor} veya üzeri olmalı (sabit güvence).`);
  if (!num(P.maxAge, P.minAge, 100)) e.push('En yüksek yaş, en düşük yaştan küçük olamaz.');
  for (const k of ['eduLevels', 'fields', 'skills']) if (!Array.isArray(P[k]) || !P[k].length || P[k].some((x) => !String(x).trim())) e.push(`"${k}" listesi boş olamaz.`);
  if ((new Set(P.skills.map(trLower))).size !== P.skills.length) e.push('Beceri listesinde yinelenen kayıt var.');
  let sum = 0; for (const [k, v] of Object.entries(P.weights)) { if (!num(v, 0, 100)) e.push(`Ağırlık "${k}" 0–100 arasında olmalı.`); sum += +v; }
  if (sum <= 0) e.push('Ağırlıkların toplamı sıfırdan büyük olmalı.');
  if (!num(P.minScore, 0, 100)) e.push('Asgari puan 0–100 olmalı.');
  if (!['hepsi', 'yuzde'].includes(P.reqRule)) e.push('Zorunlu beceri kuralı geçersiz.');
  if (!num(P.reqPct, 1, 100)) e.push('Zorunlu beceri yüzdesi 1–100 olmalı.');
  if (!num(P.eduGap, 0, 5)) e.push('Eğitim farkı 0–5 olmalı.'); if (!num(P.expGapYears, 0, 20)) e.push('Deneyim farkı 0–20 olmalı.');
  if (!num(P.salaryTolerancePct, 0, 200)) e.push('Ücret toleransı 0–200 olmalı.');
  if (!num(P.maxActiveRefs, 1, 20)) e.push('Aday başına aktif yönlendirme 1–20 olmalı.'); if (!num(P.refsPerSlot, 1, 20)) e.push('Kadro başına yönlendirme 1–20 olmalı.');
  if (!num(P.responseDays, 1, 60) || !num(P.interviewDays, 1, 120)) e.push('Süre alanları geçersiz.'); if (!num(P.retentionDays, 30, 3650)) e.push('Saklama süresi 30–3650 gün olmalı.');
  if (!num(P.fairGapPct, 1, 100)) e.push('Adalet eşiği 1–100 olmalı.'); if (!String(P.institution).trim()) e.push('Kurum adı gerekli.'); if (!String(P.consentText).trim()) e.push('Rıza metni gerekli.');
  return e;
}
const sealOf = (P) => sha256(canon({ ...P, institution: '' }));

/* =====================================================================  durum, depolama, denetim zinciri */
const KEY = 'isb_v1';
let memOnly = false;
const fresh = () => ({ v: 1, meta: { officer: '', created: Date.now(), lastBackup: 0, lock: null }, params: DEFAULT_PARAMS(), paramHistory: [], seekers: {}, employers: {}, vacancies: {}, referrals: {}, blocked: [], counters: {}, audit: [], run: null });
let S;
function load() { try { const r = localStorage.getItem(KEY); if (r) { const j = JSON.parse(r); if (j && j.v === 1) return j; } } catch { memOnly = true; } return fresh(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { memOnly = true; } }
const user = () => S.meta.officer || 'görevli';
function A(action, detail = '') { // detail yalnız kayıt numaraları/işlem türü içermeli; kişisel veri YAZMAYIN
  const last = S.audit[S.audit.length - 1], i = last ? last.i + 1 : 1, prev = last ? last.hash : 'GENESIS', ts = Date.now(), u = user();
  S.audit.push({ i, ts, user: u, action, detail: String(detail), prev, hash: sha256([prev, i, ts, u, action, detail].join('\u001f')) });
}
function verifyChain(list = S.audit) { let prev = 'GENESIS', n = 0; for (const e of list) { if (e.prev !== prev || e.i !== n + 1 || e.hash !== sha256([prev, e.i, e.ts, e.user, e.action, e.detail].join('\u001f'))) return { ok: false, at: e.i, checked: n }; prev = e.hash; n++; } return { ok: true, n, head: prev }; }
const nextId = (pfx) => { const y = new Date().getFullYear(), k = pfx + y; S.counters[k] = (S.counters[k] || 0) + 1; return `${pfx}-${y}-${pad(S.counters[k], 4)}`; };
const P = () => S.params;
const ACTIVE_REF = ['yanit_bekliyor', 'kabul', 'gorusme'];
const REF_ST = { yanit_bekliyor: ['Aday yanıtı bekleniyor', 'warn'], kabul: ['Aday kabul etti', 'good'], gorusme: ['Görüşme planlı', 'good'], ise_alindi: ['İşe alındı', 'good'], alinmadi: ['İşveren almadı', ''], vazgecti: ['Aday vazgeçti', ''], ret: ['Aday reddetti', ''], zamanasimi: ['Zaman aşımı', ''], iptal: ['İptal', ''] };
const SK_ST = { taslak: ['Taslak', ''], aktif: ['Aktif (havuzda)', 'good'], pasif: ['Pasif', 'info'], yerlesti: ['İşe yerleşti', 'good'], silindi: ['Anonimleştirildi', ''] };
const VC_ST = { acik: ['Açık', 'good'], doldu: ['Doldu', 'info'], kapali: ['Kapalı', ''] };
const WT = [['tam', 'Tam zamanlı'], ['yari', 'Yarı zamanlı'], ['vardiya', 'Vardiyalı'], ['uzaktan', 'Uzaktan'], ['mevsimlik', 'Mevsimlik']];
const WTN = Object.fromEntries(WT);
const EHL = ['Yok', 'B', 'C', 'D', 'E'];

/* =====================================================================  eşleştirme motoru */
const poolable = (s) => s.status === 'aktif' && s.consent && s.consent.data && s.consent.referral;
const vacOpen = (v) => v.status === 'acik' && (!v.closes || v.closes >= today()) && S.employers[v.employer] && S.employers[v.employer].verified && S.employers[v.employer].status !== 'pasif';
const pkey = (a, b) => a + '|' + b;
function ctx() {
  const act = {}, vact = {}, pairs = new Set(), blocked = new Set(S.blocked);
  for (const r of Object.values(S.referrals)) { pairs.add(pkey(r.seeker, r.vacancy)); if (ACTIVE_REF.includes(r.status)) { act[r.seeker] = (act[r.seeker] || 0) + 1; vact[r.vacancy] = (vact[r.vacancy] || 0) + 1; } }
  return { act, vact, pairs, blocked };
}
const eduIdx = (x) => +x || 0;
/** Bir iş arayan ile bir pozisyon arasında puan. Cinsiyet, yaş, medeni hâl, sağlık/engel, din vb. HİÇ kullanılmaz. */
function scorePair(s, v, Pm = P()) {
  const parts = [], w = Pm.weights; let hard = null;
  const has = new Set(s.skills.map(trLower));
  // beceriler
  const req = v.req || [], pref = v.pref || [], gotReq = req.filter((x) => has.has(trLower(x))), missing = req.filter((x) => !has.has(trLower(x)));
  const reqCov = req.length ? gotReq.length / req.length : 1;
  if (req.length && (Pm.reqRule === 'hepsi' ? missing.length : reqCov * 100 < Pm.reqPct)) hard = 'skills';
  parts.push({ k: 'skills', label: 'Zorunlu beceriler', v: reqCov, w: w.skills, note: req.length ? `${gotReq.length}/${req.length} karşılandı${missing.length ? ' · eksik: ' + missing.join(', ') : ''}` : 'Zorunlu beceri istenmiyor', miss: missing });
  const gotPref = pref.filter((x) => has.has(trLower(x)));
  parts.push({ k: 'pref', label: 'Tercih edilen beceriler', v: pref.length ? gotPref.length / pref.length : 1, w: w.pref, note: pref.length ? `${gotPref.length}/${pref.length}` : 'Tercih belirtilmemiş' });
  // eğitim
  const need = eduIdx(v.minEdu), have = eduIdx(s.edu), gap = need - have;
  if (gap > Pm.eduGap && !hard) hard = 'edu';
  parts.push({ k: 'edu', label: 'Eğitim', v: gap <= 0 ? 1 : Math.max(0, 1 - gap / 3), w: w.edu, note: `${Pm.eduLevels[have] || '?'} ↔ aranan en az ${Pm.eduLevels[need] || '?'}` });
  // deneyim
  const expGap = (v.minExp || 0) - (s.exp || 0);
  if (expGap > Pm.expGapYears && !hard) hard = 'exp';
  parts.push({ k: 'exp', label: 'Deneyim', v: (v.minExp || 0) === 0 ? 1 : Math.min(1, (s.exp || 0) / v.minExp), w: w.exp, note: `${s.exp || 0} yıl ↔ aranan ${v.minExp || 0} yıl` });
  // konum
  const remote = v.workType === 'uzaktan', same = trLower(s.il) === trLower(v.il), okCity = (s.cities || []).map(trLower).includes(trLower(v.il));
  const loc = remote ? 1 : same ? 1 : okCity ? 0.85 : 0;
  if (loc === 0 && Pm.locHard && !hard) hard = 'loc';
  parts.push({ k: 'loc', label: 'Konum', v: loc, w: w.loc, note: remote ? 'Uzaktan çalışma' : same ? 'Aynı il' : okCity ? 'Çalışmak istediği illerden' : `${s.il} ↔ ${v.il}: aday bu ilde çalışmak istemiyor` });
  // ücret
  let sal = 1, snote = 'Ücret beklentisi belirtilmemiş';
  if (s.salaryMin && v.salaryMax) { if (s.salaryMin <= v.salaryMax) { sal = 1; snote = 'Beklenti ücret aralığında'; } else { const over = (s.salaryMin - v.salaryMax) / v.salaryMax * 100; sal = Math.max(0, 1 - over / 50); snote = `Beklenti, üst sınırdan %${Math.round(over)} yüksek`; if (Pm.salaryHard && over > Pm.salaryTolerancePct && !hard) hard = 'salary'; } }
