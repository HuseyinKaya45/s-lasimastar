{"k":"أَفْقَدَ","c":"","m":"يُفْقِدُ إِفْقاداً: جَعَلَهُ يَفْقِدُ الشَّيْءَ، “سَمِعَ كَلاماً قَبيحاً، أَفْقَدَهُ أَعْصابَهُ”.","t":"جَعَلَهُ يَفْقِدُ الشَّيْءَ","o":["سَمِعَ كَلاماً قَبيحاً، أَفْقَدَهُ أَعْصابَهُ"],"b":["سَمِعَ كَلاماً قَبيحاً، أَفْقَدَهُ أَعْصابَهُ","أَفْقَدَهُ"],"tr":"kaybettirmek","ttr":"Onun bir şeyi kaybetmesine yol açtı.","otr":["Çirkin bir söz işitti; bu onu sinirlendirdi (sinirlerini kaybettirdi)."],"r":null,"s":24,"f":"يُفْقِدُ إِفْقاداً"},
{"k":"أَفْقَرُ","c":"","m":"أَكْثَرُ فَقْراً؛ خِلافُ أَغْنَى، “كانَ غَنِيّاً، لَكِنَّهُ أَصْبَحَ مِنْ أَفْقَرِ النّاسِ، بِسَبَبِ المَيْسِرِ وَالرِّبا”.","t":"أَكْثَرُ فَقْراً؛ خِلافُ أَغْنَى","o":["كانَ غَنِيّاً، لَكِنَّهُ أَصْبَحَ مِنْ أَفْقَرِ النّاسِ، بِسَبَبِ المَيْسِرِ وَالرِّبا"],"b":["كانَ غَنِيّاً، لَكِنَّهُ أَصْبَحَ مِنْ أَفْقَرِ النّاسِ، بِسَبَبِ المَيْسِرِ وَالرِّبا","أَفْقَرِ"],"tr":"daha fakir","ttr":"Daha yoksul; daha zenginin zıddı.","otr":["Zengindi, ama kumar ve faiz yüzünden insanların en fakirlerinden biri oldu."],"r":null,"s":24},
{"k":"أَفْلَتَ","c":"","m":"يُفْلِتُ إِفْلاتاً: نَجا وَتَخَلَّصَ، “أَفْلَتَ المُجْرِمُ مِنَ العِقابِ، حَيْثُ لَمْ يَكُنِ الدَّليلُ واضِحاً”.","t":"نَجا وَتَخَلَّصَ","o":["أَفْلَتَ المُجْرِمُ مِنَ العِقابِ، حَيْثُ لَمْ يَكُنِ الدَّليلُ واضِحاً"],"b":["أَفْلَتَ المُجْرِمُ مِنَ العِقابِ، حَيْثُ لَمْ يَكُنِ الدَّليلُ واضِحاً","أَفْلَتَ"],"tr":"kurtulmak, yakayı sıyırmak","ttr":"Kurtuldu ve sıyrıldı.","otr":["Delil açık olmadığı için suçlu cezadan yakayı sıyırdı."],"r":null,"s":25,"y":[["مصدر","إِفْلات"]],"f":"يُفْلِتُ إِفْلاتاً"},
{"k":"أَفْلَحَ","c":"","m":"يُفْلِحُ إِفْلاحاً وَفَلاحاً: فازَ، ظَفِرَ، “أَفْلَحَ مَنِ اتَّقَى اللهَ”، ﴿قَدْ أَفْلَحَ الْمُؤْمِنُونَ﴾.","t":"فازَ، ظَفِرَ","o":["أَفْلَحَ مَنِ اتَّقَى اللهَ","﴿قَدْ أَفْلَحَ الْمُؤْمِنُونَ﴾"],"b":["قَدْ أَفْلَحَ الْمُؤْمِنُونَ","أَفْلَحَ"],"tr":"kurtuluşa ermek","ttr":"Kazandı, başarıya ulaştı.","otr":["Allah'tan korkan kurtuluşa erdi.","Müminler gerçekten kurtuluşa ermiştir."],"r":null,"s":25},
{"k":"أَفْلَسَ","c":"","m":"يُفْلِسُ إِفْلاساً: فَقَدَ مالَهُ. “أَفْلَسَ التّاجِرُ بَعْدَ أَنْ كَسَدَتْ بِضاعَتُهُ”، “أَعْلَنَتِ الشَّرِكَةُ إِفْلاسَها، وَتَوَقَّفَتْ عَنْ دَفْعِ الرَّواتِبِ لِلْمُوَظَّفينَ”.","t":"فَقَدَ مالَهُ","o":["أَفْلَسَ التّاجِرُ بَعْدَ أَنْ كَسَدَتْ بِضاعَتُهُ","أَعْلَنَتِ الشَّرِكَةُ إِفْلاسَها، وَتَوَقَّفَتْ عَنْ دَفْعِ الرَّواتِبِ لِلْمُوَظَّفينَ"],"b":["أَفْلَسَ التّاجِرُ بَعْدَ أَنْ كَسَدَتْ بِضاعَتُهُ","أَفْلَسَ"],"tr":"iflas etmek","ttr":"Malını kaybetti.","otr":["Tüccar, malları satılmaz olunca iflas etti.","Şirket iflasını açıkladı ve çalışanlara maaş ödemeyi durdurdu."],"r":null,"s":25,"y":[["مصدر","إِفْلاس"]],"f":"يُفْلِسُ إِفْلاساً"},
{"k":"أَفْنَى","c":"","m":"يُفْني إِفْناءً: أَبادَ وَقَضَى، “تُفْني الحَرْبُ كَثيراً مِنَ الأَبْرِياءِ”، “أَفْنَى حَياتَهُ في نَصْرِ الحَقِّ”.","t":"أَبادَ وَقَضَى","o":["تُفْني الحَرْبُ كَثيراً مِنَ الأَبْرِياءِ","أَفْنَى حَياتَهُ في نَصْرِ الحَقِّ"],"b":["أَفْنَى حَياتَهُ في نَصْرِ الحَقِّ","أَفْنَى"],"tr":"yok etmek; tüketmek","ttr":"Yok etti, bitirdi.","otr":["Savaş birçok masumu yok eder.","Ömrünü hakkı savunmaya adadı (harcadı)."],"r":"p25_1","s":25,"f":"يُفْني إِفْناءً"},
{"k":"أَفْهَمَ","c":"","m":"يُفْهِمُ إِفْهاماً: جَعَلَهُ يَفْهَمُ الأَمْرَ. “أَفْهَمْتُهُ الحَقيقَةَ كامِلَةً”.","t":"جَعَلَهُ يَفْهَمُ الأَمْرَ","o":["أَفْهَمْتُهُ الحَقيقَةَ كامِلَةً"],"b":["أَفْهَمْتُهُ الحَقيقَةَ كامِلَةً","أَفْهَمْتُهُ"],"tr":"anlatmak, anlatıp kavratmak","ttr":"Ona meseleyi anlamasını sağladı.","otr":["Ona gerçeği tümüyle anlattım."],"r":null,"s":25,"f":"يُفْهِمُ إِفْهاماً"},
{"k":"أَقالَ","c":"","m":"يُقيلُ إِقالَةً: أَبْعَدَ، “أَقالَ الرَّئيسُ وَزيرَ الإِعْلامِ دونَ ذِكْرِ الأَسْبابِ”.","t":"أَبْعَدَ","o":["أَقالَ الرَّئيسُ وَزيرَ الإِعْلامِ دونَ ذِكْرِ الأَسْبابِ"],"b":["أَقالَ الرَّئيسُ وَزيرَ الإِعْلامِ دونَ ذِكْرِ الأَسْبابِ","أَقالَ"],"tr":"görevden almak","ttr":"Uzaklaştırdı (görevden aldı).","otr":["Cumhurbaşkanı, sebeplerini belirtmeden enformasyon bakanını görevden aldı."],"r":null,"s":25,"f":"يُقيلُ إِقالَةً"},
{"k":"أَقامَ","c":"","m":"يُقيمُ إِقامَةً: (١) اتَّخَذَ المَكانَ لِلإِقامَةِ وَالسُّكْنَى فيهِ، “أَقامَ في مَكَّةَ سَنَتَيْنِ”. (٢) أَدامَ وَحافَظَ عَلَى، ﴿الَّذينَ إِنْ مَكَّنّاهُمْ فِي الأَرْضِ أَقامُوا الصَّلاةَ﴾. (٣) هَيَّأَ وَأَعَدَّ، “أَقامَ حَفْلَ غَداءٍ لِلضُّيوفِ”، “أَقامَتِ المَدرَسَةُ حَفْلاً كَبيراً”. (٤) أَظْهَرَ، بَيَّنَ، “أَقامَ الدَّليلَ عَلَى صِدْقِهِ”.","t":"(١) اتَّخَذَ المَكانَ لِلإِقامَةِ وَالسُّكْنَى فيهِ (٢) أَدامَ وَحافَظَ عَلَى (٣) هَيَّأَ وَأَعَدَّ (٤) أَظْهَرَ، بَيَّنَ","o":["أَقامَ في مَكَّةَ سَنَتَيْنِ","﴿الَّذينَ إِنْ مَكَّنّاهُمْ فِي الأَرْضِ أَقامُوا الصَّلاةَ﴾","أَقامَ حَفْلَ غَداءٍ لِلضُّيوفِ","أَقامَتِ المَدرَسَةُ حَفْلاً كَبيراً","أَقامَ الدَّليلَ عَلَى صِدْقِهِ"],"b":["أَقامَ في مَكَّةَ سَنَتَيْنِ","أَقامَ"],"tr":"ikamet etmek; kılmak; düzenlemek","ttr":"(1) Bir yeri ikamet ve oturma yeri edindi. (2) Devam ettirdi ve korudu. (3) Hazırladı, düzenledi. (4) Ortaya koydu, açıkladı.","otr":["Mekke'de iki yıl kaldı.","Onlar ki, kendilerini yeryüzünde iktidar sahibi kılarsak namazı dosdoğru kılarlar.","Misafirler için bir öğle yemeği daveti verdi.","Okul büyük bir tören düzenledi.","Doğruluğuna dair delil ortaya koydu."],"r":null,"s":25,"y":[["مصدر","إِقامَة"]],"f":"يُقيمُ إِقامَةً"},
{"k":"أَقْبَلَ","c":"","m":"يُقْبِلُ إِقْبالاً: (١) قَدِمَ وَجاءَ؛ خِلافُ أَدْبَرَ، “أَقْبَلَ أَحمَدُ مَسْروراً مِنَ الحَفْلِ”، وَفي الحَديث: (إِذا أَقْبَلَ اللَّيلُ مِن ها هُنا، وَأَدْبَرَ النَّهارُ مِن ها هُنا، فَقَدْ أَفْطَرَ الصّائِمُ)، ﴿يا مُوسَى أَقْبِلْ وَلا تَخَفْ﴾. (٢) اهتَمَّ وَاجتَهَدَ، “يُقْبِلُ العامِلُ المُخْلِصُ عَلَى عَمَلِهِ”.","t":"(١) قَدِمَ وَجاءَ؛ خِلافُ أَدْبَرَ (٢) اهتَمَّ وَاجتَهَدَ","o":["أَقْبَلَ أَحمَدُ مَسْروراً مِنَ الحَفْلِ","(إِذا أَقْبَلَ اللَّيلُ مِن ها هُنا، وَأَدْبَرَ النَّهارُ مِن ها هُنا، فَقَدْ أَفْطَرَ الصّائِمُ)","﴿يا مُوسَى أَقْبِلْ وَلا تَخَفْ﴾","يُقْبِلُ العامِلُ المُخْلِصُ عَلَى عَمَلِهِ"],"b":["أَقْبَلَ أَحمَدُ مَسْروراً مِنَ الحَفْلِ","أَقْبَلَ"],"tr":"yönelip gelmek","ttr":"(1) Gelip yaklaştı; arkasını dönüp gitmenin zıddı. (2) Bir işe ilgi gösterip çalıştı.","otr":["Ahmet törenden sevinçli olarak geldi.","Hadiste: (Gece şuradan gelip gündüz şuradan çekip gidince oruçlu iftar etmiş olur.)","Ey Musa, gel ve korkma!","İhlaslı işçi işine sarılır."],"r":"p25_2","s":25,"f":"يُقْبِلُ إِقْبالاً"},
{"k":"أَقْحَمَ","c":"","m":"يُقْحِمُ إِقْحاماً: أَدْخَلَ نَفْسَهُ، أَو غَيْرَهُ في الأَمْرِ دونَ تَفْكيرٍ أَو اسْتِعْدادٍ، “لا تُقْحِمْ نَفْسَكَ فيما لا يَعْنيكَ”.","t":"أَدْخَلَ نَفْسَهُ، أَو غَيْرَهُ في الأَمْرِ دونَ تَفْكيرٍ أَو اسْتِعْدادٍ","o":["لا تُقْحِمْ نَفْسَكَ فيما لا يَعْنيكَ"],"b":["لا تُقْحِمْ نَفْسَكَ فيما لا يَعْنيكَ","تُقْحِمْ"],"tr":"(bir işe) sokmak, bulaştırmak","ttr":"Kendini ya da başkasını düşünmeden ve hazırlıksız bir işe soktu.","otr":["Seni ilgilendirmeyen işlere burnunu sokma."],"r":null,"s":25,"f":"يُقْحِمُ إِقْحاماً"},
{"k":"أَقْدَرَ","c":"","m":"يُقْدِرُ إِقْداراً: قَوّاهُ، وَجَعَلَهُ قادِراً عَلَى القِيامِ بِالعَمَلِ، “أَسأَلُ اللهَ أَنْ يُقْدِرَني عَلَى تَرْبِيَةِ أَوْلادي”.","t":"قَوّاهُ، وَجَعَلَهُ قادِراً عَلَى القِيامِ بِالعَمَلِ","o":["أَسأَلُ اللهَ أَنْ يُقْدِرَني عَلَى تَرْبِيَةِ أَوْلادي"],"b":["أَسأَلُ اللهَ أَنْ يُقْدِرَني عَلَى تَرْبِيَةِ أَوْلادي","يُقْدِرَني"],"tr":"güç yetirtmek","ttr":"Onu güçlendirdi ve işi yapabilecek hale getirdi.","otr":["Allah'tan, çocuklarımı yetiştirmeye güç yetirmemi sağlamasını dilerim."],"r":null,"s":25,"f":"يُقْدِرُ إِقْداراً"},
{"k":"أَقْدَمَ","c":"","m":"يُقْدِمُ إِقْداماً: أَخَذَ، شَرَعَ، “أَقْدَمْتُ عَلَى تَنْفيذِ المَشْروعِ دونَ تَرَدُّدٍ”.","t":"أَخَذَ، شَرَعَ","o":["أَقْدَمْتُ عَلَى تَنْفيذِ المَشْروعِ دونَ تَرَدُّدٍ"],"b":["أَقْدَمْتُ عَلَى تَنْفيذِ المَشْروعِ دونَ تَرَدُّدٍ","أَقْدَمْتُ"],"tr":"girişmek, kalkışmak","ttr":"Başladı, girişti.","otr":["Tereddüt etmeden projeyi uygulamaya giriştim."],"r":null,"s":25,"y":[["مصدر","إِقْدام"]],"f":"يُقْدِمُ إِقْداماً"},
{"k":"أَقَرَّ","c":"","m":"يُقِرُّ إِقْراراً: (١) رَضِيَ، قَبِلَ وَوافَقَ، “أَقَرَّ الوُزَراءُ الميزانِيَّةَ، بَعْدَ نِقاشٍ طَويلٍ”. (٢) اعْتَرَفَ، “أَقَرَّ العَدُوُّ بِالهَزيمَةِ”.","t":"(١) رَضِيَ، قَبِلَ وَوافَقَ (٢) اعْتَرَفَ","o":["أَقَرَّ الوُزَراءُ الميزانِيَّةَ، بَعْدَ نِقاشٍ طَويلٍ","أَقَرَّ العَدُوُّ بِالهَزيمَةِ"],"b":["أَقَرَّ العَدُوُّ بِالهَزيمَةِ","أَقَرَّ"],"tr":"onaylamak; itiraf etmek","ttr":"(1) Razı oldu, kabul etti ve onayladı. (2) İtiraf etti.","otr":["Bakanlar uzun bir tartışmadan sonra bütçeyi onayladı.","Düşman yenilgiyi kabul etti."],"r":null,"s":25,"f":"يُقِرُّ إِقْراراً"},
{"k":"أَقْرَأَ","c":"","m":"يُقْرِئُ إِقْراءً: (١) جَعَلَ الشَّخْصَ يَقْرَأُ، “أَقْرَأَ المُعَلِّمُ التَّلاميذَ الدَّرْسَ واحِداً بَعْدَ الآخَرِ”. (٢) عَلَّمَهُ القُرْآنَ، ﴿سَنُقْرِئُكَ فَلا تَنْسَى﴾.","t":"(١) جَعَلَ الشَّخْصَ يَقْرَأُ (٢) عَلَّمَهُ القُرْآنَ","o":["أَقْرَأَ المُعَلِّمُ التَّلاميذَ الدَّرْسَ واحِداً بَعْدَ الآخَرِ","﴿سَنُقْرِئُكَ فَلا تَنْسَى﴾"],"b":["أَقْرَأَ المُعَلِّمُ التَّلاميذَ الدَّرْسَ واحِداً بَعْدَ الآخَرِ","أَقْرَأَ"],"tr":"okutmak","ttr":"(1) Kişiye okuttu. (2) Ona Kur'an öğretti.","otr":["Öğretmen dersi öğrencilere birbiri ardınca okuttu.","Sana okutacağız, artık unutmayacaksın."],"r":"p25_3","s":25,"f":"يُقْرِئُ إِقْراءً"},
{"k":"أَقْرَضَ","c":"","m":"يُقْرِضُ إِقْراضاً وَقَرْضاً: (١) أَعْطَى غَيْرَهُ قَرْضاً (شَيْئاً) لِيَرُدَّهُ إِلَيهِ لاحِقاً، “سَأَلْتُهُ أَنْ يُقْرِضَني بَعْضَ المالِ فَوافَقَ”. (٢) أَقْرَضَ اللهَ: تَصَدَّقَ عَلَى الفُقَراءِ، ﴿وَأَقْرِضُوا اللَّهَ قَرْضاً حَسَناً﴾.","t":"(١) أَعْطَى غَيْرَهُ قَرْضاً (شَيْئاً) لِيَرُدَّهُ إِلَيهِ لاحِقاً (٢) أَقْرَضَ اللهَ: تَصَدَّقَ عَلَى الفُقَراءِ","o":["سَأَلْتُهُ أَنْ يُقْرِضَني بَعْضَ المالِ فَوافَقَ","﴿وَأَقْرِضُوا اللَّهَ قَرْضاً حَسَناً﴾"],"b":["سَأَلْتُهُ أَنْ يُقْرِضَني بَعْضَ المالِ فَوافَقَ","يُقْرِضَني"],"tr":"borç vermek","ttr":"(1) Sonra geri vermesi için başkasına borç (bir şey) verdi. (2) Allah'a borç verdi: fakirlere sadaka verdi.","otr":["Ondan bana biraz borç para vermesini istedim, o da kabul etti.","Allah'a güzel bir borç verin."],"r":null,"s":25},
{"k":"أَقْسَطَ","c":"","m":"يُقْسِطُ إِقْساطاً: عَدَلَ في حُكْمِهِ؛ خِلافُ جارَ، “عَلَى القاضي أَنْ يُقْسِطَ في حُكْمِهِ”، ﴿فَأَصْلِحُوا بَيْنَهُما بِالْعَدْلِ وَأَقْسِطُوا إِنَّ اللَّهَ يُحِبُّ الْمُقْسِطينَ﴾.","t":"عَدَلَ في حُكْمِهِ؛ خِلافُ جارَ","o":["عَلَى القاضي أَنْ يُقْسِطَ في حُكْمِهِ","﴿فَأَصْلِحُوا بَيْنَهُما بِالْعَدْلِ وَأَقْسِطُوا إِنَّ اللَّهَ يُحِبُّ الْمُقْسِطينَ﴾"],"b":["عَلَى القاضي أَنْ يُقْسِطَ في حُكْمِهِ","يُقْسِطَ"],"tr":"adil davranmak","ttr":"Hükmünde adil davrandı; zulmetmenin zıddı.","otr":["Hâkim hükmünde adil olmalıdır.","Aralarını adaletle düzeltin ve adil davranın; şüphesiz Allah adil davrananları sever."],"r":null,"s":26,"f":"يُقْسِطُ إِقْساطاً"},
{"k":"أَقْسَمَ","c":"","m":"يُقْسِمُ إِقْساماً: حَلَفَ يَميناً، “لا تُقْسِمْ إِلّا بِاللهِ وَحدَهُ”، ﴿أَهَؤُلاءِ الَّذينَ أَقْسَمُوا بِاللَّهِ جَهْدَ أَيْمانِهِمْ إِنَّهُمْ لَمَعَكُمْ﴾.","t":"حَلَفَ يَميناً","o":["لا تُقْسِمْ إِلّا بِاللهِ وَحدَهُ","﴿أَهَؤُلاءِ الَّذينَ أَقْسَمُوا بِاللَّهِ جَهْدَ أَيْمانِهِمْ إِنَّهُمْ لَمَعَكُمْ﴾"],"b":["لا تُقْسِمْ إِلّا بِاللهِ وَحدَهُ","تُقْسِمْ"],"tr":"yemin etmek","ttr":"Yemin etti.","otr":["Yalnızca Allah adına yemin et.","Sizinle beraber olduklarına dair Allah'a bütün güçleriyle yemin edenler bunlar mı?"],"r":null,"s":26,"f":"يُقْسِمُ إِقْساماً"},
{"k":"أُقْصوصَة","c":"أَقاصيص","m":"(ج) أَقاصيص: قِصَّةٌ قَصيرَةٌ، “كَتَبَ القاصُّ أُقْصوصَةً تَصِفُ حَياةَ أَهْلِ قَرْيَتِهِ”.","t":"قِصَّةٌ قَصيرَةٌ","o":["كَتَبَ القاصُّ أُقْصوصَةً تَصِفُ حَياةَ أَهْلِ قَرْيَتِهِ"],"b":["كَتَبَ القاصُّ أُقْصوصَةً تَصِفُ حَياةَ أَهْلِ قَرْيَتِهِ","أُقْصوصَةً"],"tr":"kısa hikâye","ttr":"Kısa öykü.","otr":["Hikâyeci, köyünün halkının hayatını anlatan kısa bir öykü yazdı."],"r":null,"s":26},
{"k":"أَقْصَى","c":"","m":"يُقْصي إِقْصاءً: أَبْعَدَ، “أَقْصَى مُديرُ الشَّرِكَةِ المُهَنْدِسَ عَنْ عَمَلِهِ، بَعْدَ فَشَلِ المَشْروعِ”.","t":"أَبْعَدَ","o":["أَقْصَى مُديرُ الشَّرِكَةِ المُهَنْدِسَ عَنْ عَمَلِهِ، بَعْدَ فَشَلِ المَشْروعِ"],"b":["أَقْصَى مُديرُ الشَّرِكَةِ المُهَنْدِسَ عَنْ عَمَلِهِ، بَعْدَ فَشَلِ المَشْروعِ","أَقْصَى"],"tr":"uzaklaştırmak","ttr":"Uzaklaştırdı.","otr":["Şirket müdürü, proje başarısız olunca mühendisi işinden uzaklaştırdı."],"r":null,"s":26,"f":"يُقْصي إِقْصاءً"},
{"k":"أَقْعَدَ","c":"","m":"يُقْعِدُ إِقْعاداً. (١) جَعَلَ الشَّخْصَ يَقْعُدُ، “أَقْعَدْتُ الطِّفْلَ عَلَى الدَّرّاجَةِ”. (٢) مَنَعَ، حَبَسَ، “أَقْعَدَهُ المَرَضُ عَنِ العَمَلِ”.","t":"(١) جَعَلَ الشَّخْصَ يَقْعُدُ (٢) مَنَعَ، حَبَسَ","o":["أَقْعَدْتُ الطِّفْلَ عَلَى الدَّرّاجَةِ","أَقْعَدَهُ المَرَضُ عَنِ العَمَلِ"],"b":["أَقْعَدْتُ الطِّفْلَ عَلَى الدَّرّاجَةِ","أَقْعَدْتُ"],"tr":"oturtmak; alıkoymak","ttr":"(1) Kişiyi oturttu. (2) Engelledi, alıkoydu.","otr":["Çocuğu bisiklete oturttum.","Hastalık onu işten alıkoydu."],"r":"p26_4","s":26},
{"k":"أَقْفَرَ","c":"","m":"يُقْفِرُ إِقْفاراً: خَلا مِنَ الماءِ وَالعُشْبِ وَالنّاسِ، “أَقْفَرَتِ الدِّيارُ بَعْدَ الزِّلْزالِ مِنْ أَهْلِها”، “أَقْفَرَتِ الأَرْضُ بَعْدَ انْقِطاعِ المَطَرِ”.","t":"خَلا مِنَ الماءِ وَالعُشْبِ وَالنّاسِ","o":["أَقْفَرَتِ الدِّيارُ بَعْدَ الزِّلْزالِ مِنْ أَهْلِها","أَقْفَرَتِ الأَرْضُ بَعْدَ انْقِطاعِ المَطَرِ"],"b":["أَقْفَرَتِ الأَرْضُ بَعْدَ انْقِطاعِ المَطَرِ","أَقْفَرَتِ"],"tr":"ıssızlaşmak, çoraklaşmak","ttr":"Sudan, otlaktan ve insanlardan boş kaldı.","otr":["Depremden sonra yurtlar sakinlerinden boşaldı.","Yağmurun kesilmesinden sonra toprak çoraklaştı."],"r":null,"s":26,"f":"يُقْفِرُ إِقْفاراً"},
{"k":"أَقْفَلَ","c":"","m":"يُقْفِلُ إِقْفالاً: أَغْلَقَ، “دَخَلَ ثُمَّ أَقْفَلَ البابَ وَراءَهُ”.","t":"أَغْلَقَ","o":["دَخَلَ ثُمَّ أَقْفَلَ البابَ وَراءَهُ"],"b":["دَخَلَ ثُمَّ أَقْفَلَ البابَ وَراءَهُ","أَقْفَلَ"],"tr":"kilitlemek","ttr":"Kapattı, kilitledi.","otr":["İçeri girdi, sonra kapıyı arkasından kilitledi."],"r":"p26_5","s":26,"f":"يُقْفِلُ إِقْفالاً"},
{"k":"أَقْلَعَ","c":"","m":"يُقْلِعُ إِقْلاعاً. (١) انْطَلَقَ وَارْتَفَعَ وَغادَرَ؛ خِلافُ هَبَطَ، “أَقْلَعَتِ الطّائِرَةُ مِنَ المَطارِ”. (٢) كَفَّ، وَامْتَنَعَ، “أَقْلَعَ عَنِ التَّدْخينِ، بَعْدَ أَنْ أَدْرَكَ أَضْرارَهُ”.","t":"(١) انْطَلَقَ وَارْتَفَعَ وَغادَرَ؛ خِلافُ هَبَطَ (٢) كَفَّ، وَامْتَنَعَ","o":["أَقْلَعَتِ الطّائِرَةُ مِنَ المَطارِ","أَقْلَعَ عَنِ التَّدْخينِ، بَعْدَ أَنْ أَدْرَكَ أَضْرارَهُ"],"b":["أَقْلَعَتِ الطّائِرَةُ مِنَ المَطارِ","أَقْلَعَتِ"],"tr":"havalanmak; bırakmak","ttr":"(1) Hareket edip yükseldi ve ayrıldı; inmenin zıddı. (2) Vazgeçti, bıraktı.","otr":["Uçak havalimanından havalandı.","Zararlarını anlayınca sigarayı bıraktı."],"r":"p26_6","s":26,"y":[["مصدر","إِقْلاع"]]},
{"k":"أَقْلَقَ","c":"","m":"يُقْلِقُ إِقْلاقاً: أَزْعَجَ، “يُقْلِقُ الآباءَ مَرَضُ أَبْنائِهِم”.","t":"أَزْعَجَ","o":["يُقْلِقُ الآباءَ مَرَضُ أَبْنائِهِم"],"b":["يُقْلِقُ الآباءَ مَرَضُ أَبْنائِهِم","يُقْلِقُ"],"tr":"endişelendirmek","ttr":"Rahatsız etti, tedirgin etti.","otr":["Çocuklarının hastalığı ana babaları endişelendirir."],"r":null,"s":26,"f":"يُقْلِقُ إِقْلاقاً"},
{"k":"أَقَلِّيَّة","c":"أَقَلِّيّات","m":"(ج) أَقَلِّيّات: خِلافُ أَكْثَرِيَّة، مَنْ كانَ عَدَدُهُم أَقَلَّ مِنْ غَيْرِهِم، “المُسلِمونَ أَقَلِّيَّةٌ في جَنوبِ إِفريقيا، لَكِنَّهُم أَكْثَرِيَّةٌ في أَندونيسيا”.","t":"خِلافُ أَكْثَرِيَّة، مَنْ كانَ عَدَدُهُم أَقَلَّ مِنْ غَيْرِهِم","o":["المُسلِمونَ أَقَلِّيَّةٌ في جَنوبِ إِفريقيا، لَكِنَّهُم أَكْثَرِيَّةٌ في أَندونيسيا"],"b":["المُسلِمونَ أَقَلِّيَّةٌ في جَنوبِ إِفريقيا، لَكِنَّهُم أَكْثَرِيَّةٌ في أَندونيسيا","أَقَلِّيَّةٌ"],"tr":"azınlık","ttr":"Çoğunluğun zıddı; sayıları başkalarından az olanlar.","otr":["Müslümanlar Güney Afrika'da azınlık, fakat Endonezya'da çoğunluktur."],"r":null,"s":26},
{"k":"إِقْليم","c":"أَقاليم","m":"(ج) أَقاليم: مَنْطِقَةٌ سِياسِيَّةٌ أَو جُغْرافِيَّةٌ أَو تاريخِيَّةٌ، لَها مِيزاتٌ تَجْعَلُها وَحْدَةً واحِدَةً. “إِقْليمُ البَحْرِ الأَبْيَضِ المُتَوَسِّطِ شَمالَ الصَّحْراءِ”، “العالَمُ الإِسْلامِيُّ بِهِ عَدَدٌ كَبيرٌ مِنَ الأَقاليمِ المُناخِيَّةِ وَالطَّبيعِيَّةِ المُخْتَلِفَةِ”.","t":"مَنْطِقَةٌ سِياسِيَّةٌ أَو جُغْرافِيَّةٌ أَو تاريخِيَّةٌ، لَها مِيزاتٌ تَجْعَلُها وَحْدَةً واحِدَةً","o":["إِقْليمُ البَحْرِ الأَبْيَضِ المُتَوَسِّطِ شَمالَ الصَّحْراءِ","العالَمُ الإِسْلامِيُّ بِهِ عَدَدٌ كَبيرٌ مِنَ الأَقاليمِ المُناخِيَّةِ وَالطَّبيعِيَّةِ المُخْتَلِفَةِ"],"b":["إِقْليمُ البَحْرِ الأَبْيَضِ المُتَوَسِّطِ شَمالَ الصَّحْراءِ","إِقْليمُ"],"tr":"bölge, iklim kuşağı","ttr":"Kendisini tek bir birim yapan özellikleri olan siyasi, coğrafi ya da tarihî bölge.","otr":["Sahra'nın kuzeyindeki Akdeniz bölgesi.","İslam dünyasında birçok farklı iklim ve doğa bölgesi vardır."],"r":"p26_1","s":26},
{"k":"أَقْنَعَ","c":"","m":"يُقْنِعُ إِقْناعاً: جَعَلَهُ يَقْتَنِعُ بِالأَمْرِ، “أَقْنَعْتُهُ بِالرَّأْيِ دونَ صُعوبَةٍ”.","t":"جَعَلَهُ يَقْتَنِعُ بِالأَمْرِ","o":["أَقْنَعْتُهُ بِالرَّأْيِ دونَ صُعوبَةٍ"],"b":["أَقْنَعْتُهُ بِالرَّأْيِ دونَ صُعوبَةٍ","أَقْنَعْتُهُ"],"tr":"ikna etmek","ttr":"Onu bir şeye inandırdı, ikna etti.","otr":["Onu zorlanmadan bu görüşe ikna ettim."],"r":null,"s":26,"f":"يُقْنِعُ إِقْناعاً"},
{"k":"أَقْوَى","c":"","m":"أَكْثَرُ قُوَّةً؛ خِلافُ أَضْعَف، “الشّابُّ أَقْوَى مِنَ الشَّيْخِ”، “الحَقُّ أَقْوَى مِنَ الباطِلِ”.","t":"أَكْثَرُ قُوَّةً؛ خِلافُ أَضْعَف","o":["الشّابُّ أَقْوَى مِنَ الشَّيْخِ","الحَقُّ أَقْوَى مِنَ الباطِلِ"],"b":["الحَقُّ أَقْوَى مِنَ الباطِلِ","أَقْوَى"],"tr":"daha güçlü","ttr":"Gücü daha fazla olan; daha zayıfın zıddı.","otr":["Genç, yaşlıdan daha güçlüdür.","Hak, batıldan daha güçlüdür."],"r":null,"s":26},
{"k":"أَكَبَّ","c":"","m":"يُكِبُّ إِكْباباً: (١) نَظَرَ إِلَى الأَرْضِ كَثيراً. “أَكَبَّ إِبْراهيمُ بِوَجْهِهِ إِلَى الأَرْضِ، أَنَّهُ فَقَدَ شَيْئاً”، ﴿أَفَمَنْ يَمْشي مُكِبّاً عَلَى وَجْهِهِ أَهْدَى أَمَّنْ يَمْشي سَوِيّاً عَلَى صِراطٍ مُسْتَقيمٍ﴾. (٢) أَقْبَلَ عَلَى الشَّيْءِ، “أَكَبَّ عَلَى قِراءَةِ القُرْآنِ بِشَغَفٍ”، “أَكَبَّ عَلَى عَمَلِهِ بِإِخْلاصٍ”.","t":"(١) نَظَرَ إِلَى الأَرْضِ كَثيراً (٢) أَقْبَلَ عَلَى الشَّيْءِ","o":["أَكَبَّ إِبْراهيمُ بِوَجْهِهِ إِلَى الأَرْضِ، أَنَّهُ فَقَدَ شَيْئاً","﴿أَفَمَنْ يَمْشي مُكِبّاً عَلَى وَجْهِهِ أَهْدَى أَمَّنْ يَمْشي سَوِيّاً عَلَى صِراطٍ مُسْتَقيمٍ﴾","أَكَبَّ عَلَى قِراءَةِ القُرْآنِ بِشَغَفٍ","أَكَبَّ عَلَى عَمَلِهِ بِإِخْلاصٍ"],"b":["أَكَبَّ عَلَى قِراءَةِ القُرْآنِ بِشَغَفٍ","أَكَبَّ"],"tr":"yere eğilmek; kendini vermek","ttr":"(1) Uzun süre yere baktı. (2) Bir şeye yöneldi, kendini verdi.","otr":["İbrahim, bir şey kaybetmiş gibi yüzünü yere eğdi.","Yüzüstü sürünerek yürüyen mi daha doğru yoldadır, yoksa dosdoğru bir yolda düzgünce yürüyen mi?","Kur'an okumaya büyük bir istekle kendini verdi.","İşine ihlasla sarıldı."],"r":"p26_2","s":26,"f":"يُكِبُّ إِكْباباً"},
{"k":"أَكْبَرُ","c":"","m":"(مُؤ) كُبْرَى: (١) أَكْثَرُ كِبَراً، خِلافُ أَصْغَر، “عَلِيٌّ أَكْبَرُ مِنْ أَخيهِ”، ﴿وَالْفِتْنَةُ أَكْبَرُ مِنَ الْقَتْلِ﴾. (٢) أَغْلَبُ، “أَكْبَرُ الظَّنِّ أَنَّهُ هُوَ الفائِزُ”.","t":"(١) أَكْثَرُ كِبَراً، خِلافُ أَصْغَر (٢) أَغْلَبُ","o":["عَلِيٌّ أَكْبَرُ مِنْ أَخيهِ","﴿وَالْفِتْنَةُ أَكْبَرُ مِنَ الْقَتْلِ﴾","أَكْبَرُ الظَّنِّ أَنَّهُ هُوَ الفائِزُ"],"b":["عَلِيٌّ أَكْبَرُ مِنْ أَخيهِ","أَكْبَرُ"],"tr":"daha büyük","ttr":"(1) Daha büyük; daha küçüğün zıddı. (2) En çok, en kuvvetli.","otr":["Ali kardeşinden büyüktür.","Fitne öldürmekten daha büyüktür.","Kuvvetle muhtemel ki kazanan odur."],"r":"p26_3","s":26},
{"k":"أَكْثَرُ","c":"","m":"خِلافُ أَقَلَّ، “الطُّلّابُ أَكْثَرُ مِنَ المُعَلِّمينَ”، ﴿وَما أَكْثَرُ النّاسِ وَلَوْ حَرَصْتَ بِمُؤْمِنينَ﴾.","t":"خِلافُ أَقَلَّ","o":["الطُّلّابُ أَكْثَرُ مِنَ المُعَلِّمينَ","﴿وَما أَكْثَرُ النّاسِ وَلَوْ حَرَصْتَ بِمُؤْمِنينَ﴾"],"b":["الطُّلّابُ أَكْثَرُ مِنَ المُعَلِّمينَ","أَكْثَرُ"],"tr":"daha çok","ttr":"Daha azın zıddı.","otr":["Öğrenciler öğretmenlerden daha çoktur.","Sen ne kadar istesen de insanların çoğu iman edecek değildir."],"r":"p27_1","s":27},
{"k":"أَكْثَرَ","c":"","m":"يُكْثِرُ إِكْثاراً: فَعَلَ الكَثيرَ، “يُكْثِرُ المُحْسِنونَ مِنَ الصَّدَقاتِ في شَهْرِ رَمَضانَ”، “أَكْثِرْ مِنْ قِراءَةِ القُرْآنِ”، ﴿فَأَكْثَرُوا فيهَا الْفَسادَ﴾.","t":"فَعَلَ الكَثيرَ","o":["يُكْثِرُ المُحْسِنونَ مِنَ الصَّدَقاتِ في شَهْرِ رَمَضانَ","أَكْثِرْ مِنْ قِراءَةِ القُرْآنِ","﴿فَأَكْثَرُوا فيهَا الْفَسادَ﴾"],"b":["يُكْثِرُ المُحْسِنونَ مِنَ الصَّدَقاتِ في شَهْرِ رَمَضانَ","يُكْثِرُ"],"tr":"çoğaltmak, çok yapmak","ttr":"Çok yaptı.","otr":["Hayırseverler ramazan ayında sadakayı çoğaltır.","Kur'an'ı çok oku.","Oralarda bozgunculuğu çoğalttılar."],"r":null,"s":27,"f":"يُكْثِرُ إِكْثاراً"},
{"k":"أَكَّدَ","c":"","m":"يُؤَكِّدُ تَأْكيداً: ثَبَّتَ وَحَقَّقَ، “أَكَّدَ الوَزيرُ الخَبَرَ”، “يَجِبُ أَنْ تُؤَكِّدَ الحَجْزَ قَبْلَ السَّفَرِ بِوَقْتٍ كافٍ”.","t":"ثَبَّتَ وَحَقَّقَ","o":["أَكَّدَ الوَزيرُ الخَبَرَ","يَجِبُ أَنْ تُؤَكِّدَ الحَجْزَ قَبْلَ السَّفَرِ بِوَقْتٍ كافٍ"],"b":["أَكَّدَ الوَزيرُ الخَبَرَ","أَكَّدَ"],"tr":"teyit etmek","ttr":"Sağlamlaştırdı ve doğruladı.","otr":["Bakan haberi doğruladı.","Yolculuktan yeterli bir süre önce rezervasyonu teyit etmelisin."],"r":null,"s":27,"f":"يُؤَكِّدُ تَأْكيداً"},
{"k":"أُكْذوبَة","c":"أَكاذيب","m":"(ج) أَكاذيب: خَبَرٌ كاذِبٌ. “تَنْتَشِرُ الأَكاذيبُ في زَمَنِ الفِتَنِ”.","t":"خَبَرٌ كاذِبٌ","o":["تَنْتَشِرُ الأَكاذيبُ في زَمَنِ الفِتَنِ"],"b":["تَنْتَشِرُ الأَكاذيبُ في زَمَنِ الفِتَنِ","الأَكاذيبُ"],"tr":"yalan haber","ttr":"Yalan haber.","otr":["Fitne zamanlarında yalanlar yayılır."],"r":null,"s":27},
{"k":"أَكْرَمَ","c":"","m":"يُكْرِمُ إِكْراماً: (١) أَكْرَمَ الضَّيْفَ: قَدَّمَ ما يَحتاجُ إِلَيهِ مِنْ طَعامٍ وَشَرابٍ وَفِراشٍ وَغَيْرِ ذَلِكَ، وَفي الحَديث: (مَنْ كانَ يُؤْمِنُ بِاللهِ وَاليَوْمِ الآخِرِ فَلْيُكْرِمْ ضَيْفَهُ). (٢) عَظَّمَ وَنَزَّهَ، ﴿وَقالَ الَّذي اشْتَراهُ مِنْ مِصْرَ لِامْرَأَتِهِ أَكْرِمي مَثْواهُ﴾.","t":"(١) أَكْرَمَ الضَّيْفَ: قَدَّمَ ما يَحتاجُ إِلَيهِ مِنْ طَعامٍ وَشَرابٍ وَفِراشٍ وَغَيْرِ ذَلِكَ (٢) عَظَّمَ وَنَزَّهَ","o":["(مَنْ كانَ يُؤْمِنُ بِاللهِ وَاليَوْمِ الآخِرِ فَلْيُكْرِمْ ضَيْفَهُ)","﴿وَقالَ الَّذي اشْتَراهُ مِنْ مِصْرَ لِامْرَأَتِهِ أَكْرِمي مَثْواهُ﴾"],"b":["مَنْ كانَ يُؤْمِنُ بِاللهِ وَاليَوْمِ الآخِرِ فَلْيُكْرِمْ ضَيْفَهُ","فَلْيُكْرِمْ"],"tr":"ikram etmek, ağırlamak","ttr":"(1) Misafire ikram etti: yiyecek, içecek, yatak vb. ihtiyaç duyduğu şeyleri sundu. (2) Saygı gösterdi, yüceltti.","otr":["Hadiste: (Allah'a ve ahiret gününe iman eden, misafirine ikram etsin.)","Onu Mısır'da satın alan adam karısına: Ona güzel bak, dedi."],"r":null,"s":27,"f":"يُكْرِمُ إِكْراماً"},
{"k":"أَكْرَهَ","c":"","m":"يُكْرِهُ إِكْراهاً: أَجْبَرَ، ﴿إِلّا مَنْ أُكْرِهَ وَقَلْبُهُ مُطْمَئِنٌّ بِالإِيمانِ﴾، ﴿لا إِكْراهَ فِي الدِّينِ﴾.","t":"أَجْبَرَ","o":["﴿إِلّا مَنْ أُكْرِهَ وَقَلْبُهُ مُطْمَئِنٌّ بِالإِيمانِ﴾","﴿لا إِكْراهَ فِي الدِّينِ﴾"],"b":["إِلّا مَنْ أُكْرِهَ وَقَلْبُهُ مُطْمَئِنٌّ بِالإِيمانِ","أُكْرِهَ"],"tr":"zorlamak","ttr":"Zorladı, mecbur etti.","otr":["Kalbi imanla dolu olduğu halde zorlananlar hariç.","Dinde zorlama yoktur."],"r":null,"s":27,"y":[["مصدر","إِكْراه"]],"f":"يُكْرِهُ إِكْراهاً"},
{"k":"أَكْسَبَ","c":"","m":"يُكْسِبُ إِكْساباً: جَعَلَهُ يَكْسِبُ، “أَكْسَبَتْهُ مُخالَطَةُ العُلَماءِ الحِرْصَ عَلَى طَلَبِ العِلْمِ”.","t":"جَعَلَهُ يَكْسِبُ","o":["أَكْسَبَتْهُ مُخالَطَةُ العُلَماءِ الحِرْصَ عَلَى طَلَبِ العِلْمِ"],"b":["أَكْسَبَتْهُ مُخالَطَةُ العُلَماءِ الحِرْصَ عَلَى طَلَبِ العِلْمِ","أَكْسَبَتْهُ"],"tr":"kazandırmak","ttr":"Onun bir şey kazanmasını sağladı.","otr":["Âlimlerle düşüp kalkmak ona ilim öğrenme hırsı kazandırdı."],"r":null,"s":27,"f":"يُكْسِبُ إِكْساباً"},
{"k":"أُكْسِجين","c":"","m":"عُنْصُرٌ مِنْ عَناصِرِ الهَواءِ يَسْتَنْشِقُهُ الكائِنُ الحَيُّ في أَثْناءِ التَّنَفُّسِ، “يَقِلُّ الأُكسِجينُ في الأَماكِنِ المُرتَفِعَةِ”.","t":"عُنْصُرٌ مِنْ عَناصِرِ الهَواءِ يَسْتَنْشِقُهُ الكائِنُ الحَيُّ في أَثْناءِ التَّنَفُّسِ","o":["يَقِلُّ الأُكسِجينُ في الأَماكِنِ المُرتَفِعَةِ"],"b":["يَقِلُّ الأُكسِجينُ في الأَماكِنِ المُرتَفِعَةِ","الأُكسِجينُ"],"tr":"oksijen","ttr":"Canlının nefes alırken içine çektiği, havanın elementlerinden biri.","otr":["Yüksek yerlerde oksijen azalır."],"r":"p27_2","s":27},
{"k":"أَكَلَ","c":"","m":"يَأْكُلُ أَكْلاً: (١) مَضَغَ وَبَلَعَ، (أَكَلَ طَعامَكُمُ الأَبْرارُ). (٢) ظَلَمَ، “أَكَلَ حَقَّ المِسْكينِ”، ﴿إِنَّ الَّذينَ يَأْكُلُونَ أَمْوالَ الْيَتامَى إِنَّما يَأْكُلُونَ في بُطُونِهِمْ ناراً﴾. (٣) أَكَلَ لَحْمَهُ: اغْتابَهُ، ﴿أَيُحِبُّ أَحَدُكُمْ أَنْ يَأْكُلَ لَحْمَ أَخيهِ مَيْتاً﴾.","t":"(١) مَضَغَ وَبَلَعَ (٢) ظَلَمَ (٣) أَكَلَ لَحْمَهُ: اغْتابَهُ","o":["(أَكَلَ طَعامَكُمُ الأَبْرارُ)","أَكَلَ حَقَّ المِسْكينِ","﴿إِنَّ الَّذينَ يَأْكُلُونَ أَمْوالَ الْيَتامَى إِنَّما يَأْكُلُونَ في بُطُونِهِمْ ناراً﴾","﴿أَيُحِبُّ أَحَدُكُمْ أَنْ يَأْكُلَ لَحْمَ أَخيهِ مَيْتاً﴾"],"b":["أَكَلَ حَقَّ المِسْكينِ","أَكَلَ"],"tr":"yemek","ttr":"(1) Çiğneyip yuttu. (2) Haksızlık etti. (3) Birinin etini yedi: onu gıybet etti.","otr":["(Yemeğinizi iyiler yesin.)","Yoksulun hakkını yedi.","Yetimlerin mallarını yiyenler, karınlarına ancak ateş doldurmaktadırlar.","Biriniz ölü kardeşinin etini yemekten hoşlanır mı?"],"r":"p27_3","s":27,"f":"يَأْكُلُ أَكْلاً"},
{"k":"أَكْلَة","c":"أَكلات","m":"(ج) أَكلات: المَرَّةُ مِنَ الأَكْلِ، وَفي الحَديث: (فَصْلُ ما بَيْنَ صِيامِنا وَصِيامِ أَهْلِ الكِتابِ أَكْلَةُ السَّحَرِ).","t":"المَرَّةُ مِنَ الأَكْلِ","o":["(فَصْلُ ما بَيْنَ صِيامِنا وَصِيامِ أَهْلِ الكِتابِ أَكْلَةُ السَّحَرِ)"],"b":["فَصْلُ ما بَيْنَ صِيامِنا وَصِيامِ أَهْلِ الكِتابِ أَكْلَةُ السَّحَرِ","أَكْلَةُ"],"tr":"bir öğün, bir yeme","ttr":"Bir defa yemek; öğün.","otr":["Hadiste: (Bizim orucumuzla Ehl-i Kitab'ın orucu arasındaki fark sahur yemeğidir.)"],"r":null,"s":27},

{"k":"إلَه","c":"آلِهَة","m":"(ج) آلِهَة : المَعْبودُ ، “أَشْهَدُ أَنْ لا إلَهَ إلاَّ اللهُ” ، أي : لا مَعْبودَ بِحَقٍّ إلا اللهُ . ﴿أَنَّهُ لَا إِلَهَ إِلَّا أَنَا فَاعْبُدُونِ﴾ ، ﴿لَوْ كَانَ فِيهِمَا آلِهَةٌ إِلَّا اللَّهُ لَفَسَدَتَا﴾ .","t":"المَعْبودُ","o":["أَشْهَدُ أَنْ لا إلَهَ إلاَّ اللهُ","﴿أَنَّهُ لَا إِلَهَ إِلَّا أَنَا فَاعْبُدُونِ﴾","﴿لَوْ كَانَ فِيهِمَا آلِهَةٌ إِلَّا اللَّهُ لَفَسَدَتَا﴾"],"b":["أَشْهَدُ أَنْ لا إلَهَ إلاَّ اللهُ","إلَهَ"],"tr":"ilah","ttr":"Kendisine ibadet edilen.","otr":["Allah'tan başka ilah olmadığına şahitlik ederim (yani hak ile ibadet edilen yalnızca Allah'tır).","Benden başka ilah yoktur; öyleyse bana ibadet edin.","Eğer yerde ve gökte Allah'tan başka ilahlar olsaydı, ikisinin de düzeni bozulurdu."],"r":null,"s":28},

{"k":"أَمَّ","c":"","m":"يَؤُمُّ أَمّاً : (١) قَصَدَ وَتَوَجَّهَ إلى ، “أَمَّ الطُّلّابُ مَكْتَبَ المُديرِ” ، “في الظَّلامِ يَؤُمُّ النّاسُ الصَّوْتَ ؛ فَيَصِلونَ إلى المَكانِ المَطْلوبِ” . (٢) قادَ وَتَقَدَّمَ ، “أَمَّ مُحَمَّدٌ المُصَلِّينَ في الصَّلاةِ” ، (يَؤُمُّ القَوْمَ أَقْرَؤُهُمْ لِكِتابِ اللهِ) .","t":"(١) قَصَدَ وَتَوَجَّهَ إلى . (٢) قادَ وَتَقَدَّمَ","o":["أَمَّ الطُّلّابُ مَكْتَبَ المُديرِ","في الظَّلامِ يَؤُمُّ النّاسُ الصَّوْتَ ؛ فَيَصِلونَ إلى المَكانِ المَطْلوبِ","أَمَّ مُحَمَّدٌ المُصَلِّينَ في الصَّلاةِ","(يَؤُمُّ القَوْمَ أَقْرَؤُهُمْ لِكِتابِ اللهِ)"],"b":["أَمَّ الطُّلّابُ مَكْتَبَ المُديرِ","أَمَّ"],"tr":"yönelmek; imamlık etmek","ttr":"(1) Kastetti, yöneldi. (2) Önderlik etti, öne geçti (namaz kıldırdı).","otr":["Öğrenciler müdürün odasına yöneldi.","Karanlıkta insanlar sese yönelir; böylece istenen yere ulaşırlar.","Muhammed namazda cemaate imamlık etti.","Topluluğa Allah'ın kitabını en iyi okuyanları imam olur."],"r":null,"s":28,"y":[["جمع","أُمَّهات"]],"f":"يَؤُمُّ أَمّاً"},
{"k":"أُمّ","c":"أُمَّهات، أُمّات","m":"(ج) أُمَّهات / أُمّات : (١) الوالِدَةُ ، “آمِنَةُ بِنْتُ وَهْبٍ أُمُّ الرَّسولِ ﷺ” ، قالَ عُمَرُ : “مَتَى اسْتَعْبَدْتُمُ النّاسَ وَقَدْ وَلَدَتْهُمْ أُمَّهاتُهُمْ أَحْراراً” ، ﴿وَإِذْ أَنْتُمْ أَجِنَّةٌ فِي بُطُونِ أُمَّهَاتِكُمْ﴾ . (٢) الأَصْلُ ، “العَرَبِيَّةُ هِيَ اللُّغَةُ الأُمُّ لِكُلِّ العَرَبِ” . (٣) أُمُّ القُرْآنِ : الفاتِحَةُ . (٤) أُمُّ القُرَى : مَكَّةُ . (٥) أُمُّ الخَبائِثِ : الخَمْرُ .","t":"(١) الوالِدَةُ . (٢) الأَصْلُ . (٣) أُمُّ القُرْآنِ : الفاتِحَةُ . (٤) أُمُّ القُرَى : مَكَّةُ . (٥) أُمُّ الخَبائِثِ : الخَمْرُ","o":["آمِنَةُ بِنْتُ وَهْبٍ أُمُّ الرَّسولِ ﷺ","مَتَى اسْتَعْبَدْتُمُ النّاسَ وَقَدْ وَلَدَتْهُمْ أُمَّهاتُهُمْ أَحْراراً","﴿وَإِذْ أَنْتُمْ أَجِنَّةٌ فِي بُطُونِ أُمَّهَاتِكُمْ﴾","العَرَبِيَّةُ هِيَ اللُّغَةُ الأُمُّ لِكُلِّ العَرَبِ"],"b":["آمِنَةُ بِنْتُ وَهْبٍ أُمُّ الرَّسولِ ﷺ","أُمُّ"],"tr":"anne","ttr":"(1) Anne. (2) Asıl, köken. (3) Ümmü'l-Kur'an: Fâtiha suresi. (4) Ümmü'l-Kurâ: Mekke. (5) Ümmü'l-Habâis (kötülüklerin anası): içki.","otr":["Vehb'in kızı Âmine, Resûlullah'ın (s.a.v.) annesidir.","Hz. Ömer dedi ki: Anneleri onları hür doğurmuşken insanları ne zamandan beri köleleştirdiniz?","Hani siz annelerinizin karnında ceninler iken...","Arapça bütün Araplar için ana dildir."],"r":"p29_1","s":29},
{"k":"أَماتَ","c":"","m":"يُميتُ إماتَةً : قَضَى عَلَى ؛ خِلافُ أَحْيا ، “تُميتُ الحَرْبُ آلافَ الأَبْرِياءِ كُلَّ يَوْمٍ” ، ﴿وَأَنَّهُ هُوَ أَمَاتَ وَأَحْيَا﴾ .","t":"قَضَى عَلَى ؛ خِلافُ أَحْيا","o":["تُميتُ الحَرْبُ آلافَ الأَبْرِياءِ كُلَّ يَوْمٍ","﴿وَأَنَّهُ هُوَ أَمَاتَ وَأَحْيَا﴾"],"b":["تُميتُ الحَرْبُ آلافَ الأَبْرِياءِ كُلَّ يَوْمٍ","تُميتُ"],"tr":"öldürmek","ttr":"İşini bitirdi; diriltmenin zıddı.","otr":["Savaş her gün binlerce masumu öldürüyor.","Öldüren de dirilten de O'dur."],"r":"p29_2","s":29,"f":"يُميتُ إماتَةً"},
{"k":"إمارَة","c":"إمارات","m":"(ج) إمارات : (١) وِلايَةُ شُؤونِ المُسْلِمينَ ، “تَوَلَّى عَمْرُو بْنُ العاصِ إمارَةَ مِصْرَ” . (٢) الإقْليمُ أَوِ المَنْطِقَةُ الَّتي يَحْكُمُها الأَميرُ . “إمارَةُ الكُوَيْتِ ، وَإمارَةُ قَطَرٍ مِنْ دُوَلِ الخَليجِ العَرَبِيَّةِ” .","t":"(١) وِلايَةُ شُؤونِ المُسْلِمينَ . (٢) الإقْليمُ أَوِ المَنْطِقَةُ الَّتي يَحْكُمُها الأَميرُ","o":["تَوَلَّى عَمْرُو بْنُ العاصِ إمارَةَ مِصْرَ","إمارَةُ الكُوَيْتِ ، وَإمارَةُ قَطَرٍ مِنْ دُوَلِ الخَليجِ العَرَبِيَّةِ"],"b":["تَوَلَّى عَمْرُو بْنُ العاصِ إمارَةَ مِصْرَ","إمارَةَ"],"tr":"emirlik, valilik","ttr":"(1) Müslümanların işlerini yönetme (valilik). (2) Emirin yönettiği bölge veya arazi.","otr":["Amr b. el-Âs Mısır valiliğini üstlendi.","Kuveyt Emirliği ve Katar Emirliği Arap Körfez ülkelerindendir."],"r":null,"s":29},

{"k":"أَمان","c":"","m":"مَصْدَرُ أَمِنَ : اطْمَأَنَّ وَلَمْ يَخَفْ ، “يَعيشُ النّاسُ تَحْتَ حِمَى الشَّريعَةِ في أَمْنٍ وَأَمانٍ” ، ﴿أَوَأَمِنَ أَهْلُ الْقُرَى أَنْ يَأْتِيَهُمْ بَأْسُنَا ضُحًى وَهُمْ يَلْعَبُونَ﴾ . في أَمانِ اللهِ : في حِفْظِ اللهِ .","t":"مَصْدَرُ أَمِنَ : اطْمَأَنَّ وَلَمْ يَخَفْ . في أَمانِ اللهِ : في حِفْظِ اللهِ","o":["يَعيشُ النّاسُ تَحْتَ حِمَى الشَّريعَةِ في أَمْنٍ وَأَمانٍ","﴿أَوَأَمِنَ أَهْلُ الْقُرَى أَنْ يَأْتِيَهُمْ بَأْسُنَا ضُحًى وَهُمْ يَلْعَبُونَ﴾"],"b":["يَعيشُ النّاسُ تَحْتَ حِمَى الشَّريعَةِ في أَمْنٍ وَأَمانٍ","وَأَمانٍ"],"tr":"güven, emniyet","ttr":"Emin olmak fiilinin mastarı: içi rahat olmak ve korkmamak. Allah'ın emanında: Allah'ın korumasında.","otr":["İnsanlar şeriatın himayesi altında güven ve emniyet içinde yaşar.","Yoksa ülkelerin halkı, kuşluk vakti oyun oynarlarken azabımızın kendilerine gelmeyeceğinden emin mi oldular?"],"r":null,"s":29},
{"k":"أَمانَة","c":"","m":"خِلافُ الخِيانَةِ ؛ (١) الوَفاءُ ، “يُؤَدِّي الجُنْدِيُّ عَمَلَهُ بِأَمانَةٍ” . (٢) الوَديعَةُ ، ﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَنْ تُؤَدُّوا الْأَمَانَاتِ إِلَى أَهْلِهَا﴾ . (٣) المَسْؤولِيَّةُ ، ﴿إِنَّا عَرَضْنَا الْأَمَانَةَ عَلَى السَّمَاوَاتِ وَالْأَرْضِ وَالْجِبَالِ﴾ .","t":"خِلافُ الخِيانَةِ ؛ (١) الوَفاءُ . (٢) الوَديعَةُ . (٣) المَسْؤولِيَّةُ","o":["يُؤَدِّي الجُنْدِيُّ عَمَلَهُ بِأَمانَةٍ","﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَنْ تُؤَدُّوا الْأَمَانَاتِ إِلَى أَهْلِهَا﴾","﴿إِنَّا عَرَضْنَا الْأَمَانَةَ عَلَى السَّمَاوَاتِ وَالْأَرْضِ وَالْجِبَالِ﴾"],"b":["يُؤَدِّي الجُنْدِيُّ عَمَلَهُ بِأَمانَةٍ","بِأَمانَةٍ"],"tr":"emanet; dürüstlük","ttr":"Hıyanetin zıddı; (1) vefa, sadakat. (2) Emanet bırakılan şey. (3) Sorumluluk.","otr":["Asker işini dürüstlükle yapar.","Allah size emanetleri ehline vermenizi emrediyor.","Biz emaneti göklere, yere ve dağlara sunduk."],"r":null,"s":29},

{"k":"أَمَرَ","c":"","m":"يَأْمُرُ أَمْراً : طَلَبَ ؛ خِلافُ نَهَى ، “أَمَرَ الأَبُ ابْنَهُ بِالصَّلاةِ” ، ﴿يَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ الْمُنْكَرِ﴾ .","t":"طَلَبَ ؛ خِلافُ نَهَى","o":["أَمَرَ الأَبُ ابْنَهُ بِالصَّلاةِ","﴿يَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ الْمُنْكَرِ﴾"],"b":["أَمَرَ الأَبُ ابْنَهُ بِالصَّلاةِ","أَمَرَ"],"tr":"emretmek","ttr":"İstedi, buyurdu; yasaklamanın zıddı.","otr":["Baba oğluna namazı emretti.","İyiliği emreder, kötülükten alıkoyarlar."],"r":null,"s":30,"f":"يَأْمُرُ أَمْراً"},
{"k":"أَمْسِ","c":"","m":"(١) اليَوْمُ الَّذي قَبْلَ اليَوْمِ الحالي ، “اليَوْمُ الجُمُعَةُ ، وَغَداً السَّبْتُ ، وَأَمْسِ كانَ الخَميسَ” . (٢) الماضي ، “كَأَنَّكَ لَمْ تَكُنْ صَديقي بِالأَمْسِ” ، ﴿فَجَعَلْنَاهَا حَصِيدًا كَأَنْ لَمْ تَغْنَ بِالْأَمْسِ﴾ .","t":"(١) اليَوْمُ الَّذي قَبْلَ اليَوْمِ الحالي . (٢) الماضي","o":["اليَوْمُ الجُمُعَةُ ، وَغَداً السَّبْتُ ، وَأَمْسِ كانَ الخَميسَ","كَأَنَّكَ لَمْ تَكُنْ صَديقي بِالأَمْسِ","﴿فَجَعَلْنَاهَا حَصِيدًا كَأَنْ لَمْ تَغْنَ بِالْأَمْسِ﴾"],"b":["كَأَنَّكَ لَمْ تَكُنْ صَديقي بِالأَمْسِ","بِالأَمْسِ"],"tr":"dün","ttr":"(1) Bugünden önceki gün. (2) Geçmiş.","otr":["Bugün cuma, yarın cumartesi, dün de perşembeydi.","Sanki dün benim arkadaşım değilmişsin gibi.","Onu, sanki dün hiç yokmuş gibi biçilmiş bir hale getirdik."],"r":null,"s":30},
{"k":"أَمْسَكَ","c":"","m":"يُمْسِكُ إمْساكاً : (١) أَخَذَ وَقَبَضَ وَتَعَلَّقَ بِالشَّيْءِ ، “أَمْسَكَ الغَريقُ بِالخَشَبَةِ” ، “أَمْسَكْتُ بِيَدِ الأَعْمَى حَتَّى أَوْصَلْتُهُ إلى بَيْتِهِ” . (٢) تَوَقَّفَ وَتَرَكَ وَامْتَنَعَ ، “أَمْسَكَ الصّائِمُ عَنِ الطَّعامِ وَالشَّرابِ” ، وَفي الحَديثِ : (إذا ذُكِرَ أَصْحابي فَأَمْسِكوا) .","t":"(١) أَخَذَ وَقَبَضَ وَتَعَلَّقَ بِالشَّيْءِ . (٢) تَوَقَّفَ وَتَرَكَ وَامْتَنَعَ","o":["أَمْسَكَ الغَريقُ بِالخَشَبَةِ","أَمْسَكْتُ بِيَدِ الأَعْمَى حَتَّى أَوْصَلْتُهُ إلى بَيْتِهِ","أَمْسَكَ الصّائِمُ عَنِ الطَّعامِ وَالشَّرابِ","(إذا ذُكِرَ أَصْحابي فَأَمْسِكوا)"],"b":["أَمْسَكْتُ بِيَدِ الأَعْمَى حَتَّى أَوْصَلْتُهُ إلى بَيْتِهِ","أَمْسَكْتُ"],"tr":"tutmak; kendini tutmak","ttr":"(1) Aldı, kavradı ve bir şeye tutundu. (2) Durdu, bıraktı ve kendini tuttu.","otr":["Boğulmakta olan adam tahtaya tutundu.","Âmânın elinden tuttum, onu evine ulaştırana kadar.","Oruçlu yemekten ve içmekten imsak etti.","Hadiste: Ashabım anıldığında (kötü söz söylemekten) dilinizi tutun."],"r":"p30_1","s":30,"y":[["مصدر","إمْساك"]],"f":"يُمْسِكُ إمْساكاً"},
{"k":"أَمْسَى","c":"","m":"يُمْسي إمْساءً : (١) صارَ في وَقْتِ المَساءِ ؛ خِلافُ أَصْبَحَ ، ﴿فَسُبْحَانَ اللَّهِ حِينَ تُمْسُونَ وَحِينَ تُصْبِحُونَ﴾ . (٢) فِعْلٌ ماضٍ ناقِصٌ مِنْ أَخَواتِ كانَ ، يَرْفَعُ الاسْمَ وَيَنْصِبُ الخَبَرَ ، “أَمْسَى المَريضُ ساهِراً” .","t":"(١) صارَ في وَقْتِ المَساءِ ؛ خِلافُ أَصْبَحَ . (٢) فِعْلٌ ماضٍ ناقِصٌ مِنْ أَخَواتِ كانَ ، يَرْفَعُ الاسْمَ وَيَنْصِبُ الخَبَرَ","o":["﴿فَسُبْحَانَ اللَّهِ حِينَ تُمْسُونَ وَحِينَ تُصْبِحُونَ﴾","أَمْسَى المَريضُ ساهِراً"],"b":["أَمْسَى المَريضُ ساهِراً","أَمْسَى"],"tr":"akşamlamak","ttr":"(1) Akşam vaktine girdi; sabahlamanın zıddı. (2) Kâne'nin kardeşlerinden nâkıs mazi fiil; ismini merfu, haberini mansup yapar.","otr":["Akşama girdiğinizde ve sabaha erdiğinizde Allah'ı tesbih edin.","Hasta akşamı uykusuz geçirdi."],"r":null,"s":30,"f":"يُمْسي إمْساءً"},
{"k":"أَمْضَى","c":"","m":"يُمْضي إمْضاءً : (١) أَنْفَذَ ، أَجْرَى . “أَمْضَى رِجالُ الأَمْنِ أَمْرَ القاضي” . (٢) قَضَى . “أَمْضَيْتُ أُسْبوعاً في المَدينَةِ” . (٣) الإمْضاءُ : التَّوْقيعُ ، “لِكُلِّ إنْسانٍ إمْضاءٌ خاصٌّ بِهِ” .","t":"(١) أَنْفَذَ ، أَجْرَى . (٢) قَضَى . (٣) الإمْضاءُ : التَّوْقيعُ","o":["أَمْضَى رِجالُ الأَمْنِ أَمْرَ القاضي","أَمْضَيْتُ أُسْبوعاً في المَدينَةِ","لِكُلِّ إنْسانٍ إمْضاءٌ خاصٌّ بِهِ"],"b":["أَمْضَيْتُ أُسْبوعاً في المَدينَةِ","أَمْضَيْتُ"],"tr":"geçirmek; yürütmek","ttr":"(1) Uyguladı, yürüttü. (2) (Vakit) geçirdi. (3) İmza.","otr":["Güvenlik görevlileri hâkimin emrini uyguladı.","Şehirde bir hafta geçirdim.","Her insanın kendine özgü bir imzası vardır."],"r":null,"s":30,"y":[["مصدر","إمْضاء"]],"f":"يُمْضي إمْضاءً"},
{"k":"أَمْطَرَ","c":"","m":"يُمْطِرُ إمْطاراً وَمَطَراً : أَنْزَلَ المَطَرَ ، ﴿وَأَمْطَرْنَا عَلَيْهِمْ مَطَرًا فَسَاءَ مَطَرُ الْمُنْذَرِينَ﴾ .","t":"أَنْزَلَ المَطَرَ","o":["﴿وَأَمْطَرْنَا عَلَيْهِمْ مَطَرًا فَسَاءَ مَطَرُ الْمُنْذَرِينَ﴾"],"b":["﴿وَأَمْطَرْنَا عَلَيْهِمْ مَطَرًا فَسَاءَ مَطَرُ الْمُنْذَرِينَ﴾","وَأَمْطَرْنَا"],"tr":"yağmur yağdırmak","ttr":"Yağmur indirdi.","otr":["Üzerlerine bir yağmur yağdırdık; uyarılanların yağmuru ne kötüdür!"],"r":"p30_2","s":30},
{"k":"أَمْعاء","c":"","m":"جَمْعُ مِعًى : وَهُوَ المُصْران ، “هُناكَ أَمْراضٌ تُصيبُ الأَمْعاءَ الدَّقيقَةَ وَالأَمْعاءَ الغَليظَةَ في الإنْسانِ” ، وَفي الحَديثِ : (المُؤْمِنُ يَأْكُلُ في مِعًى واحِدٍ وَالكافِرُ يَأْكُلُ في سَبْعَةِ أَمْعاءٍ) .","t":"جَمْعُ مِعًى : وَهُوَ المُصْران","o":["هُناكَ أَمْراضٌ تُصيبُ الأَمْعاءَ الدَّقيقَةَ وَالأَمْعاءَ الغَليظَةَ في الإنْسانِ","(المُؤْمِنُ يَأْكُلُ في مِعًى واحِدٍ وَالكافِرُ يَأْكُلُ في سَبْعَةِ أَمْعاءٍ)"],"b":["هُناكَ أَمْراضٌ تُصيبُ الأَمْعاءَ الدَّقيقَةَ وَالأَمْعاءَ الغَليظَةَ في الإنْسانِ","الأَمْعاءَ"],"tr":"bağırsaklar","ttr":"Mi'an (bağırsak) kelimesinin çoğulu.","otr":["İnsanda ince bağırsaklara ve kalın bağırsaklara isabet eden hastalıklar vardır.","Hadiste: Mümin bir bağırsakla yer, kâfir ise yedi bağırsakla yer."],"r":"p30_3","s":30},
{"k":"أَمْعَنَ","c":"","m":"يُمْعِنُ إمْعاناً : بالَغَ وَجَدَّ ، “أَمْعَنَ الباحِثُ في دِراسَةِ المَوْضوعِ” .","t":"بالَغَ وَجَدَّ","o":["أَمْعَنَ الباحِثُ في دِراسَةِ المَوْضوعِ"],"b":["أَمْعَنَ الباحِثُ في دِراسَةِ المَوْضوعِ","أَمْعَنَ"],"tr":"derinlemesine incelemek","ttr":"İleri gitti ve ciddiyetle çalıştı.","otr":["Araştırmacı konuyu incelemekte derine indi."],"r":null,"s":30,"f":"يُمْعِنُ إمْعاناً"},
{"k":"إمْكانِيَّة","c":"إمْكانِيّات","m":"(ج) إمْكانِيّات : الاسْتِطاعَةُ وَالقُدْرَةُ وَالوُسْعُ ، “إمْكانِيّاتُ مُؤَسَّسَتِنا مَحْدودَةٌ ، فَلا نَسْتَطيعُ أَنْ نُسْهِمَ في كُلِّ مَشْروعٍ” .","t":"الاسْتِطاعَةُ وَالقُدْرَةُ وَالوُسْعُ","o":["إمْكانِيّاتُ مُؤَسَّسَتِنا مَحْدودَةٌ ، فَلا نَسْتَطيعُ أَنْ نُسْهِمَ في كُلِّ مَشْروعٍ"],"b":["إمْكانِيّاتُ مُؤَسَّسَتِنا مَحْدودَةٌ","إمْكانِيّاتُ"],"tr":"imkân, olanak","ttr":"Güç yetirme, kudret ve takat.","otr":["Kurumumuzun imkânları sınırlı, bu yüzden her projeye katkıda bulunamıyoruz."],"r":null,"s":30},
{"k":"أَمْكَنَ","c":"","m":"يُمْكِنُ إمْكاناً : (١) سَهُلَ وَتَيَسَّرَ ، “أَمْكَنَ الوُصولُ إلى السَّفينَةِ الغارِقَةِ” ، “لا يُمْكِنُ أَنْ يَقومَ بِهذا العَمَلِ شَخْصٌ واحِدٌ” . (٢) أَقْدَرَهُ عَلَيْهِ ، ﴿وَإِنْ يُرِيدُوا خِيَانَتَكَ فَقَدْ خَانُوا اللَّهَ مِنْ قَبْلُ فَأَمْكَنَ مِنْهُمْ﴾ .","t":"(١) سَهُلَ وَتَيَسَّرَ . (٢) أَقْدَرَهُ عَلَيْهِ","o":["أَمْكَنَ الوُصولُ إلى السَّفينَةِ الغارِقَةِ","لا يُمْكِنُ أَنْ يَقومَ بِهذا العَمَلِ شَخْصٌ واحِدٌ","﴿وَإِنْ يُرِيدُوا خِيَانَتَكَ فَقَدْ خَانُوا اللَّهَ مِنْ قَبْلُ فَأَمْكَنَ مِنْهُمْ﴾"],"b":["لا يُمْكِنُ أَنْ يَقومَ بِهذا العَمَلِ شَخْصٌ واحِدٌ","يُمْكِنُ"],"tr":"mümkün olmak","ttr":"(1) Kolaylaştı, mümkün oldu. (2) Ona güç verdi, imkân tanıdı.","otr":["Batık gemiye ulaşmak mümkün oldu.","Bu işi tek bir kişinin yapması mümkün değil.","Eğer sana hıyanet etmek isterlerse, daha önce Allah'a da hıyanet etmişlerdi; O da onlara karşı (sana) imkân verdi."],"r":null,"s":30,"y":[["مصدر","إمْكان"]],"f":"يُمْكِنُ إمْكاناً"},
{"k":"أَمَل","c":"آمال","m":"(ج) آمال : رَجاءٌ وَتَوَقُّعُ حُصولِ الشَّيْءِ ؛ خِلافُ يَأْس ، “لَدَيَّ أَمَلٌ أَنْ يَنْجَحَ ابْني في الامْتِحانِ” ، ﴿ذَرْهُمْ يَأْكُلُوا وَيَتَمَتَّعُوا وَيُلْهِهِمُ الْأَمَلُ فَسَوْفَ يَعْلَمُونَ﴾ .","t":"رَجاءٌ وَتَوَقُّعُ حُصولِ الشَّيْءِ ؛ خِلافُ يَأْس","o":["لَدَيَّ أَمَلٌ أَنْ يَنْجَحَ ابْني في الامْتِحانِ","﴿ذَرْهُمْ يَأْكُلُوا وَيَتَمَتَّعُوا وَيُلْهِهِمُ الْأَمَلُ فَسَوْفَ يَعْلَمُونَ﴾"],"b":["لَدَيَّ أَمَلٌ أَنْ يَنْجَحَ ابْني في الامْتِحانِ","أَمَلٌ"],"tr":"umut","ttr":"Bir şeyin gerçekleşmesini ummak ve beklemek; ümitsizliğin zıddı.","otr":["Oğlumun sınavı geçeceğine dair umudum var.","Bırak onları yesinler, zevk etsinler, boş emel onları oyalasın; yakında bilecekler."],"r":null,"s":31},
{"k":"أَمْلَس","c":"مُلْس","m":"(ج) مُلْس : ناعِمٌ ، خِلافُ خَشِنٍ ، “هذا ثَوْبٌ أَمْلَسُ” .","t":"ناعِمٌ ، خِلافُ خَشِنٍ","o":["هذا ثَوْبٌ أَمْلَسُ"],"b":["هذا ثَوْبٌ أَمْلَسُ","أَمْلَسُ"],"tr":"pürüzsüz, kaygan","ttr":"Yumuşak; pürüzlünün zıddı.","otr":["Bu, pürüzsüz bir kumaş/elbisedir."],"r":"p31_1","s":31},

{"k":"آمَنَ","c":"","m":"يُؤْمِنُ إيماناً : اعْتَقَدَ وَصَدَّقَ ؛ “آمَنَ عَلِيُّ بْنُ أَبي طالِبٍ ، وَهُوَ صَبِيٌّ صَغيرٌ” ، ﴿آمَنَ الرَّسُولُ بِمَا أُنْزِلَ إِلَيْهِ مِنْ رَبِّهِ﴾ ، ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا آمِنُوا بِاللَّهِ﴾ .","t":"اعْتَقَدَ وَصَدَّقَ","o":["آمَنَ عَلِيُّ بْنُ أَبي طالِبٍ ، وَهُوَ صَبِيٌّ صَغيرٌ","﴿آمَنَ الرَّسُولُ بِمَا أُنْزِلَ إِلَيْهِ مِنْ رَبِّهِ﴾","﴿يَا أَيُّهَا الَّذِينَ آمَنُوا آمِنُوا بِاللَّهِ﴾"],"b":["آمَنَ عَلِيُّ بْنُ أَبي طالِبٍ ، وَهُوَ صَبِيٌّ صَغيرٌ","آمَنَ"],"tr":"iman etmek, inanmak","ttr":"İnandı ve tasdik etti.","otr":["Ali b. Ebî Tâlib küçük bir çocukken iman etti.","Peygamber, Rabbinden kendisine indirilene iman etti.","Ey iman edenler! Allah'a iman edin."],"r":null,"s":31,"f":"يُؤْمِنُ إيماناً"},

{"k":"أَنَّ / إِنَّ","c":"","m":"حَرْفُ تَوْكيدٍ وَنَصْبٍ ، تَدْخُلُ عَلَى الجُمْلَةِ الاسْمِيَّةِ ، فَيَصيرُ المُبْتَدَأُ اسْمَها مَنْصوباً ، وَالخَبَرُ خَبَرَها مَرْفوعاً ، وَتُكْسَرُ هَمْزَتُها في مَواضِعَ ، مِثْلَ : بِدايَةِ الجُمْلَةِ ، وَبَعْدَ أَلا الاسْتِفْتاحِيَّةِ ، ﴿إِنَّ اللَّهَ مَعَ الَّذِينَ اتَّقَوْا﴾ ، ﴿أَلَا إِنَّهُمْ هُمُ الْمُفْسِدُونَ﴾ .","t":"حَرْفُ تَوْكيدٍ وَنَصْبٍ ، تَدْخُلُ عَلَى الجُمْلَةِ الاسْمِيَّةِ ، فَيَصيرُ المُبْتَدَأُ اسْمَها مَنْصوباً ، وَالخَبَرُ خَبَرَها مَرْفوعاً ، وَتُكْسَرُ هَمْزَتُها في مَواضِعَ ، مِثْلَ : بِدايَةِ الجُمْلَةِ ، وَبَعْدَ أَلا الاسْتِفْتاحِيَّةِ","o":["﴿إِنَّ اللَّهَ مَعَ الَّذِينَ اتَّقَوْا﴾","﴿أَلَا إِنَّهُمْ هُمُ الْمُفْسِدُونَ﴾"],"b":["﴿إِنَّ اللَّهَ مَعَ الَّذِينَ اتَّقَوْا﴾","إِنَّ"],"tr":"şüphesiz, -dığı (te'kid edatı)","ttr":"Te'kid ve nasb harfi; isim cümlesinin başına gelir, mübteda onun mansup ismi, haber de onun merfu haberi olur. Cümle başında ve istiftah edatı 'elâ'dan sonra gibi yerlerde hemzesi kesreli okunur.","otr":["Şüphesiz Allah takva sahipleriyle beraberdir.","Dikkat edin! Asıl bozguncular onlardır."],"r":null,"s":31},
{"k":"إِنْ","c":"","m":"( ١ ) أَداةُ شَرْطٍ ؛ تَجْزِمُ فِعْلَيْنِ ، “إِنْ تَحْضُرْ مُبَكِّراً تأخُذْ ما تُريدُ” . ( ٢ ) نافِيَة ، ﴿ إِنْ أَنْتُمْ إِلاّ في ضَلالٍ مُبينٍ ﴾ . ( ٣ ) زائِدَة ، “ما إِنْ فَعلتُ شَيْئاً خَطيراً” .","t":"( ١ ) أَداةُ شَرْطٍ ؛ تَجْزِمُ فِعْلَيْنِ ( ٢ ) نافِيَة ( ٣ ) زائِدَة","o":["إِنْ تَحْضُرْ مُبَكِّراً تأخُذْ ما تُريدُ","﴿ إِنْ أَنْتُمْ إِلاّ في ضَلالٍ مُبينٍ ﴾","ما إِنْ فَعلتُ شَيْئاً خَطيراً"],"b":["إِنْ تَحْضُرْ مُبَكِّراً تأخُذْ ما تُريدُ","إِنْ"],"tr":"eğer; değil (nefy)","ttr":"(1) İki fiili cezmeden şart edatı. (2) Olumsuzluk edatı. (3) Zâid (fazladan gelen) edat.","otr":["Erken gelirsen istediğini alırsın.","Siz ancak apaçık bir sapıklık içindesiniz.","Tehlikeli hiçbir şey yapmadım."],"r":null,"s":32},
{"k":"آنَئِذٍ","c":"","m":"في ذلكَ الوَقْتِ ، “عِنْدَما نَشِبَتِ الحَرْبُ كانَ عُمْري آنَئِذ خَمْسَةَ عَشَرَ عاماً” .","t":"في ذلكَ الوَقْتِ","o":["عِنْدَما نَشِبَتِ الحَرْبُ كانَ عُمْري آنَئِذ خَمْسَةَ عَشَرَ عاماً"],"b":["عِنْدَما نَشِبَتِ الحَرْبُ كانَ عُمْري آنَئِذ خَمْسَةَ عَشَرَ عاماً","آنَئِذ"],"tr":"o zaman, o sırada","ttr":"O vakit.","otr":["Savaş patlak verdiğinde o sırada on beş yaşındaydım."],"r":null,"s":32},
{"k":"أَنا","c":"","m":"ضَميرُ رَفْعٍ مُنْفَصِلٍ لِلمُتَكَلِّمِ مُذَكَّرٍ أَو مُؤَنَّثٍ ، قالَ الرَّسولُ ﷺ : (أنا سَيِّدُ وَلَدِ آدمَ ولا فَخْرَ) .","t":"ضَميرُ رَفْعٍ مُنْفَصِلٍ لِلمُتَكَلِّمِ مُذَكَّرٍ أَو مُؤَنَّثٍ","o":["أنا سَيِّدُ وَلَدِ آدمَ ولا فَخْرَ"],"b":["أنا سَيِّدُ وَلَدِ آدمَ ولا فَخْرَ","أنا"],"tr":"ben","ttr":"Eril veya dişil birinci tekil şahıs için ayrık merfû zamir.","otr":["Resûlullah (s.a.v.) buyurdu: Ben Âdemoğlunun efendisiyim, (bununla) övünmek yok."],"r":null,"s":32},
{"k":"إِناء","c":"أَوانٍ (الأَواني)","m":"(ج) أَوانٍ (الأَواني) : وِعاءٌ لِلطَّعامِ والشَّرابِ ، مِثْلِ الصُّحونِ والأَطْباقِ ، “اشْتَرينا أَوانيَ لِلمَطْبَخِ ؛ كَالمَلاعِقِ وَالأَطْباقِ ، وَالسَّكاكينِ وَغَيْرِها” ..","t":"وِعاءٌ لِلطَّعامِ والشَّرابِ ، مِثْلِ الصُّحونِ والأَطْباقِ","o":["اشْتَرينا أَوانيَ لِلمَطْبَخِ ؛ كَالمَلاعِقِ وَالأَطْباقِ ، وَالسَّكاكينِ وَغَيْرِها"],"b":["اشْتَرينا أَوانيَ لِلمَطْبَخِ ؛ كَالمَلاعِقِ وَالأَطْباقِ ، وَالسَّكاكينِ وَغَيْرِها","أَوانيَ"],"tr":"kap","ttr":"Tabaklar ve sahanlar gibi yiyecek ve içecek kabı.","otr":["Mutfak için kaşık, tabak, bıçak gibi kap kacak satın aldık."],"r":"p32_1","s":32,"y":[["جمع","أَوانٍ"]]},
{"k":"أَنابَ","c":"","m":"يُنيبُ إِنابَةً : رَجَعَ أَو تابَ ، “أَنابَ العَبْدُ إِلى رَبِّه” ، ﴿ وَأَنيبوا إِلى رَبِّكُمْ وَأَسْلِموا لَه ﴾ .","t":"رَجَعَ أَو تابَ","o":["أَنابَ العَبْدُ إِلى رَبِّه","﴿ وَأَنيبوا إِلى رَبِّكُمْ وَأَسْلِموا لَه ﴾"],"b":["أَنابَ العَبْدُ إِلى رَبِّه","أَنابَ"],"tr":"(Allah'a) yönelmek, tövbe etmek","ttr":"Dönmek veya tövbe etmek.","otr":["Kul Rabbine yöneldi (tövbe etti).","Rabbinize yönelin ve O'na teslim olun."],"r":null,"s":32,"f":"يُنيبُ إِنابَةً"},

{"k":"أُناسٌ","c":"","m":"بَشَرٌ ، وَيُخَفَّفُ بِحَذْفِ الهَمْزَةِ هكَذا “ناس” . ﴿ يَوْمَ نَدْعُو كُلَّ أُناسٍ بِإِمامِهِمْ ﴾ ، ﴿ قُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴾ .","t":"بَشَرٌ ، وَيُخَفَّفُ بِحَذْفِ الهَمْزَةِ هكَذا “ناس”","o":["﴿ يَوْمَ نَدْعُو كُلَّ أُناسٍ بِإِمامِهِمْ ﴾","﴿ قُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴾"],"b":["يَوْمَ نَدْعُو كُلَّ أُناسٍ بِإِمامِهِمْ","أُناسٍ"],"tr":"insanlar","ttr":"İnsanlar; hemzesi düşürülerek “nâs” şeklinde de hafifletilir.","otr":["Her insan topluluğunu önderleriyle çağıracağımız gün...","De ki: İnsanların Rabbine sığınırım."],"r":null,"s":32},

{"k":"أَنْبَأَ","c":"","m":"يُنْبِئُ إِنْباءً : أَخْبَرَ ، أَعْلَمَ ، “أَنْبَأَتِ الشَّرِكَةُ العُمّالَ بِزِيادَةِ الرَّواتِبِ” ، ﴿ قالَتْ مَنْ أَنْبَأَكَ هَذا قالَ نَبَّأَنِيَ الْعَليمُ الْخَبيرُ ﴾ .","t":"أَخْبَرَ ، أَعْلَمَ","o":["أَنْبَأَتِ الشَّرِكَةُ العُمّالَ بِزِيادَةِ الرَّواتِبِ","﴿ قالَتْ مَنْ أَنْبَأَكَ هَذا قالَ نَبَّأَنِيَ الْعَليمُ الْخَبيرُ ﴾"],"b":["أَنْبَأَتِ الشَّرِكَةُ العُمّالَ بِزِيادَةِ الرَّواتِبِ","أَنْبَأَتِ"],"tr":"haber vermek","ttr":"Haber vermek, bildirmek.","otr":["Şirket işçilere maaş artışını bildirdi.","(Kadın) “Bunu sana kim haber verdi?” dedi. “Her şeyi bilen, her şeyden haberdar olan haber verdi” dedi."],"r":null,"s":32,"f":"يُنْبِئُ إِنْباءً"},
{"k":"أَنْبَتَ","c":"","m":"يُنْبِتُ إِنْباتاً : أَخْرَجَ النَّباتَ ، ﴿ يُنْبِتُ لَكُمْ بِهِ الزَّرْعَ وَالزَّيْتُونَ وَالنَّخيلَ وَالأَعْنابَ ﴾ .","t":"أَخْرَجَ النَّباتَ","o":["﴿ يُنْبِتُ لَكُمْ بِهِ الزَّرْعَ وَالزَّيْتُونَ وَالنَّخيلَ وَالأَعْنابَ ﴾"],"b":["يُنْبِتُ لَكُمْ بِهِ الزَّرْعَ وَالزَّيْتُونَ وَالنَّخيلَ وَالأَعْنابَ","يُنْبِتُ"],"tr":"bitirmek, yetiştirmek","ttr":"Bitki çıkarmak, yetiştirmek.","otr":["Onunla sizin için ekin, zeytin, hurma ve üzüm yetiştirir."],"r":null,"s":32,"f":"يُنْبِتُ إِنْباتاً"},
{"k":"أَنْتِ","c":"أَنْتُنَّ","m":"ضَميرُ رَفْعٍ مُنْفَصِلٌ لِلمُخاطَبَةِ ، أَنْتِ(مؤ) ، (ج) أَنْتُنَّ ، وَالمُثَنّى أَنْتُما ، “يا فاطِمَةُ أَنتِ الَّتي فُزْتِ بِجائِزَةِ حِفْظِ القُرْآنِ الكَريمِ وَتِلاوَتِه” .","t":"ضَميرُ رَفْعٍ مُنْفَصِلٌ لِلمُخاطَبَةِ ، وَالمُثَنّى أَنْتُما","o":["يا فاطِمَةُ أَنتِ الَّتي فُزْتِ بِجائِزَةِ حِفْظِ القُرْآنِ الكَريمِ وَتِلاوَتِه"],"b":["يا فاطِمَةُ أَنتِ الَّتي فُزْتِ بِجائِزَةِ حِفْظِ القُرْآنِ الكَريمِ وَتِلاوَتِه","أَنتِ"],"tr":"sen (dişil)","ttr":"İkinci tekil şahıs dişil için ayrık merfû zamir; ikili: entumâ, çoğul: entunne.","otr":["Ey Fatıma, Kur'ân-ı Kerîm'i ezberleme ve okuma ödülünü kazanan sensin."],"r":null,"s":32},
{"k":"أَنْتَ","c":"أَنْتُم","m":"ضَميرُ رَفْعٍ مُنْفَصِلٌ لِلمُخاطَبِ(مذ) ، أَنتَ (ج) أَنْتُم ، وَالمُثَنّى أَنْتُما ، “أَنْتَ رَجُلٌ كَريمٌ” ، ﴿ أَأَنْتَ قُلْتَ لِلنَّاسِ اتَّخِذُوني وَأُمِّيَ إِلَهَيْنِ مِنْ دُونِ اللَّه ﴾ .","t":"ضَميرُ رَفْعٍ مُنْفَصِلٌ لِلمُخاطَبِ ، وَالمُثَنّى أَنْتُما","o":["أَنْتَ رَجُلٌ كَريمٌ","﴿ أَأَنْتَ قُلْتَ لِلنَّاسِ اتَّخِذُوني وَأُمِّيَ إِلَهَيْنِ مِنْ دُونِ اللَّه ﴾"],"b":["أَنْتَ رَجُلٌ كَريمٌ","أَنْتَ"],"tr":"sen (eril)","ttr":"İkinci tekil şahıs eril için ayrık merfû zamir; ikili: entumâ, çoğul: entum.","otr":["Sen cömert bir adamsın.","İnsanlara “Beni ve annemi Allah'tan başka iki ilah edinin” diyen sen misin?"],"r":null,"s":32},
{"k":"أَنْتَجَ","c":"","m":"يُنْتِجُ إِنْتاجاً : ( ١ ) وَلَدَتْ وَظَهَرَ نِتاجُها ، “أَنْتَجَتِ الشّاةُ ذُكوراً وَإِناثاً” . ( ٢ ) أَثْمَرَ ، “أَنْتَجَتِ النَّخْلَةُ كَثيراً مِنَ التَّمرِ” . ( ٣ ) صَنَّعَ ، “يُنتِجُ المَصْنَعُ الصابونَ وَالعُطورَ” ، “زادَ إِنْتاجُ البِلادِ الصِّناعيّ” .","t":"( ١ ) وَلَدَتْ وَظَهَرَ نِتاجُها ( ٢ ) أَثْمَرَ ( ٣ ) صَنَّعَ","o":["أَنْتَجَتِ الشّاةُ ذُكوراً وَإِناثاً","أَنْتَجَتِ النَّخْلَةُ كَثيراً مِنَ التَّمرِ","يُنتِجُ المَصْنَعُ الصابونَ وَالعُطورَ","زادَ إِنْتاجُ البِلادِ الصِّناعيّ"],"b":["يُنتِجُ المَصْنَعُ الصابونَ وَالعُطورَ","يُنتِجُ"],"tr":"üretmek","ttr":"(1) (Hayvan) doğurmak, yavrusu ortaya çıkmak. (2) Meyve vermek. (3) İmal etmek, üretmek.","otr":["Koyun erkek ve dişi yavrular doğurdu.","Hurma ağacı çok hurma verdi.","Fabrika sabun ve parfüm üretir.","Ülkenin sanayi üretimi arttı."],"r":null,"s":32,"y":[["مصدر","إِنْتاج"]],"f":"يُنْتِجُ إِنْتاجاً"},

{"k":"أَنْجَدَ","c":"","m":"يُنْجِدُ إِنْجاداً : نَصَرَ ، أَعانَ ، “اسْتَغاثَ الغَريقُ ، فَأَنْجَدَهُ سَبّاحٌ ماهِرٌ” ، “أَنْجَدَتْ سَيّارَةُ الإِسْعافِ المَريضَ” .","t":"نَصَرَ ، أَعانَ","o":["اسْتَغاثَ الغَريقُ ، فَأَنْجَدَهُ سَبّاحٌ ماهِرٌ","أَنْجَدَتْ سَيّارَةُ الإِسْعافِ المَريضَ"],"b":["اسْتَغاثَ الغَريقُ ، فَأَنْجَدَهُ سَبّاحٌ ماهِرٌ","فَأَنْجَدَهُ"],"tr":"yardımına koşmak, kurtarmak","ttr":"Yardım etmek, imdadına yetişmek.","otr":["Boğulmak üzere olan kişi yardım istedi, usta bir yüzücü onun imdadına yetişti.","Ambulans hastanın yardımına yetişti."],"r":"p32_3","s":32,"f":"يُنْجِدُ إِنْجاداً"},
{"k":"أَنْجَزَ","c":"","m":"يُنْجِزُ إِنْجازاً : أَتَمَّ ، أَكْمَلَ ، “أَنْجَزَ طارِقٌ ما كُلِّفَ بِهِ مِنْ عَمَلٍ” ، “أَنْجَزَ العامِلُ عَمَلَهُ في الوَقْتِ المُحَدَّدِ” .","t":"أَتَمَّ ، أَكْمَلَ","o":["أَنْجَزَ طارِقٌ ما كُلِّفَ بِهِ مِنْ عَمَلٍ","أَنْجَزَ العامِلُ عَمَلَهُ في الوَقْتِ المُحَدَّدِ"],"b":["أَنْجَزَ العامِلُ عَمَلَهُ في الوَقْتِ المُحَدَّدِ","أَنْجَزَ"],"tr":"tamamlamak, bitirmek","ttr":"Tamamlamak, bitirmek.","otr":["Tarık kendisine verilen işi tamamladı.","İşçi işini belirlenen vakitte bitirdi."],"r":null,"s":32,"y":[["مصدر","إِنْجاز"]],"f":"يُنْجِزُ إِنْجازاً"},
{"k":"إِنْجيل","c":"أَناجيل","m":"(ج) أَناجيل : الكِتابُ الَّذي أَنْزَلَهُ اللهُ - عَزَّ وَجَلَّ - عَلى نَبِيِّهِ عيسَى بْنِ مَرْيَمَ عَلَيْهِ السَّلامُ ، ﴿ ثُمَّ قَفَّيْنا عَلى آثارِهِمْ بِرُسُلِنا وَقَفَّيْنا بِعيسَى ابْنِ مَرْيَمَ وَآتَيْناهُ الإِنْجيلَ ﴾ .","t":"الكِتابُ الَّذي أَنْزَلَهُ اللهُ - عَزَّ وَجَلَّ - عَلى نَبِيِّهِ عيسَى بْنِ مَرْيَمَ عَلَيْهِ السَّلامُ","o":["﴿ ثُمَّ قَفَّيْنا عَلى آثارِهِمْ بِرُسُلِنا وَقَفَّيْنا بِعيسَى ابْنِ مَرْيَمَ وَآتَيْناهُ الإِنْجيلَ ﴾"],"b":["ثُمَّ قَفَّيْنا عَلى آثارِهِمْ بِرُسُلِنا وَقَفَّيْنا بِعيسَى ابْنِ مَرْيَمَ وَآتَيْناهُ الإِنْجيلَ","الإِنْجيلَ"],"tr":"İncil","ttr":"Allah'ın (azze ve celle) peygamberi Meryem oğlu İsa'ya (a.s.) indirdiği kitap.","otr":["Sonra onların izleri üzerinde peşlerinden peygamberlerimizi gönderdik; Meryem oğlu İsa'yı da arkalarından gönderdik ve ona İncil'i verdik."],"r":null,"s":32},
{"k":"إِنْذار","c":"","m":"تَهْديد ، تَخْويف ، “جاءَهُ إِنْذارٌ بِالفَصْلِ مِنَ العَمَلِ” .","t":"تَهْديد ، تَخْويف","o":["جاءَهُ إِنْذارٌ بِالفَصْلِ مِنَ العَمَلِ"],"b":["جاءَهُ إِنْذارٌ بِالفَصْلِ مِنَ العَمَلِ","إِنْذارٌ"],"tr":"uyarı, ihtar","ttr":"Tehdit, korkutma.","otr":["İşten çıkarılacağına dair bir ihtar aldı."],"r":null,"s":33},

{"k":"أَنْذَرَ","c":"","m":"يُنْذِرُ إِنْذاراً : حَذَّرَ ، وَأَعْلَمَ بِلَهْجَةٍ فيها تَهْديدٌ وَوَعيدٌ ، في المَثَلِ : “مَنْ أَنْذَرَ فَقَدْ أَعْذَرَ” ، ﴿ وَأَنْذِرِ النَّاسَ يَوْمَ يَأْتيهِمُ العَذابُ ﴾ .","t":"حَذَّرَ ، وَأَعْلَمَ بِلَهْجَةٍ فيها تَهْديدٌ وَوَعيدٌ","o":["مَنْ أَنْذَرَ فَقَدْ أَعْذَرَ","﴿ وَأَنْذِرِ النَّاسَ يَوْمَ يَأْتيهِمُ العَذابُ ﴾"],"b":["مَنْ أَنْذَرَ فَقَدْ أَعْذَرَ","أَنْذَرَ"],"tr":"uyarmak, ihtar etmek","ttr":"Sakındırmak; tehdit içeren bir dille bildirmek.","otr":["Atasözü: Önceden uyaran, mazeretini ortaya koymuş olur.","İnsanları, azabın kendilerine geleceği gün hakkında uyar."],"r":null,"s":33,"f":"يُنْذِرُ إِنْذاراً"},

{"k":"آنَسَ","c":"","m":"يُؤانِسُ مُؤانَسَةً وَإيناساً : ( ١ ) لاطَفَ وَأَزالَ الوَحْشَةَ وَالخَوْفَ مِنَ الشَّخْصِ ، “آنَسْتُ الطِّفْلَ لَمّا أَحْسَسْتُ أَنَّهُ خائِفٌ مِنّي” . ( ٢ ) أَبْصَرَ وَشاهَدَ ، ﴿ فَلَمّا قَضى مُوسَى الأَجَلَ وَسارَ بِأَهْلِهِ آنَسَ مِنْ جانِبِ الطُّورِ ناراً قالَ لِأَهْلِهِ امْكُثُوا إِنّي آنَسْتُ ناراً لَعَلّي آتيكُمْ مِنْها بِخَبَرٍ ﴾ .","t":"( ١ ) لاطَفَ وَأَزالَ الوَحْشَةَ وَالخَوْفَ مِنَ الشَّخْصِ ( ٢ ) أَبْصَرَ وَشاهَدَ","o":["آنَسْتُ الطِّفْلَ لَمّا أَحْسَسْتُ أَنَّهُ خائِفٌ مِنّي","﴿ فَلَمّا قَضى مُوسَى الأَجَلَ وَسارَ بِأَهْلِهِ آنَسَ مِنْ جانِبِ الطُّورِ ناراً قالَ لِأَهْلِهِ امْكُثُوا إِنّي آنَسْتُ ناراً لَعَلّي آتيكُمْ مِنْها بِخَبَرٍ ﴾"],"b":["آنَسْتُ الطِّفْلَ لَمّا أَحْسَسْتُ أَنَّهُ خائِفٌ مِنّي","آنَسْتُ"],"tr":"gönlünü almak; fark etmek","ttr":"(1) Birine yumuşak davranıp yalnızlık ve korkusunu gidermek. (2) Görmek, fark etmek.","otr":["Çocuğun benden korktuğunu hissedince ona yakınlık gösterip korkusunu giderdim.","Musa süreyi doldurup ailesiyle yola çıkınca Tûr tarafında bir ateş gördü ve ailesine: “Bekleyin, ben bir ateş gördüm; belki oradan size bir haber getiririm” dedi."],"r":null,"s":33},

{"k":"أَنْسَى","c":"","m":"يُنْسي إِنْساءً : جَعَلَهُ يَنْسى الشَّيْءَ ، “أَنْسَتْهُ مَسْؤُولِيّاتُهُ الكَثيرَةُ أَوْلادَهُ” ، ﴿ وَما أَنْسانيهُ إِلّا الشَّيْطانُ أَنْ أَذْكُرَهُ ﴾ .","t":"جَعَلَهُ يَنْسى الشَّيْءَ","o":["أَنْسَتْهُ مَسْؤُولِيّاتُهُ الكَثيرَةُ أَوْلادَهُ","﴿ وَما أَنْسانيهُ إِلّا الشَّيْطانُ أَنْ أَذْكُرَهُ ﴾"],"b":["أَنْسَتْهُ مَسْؤُولِيّاتُهُ الكَثيرَةُ أَوْلادَهُ","أَنْسَتْهُ"],"tr":"unutturmak","ttr":"Birine bir şeyi unutturmak.","otr":["Çok sayıdaki sorumlulukları ona çocuklarını unutturdu.","Onu hatırlamamı bana ancak şeytan unutturdu."],"r":null,"s":33,"f":"يُنْسي إِنْساءً"},
{"k":"أَنْشَأَ","c":"","m":"يُنْشِئُ إِنْشاءً : ( ١ ) أَقامَ وَأَوْجَدَ وَأَحْدَثَ ، “أَنْشَأَتِ الدَّوْلَةُ كَثيراً مِنَ المُسْتَشْفَياتِ” . ( ٢ ) أَلَّفَ ، “أَنْشَأَ الكاتِبُ مَقالَةً جَيِّدَةً” . ( ٣ ) خَلَقَ ، ﴿ وَهُوَ الَّذي أَنْشَأَكُمْ مِنْ نَفْسٍ واحِدَةٍ ﴾ . ( ٤ ) الإِنْشاء : التَّعبيرُ الكِتابِيُّ ، “مادَّةُ الإِنْشاءِ مِنْ أَهَمِّ مَوادِّ اللُّغَةِ” .","t":"( ١ ) أَقامَ وَأَوْجَدَ وَأَحْدَثَ ( ٢ ) أَلَّفَ ( ٣ ) خَلَقَ ( ٤ ) الإِنْشاء : التَّعبيرُ الكِتابِيُّ","o":["أَنْشَأَتِ الدَّوْلَةُ كَثيراً مِنَ المُسْتَشْفَياتِ","أَنْشَأَ الكاتِبُ مَقالَةً جَيِّدَةً","﴿ وَهُوَ الَّذي أَنْشَأَكُمْ مِنْ نَفْسٍ واحِدَةٍ ﴾","مادَّةُ الإِنْشاءِ مِنْ أَهَمِّ مَوادِّ اللُّغَةِ"],"b":["أَنْشَأَتِ الدَّوْلَةُ كَثيراً مِنَ المُسْتَشْفَياتِ","أَنْشَأَتِ"],"tr":"kurmak, inşa etmek","ttr":"(1) Kurmak, var etmek, meydana getirmek. (2) (Yazı) kaleme almak. (3) Yaratmak. (4) el-İnşâ: yazılı anlatım, kompozisyon.","otr":["Devlet birçok hastane kurdu.","Yazar güzel bir makale kaleme aldı.","Sizi tek bir nefisten yaratan O'dur.","Kompozisyon dersi, dilin en önemli derslerindendir."],"r":null,"s":33,"y":[["مصدر","إِنْشاء"]],"f":"يُنْشِئُ إِنْشاءً"},
{"k":"أَنْشَدَ","c":"","m":"يُنْشِدُ إِنْشاداً : ( ١ ) غَنَّى شِعْراً ، “عِنْدَما دَخَلَ الرَّسولُ ﷺ المَدينَةَ ، أَنْشَدَ النّاسُ : ‹طَلَعَ البَدْرُ عَلَيْنا›” . ( ٢ ) قَرَأَ الشِّعْرَ بِصَوْتٍ مَسْموعٍ ، “أَنْشَدَ الشّاعِرُ عَدَداً مِنْ قَصائِدِهِ الجَديدَةِ في الحَفْلِ” .","t":"( ١ ) غَنَّى شِعْراً ( ٢ ) قَرَأَ الشِّعْرَ بِصَوْتٍ مَسْموعٍ","o":["عِنْدَما دَخَلَ الرَّسولُ ﷺ المَدينَةَ ، أَنْشَدَ النّاسُ : طَلَعَ البَدْرُ عَلَيْنا","أَنْشَدَ الشّاعِرُ عَدَداً مِنْ قَصائِدِهِ الجَديدَةِ في الحَفْلِ"],"b":["أَنْشَدَ الشّاعِرُ عَدَداً مِنْ قَصائِدِهِ الجَديدَةِ في الحَفْلِ","أَنْشَدَ"],"tr":"şiir okumak, ilahi söylemek","ttr":"(1) Şiiri ezgiyle söylemek. (2) Şiiri yüksek sesle okumak.","otr":["Resûlullah (s.a.v.) Medine'ye girdiğinde insanlar “Tala'al-bedru aleynâ” ilahisini söylediler.","Şair törende yeni kasidelerinden birkaçını okudu."],"r":null,"s":33,"y":[["مصدر","إِنْشاد"]],"f":"يُنْشِدُ إِنْشاداً"},

{"k":"أَنْطَقَ","c":"","m":"يُنْطِقُ إِنْطاقاً : جَعَلَهُ يَنْطِقُ وَيَتَكَلَّمُ ، “لَمْ يُرِدِ اللِّصُّ أَنْ يَتَكَلَّمَ ، لكِنَّ القاضي أَنْطَقَهُ” . ﴿ وَقالُوا لِجُلُودِهِمْ لِمَ شَهِدْتُمْ عَلَيْنا قالُوا أَنْطَقَنا اللَّهُ الَّذي أَنْطَقَ كُلَّ شَيْءٍ ﴾ .","t":"جَعَلَهُ يَنْطِقُ وَيَتَكَلَّمُ","o":["لَمْ يُرِدِ اللِّصُّ أَنْ يَتَكَلَّمَ ، لكِنَّ القاضي أَنْطَقَهُ","﴿ وَقالُوا لِجُلُودِهِمْ لِمَ شَهِدْتُمْ عَلَيْنا قالُوا أَنْطَقَنا اللَّهُ الَّذي أَنْطَقَ كُلَّ شَيْءٍ ﴾"],"b":["لَمْ يُرِدِ اللِّصُّ أَنْ يَتَكَلَّمَ ، لكِنَّ القاضي أَنْطَقَهُ","أَنْطَقَهُ"],"tr":"konuşturmak","ttr":"Birini konuşturmak.","otr":["Hırsız konuşmak istemedi ama hâkim onu konuşturdu.","Derilerine “Niçin aleyhimize şahitlik ettiniz?” dediler. Onlar: “Her şeyi konuşturan Allah bizi konuşturdu” dediler."],"r":null,"s":33,"f":"يُنْطِقُ إِنْطاقاً"},
{"k":"أَنْعَمَ","c":"","m":"يُنْعِمُ إِنْعاماً : أَعْطَى وَأَحْسَنَ العَطاءَ ، “أَنْعَمَ اللهُ عَلَيْنا بِنِعَمٍ كَثيرَةٍ” ، ﴿ صِراطَ الَّذينَ أَنْعَمْتَ عَلَيْهِمْ ﴾ ، ﴿ وَإِذا أَنْعَمْنا عَلَى الإِنْسانِ أَعْرَضَ وَنَأَى بِجانِبِهِ ﴾ .","t":"أَعْطَى وَأَحْسَنَ العَطاءَ","o":["أَنْعَمَ اللهُ عَلَيْنا بِنِعَمٍ كَثيرَةٍ","﴿ صِراطَ الَّذينَ أَنْعَمْتَ عَلَيْهِمْ ﴾","﴿ وَإِذا أَنْعَمْنا عَلَى الإِنْسانِ أَعْرَضَ وَنَأَى بِجانِبِهِ ﴾"],"b":["أَنْعَمَ اللهُ عَلَيْنا بِنِعَمٍ كَثيرَةٍ","أَنْعَمَ"],"tr":"nimet vermek","ttr":"Vermek ve güzelce ihsan etmek.","otr":["Allah bize pek çok nimet verdi.","Kendilerine nimet verdiklerinin yoluna...","İnsana nimet verdiğimizde yüz çevirir ve yan çizer."],"r":null,"s":33,"f":"يُنْعِمُ إِنْعاماً"},
{"k":"أَنْف","c":"أُنوفٌ وآناف","m":"(ج) أُنوفٌ وَآناف : عُضْوُ التَّنَفُّسِ وَالشَّمِّ ، ﴿ وَكَتَبْنا عَلَيْهِمْ فيها أَنَّ النَّفْسَ بِالنَّفْسِ وَالْعَيْنَ بِالْعَيْنِ وَالأَنْفَ بِالأَنْفِ ﴾ .","t":"عُضْوُ التَّنَفُّسِ وَالشَّمِّ","o":["﴿ وَكَتَبْنا عَلَيْهِمْ فيها أَنَّ النَّفْسَ بِالنَّفْسِ وَالْعَيْنَ بِالْعَيْنِ وَالأَنْفَ بِالأَنْفِ ﴾"],"b":["وَكَتَبْنا عَلَيْهِمْ فيها أَنَّ النَّفْسَ بِالنَّفْسِ وَالْعَيْنَ بِالْعَيْنِ وَالأَنْفَ بِالأَنْفِ","وَالأَنْفَ"],"tr":"burun","ttr":"Solunum ve koklama organı.","otr":["Orada (Tevrat'ta) onlara cana can, göze göz, buruna burun ... diye yazdık."],"r":"p34_1","s":34,"y":[["جمع","آناف"],["جمع","أُنوف"]]},
{"k":"أَنْفَقَ","c":"","m":"يُنْفِقُ إِنْفاقاً : صَرَفَ المالَ ، “أَنْفَقَ أَبو بَكْرٍ مالَهُ كُلَّهُ في سَبيلِ اللهِ” ، ﴿ لا يَسْتَوي مِنْكُمْ مَنْ أَنْفَقَ مِنْ قَبْلِ الْفَتْحِ ﴾ ، ﴿ إِذاً لَأَمْسَكْتُمْ خَشْيَةَ الإِنْفاقِ ﴾ .","t":"صَرَفَ المالَ","o":["أَنْفَقَ أَبو بَكْرٍ مالَهُ كُلَّهُ في سَبيلِ اللهِ","﴿ لا يَسْتَوي مِنْكُمْ مَنْ أَنْفَقَ مِنْ قَبْلِ الْفَتْحِ ﴾","﴿ إِذاً لَأَمْسَكْتُمْ خَشْيَةَ الإِنْفاقِ ﴾"],"b":["أَنْفَقَ أَبو بَكْرٍ مالَهُ كُلَّهُ في سَبيلِ اللهِ","أَنْفَقَ"],"tr":"harcamak, infak etmek","ttr":"Mal harcamak.","otr":["Ebû Bekir bütün malını Allah yolunda harcadı.","Sizden, fetihten önce infak eden (ve savaşan) kimse (ötekilerle) bir değildir.","O zaman da harcamaktan korkarak elinizde tutardınız."],"r":null,"s":34,"y":[["مصدر","إِنْفاق"]],"f":"يُنْفِقُ إِنْفاقاً"},

{"k":"أَنْكَرَ","c":"","m":"يُنْكِرُ إِنْكاراً : ( ١ ) جَحَدَ أَو ادَّعَى أَنَّهُ لا يَعْرِفُ ، “البَيِّنَةُ عَلى مَنِ ادَّعَى ، وَاليَمينُ عَلَى مَنْ أَنْكَرَ” ، ﴿ يَعْرِفُونَ نِعْمَتَ اللَّهِ ثُمَّ يُنْكِرُونَها ﴾ . ( ٢ ) عابَ ، “أَنْكَرْتُ ما فَعَلَهُ صَديقي مِنْ أَخْطاءٍ” .","t":"( ١ ) جَحَدَ أَو ادَّعَى أَنَّهُ لا يَعْرِفُ ( ٢ ) عابَ","o":["البَيِّنَةُ عَلى مَنِ ادَّعَى ، وَاليَمينُ عَلَى مَنْ أَنْكَرَ","﴿ يَعْرِفُونَ نِعْمَتَ اللَّهِ ثُمَّ يُنْكِرُونَها ﴾","أَنْكَرْتُ ما فَعَلَهُ صَديقي مِنْ أَخْطاءٍ"],"b":["أَنْكَرْتُ ما فَعَلَهُ صَديقي مِنْ أَخْطاءٍ","أَنْكَرْتُ"],"tr":"inkâr etmek; kınamak","ttr":"(1) İnkâr etmek ya da bilmediğini iddia etmek. (2) Ayıplamak, kınamak.","otr":["Delil getirmek iddia edene, yemin inkâr edene düşer.","Allah'ın nimetini bilirler, sonra onu inkâr ederler.","Arkadaşımın yaptığı hataları kınadım."],"r":null,"s":34,"f":"يُنْكِرُ إِنْكاراً"},

{"k":"أَهْوَن","c":"","m":"هَيِّنٌ جِدّاً ، اسْمُ تَفْضيل ، أَخَفُّ وَأَيْسَرُ ، خِلافُ أَشَدّ وَأَقْسَى ، “كانَ أَهْوَنَ عَلَى الرَّجُلِ أَنْ يَخوضَ الماءَ وَيَسْبَحَ ؛ بَدَلاً مِنْ أَنْ يَمْشِيَ في النّارِ” ، ﴿ وَهُوَ الَّذي يَبْدَأُ الخَلْقَ ثُمَّ يُعيدُهُ وَهُوَ أَهْوَنُ عَلَيْهِ ﴾ .","t":"هَيِّنٌ جِدّاً ، اسْمُ تَفْضيل ، أَخَفُّ وَأَيْسَرُ ، خِلافُ أَشَدّ وَأَقْسَى","o":["كانَ أَهْوَنَ عَلَى الرَّجُلِ أَنْ يَخوضَ الماءَ وَيَسْبَحَ ؛ بَدَلاً مِنْ أَنْ يَمْشِيَ في النّارِ","﴿ وَهُوَ الَّذي يَبْدَأُ الخَلْقَ ثُمَّ يُعيدُهُ وَهُوَ أَهْوَنُ عَلَيْهِ ﴾"],"b":["وَهُوَ الَّذي يَبْدَأُ الخَلْقَ ثُمَّ يُعيدُهُ وَهُوَ أَهْوَنُ عَلَيْهِ","أَهْوَنُ"],"tr":"daha kolay","ttr":"Çok kolay; ism-i tafdil: daha hafif ve daha kolay; daha şiddetli ve daha zorun zıddı.","otr":["Adam için ateşte yürümektense suya dalıp yüzmek daha kolaydı.","Yaratmayı başlatan, sonra onu tekrarlayan O'dur; bu O'na daha kolaydır."],"r":null,"s":35},

{"k":"أَوْحَى","c":"","m":"يوحي إيحاءً وَوَحْياً : ( ١ ) أَلْهَمَ ، ﴿ وَأَوْحَى رَبُّكَ إِلَى النَّحْلِ أَنِ اتَّخِذي مِنَ الْجِبالِ بُيُوتاً ﴾ . ( ٢ ) أَشارَ ، أَوْمَأَ ، ﴿ فَخَرَجَ عَلَى قَوْمِهِ مِنَ الْمِحْرابِ فَأَوْحَى إِلَيْهِمْ أَنْ سَبِّحُوا بُكْرَةً وَعَشِيّاً ﴾ . ( ٣ ) أَنْزَلَ اللهُ الوَحْيَ عَلَى الرُّسُلِ ، ﴿ فَأَوْحَى إِلَى عَبْدِهِ ما أَوْحَى ﴾ .","t":"( ١ ) أَلْهَمَ ( ٢ ) أَشارَ ، أَوْمَأَ ( ٣ ) أَنْزَلَ اللهُ الوَحْيَ عَلَى الرُّسُلِ","o":["﴿ وَأَوْحَى رَبُّكَ إِلَى النَّحْلِ أَنِ اتَّخِذي مِنَ الْجِبالِ بُيُوتاً ﴾","﴿ فَخَرَجَ عَلَى قَوْمِهِ مِنَ الْمِحْرابِ فَأَوْحَى إِلَيْهِمْ أَنْ سَبِّحُوا بُكْرَةً وَعَشِيّاً ﴾","﴿ فَأَوْحَى إِلَى عَبْدِهِ ما أَوْحَى ﴾"],"b":["وَأَوْحَى رَبُّكَ إِلَى النَّحْلِ أَنِ اتَّخِذي مِنَ الْجِبالِ بُيُوتاً","وَأَوْحَى"],"tr":"vahyetmek, ilham etmek","ttr":"(1) İlham etmek. (2) İşaret etmek, ima etmek. (3) Allah'ın peygamberlere vahiy indirmesi.","otr":["Rabbin bal arısına: “Dağlarda evler edin” diye ilham etti.","(Zekeriyya) mihraptan kavminin karşısına çıktı ve onlara “Sabah akşam tesbih edin” diye işaret etti.","Kuluna vahyedeceğini vahyetti."],"r":null,"s":36},

  // ---------- İSTATİSTİK ----------
  function istCiz() {
    var c = sayilar(), t = bugun(), gecmis = [], ileri = [], tops = 0, dogru = 0;

    for (j = 0; j < 7; j++) ileri.push([t + j, 0]);
    for (var i = 0; i < N; i++) { var s = st(i); if (!s || s.b) continue; var fark = Math.max(0, s.d - t); if (fark < 7) ileri[fark][1]++; }
    var gmax = Math.max.apply(null, gecmis.map(function (x) { return x[1]; }).concat([1]));
    var imax = Math.max.apply(null, ileri.map(function (x) { return x[1]; }).concat([1]));

    ana.innerHTML =

      '<div class="sayi"><b>' + (tops ? Math.round(dogru / tops * 100) : 0) + '%</b><span>başarı</span></div>' +
      '<div class="sayi seri"><b>' + seri() + '</b><span>gün seri 🔥</span></div></div>' +
      '<p class="soluk kucuk">“Öğrenildi”: bir sonraki tekrarı en az 3 hafta sonra olan kelime.</p></section>' +
      '<section class="kart ikili"><div><h3>Son 14 gün</h3><div class="grafik">' + gecmis.map(function (x) {
        return '<div class="s"><b>' + (x[1] || "") + '</b><i style="height:' + (x[1] / gmax * 85) + '%"></i><small>' + gunAd(x[0]) + "</small></div>";
      }).join("") + '</div></div><div><h3>Önümüzdeki 7 gün tekrar</h3><div class="grafik">' + ileri.map(function (x, n) {
        return '<div class="s ileri"><b>' + (x[1] || "") + '</b><i style="height:' + (x[1] / imax * 85) + '%"></i><small>' + (n ? gunAd(x[0]) : "bugün") + "</small></div>";
      }).join("") + "</div></div></section>" +
      '<section class="kart"><h2>Ayarlar</h2><div class="ayarlar"><span class="ayar"><span class="lbl">Günlük yeni kelime</span>' +
      seg("yeni", D.ay.yeni, [[5, "5"], [10, "10"], [15, "15"], [20, "20"], [30, "30"]]) + "</span></div>" +
      (HARFLER.length > 1 ? '<div class="ayarlar"><span class="ayar"><span class="lbl">Yeni kelimeler şu harften başlasın</span><select id="basHarf" aria-label="Başlangıç harfi">' +
        HARFLER.map(function (h) { return '<option value="' + h + '"' + (h === (D.ay.basHarf || HARFLER[0]) ? " selected" : "") + ">" + h + "</option>"; }).join("") + "</select></span></div>" : "") +
      (arSes ? '<p class="soluk kucuk">🔊 Cihazında Arapça ses bulundu; kartlarda dinleme düğmesi görünür.</p>' : '<p class="soluk kucuk">Cihazında Arapça okuma sesi bulunamadı, bu yüzden dinleme düğmesi gizli.</p>') + "</section>" +
      '<section class="kart"><h2>Yedek</h2><p class="aciklama">İlerlemen yalnızca bu tarayıcıda durur. Ara sıra yedek al; yedeği başka bir cihazda “Yedeği yükle” ile açabilirsin. Sözlüğe yeni sayfalar eklendiğinde de ilerlemen korunur.</p>' +
      (depoVar ? "" : '<p class="not"><b>Dikkat:</b> Bu tarayıcı kayıt yapmaya izin vermiyor. Sayfayı kapatınca ilerleme kaybolur; mutlaka yedek al.</p>') +
      '<div class="satir-btn"><button class="btn dolu" id="yedekAl" type="button">Yedek al (dosya indir)</button>' +
      '<label class="btn" for="yedekDosya" style="display:inline-block">Yedeği yükle</label><input type="file" id="yedekDosya" accept=".json,application/json" hidden>' +
      '<button class="btn" id="sifirla" type="button" style="margin-inline-start:auto;color:var(--yanlis)">Her şeyi sıfırla</button></div></section>';
    segBagla(ana, function (a, v) { D.ay.yeni = +v; kaydet(); S = null; istCiz(); toast("Günde " + v + " yeni kelime."); });
    var bh = $("#basHarf"); if (bh) bh.addEventListener("change", function () { D.ay.basHarf = this.value; kaydet(); S = null; toast("Yeni kelimeler “" + this.value + "” harfinden başlayacak."); });
    $("#yedekAl").addEventListener("click", function () {
      var d = new Date(), veri = JSON.stringify(D);
      var ad = "sozluk-defteri-yedek-" + d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2) + ".json";
      function tarayici() {
        var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([veri], { type: "application/json" })); a.download = ad;
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        toast("Yedek indirildi.");
      }
      // claude.ai sayfasında indirme izin penceresiyle yapılır; tek dosya sürümünde doğrudan indirilir
      if (!(window.claude && window.claude.use)) return tarayici();
      window.claude.use("downloads").then(function (dl) {

          D = d; kaydet(); temaUygula(); seriGuncelle(); S = null; T = null; B = null; E = null; istCiz(); toast("Yedek yüklendi: " + Object.keys(D.k).length + " kelime.");
        } catch (e) { toast("Bu dosya geçerli bir yedek değil."); }

        var tema = D.ay.tema; D = bos(); D.ay.tema = tema; kaydet(); seriGuncelle(); S = null; T = null; B = null; E = null; istCiz(); toast("Sıfırlandı.");
      });
    });
  }

  git("bugun");
})();
