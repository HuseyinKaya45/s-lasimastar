# Örnek nginx yapılandırması — TLS sonlandırma ve ters vekil.
# Not: bu dosya burada denenmemiştir; kendi ortamınızda doğrulayın ve kurum güvenlik politikasına göre uyarlayın.
limit_req_zone $binary_remote_addr zone=ets_login:10m rate=10r/m;

server {
    listen 443 ssl http2;
    server_name ets.kurum.example;

    ssl_certificate     /etc/ets/tls/fullchain.pem;
    ssl_certificate_key /etc/ets/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 512k;
    server_tokens off;

    # Giriş ucuna ek hız sınırı
    location = /api/login {
        limit_req zone=ets_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/ets-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/ets-proxy.conf;
    }
}

server {
    listen 80;
    server_name ets.kurum.example;
    return 301 https://$host$request_uri;
}

# /etc/nginx/ets-proxy.conf içeriği:
#   proxy_http_version 1.1;
#   proxy_set_header Host              $host;
#   proxy_set_header X-Forwarded-For   $remote_addr;   # istemciden gelen başlığı ezer (TRUST_PROXY=1 için güvenli)
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_read_timeout 60s;
