<script>
/* ===== Ses: önce programa gömülü kayıt, yoksa cihazdaki gerçek Arapça ses; başka dilde asla okumaz ===== */
const SES_AUDIO={/*__SES__*/};
const sesKey=t=>String(t).normalize('NFC').replace(/[ـ‍]/g,'').replace(/\s+/g,' ').trim();
let SES_A=null,SES_V=null;
function sesVoice(){if(!('speechSynthesis' in window))return null;try{return speechSynthesis.getVoices().find(v=>/^ar([-_]|$)/i.test(v.lang))||null;}catch(e){return null;}}
if('speechSynthesis' in window){try{speechSynthesis.getVoices();speechSynthesis.addEventListener('voiceschanged',()=>{SES_V=sesVoice();});}catch(e){}}
function sesStop(){try{if(SES_A){SES_A.pause();SES_A=null;}if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}}
function sesPlay(t,onend,warn){
  sesStop();let done=false;const fin=()=>{if(!done){done=true;if(onend)onend();}};
  const d=SES_AUDIO[sesKey(t)];
  if(d){try{SES_A=new Audio('data:audio/mpeg;base64,'+d);SES_A.onended=fin;SES_A.onerror=fin;const p=SES_A.play();if(p&&p.catch)p.catch(fin);if(onend)setTimeout(fin,20000);return true;}catch(e){}}
  const v=SES_V||sesVoice();
  if(v){try{const u=new SpeechSynthesisUtterance(t);u.lang=v.lang;u.voice=v;u.rate=.8;if(onend){u.onend=fin;u.onerror=fin;setTimeout(fin,6000);}speechSynthesis.speak(u);return true;}catch(e){}}
  if(warn)warn('Bu metnin kayıtlı sesi yok ve cihazda Arapça ses bulunamadı; yanlış okunmasın diye seslendirilmedi.');
  if(onend)setTimeout(fin,1200);return false;
}

/* ===== Lafız Pusulası — dersler (İslâm Hukuk İlminin Esasları, Üçüncü Bölüm: Kaynaklardan Hüküm Çıkarma, §229–315) =====
   g: ayrım (0 giriş, 1 vaz‘, 2 isti‘mâl, 3 açıklık-kapalılık, 4 delâlet şekli) · s: paragraf · tr: anlatım · ex: misal [arapça|'' , türkçe] · q: [soru, seçenekler, doğru, açıklama] */
const AYRIM=[
 {g:0,tr:'Giriş',sub:'İstinbât metodları',ar:'طُرُقُ الِاسْتِنْبَاطِ',col:'var(--gold)',dir:'Merkez'},
 {g:1,tr:'Birinci Ayrım',sub:'Vaz‘olunduğu mânâ bakımından',ar:'بِاعْتِبَارِ الْوَضْعِ',col:'var(--g1)',dir:'Kuzey',kinds:['Hâss','Âmm','Müşterek']},
 {g:2,tr:'İkinci Ayrım',sub:'Kullanıldığı mânâ bakımından',ar:'بِاعْتِبَارِ الِاسْتِعْمَالِ',col:'var(--g2)',dir:'Doğu',kinds:['Hakikat','Mecâz','Sarîh','Kinâye']},
 {g:3,tr:'Üçüncü Ayrım',sub:'Delâletin açıklığı ve kapalılığı',ar:'بِاعْتِبَارِ الظُّهُورِ وَالْخَفَاءِ',col:'var(--g3)',dir:'Güney',kinds:['Zâhir','Nass','Müfesser','Muhkem','Hafî','Müşkil','Mücmel','Müteşâbih']},
 {g:4,tr:'Dördüncü Ayrım',sub:'Delâletin şekli bakımından',ar:'بِاعْتِبَارِ كَيْفِيَّةِ الدَّلَالَةِ',col:'var(--g4)',dir:'Batı',kinds:['İbâre','İşâret','Delâlet','İktizâ']}
];
const LESSONS=[
/* ---------------- GİRİŞ ---------------- */
{id:'l1',g:0,s:'§ 229',t:'İstinbât metodları ve dört ayrım',
 tr:'<p>“İstinbât metodları” denince Kur’ân ve Sünnet metinlerini anlayabilmek ve onlardan hüküm çıkarabilmek için yararlanılan kurallar kastedilir. Kaynaklar Arapça olduğundan; lafızların hangi mânâ için konduğunu (umûm, husûs, iştirak), açıklık-kapalılık derecesini ve delâlet şekillerini (mantûk, mefhûm, ibâre, işâret…) tanımadan metinleri doğru anlamak ve isabetli hüküm çıkarmak mümkün değildir. Bunun yanında Şâri‘in maksadını (İslâm hukukunun ana gayelerini) bilmek de gerekir.</p><p>Hanefî usulcülere göre bir lafzın mânâsını tespit için onu <b>dört bakımdan</b> ele almak gerekir:</p><ol><li><b>Vaz‘</b>: Hangi mânâ için konduğu → <i>hâss, âmm, müşterek</i></li><li><b>İsti‘mâl</b>: Konduğu mânâda mı başka mânâda mı kullanıldığı → <i>hakikat, mecâz, sarîh, kinâye</i></li><li><b>Açıklık-kapalılık</b>: Açık olanlar <i>zâhir, nass, müfesser, muhkem</i>; kapalı olanlar <i>hafî, müşkil, mücmel, müteşâbih</i></li><li><b>Delâlet şekli</b> → <i>ibâre, işâret, delâlet (nassın delâleti), iktizâ</i></li></ol>',
 ex:[['','Bu program, bu dört ayrımı bir pusulanın dört yönü olarak düzenler: Kuzey = vaz‘, Doğu = isti‘mâl, Güney = açıklık-kapalılık, Batı = delâlet şekli.']],
 q:[['Hanefîlere göre lafız kaç bakımdan ayrıma tâbi tutulur?',['Dört','Üç','İki','Beş'],0,'Vaz‘, isti‘mâl, açıklık-kapalılık ve delâlet şekli.'],['“Hâss, âmm, müşterek” hangi ayrımın kısımlarıdır?',['Vaz‘olunduğu mânâ','Kullanıldığı mânâ','Açıklık derecesi','Delâlet şekli'],0,'Birinci ayrım: vaz‘ bakımından lafız.'],['“İbâre, işâret, delâlet, iktizâ” hangi ayrıma girer?',['Delâlet şekli','Vaz‘','İsti‘mâl','Kapalılık'],0,'Dördüncü ayrım.']]},
/* ---------------- 1. AYRIM: VAZ‘ ---------------- */
{id:'l2',g:1,s:'§ 231–233',t:'Hâss: tarifi, delâleti, kat‘îliği',ar:'الْخَاصُّ',
 tr:'<p><b>Hâss</b>, tek bir mânâyı (bu mânânın gerçekleştiği fertleri) teker teker göstermek üzere konmuş lafızdır: özel isimler (Mehmet, Ali), cins isimleri (kadın, erkek, insan), mânâ isimleri (ilim, hilim) ve sınırlı çokluk bildiren sayı isimleri (iki, üç, yüz, bin).</p><p><b>Delâleti:</b> Hâss, vaz‘olunduğu mânâya <b>kat‘î</b> olarak delâlet eder; aksine delil olmadıkça başka mânâya çekilemez.</p><p><b>Kat‘îlikten maksat:</b> Hiç ihtimal bulunmaması değil, <i>delile dayanan</i> bir ihtimalin bulunmamasıdır. Delile dayanmayan ihtimal yok hükmündedir. Delil bulunursa hâss te’vil edilebilir: Hanefîler “Her kırk koyunda bir koyun” hadisindeki “koyun”u, zekâtın gayesine (fakirin ihtiyacı) dayanarak <i>koyunun kıymeti</i> diye yorumlamıştır.</p><p class="small muted">Not: Delile dayanmayan ihtimalin bulunduğu kat‘îliğe “genel mânâda kat‘îlik”, verdiği bilgiye “ilm-i tuma’nîne” denir (zâhir, âmm nass, meşhur hadis). Hiç ihtimal taşımayan kat‘îliğe “özel mânâda kat‘îlik”, bilgisine “ilm-i yakîn” denir (mütevâtir, müfesser, muhkem).</p>',
 ex:[['فَكَفَّارَتُهُ إِطْعَامُ عَشَرَةِ مَسَاكِينَ… أَوْ تَحْرِيرُ رَقَبَةٍ ۖ فَمَنْ لَمْ يَجِدْ فَصِيَامُ ثَلَاثَةِ أَيَّامٍ','Mâide 5/89: “rakabe”, “aşera”, “selâse” hâsstır; yemin kefâreti bunların dışında bir mânâya ihtimal taşımaz.'],['فَاجْلِدُوهُمْ ثَمَانِينَ جَلْدَةً','Nûr 24/4: “semânîn” (seksen) hâsstır.'],['فَاجْلِدُوا كُلَّ وَاحِدٍ مِنْهُمَا مِائَةَ جَلْدَةٍ','Nûr 24/2: “mi’e” (yüz) hâsstır; miras âyetlerindeki sülüsân, nısf, sülüs, rubu‘, sümün de böyledir.'],['','“Bir aslan gördüm”: “esed” kesin olarak hayvana delâlet eder; “yiğit” mânâsı ihtimali delil olmadıkça dikkate alınmaz.']],
 q:[['Hâssın delâleti nasıldır?',['Kat‘î','Zannî','Mevkûf','Mücmel'],0,'Hâss vaz‘olunduğu mânâya kat‘î olarak delâlet eder.'],['Hâsstaki kat‘îlik ne demektir?',['Delile dayanan ihtimalin bulunmaması','Hiçbir ihtimalin bulunmaması','Te’vile kapalı olması','Neshedilememesi'],0,'Delile dayanmayan ihtimal yok hükmündedir.'],['Hanefîler kırk koyunda “bir koyun”u neden kıymet olarak anlamıştır?',['Zekâtın gayesi (fakirin ihtiyacı) delil olduğu için','Lafız müşterek olduğu için','Hadis zayıf olduğu için','Örf gereği'],0,'Delil bulununca hâss te’vil edilebilir.'],['Hangisi hâss lafız değildir?',['“el-müslimûn” (istiğrak lâmıyla)','“yüz”','“Ali”','“ilim”'],0,'İstiğrak lâmlı cemi umûm ifade eder (âmm).']]},
{id:'l3',g:1,s:'§ 234',t:'Hâssa dayanan iki mesele: kur’ ve mufavvıda',
 tr:'<p>Hanefîler, bütün hukukçularca kabul edilen “hâssın delâleti kat‘îdir” kuralına dayanarak ihtilaflı bazı meselelerde kendi görüşlerini desteklemiştir.</p><p><b>1. İddet: hayız mı tuhur mu?</b> Hanefî ve Hanbelîlere göre iddet <b>üç hayız</b>; Şâfiî ve Mâlikîlere göre <b>üç tuhur</b>dur. Herkes “kur’” lafzının hem hayız hem tuhur anlamına gelen müşterek bir lafız olduğunda ve âyette yalnız birinin kastedildiğinde müttefiktir. Hanefîler der ki: “Selâse” (üç) hâsstır; iddet ne eksik ne fazla tam üç olmalıdır. Kur’ tuhur olsaydı, talâkın vâki olduğu tuhur ya sayılır (iddet üçten eksik olur) ya sayılmaz (üçten fazla olur). Hayız kabul edilince tam üç gerçekleşir.</p><p><b>2. Mufavvıda’nın mehri:</b> Mehir belirlemeden evlenip zifaftan önce kocası ölen kadına Hanefîlere göre <b>mehr-i misil</b> gerekir; Mâlikîlere göre gerekmez. Hanefîler “bi-emvâlikum” (mallarınızla) ifadesindeki “bâ” harfinin hâss olup “bitiştirmek” anlamına geldiğini, dolayısıyla geçerli evlilik akdinin maldan (mehirden) ayrı düşünülemeyeceğini söyler.</p>',
 ex:[['وَالْمُطَلَّقَاتُ يَتَرَبَّصْنَ بِأَنْفُسِهِنَّ ثَلَاثَةَ قُرُوءٍ','Bakara 2/228: “selâse” hâss, “kurû’” müşterek.'],['وَأُحِلَّ لَكُمْ مَا وَرَاءَ ذَٰلِكُمْ أَنْ تَبْتَغُوا بِأَمْوَالِكُمْ','Nisâ 4/24: “bâ” hâsstır; akid maldan ayrılamaz.']],
 q:[['Hanefîlere göre boşanan kadının iddeti neye göre hesaplanır?',['Üç hayız','Üç tuhur','Üç ay','Dört ay on gün'],0,'“Selâse” hâss olduğu için tam üç ancak hayızla gerçekleşir.'],['Hanefîlerin iddet meselesindeki dayanağı hangi lafızdır?',['“Selâse” (üç)','“Kurû’”','“el-Mutallakât”','“Yeterabbasne”'],0,'Hâss olan sayı ismi.'],['Mufavvıda kime denir?',['Mehir belirlemeksizin velisine evlendirme yetkisi veren kadın','Boşanmış kadın','Dul kadın','Câriye'],0,'Hanefîlere göre ona mehr-i misil gerekir.']]},
{id:'l4',g:1,s:'§ 235–239',t:'Mutlak ve mukayyed',ar:'الْمُطْلَقُ وَالْمُقَيَّدُ',
 tr:'<p>Hâssın türlerinden biri <b>mutlak</b> ve <b>mukayyed</b>dir (diğerleri emir ve nehiy).</p><ul><li><b>Mutlak</b>: gayr-ı muayyen bir ferdi veya fertleri gösteren ve herhangi bir sıfatla kayıtlandığına dair delil bulunmayan lafız: adam, kitap, öğrenciler.</li><li><b>Mukayyed</b>: gayr-ı muayyen fert/fertleri göstermekle birlikte bir sıfatla kayıtlandığına dair delil bulunan lafız: imanlı adam, kıymetli kitap.</li></ul><p><b>Mutlakın hükmü:</b> Başka nasta mukayyed gelmemişse mutlak hâline göre amel edilir; takyîdine delil olmadıkça takyîd edilmez. <b>Mukayyedin hükmü:</b> Mukayyed hâline göre amel edilir; kaydın kalktığına delil olmadıkça kaldırılmaz.</p>',
 ex:[['فَعِدَّةٌ مِنْ أَيَّامٍ أُخَرَ','Bakara 2/184: “günler” mutlak; kaza orucu peş peşe tutmak gerekmez.'],['وَأُمَّهَاتُ نِسَائِكُمْ','Nisâ 4/23: “kadınlarınız” mutlak; sırf akitle kayınvalide haram olur.'],['مِنْ بَعْدِ وَصِيَّةٍ يُوصِي بِهَا أَوْ دَيْنٍ','Nisâ 4/12: “vasiyet” mutlak; Sa‘d hadisi (“Üçte bir; üçte bir bile çok”) onu üçte birle takyîd eder.'],['فَصِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ مِنْ قَبْلِ أَنْ يَتَمَاسَّا','Mücâdele 58/4: zıhâr orucu “peş peşe” ve “temastan önce” kayıtlarıyla mukayyed.'],['مِنْ نِسَائِكُمُ اللَّاتِي دَخَلْتُمْ بِهِنَّ','Nisâ 4/23: “zifafa girdiğiniz” kaydı geçerli; “evlerinizdeki” kaydı ise “zifafa girmemişseniz beis yok” ifadesiyle kalkmıştır.']],
 q:[['“İmanlı adam” ifadesi nasıl bir lafızdır?',['Mukayyed','Mutlak','Âmm','Müşterek'],0,'Sıfatla kayıtlanmıştır.'],['Bakara 2/184’teki “eyyâmün uhar” mutlak olduğuna göre kaza orucu nasıl tutulur?',['Ayrı ayrı veya peş peşe; ikisi de olur','Mutlaka peş peşe','Mutlaka ayrı ayrı','Yalnız şevvalde'],0,'Takyîde delil yok.'],['Âyetteki mutlak “vasiyet” neyle takyîd edilmiştir?',['Sa‘d b. Ebî Vakkâs hadisiyle (üçte bir)','Kıyasla','İcmâ ile','Örfle'],0,'Takyîde delil bulunan mutlak örneği.']]},
{id:'l5',g:1,s:'§ 240–246',t:'Mutlakın mukayyede hamli',ar:'حَمْلُ الْمُطْلَقِ عَلَى الْمُقَيَّدِ',
 tr:'<p>Bir lafız bir nasta mutlak, diğerinde mukayyed gelirse ıtlak-takyîd ya <b>hükmün sebebinde</b> ya <b>hükmün kendisinde</b>dir.</p><table class="mini"><tr><th>Durum</th><th>Hanefî</th><th>Cumhur</th></tr><tr><td>Sebepte ıtlak-takyîd, hüküm bir</td><td>Hamledilmez</td><td>Hamledilir</td></tr><tr><td>Hükümde; hüküm ve sebep bir</td><td colspan="2">İttifakla hamledilir</td></tr><tr><td>Hükümler ve sebepler farklı</td><td colspan="2">İttifakla hamledilmez</td></tr><tr><td>Hükümler farklı, sebep bir</td><td colspan="2">İttifakla hamledilmez</td></tr><tr><td>Hüküm bir, sebepler farklı</td><td>Hamledilmez</td><td>Hamledilir</td></tr></table><p>Hüküm ve sebep birliği hâlinde ıtlak ile takyîd arasındaki farkı tasavvur imkânsızdır; bu yüzden ittifakla hamledilir.</p>',
 ex:[['حُرِّمَتْ عَلَيْكُمُ الْمَيْتَةُ وَالدَّمُ / أَوْ دَمًا مَسْفُوحًا','Mâide 5/3 ve En‘âm 6/145: hüküm (kan haram) ve sebep (zararı) bir → mutlak “kan”, “akıtılmış kan”a hamledilir.'],['','Teyemmüm: âyette “eller” mutlak; hadiste “dirseklere kadar” → Hanefî ve Şâfiîlere göre dirseklere kadar meshetmek farz.'],['','Hırsızlık âyeti (eller, mutlak) ile abdest âyeti (dirseklere kadar): hükümler ve sebepler farklı → hamledilmez.'],['','Zıhâr kefâreti (rakabe, mutlak) ile hataen öldürme kefâreti (mümin rakabe): hüküm bir, sebep farklı → Hanefîlere göre hamledilmez; zıhârda gayrimüslim köle âzâdı yeter.'],['','Sadaka-i fıtır: “her küçük-büyük” ile “müslümanlardan” rivâyetleri, sebepte ıtlak-takyîd olarak gösterilir; mütercim, bunun yerine şuf‘a hadislerini daha isabetli örnek sayar.']],
 q:[['Hüküm ve sebep aynı, ıtlak-takyîd hükümde ise?',['İttifakla hamledilir','İttifakla hamledilmez','Hanefîlere göre hamledilmez','Cumhura göre hamledilmez'],0,'Kan örneği.'],['Zıhâr ve hataen öldürme kefâretlerindeki köle meselesinde Hanefîlerin görüşü?',['Hamledilmez; zıhârda mümin olmayan köle de yeter','Hamledilir; mümin köle şart','Hiç köle gerekmez','Kıymet verilir'],0,'Hüküm bir, sebepler farklı.'],['Abdest ve teyemmüm âyetlerinde “eller” için hüküm?',['Hükümler farklı, sebep bir: ittifakla hamledilmez','İttifakla hamledilir','Hanefîlere göre hamledilir','Cumhura göre hamledilmez'],0,'Biri yıkama, biri mesh.'],['Hanefîlerin cumhurdan ayrıldığı iki durum hangileridir?',['Sebepte ıtlak-takyîd ve sebeplerin farklılığı','Hükümlerin farklılığı','Hüküm ve sebep birliği','Hepsi'],0,'Bu iki hâlde Hanefîler hamletmez.']]},
{id:'l6',g:1,s:'§ 247–248',t:'Emir: mânâsı ve delâleti',ar:'الْأَمْرُ',
 tr:'<p><b>Emir</b>, fiilin yerine getirilmesi talebine delâlet eden söz(cük)dür. Şu kalıplarla olur: (a) emir kalıbı, (b) başında emir lâmı bulunan muzâri, (c) talep maksadıyla kullanılan haber cümlesi.</p><p>Karîneden mücerret emrin neye delâlet ettiği tartışmalıdır: nedb/irşâd, ibâha, bunlar arasında müşterek veya — <b>cumhura</b> ve müellife göre — <b>vücûb</b>. Karîne varsa ona göre anlaşılır:</p><ul><li><b>İbâha</b>: “Yiyin, için” — yeme-içme fıtrîdir.</li><li><b>Nedb</b>: “Kölelerinizle mükâtebe yapın” — malik mülkünde serbesttir.</li><li><b>İrşâd</b>: “Borcu yazın” — hakkın korunması; “Birbirinize güvenirseniz…” karînesi. (Nedbde gaye uhrevî sevap, irşâdda dünyevî faydadır.)</li><li><b>Te’dîb</b>: Hz. Peygamber’in küçük İbn Abbâs’a emirleri.</li></ul>',
 ex:[['وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ','Emir kalıbı.'],['ثُمَّ لْيَقْضُوا تَفَثَهُمْ وَلْيُوفُوا نُذُورَهُمْ وَلْيَطَّوَّفُوا بِالْبَيْتِ الْعَتِيقِ','Hac 22/29: emir lâmlı muzâri.'],['وَالْوَالِدَاتُ يُرْضِعْنَ أَوْلَادَهُنَّ','Bakara 2/233: talep maksatlı haber.'],['وَكُلُوا وَاشْرَبُوا','İbâha karînesi.'],['فَكَاتِبُوهُمْ إِنْ عَلِمْتُمْ فِيهِمْ خَيْرًا','Nûr 24/33: nedb.']],
 q:[['Cumhura göre karîneden mücerret emir neye delâlet eder?',['Vücûb','Nedb','İbâha','Tevakkuf'],0,'Müellif de bunu tercih eder.'],['“Kölelerinizle mükâtebe yapın” emri neyi ifade eder?',['Nedb','Vücûb','İbâha','Te’dîb'],0,'Karîne: malikin mülkünde tasarruf hürriyeti.'],['Nedb ile irşâd farkı?',['Nedbde gaye sevap, irşâdda dünyevî fayda','Fark yok','İrşâd bağlayıcı','Nedb bağlayıcı'],0,'İkisi de bağlayıcı değildir.'],['“Anneler çocuklarını emzirirler” ifadesi hangi kalıptır?',['Talep maksatlı haber','Emir kalıbı','Emir lâmlı muzâri','Nehiy'],0,'Maksat haber vermek değil talep etmektir.']]},
{id:'l7',g:1,s:'§ 249–250',t:'Emirdeki ihtilafın istinbâta etkisi: borcun yazılması',
 tr:'<p>Karînenin varlığı ve yorumu konusundaki farklılıklar, birçok fıkhî ihtilafın başlıca sebebidir. Örnek: Bakara 2/282-283’teki <b>dört emir</b>: (1) borcu yazın, (2) borca şahit tutun, (3) alım-satıma şahit tutun, (4) yolculukta rehin alın.</p><ul><li>Rehin emrinin <b>nedb/irşâd</b> olduğunda ittifak vardır; karîne: “Birbirinize güvenirseniz…”</li><li><b>Cumhur</b>: Diğer üç emir de nedb ve irşâd içindir; aynı karîne hepsine bakar.</li><li><b>Zâhirîler</b> (İbn Hazm): Bu üç emir vücûb içindir; terk eden günahkâr olur ama akit fâsid olmaz. Karîne sadece rehin hakkındadır.</li></ul><p>Müellif cumhuru tercih eder: Nassın tamamı tek konuyla, yani hakların teminat altına alınmasıyla ilgilidir.</p>',
 ex:[['يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا تَدَايَنْتُمْ بِدَيْنٍ إِلَىٰ أَجَلٍ مُسَمًّى فَاكْتُبُوهُ','Bakara 2/282.'],['فَإِنْ أَمِنَ بَعْضُكُمْ بَعْضًا فَلْيُؤَدِّ الَّذِي اؤْتُمِنَ أَمَانَتَهُ','Bakara 2/283: karîne.']],
 q:[['Borcun yazılması emri cumhura göre nedir?',['Nedb ve irşâd','Vücûb','İbâha','Haram'],0,'“Birbirinize güvenirseniz” karînesi.'],['Zâhirîlere göre şahit tutmayanın satışı?',['Geçerli ama kendisi günahkâr','Bâtıl','Fâsid','Mekruh'],0,'İbn Hazm: “satım sözleşmesi tamdır.”'],['Hangi emrin nedb olduğunda ittifak vardır?',['Yolculukta rehin','Borcu yazma','Borca şahit','Satışa şahit'],0,'Karîne hemen ardından gelir.']]},
{id:'l8',g:1,s:'§ 251–253',t:'Yasaktan sonra emir; tekrar ve fevr',
 tr:'<p><b>Yasaktan sonra gelen emir</b> hakkında üç görüş:</p><ol><li>İbâha ifade eder (Şâfiî’den nakledilen).</li><li>Vücûb ifade eder (Hanefîlerin çoğu).</li><li>Yasağı kaldırır ve fiilin <b>yasaktan önceki hükmünü</b> geri getirir (Kemâl b. Hümâm; müellifin tercihi). Tümevarım bunu doğrular: haram aylardan sonra savaş vâcib, kabir ziyareti mendub, ihramdan sonra avlanma mubah.</li></ol><p><b>Tekrar:</b> Emir kendiliğinden tekrarı gerektirmez; şarta veya illet olan vasfa bağlıysa illet tekrarlandıkça tekrarlanır (namaz-abdest, zina-had).</p><p><b>Fevr-terâhî:</b> Emir kendiliğinden ikisine de delâlet etmez; karîneden anlaşılır. Dar vakitli (ramazan orucu) fevrîdir; geniş vakitli (beş vakit) veya vakitsiz (zekât, kaza, kefâret) fevrî değildir; ama hayra koşmak efdaldir.</p>',
 ex:[['فَإِذَا قُضِيَتِ الصَّلَاةُ فَانْتَشِرُوا فِي الْأَرْضِ','Cum‘a 62/10: alış-veriş yasağından sonra.'],['وَإِذَا حَلَلْتُمْ فَاصْطَادُوا','Mâide 5/2: avlanma mubah.'],['فَإِذَا انْسَلَخَ الْأَشْهُرُ الْحُرُمُ فَاقْتُلُوا الْمُشْرِكِينَ','Tevbe 9/5: vücûb.'],['','“Size kabir ziyaretini yasaklamıştım… artık ziyaret edin”: mendub.']],
 q:[['Müellifin tercihine göre yasaktan sonra gelen emir?',['Yasaktan önceki hükmü geri getirir','Daima ibâha','Daima vücûb','Daima nedb'],0,'Kemâl b. Hümâm’ın görüşü.'],['Emir kendiliğinden tekrarı gerektirir mi?',['Hayır; illet/şarta bağlıysa tekrarlanır','Evet daima','Yalnız ibadetlerde','Yalnız cezalarda'],0,'Abdest ve namaz iradesi örneği.'],['Ramazan orucu emri nasıldır?',['Fevrî (dar vakit)','Terâhî','Vakitsiz','Mubah'],0,'Vakit başka fiile imkân vermez.']]},
{id:'l9',g:1,s:'§ 254–256',t:'Nehiy',ar:'النَّهْيُ',
 tr:'<p><b>Nehiy</b>, fiilden el çekme talebine delâlet eden söz(cük)dür: (a) “lâ” ile nehiy kalıbı, (b) el çekmeyi bildiren emir kalıbı (“alış-verişi bırakın”), (c) yasak/hürmet bildiren haber (“yasaklar”, “helâl değildir”).</p><p><b>Cumhur</b> (ve müellif): Karîneden mücerret nehiy <b>tahrîm</b> ifade eder. Karîneyle: kerâhe (cuma ezanında alış-veriş), irşâd (“hoşunuza gitmeyecek şeyleri sormayın”), duâ (“kalplerimizi eğriltme”). Diğer görüşler: kerâhe; tahrîm-kerâhe arasında müşterek.</p><p><b>Fevr ve tekrar:</b> İttifakla nehiy <b>hemen ve sürekli</b> terki gerektirir; bu yönüyle emirden farklıdır.</p>',
 ex:[['وَلَا تَأْكُلُوا أَمْوَالَكُمْ بَيْنَكُمْ بِالْبَاطِلِ','Bakara 2/188: nehiy kalıbı.'],['وَذَرُوا الْبَيْعَ','Cum‘a 62/9: el çekme emri; karîneyle kerâhe.'],['وَيَنْهَىٰ عَنِ الْفَحْشَاءِ وَالْمُنْكَرِ وَالْبَغْيِ','Nahl 16/90: haber kalıbı.'],['رَبَّنَا لَا تُزِغْ قُلُوبَنَا','Âl-i İmrân 3/8: duâ.']],
 q:[['Cumhura göre karîneden mücerret nehiy?',['Tahrîm','Kerâhe','İbâha','Müşterek'],0,'Müellif de tercih eder.'],['Nehiy fevr ve tekrar gerektirir mi?',['Evet, ittifakla','Hayır','Yalnız tekrar','Yalnız fevr'],0,'Emirden farkı budur.'],['Cuma ezanında alış-veriş yasağı neden kerâhe?',['Yasak alış-verişin kendisi için değil, namazdan alıkoyma endişesiyle','Hadis zayıf','Mansûh','İcmâ'],0,'Karîne.']]},
{id:'l10',g:1,s:'§ 257',t:'Nehyin ibadet ve muâmelâta etkisi: bâtıl ve fâsid',
 tr:'<p>Nehiylerin üç nevi vardır:</p><ol><li><b>Amelin mahiyeti/özü</b> (rükün veya mahal yok): meyte, cenin, olmayan ekin satışı → <b>ittifakla bâtıl</b>.</li><li><b>Amelin icabından olmayan, onu çevreleyen durum</b>: gasp elbiseyle namaz, cuma ezanında alış-veriş → çoğunluğa göre <b>sahih ama mekruh</b>; Zâhirîlere (ve Ahmed’den, bir rivayete göre Mâlik’ten) göre bâtıl.</li><li><b>Amelin icabından olan vasıf</b>: bayram günü oruç, ribâlı veya fâsid şartlı satış → <b>Hanefî: fâsid</b> (asıl meşru, vasıf değil; bazı sonuçlar bağlanır), <b>cumhur: bâtıl</b> (fâsid = bâtıl).</li></ol><p>Müellif cumhuru tercih eder: “Bizim işimize uygun olmayan her iş merduttur.” Hanefîlerin meşhur görüşüne göre ibadetlerde (ve nikâhta) fesâd-butlan ayrımı yapılmaz; ayrım muâmelâttadır. Fesâd faydada eksiklik, butlan menfaatin temelden yokluğudur (“et fâsid oldu / bâtıl oldu”).</p>',
 ex:[['','Yüz kilo buğdaya karşılık yüz on kilo buğday: satışın özü sağlam, vasfı (karşılıksız fazlalık) sakat.'],['','Bayram günü oruç: oruç ibadettir; yasak, Allah’ın misafiri olan kulun ikramı reddetmesi yüzündendir.']],
 q:[['Meytenin satışı hakkındaki nehiy hangi neviden ve sonucu nedir?',['Mahiyet; ittifakla bâtıl','Vasıf; fâsid','Mücâvir; mekruh','Vasıf; bâtıl'],0,'Satım konusu şer‘an mevcut değil.'],['Ribâlı satış Hanefîlere göre nasıldır?',['Fâsid','Bâtıl','Sahih-mekruh','Mubah'],0,'Asıl meşru, vasıf gayr-ı meşru.'],['Gasp elbiseyle kılınan namaz çoğunluğa göre?',['Sahih ama mekruh','Bâtıl','Fâsid','Vâcib iade'],0,'Nehiy amelin icabından olmayan bir durumdan.'],['Cumhura göre fâsid ile bâtıl?',['Aynı anlamdadır','Farklıdır','Fâsid daha ağır','Yalnız ibadette aynı'],0,'Hanefîler muâmelâtta ayırır.']]},
{id:'l11',g:1,s:'§ 258–259',t:'Âmm ve umûm ifade eden lafızlar',ar:'الْعَامُّ وَصِيَغُ الْعُمُومِ',
 tr:'<p><b>Âmm</b>, tek vaz‘ ile tek bir mânâyı göstermek üzere konmuş olup belli bir miktarla sınırlı olmaksızın o mânânın gerçekleştiği bütün fertleri kapsayan lafızdır: “es-sârik” (hırsız), “ülkenin bilginleri”.</p><p><b>Umûm sîgaları:</b></p><ol><li><b>Küll</b> ve <b>cemî‘</b> (her, bütün)</li><li>İstiğrak lâmıyla veya izâfetle belirli cemi: “el-mü’minûn”, “evlâdikum”</li><li>Lâm veya izâfetle belirli tekil: “el-insân”, “el-bey‘”, “meytetuhû”</li><li>İsm-i mevsûl: “ellezîne”, “mâ”</li><li>Şart isimleri: “men”, “mâ”</li><li>Soru isimleri: “metâ”</li><li><b>Nefiy veya nehiyden sonra nekre</b>: “lâ vasiyyete li-vâris”, “lâ tusalli alâ ehadin”</li></ol>',
 ex:[['وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوا أَيْدِيَهُمَا','Mâide 5/38: lâmlı tekil.'],['قَدْ أَفْلَحَ الْمُؤْمِنُونَ','Mü’minûn 23/1: istiğrak lâmlı cemi.'],['يُوصِيكُمُ اللَّهُ فِي أَوْلَادِكُمْ','Nisâ 4/11: muzâf cemi.'],['إِنَّ الْإِنْسَانَ لَفِي خُسْرٍ','Asr 103/2: lâmlı tekil.'],['هُوَ الطَّهُورُ مَاؤُهُ الْحِلُّ مَيْتَتُهُ','Hadis: izâfetle belirli tekil.'],['فَمَنْ شَهِدَ مِنْكُمُ الشَّهْرَ فَلْيَصُمْهُ','Bakara 2/185: şart ismi.'],['لَا وَصِيَّةَ لِوَارِثٍ','Hadis: nefiyden sonra nekre.'],['وَلَا تُصَلِّ عَلَىٰ أَحَدٍ مِنْهُمْ مَاتَ أَبَدًا','Tevbe 9/84: nehiyden sonra nekre.']],
 q:[['“Lâ vasiyyete li-vâris” hadisindeki umûm neden kaynaklanır?',['Nefiyden sonra gelen nekre','Küll lafzı','Lâmlı cemi','Şart ismi'],0,'Her türlü vasiyeti kapsar.'],['“Ülkenin bilginleri” lafzı âmm mıdır?',['Evet; sınırlılık lafızdan değil vâkıadan anlaşılır','Hayır, hâsstır','Müşterektir','Mücmeldir'],0,'Mevcut ve ileride olacak bilginleri kapsar.'],['Hangisi umûm sîgası değildir?',['Sayı isimleri','Küll','Şart isimleri','İsm-i mevsûl'],0,'Sayılar hâsstır.']]},
{id:'l12',g:1,s:'§ 260–266',t:'Tahsîs: cumhur ve Hanefîler',ar:'التَّخْصِيصُ',
 tr:'<p>Âmm vaz‘ bakımından bütün fertleri içindir; kullanımda ise çoğu zaman bir kısım fertleri kastedilir. İhtilaf, buna her durumda “tahsîs” denip denmeyeceğindedir.</p><p><b>Cumhur</b>: Âmmı bazı fertlerine hasreden her delil tahsîstir (âmmla amelden sonra gelmemek şartıyla; sonra gelirse nesihtir). Muhassıs ikidir:</p><ul><li><b>Müstakil</b>: akıl (çocuk ve deliler hitap dışında), örf (bir beldede “hayvan” = at), nass — muttasıl veya munfasıl.</li><li><b>Gayr-ı müstakil</b>: istisnâ, şart, sıfat.</li></ul><p><b>Hanefîler</b>: Tahsîs yalnız <b>müstakil ve âmma zamanca mukarin</b> delille olur. İstisnâ, şart, sıfat “<b>kasr</b>”dır; müstakil ama sonra gelen delil <b>nesih</b>tir. Muhassıslar: akıl, örf, mukarin müstakil nass.</p>',
 ex:[['وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا','Bakara 2/275: muttasıl müstakil nass ile tahsîs.'],['فَمَا لَكُمْ عَلَيْهِنَّ مِنْ عِدَّةٍ تَعْتَدُّونَهَا','Ahzâb 33/49: zifaftan önce boşanana iddet yok → “el-mutallakât” tahsîs.'],['إِلَّا مَنْ أُكْرِهَ وَقَلْبُهُ مُطْمَئِنٌّ بِالْإِيمَانِ','Nahl 16/106: istisnâ.'],['إِنْ لَمْ يَكُنْ لَهُنَّ وَلَدٌ','Nisâ 4/12: şart.'],['فِي سَائِمَةِ الْغَنَمِ الزَّكَاةُ','Hadis: sıfat.']],
 q:[['Hanefîlere göre istisnâ ile daraltmanın adı nedir?',['Kasr','Tahsîs','Nesih','Te’vil'],0,'Gayr-ı müstakil delil.'],['Hanefîlere göre âmmdan sonra gelen müstakil delil?',['Nesih','Tahsîs','Kasr','Beyan'],0,'Mukarin olmalıydı.'],['Bir beldede “hayvan” yalnız ata deniyorsa, hayvanlara vasiyet?',['Yalnız atları kapsar (örf muhassıs)','Bütün hayvanları kapsar','Bâtıldır','Mücmeldir'],0,'Örf ve âdet.'],['Cumhura göre gayr-ı müstakil muhassıslar?',['İstisnâ, şart, sıfat','Akıl, örf','İcmâ, kıyas','Nesih'],0,'Âmmı içeren nassın cüz’ü.']]},
{id:'l13',g:1,s:'§ 267–268',t:'Âmmın delâleti: kat‘î mi zannî mi?',
 tr:'<p>Tahsîse uğramış âmmın kalan fertlere delâleti ittifakla <b>zannî</b>dir. Tahsîse uğramamış âmm hakkında:</p><ul><li><b>Cumhur</b>: zannî. “Tahsîse uğramayan âmm yoktur.”</li><li><b>Hanefîler</b>: hâss gibi <b>kat‘î</b>. Delile dayanmayan ihtimal kat‘îliği etkilemez.</li></ul><p><b>Pratik sonuçlar:</b></p><ol><li>Kitap ve mütevâtir Sünnet’teki âmm, haber-i vâhid ve kıyasla ilk olarak tahsîs edilebilir mi? Hanefî: hayır; cumhur: evet. Örnek: bilerek besmele terk edilen kesim — Hanefîler En‘âm 6/121’in umûmuyla haram der; Şâfiîler “Besmele çeksin çekmesin müslümanın kestiği helâldir” haberiyle tahsîs ederek helâl der.</li><li>Âmm ile hâss çatışırsa? Cumhur: teâruz yok, hâss ölçüsünde hâss, ötesinde âmm. Hanefî: teâruz var; birlikte gelmişse tahsîs, sonra gelmişse nesih, tarih bilinmiyorsa tercih. Örnek: toprak ürünü zekâtında nisap — Şâfiî beş vesk şartını alır; Ebû Hanîfe ihtiyatla âmmı tercih eder, az-çok hepsinden öşür.</li></ol>',
 ex:[['وَلَا تَأْكُلُوا مِمَّا لَمْ يُذْكَرِ اسْمُ اللَّهِ عَلَيْهِ','En‘âm 6/121.'],['فِيمَا سَقَتِ السَّمَاءُ الْعُشْرُ','Hadis: âmm.'],['لَيْسَ فِيمَا دُونَ خَمْسَةِ أَوْسُقٍ صَدَقَةٌ','Hadis: hâss.'],['وَالَّذِينَ يَرْمُونَ أَزْوَاجَهُمْ','Nûr 24/6: liân âyeti, kazf âyetini kocalar hakkında neshetmiştir (Hanefî).']],
 q:[['Hanefîlere göre tahsîse uğramamış âmmın delâleti?',['Kat‘î','Zannî','Mücmel','Mevkûf'],0,'Hâss gibi.'],['Bilerek besmele terk edilen kesim Şâfiîlere göre?',['Helâl (âmm haber-i vâhidle tahsîs)','Haram','Mekruh','Mevkûf'],0,'Cumhura göre zannî zannîyi tahsîs eder.'],['Ebû Hanîfe beş veskten az ürünün zekâtında neden âmmı tercih eder?',['Tarih bilinmiyor ve ihtiyat farziyettedir','Hâss zayıf','Kıyas','Örf'],0,'Teâruz ve tercih.']]},
{id:'l14',g:1,s:'§ 269',t:'Özel bir sebebe binaen vârid olan âmm',
 tr:'<p>Âmm bazen özel bir sebebe dayanmadan, bazen bir soru veya olay üzerine gelir. İsabetli görüş: Âmmın özel sebeple gelmesi onu umûmundan çıkarmaz. Sahâbe nasları nüzûl sebeplerine hasretmemiş, buna kimse itiraz etmemiş ve icmâ oluşmuştur. Kural:</p><p class="ar" style="font-size:1.4rem;text-align:center">الْعِبْرَةُ بِعُمُومِ اللَّفْظِ لَا بِخُصُوصِ السَّبَبِ</p><p style="text-align:center">“Sebebin özel oluşu değil, lafzın umûmu dikkate alınır.”</p>',
 ex:[['','Liân âyeti Hilâl b. Ümeyye hakkında indi; ama karısına zina isnad edip delil getiremeyen herkese şâmildir.'],['','Zıhâr âyetleri Evs b. es-Sâmit ve Havle hakkında indi; hüküm zıhâr yapan herkes içindir.'],['هُوَ الطَّهُورُ مَاؤُهُ الْحِلُّ مَيْتَتُهُ','Deniz yolcusunun sorusu üzerine geldi; deniz suyu her tahâret için elverişlidir.'],['أَيُّمَا إِهَابٍ دُبِغَ فَقَدْ طَهُرَ','Meymûne’nin komşusunun koyunu üzerine; her deri tabaklanınca temizlenir.']],
 q:[['Özel sebeple gelen âmmın hükmü?',['Umûmu üzere kalır','Sebebe hâss olur','Mücmel olur','Mansûh olur'],0,'Lafzın umûmu esastır.'],['“Herhangi bir deri tabaklanınca temizlenir” hadisi neden umûm üzere kalır?',['Kural: lafzın umûmu dikkate alınır','Mütevâtir olduğu için','Kıyas','Örf'],0,'Koyun-diğer hayvan ayrımı yapılmaz.']]},
{id:'l15',g:1,s:'§ 270–272',t:'Müşterek',ar:'الْمُشْتَرَكُ',
 tr:'<p><b>Müşterek</b>, her biri ayrı vaz‘ ile birden fazla mânâya sahip lafızdır: “ayn” (casus, pınar, göz, altın), “kur’” (hayız, tuhur), “mevlâ” (âzâd eden efendi, âzâd edilen köle).</p><p><b>Ortaya çıkış sebepleri:</b> (1) kabileler arasındaki kullanım farkı, (2) iki mânâ arasındaki ortak mânânın unutulması (kur’ = periyot), (3) mecâzın yaygınlaşıp örfî hakikat olması.</p><p><b>Hükmü:</b> Lafızda asıl olan müşterek olmamaktır. Müşterekse karîne olmadıkça bir mânâ tercih edilmez. Bütün mânâlarının birden kastedilmesi (“umûmü’l-müşterek”):</p><ul><li><b>Hanefîlerin çoğu</b>: Câiz değil; vaz‘a aykırı. (Secde âyetindeki “sücûd” boyun eğmek mânâsında manevî müşterektir.)</li><li><b>Şâfiîler</b>: Câiz; Hac 22/18 delil.</li><li>Bazı Hanefîler: <b>nefiyde</b> câiz, ispatta değil. Bu yüzden “mevlâlarıma vasiyet” bâtıldır (meçhul), “falancanın mevlâlarıyla konuşmayacağım” yemini ikisini de kapsar.</li></ul>',
 ex:[['أَلَمْ تَرَ أَنَّ اللَّهَ يَسْجُدُ لَهُ مَنْ فِي السَّمَاوَاتِ وَمَنْ فِي الْأَرْضِ','Hac 22/18: Şâfiîlerin delili.'],['وَالْمُطَلَّقَاتُ يَتَرَبَّصْنَ بِأَنْفُسِهِنَّ ثَلَاثَةَ قُرُوءٍ','Şâfiîler: “selâse”nin müennesliği ma‘dûdun müzekker (tuhr) olduğunu gösterir; Hanefîler: “selâse” hâss → hayız.']],
 q:[['“Mevlâ” lafzı neden müşterektir?',['Âzâd eden ve âzâd edilen için ayrı ayrı konmuştur','Tek vaz‘la çok fert','Mecâzdır','Mücmeldir'],0,'Lafzî müşterek.'],['Bazı Hanefîlere göre “Falancanın mevlâlarıyla konuşmayacağım” diyen?',['Hangisiyle konuşsa yemini bozulur','Yalnız âzâd edenle','Yalnız âzâd edilenle','Yemin bâtıl'],0,'Müşterek nefiyden sonra umûm ifade eder.'],['Lafızda asıl olan nedir?',['Müşterek olmamak','Müşterek olmak','Mecâz','Kinâye'],0,'İhtimal varsa müşterek olmamak tercih edilir.']]},
/* ---------------- 2. AYRIM: İSTİ‘MÂL ---------------- */
{id:'l16',g:2,s:'§ 272/a',t:'Hakikat, mecâz, sarîh, kinâye',ar:'الْحَقِيقَةُ وَالْمَجَازُ وَالصَّرِيحُ وَالْكِنَايَةُ',
 tr:'<p class="small muted">Müellif bu ayrımı Beyân ilminin konusu sayıp işlemez; mütercim Abdülkerim Zeydân’dan özetle eklemiştir.</p><ul><li><b>Hakikat</b>: konduğu mânâda kullanılan lafız — <i>lügavî</i> (şems, kamer), <i>şer‘î</i> (salât, zekât, nikâh), <i>örfî</i> (genel: otomobil, dâbbe; özel: merfû, had, mâhiyet, tekâdüm, fesih). Hükmü: mânâsı sabit olur ve mecâza tercih edilir. “Ahmed’in çocuğu”na vasiyete torun girmez.</li><li><b>Mecâz</b>: hakikatin kastedilmediğini gösteren bir <i>alâka</i> veya <i>karîne</i> sebebiyle başka mânâda kullanılan lafız. Alâka benzerlikse <b>istiâre</b>, başka ise <b>mecâz-ı mürsel</b> (cüz’-küll: “rakabe” = köle; “parmaklar” = parmak uçları). Karîne hissî, hâlî/âdî veya şer‘î olur. Hükmü: “Kelâmda asıl olan mânâ-yı hakikîdir” (Mecelle 12); “Mânâ-yı hakikî müteazzir oldukta mecâza gidilir” (61); “İ‘mâl-i kelâm ihmâlinden evlâdır” (60).</li><li><b>Sarîh</b>: çok kullanılmaktan ötürü mânâsı açık lafız (hakikat: “sattım”; mecâz: “köye sor”). Hükmü: niyete bakılmadan gereği sabit olur.</li><li><b>Kinâye</b>: mânâsı hemen zihne gelmeyen, kapalı lafız (“dilediğin yere git”). Hükmü: ancak niyet veya hâlin delâletiyle sabit olur.</li></ul>',
 ex:[['وَمَنْ قَتَلَ مُؤْمِنًا خَطَأً فَتَحْرِيرُ رَقَبَةٍ مُؤْمِنَةٍ','Nisâ 4/92: “rakabe” cüz’ zikredilip küll kastedilmiştir.'],['يَجْعَلُونَ أَصَابِعَهُمْ فِي آذَانِهِمْ','Bakara 2/19: parmaklar = parmak uçları.'],['وَاسْأَلِ الْقَرْيَةَ','Yûsuf 12/82: mecâz ama sarîh.']],
 q:[['“Sattım – aldım” denince ne olur?',['Niyete bakılmadan satış kurulur (sarîh)','Niyet sorulur','Kinâyedir','Mecâzdır'],0,'Sarîhin hükmü.'],['Mecâzda alâka benzerlik ise adı?',['İstiâre','Mecâz-ı mürsel','Kinâye','Sarîh'],0,'Aslan Mehmet.'],['“Dilediğin yere git” sözüyle talâk?',['Niyet veya hâlin delâletiyle sabit olur','Her hâlde vâki','Hiç vâki olmaz','Üç talâk olur'],0,'Kinâye.'],['“Salât” lafzının namaz anlamı nasıl bir hakikattir?',['Şer‘î hakikat','Lügavî hakikat','Örfî hakikat','Mecâz'],0,'Şâri‘in koyduğu mânâ.']]},
/* ---------------- 3. AYRIM: AÇIKLIK-KAPALILIK ---------------- */
{id:'l17',g:3,s:'§ 273–277',t:'Zâhir ve nass',ar:'الظَّاهِرُ وَالنَّصُّ',
 tr:'<p>Açık lafızlarda mânâ için açıklamaya veya harici karîneye ihtiyaç yoktur; kapalılarda vardır. Hanefîler açıklık derecesine göre: <b>zâhir, nass, müfesser, muhkem</b>; kapalılık derecesine göre: <b>hafî, müşkil, mücmel, müteşâbih</b>.</p><ul><li><b>Zâhir</b>: mânâsına açıkça delâlet eden, te’vil ve tahsîse açık olan ve <b>sözün asıl sevk sebebi olmayan</b> lafız. Hükmü: aksine delil olmadıkça zâhire göre amel; âmmsa umûmu, mutlaksa ıtlakı, hâssa hakikati üzere.</li><li><b>Nass</b>: mânâsına açık delâlet eden, <b>sözün asıl sevk sebebi olan</b>, te’vil ve tahsîse açık lafız. Hükmü zâhir gibi; ama te’vil ihtimali daha azdır.</li></ul>',
 ex:[['ذَٰلِكَ بِأَنَّهُمْ قَالُوا إِنَّمَا الْبَيْعُ مِثْلُ الرِّبَا ۗ وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا','Bakara 2/275: alım-satımın helâl, ribânın haram oluşu <b>zâhir</b>; ikisinin aynı olmadığı (müşrikleri red) <b>nass</b>.'],['فَانْكِحُوا مَا طَابَ لَكُمْ مِنَ النِّسَاءِ مَثْنَىٰ وَثُلَاثَ وَرُبَاعَ ۖ فَإِنْ خِفْتُمْ أَلَّا تَعْدِلُوا فَوَاحِدَةً','Nisâ 4/3: evliliğin câizliği zâhir; sayının dörtle (adalet endişesinde birle) sınırlanması nass.']],
 q:[['Zâhir ile nass arasındaki fark nedir?',['Nass sözün asıl sevk sebebidir, zâhir değildir','Zâhir te’vile kapalıdır','Nass mücmeldir','Fark yok'],0,'İkisi de te’vil ve tahsîse açıktır.'],['Nisâ 4/3’te evliliğin câiz olduğu hükmü nedir?',['Zâhir','Nass','Müfesser','Muhkem'],0,'Asıl maksat sayının sınırlanmasıdır.']]},
{id:'l18',g:3,s:'§ 278–285',t:'Müfesser, muhkem ve teâruz',ar:'الْمُفَسَّرُ وَالْمُحْكَمُ',
 tr:'<ul><li><b>Müfesser</b>: hükme açıkça delâlet eden, <b>te’vil ve tahsîse kapalı</b> lafız; açıklanmış mücmel de müfesserdir (salât, zekât, hac). Hükmü: kesin amel; yalnız Hz. Peygamber hayattayken nesih ihtimali vardı.</li><li><b>Muhkem</b>: te’vil, tahsîs ve — Hz. Peygamber’in hayatında dahi — <b>nesih ihtimali olmayan</b> lafız: tevhid ve iman esasları, adalet ve ahde vefâ gibi fazilet ilkeleri, süreklilik bildiren naslar.</li></ul><p><b>Güç sırası:</b> muhkem &gt; müfesser &gt; nass &gt; zâhir. Teâruzda güçlü olan tercih edilir:</p><ul><li><b>Zâhir–nass</b>: Nisâ 4/24 (“bunların dışındakiler helâl”, zâhiren dörtten fazla) &lt; Nisâ 4/3 (dörtle sınır, nass).</li><li><b>Nass–müfesser</b>: Müstehâza hadisi “her namaz için” (nass, “vakti” takdiri mümkün) &lt; “her namaz vakti için” (müfesser) → Hanefî fıkhı: her vakit için bir abdest.</li><li><b>Muhkem–nass</b>: Nisâ 4/24 (nass) &lt; Ahzâb 33/53 (Peygamber’in hanımlarıyla asla evlenilmez; muhkem). Müfesser–muhkem için sahih örnek yoktur.</li></ul><p><b>Hanefî dışı ıstılah:</b> Zâhir = zannî delâlet (te’vil edilirse “müevvel”); nass = kat‘î, başka ihtimale kapalı (Hanefîlerin müfesseri gibi); muhkem = zâhir ve nassı kapsar. Fark terimseldir.</p>',
 ex:[['وَالَّذِينَ يَرْمُونَ الْمُحْصَنَاتِ ثُمَّ لَمْ يَأْتُوا بِأَرْبَعَةِ شُهَدَاءَ فَاجْلِدُوهُمْ ثَمَانِينَ جَلْدَةً','Nûr 24/4: müfesser (sayı eksiklik-fazlalığa kapalı).'],['وَمَا كَانَ لَكُمْ أَنْ تُؤْذُوا رَسُولَ اللَّهِ وَلَا أَنْ تَنْكِحُوا أَزْوَاجَهُ مِنْ بَعْدِهِ أَبَدًا','Ahzâb 33/53: muhkem.'],['الْجِهَادُ مَاضٍ مُنْذُ بَعَثَنِيَ اللَّهُ…','Hadis: süreklilik → muhkem.']],
 q:[['Açıklık güç sırası hangisidir?',['Muhkem > müfesser > nass > zâhir','Zâhir > nass > müfesser > muhkem','Nass > zâhir > muhkem > müfesser','Müfesser > muhkem > nass > zâhir'],0,'Teâruzda güçlü tercih edilir.'],['Muhkemi müfesserden ayıran nedir?',['Hz. Peygamber’in hayatında da neshe kapalı olması','Te’vile açık olması','Mücmel olması','Haber-i vâhid olması'],0,'Müfesser o dönemde neshe açıktı.'],['Müstehâza hadisinde Hanefîler hangi rivayeti tercih eder?',['“Her namaz vakti için” (müfesser)','“Her namaz için” (nass)','İkisini birden','Hiçbirini'],0,'Müfesser nassa tercih edilir.'],['Hanefî dışındakilere göre “nass” Hanefîlerin hangi terimine denktir?',['Müfesser','Zâhir','Muhkem','Mücmel'],0,'Kat‘î, başka ihtimale kapalı.']]},
{id:'l19',g:3,s:'§ 286–288',t:'Te’vil: mânâsı, şartları, nevileri',ar:'التَّأْوِيلُ',
 tr:'<p><b>Te’vil</b>: lafzın zâhir mânâsından alınıp bir delile binaen zâhir olmayan başka bir mânâya çekilmesidir (hâssı mecâza, âmmı bir kısım fertlerine — buna tahsîs denir).</p><p><b>Şartları:</b></p><ol><li>Lafız te’vili kabul etmeli (Hanefîde zâhir ve nass; diğerlerinde zâhir). Müfesser ve muhkem te’vil edilmez.</li><li>Te’vil edilen mânâ, lafzın mecâzen de olsa muhtemel olduğu mânâ olmalı.</li><li>Elverişli bir şer‘î delile (nass, icmâ, kıyas veya hukukun genel prensibi) dayanmalı.</li></ol><p><b>Nevileri:</b> <b>Karîb</b> (hatıra kolay gelen; herhangi bir delil yeter): “namaza kalktığınızda” = namaza azmettiğinizde. <b>Ba‘îd</b> (uzak; güçlü delil gerekir): Fîrûz ed-Deylemî hadisinde “dilediğini tut” sözünü Hanefîlerin “tek akitle evlendiysen birini yeniden nikâhla, ayrı akitle ise öncekini tut” diye kıyasla yorumlaması — müellife göre isabetsiz.</p>',
 ex:[['إِذَا قُمْتُمْ إِلَى الصَّلَاةِ فَاغْسِلُوا وُجُوهَكُمْ','Mâide 5/6: karîb te’vil.'],['أَمْسِكْ أَيَّتَهُمَا شِئْتَ وَفَارِقِ الْأُخْرَى','Fîrûz hadisi: ba‘îd te’vil.']],
 q:[['Hangisi te’vil kabul etmez?',['Müfesser','Zâhir','Nass','Hepsi kabul eder'],0,'Müfesser ve muhkem.'],['Ba‘îd te’vil için ne gerekir?',['Uzaklığı telafi eden güçlü delil','Herhangi bir delil','Hiç delil','Örf'],0,'Karîbde herhangi bir delil yeter.'],['Müellif Fîrûz hadisindeki Hanefî te’vilini nasıl değerlendirir?',['Uzak ve isabetsiz','Karîb ve isabetli','Muhkem','Mücmel'],0,'Yeni müslümana beyan edilmeden bu hüküm kastedilemez.']]},
{id:'l20',g:3,s:'§ 289–292',t:'Hanefî te’villerinden üç örnek',
 tr:'<p>Şâfiîler, Hanefîlerin birçok te’vilini “uzak” saymıştır. Müellif üç örnekte karar verir:</p><ol><li><b>“Kırk koyunda bir koyun”</b>: Hanefî — kıymet verilebilir; Şâfiî, Mâlikî, Hanbelî — aynen koyun. <b>Tercih: Hanefî</b>; Muâz’ın Yemen’den elbise alması ve zekâtın hikmeti (fakirin ihtiyacı).</li><li><b>“Altmış fakiri doyursun”</b> (Mücâdele 58/4): Hanefî — altmış fakirin yiyeceği; bir fakire altmış gün de olur. Şâfiî — zikredilmeyen “taâm” takdir ediliyor, zikredilen “altmış” ilga ediliyor; toplulukta bereket ve dua var. <b>Tercih: Şâfiî</b> (Kemâl b. Hümâm da katılır).</li><li><b>“Ceninin tezkiyesi annesinin tezkiyesidir”</b>: Ebû Hanîfe — teşbih: canlı çıkarsa annesi gibi kesilir; ölü çıkarsa yenmez. Şâfiî — teşbih takdiri kural dışı; soru ölü cenin hakkındaydı; “annesinin tezkiyesiyledir” rivayeti müfesserdir. <b>Tercih: Şâfiî</b> (Mâlik, Ahmed, İmâmeyn de böyle).</li></ol>',
 ex:[['فَمَنْ لَمْ يَسْتَطِعْ فَإِطْعَامُ سِتِّينَ مِسْكِينًا','Mücâdele 58/4.'],['ذَكَاةُ الْجَنِينِ ذَكَاةُ أُمِّهِ','Hadis.']],
 q:[['Koyun yerine kıymet meselesinde müellif kimi tercih eder?',['Hanefîleri','Şâfiîleri','Mâlikîleri','Zâhirîleri'],0,'Muâz’ın uygulaması ve teşrî hikmeti.'],['“Altmış fakir” meselesinde tercih?',['Şâfiî: altmış ayrı fakir','Hanefî: bir fakire altmış gün','Kıymet','Hiçbiri'],0,'Hanefîlerden Kemâl b. Hümâm da katılır.'],['Cenin hadisinde Ebû Hanîfe’nin te’vili nedir?',['Teşbih: canlı çıkarsa annesi gibi kesilir','Ölü çıksa da helâl','Hadis mansûh','Hadis mücmel'],0,'Şâfiîlere göre uzak te’vil.']]},
{id:'l21',g:3,s:'§ 293–297',t:'Hafî ve müşkil',ar:'الْخَفِيُّ وَالْمُشْكِلُ',
 tr:'<ul><li><b>Hafî</b>: kapsamında birçok fert bulunup, <b>sîgası dışındaki bir engel</b> yüzünden bazı fertlere delâleti açık olmayan ve bunun anlaşılması inceleme-içtihada muhtaç lafız. Örnek: “es-sârik” <i>tarrâr</i> (yankesici) ve <i>nebbâş</i> (kefen soyucu) için hafîdir. Yankesici: hırsızlıktan daha fazlasını yapar → ittifakla el kesilir. Kefen soyucu: Ebû Hanîfe ve Muhammed’e göre hırz, mal ve başkasının mülkü şartları eksik → had yok, ta‘zîr var; Ebû Yûsuf ve üç imama göre hırsızlığın bir türü → had.<br>Hükmü: iyice inceledikten sonra amel; ilgili naslara ve hükmün gayesine bakılır.</li><li><b>Müşkil</b>: kastedilen mânâsı ancak onu kuşatan karîne ve emâreler incelenerek anlaşılabilen lafız; birden fazla vaz‘ ile konmuş veya mecâzı yaygınlaşmış. Örnek: Bakara 2/223’teki “ennâ” (nereden / nasıl) — “hars” (tarla) kelimesi “nasıl” mânâsını gösterir; ve “kur’”. Hükmü: muhtemel mânâlardan kastedileni karînelerle tespit için içtihat.</li></ul>',
 ex:[['نِسَاؤُكُمْ حَرْثٌ لَكُمْ فَأْتُوا حَرْثَكُمْ أَنَّىٰ شِئْتُمْ','Bakara 2/223: “ennâ” müşkil.'],['قَالَ رَبِّ أَنَّىٰ يَكُونُ لِي غُلَامٌ','Meryem 19/8: “ennâ” = nasıl.'],['يَا مَرْيَمُ أَنَّىٰ لَكِ هَٰذَا','Âl-i İmrân 3/37: “ennâ” = nereden.']],
 q:[['Hafîdeki kapalılık nereden gelir?',['Sîga dışındaki bir engelden','Sîganın kendisinden','Garâbetten','Müteşâbihlikten'],0,'Tarrâr ve nebbâş örneği.'],['Yankesiciye el kesme cezası?',['İttifakla uygulanır','Uygulanmaz','İhtilaflı','Ta‘zîr'],0,'Hırsızlıktan daha fazlasını işler.'],['Bakara 2/223’teki “ennâ”yı hangi karîne “nasıl” mânâsına çeker?',['“Hars” (tarla) kelimesi','Hadis','Kıyas','İcmâ'],0,'Hars nesil mahallidir.']]},
{id:'l22',g:3,s:'§ 298–302/a',t:'Mücmel ve müteşâbih',ar:'الْمُجْمَلُ وَالْمُتَشَابِهُ',
 tr:'<ul><li><b>Mücmel</b>: sözün sahibi açıklamadıkça kastedilen mânâsı anlaşılamayan lafız. Üç nevi: (1) tercih karînesi olmayan müşterek (Hanefîlere göre “mevlâlarıma vasiyet”), (2) sözlük mânâsından özel şer‘î mânâya nakledilen lafız (salât, zekât, hac), (3) garâbet (“helû‘an”: Meâric 70/19-21’de açıklanmıştır).<br>Hükmü: açıklama gelmedikçe amel edilmez. Beyan tamsa <b>müfesser</b>e, eksikse <b>müşkil</b>e dönüşür: “ribâ” altı mal hadisiyle açıklanmış, illet (keyl-vezn, iktiyât, iddihâr…) içtihada kalmıştır.</li><li><b>Müteşâbih</b>: mânâsı dünyada hiç kimse tarafından veya ancak ilimde üstün kişilerce bilinebilecek ölçüde kapalı lafız. Ahkâm âyet ve hadislerinde yoktur. Örnekler: hurûf-ı mukattaa; Allah’a nispet edilen el, göz, yüz; gelme ve inme fiilleri. Müellife göre bu konu usulcülerin değil kelâmcıların işidir.</li></ul><p><b>Hanefî dışındakiler</b> kapalılıkta yalnız mücmel ve müteşâbihi zikreder; tariflere göre ikisi arasında fark yoktur ve Hanefîlerin dört nevisini kapsar.</p>',
 ex:[['إِنَّ الْإِنْسَانَ خُلِقَ هَلُوعًا ۝ إِذَا مَسَّهُ الشَّرُّ جَزُوعًا ۝ وَإِذَا مَسَّهُ الْخَيْرُ مَنُوعًا','Meâric 70/19-21: garâbetin açıklanması.'],['الذَّهَبُ بِالذَّهَبِ وَالْفِضَّةُ بِالْفِضَّةِ… مِثْلًا بِمِثْلٍ يَدًا بِيَدٍ','Ribâ hadisi: eksik beyan → müşkil.'],['يَدُ اللَّهِ فَوْقَ أَيْدِيهِمْ','Fetih 48/10: müteşâbih.']],
 q:[['Beyanı tam olan mücmel neye dönüşür?',['Müfesser','Müşkil','Muhkem','Hafî'],0,'Salât, zekât, hac.'],['Ribâ lafzı altı mal hadisinden sonra?',['Müşkil olur (illet içtihada kalır)','Müfesser olur','Muhkem olur','Mücmel kalır'],0,'Beyan tam değil.'],['Ahkâm âyetlerinde müteşâbih var mıdır?',['Yoktur','Çoktur','Yalnız haddlerde','Yalnız ibadetlerde'],0,'Tümevarımla tespit edilmiştir.'],['“Helû‘an” lafzındaki icmâlin sebebi?',['Garâbet','Müştereklik','Şer‘î nakil','Teşbih'],0,'Âyet hemen açıklamıştır.']]},
/* ---------------- 4. AYRIM: DELÂLET ŞEKLİ ---------------- */
{id:'l23',g:4,s:'§ 303',t:'İbârenin delâleti',ar:'دَلَالَةُ الْعِبَارَةِ',
 tr:'<p>Hanefîlere göre delâlet dört nevidir: ibâre, işâret, delâlet (nassın delâleti), iktizâ; bunların dışında kalanlar bâtıl dayanaklardır.</p><p><b>İbârenin delâleti</b>: lafzın, nassın gelişindeki <b>aslî maksat</b> olan veya ona <b>tâbi olarak kastedilen</b> hükme delâletidir. İkisi de ibâredir.</p>',
 ex:[['وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا','İbâreyle iki hüküm: (1) alım-satım helâl, ribâ haram (tebe‘î); (2) ikisi aynı değildir (aslî).'],['فَانْكِحُوا مَا طَابَ لَكُمْ… فَإِنْ خِفْتُمْ أَلَّا تَعْدِلُوا فَوَاحِدَةً','İbâreyle üç hüküm: evlenme mubah (tebe‘î); haksızlık endişesi yoksa dörde kadar câiz ve endişe varsa bir kadın vâcib (aslî).']],
 q:[['Nassın tebe‘î olarak kastettiği hükme delâlet hangi nevidir?',['İbâre','İşâret','Delâlet','İktizâ'],0,'Aslî ve tebe‘î, ikisi de ibâredir.'],['Hanefîlere göre dört delâletin dışında kalanlar?',['Bâtıl dayanaklardır','Mefhûm-i muhâlif olarak hüccettir','Kıyastır','İcmâdır'],0,'Mefhûm-i muhâlifi kabul etmezler.']]},
{id:'l24',g:4,s:'§ 304–305',t:'İşâretin delâleti',ar:'دَلَالَةُ الْإِشَارَةِ',
 tr:'<p><b>İşâretin delâleti</b>: lafzın, nassın gelişinde aslî veya tebe‘î olarak kastedilmeyen fakat asıl maksat olan mânânın <b>gerekli kıldığı</b> hükme delâletidir; sözün doğruluğu ona bağlı değildir. (Sadru’ş-Şerîa: işâretle anlaşılan da tebe‘î olarak kastedilmiştir; müellif buna katılır.) Bazen az düşünmekle anlaşılır, bazen derin inceleme ister.</p><p><b>Açık örnekler:</b> (1) Bakara 2/233: ibâreyle annenin nafakası babaya ait ve çocuk babaya nispet edilir; işâretle çocuğun nafakası yalnız babaya ait (“nimet-külfet” prensibi), babası Kureyşli olan çocuk Kureyşli sayılır, muhtaç babanın çocuğunun malını temellük edebilmesi. (2) Bakara 2/187: ibâreyle fecre kadar cinsî birleşme mubah; işâretle cünüp olarak sabahlayanın orucu sahih.</p><p><b>Kapalı örnek:</b> Ahkâf 46/15 (hamile ve sütten kesme otuz ay) + Lokmân 31/14 (sütten kesme iki yıl) → en az hamilelik altı ay. Bunu Hz. Ali veya İbn Abbâs fark etmiş; altı ayda doğuran kadına ceza uygulanmamıştır.</p>',
 ex:[['وَعَلَى الْمَوْلُودِ لَهُ رِزْقُهُنَّ وَكِسْوَتُهُنَّ بِالْمَعْرُوفِ','Bakara 2/233.'],['أُحِلَّ لَكُمْ لَيْلَةَ الصِّيَامِ الرَّفَثُ إِلَىٰ نِسَائِكُمْ','Bakara 2/187.'],['وَحَمْلُهُ وَفِصَالُهُ ثَلَاثُونَ شَهْرًا','Ahkâf 46/15.'],['وَفِصَالُهُ فِي عَامَيْنِ','Lokmân 31/14.']],
 q:[['En az hamilelik süresinin altı ay olduğu hangi delâletle anlaşılır?',['İşâret','İbâre','Nassın delâleti','İktizâ'],0,'İki âyetin birlikte ele alınması.'],['Bakara 2/187’den cünüp sabahlayanın orucunun sahih olduğu?',['İşâretle','İbâreyle','İktizâ ile','Mefhûm-i muhâlifle'],0,'Fecre kadar birleşmenin mubahlığının lâzımı.'],['“Nimet ve külfet karşılıklıdır” prensibi hangi işârî hükmü destekler?',['Çocuğun nafakasının yalnız babaya ait olması','Annenin nafakası','Emzirme süresi','Kureyşlilik'],0,'Nesep babaya aitse nafaka da onundur.']]},
{id:'l25',g:4,s:'§ 306–307',t:'Nassın delâleti ve iktizânın delâleti',ar:'دَلَالَةُ النَّصِّ وَدَلَالَةُ الِاقْتِضَاءِ',
 tr:'<p><b>Nassın delâleti</b>: sözün, içtihada gerek olmadan <b>sırf dil bilgisiyle anlaşılan illetteki ortaklık</b> sebebiyle, nasta belirtilmeyen (meskût anh) durum hakkında da hükmün sabit olduğunu göstermesidir. Meskût anh hükme daha lâyık (evleviyet) veya eşit olabilir. Diğer adları: <i>fahve’l-hitâb</i>, Şâfiîlerde <b>mefhûm-i muvâfaka</b>; Şâfiî’nin er-Risâle’sinde “kıyâs-ı celî”. Cumhura göre kıyastan farklıdır: illet dille tespit edilir.</p><p><b>İktizânın delâleti</b>: sözün, <b>doğruluğu veya şer‘an sağlıklı anlaşılması kendisine bağlı</b> olan ve ibârede yer almayan bir “lâzım”a delâletidir.</p>',
 ex:[['فَلَا تَقُلْ لَهُمَا أُفٍّ وَلَا تَنْهَرْهُمَا','İsrâ 17/23: dövmek, sövmek evleviyetle haram.'],['إِنَّ الَّذِينَ يَأْكُلُونَ أَمْوَالَ الْيَتَامَىٰ ظُلْمًا','Nisâ 4/10: yakmak, israf eşit derecede haram.'],['','Talâkla ayrılanın iddeti → fesihle ayrılan kadına da (illet: rahmin boş olduğunun belirlenmesi).'],['رُفِعَ عَنْ أُمَّتِي الْخَطَأُ وَالنِّسْيَانُ وَمَا اسْتُكْرِهُوا عَلَيْهِ','İktizâ: “günahı” kelimesi takdir edilir.'],['لِلْفُقَرَاءِ الْمُهَاجِرِينَ الَّذِينَ أُخْرِجُوا مِنْ دِيَارِهِمْ وَأَمْوَالِهِمْ','Haşr 59/8: muhacirlerin Mekke’deki mallarının mülkiyetini kaybettikleri — müellife göre iktizâ (birçok usulcüye göre işâret; Şâfiîlere göre “fakir” mecâz).'],['','“Bu gayrimenkulünü benim adıma bine tasadduk et” → önce “bana sat” takdir edilir: iktizâ.']],
 q:[['“Öf deme” âyetinden dövmenin haramlığı hangi delâletle?',['Nassın delâleti (evleviyet)','İbâre','İşâret','İktizâ'],0,'Mefhûm-i muvâfaka.'],['Cumhura göre nassın delâletini kıyastan ayıran nedir?',['İllet dil ile anlaşılır, içtihat gerekmez','İllet yoktur','Kıyas daha güçlüdür','Fark yok'],0,'Kıyasta illet istinbâtla bulunur.'],['“Ümmetimden hata ve unutma kaldırıldı” hadisinde “günahı” takdiri?',['İktizâ','İşâret','İbâre','Nassın delâleti'],0,'Söz vâkıaya ters düşmesin diye.']]},
{id:'l26',g:4,s:'§ 308',t:'Delâletlerin hükmü ve teâruzu',
 tr:'<p>Dört delâletle hüküm, tahsîs veya te’vil gibi bir delil olmadıkça <b>kat‘î</b> olarak sabit olur. Nassın delâleti kıyastan güçlüdür.</p><p><b>Kuvvet sırası:</b> ibâre &gt; işâret &gt; nassın delâleti &gt; iktizâ (en zayıf). Teâruzda güçlü olan tercih edilir:</p><ul><li><b>İbâre–işâret</b>: Bakara 2/178 (ibâreyle kasıtlı öldürmede kısas) ile Nisâ 4/93 (işâretle yalnız ebedî cehennem; beyan makamında yetinmek hasr ifade eder) → ibâre tercih: kısas vardır. (Hayız süresi hadisleri de örnek verilir ama ikinci hadis sahih değildir.)</li><li><b>İşâret–nassın delâleti</b>: Nisâ 4/92 delâletle kasıtlı öldürmede evleviyetle kefâret (Şâfiî) ↔ Nisâ 4/93 işâretle kefâret yok → işâret tercih: <b>Hanefîlere göre kasıtlı öldürmede kefâret yoktur</b>.</li><li>İktizâ ile diğerlerinin teâruzuna sahih örnek yoktur.</li></ul>',
 ex:[['كُتِبَ عَلَيْكُمُ الْقِصَاصُ فِي الْقَتْلَى','Bakara 2/178: ibâre.'],['وَمَنْ يَقْتُلْ مُؤْمِنًا مُتَعَمِّدًا فَجَزَاؤُهُ جَهَنَّمُ خَالِدًا فِيهَا','Nisâ 4/93: işâret.'],['وَمَنْ قَتَلَ مُؤْمِنًا خَطَأً فَتَحْرِيرُ رَقَبَةٍ مُؤْمِنَةٍ','Nisâ 4/92: nassın delâleti.']],
 q:[['Delâletlerin kuvvet sırası?',['İbâre > işâret > delâlet > iktizâ','İşâret > ibâre > iktizâ > delâlet','Delâlet > ibâre > işâret > iktizâ','İktizâ > delâlet > işâret > ibâre'],0,'İktizâ en zayıftır.'],['Hanefîlere göre kasıtlı öldürmede kefâret?',['Yoktur (işâret, delâlete tercih)','Vardır (evleviyet)','İhtilaflı','Kıymet'],0,'Nisâ 4/93’ün işâreti.'],['Kasıtlı öldürmede kısasın varlığı hangi delâletin tercihiyledir?',['İbâre, işârete','İşâret, ibâreye','Delâlet, iktizâya','İktizâ, delâlete'],0,'Bakara 2/178.']]},
{id:'l27',g:4,s:'§ 309–313',t:'Mantûk ve mefhûm; mefhûm-i muhâlif türleri',ar:'الْمَنْطُوقُ وَالْمَفْهُومُ',
 tr:'<p><b>Cumhura</b> (Mâlikî, Şâfiî ve diğerleri) göre delâlet ikidir:</p><ul><li><b>Mantûk</b>: sözde zikredilen şeyin hükmüne delâlet (Hanefîlerin ibâre, işâret ve iktizâsını kapsar).</li><li><b>Mefhûm</b>: sözde zikredilmeyen şeyin hükmüne delâlet: <b>mefhûm-i muvâfaka</b> (= nassın delâleti; fahve’l-hitâb, lahnü’l-hitâb, kıyâs-ı celî) ve <b>mefhûm-i muhâlefe</b>: mantûkun hükmü, hükümde dikkate alınan kayıtlardan birini taşımayan meskût anh için geçerli değildir.</li></ul><p><b>Mefhûm-i muhâlif türleri:</b></p><ol><li><b>Sıfat</b>: “Sâime koyunlarda zekât vardır” → besi koyununda yok; “taksim edilmemiş her ortaklıkta şuf‘a” → taksimden sonra yok; “zenginin oyalaması zulümdür” → fakirinki değil.</li><li><b>Şart</b>: “Hamile iseler nafakalarını verin” (Talâk 65/6) → hamile olmayan bâine nafaka yok; “karşılık almadıkça vâhib hibesinde daha haklıdır” → karşılık almışsa rücû yok.</li><li><b>Gâye</b>: “fecrin beyaz ipliği ayırt edilinceye kadar yiyin” → sonra haram; “geceye kadar orucu tamamlayın” → sonra vücûb kalkar.</li><li><b>Aded</b>: “yüz değnek” → fazlası câiz değil; “beş devede bir koyun” → beşten az olana zekât yok.</li></ol>',
 ex:[['فِي سَائِمَةِ الْغَنَمِ الزَّكَاةُ','Sıfat.'],['وَإِنْ كُنَّ أُولَاتِ حَمْلٍ فَأَنْفِقُوا عَلَيْهِنَّ حَتَّىٰ يَضَعْنَ حَمْلَهُنَّ','Talâk 65/6: şart.'],['حَتَّىٰ يَتَبَيَّنَ لَكُمُ الْخَيْطُ الْأَبْيَضُ مِنَ الْخَيْطِ الْأَسْوَدِ مِنَ الْفَجْرِ ۖ ثُمَّ أَتِمُّوا الصِّيَامَ إِلَى اللَّيْلِ','Bakara 2/187: gâye.'],['فَاجْلِدُوا كُلَّ وَاحِدٍ مِنْهُمَا مِائَةَ جَلْدَةٍ','Nûr 24/2: aded.'],['مَطْلُ الْغَنِيِّ ظُلْمٌ','Hadis: sıfat.']],
 q:[['Cumhura göre mantûk Hanefîlerin hangi delâletlerini kapsar?',['İbâre, işâret, iktizâ','Yalnız ibâre','Nassın delâleti','Hepsi'],0,'Nassın delâleti mefhûm-i muvâfakadır.'],['“Sâime koyunda zekât” hadisinden besi koyununda zekât olmaması?',['Mefhûmü’s-sıfa','Mefhûmü’ş-şart','Mefhûmü’l-gâye','Mefhûmü’l-aded'],0,'Kayıt: sâime vasfı.'],['“Hamile iseler nafakalarını verin” âyetinin mefhûm-i muhâlifi?',['Hamile olmayan bâin boşanmışa nafaka yok','Hepsine nafaka var','Nafaka mekruh','Ric‘î boşanmışa yok'],0,'Mefhûmü’ş-şart.'],['Mefhûm-i muvâfaka Hanefîlerde neye denktir?',['Nassın delâleti','İşâret','İktizâ','İbâre'],0,'Fahve’l-hitâb.']]},
{id:'l28',g:4,s:'§ 314–315',t:'Mefhûm-i muhâlifin şartları ve hücciyeti',
 tr:'<p><b>Şart:</b> Kaydın, kalktığında hükmün de kalkacağını göstermek dışında bir faydası olmamalıdır. Başka bir maksat varsa mefhûm-i muhâlif dikkate alınmaz:</p><ul><li><b>Nimeti hatırlatmak</b>: “taze et” (Nahl 16/14) — taze olmayan haram değil.</li><li><b>Âdete uygun ifade</b>: “evlerinizdeki üvey kızlarınız” (Nisâ 4/23).</li><li><b>Vâkıayı kötülemek</b>: “kat kat ribâ” (Âl-i İmrân 3/130) — az ribâ mubah değil.</li><li><b>İtaate teşvik</b>: “Allah’a ve âhiret gününe inanan kadın” (yas hadisi).</li><li><b>Çokluk ve mübalağa</b>: “yetmiş defa istiğfar etsen” (Tevbe 9/80).</li></ul><p><b>Hücciyet:</b> İnsan sözlerinde ve yazarların ifadelerinde ittifakla hüccettir (“Kitapların mefhumları hüccettir”). Kur’ân ve Sünnet’te: <b>cumhur</b> — hüccettir; <b>Hanefîler</b> — değildir, çünkü Şâri‘in bütün maksatlarını kuşatamayız. Müellif cumhuru tercih eder: inceleme sonunda başka maksat bulunamazsa zann-ı gâlib hâsıl olur ve mefhûm zaten zannîdir.</p>',
 ex:[['لِتَأْكُلُوا مِنْهُ لَحْمًا طَرِيًّا','Nahl 16/14.'],['لَا تَأْكُلُوا الرِّبَا أَضْعَافًا مُضَاعَفَةً','Âl-i İmrân 3/130.'],['إِنْ تَسْتَغْفِرْ لَهُمْ سَبْعِينَ مَرَّةً فَلَنْ يَغْفِرَ اللَّهُ لَهُمْ','Tevbe 9/80.'],['وَرَبَائِبُكُمُ اللَّاتِي فِي حُجُورِكُمْ','Nisâ 4/23.']],
 q:[['“Kat kat ribâ” ifadesinin mefhûm-i muhâlifi alınır mı?',['Hayır; kayıt Câhiliye âdetini kötülemek içindir','Evet; az ribâ mubah','Evet; mekruh','İhtilaflı'],0,'Kaydın başka maksadı var.'],['Hanefîlere göre naslarda mefhûm-i muhâlif?',['Hüccet değildir','Hüccettir','Yalnız şartta hüccet','Yalnız adedde hüccet'],0,'Şâri‘in maksatları kuşatılamaz.'],['İnsan sözlerinde mefhûm-i muhâlif?',['İttifakla hüccettir','Hüccet değildir','İhtilaflı','Yalnız yazılı metinde'],0,'“Kitapların mefhumları hüccettir.”'],['“Yetmiş defa” kaydının maksadı?',['Çokluk ve mübalağa','Sayı sınırı','Şart','Gâye'],0,'Yetmişten fazlası farklı sonuç doğurmaz.']]}
];

function confetti(){const c=$('#cf');c.hidden=false;const x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#f2c867','#5fd3a0','#62c0ea','#bb94f0','#ff9f6e'];const P=Array.from({length:130},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,s:3+Math.random()*5,r:Math.random()*6,c:pick(cols)}));let f=0;(function go(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.beginPath();for(let k=0;k<5;k++){const a=k*1.2566,b=a+.628;x.lineTo(Math.cos(a)*p.s,Math.sin(a)*p.s);x.lineTo(Math.cos(b)*p.s*.45,Math.sin(b)*p.s*.45);}x.fill();x.restore();});if(++f<170)requestAnimationFrame(go);else c.hidden=true;})();}

const ANG={1:-90,2:0,3:90,4:180};
const SHORTAR={1:'الْوَضْعُ',2:'الِاسْتِعْمَالُ',3:'الظُّهُورُ وَالْخَفَاءُ',4:'كَيْفِيَّةُ الدَّلَالَةِ'};
function compassPos(){
  const pos={};const cx=380,cy=300;
  [1,2,3,4].forEach(g=>{const ls=LESSONS.filter(l=>l.g===g);const rings=ls.length>7?[[115,ls.slice(0,7)],[178,ls.slice(7)]]:[[150,ls]];
    rings.forEach(([r,arr])=>{const n=arr.length,step=r>150?11:13;arr.forEach((l,k)=>{const a=(ANG[g]+(k-(n-1)/2)*step)*Math.PI/180;pos[l.id]=[Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),a,r];});});});
  return pos;
}
function compassSVG(){
  const cx=380,cy=300,P=compassPos();const next=LESSONS.find(l=>lstar(l.id)<2)||LESSONS[0];
  let s=`<svg viewBox="0 0 760 600" role="img" aria-label="Lafız pusulası: dört ayrım ve dersler"><defs><radialGradient id="cg" cx="50%" cy="40%"><stop offset="0" stop-color="var(--panel2)"/><stop offset="1" stop-color="var(--panel)"/></radialGradient></defs>`;
  /* sektörler */
  [1,2,3,4].forEach(g=>{const a1=(ANG[g]-42)*Math.PI/180,a2=(ANG[g]+42)*Math.PI/180,r0=70,r1=222;
    s+=`<path d="M${cx+Math.cos(a1)*r0} ${cy+Math.sin(a1)*r0} L${cx+Math.cos(a1)*r1} ${cy+Math.sin(a1)*r1} A${r1} ${r1} 0 0 1 ${cx+Math.cos(a2)*r1} ${cy+Math.sin(a2)*r1} L${cx+Math.cos(a2)*r0} ${cy+Math.sin(a2)*r0} A${r0} ${r0} 0 0 0 ${cx+Math.cos(a1)*r0} ${cy+Math.sin(a1)*r0}z" fill="${GC(g)}" fill-opacity=".09" stroke="${GC(g)}" stroke-opacity=".3"/>`;});
  /* kadran */
  s+=`<circle cx="${cx}" cy="${cy}" r="230" fill="none" stroke="var(--line)" stroke-width="2"/>`;
  for(let d=0;d<360;d+=6){const a=d*Math.PI/180,l=d%30===0?12:5;s+=`<line x1="${cx+Math.cos(a)*230}" y1="${cy+Math.sin(a)*230}" x2="${cx+Math.cos(a)*(230-l)}" y2="${cy+Math.sin(a)*(230-l)}" stroke="var(--muted)" stroke-opacity=".5"/>`;}
  /* gül */
  const rose=(r,w,rot,op)=>{let p='';for(let k=0;k<4;k++){const a=(rot+k*90)*Math.PI/180,b=a+Math.PI/2;p+=`<path d="M${cx} ${cy} L${cx+Math.cos(a-w)*r*.28} ${cy+Math.sin(a-w)*r*.28} L${cx+Math.cos(a)*r} ${cy+Math.sin(a)*r} L${cx+Math.cos(a+w)*r*.28} ${cy+Math.sin(a+w)*r*.28}z" fill="var(--gold)" fill-opacity="${op}"/>`;}return p;};
  s+=rose(205,.5,-45,.08)+rose(222,.4,-90,.13);
  /* halkalar */
  [115,150,178].forEach(r=>s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-dasharray="2 6"/>`);
  /* etiketler */
  const lab={1:[cx,30],2:[688,cy-4],3:[cx,566],4:[72,cy-4]};
  [1,2,3,4].forEach(g=>{const [x,y]=lab[g];const ls=LESSONS.filter(l=>l.g===g),lit=ls.filter(l=>lstar(l.id)).length;
    s+=`<text x="${x}" y="${y}" text-anchor="middle" class="cn-ar" fill="${GC(g)}">${SHORTAR[g]}</text><text x="${x}" y="${y+20}" text-anchor="middle" class="cn-tr">${AYRIM[g].dir} · ${esc(AYR[g])} · ${lit}/${ls.length}</text>`;});
  /* ibre */
  const nn=next.g?P[next.id]:null;const deg=nn?(nn[2]*180/Math.PI+90):0;
  s+=`<g class="needle" style="transform:rotate(${deg}deg);transform-origin:${cx}px ${cy}px"><path d="M${cx} ${cy-96} L${cx+11} ${cy} L${cx} ${cy+30} L${cx-11} ${cy}z" fill="var(--gold)" opacity=".9"/><path d="M${cx} ${cy-96} L${cx+11} ${cy} L${cx} ${cy}z" fill="#000" opacity=".18"/></g>`;
  /* dersler */
  LESSONS.forEach(l=>{if(!l.g)return;const [x,y,a,r]=P[l.id];const st=lstar(l.id),c=GC(l.g);const lx=cx+Math.cos(a)*(r+21),ly=cy+Math.sin(a)*(r+21)+5;
    s+=`<g class="star" tabindex="0" role="link" data-l="${l.id}" aria-label="Ders ${l.i+1}: ${esc(l.t)}"><title>${l.i+1}. ${esc(l.t)}</title>
    <circle class="halo" cx="${x}" cy="${y}" r="15" fill="${c}" opacity="${[.08,.2,.34,.55][st]}"/><circle cx="${x}" cy="${y}" r="${4+st*1.6}" fill="${st?c:'var(--muted)'}"/>${l.id===next.id?`<circle cx="${x}" cy="${y}" r="19" fill="none" stroke="var(--gold)" stroke-width="2" class="pulse"/>`:''}
    <text x="${lx}" y="${ly}" text-anchor="middle" class="cn-n">${l.i+1}</text></g>`;});
  /* merkez */
  const g0=LESSONS[0];
  s+=`<g class="star" tabindex="0" role="link" data-l="${g0.id}" aria-label="Giriş: ${esc(g0.t)}"><title>Giriş: ${esc(g0.t)}</title><circle cx="${cx}" cy="${cy}" r="56" fill="url(#cg)" stroke="var(--gold)" stroke-width="${lstar(g0.id)?3:1.5}"/><text x="${cx}" y="${cy+4}" text-anchor="middle" class="cn-c">اللَّفْظُ</text><text x="${cx}" y="${cy+30}" text-anchor="middle" class="cn-n">Giriş</text></g>`;
  return s+'</svg>';
}

function nassHTML(X,on){
  const hs=new Set((X.hl||[]).map(strip));
  return `<div class="nass">${X.ar.split(' ').map(w=>`<span class="${hs.has(strip(w))?'hlw'+(on?' on':''):''}">${esc(w)}</span>`).join(' ')}</div>`;
}
V.lab=([n])=>{
  let idx=n!=null&&NASS[+n]?+n:0;let mode='coz',q=null;
  const shell=()=>{
    const X=NASS[idx];
    app.innerHTML=`<div class="sec-h"><div><div class="eyebrow">مَائِدَةُ التَّحْلِيلِ</div><h2>Nass Tahlil Masası</h2></div><div class="seg"><button data-m="coz" class="${mode==='coz'?'on':''}">Kendin çöz</button><button data-m="kesif" class="${mode==='kesif'?'on':''}">Tahlili gör</button></div></div>
    <div class="slist">${NASS.map((x,i)=>`<button data-s="${i}" class="${i===idx?'on':''} ${S.lab[i]!=null?'done':''}" title="${esc(x.ref)}">${i+1}</button>`).join('')}</div>
    <div class="labwrap"><div>
      <div class="desk"><div class="eyebrow" style="text-align:center">${esc(X.ref)}</div>${nassHTML(X,mode==='kesif')}<p class="small muted" style="text-align:center;margin:8px 0 0">“${esc(X.tr)}”</p>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn sm" id="say">${ICON.play} Dinle</button><a class="btn sm ghost" href="#ders/${X.l}">İlgili ders ›</a></div></div>
      <div class="lenses">${[1,2,3,4].map(g=>{const k=X.st.filter(s=>s[4]===g).length;return `<span style="--c:${GC(g)}" class="${k?'':'off'}"><b>${AYRIM[g].dir}</b> ${esc(AYR[g])}${k?` · ${k}`:''}</span>`;}).join('')}</div>
      <div class="row" style="justify-content:space-between;margin-top:12px"><button class="btn sm" id="pv" ${idx?'':'disabled'}>‹ Önceki nass</button><button class="btn sm" id="nx" ${idx<NASS.length-1?'':'disabled'}>Sonraki nass ›</button></div>
    </div><div class="ipanel" id="ip"></div></div>`;
    $$('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;q=null;shell();});
    const go=i=>{idx=i;q=null;history.replaceState(null,'','#lab/'+idx);shell();};
    $$('[data-s]').forEach(b=>b.onclick=()=>go(+b.dataset.s));
    $('#pv').onclick=()=>go(idx-1);$('#nx').onclick=()=>go(idx+1);
    $('#say').onclick=()=>speak(X.ar);
    if(mode==='kesif')kesif();else coz();
  };
  const kesif=()=>{const X=NASS[idx];

        $('#fb').className='fb '+(good?'ok':'no');$('#fb').innerHTML=(good?'Doğru! ':'Doğrusu işaretlendi. ')+`<span style="font-weight:400">${AW(esc(s[3]))}</span><div style="margin-top:8px"><button class="btn sm pri" id="cn">Devam ${ICON.arrow}</button></div>`;

function scaleSVG(p){const tilt=p.w===0?-11:11;/* ağır kefe aşağı */
  const L=p.w===0?p.a:p.b;
  return `<svg viewBox="0 0 400 230" class="scl" role="img" aria-label="${esc(p.t)}: ${esc(L)} ağır basar">
  <path d="M200 40 L200 205 M150 210 H250" stroke="var(--muted)" stroke-width="5" stroke-linecap="round"/><circle cx="200" cy="40" r="8" fill="var(--gold)"/>
  <g style="transform:rotate(${tilt}deg);transform-origin:200px 40px;transition:transform .8s cubic-bezier(.3,1.6,.5,1)">
   <line x1="50" y1="40" x2="350" y2="40" stroke="var(--gold)" stroke-width="6" stroke-linecap="round"/>
   ${[[50,p.a,p.w===0],[350,p.b,p.w===1]].map(([x,t,h])=>`<g style="transform:rotate(${-tilt}deg);transform-origin:${x}px 40px"><path d="M${x} 40 L${x-42} 120 M${x} 40 L${x+42} 120" stroke="var(--muted)"/><path d="M${x-52} 120 H${x+52} Q${x+44} 150 ${x} 150 Q${x-44} 150 ${x-52} 120z" fill="${h?'var(--gold)':'var(--panel2)'}" stroke="var(--gold)"/><text x="${x}" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="${h?'var(--gold-ink)':'var(--ink)'}">${esc(t)}</text></g>`).join('')}
  </g></svg>`;}

const TAGS={ders:'Ders soruları',nass:'Nass tahlili',vaz:'Hâss / âmm / müşterek',umum:'Umûm sîgaları',emir:'Emir',nehiy:'Nehiy',haml:'Mutlak–mukayyed',mezhep:'Hanefî–cumhur',istimal:'Hakikat–mecâz',acik:'Açıklık–kapalılık',delalet:'Delâlet şekilleri',mefhum:'Mefhûm-i muhâlif'};
function genExam(scopes,count){
  const gens=[];const B=g=>scopes.includes(g);
  const lessonQ=g=>()=>{const L=pick(LESSONS.filter(l=>(l.g||1)===g));const q=pick(L.q);return {tag:'ders',g,q:AW(esc(q[0])),o:q[1],a:q[2],ex:AW(esc(q[3]))+` <span class="muted">(Ders: ${esc(L.t)})</span>`};};
  const nassQ=g=>()=>{const X=pick(NASS.filter(x=>x.st.some(s=>s[4]===g)));const s=pick(X.st.filter(s=>s[4]===g));return {tag:'nass',g,q:`${A(X.ar)} <span class="small muted">(${esc(X.ref)})</span><br>${AW(esc(s[0]))}`,o:s[1],a:s[2],ex:AW(esc(s[3]))};};
  const pool=(tag,g,arr,qf,opts,ans,exf)=>()=>{const it=pick(arr);const o=opts(it);return {tag,g,q:qf(it),o,a:ans(it,o),ex:exf(it)};};
  const P=s=>isAr(s)?A(s):AW(esc(s));
  if(B(1)){
    gens.push(lessonQ(1),lessonQ(1),nassQ(1));
    gens.push(pool('vaz',1,VAZ,it=>`${A(it[0])} lafzı vaz‘ bakımından nedir?`,()=>['Hâss','Âmm','Müşterek'],it=>'ham'.indexOf(it[1]),it=>esc(it[2])));
    gens.push(pool('umum',1,UMUM,it=>`${A(it[0])} — umûm hangi sîgadan gelir?`,it=>{const o=shuffle([it[1],...sample(UMUMK.map((_,i)=>i).filter(i=>i!==it[1]),3)]);it._o=o;return o.map(i=>UMUMK[i]);},it=>it._o.indexOf(it[1]),it=>UMUMK[it[1]]));
    gens.push(pool('emir',1,EMIR,it=>`${P(it[0])} — bu emir neyi ifade eder?`,()=>Object.values(EMIRK),it=>Object.keys(EMIRK).indexOf(it[1]),it=>AW(esc(it[2]))));
    gens.push(pool('nehiy',1,NEHIY,it=>`${esc(it[0])}: hukukî sonucu?`,()=>Object.values(NEHIYK),it=>Object.keys(NEHIYK).indexOf(it[1]),it=>esc(it[2])));
    gens.push(pool('haml',1,HAML,it=>`${esc(it[0])}: mutlak mukayyede hamledilir mi?`,()=>Object.values(HAMLK),it=>Object.keys(HAMLK).indexOf(it[1]),it=>esc(it[2])));
    gens.push(pool('mezhep',1,MEZHEP,it=>`“${esc(it[0])}” görüşü kimindir?`,()=>['Hanefîler','Cumhur / Şâfiîler'],it=>it[1]==='h'?0:1,it=>esc(it[2])));
  }
  if(B(2)){
    gens.push(lessonQ(2),lessonQ(2),nassQ(2));
    gens.push(pool('istimal',2,ISTIMAL,it=>`${esc(it[0])}: lafız kullanıldığı mânâ bakımından nedir?`,()=>Object.values(ISTK),it=>Object.keys(ISTK).indexOf(it[1]),it=>esc(it[2])));
    gens.push(pool('istimal',2,ISTIMAL,it=>`${esc(it[0])}: lafız kullanıldığı mânâ bakımından nedir?`,()=>Object.values(ISTK),it=>Object.keys(ISTK).indexOf(it[1]),it=>esc(it[2])));
  }
  if(B(3)){
    gens.push(lessonQ(3),lessonQ(3),nassQ(3));
    gens.push(pool('acik',3,ACIK,it=>`${AW(esc(it[0]))}: Hanefî ıstılahına göre derecesi?`,it=>(it[1]<4?[0,1,2,3]:[4,5,6,7]).map(i=>ACIKK[i]),(it,o)=>o.indexOf(ACIKK[it[1]]),it=>esc(it[2])));
  }
  if(B(4)){
    gens.push(lessonQ(4),lessonQ(4),nassQ(4));
    gens.push(pool('delalet',4,DELALET,it=>`${AW(esc(it[0]))}: bu hüküm hangi delâletle sabittir?`,()=>DELK.slice(),it=>it[1],it=>esc(it[2])));
    gens.push(pool('mefhum',4,MEFHUM,it=>`${A(it[0])} — cumhura göre mefhûm-i muhâlif?`,()=>Object.values(MEFK),it=>Object.keys(MEFK).indexOf(it[1]),it=>esc(it[2])));
  }
  const out=[],keys=new Set();let guard=0;
  while(out.length<count&&guard++<count*60){const q=pick(gens)();if(!q||q.a<0)continue;if(keys.has(q.q))continue;keys.add(q.q);const idx=shuffle(q.o.map((_,i)=>i));q.o=idx.map(i=>q.o[i]);q.a=idx.indexOf(q.a);out.push(q);}
  return out;
}

    const fin=()=>{const bl=EX.ans.filter(a=>a===null).length;if(bl&&!confirm(bl+' soru boş. Yine de bitirilsin mi?'))return;finishExam();};
    if($('#fin'))$('#fin').onclick=fin;$('#fin2').onclick=fin;$('#quit').onclick=()=>{if(confirm('Sınav iptal edilsin mi?')){EX=null;location.hash='#sinav';}};tick();};
  const tick=()=>{const t=$('#tm');if(!t)return;const el=Math.floor((Date.now()-EX.start)/1000);if(EX.limit){const l=EX.limit-el;if(l<=0){finishExam();return;}t.textContent='⏱ '+Math.floor(l/60)+':'+String(l%60).padStart(2,'0');t.classList.toggle('low',l<60);}else t.textContent='⏱ '+Math.floor(el/60)+':'+String(el%60).padStart(2,'0');};
  TIMERS.push(setInterval(tick,1000));draw();
}
function finishExam(){stopTimers();const n=EX.qs.length,c=EX.qs.filter((q,i)=>EX.ans[i]===q.a).length;EX.done=true;EX.c=c;EX.pct=Math.round(c/n*100);EX.time=Math.floor((Date.now()-EX.start)/1000);
  S.exams.push({at:Date.now(),n,c,pct:EX.pct});S.exams=S.exams.slice(-30);save();addXP(c*5);if(EX.pct>=85){confetti();beep('win');}location.hash='#sinav/sonuc';}
const grade=p=>p>=85?'Pekiyi':p>=70?'İyi':p>=60?'Orta':p>=50?'Geçer':'Tekrar';
function examResult(){
  const tags={},bs={};EX.qs.forEach((q,i)=>{const ok=EX.ans[i]===q.a;const t=tags[q.tag]=tags[q.tag]||{n:0,c:0};t.n++;if(ok)t.c++;const b=bs[q.g]=bs[q.g]||{n:0,c:0};b.n++;if(ok)b.c++;});
  const bar=(lab,v)=>`<div><span>${lab}</span><div class="pbar"><i style="width:${v.c/v.n*100}%;background:${v.c/v.n>=.7?'var(--good)':v.c/v.n>=.5?'var(--gold)':'var(--bad)'}"></i></div><b>${v.c}/${v.n}</b></div>`;
  app.innerHTML=`<div class="stage"><div class="card" style="text-align:center"><div class="eyebrow">Sınav sonucu</div><div class="scorebig">%${EX.pct}</div><p><b>${grade(EX.pct)}</b> · ${EX.c}/${EX.qs.length} doğru · ${Math.floor(EX.time/60)} dk ${EX.time%60} sn</p>
    <div class="row" style="justify-content:center"><button class="btn pri" id="cert">Başarı belgesi</button>${EX.c<EX.qs.length?'<button class="btn" id="wr">Yanlışlarla yeni sınav</button>':''}<a class="btn" href="#sinav">Yeni sınav</a></div></div>
  <div class="card" style="margin-top:12px"><h3>Ayrım raporu</h3><div class="bars" style="margin-top:10px">${Object.entries(bs).map(([g,v])=>bar(AYRIM[g].dir+' · '+AYR[g],v)).join('')}</div><h3 style="margin-top:14px">Konu raporu</h3><div class="bars" style="margin-top:10px">${Object.entries(tags).map(([k,v])=>bar(TAGS[k],v)).join('')}</div></div>
  <div class="card" style="margin-top:12px"><h3>Cevap anahtarı</h3>${EX.qs.map((q,i)=>{const ok=EX.ans[i]===q.a;const sh=x=>isAr(x)?A(x):esc(x);return `<div class="rev ${ok?'ok':'no'}"><div class="small"><b>${i+1}.</b> ${q.q}</div><div class="small" style="margin-top:4px">${ok?'✓':'✗'} Cevabın: ${EX.ans[i]===null?'<i>boş</i>':sh(q.o[EX.ans[i]])}${ok?'':` · Doğrusu: <b>${sh(q.o[q.a])}</b>`}</div><div class="tiny muted" style="margin-top:2px">${q.ex}</div></div>`;}).join('')}</div></div>`;
  $('#cert').onclick=()=>location.hash='#sinav/belge';
  if($('#wr'))$('#wr').onclick=()=>{const w=EX.qs.filter((q,i)=>EX.ans[i]!==q.a).map(q=>Object.assign({},q));EX={qs:w,ans:w.map(()=>null),flag:w.map(()=>false),i:0,start:Date.now(),limit:0,done:false,sc:EX.sc};location.hash='#sinav/run';};
}
function examCert(){
  const d=new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
  app.innerHTML=`<div class="stage"><div class="cert"><div class="kufi">طُرُقُ الِاسْتِنْبَاطِ</div><div class="eyebrow" style="margin-top:6px">Başarı Belgesi</div>
  <h2 style="margin-top:10px">${esc(S.name||'Değerli öğrenci')}</h2><p>Lafız Pusulası programında <b>İslâm Hukuk İlminin Esasları — Lafızlar</b> sınavını <b>${EX.qs.length}</b> soruda <b>%${EX.pct}</b> başarı ile tamamlamış ve <b>“${grade(EX.pct)}”</b> derecesini almıştır.</p>
  <p class="muted small">${d} · Rütbe: ${lvl().name} · Okunan ders: ${LESSONS.filter(l=>lstar(l.id)).length}/${LESSONS.length}</p>
  <p class="small" style="margin-top:16px"><b>Marmara Üniversitesi İlahiyat Fakültesi Öğretim Görevlisi Hüseyin KAYA tarafından hazırlanmıştır.</b></p></div>
  <div class="row noprint" style="justify-content:center;margin-top:14px"><button class="btn pri" id="pr">Yazdır / PDF</button><a class="btn" href="#sinav/sonuc">Sonuca dön</a></div></div>`;
  $('#pr').onclick=()=>window.print();
}
