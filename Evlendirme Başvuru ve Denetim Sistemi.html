<script>
"use strict";
/* =====================================================================
   SABİT GÜVENCELER (parametreyle DEĞİŞTİRİLEMEZ)
   ===================================================================== */
const HARD={
  absoluteMinAge:16,          // hiçbir parametre veya istisna bunun altına inemez
  minAgeStandardFloor:18,     // normal evlenme yaşı en az 18 olarak ayarlanabilir
  lockedBans:["ustsoy_altsoy","kardes","evlat_edinme"], // devre dışı bırakılamaz
  requireInPerson:true,       // her iki tarafın şahsen başvurusu zorunlu (vekâletle başvuru yok)
  requireFreeWill:true        // her iki tarafın serbest irade beyanı tören aşamasında zorunlu
};
const KEY="evlendirme-sistemi-v1";

/* =====================================================================
   SHA-256 (çevrimdışı, bağımlılıksız)
   ===================================================================== */
const K256=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(str){
  const m=new TextEncoder().encode(str),l=m.length,n=((l+9+63)>>6)<<6,b=new Uint8Array(n);
  b.set(m);b[l]=0x80;const dv=new DataView(b.buffer);
  dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l*8/4294967296));
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w=new Uint32Array(64);
  for(let i=0;i<n;i+=64){
    for(let t=0;t<16;t++)w[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){const a=w[t-15],c=w[t-2];
      const s0=((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3),s1=((c>>>17)|(c<<15))^((c>>>19)|(c<<13))^(c>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0}
    let [a,b2,c,d,e,f,g,hh]=h;
    for(let t=0;t<64;t++){
      const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)),ch=(e&f)^(~e&g),t1=(hh+S1+ch+K256[t]+w[t])>>>0;
      const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)),mj=(a&b2)^(a&c)^(b2&c),t2=(S0+mj)>>>0;
      hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b2;b2=a;a=(t1+t2)>>>0}
    h=[h[0]+a,h[1]+b2,h[2]+c,h[3]+d,h[4]+e,h[5]+f,h[6]+g,h[7]+hh].map(x=>x>>>0)}
  return h.map(x=>x.toString(16).padStart(8,"0")).join("");
}
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v);
const seal=o=>sha256(canon(o));
const hashPin=(pin,salt)=>{let x=salt+pin;for(let i=0;i<1500;i++)x=sha256(x+salt);return x};
const rnd=()=>Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x=>x.toString(16).padStart(2,"0")).join("");

/* =====================================================================
   VARSAYILAN PARAMETRELER (örnek: Türkiye Medeni Kanunu'nu esas alan başlangıç değerleri;
   hukuki doğruluğu yetkili makamca onaylanmalıdır)
   ===================================================================== */
const DEFAULT_PARAMS=()=>({
  institution:"Evlendirme Memurluğu",
  minAgeStandard:18,
  allowParentConsent:true, minAgeParentConsent:17,
  allowCourtException:true, minAgeCourt:16,
  waitingDays:300, waitingAppliesTo:"kadin",
  genderRule:"farkli",
  witnessCount:2,
  applicationValidityDays:180,
  minNoticeDays:0,
  maxPerDay:20, slotMinutes:20, dayStart:"09:00", dayEnd:"16:40",
  workDays:[1,2,3,4,5], holidays:[],
  fee:"",
  regPrefix:"EV",
  sessionLockMinutes:5,
  retentionYears:10,
  kinBans:[
    {id:"ustsoy_altsoy",label:"Üstsoy–altsoy (anne/baba, çocuk, torun…)",enabled:true},
    {id:"kardes",label:"Kardeşler (tam, ana bir, baba bir)",enabled:true},
    {id:"evlat_edinme",label:"Evlat edinen ile evlatlık (ve altsoyu)",enabled:true},
    {id:"amca_dayi",label:"Amca, dayı, hala, teyze ile yeğeni",enabled:true},
    {id:"kayin_hisim",label:"Kayın hısımlığı (kayınpeder, kayınvalide, gelin, damat, üvey ebeveyn/evlat)",enabled:true}
  ],
  docs:[
    {id:"d_kimlik",label:"Kimlik belgesi (her iki taraf)",required:true,cond:"all"},
    {id:"d_foto",label:"Vesikalık fotoğraf",required:true,cond:"all"},
    {id:"d_saglik",label:"Evlenme muayene (sağlık) raporu",required:true,cond:"all"},
    {id:"d_medeni",label:"Nüfus kayıt örneği / medeni durum belgesi",required:true,cond:"all"},
    {id:"d_bosanma",label:"Önceki evliliğin sona erdiğini gösteren belge (boşanma kesinleşme / ölüm kaydı)",required:true,cond:"previous"},
    {id:"d_yabanci",label:"Yabancı uyruklu taraf için bekârlık/medeni hâl belgesi (onaylı) ve tercümesi",required:true,cond:"foreign"},
    {id:"d_veli",label:"Veli/vasi izni",required:true,cond:"parent"},
    {id:"d_mahkeme",label:"Mahkeme izin kararı",required:true,cond:"court"}
  ]
});
const COND_LABEL={all:"Her başvuruda",previous:"Önceden evlenmiş taraf varsa",foreign:"Yabancı uyruklu taraf varsa",parent:"Veli izniyle evlenecek taraf varsa",court:"Mahkeme kararıyla evlenecek taraf varsa"};

/* ---- Parametre şeması (düzenlenebilir alanlar) ---- */
const SCHEMA=[
  {k:"institution",label:"Kurum adı",type:"text"},
  {sec:"Yaş kuralları"},
  {k:"minAgeStandard",label:"Normal evlenme yaşı",type:"int",min:HARD.minAgeStandardFloor,max:21,help:"En az 18 olabilir; altına indirilemez."},
  {k:"allowParentConsent",label:"Veli izniyle erken yaşta evlenmeye izin ver",type:"bool"},
  {k:"minAgeParentConsent",label:"Veli izniyle asgari yaş",type:"int",min:17,max:18,help:"Normal yaştan küçük olmalıdır."},
  {k:"allowCourtException",label:"Mahkeme kararıyla istisnai evlenmeye izin ver",type:"bool"},
  {k:"minAgeCourt",label:"Mahkeme kararıyla asgari yaş",type:"int",min:HARD.absoluteMinAge,max:17,help:`Mutlak alt sınır ${HARD.absoluteMinAge}; hiçbir ayarla bunun altına inilemez.`},
  {sec:"Önceki evlilik ve beklemeler"},
  {k:"waitingDays",label:"Evliliğin sona ermesinden sonra bekleme süresi (gün)",type:"int",min:0,max:400},
  {k:"waitingAppliesTo",label:"Bekleme süresi kime uygulanır?",type:"sel",opts:[["kadin","Kadın taraf"],["her_ikisi","Her iki taraf"],["hic","Uygulanmaz"]]},
  {k:"genderRule",label:"Taraf cinsiyeti kuralı",type:"sel",opts:[["farkli","Taraflar farklı cinsiyette olmalı"],["serbest","Denetleme yapılmaz"]],help:"Yürürlükteki mevzuata göre yetkili makam belirler."},
  {sec:"Başvuru ve tören"},
  {k:"witnessCount",label:"Gerekli şahit sayısı",type:"int",min:0,max:4},
  {k:"applicationValidityDays",label:"Onaylı başvurunun geçerlilik süresi (gün)",type:"int",min:30,max:365},
  {k:"minNoticeDays",label:"Başvurudan törene en az kaç gün",type:"int",min:0,max:30},
  {k:"fee",label:"Tören ücreti / harç bilgisi (serbest metin)",type:"text"},
  {k:"regPrefix",label:"Kayıt numarası öneki",type:"text"},
  {sec:"Takvim"},
  {k:"maxPerDay",label:"Günlük azami nikâh sayısı",type:"int",min:1,max:200},
  {k:"slotMinutes",label:"Seans süresi (dakika)",type:"int",min:10,max:120},
  {k:"dayStart",label:"Gün başlangıç saati",type:"time"},
  {k:"dayEnd",label:"Son seans başlangıç saati (en geç)",type:"time"},
  {sec:"Güvenlik ve saklama"},
  {k:"sessionLockMinutes",label:"Etkinlik yokken otomatik kilit (dakika)",type:"int",min:1,max:60},
  {k:"retentionYears",label:"Tamamlanmış kayıtların saklama süresi (yıl)",type:"int",min:1,max:50}
];
const WDAYS=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];

/* =====================================================================
   VERİ DEPOSU
   ===================================================================== */
let DB=null,SESSION=null,route={v:"dash"},ctx={};
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(DB))}
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtD=s=>s?s.split("-").reverse().join("."):"—";
const fmtT=ts=>{const d=new Date(ts);return fmtD(todayStrOf(d))+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const todayStrOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return todayStrOf(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);
function ageOn(birth,ref){const b=new Date(birth+"T00:00:00"),r=new Date(ref+"T00:00:00");let a=r.getFullYear()-b.getFullYear();
  if(r.getMonth()<b.getMonth()||(r.getMonth()===b.getMonth()&&r.getDate()<b.getDate()))a--;return a}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2600)}
function validTC(n){if(!/^[1-9]\d{10}$/.test(n))return false;const d=n.split("").map(Number);
  const d10=(((d[0]+d[2]+d[4]+d[6]+d[8])*7)-(d[1]+d[3]+d[5]+d[7]))%10;
  return ((d10+10)%10===d[9])&&(d.slice(0,10).reduce((a,b)=>a+b,0)%10===d[10])}
const maskId=n=>!n?"—":n.length>5?n.slice(0,3)+"•••••"+n.slice(-3):"•••";

/* ---- Denetim günlüğü (SHA-256 zinciri) ---- */
function logEv(action,detail){
  const prev=DB.audit.length?DB.audit[DB.audit.length-1].hash:"GENESIS";
  const e={i:DB.audit.length+1,ts:Date.now(),user:SESSION?SESSION.id:"sistem",role:SESSION?SESSION.role:"-",action,detail:detail||"",prev};
  e.hash=sha256(prev+"|"+e.i+"|"+e.ts+"|"+e.user+"|"+e.role+"|"+e.action+"|"+e.detail);
  DB.audit.push(e);save();return e;
}
function verifyChain(audit){
  let prev="GENESIS";
  for(const e of audit){
    const h=sha256(prev+"|"+e.i+"|"+e.ts+"|"+e.user+"|"+e.role+"|"+e.action+"|"+e.detail);
    if(e.prev!==prev||e.hash!==h)return {ok:false,at:e.i};
    prev=e.hash}
  return {ok:true,n:audit.length};
}

/* =====================================================================
   PARAMETRE DOĞRULAMA
   ===================================================================== */
function validateParams(p){
  const E=[];const num=(k,min,max,lbl)=>{if(!Number.isInteger(p[k])||p[k]<min||p[k]>max)E.push(`${lbl}: ${min}–${max} arası tam sayı olmalı.`)};
  SCHEMA.forEach(s=>{if(s.type==="int")num(s.k,s.min,s.max,s.label)});
  if(p.minAgeCourt<HARD.absoluteMinAge)E.push(`Mutlak asgari yaş ${HARD.absoluteMinAge}'in altına inilemez.`);
  if(p.minAgeStandard<HARD.minAgeStandardFloor)E.push(`Normal evlenme yaşı ${HARD.minAgeStandardFloor}'in altına indirilemez.`);
  if(!(p.minAgeCourt<=p.minAgeParentConsent&&p.minAgeParentConsent<=p.minAgeStandard))E.push("Yaş sıralaması: mahkeme ≤ veli izni ≤ normal yaş olmalı.");
  if(!/^\d\d:\d\d$/.test(p.dayStart)||!/^\d\d:\d\d$/.test(p.dayEnd)||p.dayStart>p.dayEnd)E.push("Gün başlangıç/bitiş saatleri geçersiz.");
  if(!Array.isArray(p.workDays)||!p.workDays.length||p.workDays.some(x=>!(x>=0&&x<=6)))E.push("En az bir çalışma günü seçilmeli.");
  (p.holidays||[]).forEach(h=>{if(!/^\d{4}-\d\d-\d\d$/.test(h))E.push("Tatil tarihi geçersiz: "+h)});
  HARD.lockedBans.forEach(id=>{const b=(p.kinBans||[]).find(x=>x.id===id);if(!b||!b.enabled)E.push(`“${id}” hısımlık engeli devre dışı bırakılamaz.`)});
  const ids=new Set();(p.docs||[]).forEach(d=>{if(!d.id||ids.has(d.id))E.push("Belge kimlikleri benzersiz olmalı.");ids.add(d.id);if(!d.label)E.push("Belge adı boş olamaz.");if(!COND_LABEL[d.cond])E.push("Belge koşulu geçersiz.")});
  ["d_kimlik"].forEach(id=>{const d=(p.docs||[]).find(x=>x.id===id);if(!d||!d.required)E.push("Kimlik belgesi zorunlu olmaktan çıkarılamaz.")});
  return E;
}

/* =====================================================================
   UYGUNLUK MOTORU
   ===================================================================== */
const newParty=()=>({ad:"",soyad:"",kimTip:"TC",kimNo:"",dogum:"",cins:"",uyruk:"TC",medeni:"bekar",oncekiBitis:"",veliIzni:false,mahkeme:false,beklemeKarari:false});
function newApp(){
  const y=new Date().getFullYear();DB.seq.app=(DB.seq.app||0)+1;
  return {id:`B-${y}-${String(DB.seq.app).padStart(4,"0")}`,status:"taslak",createdAt:Date.now(),createdBy:SESSION.id,
    parties:[newParty(),newParty()],kin:[],kinChecked:false,docs:{},witnesses:[{ad:"",soyad:"",kimNo:""},{ad:"",soyad:"",kimNo:""},{ad:"",soyad:"",kimNo:""},{ad:"",soyad:"",kimNo:""}],
    inPerson:[false,false],freeWill:[false,false],appointment:null,approvedAt:null,approvedBy:null,
    pendingChecker:null,checker:null,reg:null,notes:"",history:[]};
}
function partyTier(p,P,ref){
  if(!p.dogum)return null;const a=ageOn(p.dogum,ref);
  if(a<HARD.absoluteMinAge)return {tier:"engel",a};
  if(a>=P.minAgeStandard)return {tier:"normal",a};
  if(P.allowParentConsent&&a>=P.minAgeParentConsent)return {tier:"parent",a};
  if(P.allowCourtException&&a>=P.minAgeCourt)return {tier:"court",a};
  return {tier:"engel",a};
}
function evaluate(app,P,opt){
  opt=opt||{};const F=[];const add=(lvl,id,txt)=>F.push({lvl,id,txt});
  const ref=(app.appointment&&app.appointment.date)||todayStr();
  const tiers=app.parties.map(p=>partyTier(p,P,ref));
  let needsChecker=false;
  app.parties.forEach((p,i)=>{
    const w=`Taraf ${i+1}`;
    if(!p.ad.trim()||!p.soyad.trim())add("eksik","R-KIMLIK",`${w}: ad ve soyad eksik.`);
    if(!p.kimNo.trim())add("eksik","R-KIMLIK",`${w}: kimlik/pasaport numarası eksik.`);
    else if(p.kimTip==="TC"&&!validTC(p.kimNo.trim()))add("engel","R-TC",`${w}: T.C. kimlik numarası geçersiz (algoritma doğrulaması başarısız).`);
    if(!p.dogum)add("eksik","R-DOGUM",`${w}: doğum tarihi eksik.`);
    else{const t=tiers[i];
      if(t.tier==="engel")add("engel","R-YAS",`${w}: ${t.a} yaşında; izin verilen asgari yaşın altında${t.a<HARD.absoluteMinAge?` (mutlak alt sınır ${HARD.absoluteMinAge})`:""}. Evlendirilemez.`);
      else if(t.tier==="parent"){needsChecker=true;
        if(!p.veliIzni)add("eksik","R-VELI",`${w}: ${t.a} yaşında; veli/vasi izni gerekir (izin kaydı işaretlenmedi).`);
        else add("uyari","R-YAS-ISTISNA",`${w}: ${t.a} yaşında; veli izniyle evlenme — yönetici (ikinci imza) onayı gerekir.`)}
      else if(t.tier==="court"){needsChecker=true;
        if(!p.mahkeme)add("eksik","R-MAHKEME",`${w}: ${t.a} yaşında; yalnız mahkeme kararıyla evlenebilir (karar kaydı işaretlenmedi).`);
        else add("uyari","R-YAS-ISTISNA",`${w}: ${t.a} yaşında; mahkeme kararıyla evlenme — yönetici (ikinci imza) onayı gerekir.`)}}
    if(p.medeni==="evli")add("engel","R-EVLI",`${w}: mevcut evliliği sürüyor; yeni evlilik yapılamaz.`);
    if(p.medeni==="bosanmis"||p.medeni==="dul"){
      if(!p.oncekiBitis)add("eksik","R-ONCEKI",`${w}: önceki evliliğin sona erdiği tarih eksik.`);
      else{
        const applies=P.waitingAppliesTo==="her_ikisi"||(P.waitingAppliesTo==="kadin"&&p.cins==="K");
        if(applies&&P.waitingDays>0){const gec=daysBetween(p.oncekiBitis,ref);
          if(gec<P.waitingDays){
            if(p.beklemeKarari)add("uyari","R-BEKLEME",`${w}: bekleme süresi dolmamış (${gec}/${P.waitingDays} gün); süreyi kaldıran karar kaydı var — yönetici onayı gerekir.`),needsChecker=true;
            else add("engel","R-BEKLEME",`${w}: bekleme süresi dolmamış (${gec}/${P.waitingDays} gün). Süreyi kaldıran mahkeme kararı yoksa evlenemez.`)}}}}
    if(!p.cins&&P.genderRule==="farkli")add("eksik","R-CINS",`${w}: cinsiyet bilgisi eksik.`);
  });
  const [A,B]=app.parties;
  if(A.kimNo&&B.kimNo&&A.kimNo.trim()===B.kimNo.trim())add("engel","R-AYNI","Her iki tarafın kimlik numarası aynı.");
  if(P.genderRule==="farkli"&&A.cins&&B.cins&&A.cins===B.cins)add("engel","R-CINS","Taraf cinsiyetleri parametre kuralına uymuyor.");
  // yerel sicil çakışması
  DB.apps.forEach(o=>{if(o.id===app.id)return;
    app.parties.forEach((p,i)=>{if(!p.kimNo)return;
      o.parties.forEach(q=>{if(q.kimNo&&q.kimNo===p.kimNo){
        if(o.status==="tamamlandi"&&o.reg)add("uyari","R-SICIL",`Taraf ${i+1}: yerel kayıtta tamamlanmış bir evlilik var (${o.reg.no}). Boşanma/ölüm kaydı yerelde bulunamayabilir; resmî sorgu yapılmalı.`),needsChecker=true;
        else if(["degerlendirme","onayli","randevulu"].includes(o.status))add("uyari","R-CAKISMA",`Taraf ${i+1}: başka bir aktif başvuruda yer alıyor (${o.id}).`),needsChecker=true}})})});
  // hısımlık
  const active=P.kinBans.filter(b=>b.enabled);
  active.forEach(b=>{if(app.kin.includes(b.id))add("engel","R-AKRABA",`Hısımlık engeli beyan edildi: ${b.label}`)});
  if(!app.kinChecked)add("eksik","R-AKRABA-SORGU","Hısımlık engelleri tarafa sorulup kontrol edildi mi? (işaretlenmedi)");
  // belgeler
  const any=f=>app.parties.some(f);
  const applies={all:true,previous:any(p=>p.medeni!=="bekar"),foreign:any(p=>p.uyruk!=="TC"),
    parent:tiers.some(t=>t&&t.tier==="parent"),court:tiers.some(t=>t&&t.tier==="court")};
  P.docs.forEach(d=>{if(d.required&&applies[d.cond]&&!app.docs[d.id])add("eksik","R-BELGE",`Belge eksik: ${d.label}`)});
  // şahsen başvuru
  if(HARD.requireInPerson&&!(app.inPerson[0]&&app.inPerson[1]))add("eksik","R-SAHSEN","Her iki tarafın şahsen başvurduğu teyit edilmedi (vekâletle başvuru kabul edilmez).");
  // geçerlilik / ön bildirim
  if(app.approvedAt){const exp=addDays(todayStrOf(new Date(app.approvedAt)),P.applicationValidityDays);
    if(ref>exp)add("engel","R-SURE",`Onaylı başvurunun geçerlilik süresi doldu (${fmtD(exp)}). Yeni başvuru gerekir.`)}
  if(app.appointment){const gun=daysBetween(todayStrOf(new Date(app.createdAt)),app.appointment.date);
    if(gun<P.minNoticeDays)add("engel","R-ONBILDIRIM",`Başvuru ile tören arasında en az ${P.minNoticeDays} gün olmalı.`)}
  // tören aşaması
  if(opt.forCompletion){
    if(!(app.freeWill[0]&&app.freeWill[1]))add("eksik","R-IRADE","Her iki tarafın serbest irade beyanı alınmadı.");
    const n=app.witnesses.slice(0,P.witnessCount).filter(x=>x.ad.trim()&&x.soyad.trim()&&x.kimNo.trim()).length;
    if(n<P.witnessCount)add("eksik","R-SAHIT",`Şahit bilgileri eksik (${n}/${P.witnessCount}).`)}
  else{add("bilgi","R-IRADE","Serbest irade beyanı ve şahit bilgileri tören aşamasında zorunludur.")}
  const lv=F.map(x=>x.lvl);
  const status=lv.includes("engel")?"ENGEL":lv.includes("eksik")?"EKSIK":lv.includes("uyari")?"ONAY":"UYGUN";
  return {findings:F,status,needsChecker};
}
const STATUS_TXT={ENGEL:["Engel var","bad"],EKSIK:["Eksikler var","warn"],ONAY:["Yönetici onayı gerekir","info"],UYGUN:["Uygun","good"]};
const LVL_B={engel:["ENGEL","bad"],eksik:["EKSİK","warn"],uyari:["UYARI","info"],bilgi:["BİLGİ",""]};
const APP_ST={taslak:["Taslak",""],degerlendirme:["Değerlendirmede","info"],onayli:["Onaylandı","good"],randevulu:["Randevulu","good"],tamamlandi:["Tamamlandı","good"],red:["Reddedildi","bad"],iptal:["İptal","warn"]};

/* =====================================================================
   TAKVİM
   ===================================================================== */
function slotsFor(date,P,exceptAppId){
  const d=new Date(date+"T00:00:00");
  if(!P.workDays.includes(d.getDay()))return {ok:false,why:"Çalışma günü değil."};
  if(P.holidays.includes(date))return {ok:false,why:"Resmî tatil/kapalı gün."};
  const taken=DB.apps.filter(a=>a.id!==exceptAppId&&a.appointment&&a.appointment.date===date&&["randevulu","tamamlandi"].includes(a.status));
  if(taken.length>=P.maxPerDay)return {ok:false,why:"Günlük kapasite dolu."};
  const [sh,sm]=P.dayStart.split(":").map(Number),[eh,em]=P.dayEnd.split(":").map(Number);
  const out=[];for(let m=sh*60+sm;m<=eh*60+em;m+=P.slotMinutes){
    const t=String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
    out.push({t,taken:taken.some(a=>a.appointment.time===t)})}
  return {ok:true,slots:out,count:taken.length};
}

function vCal(){
  const P=DB.params;const m=ctx.month||todayStr().slice(0,7);
  const [Y,M]=m.split("-").map(Number);const first=new Date(Y,M-1,1),last=new Date(Y,M,0);
  const pad=(first.getDay()+6)%7;let cells="";for(let i=0;i<pad;i++)cells+="<td></td>";
  for(let d=1;d<=last.getDate();d++){
    const ds=`${Y}-${String(M).padStart(2,"0")}-${String(d).padStart(2,"0")}`;const dt=new Date(Y,M-1,d);
    const n=DB.apps.filter(a=>a.appointment&&a.appointment.date===ds&&["randevulu","tamamlandi"].includes(a.status)).length;
    const closed=!P.workDays.includes(dt.getDay())||P.holidays.includes(ds);
    cells+=`<td style="background:${closed?"var(--soft)":""};min-width:82px"><b>${d}</b>${closed?`<div class="small muted">${P.holidays.includes(ds)?"Tatil":"Kapalı"}</div>`:`<div class="small">${n}/${P.maxPerDay}</div>`}</td>`;
    if((pad+d)%7===0)cells+="</tr><tr>"}
  const prev=new Date(Y,M-2,1),next=new Date(Y,M,1),k=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  return `<div class="row"><h1 class="sp">Takvim — ${["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"][M-1]} ${Y}</h1>
   <button class="b ghost sm" data-act="month" data-m="${k(prev)}">‹</button><button class="b ghost sm" data-act="month" data-m="${k(next)}">›</button></div>
  <div class="card tw"><table><tr>${["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"].map(x=>`<th>${x}</th>`).join("")}</tr><tr>${cells}</tr></table>
  <p class="small muted">Her gün: planlı nikâh / günlük kapasite. Çalışma günleri, tatiller ve kapasite “Parametreler” sayfasından değiştirilir.</p></div>`;
}

function readParamsForm(){
  const f=$('form[data-form="params"]');const P=JSON.parse(JSON.stringify(DB.params));
  SCHEMA.forEach(s=>{if(!s.k)return;const el=f.elements[s.k];if(!el)return;
    P[s.k]=s.type==="bool"?el.checked:s.type==="int"?parseInt(el.value,10):el.value});
  P.workDays=WDAYS.map((_,i)=>i).filter(i=>f.elements["wd"+i].checked);
  P.holidays=f.elements.holidays.value.split(/\s+/).map(x=>x.trim()).filter(Boolean);
  P.kinBans.forEach(b=>{const el=f.elements["kb_"+b.id];if(el&&!el.disabled)b.enabled=el.checked});
  P.docs.forEach((x,i)=>{x.label=f.elements["dl_"+i].value.trim();const r=f.elements["dr_"+i];if(r&&!r.disabled)x.required=r.checked;x.cond=f.elements["dc_"+i].value});
  return P;
}
function applyParams(P,reason,src){
  const E=validateParams(P);if(E.length){alert("Parametreler geçersiz:\n• "+E.join("\n• "));return false}
  if(!reason||reason.trim().length<5){alert("Değişiklik gerekçesi zorunludur (en az 5 karakter).");return false}
  if(canon(P)===canon(DB.params)){toast("Değişiklik yok.");return false}
  DB.params=P;const s=seal(P);
  DB.paramHistory.push({ver:DB.paramHistory.length+1,ts:Date.now(),user:SESSION.id,reason:reason.trim(),seal:s,params:JSON.parse(JSON.stringify(P))});
  logEv("PARAMETRE_DEGISTI",`sürüm ${DB.paramHistory.length}; mühür ${s}; ${src||"form"}; gerekçe: ${reason.trim()}`);
  toast("Parametreler uygulandı.");return true;
}

function vAbout(){return `<h1>Hakkında ve sınırlar</h1>
 <div class="card"><h3>Ne yapar?</h3><ul><li>Evlenme başvurusu kabulü, belge takibi, <b>parametrelere dayalı uygunluk kontrolü</b>, nikâh randevusu ve evlilik kaydı.</li><li>Tüm kurallar (yaş, belge, hısımlık, bekleme, takvim) <b>Parametreler</b> sayfasından yönetici tarafından değiştirilir; her değişiklik sürümlenir, gerekçelendirilir ve mühürlenir.</li><li>Rol ayrımı: Yönetici, Memur, Denetçi (yalnız okur). Riskli durumlarda <b>iki kişi kuralı</b> (ikinci imza).</li><li>Çevrimdışı: internet bağlantısı, sunucu ve dış kütüphane gerekmez.</li></ul></div>
 <div class="card"><h3>Pazarlık edilemez güvenceler</h3><ul><li>${HARD.absoluteMinAge} yaşın altındakiler hiçbir koşulda evlendirilemez.</li><li>Normal evlenme yaşı ${HARD.minAgeStandardFloor}'in altına ayarlanamaz; daha düşük yaşlar yalnız veli izni/mahkeme kararı kaydı ve yönetici ikinci imzasıyla mümkündür.</li><li>İki tarafın şahsen başvurusu ve tören aşamasında serbest irade beyanı zorunludur; vekâletle başvuru kabul edilmez.</li><li>Üstsoy–altsoy, kardeş ve evlat edinme hısımlığı engelleri devre dışı bırakılamaz.</li><li>Mevcut evliliği süren kişi evlendirilemez.</li></ul></div>
 <div class="card"><h3>Sınırlar (lütfen okuyun)</h3><ul>
  <li><b>Bu bir araçtır, hukuki karar verici değildir.</b> Varsayılan parametreler Türkiye Medeni Kanunu'nu örnek alan başlangıç değerleridir; yürürlükteki mevzuata uygunluğu yetkili makamca onaylanmalıdır.</li>
  <li><b>Resmî sorgu yok.</b> Çevrimdışı çalıştığı için nüfus (MERNİS) veya adli sicil sorgusu yapamaz; medeni durum yalnız beyan ve yerel kayıtlara göre denetlenir.</li>
  <li><b>Tarayıcı güvenliği sınırlıdır.</b> PIN ve rol denetimi tarayıcıda çalışır; cihaza tam erişimi olan biri verileri değiştirebilir. SHA-256 zinciri ve parametre mührü değişikliği <i>ortaya çıkarır</i>, <i>engellemez</i>. Resmî kullanımda cihaz yönetimi, disk şifreleme, düzenli imzalı yedek ve kurum BT onayı gerekir.</li>
  <li>Kişisel veriler (KVKK) için aydınlatma, yetki, saklama-imha ve veri sorumlusu süreçleri kurumun sorumluluğundadır.</li></ul></div>`}

/* =====================================================================
   OLAYLAR
   ===================================================================== */
document.addEventListener("submit",e=>{
  const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();const t=f.dataset.form,g=n=>f.elements[n]&&f.elements[n].value;
  if(t==="setup"){
    if(g("pin")!==g("pin2")){alert("PIN'ler eşleşmiyor.");return}
    const salt=rnd();const params=DEFAULT_PARAMS();params.institution=g("inst").trim();
    DB={v:1,params,paramHistory:[{ver:1,ts:Date.now(),user:"admin",reason:"İlk kurulum (varsayılan parametreler)",seal:seal(params),params:JSON.parse(JSON.stringify(params))}],
      users:[{id:"u1",name:g("name").trim(),role:"admin",salt,hash:hashPin(g("pin"),salt),active:true,fails:0,lockUntil:0}],
      apps:[],audit:[],seq:{app:0,reg:0},officialSeal:""};
    SESSION={id:"u1",name:g("name").trim(),role:"admin"};lastAct=Date.now();
    logEv("KURULUM","Sistem kuruldu; kurum: "+params.institution);save();render();return}
  if(t==="login"){
    const u=DB.users.find(x=>x.id===g("u"));const err=$("#lerr");
    if(u.lockUntil>Date.now()){err.innerHTML=`<div class="note bad">Çok sayıda hatalı deneme. ${Math.ceil((u.lockUntil-Date.now())/60000)} dk sonra tekrar deneyin.</div>`;return}
    if(hashPin(g("pin"),u.salt)===u.hash){u.fails=0;u.lockUntil=0;SESSION={id:u.id,name:u.name,role:u.role};lastAct=Date.now();logEv("GIRIS","Oturum açıldı");save();render()}
    else{u.fails++;if(u.fails>=5){u.lockUntil=Date.now()+5*60000;u.fails=0}save();
      SESSION={id:u.id,name:u.name,role:u.role};logEv("GIRIS_HATASI","Hatalı PIN: "+u.name);SESSION=null;
      err.innerHTML=`<div class="note bad">PIN hatalı.</div>`}return}
  if(t==="params"){if(!can.admin())return;const P=readParamsForm();if(applyParams(P,g("reason"))){ctx.draft=null;render()}return}
  if(t==="adduser"){if(!can.admin())return;const salt=rnd();const id="u"+(DB.users.length+1)+rnd().slice(0,4);
    DB.users.push({id,name:g("name").trim(),role:g("role"),salt,hash:hashPin(g("pin"),salt),active:true,fails:0,lockUntil:0});
    logEv("KULLANICI_EKLENDI",`${g("name")} (${g("role")})`);save();toast("Kullanıcı eklendi.");render();return}
});
document.addEventListener("change",e=>{
  if(e.target.id==="flt"){ctx.filter=e.target.value;render()}
  if(e.target.id==="pfile"&&can.admin()){
    const r=new FileReader();r.onload=()=>{try{const P=JSON.parse(r.result);ctx.draft=P;const E=validateParams(P);render();
      if(E.length)alert("Dosya geçerli değil:\n• "+E.join("\n• "));else toast("Parametre dosyası forma yüklendi; gerekçe yazıp uygulayın. Mühür: "+seal(P).slice(0,12)+"…")}catch(x){alert("Dosya okunamadı.")}};r.readAsText(e.target.files[0])}
  if(e.target.id==="bfile"&&can.admin()){
    const r=new FileReader();r.onload=()=>{try{const D=JSON.parse(r.result);const c=verifyChain(D.audit||[]);
      if(!c.ok&&!confirm(`Yedeğin denetim zinciri ${c.at}. kayıtta BOZUK. Yine de yüklensin mi?`))return;
      if(!confirm("Mevcut tüm veriler bu yedekle DEĞİŞTİRİLECEK. Devam?"))return;
      DB=D;save();SESSION=null;toast("Yedek yüklendi; yeniden giriş yapın.");render()}catch(x){alert("Yedek okunamadı.")}};r.readAsText(e.target.files[0])}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){ctx.q=e.target.value;const p=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)}
  if(e.target.id==="aq"){ctx.aq=e.target.value;const p=e.target.selectionStart;render();const n=$("#aq");n.focus();n.setSelectionRange(p,p)}
});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
  if(a!=="open")e.preventDefault&&e.preventDefault();
  const app=()=>DB.apps.find(x=>x.id===route.id);
  if(a==="nav"){ctx.draft=null;go(t.dataset.k);return}
  if(a==="lock"){logEv("OTURUM_KAPATILDI","");lockNow();return}
  if(a==="open"){e.preventDefault();go("app",{id:t.dataset.id});return}
  if(a==="newapp"){if(!can.edit())return;const n=newApp();DB.apps.push(n);hist(n,"Başvuru oluşturuldu");logEv("BASVURU_OLUSTURULDU",n.id);save();go("app",{id:n.id});return}
  if(a==="month"){ctx.month=t.dataset.m;render();return}
  if(a==="exnote")return;
  if(a==="saveapp"){const x=app();readAppForm(x);hist(x,"Kaydedildi");logEv("BASVURU_KAYDEDILDI",x.id);save();toast("Kaydedildi.");render();return}
  if(a==="toeval"){const x=app();readAppForm(x);x.status="degerlendirme";hist(x,"Değerlendirmeye alındı");logEv("BASVURU_DEGERLENDIRMEDE",x.id);save();render();return}
  if(a==="approve"){const x=app();readAppForm(x);const ev=evaluate(x,DB.params);if(ev.status!=="UYGUN"){alert("Başvuru uygun değil; onaylanamaz.");save();render();return}
    x.status="onayli";x.approvedAt=Date.now();x.approvedBy=SESSION.id;hist(x,"Onaylandı");logEv("BASVURU_ONAYLANDI",x.id);save();render();return}
  if(a==="sendchecker"){const x=app();readAppForm(x);const r=prompt("İkinci imza için gerekçe/açıklama:");if(!r||r.trim().length<5){alert("Gerekçe zorunlu.");return}
    x.pendingChecker={by:SESSION.id,reason:r.trim(),ts:Date.now()};hist(x,"İkinci imzaya gönderildi: "+r.trim());logEv("IKINCI_IMZAYA_GONDERILDI",x.id+" — "+r.trim());save();render();return}
  if(a==="checkerok"||a==="checkerno"){const x=app();if(!can.admin())return;
    if(x.pendingChecker.by===SESSION.id){alert("İşlemi hazırlayan kişi ikinci imzayı atamaz (iki kişi kuralı).");return}
    const ev=evaluate(x,DB.params);
    if(a==="checkerok"){if(ev.status==="ENGEL"||ev.status==="EKSIK"){alert("Başvuruda engel veya eksik var; onaylanamaz.");return}
      const r=prompt("Onay gerekçesi:");if(!r||r.trim().length<5)return;
      x.status="onayli";x.approvedAt=Date.now();x.approvedBy=x.pendingChecker.by;x.checker={user:SESSION.id,reason:r.trim(),ts:Date.now()};x.pendingChecker=null;
      hist(x,"İkinci imza ile onaylandı: "+r.trim());logEv("IKINCI_IMZA_ONAY",x.id+" — "+r.trim())}
    else{const r=prompt("Ret gerekçesi:");if(!r||r.trim().length<5)return;hist(x,"İkinci imza reddedildi: "+r.trim());logEv("IKINCI_IMZA_RED",x.id+" — "+r.trim());x.pendingChecker=null}
    save();render();return}
  if(a==="back2eval"){const x=app();x.status="degerlendirme";x.appointment=null;x.approvedAt=null;hist(x,"Değerlendirmeye geri alındı");logEv("BASVURU_GERI_ALINDI",x.id);save();render();return}
  if(a==="cancelapp"){const x=app();const r=prompt("Ret/iptal gerekçesi (zorunlu):");if(!r||r.trim().length<5)return;
    x.status=confirm("Başvuru RET mi edilsin? (Tamam = Reddedildi, İptal = İptal edildi)")?"red":"iptal";x.appointment=null;
    hist(x,APP_ST[x.status][0]+": "+r.trim());logEv("BASVURU_"+x.status.toUpperCase(),x.id+" — "+r.trim());save();render();return}
  if(a==="pickdate"){ctx.apptDate=$("#apdate").value;render();return}
  if(a==="slot"){const x=app();x.appointment={date:t.dataset.d,time:t.dataset.t};
    const ev=evaluate(x,DB.params);const bl=ev.findings.find(f=>f.id==="R-ONBILDIRIM"||f.id==="R-SURE");
    if(bl){alert(bl.txt);x.appointment=null;return}
    x.status="randevulu";hist(x,`Randevu: ${fmtD(t.dataset.d)} ${t.dataset.t}`);logEv("RANDEVU",`${x.id} ${t.dataset.d} ${t.dataset.t}`);ctx.apptDate=null;save();render();return}
  if(a==="complete"){const x=app();readAppForm(x);const ev=evaluate(x,DB.params,{forCompletion:true});
    if(ev.status!=="UYGUN"){alert("Tören aşaması koşulları tamam değil.");save();render();return}
    if(!confirm("Nikâh kıyıldı ve evlilik kaydı oluşturulsun mu? Bu işlem geri alınamaz."))return;
    DB.seq.reg=(DB.seq.reg||0)+1;const no=`${DB.params.regPrefix||"EV"}-${new Date().getFullYear()}-${String(DB.seq.reg).padStart(6,"0")}`;
    x.reg={no,date:x.appointment.date,user:SESSION.id};x.status="tamamlandi";hist(x,"Nikâh kıyıldı; kayıt no "+no);logEv("NIKAH_KAYDI",`${x.id} → ${no}`);save();render();return}
  if(a==="print"){const x=app();printApp(x);return}
  if(a==="saveseal"){DB.officialSeal=$("#offseal").value.trim().toLowerCase();logEv("RESMI_MUHUR_TANIMLANDI",DB.officialSeal);save();render();return}
  if(a==="adddoc"){const P=readParamsForm();const id="d_"+rnd().slice(0,6);P.docs.push({id,label:"Yeni belge",required:true,cond:"all"});ctx.draft=P;render();return}
  if(a==="deldoc"){const P=readParamsForm();P.docs.splice(+t.dataset.i,1);ctx.draft=P;render();return}
  if(a==="exportparams"){download("evlendirme-parametreleri.json",JSON.stringify(readParamsForm(),null,2));return}
  if(a==="exportall"){logEv("YEDEK_ALINDI","tam yedek");download("evlendirme-yedek-"+todayStr()+".json",JSON.stringify(DB));return}
  if(a==="exportaudit"){download("denetim-gunlugu-"+todayStr()+".json",JSON.stringify({audit:DB.audit,chain:verifyChain(DB.audit),paramSeal:seal(DB.params)},null,2));return}
  if(a==="exportpkg"){
    const pk={tarih:todayStr(),kurum:DB.params.institution,parametreler:DB.params,parametreMuhru:seal(DB.params),parametreGecmisi:DB.paramHistory.map(x=>({ver:x.ver,ts:x.ts,user:x.user,reason:x.reason,seal:x.seal})),
      denetimGunlugu:DB.audit,zincir:verifyChain(DB.audit),
      basvurular:DB.apps.map(a=>({id:a.id,durum:a.status,olusturan:a.createdBy,onay:a.approvedBy,ikinciImza:a.checker,randevu:a.appointment,kayit:a.reg,
        taraflar:a.parties.map(p=>({kimlik:maskId(p.kimNo),dogumYili:p.dogum.slice(0,4),uyruk:p.uyruk,medeni:p.medeni})),gecmis:a.history}))};
    logEv("DENETIM_PAKETI","dışa aktarıldı");download("denetim-paketi-"+todayStr()+".json",JSON.stringify(pk,null,2));return}
  if(a==="toggleuser"){const u=DB.users.find(x=>x.id===t.dataset.id);if(u.active&&u.role==="admin"&&DB.users.filter(x=>x.active&&x.role==="admin").length<2){alert("Son etkin yönetici pasifleştirilemez.");return}
    u.active=!u.active;logEv("KULLANICI_DURUMU",`${u.name}: ${u.active?"etkin":"pasif"}`);save();render();return}
  if(a==="resetpin"){const u=DB.users.find(x=>x.id===t.dataset.id);const p=prompt(`${u.name} için yeni PIN (en az 6 rakam):`);if(!p||!/^\d{6,}$/.test(p)){if(p!==null)alert("PIN en az 6 rakam olmalı.");return}
    u.salt=rnd();u.hash=hashPin(p,u.salt);u.fails=0;u.lockUntil=0;logEv("PIN_DEGISTI",u.name);save();toast("PIN güncellendi.");return}
  if(a==="wipe"){if(!can.admin())return;if(prompt("Tüm veriler silinecek. Onaylamak için SİL yazın:")==="SİL"){localStorage.removeItem(KEY);DB=null;SESSION=null;toast("Tüm veriler silindi.");render()}return}
});

/* ---- Yazdırma ---- */
function printApp(x){
  const P=DB.params;const row=(a,b)=>`<tr><th style="width:34%">${a}</th><td>${b}</td></tr>`;
  const party=(p,i)=>`<h3>Taraf ${i+1}</h3><table>${row("Ad soyad",esc(p.ad+" "+p.soyad))}${row("Kimlik no",esc(maskId(p.kimNo)))}${row("Doğum tarihi",fmtD(p.dogum))}${row("Uyruk / medeni durum",esc(p.uyruk+" / "+p.medeni))}</table>`;
  $("#printarea").innerHTML=`<h1>${esc(P.institution)}</h1><h2>Evlenme Başvuru Özeti — ${x.id}</h2>
   <table>${row("Durum",APP_ST[x.status][0])}${row("Randevu",x.appointment?fmtD(x.appointment.date)+" "+x.appointment.time:"—")}${row("Evlilik kayıt no",x.reg?x.reg.no:"—")}${row("Parametre mührü",seal(P).slice(0,24)+"…")}</table>
   ${party(x.parties[0],0)}${party(x.parties[1],1)}
   <h3>Belgeler</h3><ul>${P.docs.map(d=>`<li>${x.docs[d.id]?"☑":"☐"} ${esc(d.label)}</li>`).join("")}</ul>
   <p style="margin-top:30px">Düzenleyen: ${esc(SESSION.name)} — ${fmtT(Date.now())}</p><p>İmza: ____________________</p>
   <p style="font-size:11px">Kimlik numaraları maskelenmiştir. Bu özet resmî evlilik cüzdanı veya belge yerine geçmez.</p>`;
  window.print();
}

DB=load();
if(DB&&!DB.paramHistory)DB=null;
render();
</script>
