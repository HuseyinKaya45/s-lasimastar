/* ---- Quiz motoru ---- */
function runQuiz(box,cfg){
  let i=0,ok=0,locked=false,end=0,tm=null,wrong=0;const items=cfg.items,timed=cfg.timed;
  const finish=()=>{clearInterval(tm);cfg.done(ok,items.length,wrong)};
  function q(){
    if(i>=items.length||(timed&&Date.now()>=end))return finish();
    const it=items[i];locked=false;
    box.innerHTML=`${timed?`<div class="prog timer"><i id="tbar" style="width:100%"></i></div>`:`<div class="prog"><i style="width:${i/items.length*100}%"></i></div>`}
      <div class="row small muted"><span>Soru ${i+1}/${items.length}</span><span style="flex:1"></span><span>✔ ${ok}</span></div>
      ${it.big?`<div style="font-size:30px;font-family:var(--f-display);font-weight:800;margin:6px 0">${it.big}</div>`:""}
      <div class="qprompt">${it.q}</div>
      ${it.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}<div id="fb"></div>`;
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickAns(+b.dataset.k));
  }
  function pickAns(k){
    if(locked)return;locked=true;const it=items[i];const good=k===it.a;if(good)ok++;else wrong++;
    box.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===it.a)b.classList.add("ok");else if(j===k)b.classList.add("no")});
    if(!good)box.querySelector(".opt.no")?.classList.add("shake");
    box.querySelector("#fb").innerHTML=`<div class="feedback ${good?"ok":"no"}"><b>${good?"Doğru! ":"Yanlış. "}</b><span>${it.why||""}</span></div>${timed?"":`<button class="btn" id="nx">${i+1>=items.length?"Bitir":"Devam"} →</button>`}`;
    if(timed)setTimeout(()=>{i++;q()},good?450:1300);else box.querySelector("#nx").onclick=()=>{i++;q()};
  }
  if(timed){end=Date.now()+timed*1000;tm=setInterval(()=>{const r=end-Date.now();const b=box.querySelector("#tbar");if(b)b.style.width=Math.max(0,r/(timed*10))+"%";if(r<=0&&!locked)finish()},120)}
  q();
}

/* ---- Oyunlar ---- */
function vOyun(){
  const G=[["det","🕵️","Hadis Dedektifi","Tanımı oku, doğru terimi bul. 10 soru.","detective"],
   ["kr","⚡","Kabul-Red Hızı","Makbûl mü, merdûd mu? 45 saniye.","kr"],
   ["tree","🌳","Hadis Ağacı","Terimi doğru dala yerleştir. 45 saniye.","tree"],
   ["mem","🧠","Terim Eşleştirme","Terimi tanımıyla eşleştir.","memory"],
   ["sira","🪜","Sıralama","Kuvvet merdiveni ve Buhârî senedi.","order"]];
  return `<h1>Oyun Salonu</h1><p class="muted">Her oyun puan kazandırır. En iyi skorun saklanır.</p>
  <div class="grid2">${G.map(g=>`<button class="game" data-act="play" data-g="${g[4]}"><span class="gi">${g[1]}</span><span><b>${g[2]}</b><br><span class="muted small">${g[3]}</span><br><span class="tag">En iyi: ${S.best[g[0]]??"–"}</span></span></button>`).join("")}</div>`;
}
function gameShell(title){return `<button class="back" data-act="home">← Geri</button><h2>${title}</h2><div class="card" id="gbox"></div>`}
function endCard(box,score,label,gain,again){box.innerHTML=`<div class="result"><div class="big">${score}</div><p>${label}</p><p class="muted">+${gain} ⭐ kazandın</p><div class="row" style="justify-content:center"><button class="btn ghost" data-act="home">Geri</button><button class="btn" data-act="play" data-g="${again}">Tekrar oyna</button></div></div>`}
function play(g){tab="oyun";view=()=>gameShell(({detective:"🕵️ Hadis Dedektifi",kr:"⚡ Kabul-Red Hızı",tree:"🌳 Hadis Ağacı",memory:"🧠 Terim Eşleştirme",order:"🪜 Sıralama"})[g]);render();({detective:gDet,kr:gKr,tree:gTree,memory:gMem,order:gOrder})[g]($("#gbox"))}
function detItems(n){return pick(DET,n).map(d=>{const opts=shuffle([d[1],...pick(TERMS.filter(t=>t!==d[1]),3)]);return {q:`“${d[0]}” hangi terimle anılır?`,opts,a:opts.indexOf(d[1]),why:`<b>${d[1]}</b>: ${d[2]}`}})}
function krItems(n){return pick(KR,n).map(d=>{const opts=["Makbûl","Merdûd"];return {q:d[0],opts,a:opts.indexOf(d[1]),why:`<b>${d[1]}</b>. ${d[2]}`}})}
function gDet(box){runQuiz(box,{items:detItems(10),done:(ok,t)=>{S.best.det=Math.max(S.best.det||0,ok);const g=ok*8;addXp(g);if(ok>=8)confetti();endCard(box,`${ok}/${t}`,ok>=8?"Harika bir muhaddis dedektifsin!":ok>=5?"İyi gidiyorsun!":"Dersleri tekrar edip yeniden dene.",g,"detective")}})}
function gKr(box){runQuiz(box,{items:krItems(KR.length),timed:45,done:(ok,t,w)=>{S.best.kr=Math.max(S.best.kr||0,ok);const g=ok*5;addXp(g);endCard(box,ok,`45 saniyede ${ok} doğru (${w} yanlış).`,g,"kr")}})}
function gTree(box){
  const its=pick(TREE,TREE.length).map(t=>({big:t[0],q:"Bu terim hangi dala girer?",opts:GRP,a:t[1],why:`${t[0]} → <b>${GRP[t[1]]}</b>`}));
  runQuiz(box,{items:its,timed:45,done:(ok,t,w)=>{S.best.tree=Math.max(S.best.tree||0,ok);const g=ok*4;addXp(g);endCard(box,ok,`45 saniyede ${ok} doğru (${w} yanlış).`,g,"tree")}});
}
function gMem(box){
  const ps=pick(PAIRS,6);let cards=shuffle(ps.flatMap((p,i)=>[{id:i,t:p[0],term:true},{id:i,t:p[1],term:false}]).map((c,k)=>({...c,k})));
  let open=[],moves=0,found=0,lock=false;
  function draw(){box.innerHTML=`<p class="muted small">Terimi tanımıyla eşleştir. Hamle: <b>${moves}</b></p><div class="mgrid">${cards.map(c=>`<button class="mc ${c.found?"found":c.up?"up":"down"}" data-k="${c.k}">${c.found||c.up?(c.term?`<b>${c.t}</b>`:c.t):"?"}</button>`).join("")}</div>`;
    box.querySelectorAll(".mc").forEach(b=>b.onclick=()=>flip(+b.dataset.k))}
  function flip(k){const c=cards.find(x=>x.k===k);if(lock||c.up||c.found)return;c.up=true;open.push(c);draw();
    if(open.length===2){moves++;lock=true;
      if(open[0].id===open[1].id){open.forEach(x=>x.found=true);found++;open=[];lock=false;draw();if(found===ps.length){const g=Math.max(10,40-moves*2);S.best.mem=Math.min(S.best.mem??99,moves);addXp(g);confetti();endCard(box,moves,"hamlede bitirdin",g,"memory")}}
      else setTimeout(()=>{open.forEach(x=>x.up=false);open=[];lock=false;draw()},900)}}
  draw();
}
function gOrder(box){
  const its=pick(ORDER,5);let i=0,ok=0;
  function q(){
    if(i>=its.length){const g=ok*12;S.best.sira=Math.max(S.best.sira||0,ok);addXp(g);return endCard(box,`${ok}/${its.length}`,"sıralama doğru",g,"order")}
    const it=its[i];let chosen=[],bank=shuffle(it.tiles.map((w,k)=>({w,k:it.tiles.indexOf(w)})));
    const cls=it.ar?"tile":"tile tr";
    const d=()=>{
      box.innerHTML=`<div class="prog"><i style="width:${i/its.length*100}%"></i></div><p class="qprompt">${it.q}</p>
      <p class="muted small">Kutuları doğru sıraya dokunarak yerleştir (soldan sağa).</p>
      <div class="slot ltr" id="slot">${chosen.map(c=>`<button class="${cls}" data-u="${c.k}">${c.w}</button>`).join("")}</div>
      <div class="bank ltr">${bank.map(c=>`<button class="${cls}" data-p="${c.k}">${c.w}</button>`).join("")}</div>
      <div id="fb"></div><div class="row"><button class="btn ghost sm" id="rs">↺ Sıfırla</button><button class="btn sm" id="ck" ${bank.length?"disabled":""}>Kontrol et</button></div>`;
      box.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const c=bank.find(x=>x.k==b.dataset.p);bank=bank.filter(x=>x!==c);chosen.push(c);d()});
      box.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const c=chosen.find(x=>x.k==b.dataset.u);chosen=chosen.filter(x=>x!==c);bank.push(c);d()});
      box.querySelector("#rs").onclick=()=>{bank=shuffle(it.tiles.map((w,k)=>({w,k})));chosen=[];d()};
      box.querySelector("#ck").onclick=()=>{const good=chosen.every((c,idx)=>c.k===idx);if(good)ok++;
        box.querySelector("#fb").innerHTML=`<div class="feedback ${good?"ok":"no"}"><b>${good?"Doğru!":"Olmadı."}</b> <span>${it.tiles.join(" → ")}</span></div><button class="btn" id="nx">Devam →</button>`;
        box.querySelectorAll("button").forEach(b=>{if(b.id!=="nx")b.disabled=true});box.querySelector("#nx").onclick=()=>{i++;q()}};
    };d();
  }
  q();
}

const INTERVAL=[0,1,3,7,14];
function dueCards(){const t=today();return CARDS.map((c,i)=>({i,c,st:S.cards[i]||{b:0,d:t}})).filter(x=>x.st.d<=t)}
let fc=null;
function vKart(){const due=dueCards();const mastered=Object.values(S.cards).filter(s=>s.b>=4).length;
  return `<h1>Terim Kartları</h1><p class="muted">Aralıklı tekrar: bildiğin kart seyrek, bilmediğin sık gelir.</p>
  <div class="card stats"><div><b>${CARDS.length}</b><span>toplam</span></div><div><b>${due.length}</b><span>bugün sırada</span></div><div><b>${mastered}</b><span>öğrenildi</span></div></div>

  <p class="muted small" style="text-align:center">Sırada ${due.length} kart</p>`}

  <h2 style="margin-top:22px">Müellif ve Eser</h2>
  <div class="card"><p><b>İbn Hacer el-Askalânî</b> (773–852 h.), hadis ilminin en büyük âlimlerindendir; Şâfiî mezhebinden olup “Emîrü'l-Mü'minîn fi'l-hadîs” diye anılır. <i>Nuhbetü'l-Fiker</i> kısa bir usûl metnidir; <i>Nüzhetü'n-Nazar</i> bu metnin kendi şerhidir. Eser, haberin yol sayısından başlayıp makbûl-merdûd ayrımına, sened kopukluğuna, râvi kusurlarına, rivayet usûlüne ve ricâl bilgisine (hâtime) uzanan sistemli bir tasnifle ilerler.</p></div>
  <h2>Ayarlar</h2><div class="card row"><button class="btn ghost sm" data-act="theme">🌓 Tema değiştir</button><button class="btn ghost sm" data-act="reset">Sıfırla</button></div>`}

/* ============================ OLAYLAR ============================ */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
  if(a==="tab"){tab=t.dataset.k;view=null;render()}
  else if(a==="home"){view=null;render()}
  else if(a==="lesson"){const id=+t.dataset.id;tab="yol";view=()=>vLesson(id);render()}
  else if(a==="exnote"){$("#en-"+t.dataset.i).classList.toggle("on")}
  else if(a==="speak"){speak(t.dataset.t)}
  else if(a==="play"){play(t.dataset.g)}
  else if(a==="exam"){exam()}
  else if(a==="flip"){fc.flip=true;$("#fcbox").innerHTML=fcHtml()}
  else if(a==="card"){
    const i=fc.i,st=S.cards[i]||{b:0,d:today()};
    if(t.dataset.v==="1"){st.b=Math.min(4,st.b+1);addXp(2)}else st.b=0;
    st.d=new Date(Date.now()+INTERVAL[st.b]*864e5).toISOString().slice(0,10);
    if(t.dataset.v==="0")st.d=today();
    S.cards[i]=st;save();
    const prev=i;fc=null;const due=dueCards().filter(x=>x.i!==prev);
    if(due.length)fc={i:due[(Math.random()*due.length)|0].i,flip:false};
    const y=scrollY;render();scrollTo(0,y)}
  else if(a==="theme"){const d=document.documentElement;const dark=getComputedStyle(d).colorScheme==="dark";S.theme=dark?"light":"dark";d.dataset.theme=S.theme;save()}
  else if(a==="reset"){if(confirm("Tüm ilerleme silinsin mi?")){localStorage.removeItem(KEY);location.reload()}}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches('[role="button"]')){e.preventDefault();e.target.click()}});
if(S.theme)document.documentElement.dataset.theme=S.theme;
touchStreak();render();
</script>
</body>
</html>
