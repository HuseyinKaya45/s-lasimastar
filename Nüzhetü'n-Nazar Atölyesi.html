<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nüzhetü'n-Nazar Atölyesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Amiri:wght@400;700&display=swap">
<style>
:root{
  --paper:#F4F6F2;--card:#fff;--ink:#1B2420;--muted:#5E6A63;--line:#D9E0DA;--soft:#EAEFEA;
  --accent:#1E5B4F;--accent-ink:#fff;--gold:#B98A1B;
  --ref:#B3402F;--nasb:#A86A0E;--cerr:#2D5FA8;--cezm:#6A4FB0;--none:#6B6152;
  --good:#1F7A3E;--bad:#B3261E;--good-bg:#E2F2E6;--bad-bg:#FBE7E4;
  --f-display:"Alegreya",Georgia,serif;--f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --f-ar:"Amiri","Scheherazade New","Traditional Arabic","Noto Naskh Arabic",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111614;--card:#19201D;--ink:#E6ECE8;--muted:#9FACA5;--line:#2C3632;--soft:#202925;
  --accent:#6CC3AE;--accent-ink:#0d1a16;--gold:#E6BE5A;
  --ref:#F28B78;--nasb:#EDB45C;--cerr:#8DB4F5;--cezm:#ABA3F5;--none:#CDBB95;
  --good:#6FD08E;--bad:#FF8A80;--good-bg:#17301F;--bad-bg:#3A1D1A;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111614;--card:#19201D;--ink:#E6ECE8;--muted:#9FACA5;--line:#2C3632;--soft:#202925;
  --accent:#6CC3AE;--accent-ink:#0d1a16;--gold:#E6BE5A;
  --ref:#F28B78;--nasb:#EDB45C;--cerr:#8DB4F5;--cezm:#ABA3F5;--none:#CDBB95;
  --good:#6FD08E;--bad:#FF8A80;--good-bg:#17301F;--bad-bg:#3A1D1A;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0 0 .4em;line-height:1.2;letter-spacing:.1px}
h1{font-size:30px;font-weight:800}h2{font-size:23px;font-weight:700}h3{font-size:18px;font-weight:700}
p{margin:.5em 0}
button{font:inherit;color:inherit;cursor:pointer}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;line-height:1.9}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px;height:54px}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .ar{font-size:22px;color:var(--accent);margin-left:6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;background:var(--soft);font-weight:700;font-size:14px;white-space:nowrap}
.xpbar{height:4px;background:var(--soft)}.xpbar i{display:block;height:100%;background:var(--accent);transition:width .5s}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0}
nav.bottom button{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);font-size:12.5px;font-weight:700}
nav.bottom button .ic{font-size:21px;line-height:1.1}
nav.bottom button.on{color:var(--accent)}
main{padding:18px 0 30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
.card.soft{background:var(--soft);border-color:transparent}
.hero{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000));color:var(--accent-ink);border:0;position:relative;overflow:hidden}
.hero .big-ar{position:absolute;right:-6px;top:-18px;font-size:120px;opacity:.13;line-height:1;pointer-events:none}
.hero h1{margin-bottom:4px}.hero p{opacity:.92;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 18px;border-radius:12px;border:1.5px solid var(--accent);
  background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.light{background:#fff;color:#1E5B4F;border-color:#fff}
.btn.sm{min-height:36px;padding:4px 12px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:14.5px}
.babhead{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.babhead .ar{font-size:26px;color:var(--accent)}
.lesson{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.lesson:hover{border-color:var(--accent)}
.lesson .num{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:800;font-family:var(--f-display);font-size:19px;flex:none}
.lesson.done .num{background:var(--good);color:#fff}
.lesson .t{flex:1;min-width:0}.lesson .t b{display:block}.lesson .t .ar{font-size:20px;color:var(--muted)}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.game{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%}
.game:hover{border-color:var(--accent)}
.game .gi{font-size:30px;line-height:1}
.game b{font-family:var(--f-display);font-size:18px}
/* i'rab renkleri */
.w{display:inline-block;padding:0 8px;margin:2px 3px;border-radius:10px;border:1.5px solid transparent;background:var(--soft);font-family:var(--f-ar);font-size:30px;line-height:1.7;cursor:pointer}
.w.plain{background:transparent;cursor:default}
.w.r{color:var(--ref);border-color:color-mix(in srgb,var(--ref) 45%,transparent);background:color-mix(in srgb,var(--ref) 9%,transparent)}
.w.n{color:var(--nasb);border-color:color-mix(in srgb,var(--nasb) 45%,transparent);background:color-mix(in srgb,var(--nasb) 10%,transparent)}
.w.c{color:var(--cerr);border-color:color-mix(in srgb,var(--cerr) 45%,transparent);background:color-mix(in srgb,var(--cerr) 9%,transparent)}
.w.z{color:var(--cezm);border-color:color-mix(in srgb,var(--cezm) 45%,transparent);background:color-mix(in srgb,var(--cezm) 9%,transparent)}
.w.x{color:var(--none);border-color:color-mix(in srgb,var(--none) 45%,transparent)}
.w.sel{outline:3px solid var(--accent);outline-offset:1px}
.sent{direction:rtl;text-align:right;padding:6px 0}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:13.5px;font-weight:700;margin:6px 0 4px}
.legend span{padding:1px 10px;border-radius:99px;border:1.5px solid}
.lg-r{color:var(--ref);border-color:var(--ref)}.lg-n{color:var(--nasb);border-color:var(--nasb)}.lg-c{color:var(--cerr);border-color:var(--cerr)}.lg-z{color:var(--cezm);border-color:var(--cezm)}
.reveal{min-height:56px;border-radius:12px;background:var(--soft);padding:10px 14px;font-size:16.5px;margin-top:6px}
.reveal b{font-family:var(--f-display)}
table.t{width:100%;border-collapse:collapse;font-size:15.5px;margin:8px 0}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.t th{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
table.t .ar{font-size:21px;line-height:1.5}
.tblwrap{overflow-x:auto}
.callout{border-left:4px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent);padding:10px 14px;border-radius:0 12px 12px 0;margin:12px 0}
.callout b{color:var(--gold)}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:17px;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.opt .ar{font-size:22px}
.qprompt{font-size:19px;font-weight:500}
.feedback{border-radius:12px;padding:10px 14px;margin:10px 0}
.feedback.ok{background:var(--good-bg);color:var(--good)}.feedback.no{background:var(--bad-bg);color:var(--bad)}
.feedback span{color:var(--ink)}
.prog{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0 14px}.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.timer i{background:var(--gold)}
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 0;margin-bottom:6px;font-size:16px}
.flash{perspective:900px;margin:10px 0}
.flash .face{min-height:200px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;padding:20px;text-align:center;cursor:pointer}
.flash .face .ar{font-size:44px}
.flash .face.back-face{background:var(--soft)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:480px){.mgrid{grid-template-columns:repeat(3,1fr)}}
.mc{min-height:84px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;padding:4px;text-align:center;font-size:14.5px;line-height:1.25;font-weight:500}
.mc.down{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:26px}
.mc.up{background:var(--soft)}
.mc.up .ar{font-size:23px}
.mc.found{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.mc.found .ar{font-size:22px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0;direction:rtl;min-height:54px}
.slot{min-height:78px;border:2px dashed var(--line);border-radius:14px;padding:8px;direction:rtl;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.tile{font-family:var(--f-ar);font-size:27px;padding:2px 14px;border-radius:10px;border:1.5px solid var(--accent);background:var(--card);line-height:1.7}
.tile:hover{background:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.1}
.stats span{font-size:13.5px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1.5px solid var(--line);border-radius:14px;padding:10px;text-align:center;opacity:.45;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.badge .bi{font-size:30px}.badge b{display:block;font-size:15px}.badge span{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);
  padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;transition:.3s;z-index:30;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sp{background:none;border:1.5px solid var(--line);border-radius:50%;width:34px;height:34px;font-size:16px;vertical-align:middle}
.result{text-align:center;padding:10px 0}.result .big{font-family:var(--f-display);font-size:56px;font-weight:800;color:var(--accent);line-height:1}
.stars{font-size:34px;letter-spacing:4px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:9px;height:14px;opacity:.9;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){.confetti{display:none}*{transition:none!important}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.sec-h{display:flex;align-items:center;gap:8px}
.sec-h .ar{color:var(--accent);font-size:24px}
.chain{display:flex;gap:4px;align-items:center;flex-wrap:wrap;direction:ltr;margin:6px 0 10px}
.node{padding:4px 10px;border-radius:10px;border:1.5px solid var(--accent);background:var(--soft);font-size:14px;font-weight:700}
.node.miss{border:1.5px dashed var(--bad);color:var(--bad);background:var(--bad-bg);text-decoration:line-through}
.node.top{background:var(--accent);color:var(--accent-ink)}.node.end{border-color:var(--gold);color:var(--gold)}
.arrow{color:var(--muted)}
.exar{font-family:var(--f-ar);direction:rtl;font-size:27px;line-height:1.9;text-align:right}
.exnote{display:none;margin-top:8px}.exnote.on{display:block}
.tile.tr{font-family:var(--f-body);font-size:17px;padding:8px 14px}
.slot.ltr,.bank.ltr{direction:ltr}
.quote{border-left:4px solid var(--accent);background:var(--soft);border-radius:0 12px 12px 0;padding:6px 12px;margin:10px 0}
.quote .exar{font-size:24px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">Nüzhetü'n-Nazar <span class="ar">نُزْهَةُ النَّظَرِ</span></div>
    <span class="pill" id="pStreak" title="Gün serisi">🔥 0</span>
    <span class="pill" id="pXp" title="Puan">⭐ 0</span>
  </div>
  <div class="xpbar"><i id="xpFill" style="width:0"></i></div>
</header>
<div class="wrap"><main id="app"></main></div>
<nav class="bottom"><div class="wrap" id="nav"></div></nav>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================ VERİ ============================ */
// Sayfa atıfları (s.) Nûreddîn Itr tahkîkli baskının BASILI sayfa numarasıdır (PDF sayfası = basılı + 1).
const BABS=[
 {id:1,tr:"Giriş ve Haber (s.33–52)",ar:"الْخَبَرُ وَأَقْسَامُهُ"},
 {id:2,tr:"Makbûl Hadis (s.52–75)",ar:"الْمَقْبُولُ"},
 {id:3,tr:"Merdûd Hadis (s.75–101)",ar:"الْمَرْدُودُ"},
 {id:4,tr:"İsnad, Rivayet ve Râviler (s.102–146)",ar:"الْإِسْنَادُ وَالرُّوَاةُ"}
];
const EX=(ar,tr,tag,note)=>({ar,tr,tag,note});
const CH=(label,nodes)=>({label,nodes});
const Q=(ar,tr,pg)=>({ar,tr,pg});

const LESSONS=[
/* ---------------- BÂB 1 ---------------- */
{id:1,bab:1,pg:"s.33–37",icon:"📖",tr:"Telif Tarihi, Haber–Hadis–Sünnet–Eser",ar:"التَّصْنِيفُ فِي عُلُومِ الْحَدِيثِ",
 goal:"Hadis usûlünde eser yazan ilk müelliflerin sırasını ve haber, hadis, sünnet, eser terimlerinin eserdeki anlamını öğreneceksin.",
 secs:[
  {h:"Kitabın yapısı",p:"<i>Nüzhetü'n-Nazar</i>, İbn Hacer'in kendi <i>Nuhbetü'l-Fiker</i> adlı kısa usûl metnine yazdığı şerhtir. Şerh, metnin cümlelerini içine alarak ilerler; köşeli parantezli başlıklar (<span class='ar'>[الْعَزِيزُ]</span> gibi) konuları ayırır. Konu sırası: haber → makbûl-merdûd → râvi kusurları → isnad ve rivayet → râvi bilgisi (hâtime)."},
  {h:"Usûl telifinin tarihi (s.33–36)",table:[["Müellif","Eser / not"],
   ["Kâdî Ebû Muhammed er-Râmehürmüzî","<span class='ar'>الْمُحَدِّثُ الْفَاصِلُ</span> — bu alanda eser yazan ilk kişi olarak anılır"],
   ["el-Hâkim en-Nîsâbûrî","Ma'rifetü ulûmi'l-hadîs (düzenli ve tam değil)"],
   ["Ebû Nuaym el-İsfahânî","Hâkim'in eserine mustahrec yazdı"],
   ["el-Hatîb el-Bağdâdî","<i>el-Kifâye</i> (rivayet kuralları) ve <i>el-Câmi' li-âdâbi'ş-şeyh ve's-sâmi'</i> (âdâb)"],
   ["İbnü's-Salâh (ö.643)","<i>el-Mukaddime</i> (Ulûmü'l-hadîs); Eşrefiyye Dârü'l-hadîs'te yazdı"]]},
  {h:"Haber, hadis, sünnet, eser (s.36)",p:"Eserde haber, bu fen âlimlerine göre <b>hadisle eş anlamlıdır</b>; bir görüşe göre hadis Peygamber'den (s.a.v.) gelen, haber ise başkasından gelendir. Tarihle uğraşana <b>ahbârî</b>, sünnetle uğraşana <b>muhaddis</b> denir. Dipnotta hadis, Peygamber'e nispet edilen söz, fiil, takrîr ve vasıf olarak tanımlanır; nispet sahâbî ve tâbiîye de olabilir. Usûlcüler sünneti söz-fiil-takrîr diye ele alır."},
  {callout:"Ayrım: <b>sened</b> metne ulaştıran râvi zinciridir; <b>metin</b> senedin ulaştığı sözdür (s.33 dipnot). Ayrıntılı tanım s.102'de gelir (Ders 15)."}],
 ex:[],
 mini:[
  ["Bu alanda eser yazan ilk müellif olarak kimin adı geçer?",["Kâdî er-Râmehürmüzî (el-Muhaddisü'l-fâsıl)","el-Hâkim en-Nîsâbûrî","İbnü's-Salâh"],0,"İlk telif Râmehürmüzî'nin <i>el-Muhaddisü'l-fâsıl</i> adlı eseridir (s.33)."],
  ["<i>el-Kifâye</i> ve <i>el-Câmi' li-âdâbi'ş-şeyh ve's-sâmi'</i> kimin eserleridir?",["Ebû Nuaym","el-Hatîb el-Bağdâdî","Kâdî Iyâz"],1,"Hatîb, rivayet kâidelerini ve şeyh-talebe âdâbını ayrı eserlerde yazdı (s.34–35)."],
  ["Eserde haber ile hadis nasıl ele alınır?",["Haber, hadisle eş anlamlı kabul edilir","Haber daima sahâbî sözüdür","Haber hadisten kesinlikle farklıdır"],0,"Bu fen âlimlerine göre haber hadisle müterâdiftir (s.36)."]]},

{id:2,bab:1,pg:"s.37–41",icon:"🌊",tr:"Mütevâtir",ar:"الْمُتَوَاتِرُ",
 goal:"Mütevâtirin şartlarını, sayı görüşlerinin neden reddedildiğini ve ilm-i darûrî–nazarî tartışmasını öğreneceksin.",
 secs:[
  {h:"Haberin ilk bölünmesi (s.37)",p:"Haber, bize ulaşan <b>yol (tarîk) sayısına</b> göre ya çok yollu ya da tek yollu olur. Sened, metnin yolunu hikâye eden râvi zinciridir; yolların çoğuluna <i>turuk</i>, senedlerin çoğuluna <i>esânîd</i> denir."},
  {quote:[Q("فَالْأَوَّلُ: الْمُتَوَاتِرُ، وَهُوَ الْمُفِيدُ لِلْعِلْمِ الْيَقِينِيِّ - فَأَخْرَجَ النَّظَرِيَّ - عَلَى مَا يَأْتِي تَقْرِيرُهُ - بِشُرُوطِهِ الَّتِي تَقَدَّمَتْ","Birincisi mütevâtirdir: yakîn ilmi ifade edendir (nazarî ilmi, ileride açıklanacağı üzere, dışarıda bırakır); daha önce geçen şartlarıyla.","s.40")]},
  {h:"Dört şart (s.38–40)",table:[["Şart","Açıklama"],
   ["1. Çok sayıda râvi","Yalan üzerinde birleşmeleri <b>âdeten imkânsız</b> olacak kadar çok"],
   ["2. Her tabakada aynı çokluk","Senedin başından sonuna eşit sayıda"],
   ["3. Hisse dayanmak","“Gördüm, işittim” gibi; akıl yürütmeye değil"],
   ["4. İlim ifade etmesi","Haber dinleyende ilim doğurmalı"]]},
  {h:"Sayı görüşleri reddedilir",p:"Bazıları mütevâtir için 4, 5, 7, 10, 12, 40 veya 70 gibi belli sayılar söylemiştir. İbn Hacer her grubun kendi sayısına delil getirdiğini, fakat sayının zikredilmesinin ilmi garanti etmediğini belirtir; doğrusu <b>belli bir sayı sınırı koymamaktır</b> (s.37–39). Aklî hükümler (“bir, ikinin yarısıdır”) hissî değildir, tevâtür konusu olmaz."},
  {h:"İlm-i darûrî ve nazarî",p:"Yakîn, gerçeğe uygun kesin inançtır. Mütevâtir <b>ilm-i darûrî</b> (insanın zorunlu olarak edindiği, delil aramadan hâsıl olan ilim) ifade eder; bunun dışındaki görüşe (ilm-i nazarî) karşı gösterilen gerekçe şudur: avâm nazar ehli değildir, nazarî olsaydı onlarda ilim hâsıl olmazdı (s.40–41). Mütevâtirde râvilerin hâli araştırılmaz."},
  {h:"Mütevâtir örnekleri ve İbnü's-Salâh tartışması (s.41)",p:"İbnü's-Salâh, mütevâtirin “<span class='ar'>مَنْ كَذَبَ عَلَيَّ مُتَعَمِّدًا</span>” hadisi dışında hemen hiç bulunmadığını söylemiştir. İbn Hacer bu iddiayı reddeder: bu ancak taramanın az olmasındandır, meşhur kitaplarda tevâtür eden hadis çoktur. Dipnotta havz, mesh ve “Kur'ân yedi harf üzere indi” hadisleri gibi örnekler anılır. Hanefîler haberi sened bakımından <b>mütevâtir, meşhûr, âhâd</b> olarak üçe böler (dipnot, s.40)."}],
 ex:[EX("مَنْ كَذَبَ عَلَيَّ مُتَعَمِّدًا فَلْيَتَبَوَّأْ مَقْعَدَهُ مِنَ النَّارِ","Kim bilerek bana yalan isnat ederse yerini ateşte hazırlasın.","Mütevâtir örneği (s.38, 41)","Kitapta mütevâtirin açık örneği olarak verilir; dipnotta yetmişten fazla sahâbîden rivayet edildiği belirtilir.")],
 mini:[
  ["Mütevâtirin şartı olarak aşağıdakilerden hangisi <b>sayılmaz</b>?",["Her tabakada çokluğun eşit olması","Râvilerin tam olarak 10 kişi olması","Haberin hisse dayanması"],1,"İbn Hacer belli bir sayıyı şart koşmaz; 4, 5, 7, 10, 12, 40, 70 gibi sayı görüşlerini reddeder (s.37–39)."],
  ["Mütevâtir haber hangi bilgiyi verir?",["İlm-i darûrî (yakîn)","Yalnız zan","Yalnız şüphe"],0,"Yakîn ifade eder; kitap bunun darûrî olduğunu söyler (s.40–41)."],
  ["Hanefîlerin sened bakımından üçlü taksimi hangisidir?",["Mütevâtir–meşhûr–âhâd","Sahih–hasen–zayıf","Merfû'–mevkûf–maktû'"],0,"Dipnotta Hanefî tasnifi böyle anılır (s.40)."]]},

{id:3,bab:1,pg:"s.42–52",icon:"🌿",tr:"Âhâd I: Meşhûr, Azîz, Garîb, Ferd",ar:"الْمَشْهُورُ وَالْعَزِيزُ وَالْغَرِيبُ",
 goal:"Âhâdın üç kısmını eserin tanımlarıyla öğrenip, azîz hakkındaki tartışmayı ve garîb mutlak-nisbî ayrımını ayırt edeceksin.",
 secs:[
  {h:"Meşhûr (s.42–43)",quote:[Q("وَالثَّانِي - وَهُوَ أَوَّلُ أَقْسَامِ الْآحَادِ - مَا لَهُ طُرُقٌ مَحْصُورَةٌ بِأَكْثَرَ مِنِ اثْنَيْنِ، وَهُوَ الْمَشْهُورُ عِنْدَ الْمُحَدِّثِينَ","İkincisi — ki âhâdın ilk kısmıdır — yolları ikiden fazla ve sayılı olan haberdir; muhaddislere göre meşhûrdur.","s.42")]},
  {p:"Fakihler buna <b>müstefîz</b> der; bazıları müstefîzi, başı ve sonu eşit olan haber diye meşhûrdan ayırır (meşhûr daha geneldir). Her mütevâtir meşhûrdur, her meşhûr mütevâtir değildir. Dipnotta meşhûrun sahih, hasen veya zayıf olabileceği belirtilir: “<span class='ar'>لَا ضَرَرَ وَلَا ضِرَارَ</span>” hasen, “<span class='ar'>اطْلُبُوا الْعِلْمَ وَلَوْ بِالصِّينِ</span>” zayıf meşhûr örnekleri olarak anılır. Dilde “meşhûr” diye anılanla (dillerde yaygın olanla) muhaddislerin ıstılahı farklıdır; Hanefî meşhûru da muhaddis meşhûrundan ayrıdır."},
  {h:"Azîz (s.43–45)",quote:[Q("وَالثَّالِثُ: الْعَزِيزُ: وَهُوَ أَنْ لَا يَرْوِيَهُ أَقَلُّ مِنِ اثْنَيْنِ عَنِ اثْنَيْنِ","Üçüncüsü azîzdir: ikiden az kişinin ikiden az kişiden rivayet etmediği hadistir.","s.43")]},
  {p:"Adını ya varlığının azlığından ya da başka yoldan gelerek <i>azze</i> (güçlenmesinden) alır. İbn Hacer şunları da açıklar: azîzlik <b>sahihin şartı değildir</b>; bunu iddia eden Ebû Alî el-Cübbâî (Mu'tezile) hatalıdır. Kâdî Ebû Bekir İbnü'l-Arabî azîzi Buhârî'nin şartı saymıştır; İbn Hacer buna Buhârî'nin ilk hadisi “<span class='ar'>إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ</span>”i karşı örnek getirir: bu hadis azîz değil garîbtir. İbn Hibbân'ın “senet ikiden başlamaz” görüşüne de İbn Hacer, kendisinin sınırının “ikiden aza düşmemek” olduğunu belirterek cevap verir."},
  {h:"Garîb (s.45–46)",quote:[Q("وَالرَّابِعُ: الْغَرِيبُ: وَهُوَ مَا يَتَفَرَّدُ بِرِوَايَتِهِ شَخْصٌ وَاحِدٌ فِي أَيِّ مَوْضِعٍ وَقَعَ التَّفَرُّدُ بِهِ مِنَ السَّنَدِ","Dördüncüsü garîbtir: senedin herhangi bir yerinde tek bir kişinin rivayetiyle teferrüd ettiği hadistir.","s.45")]},
  {h:"Ferd mutlak ve nisbî (s.50–52)",table:[["Tür","Teferrüd nerede?","Not"],
   ["Ferd mutlak","Senedin aslında (tâbiîde, sahâbîden alanlar tabakasında)","Örnek: Abdullah b. Dînâr'ın İbn Ömer'den tek başına rivayet ettiği velâ hadisi"],
   ["Ferd nisbî","Belli bir kişiye nispetle tek kalma","Hadis aslında meşhûr olsa da bir râvi bakımından teferrüd olur"]]},
  {callout:"Garîb ve ferd ıstılahta ve lugatta müterâdiftir. Kullanımda <b>ferd</b> çoğunlukla ferd mutlak, <b>garîb</b> çoğunlukla ferd nisbî için kullanılır (s.52). Dört kısımdan mütevâtirden başkası âhâddır."}],
 ex:[EX("إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ","Ameller niyetlere göredir.","Garîb örneği (s.44)","İbnü'l-Arabî'ye karşı kitapta delil olarak getirilir: hadisi Ömer'den yalnız Alkame, ondan yalnız Muhammed b. İbrâhîm, ondan yalnız Yahyâ b. Saîd rivayet eder; sonraki tabakalarda yayılır."),
     EX("لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى أَكُونَ أَحَبَّ إِلَيْهِ مِنْ وَالِدِهِ وَوَلَدِهِ وَالنَّاسِ أَجْمَعِينَ","Biriniz, ben ona babasından, çocuğundan ve bütün insanlardan daha sevgili olmadıkça iman etmiş olmaz.","Azîz örneği (s.45)","Enes'ten (Buhârî, Müslim) ve Ebû Hüreyre'den (Buhârî) gelir; Enes'ten Katâde ve Abdülazîz b. Süheyb, onlardan da birer cemaat rivayet eder.")],

  ["Eserde meşhûrun tanımı hangisidir?",["Yolları ikiden fazla ve sayılı hadis","Yolu tek olan hadis","Her tabakada yüzlerce râvisi olan hadis"],0,"Meşhûr: yolları ikiden fazla ve sınırlı (s.42)."],
  ["Azîz hakkında eserin görüşü hangisidir?",["Sahih hadisin şartıdır","Sahihin şartı değildir; bunu iddia eden Cübbâî'dir","Yalnız Buhârî'de bulunur"],1,"İbn Hacer, Cübbâî'ye ve İbnü'l-Arabî'ye karşı azîzliği sahih şartı saymaz (s.43–44)."],
  ["İbn Hacer, İbnü'l-Arabî'ye karşı hangi hadisi delil getirir?",["Innemâ'l-a'mâl","Men kezebe aleyye","Lâ darare ve lâ dırâr"],0,"Buhârî'nin ilk hadisi azîz değil garîbtir (s.44)."],

{id:4,bab:1,pg:"s.46–50",icon:"⚖️",tr:"Âhâd II: Tanım, Hüküm, Karînelerle Çevrili Haber",ar:"خَبَرُ الْوَاحِدِ",
 goal:"Âhâdın tanımını, makbûl-merdûd-tevakkuf ayrımını ve karînelerle çevrili haberin ilim ifade etmesi tartışmasını öğreneceksin.",
 secs:[
  {h:"Tanım (s.46)",p:"Haber-i vâhid lugatte tek kişinin rivayet ettiği haberdir; ıstılahta <b>mütevâtirin şartlarını toplamayan</b> haberdir. Dört kısımdan mütevâtirden başkası âhâddır: meşhûr, azîz, garîb."},
  {h:"Hüküm (s.46–47)",table:[["Durum","Sonuç"],["Nâkilde kabul sıfatı varsa","Makbûl: doğruluğuna dair zan galip gelir, amel edilir"],["Nâkilde ret sıfatı (yalan vb.) varsa","Merdûd"],["İkisi de belirli değilse","Karîne varsa ilgili kısma katılır; yoksa <b>tevakkuf</b>"]]},
  {p:"Tevakkuf edilen hadis, reddedilmiş gibi amel dışı kalır; fakat gerekçe, ret sıfatının sabit olması değil, kabul sıfatının bulunmamasıdır (s.47)."},
  {h:"Karînelerle çevrili haber (s.47–49)",p:"Âhâd içinde bazı haberler <b>karînelerle çevrilmiştir</b> (muhtaff) ve ilm-i nazarî ifade eder. Eserin örnekleri: (1) Buhârî ve Müslim'in <i>Sahîhayn</i>'da tahric ettiği, mütevâtire ulaşmayan hadisler; (2) tarîkleri çok ve farklı olan, râvileri ve illetleri sağlam meşhûr hadis (Ebû Mansûr el-Bağdâdî ve İbn Fûrek bunu açıkça söyler); (3) hâfızların rivayet ettiği ve garîb olmayan müselsel hadis. Bu ilmi, çoğunlukla hadise vâkıf, râvilerin hâllerini ve illetleri bilen kişiler elde eder (s.50)."},
  {callout:"Bu tartışmada ‘ilim’ kat'î (mütevâtirdeki gibi) değil <b>nazarî</b>dir; ihtilafın büyük kısmı lafzîdir. Sahîhayn hadislerinin kabulü, ümmetin kitapları kabulle karşılamasına (telakkî bi'l-kabûl) dayanır."}],
 ex:[],
 mini:[
  ["Âhâd hadisin ıstılahî tanımı nedir?",["Mütevâtirin şartlarını toplamayan haber","Yalnız tek râvili haber","Yalnız zayıf haber"],0,"Haber-i vâhid, mütevâtir şartlarını toplamayandır (s.46)."],
  ["Kabul de ret sıfatı da sabit değilse ve karîne de yoksa ne yapılır?",["Tevakkuf edilir","Hemen kabul edilir","Hemen reddedilir"],0,"Tevakkuf; gerekçe kabul sıfatının bulunmamasıdır (s.47)."],

{id:5,bab:2,pg:"s.52–60",icon:"✅",tr:"Sahîh li-zâtihi",ar:"الصَّحِيحُ لِذَاتِهِ",
 goal:"Sahihin tanımını kayıtları ve şartlarıyla öğrenecek, esahhu'l-esânîd ve Buhârî–Müslim kıyaslamasını tanıyacaksın.",
 secs:[
  {quote:[Q("وَخَبَرُ الْآحَادِ بِنَقْلِ عَدْلٍ تَامِّ الضَّبْطِ، مُتَّصِلِ السَّنَدِ، غَيْرِ مُعَلَّلٍ وَلَا شَاذٍّ هُوَ الصَّحِيحُ لِذَاتِهِ","Âhâd haber; adil, zabtı tam râvinin nakliyle, senedi muttasıl, illetli ve şâz olmayan: sahîh li-zâtihi.","s.52")]},
  {h:"Beş şart ve tanımları (s.53–55)",table:[["Şart","Eserdeki tanım"],
   ["Adâlet","Takvâ ve mürüvvete devamı sağlayan <b>meleke</b>; takvâ şirk, fısk ve bid'attan kaçınmaktır"],
   ["Tam zabt","<b>Zabt-ı sadr</b>: duyduğunu dilediği zaman hatırlayacak şekilde sağlam tutmak. <b>Zabt-ı kitâb</b>: duyduğundan beri elindeki kitabı koruyup ondan rivayet etmek"],
   ["Muttasıl sened","Senedde düşme yok; her râvi hocasından rivayet ettiğini <b>işitmiş</b>"],
   ["Mu'allel olmayan","Mu'allel: gizli ve kusur verici illeti olan hadis"],
   ["Şâz olmayan","Şâz: râvinin kendinden râcih olana muhalefet ettiği hadis"]]},
  {h:"Dereceler: esahhu'l-esânîd (s.55–57)",p:"Sahihin dereceleri râvilerin adâlet ve zabttaki üstünlüğüne göre değişir. Bazı imamlar şu zincirleri en yüksek diye anar: <b>ez-Zührî → Sâlim → babası İbn Ömer</b>; <b>İbn Sîrîn → Ubeyde → Alî</b>; <b>İbrâhîm en-Nehaî → Alkame → İbn Mes'ûd</b>. Daha aşağı derecede Mâlik→Nâfi'→İbn Ömer gibi zincirler anılır. <b>Muteber görüş</b>, belli bir zincire mutlak olarak ‘esahhu'l-esânîd’ dememektir."},
  {h:"Buhârî ve Müslim (s.57–60)",p:"Buhârî ve Müslim'in birlikte tahric ettiği hadis, yalnız birinin tahric ettiğinden üstündür. Cumhur <i>Sahîh-i Buhârî</i>'yi öne alır. Gerekçeler: <b>ittisâl</b> (Buhârî raviler arasında bir kez de olsa karşılaşmanın sübûtunu ister, Müslim muâsarayı yeterli sayar), <b>adâlet-zabt</b> (Buhârî'nin tenkit edilen râvileri daha az), <b>şâz ve illet</b> (Buhârî'nin tenkit edilen hadisleri daha az). Müslim'in üstünlüğü ise hüsn-i siyâk ve tertîb yönündendir (Mağribliler). “Gök altında Müslim'den sahih kitap yok” sözü Buhârî'den daha sahih demek değildir."},
  {h:"Sahîhin yedi kısmı (s.59)",table:[["#","Kısım"],["1","Buhârî ve Müslim'in ittifak ettiği (muttefekun aleyh)"],["2","Yalnız Buhârî'nin tahric ettiği"],["3","Yalnız Müslim'in tahric ettiği"],["4","İkisinin şartına uyan ama kitaplarında olmayan"],["5","Yalnız Buhârî'nin şartına uyan"],["6","Yalnız Müslim'in şartına uyan"],["7","İkisinin şartında olmayan sahih hadis"]]}],
 ex:[EX("وَخَبَرُ الْآحَادِ بِنَقْلِ عَدْلٍ ...","Sahihin her kaydı bir şeyi dışarıda bırakır","Tanım şerhi (s.55)","“Bi-nakli adlin” kaydı gayri adil nakli; “li-zâtihi” kaydı dışarıdaki bir sebeple sahih sayılanı (li-gayrihi) tanımın dışına çıkarır.")],
 mini:[
  ["Eserde adâletin tanımı nedir?",["Takvâ ve mürüvvete devamı sağlayan meleke","Yalnızca hafıza gücü","Yalnızca yaşın büyüklüğü"],0,"Adâlet bir melekedir (s.53)."],
  ["Zabt-ı sadr nedir?",["Duyduğunu dilediği zaman hatırlayabilecek şekilde sağlam tutmak","Duyduğunu yazıya geçirmek","Hadisi ezber okumak"],0,"Zabt-ı sadr hafızanın, zabt-ı kitâb yazının korunmasıdır (s.53)."],
  ["Buhârî ve Müslim'in muasaraya bakışı nasıldır?",["Buhârî karşılaşmanın sübûtunu ister, Müslim muâsarayı yeterli sayar","İkisi de muasaraya bakmaz","Müslim karşılaşma ister, Buhârî muâsara"],0,"Buhârî'nin şartı ittisâlde daha kuvvetlidir (s.58)."],
  ["Esahhu'l-esânîd konusunda muteber görüş hangisidir?",["Belli bir zincire mutlak olarak denmemesi","Yalnız Zührî–Sâlim–İbn Ömer'e denmesi","Hiçbir sened sahih sayılmaz"],0,"Mutlak itlak yapılmaz (s.56)."]]},

{id:6,bab:2,pg:"s.60–63; 101–102",icon:"🌓",tr:"Hasen, Sahîh li-gayrihi, Hasen li-gayrihi",ar:"الْحَسَنُ",
 goal:"Hasenin türlerini, Tirmizî'nin hasen terimini ve hasen li-gayrihînin hangi zayıf hadislerden oluştuğunu öğreneceksin.",
 secs:[
  {h:"Makbûlün dört türü (s.53)",table:[["Tür","Özellik"],["Sahîh li-zâtihi","Beş şartı kendinde toplar"],["Sahîh li-gayrihi","Kusuru çok yolla telâfi edilen"],["Hasen li-zâtihi","Sahih şartları var, zabt hafif; telâfi yok"],["Hasen li-gayrihi","Zaaf, destekleyen karîne/yolla giderilen"]]},
  {h:"Hasen li-zâtihi (s.60)",quote:[Q("فَإِنْ خَفَّ الضَّبْطُ ... فَهُوَ الْحَسَنُ لِذَاتِهِ، لَا لِشَيْءٍ خَارِجٍ","Zabt hafifse (sahih tanımındaki diğer şartlar baki kalmak kaydıyla) o hasen li-zâtihidir; dışarıdaki bir şey sebebiyle değil.","s.60")]},{p:"Sahihin şartları tamamdır, <b>yalnız zabt hafiftir</b> (<span class='ar'>خَفَّ</span>: azaldı). Hasenliği dışarıdan gelen bir şeyle değil kendindedir; eser, “mestûr hadisinin yolları çoğalınca” örneğini hasen li-gayrihi için verir. Hasen de sahih gibi delil olur, derecesi sahihten aşağıdadır."},
  {h:"Sahîh li-gayrihi (s.60–61)",p:"Hasen li-zâtihi hadis <b>çok yoldan</b> gelince sahih seviyesine yükselir. Güçlenme tek yolda değil, yolların çoğalmasıyla olur: toplam, zabttaki hafif kusuru giderir."},
  {h:"“Hasen sahîh” (s.61–63)",quote:[Q("فَإِنْ جَمَعَا، أَيِ الصَّحِيحَ وَالْحَسَنَ فِي وَصْفٍ وَاحِدٍ، كَقَوْلِ التِّرْمِذِيِّ وَغَيْرِهِ: حَدِيثٌ حَسَنٌ صَحِيحٌ، فَلِلتَّرَدُّدِ الْحَاصِلِ مِنَ الْمُجْتَهِدِ فِي النَّاقِلِ ...","İkisi tek vasıfta birleşirse — Tirmizî ve başkalarının “hadîsun hasenun sahîh” demesi gibi — bu, müctehidin nâkil hakkında duyduğu tereddüttendir…","s.61")]},{p:"Eser “hasen sahîh”i duruma göre iki türlü açıklar: <b>(1) Hadis tek isnadlıysa</b> (teferrüd varsa): müctehid râvinin hâlinde tereddüt eder; bir kesime göre hasen, bir diğerine göre sahihtir; asıl ifade “hasen <b>ev</b> sahîh” iken <i>ev</i> (veya) harfi atılmıştır. Bu durumda “hasen sahîh”, yalnız “sahîh” denen hadisten <b>aşağıdadır</b>; çünkü kesinlik tereddütten güçlüdür. <b>(2) Teferrüd yoksa</b> (çok isnadlıysa): iki isnaddan biri sahih, diğeri hasendir; bu durumda “hasen sahîh”, tek isnadlı “sahîh”ten <b>üstündür</b>, çünkü yol çokluğu güçlendirir (s.61–62). Tirmizî ayrıca <i>el-İlel</i> sonunda ‘hasen’ ile neyi kastettiğini açıklar: râvisi yalanla itham edilmeyen, benzer biçimde başka yoldan da gelen ve şâz olmayan hadis (s.62)."},
  {h:"Hasen li-gayrihi (s.101–102)",p:"Şu hadisler, kendileriyle birlikte <b>muteber</b> (kendi seviyesinde veya daha yukarısında) bir rivayet bulununca hasen li-gayrihi olur: kötü hıfzlı râvinin hadisi, ihtilâta uğrayıp önceki-sonraki ayırt edilememiş râvinin hadisi, mestûr hadisi, mürsel isnad, hâlini bilmediğimiz bir râviden düşen mudelles hadis. Gerekçe: bu râvilerin her birinde doğru ve yanlış rivayet etme ihtimali eşit olduğu için tevakkuf derecesindedir; destekleyici yol bir tarafı güçlendirir ve kabul seviyesine çıkarır, ama hasen li-zâtihi seviyesine değil."},
  {callout:"Kuvvet sırası: <b>sahîh li-zâtihi → sahîh li-gayrihi → hasen li-zâtihi → hasen li-gayrihi</b>. Zaafı çok ağır (yalancı râvi gibi) olan hadis çok yoldan gelse de güçlenmez."}],

  ["Hasen li-gayrihi hangi hadislerden oluşabilir?",["Kötü hıfzlı râvi, mestûr, mürsel isnad gibi hafif zaaflı hadisler","Mevzû' hadisler","Yalancı râvinin hadisleri"],0,"Hafif zaaf çok yolla giderilir; yalancı ve mevzû' bunun dışındadır (s.101–102)."],
  ["Tek isnadlı hadis için “hasen sahîh” eserde nasıl yorumlanır?",["Müctehidin râvi hakkındaki tereddüdü (‘ev’ harfi atılmıştır); bu yüzden yalnız ‘sahîh’ten aşağıdadır","Hadisin mütevâtir olması","Hadisin mevzû' olması"],0,"Tereddüt: hasen ev sahîh. Kesinlik tereddütten güçlü olduğu için ‘sahîh’ daha üsttedir; çok isnadlıda tersi geçerlidir (s.61–62)."],

{id:7,bab:2,pg:"s.63–68",icon:"🔬",tr:"Ziyâdetü's-Sika, Mahfûz–Şâz, Ma'rûf–Münker",ar:"زِيَادَةُ الثِّقَةِ وَالشَّاذُّ",
 goal:"Sikanın ziyâdesinin ne zaman kabul edildiğini, şâz–mahfûz ve münker–ma'rûf ayrımını eserin örnekleriyle öğreneceksin.",
 secs:[
  {h:"Ziyâdetü's-sika (s.63–65)",p:"Sahih ve hasen râvinin yaptığı ilâve (<span class='ar'>وَزِيَادَةُ رَاوِيهِمَا - أَيِ الصَّحِيحِ وَالْحَسَنِ - مَقْبُولَةٌ مَا لَمْ تَقَعْ مُنَافِيَةً لِرِوَايَةِ مَنْ هُوَ أَوْثَقُ مِمَّنْ لَمْ يَذْكُرْ تِلْكَ الزِّيَادَةَ</span>), kendisinden daha sağlam olanın rivayetine <b>aykırı düşmediği sürece makbûldür</b>. İlâve aykırı değilse müstakil hadis hükmündedir; aykırıysa birini kabul diğerini reddetmeyi gerektirir ve <b>tercîh</b> yapılır. Dipnotta üç kısım gösterilir: aykırı olmayan (makbûl), sikaların rivayetine aykırı (şâz, merdûd), mukayyed-mutlak/âm-hâs gibi aykırılık sayılan (ihtilaflı). Mütekaddimîn imamları (Abdurrahmân b. Mehdî, Yahyâ el-Kattân, Ahmed, İbn Maîn, İbnü'l-Medînî, Buhârî, Ebû Zür'a, Ebû Hâtim, Nesâî, Dârakutnî) tercîhi esas alır; hiçbirinden ‘mutlak kabul’ bilinmez."},
  {h:"Mahfûz ve şâz (s.66)",quote:[Q("فَإِنْ خُولِفَ بِأَرْجَحَ مِنْهُ لِمَزِيدِ ضَبْطٍ، أَوْ كَثْرَةِ عَدَدٍ، أَوْ غَيْرِ ذَلِكَ مِنْ وُجُوهِ التَّرْجِيحَاتِ، فَالرَّاجِحُ يُقَالُ لَهُ: الْمَحْفُوظُ، وَمُقَابِلُهُ، وَهُوَ الْمَرْجُوحُ، يُقَالُ لَهُ: الشَّاذُّ","Daha râcih biriyle (zabtın fazlalığı, sayının çokluğu veya başka tercih vecihleriyle) muhalefet edilirse râcih olana mahfûz, mukabili olan mercûha şâz denir.","s.66")]},
  {p:"Muhalefet, zabtın fazlalığı, sayının çokluğu veya başka tercîh vecihleriyle değerlendirilir. Örnek: İbn Uyeyne → Amr b. Dînâr → Avsece → İbn Abbas yoluyla gelen “bir adam öldü, azat ettiği bir mevlâdan başka vâris bırakmadı” hadisi. Hammâd b. Zeyd aynı hadisi İbn Abbas'ı zikretmeden rivayet etti; Ebû Hâtim, adil ve zabtlı olmasına rağmen Hammâd'a karşı sayı bakımından <b>İbn Uyeyne'nin rivayetini</b> mahfûz saydı."},
  {h:"Ma'rûf ve münker (s.67–68)",quote:[Q("وَإِنْ وَقَعَتِ الْمُخَالَفَةُ مَعَ الضَّعْفِ، فَالرَّاجِحُ يُقَالُ لَهُ: الْمَعْرُوفُ، وَمُقَابِلُهُ يُقَالُ لَهُ: الْمُنْكَرُ","Muhalefet zaaf ile birlikteyse râcihe ma'rûf, mukabiline münker denir.","s.67")]},
  {p:"Örnek: İbn Ebî Hâtim'in Habîb b. Habîb ez-Zeyyât → Ebû İshâk → el-Eyzâr b. Hureys → İbn Abbas yoluyla merfû' rivayet ettiği “namazı kılan, zekâtı veren, haccedip oruç tutan, misafiri ağırlayan cennete girer” hadisi. Ebû Hâtim: bu hadis münkerdir; çünkü başka sikalar Ebû İshâk'tan <b>mevkûf</b> rivayet etmiştir, ma'rûf olan odur."},
  {callout:"Şâzın ıstılahtaki muteber tanımı (s.67): <span class='ar'>أَنَّ الشَّاذَّ مَا رَوَاهُ الْمَقْبُولُ مُخَالِفًا لِمَنْ هُوَ أَوْلَى مِنْهُ</span>. <b>Şâz</b> ile <b>münker</b> arasında umûm-husûs min vech vardır (s.68): ikisi de muhalefette birleşir; şâzın râvisi sika veya sadûk, münkerin râvisi zayıftır. Bazılarının ikisini eşit tutması dikkatsizliktir."}],

  ["Râcih rivayet ile mercûh rivayet nasıl adlanır (muhalefet makbûl râviler arasındaysa)?",["Mahfûz ve şâz","Ma'rûf ve münker","Mu'allak ve mürsel"],0,"Mahfûz–şâz (s.66)."],
  ["Muhalefet zayıf râviyle birlikteyse mukabil ne olur?",["Münker","Şâz","Mevzû'"],0,"Râcih ma'rûf, mukabil münker (s.67)."],
  ["Şâz ile münker arasındaki ilişki hangisidir?",["Umûm-husûs min vech","Tam eş anlamlı","Birbirinin tam zıttı"],0,"Her ikisi muhalefette birleşir, râvi durumunda ayrılır (s.68)."]]},

{id:8,bab:2,pg:"s.68–71",icon:"🧲",tr:"Mütâbi', Şâhid ve İ'tibâr",ar:"الْمُتَابِعُ وَالشَّاهِدُ وَالِاعْتِبَارُ",
 goal:"Destekleyen rivayetlerin türlerini ve bunları arama yöntemini eserin örnekleriyle öğreneceksin.",
 secs:[
  {h:"Mütâbi' (s.68–69)",p:"Ferd sanılan hadise, sonradan başka bir râvinin <b>aynı sahâbîden</b> rivayetle uyduğu bulunursa o rivayet mütâbi'dir. Mütâbaa iki derecelidir (<span class='ar'>إِنْ حَصَلَتْ لِلرَّاوِي نَفْسِهِ فَهِيَ التَّامَّةُ، وَإِنْ حَصَلَتْ لِشَيْخِهِ فَمَنْ فَوْقَهُ فَهِيَ الْقَاصِرَةُ</span>): ravinin <b>kendisi</b> için olursa <b>tâmme</b>; şeyhi veya daha üstündeki bir râvi için olursa <b>kâsıra</b>. Faydası hadisi <b>takviye</b> etmektir."},
  {h:"Şâhid (s.70)",quote:[Q("وَإِنْ وُجِدَ مَتْنٌ يُرْوَى مِنْ حَدِيثِ صَحَابِيٍّ آخَرَ يُشْبِهُهُ فِي اللَّفْظِ وَالْمَعْنَى، أَوْ فِي الْمَعْنَى فَقَطْ، فَهُوَ الشَّاهِدُ","Başka bir sahâbînin hadisinden gelen, lafız ve mânâda veya yalnız mânâda ona benzeyen metin bulunursa o şâhiddir.","s.70")]},{p:"Başka bir sahâbîden gelen ve lafız-mânâ veya yalnız mânâ bakımından benzeyen metin <b>şâhid</b>dir. Bazıları mütâbaayı lafızla, şâhidi mânâyla sınırlar; bu terimler birbirinin yerine de kullanılır, asıl amaç takviyedir."},
  {h:"İ'tibâr (s.70–71)",p:"İ'tibâr, ferd sanılan hadisin yollarını <b>câmi', müsned ve cüz</b> türü kitaplarda tarayarak mütâbi' olup olmadığını bulma işlemidir. İbnü's-Salâh i'tibârı mütâbaat ve şevâhidin bir kısmı sanmıştır; eser, i'tibârın bunların bir kısmı değil, onlara ulaşma <b>yöntemi</b> (<span class='ar'>هَيْئَةُ التَّوَصُّلِ إِلَيْهِمَا</span>) olduğunu söyler (s.70)."},
  {h:"Örnek: Şâfiî'nin Mâlik rivayeti (s.69–70)",p:"Şâfiî <i>el-Umm</i>'de Mâlik → Abdullah b. Dînâr → İbn Ömer ile “ayın 29 olması, bulutlanırsa 30'a tamamlanması” hadisini rivayet eder. Bazıları Şâfiî'nin Mâlik'ten bu lafızda tek kaldığını sanmıştır; ancak <b>tâmme mütâbaa</b> vardır: Abdullah b. Mesleme el-Ka'nebî de Mâlik'ten rivayet etmiştir (Buhârî). <b>Kâsıra mütâbaa</b> örnekleri: Sahîh-i İbn Huzeyme ve Sahîh-i Müslim rivayetleri. <b>Şâhid</b> örneği: Nesâî'nin İbn Abbas'tan aynı hadisi, Buhârî'nin Ebû Hüreyre'den “Şa'bân'ı otuza tamamlayın” rivayeti (mânâ ile)."}],
 ex:[],
 mini:[
  ["Mütâbaanın tâmme olması ne demektir?",["Râvinin kendisi için mütâbaa bulunması","Şeyhi için mütâbaa bulunması","Sahâbî için mütâbaa bulunması"],0,"Tâmme: râvinin kendisi için; kâsıra: şeyhi veya daha üstü için (s.69)."],
  ["Şâhid ile mütâbi' arasında temel fark nedir?",["Şâhid başka sahâbîden gelir; mütâbi' aynı sahâbîden","Şâhid zayıf, mütâbi' sahihtir","Fark yoktur"],0,"Aynı sahâbî = mütâbi'; başka sahâbî = şâhid (s.70)."],
  ["İbn Hacer'e göre i'tibâr nedir?",["Destekleyen yolları bulmak için hadis kitaplarını tarama yöntemi","Mütâbaanın bir türü","Zayıf hadisi atma yöntemi"],0,"İ'tibâr bir kısım değil, yöntemdir (s.70–71)."]]},

{id:9,bab:2,pg:"s.71–75",icon:"⚖️",tr:"Hadislerin Çatışması: Muhkem, Muhtelif, Nâsih, Tercîh, Tevakkuf",ar:"الْمُحْكَمُ وَمُخْتَلِفُ الْحَدِيثِ",
 goal:"Makbûl hadislerin birbirine aykırı göründüğünde izlenen adımları eserdeki sırayla öğreneceksin.",
 secs:[
  {h:"Muhkem (s.71)",p:"Makbûl hadis <b>amel edilen</b> ve <b>amel edilmeyen</b> olarak ikiye ayrılır. Ona karşı bir hadis çıkmazsa <b>muhkem</b>dir; örnekleri çoktur. Muârızı olursa: muârız makbûl ve dengi ise sıra aşağıdaki adımlardır; muârız merdûd ise zararı olmaz, kuvvetli olan zayıfın muhalefetinden etkilenmez."},
  {h:"Adımlar (s.71–75)",table:[["Adım","Tanım ve eserdeki not"],
   ["1. Cem' → <b>Muhtelifü'l-hadîs</b>","Zahiren çelişen, denk iki hadisin anlamı <b>zorlama olmadan</b> bağdaştırılabiliyorsa. Eser telifleri: Şâfiî <i>İhtilâfü'l-hadîs</i>, İbn Kuteybe <i>Te'vîlü muhtelifi'l-hadîs</i>, Tahâvî <i>Müşkilü'l-âsâr</i>"],
   ["2. Nesih → <b>Nâsih–Mensûh</b>","Cem' mümkün değilse ve tarih biliniyorsa, sonraki öncekini kaldırır"],
   ["3. <b>Tercîh</b>","Tarih bilinmiyorsa, mümkünse tercîh (metin veya isnad yönünden vecihler)"],
   ["4. <b>Tevakkuf</b>","Tercîh de olmazsa iki hadisten birine amel etmekten durmak. Eser, ‘tevakkuf’ demeyi ‘düşme/çatışıp düşme’ (tesâkut) demekten <b>evlâ</b> bulur"]]},
  {h:"Örnek: muhtelif (s.72)",p:"“<span class='ar'>لَا عَدْوَى وَلَا طِيَرَةَ</span>” (bulaşma yoktur) ile “<span class='ar'>فِرَّ مِنَ الْمَجْذُومِ فِرَارَكَ مِنَ الْأَسَدِ</span>” (cüzzamlıdan aslandan kaçar gibi kaç) ikisi de sahîhtir ve zahiren çelişir. İbnü's-Salâh'ın cem'i: hastalıklar kendiliğinden bulaştırmaz; Allah, hastayla yakınlaşmayı bulaşmaya sebep kılmıştır; ‘kaçma’ emri bulaşma ihtimaline karşı <b>sedd-i zerâî</b> yoludur. İbn Hacer bu cevabı güçlü bulur."},
  {h:"Nesih nasıl bilinir? (s.73–74)",p:"Nesih: <span class='ar'>رَفْعُ تَعَلُّقِ حُكْمٍ شَرْعِيٍّ بِدَلِيلٍ شَرْعِيٍّ مُتَأَخِّرٍ عَنْهُ</span>, yani bir şer'î hükmün bağlanmasının, kendisinden sonra gelen şer'î delille kaldırılmasıdır (s.73). Üç yol: <b>(1)</b> nassın sarâhati — Büreyde hadisinde Peygamber'in “size kabir ziyaretini yasaklamıştım, artık ziyaret edin” demesi; <b>(2)</b> sahâbînin “bu sonradandır” demesi — “ateşte pişen şeyden abdest almamak, iki emrin sonuncusuydu”; <b>(3)</b> tarih bilgisiyle. Sahâbînin geç Müslüman olması veya geç rivayet etmesi nesih delili değildir; icmâ da nâsih değil, nesih'e delâlet eder."},
  {quote:[Q("فَصَارَ مَا ظَاهِرُهُ التَّعَارُضُ وَاقِعًا عَلَى هَذَا التَّرْتِيبِ: الْجَمْعُ إِنْ أَمْكَنَ. فَاعْتِبَارُ النَّاسِخِ وَالْمَنْسُوخِ. فَالتَّرْجِيحُ إِنْ تَعَيَّنَ. ثُمَّ التَّوَقُّفُ عَنِ الْعَمَلِ بِأَحَدِ الْحَدِيثَيْنِ، وَالتَّعْبِيرُ بِالتَّوَقُّفِ أَوْلَى مِنَ التَّعْبِيرِ بِالتَّسَاقُطِ","Zahiren çatışan hadis şu sırada ele alınır: mümkünse cem'; sonra nâsih-mensûh; sonra tercîh; sonra iki hadisten birine amel etmekten tevakkuf. Tevakkuf demek, tesâkut demekten evlâdır.","s.75")]},{callout:"<b>Muhtelifü'l-hadîs</b> ile <b>müşkilü'l-hadîs</b> aynı değildir: müşkil, zahiri kâidelere, akla veya başka bir nassa aykırı görünen hadistir (s.71–72 dipnot)."}],

 mini:[
  ["Çatışan iki makbûl hadiste eserdeki sıra hangisidir?",["Cem' → nesih → tercîh → tevakkuf","Tercîh → cem' → nesih → tevakkuf","Tevakkuf → tercîh → cem' → nesih"],0,"İbn Hacer'in sırası bu şekildedir (s.71–75)."],

  ["Tarihi bilinmeyen çatışmada, cem' de mümkün değilse ilk yapılacak iş?",["Tercîh etmek","Hemen tevakkuf","Nesih ilân etmek"],0,"Tercîh mümkünse yapılır; olmazsa tevakkuf (s.74–75)."],

  {quote:[Q("فَالْأَوَّلُ: الْمُعَلَّقُ، سَوَاءٌ كَانَ السَّاقِطُ وَاحِدًا أَمْ أَكْثَرَ","Birincisi mu'allaktır; düşen bir de olsa daha çok da olsa.","s.76"),Q("وَالثَّانِي: وَهُوَ مَا سَقَطَ مِنْ آخِرِهِ مِنْ بَعْدِ التَّابِعِيِّ، هُوَ الْمُرْسَلُ","İkincisi, senedin sonundan, tâbiîden sonra düşen: mürseldir.","s.78"),Q("إِنْ كَانَ بِاثْنَيْنِ فَصَاعِدًا مَعَ التَّوَالِي، فَهُوَ الْمُعْضَلُ","Art arda iki veya daha fazla kişiyle ise mu'daldır.","s.79")]},{h:"Tanımlar (s.76–79)",table:[["Terim","Eserdeki anlam"],
   ["Mu'allak","Senedin başından, musannifin tasarrufuyla bir veya daha fazla râvi düşmesi"],

  {h:"Mürsel'in hükmü (s.78–79)",p:"Düşenin sahâbî mi tâbiî mi, sika mı zayıf mı olduğu bilinmediği için ihtimaller vardır. Tâbiî yalnız sikadan irsal ediyorsa cumhur-ı muhaddisîn tevakkuf eder. <b>Mâlikî ve Kûfîler (Hanefîler)</b> mutlak kabul eder; <b>Şâfiî</b>, başka yoldan destekleniyorsa (müsned veya başka bir mürsel) kabul eder. Râvi sikadan başkasından irsal ediyorsa mürsel kabul edilmez."},
  {h:"Buhârî'nin ta'lîkleri (s.77, dipnot)",p:"<i>Sahîh-i Buhârî</i>'de <b>cezm sîğasıyla</b> (“kâle fülân”) verilen ta'lîkte düşen kısım sahihtir; <b>temrîz sîğasıyla</b> verilen ta'lîk sahih olmayabilir. Müslim'de de ta'lîk edilmiş 12 hadis vardır ve hepsi sahih yollarla mevsûldür."},
  {callout:"Dikkat: <b>maktû'</b> (tâbiîye ait söz; metin bahsi) ile <b>munkatı'</b> (senedde düşme; isnad bahsi) farklıdır (s.110)."}],

  ["Mürsel hakkında Şâfiî'nin kabul şartı nedir?",["Başka bir yoldan desteklenmesi","Hiçbir şart aramaz","Her hâlde reddeder"],0,"Şâfiî destek bulunursa kabul eder (s.78)."],
  ["Buhârî'de cezm sîğasıyla verilen ta'lîk hakkında ne denir?",["Düşen kısım sahihtir","Hiçbir hâlde sahih sayılmaz","Mevzû'dur"],0,"Cezm sîğası sahihlik delili; temrîz sîğası böyle değildir (s.77 dipnot)."]]},

{id:11,bab:3,pg:"s.79–83",icon:"🎭",tr:"Sened Kopukluğu II: Tedlîs ve Mürsel-i Hafî",ar:"الْمُدَلِّسُ وَالْمُرْسَلُ الْخَفِيُّ",
 goal:"Açık ve gizli kopukluğu ayırıp tedlîs ile mürsel-i hafî arasındaki farkı ve karşılaşma (lika) şartını öğreneceksin.",
 secs:[
  {h:"Açık ve gizli düşme (s.80)",p:"Düşme <b>açıktır</b> ise râvi ile hocası arasında ya muâsırlık yoktur ya da yetişmiş olsalar bile karşılaşma, icâzet veya vicâde yoktur; bunu anlamak için doğum, ölüm ve ilim talebi tarihleri bilinmelidir. <b>Gizli</b> düşmeyi ancak hâfız imamlar fark eder."},
  {h:"Müdelles ve tedlîs",quote:[Q("سُمِّيَ بِذَلِكَ؛ لِكَوْنِ الرَّاوِي لَمْ يُسَمِّ مَنْ حَدَّثَهُ، وَأَوْهَمَ سَمَاعَهُ لِلْحَدِيثِ مِمَّنْ لَمْ يُحَدِّثْهُ بِهِ","Bu adı almasının sebebi, râvinin kendisine hadis anlatanı adlandırmaması ve hadisi anlatmamış olandan işitmiş gibi bir vehim uyandırmasıdır.","s.80")]},{p:"Râvi hocasının kimliğini söylemez veya <b>işitmediğini işitmiş gibi</b> gösterir (s.80). İki türü vardır: <b>Tedlîsü'l-isnâd</b> — muâsırından veya karşılaştığından işitmediğini işitmiş gibi rivayet etmek; <b>tedlîsü'ş-şuyûh</b> — hocasının adını, künyesini veya lakabını değiştirmek (dipnot, s.80)."},
  {h:"Hükmü (s.81)",p:"Müdelles râvi “an”, “kâle” gibi ihtimalli sîğalarla rivayet edince hadis delil sayılmaz; <b>sarîh sîğa</b> (haddesenâ) kullanırsa kabul edilir (en doğru görüş). Dipnotta Ebû Avâne → A'meş → İbrâhîm et-Teymî → Ebû Zerr zincirinde A'meş'in İbrâhîm'den değil Hakîm b. Cübeyr'den aldığı örnek verilir."},
  {h:"Mürsel-i hafî (s.81–82)",p:"Muâsırı olan ama <b>görüşmediği</b> kişiden rivayet eden râvinin hadisidir; arada bir vâsıta vardır. Tedlîs, râvinin görüştüğü kişiden rivayetiyle özelleşir; muâsır olup karşılaşması bilinmeyen için tedlîs değil mürsel-i hafî denir. Eserin ifadesi: <span class='ar'>أَنَّ التَّدْلِيسَ يَخْتَصُّ بِمَنْ رَوَى عَمَّنْ عُرِفَ لِقَاؤُهُ إِيَّاهُ، فَأَمَّا إِنْ عَاصَرَهُ وَلَمْ يُعْرَفْ أَنَّهُ لَقِيَهُ فَهُوَ الْمُرْسَلُ الْخَفِيُّ</span> (s.81)."},
  {h:"Lika şartı (s.82)",p:"İbn Hacer'in tercihi, tedlîs için <b>karşılaşmanın (lika) şart</b> olmasıdır; yalnız muâsırlık yetmez. Delil: <b>muhadramûn</b> (Câhiliyye ve İslâm'ı idrak edip Peygamber'i görmeyenler; Ebû Osmân en-Nehdî, Kays b. Ebî Hâzim gibi) Peygamber'den rivayet edince <b>mürsel</b> sayılırlar; yalnız muâsırlık yeterli olsaydı mudellis sayılırlardı. Lika şartını Şâfiî, el-Bezzâr ve el-Hatîb de aranır; ‘el-mu'temed’ budur."},
  {callout:"Karşılaştırma: <b>tedlîs</b> = karşılaştığı kişiden duymadığını duymuş gibi; <b>mürsel-i hafî</b> = muâsır olup karşılaşması olmayan kişiden rivayet."}],
 ex:[],
 mini:[
  ["Tedlîsü'ş-şuyûh nedir?",["Hocanın adını, künyesini veya lakabını değiştirmek","Hocayı tamamen düşürmek","Metni değiştirmek"],0,"Dipnotta iki tür belirtilir (s.80)."],
  ["Muâsır olup görüşmediği kişiden rivayet eden râvinin hadisi?",["Mürsel-i hafî","Mu'dal","Maklûb"],0,"Mürsel-i hafî (s.81)."],
  ["Muhadramûn Peygamber'den rivayet edince neden mürsel sayılır?",["Yalnız muâsırlık yeterli olsaydı mudellis sayılırlardı; bu yüzden lika şartı delili","Sahâbî oldukları için","Çocuk oldukları için"],0,"İbn Hacer'in lika şartı gerekçesi (s.82)."]]},

{id:12,bab:3,pg:"s.83–88",icon:"🚫",tr:"Râviye Ta'n: On Sebep, Mevzû', Metrûk",ar:"الطَّعْنُ فِي الرَّاوِي",
 goal:"Ta'nın on sebebini ve beş-beş dağılımını, mevzû' ve metrûk hadisi eserin sıralamasıyla öğreneceksin.",
 secs:[
  {h:"On sebep (s.83–85)",quote:[Q("ثُمَّ الطَّعْنُ يَكُونُ بِعَشَرَةِ أَشْيَاءَ بَعْضُهَا أَشَدُّ فِي الْقَدْحِ مِنْ بَعْضٍ، خَمْسَةٌ مِنْهَا تَتَعَلَّقُ بِالْعَدَالَةِ، وَخَمْسَةٌ تَتَعَلَّقُ بِالضَّبْطِ","Ta'n on şeyle olur; bazısı bazısından daha ağır kusurdur; beşi adâletle, beşi zabtla ilgilidir.","s.83")]},{p:"Ta'n <b>on şeyle</b> olur; bazıları diğerlerinden daha ağır kusurdur. <b>Beşi adâlete</b>, <b>beşi zabta</b> aittir. Eserin sayış sırası: <b>1) kizb, 2) tühmet bi'l-kizb, 3) fuhşü'l-galat, 4) gaflet, 5) fısk, 6) vehm, 7) muhalefetü's-sikât, 8) cehâlet, 9) bid'at, 10) sû'ü'l-hıfz</b> (s.83–84, 95–101)."},
  {h:"Beş-beş dağılım (s.83 dipnot)",table:[["Adâlete ta'n","Zabta ta'n"],["Kizb (yalan)","Fuhşü'l-galat (çok yanlış)"],["Tühmet bi'l-kizb","Gaflet"],["Fısk","Vehm"],["Cehâlet","Muhalefetü's-sikât"],["Bid'at","Sû'ü'l-hıfz"]]},
  {h:"Mevzû' (s.85–87)",quote:[Q("فَالْقِسْمُ الْأَوَّلُ وَهُوَ الطَّعْنُ بِكَذِبِ الرَّاوِي فِي الْحَدِيثِ النَّبَوِيِّ ﷺ هُوَ الْمَوْضُوعُ","Birinci kısım, râvinin Peygamber hadisinde yalan söylemesiyle ta'ndır: mevzû'dur.","s.85")]},{p:"Râvinin Peygamber hadisinde <b>kasten yalan söylemesi</b> mevzû'dur. Mevzû'luk <b>galip zanla</b> hükmedilir (kat'î değil): kuvvetli karîneler ve ilim ehlinin melekesiyle, bazen vâzı'in ikrarıyla anlaşılır. Karineler hem râvinin hâlinden hem rivayetin içeriğinden gelir (Kur'ân'a, mütevâtir sünnete, kat'î icmâya veya akla açıkça aykırı olması gibi). Vâzı'lık sebepleri arasında zındıklık, cehâlet, taassup, ileri gelenleri memnun etme ve şöhret sayılır; Kerrâmiyye ve bazı mutasavvıfların terğib-terhîb için uydurmayı mubah saymaları hatalıdır."},
  {p:"Peygamber'e kasten yalan söylemek büyük günahlardandır. Müslim'de şu hadis anılır: “<span class='ar'>مَنْ حَدَّثَ عَنِّي بِحَدِيثٍ يُرَى أَنَّهُ كَذِبٌ فَهُوَ أَحَدُ الْكَاذِبِينَ</span>”."},
  {h:"Metrûk (s.87)",quote:[Q("وَالْقِسْمُ الثَّانِي مِنْ أَقْسَامِ الْمَرْدُودِ: وَهُوَ مَا يَكُونُ بِسَبَبِ تُهْمَةِ الرَّاوِي بِالْكَذِبِ هُوَ الْمَتْرُوكُ","Merdûdun ikinci kısmı, râvinin yalanla itham edilmesi sebebiyle olan: metrûktür.","s.87")]},{p:"Râvisinin <b>yalanla itham edildiği</b> hadistir (tühmet bi'l-kizb): hadis yalnız ondan bilinir, kâidelere aykırıdır veya sohbetinde yalanla tanınmıştır."},
  {callout:"Eserin sırası “şiddet” sırasıdır: önce kizb (mevzû'), sonra tühmet (metrûk); ardından fuhşü'l-galat, gaflet ve fısk (bunlar için münker), sonra vehm (muallel) gelir."}],
 ex:[],
 mini:[
  ["Ta'nın on sebebi hangi gruplara ayrılır?",["5 adâlet, 5 zabt","3 adâlet, 7 zabt","Hepsi zabt"],0,"Beşi adâlete, beşi zabta aittir (s.83)."],
  ["Mevzû' hadise hangi türden bir hükmle karar verilir?",["Galip zan","Kat'î kesinlik","Hiçbir hüküm verilmez"],0,"Karîneler ve ilim ehlinin melekesiyle galip zan (s.85)."],
  ["Metrûk nedir?",["Râvisi yalanla itham edilen hadis","Râvisi isimsiz hadis","Râvisi hâfız olan hadis"],0,"Tühmet bi'l-kizb (s.87)."],
  ["Eserin sıralamasında sekizinci ta'n sebebi hangisidir?",["Cehâlet","Bid'at","Sû'ü'l-hıfz"],0,"8 cehâlet, 9 bid'at, 10 sû'ü'l-hıfz (s.95–101)."]]},

{id:13,bab:3,pg:"s.88–95",icon:"🧠",tr:"Zabta Ta'n ve Muhalefet: Münker, Muallel, Müdrec, Maklûb, Mezîd, Muztarib, Musahhaf",ar:"الْمُخَالَفَةُ وَالْوَهْمُ",
 goal:"Vehm ve muhalefetten doğan terimleri tanımlarıyla, ayrıca rivayet bi'l-ma'nâ, ihtisâr ve garîbü'l-hadîs bahislerini öğreneceksin.",
 secs:[
  {h:"Münker ve muallel (s.88)",p:"Münker iki kullanımda anılır: zayıf râvinin sikaya muhalefeti (önceki ders) ve muhalefet şartı aranmaksızın, fuhşü'l-galat, gaflet veya fısk sahibi râvinin hadisi. <b>Mu'allel</b>: vehm (6. sebep), karînelerle fark edilen hadistir — mürsel veya munkatı'nın mevsûl gösterilmesi, bir hadisin başka hadise karışması gibi. İllet çok tetkik ve yolların toplanmasıyla anlaşılır; bu, hadis ilimlerinin en gizlilerindendir."},
  {quote:[Q("إِنْ كَانَتْ وَاقِعَةً بِسَبَبِ تَغْيِيرِ السِّيَاقِ، أَيْ سِيَاقِ الْإِسْنَادِ، فَالْوَاقِعُ فِيهِ ذَلِكَ التَّغْيِيرُ هُوَ مُدْرَجُ الْإِسْنَادِ","Muhalefet isnadın siyâkındaki değişiklikten doğmuşsa, bu değişikliğin vâki olduğu rivayet müdrecü'l-isnâddır.","s.89"),Q("أَوْ إِنْ كَانَتِ الْمُخَالَفَةُ بِتَقْدِيمٍ أَوْ تَأْخِيرٍ أَيْ فِي الْأَسْمَاءِ كَمُرَّةَ بْنِ كَعْبٍ وَكَعْبِ بْنِ مُرَّةَ ... فَهَذَا هُوَ الْمَقْلُوبُ","Muhalefet, isimlerde takdim-te'hîr iledir; Mürre b. Ka'b ile Ka'b b. Mürre gibi: işte bu maklûbtur.","s.91"),Q("أَوْ كَانَتِ الْمُخَالَفَةُ بِإِبْدَالِهِ أَيِ الرَّاوِي، وَلَا مُرَجِّحَ لِإِحْدَى الرِّوَايَتَيْنِ عَلَى الْأُخْرَى، فَهَذَا هُوَ الْمُضْطَرِبُ","Muhalefet râvinin değiştirilmesiyle olur ve iki rivayetten birini diğerine üstün kılan bir tercih sebebi bulunmazsa: bu muztaribdir.","s.91")]},{h:"Muhalefet (7. sebep) türleri (s.89–93)",table:[["Terim","Eserdeki anlam"],
   ["Müdrecü'l-isnâd","Senedin siyâkı değişir: bir râvi farklı isnadları tek isnada toplar veya metnin bir kısmını farklı isnadla alıp tek isnada indirger, ya da isnad sunarken araya giren sözü metin sanır"],
   ["Müdrecü'l-metin","Metne ondan olmayan söz karışır (genellikle sonda); örnek: kölenin iki ecri hadisinde “annem” sözü Ebû Hüreyre'nindir, çünkü Peygamber'in annesinden söz etmesi imkânsızdır"],
   ["Maklûb","İsim veya lafızlarda takdim-te'hîr: Mürre b. Ka'b ↔ Ka'b b. Mürre; metinde: yedi gölgelenen hadisinde “sağ el verdiğini sol el bilmesin” sözü ters rivayet edilmiştir"],
   ["Mezîd fî muttasıli'l-esânîd","Senedin ortasına bir râvi ziyade edilmiş; ziyadesiz rivayet edenler daha sağlamsa ziyade hata sayılır"],
   ["Muztarib","Eşit güçte farklı rivayetler; tercih ve cem' mümkün değil"],
   ["Musahhaf","Nokta değişikliği (tashîf); <b>muharref</b>: şekil/hareke değişikliği (tahrîf)"]]},
  {callout:"İdrâc şu yollarla anlaşılır: müfassal rivayet, râvinin kendi açıklaması, imamların nassı veya Peygamber'in böyle söylemesinin imkânsızlığı (s.90). Hadisin zayıflığı yalnız idrâc nedeniyleyse asıl sahih olan zarar görmez."},
  {h:"İmtihân ve kasıtlı ibdâl (s.92)",p:"Râvinin hıfzını sınamak için isnad veya metni <b>kasten değiştirmek</b> ihtiyaç bitince bırakılmalıdır. Buhârî'nin Bağdat'ta yüz hadis ile sınanması ve doğrusunu söylemesi örnek verilir. Maslahatsız veya iğrâb için yapılırsa mevzû' kısmına girer; yanlışlıkla olursa maklûb veya mu'allel olur."},
  {h:"İhtisâr, rivayet bi'l-ma'nâ, garîbü'l-hadîs (s.93–95)",p:"<b>Hadisi kısaltmak (ihtisâr)</b> çoğuna göre câizdir; şartı ihtisar edenin âlim olması, kalan kısmın hükmünü ve delâletini bozmamasıdır. <b>Rivayet bi'l-ma'nâ</b> çoğuna göre câizdir; en kuvvetli delil, şeriatı Arapça bilmeyenlere kendi dilleriyle anlatmanın icmâsıdır; yine de lafızla rivayet evlâdır, Kâdî Iyâz kapıyı kapatmayı ister (hadisler kitaplara kaydedildiği için ruhsat ihtiyacı kalmadı). <b>Garîbü'l-hadîs</b> metindeki kapalı lafızlardır (ferd anlamındaki garîb hadisle karıştırılmamalı); eserleri: Ebû Ubeyd el-Kâsım b. Sellâm, Zemahşerî <i>el-Fâik</i>, İbnü'l-Esîr <i>en-Nihâye</i>."}],
 ex:[EX("وَرَجُلٌ تَصَدَّقَ بِصَدَقَةٍ فَأَخْفَاهَا حَتَّى لَا تَعْلَمَ شِمَالُهُ مَا تُنْفِقُ يَمِينُهُ","Sağ elinin verdiğini sol eli bilmeyecek kadar gizli sadaka veren adam.","Maklûb örneği (s.90)","Doğru rivayet budur (Sahîhayn). Müslim'deki Ebû Hüreyre hadisinde ibare ters rivayet edilmiştir; bu, metinde kalbe (maklûb) örnektir.")],
 mini:[
  ["Mürre b. Ka'b yerine Ka'b b. Mürre denmesi hangi terime örnektir?",["Maklûb","Musahhaf","Muztarib"],0,"İsimlerde takdim-te'hîr: maklûb (s.91)."],
  ["Râvinin kendi sözünü metne katması hangi terimdir?",["Müdrecü'l-metin","Maklûb","Muallel"],0,"Müdrecü'l-metin (s.90)."],
  ["Nokta değişikliğinden doğan hataya ne denir?",["Tashîf (musahhaf)","Tahrîf (muharref)","İdtırâb"],0,"Nokta: musahhaf; hareke/şekil: muharref (s.92–93)."],

{id:14,bab:3,pg:"s.95–101",icon:"🪞",tr:"Cehâlet, Bid'at, Sû'ü'l-Hıfz",ar:"الْجَهَالَةُ وَالْبِدْعَةُ وَسُوءُ الْحِفْظِ",
 goal:"Râvinin bilinmemesinin nedenlerini ve türlerini, bid'atçı râvinin hükmünü, şâz-muhtelit ayrımını öğreneceksin.",
 secs:[
  {h:"Cehâlet (8. sebep) (s.95–98)",p:"İki sebepten doğar: <b>(1) Çok sıfatlı râvi</b> — isim, künye, lakap, sıfat, meslek, nisbe ile anılır; bunlardan birinin dışında zikredilince başka kişi sanılır. Örnek: Muhammed b. es-Sâ'ib el-Kelbî (Hammâd b. es-Sâ'ib, Ebû en-Nadr, Ebû Saîd, Ebû Hişâm diye anılır). <b>(2) Vuhdân</b> — az hadis rivayet eden, kendisinden yalnız bir kişi rivayet etmiş râvi (Müslim <i>el-Vuhdân</i> yazmıştır)."},
  {quote:[Q("فَإِنْ سُمِّيَ الرَّاوِي، وَانْفَرَدَ رَاوٍ وَاحِدٌ بِالرِّوَايَةِ عَنْهُ، فَهُوَ مَجْهُولُ الْعَيْنِ كَالْمُبْهَمِ","Râvi adlandırılmış, fakat ondan yalnız bir râvi rivayet etmişse meçhûlü'l-aynıdır; mübhem gibi.","s.98"),Q("أَوْ إِنْ رَوَى عَنْهُ اثْنَانِ فَصَاعِدًا وَلَمْ يُوَثَّقْ، فَهُوَ مَجْهُولُ الْحَالِ، وَهُوَ الْمَسْتُورُ","Ondan iki veya daha fazla kişi rivayet etmiş ve tevsîk edilmemişse meçhûlü'l-hâldir; yani mestûrdur.","s.98")]},{h:"Üç cehâlet türü",table:[["Terim","Tanım","Hüküm"],
   ["Mübhem","Râvinin adı zikredilmez (“bir adam”, “şeyh”, “filan”)","Adı bilinmedikçe hadisi kabul edilmez; ‘bana güvenilir biri anlattı’ demesi de yetmez. Örnek: ‘Hac her yıl mı?’ diyen kişi el-Akra' b. Hâbis'tir"],
   ["Meçhûlü'l-ayn","İsmi bilinir, yalnız bir râvi ondan rivayet etmiştir","Tek râvi dışında biri onu tevsîk ederse sorun kalkar"],
   ["Meçhûlü'l-hâl (mestûr)","İki veya daha fazla râvi ondan rivayet etmiş, fakat tevsîk edilmemiş","Cumhur reddeder; bir cemaat kabul eder; tahkîk: hâli açığa çıkana kadar tevakkuf"]]},
  {h:"Bid'at (9. sebep) (s.99–100)",p:"Bid'at, Peygamber'den bilinene aykırı bir inancı inatla değil, bir tür şüpheyle benimsemektir. <b>Mükeffir bid'at</b> (küfrü gerektiren inanç): cumhur reddeder; muteber olan, dinden zorunlu olarak bilinen mütevâtir bir şeyi inkâr edenin rivayetinin reddedilmesidir. <b>Müfessik bid'at</b>: bir görüşe göre mutlak red, bir diğerine göre mutlak kabul, bir diğerine göre bid'atine <b>davet etmeyenin</b> rivayeti kabul edilir; davetçinin bid'atini destekleyen rivayeti reddedilir."},
  {h:"Sû'ü'l-hıfz (10. sebep) (s.100–101)",p:"Sû'ü'l-hıfz, doğru yapma ihtimali hata ihtimalinden fazla olmayan râvidir; iki kısımdır: <b>(1) Lâzım</b> — her hâlinde kötü hıfzlı; bazı muhaddislere göre buna <b>şâz</b> denir. <b>(2) Târi'</b> — sonradan gelen: yaşlılık, körlük, kitaplarının yanması veya kaybolması sebebiyle hıfzı bozulan; bu <b>muhtelit</b>tir. Hükmü: ihtilâttan <b>önce</b> rivayet ettiği hadis ayırt edilebiliyorsa kabul edilir, edilemiyorsa tevakkuf. Örnek: Abdürrezzâk es-San'ânî (âmâ olduktan sonra)."}],
 ex:[],
 mini:[
  ["Sadece bir râvinin kendisinden rivayet ettiği, ismi bilinen râvi için hangi terim kullanılır?",["Meçhûlü'l-ayn","Meçhûlü'l-hâl","Mübhem"],0,"Tek râvi rivayet etmişse meçhûlü'l-ayn (s.98)."],
  ["Mestûr nedir?",["İki veya daha fazla râvinin rivayet ettiği ama tevsîk edilmeyen râvi","İsmi bilinmeyen râvi","Yalancı râvi"],0,"Meçhûlü'l-hâl; tahkîk: hâli belli olana kadar tevakkuf (s.98)."],
  ["Muhtelit kimdir?",["Hıfzı sonradan bozulan râvi","Hep kötü hıfzlı olan","İsimsiz râvi"],0,"Târi' sû'ü'l-hıfz (s.101)."],
  ["Bid'atçı râvinin bid'atine davet etmemesi halinde bir görüşe göre hadisi?",["Kabul edilir","Her halükârda reddedilir","Mevzû' sayılır"],0,"Davet etmeyenin rivayeti bir görüşe göre kabul edilir (s.99–100)."]]},

{id:15,bab:4,pg:"s.102–111",icon:"🧭",tr:"Merfû', Mevkûf, Maktû'; Sahâbî ve Tâbiî; Müsned",ar:"الْمَرْفُوعُ وَالْمَوْقُوفُ وَالْمَقْطُوعُ",
 goal:"Isnad ve metni, sarih ve hükmen merfû'yu, sahâbî ve tâbiî tanımlarını ve müsnedi eserin kayıtlarıyla öğreneceksin.",
 secs:[
  {h:"İsnad ve metin (s.102)",p:"<b>İsnad</b> metne ulaştıran yoldur; <b>metin</b> isnadın sonunda ulaştığı sözdür. Metin açısından kabul-ret bahsi burada tamamlanır; sonrası isnadın Peygamber'e, sahâbîye veya tâbiîye ulaşmasına göre kısımlardır."},
  {quote:[Q("ثُمَّ الْإِسْنَادُ: وَهُوَ الطَّرِيقُ الْمُوَصِّلَةُ إِلَى الْمَتْنِ ... وَالْمَتْنُ: هُوَ غَايَةُ مَا يَنْتَهِي إِلَيْهِ الْإِسْنَادُ مِنَ الْكَلَامِ","İsnad, metne ulaştıran yoldur; metin, isnadın sonunda ulaştığı sözdür.","s.102")]},{h:"Üç nispet (s.102, 109–110)",table:[["Tür","Nereye ulaşır?","Not"],
   ["Merfû'","Peygamber'e","İsnad muttasıl olsun olmasın (s.110)"],
   ["Mevkûf","Sahâbîye","‘mevkûf alâ fülân’ da denir; ‘eser’ de denir"],
   ["Maktû'","Tâbiîye (ve daha aşağıya)","Metin bahsidir; <b>munkatı'</b> (isnad bahsi) ile karıştırılmaz"]]},
  {h:"Sarîh ve hükmen merfû' (s.102–107)",p:"<b>Sarîh kavlî</b>: sahâbî “Rasûlullah'tan işittim”, “Rasûlullah buyurdu” der. <b>Sarîh fiilî</b>: “Rasûlullah'ı şöyle yaparken gördüm”. <b>Sarîh takrîrî</b>: “Peygamber'in huzurunda şöyle yapıldı” ve inkârı zikredilmez. <b>Hükmen merfû' kavlî</b>: sahâbînin (İsrâiliyyâttan almadığı) ictihada yer olmayan sözü — yaratılışın başlangıcı, geçmiş nebîlerin haberleri, fiten, kıyamet hâlleri, belli fiile belli sevap-ceza haberi. <b>Hükmen merfû' takrîrî</b>: “Vahyin indiği dönemde şöyle yapardık” (Câbir ve Ebû Saîd'in azl hadisi: “Kur'ân iniyorken azlediyorduk”)."},
  {p:"<b>Sîğa ilhakları</b>: sahâbînin “sünnetten şudur”, “emrolunduk”, “yasaklandık” demesi; tâbiînin “raf' eder”, “yebluğu bihî”, “yenmîhi”, “rivâyeten” gibi kinâye sîğaları; “Kim şüpheli günü oruçla geçirirse Ebü'l-Kâsım'a (s.a.v.) isyan etmiştir” (Ammâr)."},
  {h:"Sahâbî tanımı ve kayıtları (s.107–108)",quote:[Q("وَهُوَ مَنْ لَقِيَ النَّبِيَّ ﷺ مُؤْمِنًا بِهِ، وَمَاتَ عَلَى الْإِسْلَامِ، وَلَوْ تَخَلَّلَتْ رِدَّةٌ فِي الْأَصَحِّ","Sahâbî, Peygamber'i mümin olarak görüp İslâm üzere ölen kişidir; aradan irtidât geçse bile en sahih görüşe göre.","s.107")]},
  {p:"<b>Lika</b> (karşılaşma) ‘görmek’ten evlâdır: görme engelli İbn Ümmü Mektûm da sahâbîdir. ‘<b>Mümin olarak</b>’ kaydı kâfirken görüp sonra görmeyenleri, ‘<b>ona</b>’ kaydı diğer nebîlere inananı; ‘<b>İslâm üzere ölen</b>’ kaydı mürtedleri (Ubeydullâh b. Cahş, İbn Hatal) dışarıda bırakır. Eş'as b. Kays örneği: mürted oldu, esir geldi, İslâm'a döndü; sahâbîliği kabul edilir. Sahâbîlik; tevâtür, istifâza, başka sahâbînin veya sika tâbiînin haber vermesi, kişinin kendi iddiası ile bilinir (s.109)."},
  {h:"Tâbiî ve muhadram (s.109)",p:"<b>Tâbiî</b>: sahâbîyi mümin olarak gören kişidir (uzun sohbet şart değildir). <b>Muhadramûn</b>: Câhiliyye ve İslâm'ı idrak edip Peygamber'i görmeyenler; doğru görüş tâbiînin büyüklerinden sayılmalarıdır."},
  {h:"Müsned (s.111)",quote:[Q("هُوَ مَرْفُوعُ صَحَابِيٍّ بِسَنَدٍ ظَاهِرُهُ الِاتِّصَالُ","Müsned, sahâbînin merfû'u, görünüşte muttasıl senedle olandır.","s.111")]},
  {p:"‘Sahâbî’ kaydı tâbiî merfû'unu (mürsel, mu'dal, mu'allak) dışarıda bırakır; ‘zâhiruhu'l-ittisâl’ kaydı gizli inkıtâ' (tedlîs, muâsır irsâli) taşıyan hadisi dışlamaz. Hâkim ve Hatîb'in tanımları biraz farklıdır; İbn Abdilber'in geniş tanımı benimsenmemiştir."}],
 ex:[EX("كُنَّا نَعْزِلُ وَالْقُرْآنُ يَنْزِلُ","Kur'ân iniyorken azlediyorduk.","Hükmen merfû' takrîrî (s.104)","Câbir ve Ebû Saîd'in sözüdür: vahyin indiği dönemde yapılan ve yasak olsaydı vahyin yasaklayacağı bir şeydir; bu yüzden merfû' hükmündedir."),
     EX("مَنْ صَامَ الْيَوْمَ الَّذِي يُشَكُّ فِيهِ فَقَدْ عَصَى أَبَا الْقَاسِمِ ﷺ","Şüpheli günde oruç tutan, Ebü'l-Kâsım'a (s.a.v.) isyan etmiştir.","Ammâr sözü, hükmen merfû' (s.107)","Sahâbînin bir fiile ‘Peygamber'e isyan’ demesi merfû' hükmündedir; çünkü zâhiren Peygamber'den almıştır.")],
 mini:[
  ["Müsnedin tanımı hangisidir?",["Sahâbînin merfû'u, görünüşte muttasıl senedle","Tâbiînin sözü","Mürsel hadis"],0,"<span class='ar'>مَرْفُوعُ صَحَابِيٍّ بِسَنَدٍ ظَاهِرُهُ الِاتِّصَالُ</span> (s.111)."],
  ["Sahâbî tanımında ‘ve lev tehallelet ridde’ ne demektir?",["Aradan irtidât geçse bile, İslâm'a dönüp ölen sahâbîdir","İrtidât sahâbîliği kesinlikle bitirir","Yalnız çocuklar için geçerlidir"],0,"En sahih görüşe göre ridde sahâbîliği düşürmez (s.107–108)."],
  ["Maktû' ile munkatı' arasındaki fark nedir?",["Maktû' metin bahsidir (tâbiîye ait söz); munkatı' isnad bahsidir (düşme)","İkisi aynıdır","Maktû' mu'dal demektir"],0,"Eser ikisini ayırır (s.110)."],
  ["‘Kunnâ nef'alu ke-zâ fî zamâni'n-Nebî’ sözü hangi hükümdedir?",["Hükmen merfû' (takrîrî)","Mevkûf","Maktû'"],0,"Vahyin indiği dönemde yapılan şeyin yasak olsaydı bildirileceği düşüncesi (s.104)."]]},

{id:16,bab:4,pg:"s.111–120",icon:"🪜",tr:"Ulüvv–Nüzûl, Akrân, Sâbık–Lâhık, Müselsel, İnkâr-ı Râvî",ar:"الْعُلُوُّ وَالنُّزُولُ",
 goal:"İsnadın çeşitli ilişkilerini (ulüvv, nüzûl, akrân, müdebbec, sâbık-lâhık, müselsel) eserdeki tanımlarla öğreneceksin.",
 secs:[
  {h:"Ulüvv ve nüzûl (s.112–114)",p:"<b>Ulüvv</b>, isnadda râvi sayısının azlığıdır. Ya Peygamber'e ya da hâfızlık, fıkıh, zabt veya tasnîf sahibi bir imama (Şu'be, Mâlik, Sevrî, Şâfiî, Buhârî, Müslim) kadar azdır. Sahih olması şartıyla <b>mutlak ulüvv</b> en yüksek hedeftir; mevzû' ise ulüvv sayılmaz. Gerekçe: her râviye hata ihtimali vardır, vâsıta çoğaldıkça ihtimal artar. <b>Nüzûl</b> ulüvvün zıddıdır. Râvi daha sika, hâfız veya fakîh ise nüzûl evlâ olabilir."},
  {h:"Nisbî ulüvvün dört türü (s.113–114)",table:[["Tür","Anlamı"],["Muvâfaka","Musannifin şeyhine, kendi yolundan değil başka yoldan ulaşmak"],["Bedel","Musannifin şeyhinin şeyhine aynı biçimde ulaşmak"],["Musâvât","Isnadın râvi sayısının musannifin isnadıyla eşit olması (örnek: Nesâî 11 vasıtayla)"],["Musâfaha","Musannifin talebesiyle eşitlik; ‘sanki Nesâî ile karşılaşıp musâfaha etmişiz gibi’"]]},
  {h:"Akrân ve müdebbec (s.114–116)",quote:[Q("فَإِنْ تَشَارَكَ الرَّاوِي وَمَنْ رَوَى عَنْهُ فِي أَمْرٍ مِنَ الْأُمُورِ الْمُتَعَلِّقَةِ بِالرِّوَايَةِ، مِثْلِ السِّنِّ وَاللُّقِيِّ وَالْأَخْذِ عَنِ الْمَشَايِخِ، فَهُوَ النَّوْعُ الَّذِي يُقَالُ لَهُ: رِوَايَةُ الْأَقْرَانِ","Râvi ile kendisinden rivayet edilen, yaş, karşılaşma veya şeyhlerden alma gibi bir konuda ortaksa buna akrân rivayeti denir.","s.114")]},
  {p:"Karşılıklı rivayet edenlere <b>müdebbec</b> denir; her müdebbec akrândır, her akrân müdebbec değildir. <b>Ekâbirin esâgirden</b> rivayeti (örnek: Buhârî'nin Tirmizî'den rivayeti) kalb vehmini engeller. <b>Âbâ'nın ebnâ'dan</b> rivayeti de özel biçimidir."},
  {h:"Sâbık ve lâhık (s.116–117)",p:"Bir şeyhten iki kişi rivayet eder; birinin vefatı diğerinden çok daha önce olur (aralarında yüz elli yıl bile olabilir)."},
  {h:"Müselsel (s.119–120)",p:"Isnad râvilerinin rivayet <b>sîğalarında</b> (kavlî), <b>fiillerinde</b> (fiilî) veya her ikisinde aynı biçimi tekrarlamasıdır. Örnekler: “Semi'tü fülânen”, “ahberanâ”, “âmentü bi'l-kader” hadisi; en meşhuru “<b>el-evveliyye</b>” hadisidir (er-râhimûne yerhamühümü'r-rahmân), teselsül İbn Uyeyne'ye kadar sahihtir."},
  {h:"İnkâr-ı râvî (s.118–119)",p:"Şeyh, kendisine nispet edilen hadisi <b>kesin olarak inkâr</b> ederse (‘ben bunu rivayet etmedim’), hadis reddedilir; ancak talebe cerhedilmez. <b>İhtimalî inkâr</b> (‘hatırlamıyorum’) olursa hadis en sahih görüşe göre kabul edilir. Dârakutnî <i>Men haddese ve nesiye</i> adlı eseri yazmıştır. Örnek: Süheyl'in, Rebî'a'nın kendisinden rivayetini unutması (şâhid ve yemîn hadisi)."}],
 ex:[],
 mini:[
  ["Ulüvv nedir?",["Isnadda râvi sayısının az olması","Râvinin yaşça büyük olması","Metnin uzun olması"],0,"Ulüvv: râvi sayısının azlığı (s.112)."],
  ["Musâfaha hangi nisbî ulüvv türüdür?",["Musannifin talebesiyle eşitlik","Musannifin şeyhiyle eşitlik","Musannifle ilgisiz"],0,"Musâfaha: musannifin talebesiyle eşit sayıda vâsıta (s.114)."],
  ["Akrân rivayeti nedir?",["Yaş, karşılaşma veya şeyhlerden alma bakımından ortak olanların karşılıklı rivayeti","Çocukların babalarından rivayeti","Şeyhin talebesinden rivayeti"],0,"Eserdeki tanım (s.114)."],
  ["Şeyh kesin olarak ‘ben bunu rivayet etmedim’ derse?",["Hadis reddedilir ama talebe cerhedilmez","Hadis kabul edilir","Hadis mevzû' olur"],0,"Kesin inkârda hadis reddedilir (s.118)."]]},

{id:17,bab:4,pg:"s.120–126; 143–144",icon:"🎙️",tr:"Tahammül ve Edâ: Sekiz Yol, Sekiz Sîğa, An'ane",ar:"التَّحَمُّلُ وَالْأَدَاءُ",
 goal:"Tahammül yollarını ve edâ sîğalarının derecelerini karıştırmadan öğrenecek, an'ane ihtilafını göreceksin.",

  {h:"Tahammül yolları (8) (dipnot, s.121)",table:[["#","Yol"],["1","Semâ' (şeyhten dinlemek)"],["2","Arz (kırâat; talebe okur, şeyh dinler)"],["3","İcâzet"],["4","Münâvele"],["5","Mükâtebe"],["6","İ'lâm"],["7","Vasiyyet"],["8","Vicâde"]]},
  {h:"Edâ sîğalarının sekiz mertebesi (s.120–121)",p:"Eserde sîğalar şu sırayla anılır: <b>1)</b> “<span class='ar'>سَمِعْتُ</span>”, “<span class='ar'>حَدَّثَنِي</span>”; <b>2)</b> “<span class='ar'>أَخْبَرَنِي</span>”, “<span class='ar'>قَرَأْتُ عَلَيْهِ</span>”; <b>3)</b> “<span class='ar'>قُرِئَ عَلَيْهِ وَأَنَا أَسْمَعُ</span>”; <b>4)</b> “<span class='ar'>أَنْبَأَنِي</span>”; <b>5)</b> “<span class='ar'>نَاوَلَنِي</span>”; <b>6)</b> “<span class='ar'>شَافَهَنِي</span>” (icâzet ile); <b>7)</b> “<span class='ar'>كَتَبَ إِلَيَّ</span>” (icâzet ile); <b>8)</b> “<span class='ar'>عَنْ</span>” ve benzeri."},
  {callout:"İki ayrı liste: <b>8 tahammül yolu</b> ve <b>8 edâ sîğası</b>. İkisini karıştırma."},
  {h:"Bazı notlar (s.120–126)",p:"<b>Haddesenâ</b> çoğul olup başkasıyla birlikte dinlemeyi bildirir. <b>Arz</b> cumhurda tahammül yollarındandır; Irak ehli reddetmiş, Mâlik ve Medîneliler şiddetle inkâr etmiş, bazıları semâ'dan üstün tutmuştur (Buhârî: semâ' ve kırâat kuvvette eşittir). <b>İcâzet</b> semâ'dan aşağıdadır ama mu'dal'dan iyidir. <b>Münâvele</b> izinle birlikte olunca icâzet türlerinin en yükseğidir. <b>Vicâde</b>de “ahberanî” denemez, “vecedtü bi-hattı fülân” denir. <b>Vasiyyet</b>: eski imamların bir kısmı câiz görmüş, cumhur reddetmiş; <b>i'lâm</b>: bir çok muhaddis izinsiz de câiz görmüş."},
  {h:"An'ane ihtilafı (s.122–123)",p:"Muâsırın “an” ile rivayeti, mürsel veya munkatı' olmaması için semâ'a hamledilir; şartı müdellis olmamasıdır. Metin (s.122): <span class='ar'>فَشَرْطُ حَمْلِهَا عَلَى السَّمَاعِ ثُبُوتُ الْمُعَاصَرَةِ، إِلَّا مِنَ الْمُدَلِّسِ</span>. Dipnotta bu, <b>muâsarenin sabit olması / karşılaşma imkânı</b> olarak açıklanır ve <b>Müslim</b>'in şartı olarak anılır. Ardından (s.123): <span class='ar'>وَقِيلَ: يُشْتَرَطُ ... ثُبُوتُ لِقَائِهِمَا ... وَلَوْ مَرَّةً وَاحِدَةً ... وَهُوَ الْمُخْتَارُ، تَبَعًا لِعَلِيِّ بْنِ الْمَدِينِيِّ وَالْبُخَارِيِّ</span> — yani <b>bir kez de olsa karşılaşmanın (lukâ) sübûtu</b> İbnü'l-Medînî ve Buhârî'ye tâbi olarak <b>el-muhtâr</b> görüştür."},
  {h:"Tahammül yaşı (s.143–144)",p:"En sahih görüşe göre tahammülde <b>temyiz çağı</b> esas alınır. Kâfir tahammül edebilir, İslâm'dan sonra eda eder; fâsık da tahammül eder, tevbe ve adâleti sabit olunca eda kabul edilir."}],

{id:18,bab:4,pg:"s.125–143",icon:"🏷️",tr:"İsim Bilgisi: Müttefik–Müfterik, Müelef–Muhtelif, Müteşâbih, Mühmel, Esmâ–Künâ–Ensâb",ar:"الْمُتَّفِقُ وَالْمُفْتَرِقُ",
 goal:"Râvi isimlerinin karışmasını önleyen türleri tanımlarıyla ve örnekleriyle öğreneceksin.",
 secs:[
  {h:"Dört temel tür",table:[["Terim","Tanım","Örnek"],
   ["Müttefik–müfterik (s.126)","İsimler, baba isimleri (veya daha fazlası) aynı; şahıslar farklı","Muhammed b. Ubeyd (16 râvi, dipnot)"],
   ["Müelef–muhtelif (s.127)","Yazıda aynı, okunuşta farklı (nokta veya hareke yüzünden)","Hirâm–Harâm; Yezîd–Büreyd–Yüzeyd"],

   ["Mühmel (s.117–118)","Aynı isimli iki râvi arasında ayrım yapılamıyor","Buhârî'de ‘Ahmed (gayr-i mensûb)’ → Ahmed b. Sâlih veya Ahmed b. Îsâ (ikisi de sika → zarar vermez)"]]},
  {p:"<b>Mühmel</b> iki kişiyi tek sanmak, <b>müttefik–müfterik</b> ise bir kişiyi iki sanma veya iki kişiyi bir sanma korkusudur; ikisi birbirinin aksi gibidir (s.127). <b>Müteşâbih maklûb</b>: isim/baba ismi aynı harflerle ama sırası ters: el-Esved b. Yezîd ↔ Yezîd b. el-Esved; Eyyûb b. Seyyâr ↔ Eyyûb b. Yesâr (s.130)."},
  {h:"Müelef–muhtelif telifleri (s.127–128)",p:"Ali b. el-Medînî: tashîfin en şiddetlisi isimlerdedir; kıyas girmez. Eser yazanlar: Ebû Ahmed el-Askerî, Abdülganî b. Saîd, Dârakutnî, Hatîb, İbn Mâkûlâ (<i>el-İkmâl</i>), İbn Nukta, ez-Zehebî (<i>el-Muştebih</i>). İbn Hacer'in kendi eseri: <i>Tebsîrü'l-Muntebih bi-tahrîri'l-Muştebih</i>."},
  {h:"Esmâ, künâ, elkâb, ensâb, mevâlî (s.137–143)",p:"<b>Künye</b> bilgisi, kişinin künyesiyle meşhur olup ismi anılmadığında karışmayı önler (İbn Cüreyc'in Ebü'l-Velîd ve Ebû Hâlid künyeleri). <b>Nisbe</b>: babaya değil başkasına nispet (Mikdâd b. el-Esved'in asıl babası Amr; İsmâîl b. İbrâhîm b. Mıksem = İbn Uleyye, annesine nisbet). <b>Lakap</b>: övgü veya yergi bildirir (el-A'meş, el-A'rac). <b>Mevâlî</b>: itâk, hilf veya İslâm velâsı; ayırt etmek ancak nassla olur. <b>Ensâb</b>: kabîle, vatan, sanat (el-Hayyât). <b>Ricâl kitapları</b>: el-Kemâl (Abdülganî el-Makdisî), Mizzî'nin <i>Tehzîbü'l-Kemâl</i>, İbn Hacer'in <i>et-Tehzîb</i> (kısaltma)."}],

{id:19,bab:4,pg:"s.130–146",icon:"👥",tr:"Hâtime: Tabakât, Cerh–Ta'dîl Mertebeleri ve Hükümleri, Âdâb",ar:"الْجَرْحُ وَالتَّعْدِيلُ",
 goal:"Tabakâtü'r-ruvât ile cerh-ta'dîl mertebelerinin farklı konular olduğunu, tezkiye hükümlerini ve kitabın son bahislerini öğreneceksin.",
 secs:[
  {h:"Tabakâtü'r-ruvât (s.130–132)",p:"<b>Tabaka</b>, yaş ve şeyhlerle karşılaşmada ortak olan topluluktur. Faydaları: müteşâbihlerin karışmasından emin olmak, müdellisleri ayırmak, an'anenin gerçek muradına vâkıf olmak. Bir kişi iki tabakada sayılabilir (Enes b. Mâlik: sahâbîlik bakımından bir, küçük yaşı bakımından başka tabaka). Tabakât yazarı: Muhammed b. Sa'd (<i>et-Tabakâtü'l-kübrâ</i>). Ayrıca <b>tarih</b> (doğum-ölüm) yalancı karşılaşma iddialarından emin olmayı, <b>evtân</b> (memleket) aynı isimli kişileri ayırmayı sağlar."},
  {h:"Sikât ve du'afâ kitapları (s.132, 139)",p:"Sikât ve du'afâyı birlikte yazanlar: Buhârî <i>et-Târîhu'l-kebîr</i>, İbn Ebî Hâtim <i>el-Cerh ve't-ta'dîl</i>; yalnız sikâtı yazanlar: İclî, İbn Hibbân; yalnız du'afâyı yazan: İbn Adî <i>el-Kâmil</i>."},
  {h:"Cerh mertebeleri (s.133)",p:"En kötü cerh, mübalağa ifade eden ve en açığı <b>ef'al kalıbı</b> olan ifadedir (“ekzebü'n-nâs”, “ileyhi'l-müntehâ fi'l-vad'”); sonra “dedcâl, vazzâ', kezzâb”. Orta: “metrûk, sâkıt, fâhişü'l-galat, münkerü'l-hadîs”; daha hafif: “zayıf, leyse bi'l-kavî, fîhi makāl”. En hafifi: “leyyin, seyyiü'l-hıfz”. Itr'in dipnotundaki altı mertebe: 1) fîhi makāl, zayıf; 2) lâ yuhtecc bihî; 3) reddü hadîsihî, vâhin bi-merre; 4) yesrikü'l-hadîs, müttehem, sâkıt; 5) dedcâl, kezzâb, vazzâ'; 6) ekzebü'n-nâs. İlk iki mertebe i'tibâr içindir; diğerleri delil de, i'tibâr da olmaz."},
  {h:"Ta'dîl mertebeleri (s.134)",p:"En yüksek, ef'al kalıbıyla mübalağa ifadesidir: “evsekü'n-nâs”, “esbetü'n-nâs”, “ileyhi'l-müntehâ fi's-sebât”; sonra tekrar veya iki sıfat: “sika sika”, “sika sebt”, “sika hâfız”. En aşağısı cerhe yakın “şeyh, yürvâ hadîsühû ve yu'teberu bih”. Itr'in altı mertebesinde ilk dördü delil olur; beşinci (lâ be'se bih, sadûk) ve altıncı (şeyh) i'tibâr için yazılır."},
  {h:"Cerh–ta'dîlin hükümleri (s.134–137)",p:"<b>Tezkiye</b> (ta'dîl), sebeplerini bilen âriften kabul edilir; <b>tek kişinin</b> ta'dîli yeter (şehâdet gibi iki isteyenlere muhalefetle). Tezkiye hâkim hükmüne benzer, bu yüzden sayı şart değildir. Cerh ve ta'dîl ancak uyanık, âdil kişiden kabul edilir. <b>Cerh ta'dîle takdim edilir</b> (cumhur): cerh, sebebi açıklanmışsa (<b>mufesser</b>) ve ârifden gelmişse kabul edilir. Ta'dîli olmayan kişiye ait <b>mücmel</b> (sebebi belirtilmemiş) cerh, bir görüşe göre kabul edilir; çünkü ta'dîli yoksa meçhûl hükmündedir. İbnü's-Salâh mücmel cerhte tevakkufa meyleder. Nesâî mezhebi: herkes terk etmeye ittifak etmedikçe râvi terk edilmez."},
  {h:"Âdâb, kitâbet, rıhle, tasnîf (s.143–146)",p:"<b>Şeyh</b>: niyet, ihlâs, güzel ahlâk; hadisi ayakta veya acele ile okutmaz. <b>Talebe</b>: şeyhe saygı, hayâ ve kibirle ilimden geri kalmama. <b>Kitâbet</b>: müşkili şekil ve noktalamak; arz ve semâ'. <b>Rıhle</b>: ilim için yolculuk. <b>Tasnîf</b> yolları: müsned, ebvâb, mu'cem, etrâf, müstahrec, mustedrek, ilel; <b>esbâbü'l-hadîs</b> (hadislerin vürûd sebepleri) Ebû Hafs el-Ukberî ve Ebû Ya'lâ b. el-Ferrâ gibi âlimlerce yazılmıştır."}],

  ["Cerhin en kötü mertebesi hangi kalıpla belirtilir?",["Ef'al kalıbı (ekzebü'n-nâs)","‘Leyyin’","‘Fîhi makāl’"],0,"Mübalağa ifadesi, en açığı ef'al kalıbı (s.133)."],

const KEY="nuzhe-atolye-v1";
let S={xp:0,streak:0,last:"",done:{},cards:{},best:{},badges:{},theme:"",exam:0};
try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(x)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10);
function touchStreak(){const t=today();if(S.last===t)return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=(S.last===y)?S.streak+1:1;S.last=t;save()}
const level=()=>Math.floor(S.xp/100)+1;
const doneCount=()=>Object.keys(S.done).length;
const N=LESSONS.length;
const BADGES=[
 ["🌱","İlk Adım","İlk dersi bitir",()=>doneCount()>=1],
 ["📚","Yarı Yol","6 ders bitir",()=>doneCount()>=6],
 ["🎓","Hatim",`${N} dersin tamamı`,()=>doneCount()>=N],
 ["🔥","3 Gün Seri","3 gün üst üste çalış",()=>S.streak>=3],
 ["🌟","7 Gün Seri","7 gün üst üste çalış",()=>S.streak>=7],
 ["💯","Yüz Puan","500 puana ulaş",()=>S.xp>=500],
 ["🕵️","Muhaddis Dedektif","Dedektifte 8+ yap",()=>(S.best.det||0)>=8],
 ["⚡","Hız Ustası","Kabul-Red hızında 12+ yap",()=>(S.best.kr||0)>=12],
 ["🌳","Ağaç Bilgini","Hadis Ağacında 14+ yap",()=>(S.best.tree||0)>=14],
 ["🏆","Sınav Şampiyonu","Sınavda 90+ al",()=>(S.exam||0)>=90]
];
function checkBadges(){BADGES.forEach(([i,n,d,f])=>{if(!S.badges[n]&&f()){S.badges[n]=1;toast(`${i} Yeni rozet: ${n}!`);confetti()}});save()}
function addXp(n){S.xp+=n;touchStreak();checkBadges();save();head()}
function head(){$("#pXp").textContent="⭐ "+S.xp+" · Sv."+level();$("#pStreak").textContent="🔥 "+S.streak;$("#xpFill").style.width=(S.xp%100)+"%"}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2400)}
function confetti(){const c=document.createElement("div");c.className="confetti";const cols=["#1E5B4F","#B98A1B","#B3402F","#2D5FA8","#6A4FB0"];
  for(let i=0;i<36;i++){const e=document.createElement("i");e.style.left=Math.random()*100+"%";e.style.background=cols[i%5];e.style.animationDelay=Math.random()*.5+"s";c.appendChild(e)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),2400)}
const canSpeak="speechSynthesis" in window;
function speak(t){if(!canSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
const spBtn=t=>canSpeak?`<button class="sp" data-act="speak" data-t="${esc(t)}" aria-label="Dinle">🔊</button>`:"";
