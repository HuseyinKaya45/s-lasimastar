:root {
  --baslik: "Cormorant Garamond", Georgia, serif;
  --govde: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --arap: "Scheherazade New", "Amiri", "Traditional Arabic", serif;
  --bg: #f6f1e6; --yuzey: #fffdf7; --yumusak: #efe7d6; --cizgi: #e2d8c3;
  --murekkep: #2a2823; --soluk: #6d675b; --vurgu: #1e6b58; --vurgu-acik: #d7ebe4; --altin: #a8781f; --altin-acik: #f6e7c4;
  --dogru: #2c7a4b; --dogru-acik: #dcf0e2; --yanlis: #b23c2a; --yanlis-acik: #f8e0da; --karaoke: #fbe39a;
  --golge: 0 1px 2px rgba(60, 45, 20, .06), 0 6px 18px rgba(60, 45, 20, .07);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141716; --yuzey: #1d2120; --yumusak: #252a29; --cizgi: #343b39;
    --murekkep: #ebe6da; --soluk: #a49f93; --vurgu: #63c4a8; --vurgu-acik: #1f3a33; --altin: #e2b35a; --altin-acik: #3a3020;
    --dogru: #6fcf91; --dogru-acik: #1e3a28; --yanlis: #f08672; --yanlis-acik: #43231d; --karaoke: #4d4216;
    --golge: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  --bg: #141716; --yuzey: #1d2120; --yumusak: #252a29; --cizgi: #343b39;
  --murekkep: #ebe6da; --soluk: #a49f93; --vurgu: #63c4a8; --vurgu-acik: #1f3a33; --altin: #e2b35a; --altin-acik: #3a3020;
  --dogru: #6fcf91; --dogru-acik: #1e3a28; --yanlis: #f08672; --yanlis-acik: #43231d; --karaoke: #4d4216;
  --golge: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--murekkep); font: 17px/1.55 var(--govde); }
button, textarea, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.ar { font-family: var(--arap); direction: rtl; unicode-bidi: isolate; }
.sar { font-family: var(--arap); font-size: 1.25em; direction: rtl; unicode-bidi: isolate; }
.ar-ic { font-family: var(--arap); font-size: 1.2em; direction: rtl; unicode-bidi: isolate; }
.soluk { color: var(--soluk); }
.kucuk { font-size: .88rem; }
h1, h2, h3 { font-family: var(--baslik); font-weight: 700; line-height: 1.15; margin: 0; }

/* üst bölüm */
.ust { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); background: var(--bg); border-bottom: 1px solid var(--cizgi); }
.ust-ic { max-width: 1040px; margin: 0 auto; padding: 10px 16px 0; }
.ust-satir { display: flex; align-items: center; gap: 12px; }
.logo { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1; }
.logo h1 { font-size: 1.35rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo .ar { font-size: 1.3rem; color: var(--vurgu); white-space: nowrap; }
.puan { display: flex; align-items: center; gap: 6px; background: var(--altin-acik); color: var(--altin); border-radius: 999px; padding: 3px 12px; font-weight: 700; font-size: .95rem; white-space: nowrap; }
.ikon-btn { border: 1px solid var(--cizgi); background: var(--yuzey); border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; font-size: 1.05rem; }
.sekmeler { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
.sekmeler::-webkit-scrollbar { display: none; }
.sekme { border: 0; background: none; padding: 8px 12px 9px; border-bottom: 3px solid transparent; white-space: nowrap; color: var(--soluk); font-weight: 600; font-size: .95rem; display: flex; flex-direction: column; align-items: center; gap: 0; }
.sekme small { font-family: var(--arap); font-weight: 400; font-size: .85rem; line-height: 1.2; }
.sekme[aria-selected="true"] { color: var(--vurgu); border-bottom-color: var(--vurgu); }
.sekme .nokta { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--dogru); margin-left: 4px; vertical-align: middle; }

main { max-width: 1040px; margin: 0 auto; padding: 18px 16px 80px; }
.kart { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 16px; padding: 18px 20px; box-shadow: var(--golge); margin-bottom: 18px; }
.kart > h2 { font-size: 1.55rem; margin-bottom: 4px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.kart > h2 .ar { font-size: 1.3rem; color: var(--vurgu); font-weight: 400; }
.kart > .aciklama { color: var(--soluk); margin: 2px 0 14px; }
.yigin > * + * { margin-top: 12px; }
.btn { border: 1px solid var(--cizgi); background: var(--yuzey); border-radius: 10px; padding: 7px 14px; font-weight: 600; font-size: .95rem; }
.btn:hover { border-color: var(--vurgu); }
.btn.dolu { background: var(--vurgu); border-color: var(--vurgu); color: var(--yuzey); }
.btn.kucuk { padding: 4px 10px; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: default; }
.satir-btn { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
textarea, input[type="text"] { width: 100%; border: 1px solid var(--cizgi); border-radius: 10px; background: var(--bg); padding: 9px 12px; resize: vertical; }
textarea.ar, input.ar { font-size: 1.35rem; line-height: 1.8; }
textarea:focus, input:focus, button:focus-visible { outline: 2px solid var(--vurgu); outline-offset: 1px; }
.not { background: var(--altin-acik); border-radius: 12px; padding: 10px 14px; font-size: .95rem; }
.not b { color: var(--altin); }
.ileride { display: inline-block; font-size: .78rem; font-weight: 700; color: var(--altin); border: 1px solid var(--altin); border-radius: 6px; padding: 0 6px; margin-inline-start: 4px; }

/* ayarlar */
.ayarlar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.ayar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ayar .lbl { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--soluk); }
.seg { display: inline-flex; border: 1px solid var(--cizgi); border-radius: 10px; overflow: hidden; background: var(--yuzey); }
.seg button { border: 0; background: none; padding: 5px 11px; font-size: .88rem; font-weight: 600; color: var(--soluk); }
.seg button + button { border-inline-start: 1px solid var(--cizgi); }
.seg button[aria-pressed="true"] { background: var(--vurgu); color: var(--yuzey); }
.anahtar { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; font-weight: 600; cursor: pointer; user-select: none; }
.anahtar input { accent-color: var(--vurgu); width: 17px; height: 17px; }

/* oynatıcı */
.oynatici { position: sticky; top: var(--ust-h, 96px); z-index: 10; background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 16px; box-shadow: var(--golge); padding: 10px 14px; margin-bottom: 16px; }
.oy-ust { display: flex; align-items: center; gap: 10px; }
.oy-btn { border: 0; background: var(--yumusak); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 1rem; flex: none; }
.oy-btn.buyuk { width: 50px; height: 50px; background: var(--vurgu); color: var(--yuzey); font-size: 1.25rem; }
.oy-orta { flex: 1; min-width: 0; }
.oy-orta input[type="range"] { width: 100%; accent-color: var(--vurgu); margin: 0; }
.oy-zaman { display: flex; justify-content: space-between; font-size: .8rem; color: var(--soluk); font-variant-numeric: tabular-nums; }
.oy-alt { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 8px; }
.tekrar-kutu { display: flex; align-items: center; gap: 10px; margin-top: 8px; background: var(--altin-acik); border-radius: 10px; padding: 8px 12px; font-weight: 600; }
.tekrar-cubuk { flex: 1; height: 6px; background: var(--cizgi); border-radius: 3px; overflow: hidden; }
.tekrar-cubuk i { display: block; height: 100%; width: 0; background: var(--altin); }
.p-atla { display: flex; gap: 4px; flex-wrap: wrap; }
.p-atla button { border: 1px solid var(--cizgi); background: var(--yuzey); border-radius: 8px; min-width: 30px; height: 28px; font-size: .85rem; font-weight: 700; color: var(--soluk); }
.p-atla button.aktif { background: var(--vurgu-acik); color: var(--vurgu); border-color: var(--vurgu); }

/* okuma metni */
.paragraf { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 16px; padding: 14px 18px 16px; margin-bottom: 14px; box-shadow: var(--golge); scroll-margin-top: 220px; }
.p-bas { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.p-no { width: 30px; height: 30px; border-radius: 50%; background: var(--vurgu); color: var(--yuzey); display: grid; place-items: center; font-weight: 700; flex: none; }
.p-bas h3 { font-size: 1.3rem; flex: 1; min-width: 160px; }
.kelime-cip { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.cip { display: inline-flex; align-items: baseline; gap: 6px; background: var(--yumusak); border-radius: 8px; padding: 2px 9px; font-size: .88rem; }
.cip .ar { font-size: 1.15rem; }
details > summary { cursor: pointer; color: var(--soluk); font-size: .92rem; font-weight: 600; }
.birim { display: flex; gap: 10px; align-items: flex-start; padding: 7px 8px; border-radius: 12px; cursor: pointer; transition: background .2s; }
.birim + .birim { border-top: 1px dashed var(--cizgi); }
.birim:hover { background: var(--yumusak); }
.birim.calan { background: var(--karaoke); }
.birim.dinlendi .bcal { color: var(--dogru); }

.kel { border: 0; background: none; font: inherit; color: inherit; padding: 0 2px; border-radius: 6px; cursor: pointer; }

 { t: "metin", resim: "mushaf2", paragraf: [

  [["وَكانَتْ لِلْعَرَبِ لُغَةٌ مُشْتَرَكَةٌ، هِيَ اللُّغَةُ العَرَبِيَّةُ الفَصيحَةُ: لُغَةُ الشِّعْرِ وَالخَطابَةِ، الَّتي كانَ العَرَبُ يَتَحَدَّثونَ بِها.", "Arapların ortak bir dili vardı: fasih Arapça; Arapların konuştuğu şiir ve hitabet dili.", "m83-1"],
   ["ثُمَّ جاءَ الإِسْلامُ، وَأَنْزَلَ اللهُ القُرْآنَ الكَريمَ، بِاللُّغَةِ العَرَبِيَّةِ الفَصيحَةِ. قالَ اللهُ تَعالى: ﴿إِنَّا أَنْزَلْنَاهُ قُرْآنًا عَرَبِيًّا لَعَلَّكُمْ تَعْقِلُونَ﴾ [يوسف: ٢].", "Sonra İslâm geldi ve Allah Kur’ân-ı Kerîm’i fasih Arapça ile indirdi. Allah Teâlâ buyurdu: “Anlayasınız diye onu Arapça bir Kur’ân olarak indirdik.”", "m83-2"]],
  [["أَعْطى القُرْآنُ الكَريمُ بَعْضَ الأَلْفاظِ العَرَبِيَّةِ القَديمَةِ مَعانِيَ جَديدَةً، وَجاءَ بِأَساليبَ جَديدَةٍ، لَمْ تَعْرِفْها العَرَبِيَّةُ مِنْ قَبْلُ.", "Kur’ân-ı Kerîm bazı eski Arapça kelimelere yeni anlamlar verdi ve Arapçanın daha önce bilmediği yeni üsluplar getirdi.", "m83-3"],
   ["وَكانَ القُرْآنُ سَبَبًا في نَشْأَةِ عُلومِ اللُّغَةِ العَرَبِيَّةِ؛ كَالنَّحْوِ وَالصَّرْفِ، وَالبَلاغَةِ، وَالعُلومِ الإِسْلامِيَّةِ؛ كَعِلْمِ التَّفْسيرِ وَالحَديثِ وَالفِقْهِ وَغَيْرِها.", "Kur’ân; nahiv, sarf ve belâgat gibi Arap dili ilimlerinin ve tefsir, hadis, fıkıh gibi İslâmî ilimlerin doğmasına sebep oldu.", "m83-4"]],
  [["أَثَّرَتِ اللُّغَةُ العَرَبِيَّةُ في لُغاتِ الشُّعوبِ الإِسْلامِيَّةِ، كَالفارِسِيَّةِ وَالأُرْدِيَّةِ وَالسَّواحِلِيَّةِ، فَأَقْرَضَتْها كَثيرًا مِنَ الأَلْفاظِ، وَكُتِبَ كَثيرٌ مِنْ تِلْكَ اللُّغاتِ بِالحَرْفِ العَرَبِيِّ.", "Arapça; Farsça, Urduca ve Svahili gibi Müslüman halkların dillerini etkiledi, onlara birçok kelime ödünç verdi; bu dillerin birçoğu Arap harfiyle yazıldı.", "m83-5"],
   ["وَاقْتَرَضَتْ لُغاتٌ أُخْرى بَعْضَ الأَلْفاظِ العَرَبِيَّةِ، مِثْلُ: الإِنْجْليزِيَّةِ وَالفَرَنْسِيَّةِ وَالإِسْبانِيَّةِ.", "İngilizce, Fransızca ve İspanyolca gibi başka diller de bazı Arapça kelimeleri ödünç aldı.", "m83-6"]]] },

  ["نَزَلَ القُرْآنُ بِاللُّغَةِ العَرَبِيَّةِ الفَصيحَةِ.", true, "", "Kur’ân fasih Arapça ile indi."],

  ["هَلِ اقْتَرَضَتْ لُغَتُكَ أَلْفاظًا مِنْ لُغاتٍ أُخْرى؟ اذْكُرْ بَعْضًا مِنْها.", "نَعَمْ، مِنَ الفارِسِيَّةِ وَالفَرَنْسِيَّةِ، مِثْلُ: Pencere وَ Otobüs.", "Dilin başka dillerden kelime aldı mı?"],

  ["لِماذا تَقْتَرِضُ اللُّغاتُ بَعْضُها مِنْ بَعْضٍ؟", "لِأَنَّ الشُّعوبَ تَتَّصِلُ بَعْضُها بِبَعْضٍ، وَتَظْهَرُ أَشْياءُ جَديدَةٌ.", "Diller niçin birbirinden kelime alır?"],
  ["اذْكُرْ ثَلاثَ كَلِماتٍ عَرَبِيَّةٍ مَوْجودَةٍ في كُلِّ لُغاتِ العالَمِ تَقْريبًا.", "اللهُ، القُرْآنُ، الإِسْلامُ (وَمِنْها: السُّكَّرُ، القَهْوَةُ).", "Neredeyse bütün dillerde bulunan üç Arapça kelime söyle."]] },
 { t: "acik", ar: "التَّدْريبُ (٢): ماذا تَفْعَلُ؟ ناقِشِ المَوْضوعاتِ مَعَ زُمَلائِكَ", aciklama: "Grup etkinliği; sonra örnek cevaba bak.", ogeler: [
  ["تُريدُ تَعَلُّمَ اللُّغَةِ العَرَبِيَّةِ.", "أَلْتَحِقُ بِمَعْهَدٍ لِتَعْليمِ العَرَبِيَّةِ، وَأَتَحَدَّثُ بِها كَثيرًا.", "Arapça öğrenmek istiyorsun."], ["تُريدُ دِراسَةَ الإِسْلامِ.", "أَدْرُسُهُ بِاللُّغَةِ العَرَبِيَّةِ في كُلِّيَّةِ الشَّريعَةِ.", "İslâm’ı okumak istiyorsun."],
  ["تُريدُ التَّخَصُّصَ في الدِّراساتِ الإِسْلامِيَّةِ.", "أَلْتَحِقُ بِجامِعَةٍ إِسْلامِيَّةٍ، وَأَتَعَلَّمُ العَرَبِيَّةَ أَوَّلًا.", "İslâmî ilimlerde uzmanlaşmak istiyorsun."], ["تُريدُ التَّخَصُّصَ في اللُّغَةِ العَرَبِيَّةِ.", "أَلْتَحِقُ بِكُلِّيَّةِ الآدابِ، وَأَدْرُسُ النَّحْوَ وَالصَّرْفَ وَالبَلاغَةَ.", "Arap dilinde uzmanlaşmak istiyorsun."],
  ["تُريدُ السَّفَرَ إِلى بَلَدٍ عَرَبِيٍّ / إِسْلامِيٍّ.", "أَتَعَلَّمُ لُغَةَ أَهْلِهِ وَعاداتِهِمْ قَبْلَ السَّفَرِ.", "Arap / İslâm ülkesine gitmek istiyorsun."], ["تُريدُ السَّفَرَ إِلى بَلَدٍ غَيْرِ إِسْلامِيٍّ.", "أُحافِظُ عَلى ديني وَصَلاتي، وَأَبْحَثُ عَنِ المَسْجِدِ.", "İslâm ülkesi olmayan bir yere gitmek istiyorsun."]] }
]},
// ---------------- DERS 88 ----------------
{ no: 88, kisa: "العَرَبِيَّةُ لُغَةٌ عالَمِيَّةٌ", ar: "العَرَبِيَّةُ لُغَةٌ عالَمِيَّةٌ", tr: "Arapça bir dünya dili", ozet: "Okuma metni: Abbâsî döneminde dünya dili Arapça; zayıflama dönemleri; bugün yeniden dünya dili.", bloklar: [
 { t: "hazirlik", ar: "تَهْيِئَةٌ — فَكِّرْ في الإِجابَةِ عَنِ الأَسْئِلَةِ التّالِيَةِ", ogeler: [
  ["في أَيِّ عَصْرٍ كانَتِ العَرَبِيَّةُ لُغَةً عالَمِيَّةً؟", "Arapça hangi çağda dünya diliydi?"], ["هَلِ اقْتَرَضَتْ لُغاتُ أوروبّا أَلْفاظًا مِنَ اللُّغَةِ العَرَبِيَّةِ؟", "Avrupa dilleri Arapçadan kelime aldı mı?"], ["ما أَهْدافُ الاسْتِعْمارِ الثَّقافِيِّ؟", "Kültürel sömürgeciliğin hedefleri neler?"], ["هَلِ العَرَبِيَّةُ لُغَةٌ عالَمِيَّةٌ الآنَ؟", "Arapça bugün bir dünya dili mi?"]] },
 { t: "metin", resim: ["kharitat", "kitab"], paragraf: [
  [["كانَتِ اللُّغَةُ العَرَبِيَّةُ لُغَةً عالَمِيَّةً في العَصْرِ العَبّاسِيِّ، الَّذي ازْدَهَرَتْ فيهِ الحَضارَةُ الإِسْلامِيَّةُ.", "Arapça, İslâm medeniyetinin parladığı Abbâsî döneminde bir dünya diliydi.", "m88-0"],
   ["وَكانَتِ العَرَبِيَّةُ لُغَةَ تِلْكَ الحَضارَةِ، الَّتي تُرْجِمَتْ إِلَيْها الكُتُبُ مِنَ اليونانِيَّةِ وَالفارِسِيَّةِ، وَأَلَّفَ بِها العُلَماءُ في الطِّبِّ، وَالهَنْدَسَةِ، وَالرِّياضِيّاتِ، وَالعُلومِ، وَغَيْرِ ذلِكَ.", "Arapça, Yunanca ve Farsçadan kitapların kendisine tercüme edildiği ve âlimlerin tıp, mühendislik, matematik, fen ve başka alanlarda eser yazdığı o medeniyetin diliydi.", "m88-1"],
   ["وَحَمَلَتِ اللُّغَةُ العَرَبِيَّةُ تِلْكَ العُلومَ إِلى أوروبّا، فَكانَتْ أَساسَ الحَضارَةِ الغَرْبِيَّةِ الحَديثَةِ.", "Arapça bu ilimleri Avrupa’ya taşıdı ve böylece modern Batı medeniyetinin temeli oldu.", "m88-2"]],
  [["مَرَّتْ بِالعَرَبِ -بَعْدَ ذلِكَ- عُصورٌ مِنَ الضَّعْفِ، ابْتَعَدوا فيها عَنْ دينِهِمْ، وَهَجَروا اللُّغَةَ العَرَبِيَّةَ الفَصيحَةَ، وَاسْتَعْمَلوا اللَّهَجاتِ.", "Daha sonra Araplar zayıflık dönemleri yaşadı; bu dönemlerde dinlerinden uzaklaştılar, fasih Arapçayı terk ettiler ve lehçeleri kullandılar.", "m88-3"],
   ["ثُمَّ جاءَ الاسْتِعْمارُ، فَحارَبَ الثَّقافَةَ الإِسْلامِيَّةَ، وَاللُّغَةَ العَرَبِيَّةَ الفَصيحَةَ، وَشَجَّعَ اللَّهَجاتِ، فَكانَتْ هُناكَ لَهْجَةٌ مِصْرِيَّةٌ، وَأُخْرى مَغْرِبِيَّةٌ، وَثالِثَةٌ سورِيَّةٌ، وَهكَذا…", "Sonra sömürgecilik geldi; İslâm kültürüne ve fasih Arapçaya savaş açtı, lehçeleri teşvik etti; böylece bir Mısır lehçesi, bir Mağrip lehçesi, bir Suriye lehçesi ve benzerleri oluştu…", "m88-4"],
   ["وَقَدْ أَدّى هذا إِلى تَفَرُّقِ العَرَبِ، وَبُعْدِ بَعْضِهِمْ عَنْ بَعْضٍ؛ بِحَيْثُ إِذا سافَرَ العَرَبِيُّ مِنْ بَلَدِهِ إِلى بَلَدٍ عَرَبِيٍّ آخَرَ، وَجَدَ بَعْضَ الصُّعوبَةِ في الاتِّصالِ بِأَهْلِ ذلِكَ البَلَدِ،", "Bu da Arapların dağılmasına ve birbirinden uzaklaşmasına yol açtı; öyle ki bir Arap kendi ülkesinden başka bir Arap ülkesine gittiğinde o ülkenin halkıyla iletişimde biraz zorluk çekti;", "m88-5"],
   ["إِذا تَحَدَّثوا بِلَهَجاتِهِمْ، وَلا يَتَحَقَّقُ الاتِّصالُ التّامُّ بَيْنَهُ وَبَيْنَهُمْ، إِلّا إِذا كانَ الحَديثُ بِاللُّغَةِ العَرَبِيَّةِ الفَصيحَةِ.", "onlar lehçeleriyle konuşursa; aralarında tam iletişim ancak fasih Arapça ile konuşulursa gerçekleşir.", "m88-6"]],
  [["اخْتَلَفَ الأَمْرُ اليَوْمَ، فَضَعُفَتِ اللَّهَجاتُ، وَقَوِيَتِ اللُّغَةُ العَرَبِيَّةُ الفَصيحَةُ؛ بِسَبَبِ التَّعْليمِ وَوَسائِلِ الاتِّصالِ الحَديثَةِ.", "Bugün durum değişti: Eğitim ve modern iletişim araçları sayesinde lehçeler zayıfladı, fasih Arapça güçlendi.", "m88-7"],
   ["وَأَصْبَحَتِ العَرَبِيَّةُ لُغَةً عالَمِيَّةً مَرَّةً ثانِيَةً، كَالإِنْجْليزِيَّةِ، وَالفَرَنْسِيَّةِ، وَالإِسْبانِيَّةِ.", "Arapça yeniden İngilizce, Fransızca ve İspanyolca gibi bir dünya dili oldu.", "m88-8"],
   ["فَهِيَ إِحْدى اللُّغاتِ الرَّسْمِيَّةِ في هَيْئَةِ الأُمَمِ المُتَّحِدَةِ، وَهِيَ اللُّغَةُ السّادِسَةُ في العالَمِ، يَتَحَدَّثُ بِها أَكْثَرُ مِنْ ٢٠٠ مِلْيونِ عَرَبِيٍّ، وَيُؤَدّي العِباداتِ بِها أَكْثَرُ مِنْ مِلْيارِ مُسْلِمٍ.", "Birleşmiş Milletler’in resmî dillerinden biridir; dünyanın altıncı dilidir; 200 milyondan fazla Arap onu konuşur ve bir milyardan fazla müslüman ibadetlerini onunla yapar.", "m88-9"]]] },
 { t: "secim", ar: "اسْتيعابٌ — التَّدْريبُ (١): ضَعْ عَلامَةَ (✓) أَمامَ العِبارَةِ الصَّحيحَةِ تَحْتَ: العَرَبِيَّةُ في الماضي أَوِ الحاضِرِ", ogeler: [
  ["لُغَةٌ عالَمِيَّةٌ.", "في الماضي وَالحاضِرِ", ["في الماضي فَقَطْ", "في الحاضِرِ فَقَطْ"], "Bir dünya dili.", "Abbâsî döneminde dünya diliydi; bugün yeniden dünya dili oldu."],
  ["تُرْجِمَتْ إِلَيْها كُتُبٌ مِنَ اليونانِيَّةِ.", "في الماضي", ["في الحاضِرِ", "في الماضي وَالحاضِرِ"], "Ona Yunancadan kitaplar tercüme edildi."],
  ["يَتَحَدَّثُ بِها أَكْثَرُ مِنْ ٢٠٠ مِلْيونِ عَرَبِيٍّ.", "في الحاضِرِ", ["في الماضي", "في الماضي وَالحاضِرِ"], "200 milyondan fazla Arap onu konuşuyor."],
  ["حَمَلَتِ العُلومَ إِلى أوروبّا.", "في الماضي", ["في الحاضِرِ", "في الماضي وَالحاضِرِ"], "İlimleri Avrupa’ya taşıdı."],
  ["ضَعُفَتِ اللَّهَجاتُ.", "في الحاضِرِ", ["في الماضي", "في الماضي وَالحاضِرِ"], "Lehçeler zayıfladı."],
  ["لُغَةٌ رَسْمِيَّةٌ (في الأُمَمِ المُتَّحِدَةِ).", "في الحاضِرِ", ["في الماضي", "في الماضي وَالحاضِرِ"], "Resmî bir dil."],
  ["قَوِيَتِ العَرَبِيَّةُ الفَصيحَةُ.", "في الحاضِرِ", ["في الماضي", "في الماضي وَالحاضِرِ"], "Fasih Arapça güçlendi."]] },
 { t: "secim", ar: "التَّدْريبُ (٢): ضَعْ عَلامَةَ (✓) بِجانِبِ الفِكْرَةِ الرَّئيسَةِ في كُلِّ فِقْرَةٍ", ogeler: [
  ["الفِكْرَةُ الرَّئيسَةُ في الفِقْرَةِ الأولى:", "العَرَبِيَّةُ لُغَةُ الحَضارَةِ في الماضي.", ["العَرَبِيَّةُ أَساسُ الحَضارَةِ الغَرْبِيَّةِ.", "أَلَّفَ العُلَماءُ في الطِّبِّ بِاللُّغَةِ العَرَبِيَّةِ."], "Birinci paragrafın ana fikri:"],
  ["الفِكْرَةُ الرَّئيسَةُ في الفِقْرَةِ الثّانِيَةِ:", "ضَعْفُ اللُّغَةِ العَرَبِيَّةِ.", ["عُصورُ الضَّعْفِ.", "الاسْتِعْمارُ شَجَّعَ اللَّهَجاتِ."], "İkinci paragrafın ana fikri:"],
  ["الفِكْرَةُ الرَّئيسَةُ في الفِقْرَةِ الثّالِثَةِ:", "قَوِيَتِ اللُّغَةُ العَرَبِيَّةُ وَأَصْبَحَتْ عالَمِيَّةً.", ["وَسائِلُ الاتِّصالِ الحَديثَةُ.", "اللُّغاتُ الرَّسْمِيَّةُ في الأُمَمِ المُتَّحِدَةِ."], "Üçüncü paragrafın ana fikri:"]] },
 { t: "esle", ar: "مُفْرَداتٌ — التَّدْريبُ (١): هاتِ جَمْعَ الكَلِماتِ التّالِيَةِ مِنَ النَّصِّ، ثُمَّ اسْتَعْمِلْها في جُمَلٍ مِنْ إِنْشائِكَ", ciftler: [
  ["أَمْرٌ", "أُمورٌ", "iş"], ["أُمَّةٌ", "أُمَمٌ", "ümmet, millet"], ["عَرَبِيٌّ", "عَرَبٌ", "Arap"], ["عَصْرٌ", "عُصورٌ", "çağ"], ["عالِمٌ", "عُلَماءُ", "âlim"], ["عِلْمٌ", "عُلومٌ", "ilim"]] },
 { t: "acik", ar: "التَّدْريبُ (٢): كَوِّنْ جُمْلَةً مُناسِبَةً مِنْ كُلِّ كَلِمَتَيْنِ", ogeler: [
  ["يُحارِبُ / الاسْتِعْمارُ", "يُحارِبُ الاسْتِعْمارُ الثَّقافَةَ الإِسْلامِيَّةَ.", "savaşır / sömürgecilik"], ["ابْتَعَدَ / دينٌ", "ابْتَعَدَ بَعْضُ النّاسِ عَنْ دينِهِمْ.", "uzaklaştı / din"], ["هَجَرَ / اللُّغَةُ", "هَجَرَ العَرَبُ اللُّغَةَ الفَصيحَةَ في عُصورِ الضَّعْفِ.", "terk etti / dil"],
  ["أَلَّفَ / كِتابٌ", "أَلَّفَ العالِمُ كِتابًا في الطِّبِّ.", "yazdı / kitap"], ["تَرْجَمَ / قِصَّةٌ", "تَرْجَمَ الطّالِبُ قِصَّةً إِلى التُّرْكِيَّةِ.", "tercüme etti / hikâye"], ["تَزْدَهِرُ / العُلومُ", "تَزْدَهِرُ العُلومُ في الجامِعاتِ الكَبيرَةِ.", "gelişir / ilimler"]] }
]},
// ---------------- DERS 89 ----------------
{ no: 89, kisa: "النَّعْتُ أَوِ الصِّفَةُ", ar: "النَّعْتُ أَوِ الصِّفَةُ", tr: "Na‘t (sıfat)", ozet: "Öncesindekini niteleyen ve i‘râbta ona uyan isim.", bloklar: [
 { t: "kural", ar: "مُلاحَظَةٌ نَحْوِيَّةٌ", metin: "النَّعْتُ أَوِ الصِّفَةُ: اسْمٌ يَصِفُ ما قَبْلَهُ، وَيَتْبَعُهُ في إِعْرابِهِ.", tr: "Na‘t ya da sıfat, öncesindeki ismi (men‘ût) niteleyen ve i‘râbta ona uyan isimdir. Ayrıca belirlilik (ال), cinsiyet ve sayıda da ona uyar: طالِبَةٌ جَديدَةٌ، اللُّغَةُ العَرَبِيَّةُ." },
 { t: "ornek", ar: "ادْرُسْ وَلاحِظْ", ogeler: [
  ["أَعْتَقِدُ أَنَّكِ طالِبَةٌ [[جَديدَةٌ]].", "Sanırım yeni bir öğrencisin."], ["هَلْ دَرَسْتِ اللُّغَةَ [[العَرَبِيَّةَ]]؟", "Arapça okudun mu?"], ["لِماذا تَدْرُسينَها مَرَّةً [[ثانِيَةً]]؟", "Onu niçin ikinci kez okuyorsun?"], ["هُناكَ تَدْريباتٌ [[صَوْتِيَّةٌ]].", "Ses alıştırmaları var."],

  else if (KS.mod === "kart") { var w = L[KS.k % L.length]; h += '<div class="kart"><div class="flas' + (KS.dondu ? " dondu" : "") + '"><div class="flas-ic" data-act="kdon"><div class="flas-yuz flas-on"><span class="ar" style="font-size:2.4rem">' + esc(w[0]) + '</span></div><div class="flas-yuz flas-arka"><b style="font-size:1.4rem">' + esc(w[1]) + '</b></div></div></div><div class="satir-btn" style="justify-content:center"><button class="btn" data-act="kgec" data-v="-1">←</button>' + calBtn({ m: w[0] }, "btn") + '<button class="btn" data-act="kdon">Çevir</button><button class="btn" data-act="kgec" data-v="1">→</button></div><p class="soluk kucuk" style="text-align:center">' + (KS.k % L.length + 1) + " / " + L.length + "</p></div>"; }
  else {
    if (!KS.oyun) { var s = karistir(L).slice(0, 6); KS.oyun = { s: s, sag: karistir(s.map(function (_, i) { return i; })), sol: null, ok: {}, hata: 0 }; }
    var o = KS.oyun, bit = Object.keys(o.ok).length === o.s.length;
    h += '<div class="kart"><div class="eslestir"><div class="es-sutun">' + o.s.map(function (w, i) { return '<button class="es sol' + (o.ok[i] ? " dogru" : o.sol === i ? " secili" : "") + '" data-act="ko-sol" data-i="' + i + '"' + (o.ok[i] ? " disabled" : "") + '><span class="ar">' + esc(w[0]) + "</span></button>"; }).join("") +
      '</div><div class="es-sutun">' + o.sag.map(function (i) { return '<button class="es sag' + (o.ok[i] ? " dogru" : "") + '" data-act="ko-sag" data-i="' + i + '"' + (o.ok[i] ? " disabled" : "") + ">" + esc(o.s[i][1]) + "</button>"; }).join("") + "</div></div>" +
      (bit ? '<p class="sonuc-buyuk" style="text-align:center">' + (o.hata ? o.hata + " hata" : "Hatasız!") + "</p>" : "") + '<div class="satir-btn" style="justify-content:center"><button class="btn dolu" data-act="ko-yeni">Yeni oyun</button></div></div>';

// sınav
var SN = null;
function havuz() {
  var P = [];
  DERSLER.forEach(function (d) {
    d.bloklar.forEach(function (b) {
      if (b.t === "secim") b.ogeler.forEach(function (s) { P.push({ q: s[0], d: s[1], o: [s[1]].concat(s[2]), ders: d.no }); });
      if (b.t === "bosluk") b.ogeler.forEach(function (s) { P.push({ q: s[0], d: s[1], o: s[2] ? [s[1]].concat(s[2]) : karistir(b.kutu.filter(function (x) { return x !== s[1]; })).slice(0, 3).concat([s[1]]), ders: d.no }); });
      if (b.t === "dy") b.ogeler.forEach(function (s) { P.push({ q: s[0], d: s[1] ? "✓ Doğru" : "✗ Yanlış", o: ["✓ Doğru", "✗ Yanlış"], ders: d.no, not: s[1] ? "" : s[2] }); });
      if (b.t === "siniflandir") b.ogeler.forEach(function (s) { P.push({ q: s[0] + " ← " + (b.soru || "?"), d: b.gruplar[s[1]], o: b.gruplar.slice(), ders: d.no }); });
    });
  });
  return P;
}
CIZ.sinav = function () {

  var q = SN.s[SN.i], sec = karistir(q.o, "sn" + SN.i + q.q);
  return '<div class="kart"><div class="bolum-ust"><b>Soru ' + (SN.i + 1) + " / " + SN.s.length + '</b><span class="soluk">Ders ' + q.ders + " · Puan " + SN.p + "</span></div>" + soruBas(SN.i, q.q) + '<div class="secim' + (SN.c ? " bitti" : "") + '">' + sec.map(function (o) {
    var c = !SN.c ? "" : o === q.d ? " dogru" : o === SN.c ? " yanlis" : "";

  }).join("") + "</div>" + (SN.c ? (q.not ? '<div class="sonra">Doğrusu: ' + AR(q.not) + "</div>" : "") + '<div class="satir-btn" style="margin-top:10px"><button class="btn dolu" data-act="sn-gec">Devam →</button></div>' : "") + "</div>";
};

// ---------- çizim ----------
function sekmelerCiz() {
  document.getElementById("sekmeler").innerHTML = SEKMELER.map(function (s) {
    var d = DERSLER.filter(function (x) { return "d" + x.no === s[0]; })[0], bitti = d && dToplam(d) && dYapilan(d) === dToplam(d);
    return '<button type="button" class="sekme" role="tab" data-sekme="' + s[0] + '" aria-selected="' + (ST.sekme === s[0]) + '"><span>' + s[1] + (bitti ? '<span class="nokta"></span>' : "") + "</span><small>" + esc(s[2]) + "</small></button>";
  }).join("");
}
function ustGuncelle() { document.getElementById("puan").textContent = "★ " + puan(); }
var ana = document.getElementById("ana");
function ciz(basa) {
  var y = scrollY;
  ana.innerHTML = CIZ[ST.sekme]() + '<p class="alt-bilgi">el-Arabiyyetü beyne yedeyk · 2. kitap · ' + UNITE.no + ". ünite — çevrimdışı çalışır; ilerlemen bu tarayıcıda saklanır.</p>";
  if (basa) scrollTo(0, 0); else scrollTo(0, y);
}
function sekmeAc(s) { durdur(); ST.sekme = s; ayarKaydet(); sekmelerCiz(); ciz(true); var b = document.querySelector('.sekme[data-sekme="' + s + '"]'); if (b && b.scrollIntoView) b.scrollIntoView({ block: "nearest", inline: "center" }); }
function dersOf(k) { var no = +k.split("-")[0].slice(1); return DERSLER.filter(function (d) { return d.no === no; })[0]; }
function blokOf(k) { return dersOf(k).bloklar[+k.split("-")[1]]; }
function yeniden(k) { var el = document.getElementById(k); if (!el) return ciz(); var d = dersOf(k), j = +k.split("-")[1]; el.innerHTML = R[d.bloklar[j].t](d.bloklar[j], k, d); var u = document.querySelector(".bolum-ust"); if (u) u.lastChild.innerHTML = durum(d); }
function cevap(k, i, ok, v) { var d = dersOf(k); bip(ok ? "ok" : "no"); kaydet(k + ":" + i, { ok: ok, v: v }, d); yeniden(k); }

document.addEventListener("click", function (e) {
  var t = e.target, el;
  if ((el = t.closest("[data-sekme]"))) { sekmeAc(el.dataset.sekme); return; }
  if (!(el = t.closest("[data-act]"))) return;
  var act = el.dataset.act, k = el.dataset.k, i = +el.dataset.i, b;
  switch (act) {
    case "cal": durdur(); var o = JSON.parse(el.dataset.o); var bir = el.closest(".birim"); if (bir) { bir.classList.add("calan", "dinlendi"); } cal1(o, function () { if (bir) bir.classList.remove("calan"); }); break;
    case "dur": durdur(); break;
    case "dinle-hepsi": b = blokOf(k);
      var L = b.t === "diyalog" ? b.satir.map(function (s, n) { return { o: { s: s[3], m: s[1] }, el: "#" + k + "-" + n }; }) : [].concat.apply([], b.paragraf).map(function (s, n) { return { o: { s: s[2], m: s[0] }, el: "#" + k + "-" + n }; });
      kuyruk(L, function () { if (!A[k]) { kaydet(k, 1, dersOf(k)); yeniden(k); } }); break;
    case "rol": b = blokOf(k);
      kuyruk(b.satir.map(function (s, n) { var o = { s: s[3], m: s[1] }; return { o: o, el: "#" + k + "-" + n, bekle: s[0] === i ? sure(o) * 1.3 + 1 : 0 }; }), function () { if (!A[k]) { kaydet(k, 1, dersOf(k)); yeniden(k); } toast("Rol bitti. Şimdi öteki rolü dene!"); }); break;
    case "dinle-kayit": durdur(); cal1(JSON.parse(el.dataset.o), function () { if (!A[k]) { kaydet(k, 1, dersOf(k)); yeniden(k); } }); break;
    case "dy": b = blokOf(k); var v = el.dataset.v === "true"; cevap(k, i, v === b.ogeler[i][1], v); break;
    case "secim": b = blokOf(k); cevap(k, i, el.dataset.v === b.ogeler[i][1], el.dataset.v); break;
    case "sessec": cevap(k, i, el.dataset.v === el.dataset.h, el.dataset.v); break;
    case "sinif": b = blokOf(k); cevap(k, i, +el.dataset.v === b.ogeler[i][1], +el.dataset.v); break;
    case "goster": kaydet(k + ":" + i, 1, dersOf(k)); yeniden(k); b = blokOf(k); var it = (b.ogeler || b.resimler)[i]; cal1({ m: it[1] }); break;
    case "sira": b = blokOf(k); var st = SIRA[k]; st.dizi.push(i);
      if (st.dizi.length === b.ogeler.length) { var ok = st.dizi.every(function (x, n) { return x === n; }); if (ok) { bip("ok"); kaydet(k, true, dersOf(k)); } else { bip("no"); toast("Sıra doğru değil; tekrar dene."); st.dizi = []; } }
      yeniden(k); break;
    case "sira-sifir": SIRA[k] = { dizi: [] }; if (A[k]) { delete A[k]; cevapKaydet(); ustGuncelle(); } yeniden(k); break;
    case "es-sol": ESLE[k].sol = i; yeniden(k); break;
    case "es-sag": var es = ESLE[k]; if (es.sol == null) { toast("Önce soldan bir kelime seç."); break; }
      if (es.sol === i) { es.ok[i] = true; es.sol = null; bip("ok"); b = blokOf(k); if (Object.keys(es.ok).length === b.ciftler.length) kaydet(k, true, dersOf(k)); yeniden(k); }
      else { bip("no"); el.classList.add("titre"); setTimeout(function () { el.classList.remove("titre"); }, 400); } break;
    case "es-sifir": ESLE[k] = { sol: null, ok: {} }; delete A[k]; cevapKaydet(); ustGuncelle(); yeniden(k); break;
    case "tr-ac": ST.tr = el.checked; ayarKaydet(); document.querySelectorAll(".trline").forEach(function (x) { if (!x.closest(".model,.sonra,.kural-kutu,.hat-grup,.rkart,.es-sutun")) x.hidden = !ST.tr; }); break;
    case "hiz": ST.hiz = +el.dataset.v; ayarKaydet(); ciz(); break;
    case "kders": ST.kDers = +el.dataset.v; KS.k = 0; KS.oyun = null; ayarKaydet(); ciz(); break;
    case "kmod": KS.mod = el.dataset.v; KS.oyun = null; ciz(); break;
    case "kdon": KS.dondu = !KS.dondu; ciz(); break;
    case "kgec": KS.k = Math.max(0, KS.k + +el.dataset.v + 1000) % 1000; KS.dondu = false; ciz(); break;
    case "ko-sol": KS.oyun.sol = i; ciz(); break;
    case "ko-sag": if (KS.oyun.sol === i) { KS.oyun.ok[i] = true; KS.oyun.sol = null; bip("ok"); cal1({ m: KS.oyun.s[i][0] }); } else { KS.oyun.hata++; bip("no"); } ciz(); break;
    case "ko-yeni": KS.oyun = null; ciz(); break;
    case "sn-bas": SN = { s: karistir(havuz()).slice(0, 15), i: 0, p: 0, c: null }; ciz(true); break;
    case "sn": var q = SN.s[SN.i]; SN.c = el.dataset.v; if (SN.c === q.d) { SN.p++; bip("ok"); } else bip("no"); ciz(); break;
    case "sn-gec": SN.i++; SN.c = null; ciz(true); break;
    case "sifirla": if (confirm("Bütün cevaplar silinsin mi?")) { A = {}; SIRA = {}; ESLE = {}; cevapKaydet(); ustGuncelle(); sekmelerCiz(); ciz(true); } break;
  }
});
// gömülü okunuş listesi (ses_topla.mjs okur)
window.SES_LISTE = function () {
  var L = [];
  var ekle = function (s) { if (s && /[؀-ۿ]/.test(s)) L.push(temiz(s)); };
  DERSLER.forEach(function (d) {
    d.bloklar.forEach(function (b) {
      if (b.t === "diyalog") b.satir.forEach(function (s) { if (!s[3] || !ZAMAN[s[3]]) ekle(s[1]); });
      if (b.t === "metin") b.paragraf.forEach(function (p) { p.forEach(function (s) { if (!s[2] || !ZAMAN[s[2]]) ekle(s[0]); }); });
      if ((b.t === "ornek" || b.t === "tekrar") && b.tts !== false) b.ogeler.forEach(function (s) { if (!s[2] || !ZAMAN[s[2]]) ekle(s[0]); });
      if (b.t === "tablo" && b.tts !== false) b.satir.forEach(function (r, ri) { r.forEach(function (c, ci) { if (c !== "×" && !(b.ses && ZAMAN[b.ses[ri][ci]])) ekle(c); }); });
      if (b.t === "acik" || b.t === "resim") (b.ogeler || b.resimler).forEach(function (s) { ekle(s[1]); });
      if (b.t === "sessec") b.ogeler.forEach(function (s, i) { [0, 1].forEach(function (j) { if (!(b.ses && ZAMAN[b.ses[i][j]])) ekle(s[j]); }); });
    });
  });
  KELIME.forEach(function (w) { ekle(w[0]); });
  return L.filter(function (x, n) { return L.indexOf(x) === n; });
};

document.getElementById("efektBtn").style.opacity = ST.efekt ? 1 : .45;
if (!CIZ[ST.sekme]) ST.sekme = "bas";
temaUygula(); sekmelerCiz(); ustGuncelle(); ciz(true);
