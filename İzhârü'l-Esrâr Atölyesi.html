<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>İzhârü'l-Esrâr Atölyesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Amiri:wght@400;700&display=swap">
<style>
:root{
  --paper:#F4F6F2;--card:#fff;--ink:#1B2420;--muted:#5E6A63;--line:#D9E0DA;--soft:#EAEFEA;
  --accent:#1E5B4F;--accent-ink:#fff;--gold:#B98A1B;
  --ref:#B3402F;--nasb:#A86A0E;--cerr:#2D5FA8;--cezm:#6A4FB0;--none:#6B6152;
  --good:#1F7A3E;--bad:#B3261E;--good-bg:#E2F2E6;--bad-bg:#FBE7E4;
  --f-display:"Alegreya",Georgia,serif;--f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --f-ar:"Amiri","Scheherazade New","Traditional Arabic","Noto Naskh Arabic",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111614;--card:#19201D;--ink:#E6ECE8;--muted:#9FACA5;--line:#2C3632;--soft:#202925;
  --accent:#6CC3AE;--accent-ink:#0d1a16;--gold:#E6BE5A;
  --ref:#F28B78;--nasb:#EDB45C;--cerr:#8DB4F5;--cezm:#ABA3F5;--none:#CDBB95;
  --good:#6FD08E;--bad:#FF8A80;--good-bg:#17301F;--bad-bg:#3A1D1A;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111614;--card:#19201D;--ink:#E6ECE8;--muted:#9FACA5;--line:#2C3632;--soft:#202925;
  --accent:#6CC3AE;--accent-ink:#0d1a16;--gold:#E6BE5A;
  --ref:#F28B78;--nasb:#EDB45C;--cerr:#8DB4F5;--cezm:#ABA3F5;--none:#CDBB95;
  --good:#6FD08E;--bad:#FF8A80;--good-bg:#17301F;--bad-bg:#3A1D1A;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0 0 .4em;line-height:1.2;letter-spacing:.1px}
h1{font-size:30px;font-weight:800}h2{font-size:23px;font-weight:700}h3{font-size:18px;font-weight:700}
p{margin:.5em 0}
button{font:inherit;color:inherit;cursor:pointer}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;line-height:1.9}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px;height:54px}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .ar{font-size:22px;color:var(--accent);margin-left:6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;background:var(--soft);font-weight:700;font-size:14px;white-space:nowrap}
.xpbar{height:4px;background:var(--soft)}.xpbar i{display:block;height:100%;background:var(--accent);transition:width .5s}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0}
nav.bottom button{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);font-size:12.5px;font-weight:700}
nav.bottom button .ic{font-size:21px;line-height:1.1}
nav.bottom button.on{color:var(--accent)}
main{padding:18px 0 30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
.card.soft{background:var(--soft);border-color:transparent}
.hero{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000));color:var(--accent-ink);border:0;position:relative;overflow:hidden}
.hero .big-ar{position:absolute;right:-6px;top:-18px;font-size:120px;opacity:.13;line-height:1;pointer-events:none}
.hero h1{margin-bottom:4px}.hero p{opacity:.92;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 18px;border-radius:12px;border:1.5px solid var(--accent);
  background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.light{background:#fff;color:#1E5B4F;border-color:#fff}
.btn.sm{min-height:36px;padding:4px 12px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:14.5px}
.babhead{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.babhead .ar{font-size:26px;color:var(--accent)}
.lesson{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.lesson:hover{border-color:var(--accent)}
.lesson .num{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:800;font-family:var(--f-display);font-size:19px;flex:none}
.lesson.done .num{background:var(--good);color:#fff}
.lesson .t{flex:1;min-width:0}.lesson .t b{display:block}.lesson .t .ar{font-size:20px;color:var(--muted)}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.game{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%}
.game:hover{border-color:var(--accent)}
.game .gi{font-size:30px;line-height:1}
.game b{font-family:var(--f-display);font-size:18px}
/* i'rab renkleri */
.w{display:inline-block;padding:0 8px;margin:2px 3px;border-radius:10px;border:1.5px solid transparent;background:var(--soft);font-family:var(--f-ar);font-size:30px;line-height:1.7;cursor:pointer}
.w.plain{background:transparent;cursor:default}
.w.r{color:var(--ref);border-color:color-mix(in srgb,var(--ref) 45%,transparent);background:color-mix(in srgb,var(--ref) 9%,transparent)}
.w.n{color:var(--nasb);border-color:color-mix(in srgb,var(--nasb) 45%,transparent);background:color-mix(in srgb,var(--nasb) 10%,transparent)}
.w.c{color:var(--cerr);border-color:color-mix(in srgb,var(--cerr) 45%,transparent);background:color-mix(in srgb,var(--cerr) 9%,transparent)}
.w.z{color:var(--cezm);border-color:color-mix(in srgb,var(--cezm) 45%,transparent);background:color-mix(in srgb,var(--cezm) 9%,transparent)}
.w.x{color:var(--none);border-color:color-mix(in srgb,var(--none) 45%,transparent)}
.w.sel{outline:3px solid var(--accent);outline-offset:1px}
.sent{direction:rtl;text-align:right;padding:6px 0}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:13.5px;font-weight:700;margin:6px 0 4px}
.legend span{padding:1px 10px;border-radius:99px;border:1.5px solid}
.lg-r{color:var(--ref);border-color:var(--ref)}.lg-n{color:var(--nasb);border-color:var(--nasb)}.lg-c{color:var(--cerr);border-color:var(--cerr)}.lg-z{color:var(--cezm);border-color:var(--cezm)}
.reveal{min-height:56px;border-radius:12px;background:var(--soft);padding:10px 14px;font-size:16.5px;margin-top:6px}
.reveal b{font-family:var(--f-display)}
table.t{width:100%;border-collapse:collapse;font-size:15.5px;margin:8px 0}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.t th{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
table.t .ar{font-size:21px;line-height:1.5}
.tblwrap{overflow-x:auto}
.callout{border-left:4px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent);padding:10px 14px;border-radius:0 12px 12px 0;margin:12px 0}
.callout b{color:var(--gold)}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:17px;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.opt .ar{font-size:22px}
.qprompt{font-size:19px;font-weight:500}
.feedback{border-radius:12px;padding:10px 14px;margin:10px 0}
.feedback.ok{background:var(--good-bg);color:var(--good)}.feedback.no{background:var(--bad-bg);color:var(--bad)}
.feedback span{color:var(--ink)}
.prog{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0 14px}.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.timer i{background:var(--gold)}
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 0;margin-bottom:6px;font-size:16px}
.flash{perspective:900px;margin:10px 0}
.flash .face{min-height:200px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;padding:20px;text-align:center;cursor:pointer}
.flash .face .ar{font-size:44px}
.flash .face.back-face{background:var(--soft)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:480px){.mgrid{grid-template-columns:repeat(3,1fr)}}
.mc{min-height:84px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;padding:4px;text-align:center;font-size:14.5px;line-height:1.25;font-weight:500}
.mc.down{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:26px}
.mc.up{background:var(--soft)}
.mc.up .ar{font-size:23px}
.mc.found{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.mc.found .ar{font-size:22px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0;direction:rtl;min-height:54px}
.slot{min-height:78px;border:2px dashed var(--line);border-radius:14px;padding:8px;direction:rtl;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.tile{font-family:var(--f-ar);font-size:27px;padding:2px 14px;border-radius:10px;border:1.5px solid var(--accent);background:var(--card);line-height:1.7}
.tile:hover{background:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.1}
.stats span{font-size:13.5px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1.5px solid var(--line);border-radius:14px;padding:10px;text-align:center;opacity:.45;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.badge .bi{font-size:30px}.badge b{display:block;font-size:15px}.badge span{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);
  padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;transition:.3s;z-index:30;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sp{background:none;border:1.5px solid var(--line);border-radius:50%;width:34px;height:34px;font-size:16px;vertical-align:middle}
.result{text-align:center;padding:10px 0}.result .big{font-family:var(--f-display);font-size:56px;font-weight:800;color:var(--accent);line-height:1}
.stars{font-size:34px;letter-spacing:4px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:9px;height:14px;opacity:.9;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){.confetti{display:none}*{transition:none!important}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.sec-h{display:flex;align-items:center;gap:8px}
.sec-h .ar{color:var(--accent);font-size:24px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">İzhârü'l-Esrâr <span class="ar">إِظْهَارُ الْأَسْرَارِ</span></div>
    <span class="pill" id="pStreak" title="Gün serisi">🔥 0</span>
    <span class="pill" id="pXp" title="Puan">⭐ 0</span>
  </div>
  <div class="xpbar"><i id="xpFill" style="width:0"></i></div>
</header>
<div class="wrap"><main id="app"></main></div>
<nav class="bottom"><div class="wrap" id="nav"></div></nav>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================ VERİ ============================ */
const HAL = {r:["merfû'","r"],n:["mansûb","n"],c:["mecrûr","c"],z:["mezcûm","z"],"":["mebnî / hal yok","x"]};
// kelime: [metin, rol, hal, gerekçe]  veya düz string
const W=(w,role,hal,why)=>({w,role,hal:hal||"",why:why||""});
const EX=(tr,...ws)=>({tr,ws:ws.map(x=>typeof x==="string"?{w:x}:x)});

const BABS=[
 {id:1,tr:"Birinci Bâb · Âmiller",ar:"فِي الْعَوَامِلِ"},
 {id:2,tr:"İkinci Bâb · Ma'mûller",ar:"فِي الْمَعْمُولِ"},
 {id:3,tr:"Üçüncü Bâb · İ'râb",ar:"فِي الْإِعْرَابِ"}
];

const LESSONS=[
{id:1,bab:1,icon:"🧱",tr:"Kelime: İsim, Fiil, Harf",ar:"الْكَلِمَةُ",
 goal:"Bir kelimenin isim mi, fiil mi, harf mi olduğunu alâmetlerinden tanıyacaksın. İ'râb bu ayrımın üzerine kurulur.",
 secs:[
  {h:"Üç kısım",p:"Kelime ya <b>isim</b>dir, ya <b>fiil</b>, ya da <b>harf</b>. İsim zamandan bağımsız bir mânâyı tek başına bildirir (<span class='ar'>رَجُلٌ</span>). Fiil bir mânâyı zamanla birlikte bildirir (<span class='ar'>ضَرَبَ</span>). Harf ise tek başına mânâ vermez, ancak başka kelimeyle birlikte mânâ kazanır (<span class='ar'>فِي</span>, <span class='ar'>مِنْ</span>)."},
  {h:"Alâmetler",table:[["","Alâmet","Örnek"],
    ["İsim","Elif-lâm (الـ), tenvin, cer almak, nidâ, kendisine isnâd (haber verme) yapılmak","<span class='ar'>الْكِتَابُ، كِتَابٌ، بِكِتَابٍ</span>"],
    ["Fiil","قَدْ، السِّين، سَوْفَ، sâkin te'nîs tâ'sı, fâil zamirinin bitişmesi","<span class='ar'>قَدْ كَتَبَ، كَتَبَتْ، كَتَبْتُ</span>"],
    ["Harf","Hiçbir isim ve fiil alâmetini kabul etmez","<span class='ar'>هَلْ، لَمْ، إِنَّ، عَلَى</span>"]]},
  {h:"Fiilin üç hâli",p:"Mâzî (<span class='ar'>كَتَبَ</span>), muzâri' (<span class='ar'>يَكْتُبُ</span>) ve emir (<span class='ar'>اُكْتُبْ</span>). İ'râb açısından önemli olan şu: mâzî ve emir <b>mebnîdir</b> (sonu sabit), muzâri' ise genellikle <b>mu'rebtir</b> (sonu değişir)."}],
 ex:[EX("Öğrenci kitapta yazıyor.",W("الطَّالِبُ","İsim","","Elif-lâm aldığı için isim."),W("يَكْتُبُ","Fiil (muzâri')","","Başında muzâri' harfi olan fiil."),W("فِي","Harf","","Tek başına mânâsı yok; cer harfi."),W("الْكِتَابِ","İsim","","Elif-lâm ve cer alâmeti.")),
     EX("Gerçekten ilim faydalıdır.",W("إِنَّ","Harf","","Nasb edici harf; isim ve fiil alâmeti yok."),W("الْعِلْمَ","İsim","n","İnne'nin ismi."),W("نَافِعٌ","İsim","r","Tenvin aldı; inne'nin haberi.")) ],
 mini:[
  ["<span class='ar'>قَدْ</span> kelimesinin türü nedir?",["İsim","Fiil","Harf"],2,"Fiilin başına gelir ama kendisi harftir; tek başına mânâsı yoktur."],
  ["Hangisi isim alâmeti <b>değildir</b>?",["Tenvin","Cer almak","Sin ve sevf ile başlamak"],2,"Sin ve sevf fiilin (muzâri') alâmetidir."],
  ["<span class='ar'>ضَرَبَتْ</span> kelimesini fiil yapan alâmet?",["Elif-lâm","Sâkin te'nîs tâ'sı","Tenvin"],1,"Sâkin tâ (ـتْ) yalnızca mâzî fiile gelir."]]},

{id:2,bab:1,icon:"⚙️",tr:"Âmil, Ma'mûl ve İ'râb",ar:"الْعَامِلُ وَالْمَعْمُولُ",
 goal:"Âmil, ma'mûl ve i'râb kavramlarını ve dört i'râb hâlini (ref', nasb, cer, cezm) ayırt edeceksin.",
 secs:[
  {h:"Temel fikir",p:"Arapçada bir kelimenin sonundaki hareke, başka bir kelimenin etkisiyle belirlenir. Etkileyene <b>âmil</b> (<span class='ar'>الْعَامِلُ</span>), etkilenene <b>ma'mûl</b> (<span class='ar'>الْمَعْمُولُ</span>), bu etkiyle sondaki değişikliğe <b>i'râb</b> denir."},
  {h:"Dört hâl",table:[["Hâl","Asıl alâmet","Hangi kelimede?"],
    ["Ref' (رَفْع)","Damme","İsim ve muzâri' fiil"],
    ["Nasb (نَصْب)","Fetha","İsim ve muzâri' fiil"],
    ["Cer (جَرّ)","Kesre","Yalnız isim"],
    ["Cezm (جَزْم)","Sükûn","Yalnız muzâri' fiil"]]},
  {h:"Lafzî ve ma'nevî âmil",p:"Lafzî âmil telaffuzda görünen kelimedir: fiil, harf, isim (<span class='ar'>ضَرَبَ</span>, <span class='ar'>مِنْ</span>, <span class='ar'>غُلَامُ</span>). Ma'nevî âmil ise söylenmeyen bir etkidir: örneğin mübtedâ'nın merfû' olması <b>ibtidâ</b> ile, muzâri'nin merfû' olması ise başında nasb ve cezm edicisi olmamasıyladır."},
  {callout:"Ezber ipucu: <b>İsim</b> cer alır ama cezm almaz. <b>Fiil</b> cezm alır ama cer almaz. Ref' ve nasb ikisinde de ortaktır."}],
 ex:[EX("Zeyd geldi.",W("جَاءَ","Âmil (fiil)","","Fâili ref' eder."),W("زَيْدٌ","Fâil / ma'mûl","r","Fiilin etkisiyle merfû'.")),
     EX("Zeyd'in evi.",W("بَيْتُ","Muzâf","r","Cümlede mübtedâ/fâil olabilir; hâlini cümle belirler."),W("زَيْدٍ","Muzâf ileyh","c","Muzâf, kendinden sonrakini cereder."))],
 mini:[
  ["Aşağıdakilerden hangisi <b>yalnız fiile</b> özgü i'râb hâlidir?",["Cer","Cezm","Nasb"],1,"Cezm yalnız muzâri' fiile, cer yalnız isme özgüdür."],
  ["İsmin sonunu değiştiren etkiye ne denir?",["Ma'mûl","Âmil","İ'râb"],1,"Etkileyen = âmil; etkilenen = ma'mûl."],
  ["Nasbın asıl alâmeti?",["Damme","Fetha","Kesre"],1,"Ref' damme, nasb fetha, cer kesre, cezm sükûn."]]},

{id:3,bab:1,icon:"🏷️",tr:"İ'râb Alâmetleri",ar:"عَلَامَاتُ الْإِعْرَابِ",
 goal:"Asıl hareke alâmetlerini ve yerine geçen (nâib) alâmetleri (vâv, elif, yâ, nûn…) tanıyacaksın.",
 secs:[

/* ---- Genel quiz motoru ---- */
function runQuiz(box,cfg){
  let i=0,ok=0,locked=false,end=0,tm=null,wrong=0;
  const items=cfg.items,timed=cfg.timed;
  const finish=()=>{clearInterval(tm);cfg.done(ok,items.length,wrong)};
  function q(){
    if(i>=items.length||(timed&&Date.now()>=end))return finish();
    const it=items[i];locked=false;
    box.innerHTML=`${timed?`<div class="prog timer"><i id="tbar" style="width:100%"></i></div>`:`<div class="prog"><i style="width:${i/items.length*100}%"></i></div>`}
      <div class="row small muted"><span>Soru ${i+1}/${items.length}</span><span style="flex:1"></span><span>✔ ${ok}</span></div>
      ${it.sentence?`<div class="sent">${it.sentence}</div>`:""}
      <div class="qprompt">${it.q}</div>
      ${it.opts.map((o,k)=>`<button class="opt" data-k="${k}">${it.arOpts?`<span class="ar">${o}</span>`:o}</button>`).join("")}<div id="fb"></div>`;
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickAns(+b.dataset.k));
  }
  function pickAns(k){
    if(locked)return;locked=true;const it=items[i];const good=k===it.a;
    if(good)ok++;else wrong++;
    box.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===it.a)b.classList.add("ok");else if(j===k)b.classList.add("no")});
    if(!good)box.querySelector(".opt.no")?.classList.add("shake");
    const fb=box.querySelector("#fb");
    fb.innerHTML=`<div class="feedback ${good?"ok":"no"}"><b>${good?"Doğru! ":"Yanlış. "}</b><span>${it.why||""}</span></div>${timed?"":`<button class="btn" id="nx">${i+1>=items.length?"Bitir":"Devam"} →</button>`}`;
    if(timed)setTimeout(()=>{i++;q()},good?450:1200);else box.querySelector("#nx").onclick=()=>{i++;q()};
  }
  if(timed){end=Date.now()+timed*1000;tm=setInterval(()=>{const r=end-Date.now();const b=box.querySelector("#tbar");if(b)b.style.width=Math.max(0,r/(timed*10))+"%";if(r<=0&&!locked){finish()}},120)}
  q();
}

const ROLEPOOL=[...new Set(DET2.map(d=>d[2]))];

function detItems(n){return pick(DET2,n).map(d=>{const opts=shuffle([d[2],...pick(ROLEPOOL.filter(r=>r!==d[2]),3)]);
  return {sentence:hl(d[0],d[1]),q:`<span class="ar" style="font-size:24px">${d[1]}</span> kelimesinin görevi?`,opts,a:opts.indexOf(d[2]),why:d[3]}})}

}
function gMem(box){
  const ps=pick(PAIRS,6);let cards=shuffle(ps.flatMap((p,i)=>[{id:i,t:p[0],ar:true},{id:i,t:p[1],ar:false}]).map((c,k)=>({...c,k})));
  let open=[],moves=0,found=0,lock=false;
  function draw(){
    box.innerHTML=`<p class="muted small">Âmili görevi ile eşleştir. Hamle: <b>${moves}</b></p><div class="mgrid">${cards.map(c=>`<button class="mc ${c.found?"found":c.up?"up":"down"}" data-k="${c.k}">${c.found||c.up?(c.ar?`<span class="ar">${c.t}</span>`:c.t):"?"}</button>`).join("")}</div>`;
    box.querySelectorAll(".mc").forEach(b=>b.onclick=()=>flip(+b.dataset.k));
  }
  function flip(k){
    const c=cards.find(x=>x.k===k);if(lock||c.up||c.found)return;c.up=true;open.push(c);draw();
    if(open.length===2){moves++;lock=true;
      if(open[0].id===open[1].id){open.forEach(x=>x.found=true);found++;open=[];lock=false;draw();if(found===ps.length){const g=Math.max(10,40-moves*2);S.best.mem=Math.min(S.best.mem??99,moves);addXp(g);confetti();endCard(box,moves,"hamlede bitirdin",g,"memory")}}
      else setTimeout(()=>{open.forEach(x=>x.up=false);open=[];lock=false;draw()},900);}
  }
  draw();
}
function gBuild(box){
  const its=pick(SENT,5);let i=0,ok=0;
  function q(){
    if(i>=its.length){const g=ok*10;S.best.cum=Math.max(S.best.cum||0,ok);addXp(g);return endCard(box,`${ok}/${its.length}`,"cümle doğru kuruldu",g,"build")}
    const [ar,tr]=its[i];const words=ar.split(" ");let chosen=[],bank=shuffle(words.map((w,k)=>({w,k})));
    const d=()=>{
      box.innerHTML=`<div class="prog"><i style="width:${i/its.length*100}%"></i></div><p class="qprompt">🇹🇷 ${tr}</p>
      <div class="slot" id="slot">${chosen.map(c=>`<button class="tile" data-u="${c.k}">${c.w}</button>`).join("")}</div>
      <div class="bank">${bank.map(c=>`<button class="tile" data-p="${c.k}">${c.w}</button>`).join("")}</div>
      <div id="fb"></div><div class="row"><button class="btn ghost sm" id="rs">↺ Sıfırla</button><button class="btn sm" id="ck" ${bank.length?"disabled":""}>Kontrol et</button></div>`;
      box.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const c=bank.find(x=>x.k==b.dataset.p);bank=bank.filter(x=>x!==c);chosen.push(c);d()});
      box.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const c=chosen.find(x=>x.k==b.dataset.u);chosen=chosen.filter(x=>x!==c);bank.push(c);d()});
      box.querySelector("#rs").onclick=()=>{bank=shuffle(words.map((w,k)=>({w,k})));chosen=[];d()};
      box.querySelector("#ck").onclick=()=>{const good=chosen.map(c=>c.w).join(" ")===ar;if(good)ok++;
        box.querySelector("#fb").innerHTML=`<div class="feedback ${good?"ok":"no"}"><b>${good?"Doğru!":"Olmadı."}</b> <span class="ar" style="font-size:24px">${ar}</span></div><button class="btn" id="nx">Devam →</button>`;
        box.querySelector("#ck").disabled=true;box.querySelector("#rs").disabled=true;box.querySelectorAll(".tile").forEach(t=>t.disabled=true);box.querySelector("#nx").onclick=()=>{i++;q()}};
    };d();
  }
  q();
}

/* ---- Kartlar (Leitner) ---- */
const INTERVAL=[0,1,3,7,14];
function dueCards(){const t=today();return CARDS.map((c,i)=>({i,c,st:S.cards[i]||{b:0,d:t}})).filter(x=>x.st.d<=t)}
let fc=null;
function vKart(){
  const due=dueCards();const mastered=Object.values(S.cards).filter(s=>s.b>=4).length;
  return `<h1>Kavram Kartları</h1><p class="muted">Aralıklı tekrar: bildiğin kart gittikçe seyrek, bilmediğin kart sık gelir.</p>
  <div class="card stats"><div><b>${CARDS.length}</b><span>toplam</span></div><div><b>${due.length}</b><span>bugün sırada</span></div><div><b>${mastered}</b><span>öğrenildi</span></div></div>
  <div id="fcbox">${fcHtml()}</div>`;
}
function fcHtml(){
  const due=dueCards();
  if(!due.length)return `<div class="card result"><div class="big">🎉</div><p>Bugünkü kartlar tamam! Yarın yeniden gel.</p></div>`;
  if(!fc||!due.find(x=>x.i===fc.i))fc={i:due[(Math.random()*due.length)|0].i,flip:false};
  const c=CARDS[fc.i];
  return `<div class="flash"><div class="face ${fc.flip?"back-face":""}" data-act="flip" role="button" tabindex="0">${fc.flip?`<div><p>${c[1]}</p><p class="ar" style="font-size:30px;color:var(--accent)">${c[0]}</p></div>`:`<div><div class="ar">${c[0]}</div><p class="muted small">Dokun, anlamını gör</p><div>${spBtn(c[0])}</div></div>`}</div></div>
  ${fc.flip?`<div class="row" style="justify-content:center"><button class="btn ghost" data-act="card" data-v="0">Tekrar ↻</button><button class="btn" data-act="card" data-v="1">Bildim ✓</button></div>`:""}
  <p class="muted small" style="text-align:center">Sırada ${due.length} kart</p>`;
}

/* ---- Sınav ---- */
function vSinav(){
  const ready=doneCount();
  return `<h1>Genel Sınav</h1><p class="muted">20 soruluk karma sınav: kavramlar + i'râb dedektifi + alâmetler.</p>
  <div class="card"><div class="stats"><div><b>${S.exam||"–"}</b><span>en yüksek puan</span></div><div><b>${ready}/11</b><span>ders</span></div><div><b>${level()}</b><span>seviye</span></div></div>
  <p class="small muted">Hedef: 90 ve üzeri puan alıp “Sınav Şampiyonu” rozetini aç.</p><button class="btn" data-act="exam">Sınava başla</button></div>`;
}
function exam(){
  tab="sinav";view=()=>gameShell("📝 Genel Sınav");render();
  const box=$("#gbox");
  const a=pick(QB,10).map(q=>{const o=q[1].slice();const c=o[q[2]];const s=shuffle(o);return {q:q[0],opts:s,a:s.indexOf(c),why:q[3]}});
  const b=detItems(5);
  const c=pick(ALAMIT,5).map(alamItem);
  runQuiz(box,{items:shuffle([...a,...b,...c]),done:(ok,t)=>{
    const sc=Math.round(ok/t*100);S.exam=Math.max(S.exam||0,sc);const g=Math.round(sc/2);addXp(g);if(sc>=90)confetti();
    const st=sc>=90?3:sc>=70?2:sc>=50?1:0;
    box.innerHTML=`<div class="result"><div class="stars">${"★".repeat(st)}${"☆".repeat(3-st)}</div><div class="big">${sc}</div><p>${ok}/${t} doğru · +${g} ⭐</p>
    <p class="muted">${sc>=90?"Mâşâallah! Hatimlik performans.":sc>=70?"Çok iyi! Biraz daha tekrarla zirveye çık.":"Dersleri ve kartları tekrar edip yeniden dene."}</p>
    <div class="row" style="justify-content:center"><button class="btn ghost" data-act="home">Geri</button><button class="btn" data-act="exam">Yeniden</button></div></div>`}});
}

/* ---- Ben ---- */
function vBen(){
  return `<h1>Ben</h1>
  <div class="card stats"><div><b>${S.xp}</b><span>puan</span></div><div><b>${level()}</b><span>seviye</span></div><div><b>${S.streak}</b><span>gün serisi</span></div></div>
  <h2>Rozetler</h2><div class="badges">${BADGES.map(b=>`<div class="badge ${S.badges[b[1]]?"on":""}"><div class="bi">${b[0]}</div><b>${b[1]}</b><span>${b[2]}</span></div>`).join("")}</div>
  <h2 style="margin-top:22px">Müellif</h2>
  <div class="card"><p><b>Birgivî Mehmed Efendi</b> (929–981 h. / 1523–1573) Balıkesir'de doğdu; Hanefî âlim, nahivci ve vâizdir. <i>İzhârü'l-Esrâr</i>, nahiv ilmini âmil ve ma'mûl esasına göre ele alan kısa ve çok okunan bir metindir; kitap üç bâbdan oluşur: âmiller, ma'mûller ve i'râb.</p></div>
  <h2>Ayarlar</h2>
  <div class="card row"><button class="btn ghost sm" data-act="theme">🌓 Tema değiştir</button><button class="btn ghost sm" data-act="reset">Sıfırla</button></div>`;
}

/* ============================ OLAYLAR ============================ */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
  if(a==="tab"){tab=t.dataset.k;view=null;render()}
  else if(a==="home"){view=null;render()}
  else if(a==="lesson"){const id=+t.dataset.id;tab="yol";view=()=>vLesson(id);render()}
  else if(a==="retry-mini"){const id=+t.dataset.id;tab="yol";view=()=>vLesson(id);render()}
  else if(a==="word"){
    const L=LESSONS.find(l=>l.id==t.dataset.l),w=L.ex[+t.dataset.e].ws[+t.dataset.w];
    const rv=$(`#rv-${t.dataset.l}-${t.dataset.e}`);
    t.parentElement.querySelectorAll(".w").forEach(x=>x.classList.remove("sel"));t.classList.add("sel");
    rv.classList.remove("muted");
    rv.innerHTML=`<b>${w.role}</b>${w.hal?` · <span class="w ${HAL[w.hal][1]}" style="font-size:16px;font-family:var(--f-body);padding:0 8px">${HAL[w.hal][0]}</span>`:""}<br>${w.why||""}`;
  }
  else if(a==="speak"){speak(t.dataset.t)}
  else if(a==="play"){play(t.dataset.g)}
  else if(a==="exam"){exam()}
  else if(a==="flip"){fc.flip=true;$("#fcbox").innerHTML=fcHtml()}
  else if(a==="card"){
    const i=fc.i,st=S.cards[i]||{b:0,d:today()};
    if(t.dataset.v==="1"){st.b=Math.min(4,st.b+1);addXp(2)}else st.b=0;
    st.d=new Date(Date.now()+INTERVAL[st.b]*864e5).toISOString().slice(0,10);
    if(t.dataset.v==="0")st.d=today();
    S.cards[i]=st;save();
    const prev=i;fc=null;const due=dueCards().filter(x=>x.i!==prev);
    if(due.length)fc={i:due[(Math.random()*due.length)|0].i,flip:false};
    const y=scrollY;render();scrollTo(0,y);
  }
  else if(a==="theme"){const d=document.documentElement;const dark=getComputedStyle(d).colorScheme==="dark";S.theme=dark?"light":"dark";d.dataset.theme=S.theme;save()}
  else if(a==="reset"){if(confirm("Tüm ilerleme silinsin mi?")){localStorage.removeItem(KEY);location.reload()}}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches('[role="button"]')){e.preventDefault();e.target.click()}});

/* ============================ BAŞLAT ============================ */
if(S.theme)document.documentElement.dataset.theme=S.theme;
touchStreak();render();
</script>
