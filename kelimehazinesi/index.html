<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kelime Hazinesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Amiri:wght@400;700&display=swap">
<style>

/* Düzen: her ders aynı sırayla akar: hedefler, örnekler, görsel, kaide, alıştırmalar. Hal renkleri (merfû, mansûb, mecrûr) ve tür renkleri her yerde aynıdır. */
:root {
  --paper: #F4F6F2;
  --card: #FFFFFF;
  --ink: #1B2420;
  --muted: #5E6A63;
  --line: #D9E0DA;
  --soft: #EAEFEA;
  --accent: #1E5B4F;
  --ref: #B3402F;
  --nasb: #A86A0E;
  --cerr: #2D5FA8;
  --muf: #6B6152;
  --mus: #0F8A7A;
  --mzs: #5A4FB0;
  --mns: #B23A75;
  --tks: #1E7A46;
  --mz: #1E7A46;
  --mi: #8A3F9E;
  --mv: #1D6E8C;
  --sf: #B0532A;
  --muz: #2F67B0;
  --mun: #B23A75;
  --y: #1E5B4F;
  --x: #7E8A84;
  --good: #1F7A3E;
  --bad: #B3261E;
  --good-bg: #E2F2E6;
  --bad-bg: #FBE7E4;
  --role: var(--accent);
  --f-display: "Alegreya", Georgia, "Times New Roman", serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-ar: "Amiri", "Scheherazade New", "Traditional Arabic", "Noto Naskh Arabic", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111614; --card: #19201D; --ink: #E6ECE8; --muted: #9FACA5; --line: #2C3632; --soft: #202925;
    --accent: #6CC3AE; --ref: #F28B78; --nasb: #EDB45C; --cerr: #8DB4F5; --muf: #CDBB95; --mus: #5ED1C2; --mzs: #ABA3F5; --mns: #F28DC0; --tks: #6FD69A; --mz: #6FD69A; --mi: #D49BEA; --mv: #6CC7E6; --sf: #F2A07A; --muz: #93B8F2; --mun: #F28DC0; --y: #6CC3AE; --x: #98A39D;
    --good: #6FD08E; --bad: #FF8A80; --good-bg: #17301F; --bad-bg: #3A1D1A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111614; --card: #19201D; --ink: #E6ECE8; --muted: #9FACA5; --line: #2C3632; --soft: #202925;
  --accent: #6CC3AE; --ref: #F28B78; --nasb: #EDB45C; --cerr: #8DB4F5; --muf: #CDBB95; --mus: #5ED1C2; --mzs: #ABA3F5; --mns: #F28DC0; --tks: #6FD69A; --mz: #6FD69A; --mi: #D49BEA; --mv: #6CC7E6; --sf: #F2A07A; --muz: #93B8F2; --mun: #F28DC0; --y: #6CC3AE; --x: #98A39D;
  --good: #6FD08E; --bad: #FF8A80; --good-bg: #17301F; --bad-bg: #3A1D1A; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; }
.wrap { max-width: 1060px; margin: 0 auto; padding-inline: 16px; padding-block: 0 72px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h2 { font-size: 1.65rem; }
h3 { font-size: 1.2rem; }
p { margin: 0; }
.ar { font-family: var(--f-ar); direction: rtl; unicode-bidi: isolate; line-height: 1.9; }
.muted { color: var(--muted); }
.lbl { font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.tabular { font-variant-numeric: tabular-nums; }
.r-ref { --role: var(--ref); color: var(--ref); } .r-nasb { --role: var(--nasb); color: var(--nasb); } .r-cerr { --role: var(--cerr); color: var(--cerr); } .r-muf { --role: var(--muf); color: var(--muf); } .r-mus { --role: var(--mus); color: var(--mus); } .r-mzs { --role: var(--mzs); color: var(--mzs); } .r-mns { --role: var(--mns); color: var(--mns); } .r-tks { --role: var(--tks); color: var(--tks); } .r-mz { --role: var(--mz); color: var(--mz); } .r-mi { --role: var(--mi); color: var(--mi); } .r-good { --role: var(--good); color: var(--good); } .r-bad { --role: var(--bad); color: var(--bad); } .r-mv { --role: var(--mv); color: var(--mv); } .r-sf { --role: var(--sf); color: var(--sf); } .r-muz { --role: var(--muz); color: var(--muz); } .r-mun { --role: var(--mun); color: var(--mun); } .r-y { --role: var(--y); color: var(--y); }
.r-x { --role: var(--x); color: var(--x); }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* üst */
header.top { padding-block: 26px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: end; }
header.top h1 { font-size: clamp(2rem, 5.4vw, 3.2rem); font-weight: 800; letter-spacing: -.01em; }
header.top .h1ar { font-family: var(--f-ar); font-size: clamp(1.5rem, 4vw, 2.1rem); color: var(--accent); direction: rtl; line-height: 1.5; }
header.top p { color: var(--muted); max-width: 62ch; margin-top: 6px; }
.xpbox { display: grid; gap: 4px; min-width: 210px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.xpbox .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: .9rem; }
.xpbox b.rank { font-family: var(--f-display); font-size: 1.1rem; }
.xpbar { height: 6px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.xpbar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--ref), var(--nasb), var(--cerr), var(--mus), var(--mzs), var(--mns), var(--tks)); transition: width .5s ease; }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-block: 8px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: none; font-weight: 700; font-size: .96rem; color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
nav.tabs button .num { font-family: var(--f-display); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--ink); font-size: .85rem; }
nav.tabs button .pc { font-size: .72rem; color: var(--muted); font-weight: 500; }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
nav.tabs button[aria-selected="true"] .num { background: var(--paper); color: var(--ink); }
nav.tabs button[aria-selected="true"] .pc { color: var(--paper); opacity: .8; }

section.panel { display: grid; gap: 22px; padding-top: 24px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; }
.stack { display: grid; gap: 12px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.btn { font-weight: 700; border: 1.5px solid var(--accent); color: var(--accent); background: transparent; padding: 7px 15px; border-radius: 10px; cursor: pointer; }
.btn.solid { background: var(--accent); color: var(--card); }
.btn.small { padding: 4px 10px; font-size: .88rem; }
.btn:hover { filter: brightness(1.08); }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* cümle parçaları */
.sent { display: flex; flex-wrap: wrap; gap: 6px; direction: rtl; align-items: flex-end; }
.chunk { display: inline-grid; justify-items: center; gap: 0; }
.chunk .w { font-family: var(--f-ar); font-size: 1.7rem; line-height: 1.6; padding: 0 10px; border-radius: 10px; background: color-mix(in srgb, var(--role) 13%, transparent); color: var(--ink); border-bottom: 3px solid var(--role); }
.chunk .t { font-size: .68rem; font-weight: 700; color: var(--role); letter-spacing: .04em; text-transform: uppercase; direction: ltr; }
.chunk.r-x .w { background: transparent; border-bottom-color: transparent; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 12px; height: 12px; border-radius: 3px; background: var(--role); display: inline-block; }
.trline { font-size: .92rem; color: var(--muted); }
.ex-list { display: grid; gap: 14px; }
.ex-item { display: grid; gap: 2px; padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
.ex-item:last-child { border-bottom: 0; padding-bottom: 0; }
.pairgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px 18px; }

/* ders başlığı */
.unit-hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; border-top: 5px solid var(--role); }
.unit-no { font-family: var(--f-display); font-weight: 800; font-size: 3.4rem; color: var(--role); line-height: 1; }
.unit-hero .ar.big { font-size: clamp(1.9rem, 5vw, 2.6rem); line-height: 1.5; }
.goals { margin: 0; padding-inline-start: 20px; display: grid; gap: 2px; }
.prog { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.prog div { height: 100%; background: var(--role); width: 0; transition: width .4s; }

/* kaide */
.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: k; }
.rules li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
.rules li::before { counter-increment: k; content: counter(k); font-family: var(--f-display); font-weight: 800; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--paper); }
.rules .exs { display: flex; flex-wrap: wrap; gap: 4px 16px; direction: rtl; font-family: var(--f-ar); font-size: 1.35rem; color: var(--accent); }
details.kaide { border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; }
details.kaide summary { cursor: pointer; font-weight: 700; }
details.kaide .ar { font-size: 1.3rem; }

/* görseller */
.viz { display: grid; gap: 10px; justify-items: center; }
.viz svg { width: 100%; max-width: 640px; height: auto; display: block; }
.viz .cap { font-size: .9rem; color: var(--muted); text-align: center; max-width: 60ch; }
svg .s-ref { fill: var(--ref); } svg .s-nasb { fill: var(--nasb); } svg .s-cerr { fill: var(--cerr); } svg .s-muf { fill: var(--muf); } svg .s-mus { fill: var(--mus); } svg .s-mzs { fill: var(--mzs); } svg .s-mns { fill: var(--mns); } svg .s-tks { fill: var(--tks); }
svg .s-ink { fill: var(--ink); } svg .s-muted { fill: var(--muted); } svg .s-card { fill: var(--card); } svg .s-soft { fill: var(--soft); } svg .s-good { fill: var(--good); } svg .s-bad { fill: var(--bad); }
svg .k-ink { stroke: var(--ink); } svg .k-muted { stroke: var(--muted); } svg .k-fiil { stroke: var(--fiil); } svg .k-line { stroke: var(--line); } svg .k-good { stroke: var(--good); } svg .k-bad { stroke: var(--bad); }
svg text { font-family: var(--f-body); }
svg text.a { font-family: var(--f-ar); }
.svg-scroll { overflow-x: auto; width: 100%; }

/* harita (giriş) */
.tree { display: grid; gap: 18px; justify-items: center; }
.node { border-radius: 14px; padding: 10px 16px; text-align: center; background: var(--card); border: 2px solid var(--role); display: grid; gap: 0; }
.node .ar { font-size: 1.5rem; line-height: 1.6; color: var(--role); }
.node small { color: var(--muted); font-size: .8rem; }
.node.root { --role: var(--accent); }
.tree-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; width: 100%; max-width: 760px; }
.branch { display: grid; gap: 12px; justify-items: center; padding: 14px; border-radius: 16px; background: var(--soft); position: relative; }
.branch .kids { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; direction: rtl; }
.branch .kids .node { padding: 6px 12px; }
.branch .kids .node .ar { font-size: 1.2rem; }
.branch .sample { font-family: var(--f-ar); font-size: 1.3rem; direction: rtl; }
.branch button { margin-top: 2px; }
.map-units { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.map-units .card { display: grid; gap: 6px; align-content: start; border-top: 5px solid var(--role); }
.map-units .card .ar { font-size: 1.5rem; color: var(--role); }

/* alıştırmalar */
.exer { display: grid; gap: 14px; }
.exer-head { display: grid; gap: 4px; }
.exer-head .ar { font-size: 1.35rem; color: var(--accent); }
.exer-head .cnt { font-size: .85rem; color: var(--muted); }
.exbox { background: var(--soft); border-radius: 10px; padding: 8px 12px; font-size: .95rem; }
.exbox .ar { font-size: 1.25rem; }
.items { display: grid; gap: 12px; }
.item { display: grid; gap: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.item.ok { border-color: var(--good); }
.item.no { border-color: var(--bad); }
.item .qn { font-family: var(--f-display); font-weight: 800; color: var(--muted); font-size: .95rem; }
.item .q { font-family: var(--f-ar); font-size: 1.55rem; direction: rtl; line-height: 1.8; }
.item .q u { text-decoration: none; border-bottom: 2px dashed var(--accent); padding-inline: 18px; }
.item .q u.filled { padding-inline: 2px; border-bottom-style: solid; color: var(--accent); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; direction: rtl; }
.opt { font-family: var(--f-ar); font-size: 1.35rem; line-height: 1.6; padding: 4px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; text-align: right; }
.opt.lat { font-family: var(--f-body); font-size: 1rem; font-weight: 700; padding: 8px 16px; }
.opt.block { flex: 1 1 100%; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt.sel-ok { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.opt.sel-no { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.opt[disabled] { cursor: default; }
.fb { font-size: .95rem; }
.fb .ok { color: var(--good); font-weight: 700; } .fb .no { color: var(--bad); font-weight: 700; }
.fb .ar { font-size: 1.2rem; }
.tile-line { min-height: 58px; border: 2px dashed var(--line); border-radius: 12px; padding: 6px; display: flex; flex-wrap: wrap; gap: 6px; direction: rtl; align-items: center; }
.tile-line.okk { border-style: solid; border-color: var(--good); background: var(--good-bg); }
.tile-line.nok { border-style: solid; border-color: var(--bad); background: var(--bad-bg); }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; direction: rtl; }
.tile { font-family: var(--f-ar); font-size: 1.4rem; line-height: 1.5; padding: 2px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; box-shadow: 0 2px 0 var(--line); }
.tile:hover:not([disabled]) { border-color: var(--accent); }
.tile[disabled] { opacity: .25; cursor: default; box-shadow: none; }
.tile.inl { background: var(--soft); }
.tagbtn { display: inline-grid; justify-items: center; cursor: pointer; border: 0; background: transparent; padding: 0; }
.tagbtn .w { font-family: var(--f-ar); font-size: 1.55rem; line-height: 1.6; padding: 0 10px; border-radius: 10px; border: 1.5px dashed var(--line); }
.tagbtn .t { font-size: .68rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); min-height: 1.1em; }
.tagbtn.has .w { border-style: solid; border-color: var(--role); background: color-mix(in srgb, var(--role) 13%, transparent); }
.tagbtn.has .t { color: var(--role); }
.tagbtn.wrong .w { outline: 2px solid var(--bad); outline-offset: 2px; }
.slot { font-family: var(--f-ar); font-size: 1.5rem; line-height: 1.6; padding: 0 12px; border-radius: 10px; border: 1.5px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); cursor: pointer; min-width: 64px; }
.slot.empty { color: var(--muted); border-style: dashed; }
.slot.wrong { border-color: var(--bad); background: var(--bad-bg); }
.slot.right { border-color: var(--good); background: var(--good-bg); }
.combo-line { display: flex; flex-wrap: wrap; gap: 8px; direction: rtl; align-items: center; font-family: var(--f-ar); font-size: 1.5rem; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; direction: rtl; padding: 10px; border-radius: 12px; background: var(--soft); }
.bank .tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--card); }
.cls-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.passage { font-family: var(--f-ar); font-size: 1.45rem; line-height: 2.1; direction: rtl; text-align: justify; }
.passage-tr { font-size: .98rem; color: var(--muted); }
.qa { display: grid; gap: 6px; padding: 10px 12px; border-radius: 10px; background: var(--soft); }
.qa .ar { font-size: 1.35rem; }

/* oyunlar */
.game-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
.game-card { display: grid; gap: 8px; align-content: start; border-top: 5px solid var(--role); }
.game-card .ico { font-family: var(--f-ar); font-size: 1.9rem; color: var(--role); direction: rtl; line-height: 1.4; }
.hud { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline; font-variant-numeric: tabular-nums; }
.hud b { font-family: var(--f-display); font-size: 1.45rem; color: var(--accent); }
.time-bar { height: 10px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.time-bar div { height: 100%; background: var(--accent); transition: width 1s linear; }
.time-bar.low div { background: var(--bad); }
.target { font-family: var(--f-ar); font-size: clamp(1.7rem, 6vw, 2.5rem); text-align: center; line-height: 1.8; padding: 12px; border-radius: 16px; background: var(--soft); direction: rtl; }
.target.flash-ok { background: var(--good-bg); }
.target.flash-no { background: var(--bad-bg); animation: shake .35s; }
.q-end { display: inline-block; min-width: 34px; border: 2px dashed var(--accent); border-radius: 8px; color: var(--accent); font-family: var(--f-body); font-size: 1rem; vertical-align: middle; line-height: 1.6; text-align: center; }
.big2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.big2 button, .big3 button { border: 0; border-radius: 14px; padding: 14px 6px; font-weight: 800; font-family: var(--f-display); font-size: 1.15rem; color: var(--card); background: var(--role); cursor: pointer; display: grid; gap: 2px; justify-items: center; }
.big2 button .ar, .big3 button .ar { font-weight: 400; font-size: 1.4rem; line-height: 1.3; }
.big2 button small { font-family: var(--f-body); font-weight: 500; font-size: .75rem; opacity: .85; }
.big3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.big3 button { --role: var(--accent); font-family: var(--f-ar); font-size: 1.8rem; font-weight: 400; }
.gfb { min-height: 3em; text-align: center; }
.gfb .ar { font-size: 1.3rem; }
.score-big { font-family: var(--f-display); font-size: 3rem; font-weight: 800; color: var(--accent); }
.stars { font-size: 2.1rem; letter-spacing: .15em; color: var(--muf); }
.stars .off { color: var(--line); }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
@keyframes pop { 0% { transform: scale(.92); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
.pop { animation: pop .3s; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 12px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
canvas.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
@media (max-width: 720px) {
  header.top { grid-template-columns: 1fr; }
  .unit-hero { grid-template-columns: 1fr; }
  .tree-row { grid-template-columns: 1fr; }
  .chunk .w { font-size: 1.45rem; }
  .item .q { font-size: 1.35rem; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Kelime Hazinesi: aile kartı, Leitner kutuları, kelime listeleri, kalıplar, oyunlar */
.center { text-align: center; justify-items: center; }
.row-btns.center { justify-content: center; }
.small { font-size: .85rem; }
.empty { color: var(--muted); padding: 14px; border: 1.5px dashed var(--line); border-radius: 12px; text-align: center; }
.kbd { font-size: .7rem; font-weight: 700; border: 1px solid currentColor; border-radius: 5px; padding: 0 5px; margin-inline-start: 6px; opacity: .7; }
.btn.big { padding: 11px 22px; font-size: 1.08rem; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
b.hl, .hl { color: var(--accent); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; }

/* özet sayıları */

.sumrow > div { background: var(--soft); border-radius: 12px; padding: 10px; display: grid; justify-items: center; gap: 2px; }
.sumrow b { font-family: var(--f-display); font-size: 1.9rem; color: var(--accent); line-height: 1; }
.sumrow span { font-size: .85rem; color: var(--muted); text-align: center; }
.hero { border-top: 5px solid var(--accent); }
.hero-l { display: grid; gap: 14px; }
.prog-line { display: grid; gap: 6px; font-size: .92rem; color: var(--muted); }
.prog-line .xpbar { height: 8px; }

/* Leitner kutuları */
.leitner { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; align-items: end; }
.lbox { display: grid; justify-items: center; gap: 2px; text-align: center; }
.lbar { width: 100%; height: 90px; border-radius: 10px; background: var(--soft); display: flex; align-items: flex-end; overflow: hidden; border: 1px solid var(--line); }
.lbar i { display: block; width: 100%; background: var(--role, var(--accent)); border-radius: 8px 8px 0 0; transition: height .4s; }
.lbox b { font-family: var(--f-display); font-size: 1.3rem; }
.lbox span { font-weight: 700; font-size: .85rem; }
.lbox small { font-size: .72rem; line-height: 1.2; }
.lbox.b0 { --role: var(--x); } .lbox.b1 { --role: var(--ref); } .lbox.b2 { --role: var(--nasb); } .lbox.b3 { --role: var(--cerr); } .lbox.b4 { --role: var(--mus); } .lbox.b5 { --role: var(--tks); }

/* ayarlar ve çalışma alanı */
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--soft); padding: 4px; border-radius: 12px; width: fit-content; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 9px; font-weight: 700; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 6px; border-bottom: 1px solid var(--line); }
details > summary { cursor: pointer; font-weight: 700; color: var(--accent); padding-block: 4px; }
.lgroups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-block: 10px; }
.lchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.lchip { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 11px; font-size: .85rem; cursor: pointer; color: var(--muted); }
.lchip.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--card)); font-weight: 700; }

/* aile kartı */
.fam { display: grid; gap: 12px; border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; background: var(--card); }
.fam-head { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.fam-main { display: grid; justify-items: end; text-align: right; }
.fam-w { font-size: clamp(2.2rem, 7vw, 3rem); line-height: 1.4; color: var(--ink); }
.fam-tr { direction: ltr; font-size: 1.05rem; }
.say { border: 1.5px solid var(--line); background: var(--soft); border-radius: 50%; width: 44px; height: 44px; cursor: pointer; font-size: 1.1rem; flex: none; }
.say.small { width: 34px; height: 34px; font-size: .9rem; }
.fam-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fam-cell { border-radius: 12px; padding: 8px 10px; background: color-mix(in srgb, var(--role) 9%, var(--card)); border: 1.5px solid color-mix(in srgb, var(--role) 35%, var(--line)); display: grid; gap: 2px; justify-items: center; text-align: center; color: var(--ink); min-width: 0; }
.fam-cell .lbl { color: var(--role); }
.fam-cell .v { font-size: 1.55rem; line-height: 1.5; color: var(--role); }
.fam-cell .v0 { font-size: 1.3rem; }
.fam-cell small { font-size: .78rem; color: var(--muted); }
.fam-cell small .ar { font-size: 1rem; color: var(--ink); }
.fam-s { display: flex; gap: 10px; align-items: flex-start; background: var(--soft); border-radius: 12px; padding: 10px 12px; }
.fam-s > div { flex: 1; display: grid; gap: 2px; min-width: 0; }
.fam-s .ar { font-size: 1.35rem; text-align: right; }
.fam-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .85rem; }
.lv-row { display: flex; gap: 6px; flex-wrap: wrap; }
.lv { display: grid; gap: 2px; width: 62px; }
.lv .trk { display: block; height: 6px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.lv .trk i { display: block; height: 100%; background: var(--role); }
.lv small { font-size: .66rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }

/* modal */
.modal { position: fixed; inset: 0; background: rgba(10, 16, 13, .45); z-index: 40; display: grid; place-items: center; padding: 16px; }
.modal-in { width: min(640px, 100%); max-height: calc(100vh - 32px); overflow: auto; display: grid; gap: 10px; }
.modal-top { display: flex; justify-content: space-between; align-items: center; }

/* tekrar sorusu */
.qcard { display: grid; gap: 8px; }
.qtype { justify-self: start; font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--card); background: var(--role); border-radius: 999px; padding: 2px 10px; }
.qask { font-size: 1.05rem; }
.qopts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.qopts .opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lat-opts { direction: ltr; }
.lat-opts .opt { text-align: left; justify-content: flex-start; }
.kn { font-family: var(--f-body); font-size: .72rem; font-weight: 800; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }

/* kelimeler */
.search { width: 100%; font: inherit; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); }
.search:focus { outline: 3px solid var(--accent); outline-offset: 1px; }
details.lesson { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; background: var(--card); }
details.lesson > summary { display: flex; align-items: center; gap: 10px; color: var(--ink); list-style: none; }
details.lesson > summary::-webkit-details-marker { display: none; }
details.lesson > summary::before { content: "▸"; color: var(--accent); transition: transform .2s; }
details.lesson[open] > summary::before { transform: rotate(90deg); }
.lname { font-weight: 700; }
.lar { font-size: 1.1rem; color: var(--accent); margin-inline-start: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-block: 10px; }
.wchip { display: inline-flex; gap: 8px; align-items: center; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 3px 10px; cursor: pointer; position: relative; }
.wchip:hover { border-color: var(--accent); }
.wchip .ar { font-size: 1.3rem; line-height: 1.6; }
.wchip .arr { color: var(--muted); }
.lvdot { width: 8px; height: 8px; border-radius: 50%; background: color-mix(in srgb, var(--good) calc(var(--lv) * 100%), var(--line)); }
.weak-list { display: grid; gap: 8px; }
.weak { display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center; text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 6px 12px; cursor: pointer; }
.weak .ar { font-size: 1.4rem; }
.weak .cnt { font-size: .85rem; }

/* kalıplar */
.kalip-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.kalip { display: grid; gap: 6px; border-top: 5px solid var(--nasb); align-content: start; }
.kh { display: flex; gap: 12px; align-items: center; }
.kh > div { display: grid; flex: 1; }
.kp { font-size: 2rem; color: var(--nasb); line-height: 1.4; }

.kopts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }

.kopt.sel-no, .basket.sel-no { border-color: var(--bad); background: var(--bad-bg); }
.pboard { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }

.lat-c { font-family: var(--f-body); font-size: 1.4rem; font-weight: 700; }

@media (max-width: 720px) {

<script>
(function () {
"use strict";
// ---------- yardımcılar ----------
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function bare(s) { return String(s).replace(/[ً-ْٰـ]/g, "").replace(/[أإآٱ]/g, "ا"); }
function ar(s) { return '<span class="ar">' + s + '</span>'; }
var store = {
  get: function (k, d) { try { var v = localStorage.getItem("kelimehazinesi:" + k); return v === null ? d : JSON.parse(v); } catch (x) { return d; } },
  set: function (k, v) { try { localStorage.setItem("kelimehazinesi:" + k, JSON.stringify(v)); } catch (x) {} }
};
function dayNum() { var d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); }
var TODAY = dayNum();
var main = document.getElementById("main");
function toast(t) { var el = document.getElementById("toast"); el.innerHTML = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove("show"); }, 1800); }

// ---------- ses ----------
var SND = { on: store.get("snd", true), ctx: null };
function beep(kind) {
  if (!SND.on) return;
  try {
    SND.ctx = SND.ctx || new (window.AudioContext || window.webkitAudioContext)();
    var c = SND.ctx, o = c.createOscillator(), g = c.createGain(), f = { ok: [660, 880], no: [220, 160], tick: [520, 520], end: [523, 784] }[kind] || [440, 440];
    o.frequency.setValueAtTime(f[0], c.currentTime); o.frequency.linearRampToValueAtTime(f[1], c.currentTime + 0.15);
    g.gain.setValueAtTime(0.08, c.currentTime); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.25);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.26);
  } catch (x) {}
}
function sayAr(t) {
  try {
    if (!window.speechSynthesis) { toast("Bu tarayıcı sesli okumayı desteklemiyor."); return; }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g, "")), v = speechSynthesis.getVoices().filter(function (x) { return /^ar/i.test(x.lang); })[0];
    u.lang = "ar-SA"; u.rate = 0.8; if (v) u.voice = v; speechSynthesis.speak(u);
  } catch (x) {}
}

// ---------- veri dizinleri ----------
var W = KELIMELER, WBY = {}, DBY = {};
W.forEach(function (w) { WBY[w.id] = w; });
DERSLER.forEach(function (d, i) { d.no = i; DBY[d.id] = d; });
var TYPES = {
  a: { tr: "Anlam", ask: "Anlamı nedir?", col: "cerr" },
  c: { tr: "Çoğul", ask: "Çoğulu hangisi?", col: "nasb" },
  t: { tr: "Tekil", ask: "Tekili hangisi?", col: "mi" },
  e: { tr: "Eş anlam", ask: "Eş anlamlısı hangisi?", col: "mz" },
  z: { tr: "Zıt anlam", ask: "Zıt anlamlısı hangisi?", col: "ref" }
};
var TUR = { i: "isim", s: "sıfat", f: "fiil" };
var CAT = { s: "Sarf", n: "Nahiv" };

// ---------- durum ----------
var ST = {
  scope: store.get("scope", { cat: "all", off: {} }),
  lt: store.get("lt", {}),       // Leitner: anahtar → {b, due, ok, ng}
  hist: store.get("hist", {}),   // oyun + tekrar: anahtar → {ok, ng}
  stats: store.get("stats", { xp: 0, streak: 0, last: -1, newDay: -1, newN: 0 }),
  perDay: store.get("perDay", 5)
};
function save() { store.set("scope", ST.scope); store.set("lt", ST.lt); store.set("hist", ST.hist); store.set("stats", ST.stats); store.set("perDay", ST.perDay); }
var DAYS = { 1: 0, 2: 1, 3: 3, 4: 7, 5: 14 };
var RANKS = [[0, "Mübtedî"], [150, "Talebe"], [400, "Kâtip"], [900, "Edîb"], [1800, "Âlim"], [3500, "Allâme"]];

function inScope(w) { var d = DBY[w.d]; return (ST.scope.cat === "all" || d.cat === ST.scope.cat) && !ST.scope.off[w.d]; }
function scopeWords() { var s = W.filter(inScope); return s.length ? s : W.slice(); }
function typesOf(w) { var r = ["a"]; if (w.c) r.push("c"); if (w.e) r.push("e"); if (w.z) r.push("z"); if (w.c) r.push("t"); return r; }
function key(w, t) { return w.id + ":" + t; }
function rec(k) { return ST.lt[k]; }
function eligible(w, t) { return t !== "t" || ((rec(key(w, "c")) || {}).b || 0) >= 3; }
function wordLevel(w) { var ts = typesOf(w), s = 0; ts.forEach(function (t) { s += ((rec(key(w, t)) || {}).b || 0); }); return s / ts.length; }
function learned(w) { return typesOf(w).every(function (t) { return ((rec(key(w, t)) || {}).b || 0) >= 4; }); }
function seenWord(w) { return !!rec(key(w, "a")); }
function addXp(n) { ST.stats.xp += n; renderXp(); }
function touchStreak() {
  var s = ST.stats;
  if (s.last === TODAY) return;
  s.streak = s.last === TODAY - 1 ? s.streak + 1 : 1; s.last = TODAY;
}
function hist(k, ok) { var h = ST.hist[k] || (ST.hist[k] = { ok: 0, ng: 0 }); if (ok) h.ok++; else h.ng++; }

function renderXp() {
  var xp = ST.stats.xp, i = 0; while (i + 1 < RANKS.length && xp >= RANKS[i + 1][0]) i++;
  var nx = RANKS[i + 1], pc = nx ? Math.round((xp - RANKS[i][0]) / (nx[0] - RANKS[i][0]) * 100) : 100;
  var streak = ST.stats.last >= TODAY - 1 ? ST.stats.streak : 0;
  document.getElementById("xpbox").innerHTML = '<div class="row"><span class="lbl">Rütbe</span><span class="tabular">' + xp + ' puan</span></div>' +
    '<div class="row"><b class="rank">' + RANKS[i][1] + '</b><span class="muted">' + (nx ? "sonra: " + nx[1] : "en yüksek rütbe") + '</span></div>' +
    '<div class="xpbar"><div style="width:' + pc + '%"></div></div>' +
    '<div class="row"><span class="muted">Seri</span><b class="tabular">' + streak + ' gün</b></div>';
}

// ---------- kelime ailesi kartı ----------
function hlSent(w) { if (!w.s) return ""; return w.sw && w.s.indexOf(w.sw) >= 0 ? w.s.replace(w.sw, '<b class="hl">' + w.sw + '</b>') : w.s; }
function kalipAd(k) { var p = KALIPLAR[k]; return p ? ar(p[0]) + ' <span class="muted">' + p[1] + '</span>' : ''; }
function dots(w) {
  return '<div class="lv-row">' + typesOf(w).map(function (t) { var b = (rec(key(w, t)) || {}).b || 0; return '<span class="lv r-' + TYPES[t].col + '" title="' + TYPES[t].tr + ': kutu ' + b + '/5"><b class="trk"><i style="width:' + (b * 20) + '%"></i></b><small>' + TYPES[t].tr + '</small></span>'; }).join("") + '</div>';
}
function aile(w, opt) {
  opt = opt || {};
  var d = DBY[w.d];
  function cell(lbl, col, val, sub) { return '<div class="fam-cell r-' + col + '"><span class="lbl">' + lbl + '</span>' + (val ? '<span class="ar v">' + val + '</span>' + (sub ? '<small>' + sub + '</small>' : '') : '<span class="muted v0">—</span>') + '</div>'; }
  return '<div class="fam">' +
    '<div class="fam-head"><button class="say" data-say="' + esc(w.w) + '" aria-label="Dinle">🔊</button><div class="fam-main"><span class="ar fam-w">' + w.w + '</span><span class="fam-tr"><b>' + esc(w.tr) + '</b> <span class="muted">· ' + TUR[w.t] + '</span></span></div></div>' +
    '<div class="fam-grid">' + cell("Çoğulu", "nasb", w.c, w.k && KALIPLAR[w.k] ? kalipAd(w.k) : "") + cell("Eş anlamlısı =", "mz", w.e) + cell("Zıt anlamlısı ≠", "ref", w.z) + '</div>' +
    (w.s ? '<div class="fam-s"><button class="say small" data-say="' + esc(w.s) + '" aria-label="Cümleyi dinle">🔊</button><div><div class="ar">' + hlSent(w) + '</div><small class="muted">' + esc(w.st) + '</small></div></div>' : '') +
    '<div class="fam-foot"><span class="muted">' + CAT[d.cat] + ' · ' + esc(d.tr) + '</span>' + (opt.dots === false ? '' : dots(w)) + '</div></div>';
}
function openFam(id) {
  var w = WBY[id]; if (!w) return;
  var m = document.getElementById("modal") || document.body.appendChild(Object.assign(document.createElement("div"), { id: "modal" }));
  m.className = "modal"; m.innerHTML = '<div class="modal-in card" role="dialog" aria-modal="true" aria-label="Kelime ailesi"><div class="modal-top"><span class="lbl">Kelime ailesi</span><button class="btn small" data-close="1">Kapat</button></div>' + aile(w) + '</div>';
  m.querySelector("[data-close]").focus();
}
function closeFam() { var m = document.getElementById("modal"); if (m) m.remove(); }

// ---------- soru üretici ----------
function others(w, f, pref) {
  var pool = scopeWords().length >= 12 ? scopeWords() : W, seen = {}, out = [], fav = [];
  seen[w[f]] = 1; seen[w.w] = 1;
  shuffle(pool).forEach(function (x) { var v = x[f]; if (!v || seen[v] || x.id === w.id) return; seen[v] = 1; (pref && pref(x) ? fav : out).push(v); });

function endGame(msg) { stopGame(); G.done = true; G.endMsg = msg; beep("end"); addXp(10); save(); render(); }

// Kalıp Fabrikası
function fabPool() { return scopeWords().filter(function (w) { return w.c && w.k && KALIPLAR[w.k] && w.k !== "diger"; }); }
function fabRound() {
  var pool = fabPool(); if (!pool.length) pool = W.filter(function (w) { return w.c && KALIPLAR[w.k] && w.k !== "diger"; });
  var w = pick(pool), ks = shuffle(Object.keys(KALIPLAR).filter(function (k) { return k !== w.k && k !== "diger"; })).slice(0, 3);
  G.cur = { w: w, opts: shuffle([w.k].concat(ks)) }; G.ans = null;
}
var GR = {
  fab: function () {
    var c = G.cur, w = c.w;
    return '<div class="hud"><span>Tur <b>' + (G.r + 1) + '</b> / 10</span><span>Puan <b>' + G.score + '</b></span></div>' +
      '<div class="belt"><div class="belt-in"><span class="ar">' + w.w + '</span><small>' + esc(w.tr) + '</small></div><span class="belt-arr">⟵</span><div class="machine' + (G.ans ? " on" : "") + '">' + (G.ans ? '<span class="ar">' + KALIPLAR[w.k][0] + '</span>' : '⚙') + '</div><span class="belt-arr">⟵</span><div class="belt-out' + (G.ans ? " on" : "") + '">' + (G.ans ? '<span class="ar r-nasb">' + w.c + '</span>' : '<span class="muted">?</span>') + '</div></div>' +
      '<p class="qask"><b>Bu kelime hangi çoğul kalıbına girer?</b></p>' +
      '<div class="kopts">' + c.opts.map(function (k, i) {
        var cl = "kopt"; if (G.ans) { if (k === w.k) cl += " sel-ok"; else if (k === G.ans) cl += " sel-no"; }
        return '<button class="' + cl + '" data-fab="' + i + '"' + (G.ans ? " disabled" : "") + '><span class="ar">' + KALIPLAR[k][0] + '</span><small>' + KALIPLAR[k][1] + '</small></button>';
      }).join("") + '</div>' +
      (G.ans ? '<p class="fb">' + (G.ans === w.k ? '<span class="ok">Doğru!</span> ' : '<span class="no">Yanlış.</span> ') + ar(w.w) + ' → ' + ar(w.c) + ' · ' + KALIPLAR[w.k][1] + ' kalıbı.</p><div class="row-btns"><button class="btn solid" data-gnext="1">' + (G.r >= 9 ? "Bitir" : "Sonraki") + '</button></div>' : '');
  },
  mik: function () { return pairBoard(false); },
  haf: function () { return pairBoard(true); },
  dus: function () {
    var c = G.cur;
    return '<div class="hud"><span>Can <b>' + "♥♥♥".slice(0, G.lives) + '<span class="muted">' + "♥♥♥".slice(G.lives) + '</span></b></span><span>Puan <b>' + G.score + '</b></span><span>Kelime <b>' + (G.r + 1) + '</b> / 20</span></div>' +
      '<div class="sky" id="sky"><div class="faller r-' + TYPES[c.t].col + '" id="faller" style="top:' + G.pos + '%"><span class="ar">' + c.prompt + '</span><small>' + TYPES[c.t].ask.replace(" hangisi?", "?").replace(" nedir?", "?") + '</small></div>' + (G.msg ? '<div class="skymsg">' + G.msg + '</div>' : '') + '</div>' +
      '<div class="baskets">' + c.opts.map(function (o, i) { var cl = "basket"; if (G.ans !== null) { if (o === c.ok) cl += " sel-ok"; else if (o === G.ans) cl += " sel-no"; } return '<button class="' + cl + '" data-dus="' + i + '"' + (G.ans !== null ? " disabled" : "") + '>' + (c.lat ? esc(o) : '<span class="ar">' + o + '</span>') + '</button>'; }).join("") + '</div>';
  },
  cum: function () {
    var c = G.cur, w = c.w;
    return '<div class="hud"><span>Cümle <b>' + (G.r + 1) + '</b> / 10</span><span>Puan <b>' + G.score + '</b></span></div>' +
      '<div class="sentcard"><div class="ar">' + hlSent(w) + '</div><small class="muted">' + esc(w.st) + '</small></div>' +
      '<p class="qask">Koyu kelimenin sözlük biçimi ' + ar(w.w) + ' <span class="muted">(' + esc(w.tr) + ')</span>. Yerine <b class="r-' + TYPES[c.t].col + '">' + (c.t === "e" ? "eş anlamlısını (anlam aynı kalsın)" : "zıt anlamlısını (anlam tersine dönsün)") + '</b> koy:</p>' +
      optBtns(c, "data-cum", G.ans) +
      (G.ans !== null ? '<p class="fb">' + (G.ans === c.ok ? '<span class="ok">Doğru!</span> ' : '<span class="no">Yanlış.</span> ') + ar(w.w) + ' ' + (c.t === "e" ? "=" : "≠") + ' ' + ar(c.ok) + '</p><div class="row-btns"><button class="btn solid" data-gnext="1">' + (G.r >= 9 ? "Bitir" : "Sonraki") + '</button></div>' : '');
  },
  hiz: function () {
    var c = G.cur;
    return '<div class="hud"><span>Süre <b id="hz-t">' + G.t + '</b></span><span>Puan <b>' + G.score + '</b></span><span>Seri <b>x' + Math.min(5, 1 + Math.floor(G.streak / 3)) + '</b></span></div><div class="time-bar' + (G.t <= 10 ? " low" : "") + '"><div style="width:' + (G.t / 60 * 100) + '%"></div></div>' +
      '<div class="target' + (G.flash ? " flash-" + G.flash : "") + '"><span class="ar">' + c.w.w + '</span> <span class="rel r-' + TYPES[c.t].col + '">' + { a: "anlamı:", c: "çoğulu:", e: "eş anlamlısı:", z: "zıt anlamlısı:" }[c.t] + '</span> ' + (c.t === "a" ? '<span class="lat-c">' + esc(c.cand) + '</span>' : '<span class="ar">' + c.cand + '</span>') + '</div>' +
      '<div class="big2"><button style="--role:var(--good)" data-hiz="1">Doğru<small>1</small></button><button style="--role:var(--bad)" data-hiz="0">Yanlış<small>2</small></button></div>' +
      '<div class="gfb">' + (G.last || '&nbsp;') + '</div>';
  }
};
function pairBoard(hidden) {
  return '<div class="hud"><span>Eşleşen <b>' + G.matched + '</b> / ' + G.pairs.length + '</span><span>' + (hidden ? 'Hamle' : 'Hata') + ' <b>' + (hidden ? G.moves : G.miss) + '</b></span><span>Süre <b id="pb-t">' + G.sec + '</b> sn</span></div>' +
    '<div class="pboard' + (hidden ? " hidden" : "") + '">' + G.tiles.map(function (t, i) {
      var open = !hidden || t.done || G.sel.indexOf(i) >= 0, cl = "ptile" + (t.done ? " done" : "") + (G.sel.indexOf(i) >= 0 ? " sel" : "") + (G.bad && G.bad.indexOf(i) >= 0 ? " bad" : "") + (t.side ? " s1" : "");
      return '<button class="' + cl + '" data-pt="' + i + '"' + (t.done ? " disabled" : "") + '>' + (open ? '<span class="ar">' + t.text + '</span>' : '<span class="back">؟</span>') + '</button>';
    }).join("") + '</div>' +
    (G.log.length ? '<div class="plog">' + G.log.map(function (p) { return '<span class="badge r-' + (G.mode === "z" ? "ref" : G.mode === "e" ? "mz" : "nasb") + '"><span class="ar">' + p[0] + ' ' + MODES[G.mode][1] + ' ' + p[1] + '</span>' + esc(p[2]) + '</span>'; }).join("") + '</div>' : '');
}
function startGame(id, mode) {
  stopGame(); closeFam();
  G = { id: id, mode: mode || null, r: 0, score: 0, done: false };
  if (id === "fab") fabRound();
  if (id === "mik" || id === "haf") {
    var f = mode, used = {}, pairs = [];
    shuffle(scopeWords().length >= 6 ? scopeWords() : W).forEach(function (w) {
      if (pairs.length >= 6 || !w[f]) return;
      var a = w.w, b = w[f]; if (used[a] || used[b]) return; used[a] = used[b] = 1; pairs.push(w);
    });
    if (pairs.length < 6) W.forEach(function (w) { if (pairs.length >= 6 || !w[f] || used[w.w] || used[w[f]]) return; used[w.w] = used[w[f]] = 1; pairs.push(w); });
    G.pairs = pairs; G.tiles = shuffle(pairs.reduce(function (a, w, i) { return a.concat([{ p: i, side: 0, text: w.w }, { p: i, side: 1, text: w[f] }]); }, []));
    G.sel = []; G.matched = 0; G.miss = 0; G.moves = 0; G.sec = 0; G.log = [];
    GT = setInterval(function () { G.sec++; var el = document.getElementById("pb-t"); if (el) el.textContent = G.sec; }, 1000);
  }
  if (id === "dus") { G.lives = 3; dusRound(); }
  if (id === "cum") cumRound();
  if (id === "hiz") {
    G.t = 60; G.streak = 0; G.n = 0; hizRound();
    GT = setInterval(function () { G.t--; if (G.t <= 0) return endGame(G.n + " ifade değerlendirdin."); var el = document.getElementById("hz-t"); if (el) el.textContent = G.t; var b = document.querySelector(".time-bar"); if (b) { b.firstChild.style.width = (G.t / 60 * 100) + "%"; b.classList.toggle("low", G.t <= 10); } }, 1000);
  }
  go("oyun");
}
function pairTap(i) {
  var t = G.tiles[i]; if (t.done || G.sel.indexOf(i) >= 0 || G.lock) return;
  G.sel.push(i); G.bad = null;
  if (G.sel.length === 2) {
    var a = G.tiles[G.sel[0]], b = G.tiles[G.sel[1]], w = G.pairs[a.p], k = key(w, G.mode === "c" ? "c" : G.mode);
    G.moves++;
    if (a.p === b.p && a.side !== b.side) {
      a.done = b.done = true; G.matched++; G.score += 10; G.sel = []; G.log.push([w.w, w[G.mode], w.tr]); beep("ok"); gameXp(3, k, true);
      if (G.matched === G.pairs.length) { G.score += Math.max(0, 60 - G.sec) + (G.id === "mik" ? Math.max(0, 30 - G.miss * 5) : Math.max(0, 40 - (G.moves - 6) * 3)); return endGame("Bütün çiftleri " + G.sec + " saniyede " + (G.id === "haf" ? G.moves + " hamlede " : "") + "buldun" + (G.id === "mik" ? ", " + G.miss + " hata" : "") + "."); }
    } else {
      G.miss++; beep("no"); G.bad = G.sel.slice(); gameXp(0, k, false);
      if (G.id === "haf") { G.lock = true; render(); setTimeout(function () { if (!G) return; G.sel = []; G.bad = null; G.lock = false; render(); }, 900); return; }
      G.sel = [];
    }
  }
  render();
}
function dusRound() {
  var pool = scopeWords(), w = pick(pool), ts = typesOf(w).filter(function (t) { return t !== "t"; }), t = pick(ts.length > 1 ? ts.filter(function (x) { return x !== "a"; }) : ts);
  var q = makeQ(key(w, t)); q.opts = shuffle([q.ok].concat(q.opts.filter(function (o) { return o !== q.ok; }).slice(0, 2)));
  G.cur = q; G.pos = 0; G.ans = null; G.msg = "";
  var dur = Math.max(3.2, 8 - G.r * 0.25) * 1000, t0 = Date.now();
  stopGame();
  GT = setInterval(function () {
    G.pos = Math.min(100, (Date.now() - t0) / dur * 100);
    var el = document.getElementById("faller"); if (el) el.style.top = (G.pos * 0.78) + "%";
    if (G.pos >= 100) { stopGame(); dusAnswer(-1); }
  }, 50);
}
function dusAnswer(i) {
  if (G.ans !== null) return; stopGame();
  var c = G.cur, o = i < 0 ? "" : c.opts[i], ok = o === c.ok;
  G.ans = o;
  if (ok) { var bonus = Math.round((100 - G.pos) / 10); G.score += 10 + bonus; G.msg = '<span class="ok">Doğru! +' + (10 + bonus) + '</span>'; beep("ok"); }
  else { G.lives--; G.msg = '<span class="no">' + (i < 0 ? "Yere düştü!" : "Yanlış sepet!") + '</span> Doğrusu: ' + (c.lat ? esc(c.ok) : ar(c.ok)); beep("no"); }
  gameXp(ok ? 4 : 0, c.k, ok);
  render();
  setTimeout(function () {
    if (!G || G.id !== "dus" || G.done) return;
    G.r++;
    if (G.lives <= 0 || G.r >= 20) return endGame(G.r + " kelime düştü, " + (3 - G.lives) + " can kaybettin.");
    dusRound(); render();
  }, ok ? 800 : 1600);
}
function cumRound() {
  var pool = scopeWords().filter(function (w) { return w.s && w.sw && w.s.indexOf(w.sw) >= 0 && (w.e || w.z); });
  if (pool.length < 4) pool = W.filter(function (w) { return w.s && w.sw && w.s.indexOf(w.sw) >= 0 && (w.e || w.z); });
  var w = pick(pool), t = w.e && w.z ? pick(["e", "z"]) : w.e ? "e" : "z", q = makeQ(key(w, t));
  q.opts = shuffle([q.ok].concat(q.opts.filter(function (o) { return o !== q.ok; }).slice(0, 2)));
  G.cur = q; G.ans = null;
}
function hizRound() {
  var pool = scopeWords(), w = pick(pool), ts = typesOf(w).filter(function (t) { return t !== "t"; }), t = pick(ts), f = { a: "tr", c: "c", e: "e", z: "z" }[t];
  var truth = Math.random() < 0.5, cand = w[f];
  if (!truth) { var alt = (t === "e" && w.z) ? [w.z] : (t === "z" && w.e) ? [w.e] : []; alt = alt.concat(others(w, f)); cand = alt[0]; if (!cand) { truth = true; cand = w[f]; } }
  G.cur = { w: w, t: t, cand: cand, truth: truth, k: key(w, t) };
}
function hizAnswer(v) {
  var c = G.cur, ok = (v === 1) === c.truth;
  G.n++;
  if (ok) { G.streak++; var m = Math.min(5, 1 + Math.floor(G.streak / 3)); G.score += 10 * m; G.flash = "ok"; beep("ok"); G.last = '<span class="ok">Doğru +' + (10 * m) + '</span>'; }
  else { G.streak = 0; G.flash = "no"; beep("no"); G.last = '<span class="no">Yanlış.</span> ' + ar(c.w.w) + ' → ' + (c.t === "a" ? esc(c.w.tr) : ar(c.w[{ c: "c", e: "e", z: "z" }[c.t]])); }
  gameXp(ok ? 2 : 0, c.k, ok);
  hizRound(); render();
}

// ---------- sekmeler ----------
var TABS = [["bas", "Ana Sayfa"], ["tekrar", "Günlük Tekrar"], ["kelime", "Kelimeler"], ["kalip", "Çoğul Kalıpları"], ["oyun", "Oyunlar"], ["zayif", "Zayıf Kelimeler"]];
var TAB = "bas";
function renderTabs() {
  document.getElementById("tabs").innerHTML = TABS.map(function (t) { return '<button role="tab" data-tab="' + t[0] + '" aria-selected="' + (TAB === t[0]) + '">' + t[1] + (t[0] === "tekrar" ? ' <span class="pc" id="duepc"></span>' : '') + '</button>'; }).join("");
  var n = dueKeys().length + newWords().length, el = document.getElementById("duepc"); if (el) el.textContent = n ? n : "";
}
function render() {
  var y = window.scrollY;
  main.innerHTML = { bas: renderBas, tekrar: renderTekrar, kelime: renderKelime, kalip: renderKalip, oyun: renderOyun, zayif: renderZayif }[TAB]();
  renderTabs(); renderXp();
  window.scrollTo(0, y);
}
function go(t) { if (t !== "oyun" && G) { stopGame(); G = null; } TAB = t; closeFam(); render(); window.scrollTo(0, 0); }

// ---------- olaylar ----------
document.addEventListener("click", function (e) {
  var b = e.target.closest("button, .modal"); if (!b) return;
  if (b.classList.contains("modal") && e.target === b) return closeFam();
  var d = b.dataset;
  if (d.tab) return go(d.tab);
  if (d.go) return go(d.go);
  if (d.close) return closeFam();
  if (d.say) return sayAr(d.say);
  if (d.fam) return openFam(d.fam);
  if (d.sess) return startSession(d.sess, d.arg);
  if (d.ans != null) return answer(+d.ans);
  if (d.next) return next();
  if (d.cat) { ST.scope.cat = d.cat; save(); return render(); }
  if (d.ltog) { if (ST.scope.off[d.ltog]) delete ST.scope.off[d.ltog]; else ST.scope.off[d.ltog] = 1; var dd = DBY[d.ltog]; if (ST.scope.cat !== "all" && ST.scope.cat !== dd.cat) { ST.scope.cat = "all"; } save(); render(); var det = main.querySelector("details"); if (det) det.open = true; return; }
  if (d.lall) { ST.scope.off = {}; save(); render(); main.querySelector("details").open = true; return; }
  if (d.lnone) { DERSLER.forEach(function (x) { ST.scope.off[x.id] = 1; }); save(); render(); main.querySelector("details").open = true; return; }
  if (d.perday) { ST.perDay = +d.perday; save(); return render(); }
  if (d.snd) { SND.on = !SND.on; store.set("snd", SND.on); return render(); }
  if (d.reset) { if (window.confirm("Bütün ilerlemen (kutular, puan, seri) silinsin mi?")) { ST.lt = {}; ST.hist = {}; ST.stats = { xp: 0, streak: 0, last: -1, newDay: -1, newN: 0 }; save(); toast("İlerleme sıfırlandı."); render(); } return; }
  if (d.gstart) return startGame(d.gstart, d.mode);
  if (d.gmenu) { stopGame(); G = null; return render(); }
  if (!G) return;
  if (d.fab != null && !G.ans) { var k = G.cur.opts[+d.fab], ok = k === G.cur.w.k; G.ans = k; if (ok) { G.score += 10; beep("ok"); } else beep("no"); gameXp(ok ? 4 : 0, key(G.cur.w, "c"), ok); return render(); }
  if (d.pt != null) return pairTap(+d.pt);
  if (d.dus != null) return dusAnswer(+d.dus);
  if (d.cum != null && G.ans === null) { var c = G.cur, o = c.opts[+d.cum], ok2 = o === c.ok; G.ans = o; if (ok2) { G.score += 10; beep("ok"); } else beep("no"); gameXp(ok2 ? 4 : 0, c.k, ok2); return render(); }
  if (d.hiz != null) return hizAnswer(+d.hiz);
  if (d.gnext) {
    G.r++;
    if (G.id === "fab") { if (G.r >= 10) return endGame("10 kelimenin " + G.score / 10 + " tanesinin kalıbını doğru buldun."); fabRound(); }
    if (G.id === "cum") { if (G.r >= 10) return endGame("10 cümlenin " + G.score / 10 + " tanesinde doğru kelimeyi koydun."); cumRound(); }
    return render();
  }
});
document.addEventListener("input", function (e) {
  if (e.target.id === "find") { FIND.q = e.target.value; var pos = e.target.selectionStart; render(); var f = document.getElementById("find"); if (f) { f.focus(); try { f.setSelectionRange(pos, pos); } catch (x) {} } }
});
document.addEventListener("keydown", function (e) {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Escape") return closeFam();
  var n = parseInt(e.key, 10);
  if (TAB === "tekrar" && S && !S.empty) {
    if (e.key === "Enter") { var nx = main.querySelector("[data-next]"); if (nx) { e.preventDefault(); nx.click(); } return; }
    if (n >= 1 && n <= 4) { var bt = main.querySelector('[data-ans="' + (n - 1) + '"]'); if (bt && !bt.disabled) bt.click(); }
    return;
  }
  if (TAB === "oyun" && G && !G.done) {
    if (G.id === "hiz" && (n === 1 || n === 2)) return hizAnswer(n === 1 ? 1 : 0);
    var sel = { fab: "data-fab", dus: "data-dus", cum: "data-cum" }[G.id];
    if (sel && n >= 1 && n <= 4) { var b2 = main.querySelector("[" + sel + '="' + (n - 1) + '"]'); if (b2 && !b2.disabled) b2.click(); }
    if (e.key === "Enter") { var g2 = main.querySelector("[data-gnext]"); if (g2) g2.click(); }
  }
});

render();
})();
