<div class="wrap">

      <p>Zamir bir ismin yerini tutar. Ya tek başına durur (<span class="ar">هُوَ طَالِبٌ</span>), ya isme (<span class="ar">كِتَابُهُ</span>), harfe (<span class="ar">لَهُ</span>) ya da fiile (<span class="ar">نَصَحَهُ</span>) bitişir. Zamir makinesiyle dene, kaideyi oku, alıştırmaları çöz, oyunlarla pekiştir.</p>
    </div>

  <main id="main"></main>
</div>

<script>
(function () {
"use strict";
// ---------- yardımcılar ----------
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function plain(h) { return String(h).replace(/<[^>]+>/g, ""); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function chunks(str) { return str.split(" / ").map(function (p) { var i = p.lastIndexOf(":"); return { t: p.slice(0, i), r: p.slice(i + 1) }; }); }
function sentHtml(str) {
  return '<div class="sent">' + chunks(str).map(function (c) {
    if (c.r === "-") return '<span class="plain">' + c.t + '</span>';
    var rr = c.r.split("."), lb = ROLES[rr[0]] ? ROLES[rr[0]].tr + (rr[1] ? " · " + rr[1] : "") : "&nbsp;";
    return '<span class="chunk r-' + rr[0] + '"><span class="w">' + c.t + '</span><span class="t">' + lb + '</span></span>';
  }).join("") + '</div>';
}
function legendHtml(roles) { return '<div class="legend">' + roles.map(function (r) { return '<span class="r-' + r + '"><i></i>' + ROLES[r].tr + ' <span class="ar" style="color:var(--muted)">' + ROLES[r].ar + '</span></span>'; }).join("") + '</div>'; }
var store = {
  get: function (k, d) { try { var v = localStorage.getItem("zamir:" + k); return v === null ? d : JSON.parse(v); } catch (x) { return d; } },
  set: function (k, v) { try { localStorage.setItem("zamir:" + k, JSON.stringify(v)); } catch (x) {} }
};
function icon(kind, cls, n) {
  var one = {
    person: '<circle cx="12" cy="7" r="5" class="' + cls + '"/><path d="M3 24 Q3 13 12 13 Q21 13 21 24 Z" class="' + cls + '"/>',
    camel: '<path d="M2 20 L2 14 Q2 11 5 11 L8 11 Q9 6 12 9 Q14 5 17 9 L19 9 Q20 5 22 6 L22 9 L20 11 L20 20 L18 20 L18 14 L6 14 L6 20 Z" class="' + cls + '"/>',
    leaf: '<path d="M4 20 Q4 4 21 3 Q20 20 4 20 Z" class="' + cls + '"/><path d="M4 20 L15 9" stroke="var(--card)" stroke-width="1.5" fill="none"/>',
    pin: '<path d="M12 2 Q20 2 20 10 Q20 15 12 23 Q4 15 4 10 Q4 2 12 2 Z" class="' + cls + '"/><circle cx="12" cy="10" r="3" fill="var(--card)"/>',
    clock: '<circle cx="12" cy="12" r="10" class="' + cls + '"/><path d="M12 6 L12 12 L16 14" stroke="var(--card)" stroke-width="2" fill="none" stroke-linecap="round"/>',
    pen: '<path d="M4 20 L5 15 L16 4 L20 8 L9 19 Z" class="' + cls + '"/><path d="M14 6 L18 10" stroke="var(--card)" stroke-width="1.5"/>'
  }[kind];
  var s = ""; for (var i = 0; i < (n || 1); i++) s += '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">' + one + '</svg>';
  return '<span class="icons">' + s + '</span>';
}

// ---------- rütbe, ses, konfeti ----------
var LEVELS = [[0, "Mübtedî", "yeni başlayan"], [100, "Talebe", "öğrenci"], [300, "Kâtip", "yazan"], [600, "Edîb", "dil ustası"], [1000, "Nahvî", "dil bilgini"], [1600, "Allâme", "çok bilen"]];
function getXP() { return store.get("xp", 0); }
function levelOf(x) { var i = 0; for (var k = 0; k < LEVELS.length; k++) if (x >= LEVELS[k][0]) i = k; return i; }
function renderXP() {
  var box = document.getElementById("xpbox"), x = getXP(), i = levelOf(x), cur = LEVELS[i], nx = LEVELS[i + 1];
  var pct = nx ? (x - cur[0]) / (nx[0] - cur[0]) * 100 : 100;
  box.innerHTML = '<div class="row"><span class="lbl">Rütben</span><span class="tabular muted">' + x + ' puan</span></div><div class="row"><b class="rank">' + cur[1] + '</b><span class="muted">' + (nx ? "sonra: " + nx[1] : "en yüksek rütbe") + '</span></div><div class="xpbar"><div style="width:' + pct + '%"></div></div>';
}
var toastT;
function toast(m) { var t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("show"); }, 2000); }
function addXP(n, quiet) {
  n = Math.max(0, Math.round(n)); if (!n) return;
  var b = levelOf(getXP()), v = getXP() + n; store.set("xp", v); renderXP();
  var a = levelOf(v);
  if (a > b) { toast("Yeni rütbe: " + LEVELS[a][1] + " (" + LEVELS[a][2] + ")"); confetti(); beep("win"); }
  else if (!quiet) toast("+" + n + " puan");
}
var SND = { on: store.get("snd", true), ctx: null };
function beep(type) {
  if (!SND.on) return;
  try {
    SND.ctx = SND.ctx || new (window.AudioContext || window.webkitAudioContext)();
    var c = SND.ctx, notes = type === "ok" ? [660, 880] : type === "win" ? [523, 659, 784, 1046] : type === "tick" ? [1200] : [220, 160];
    notes.forEach(function (f, i) {
      var o = c.createOscillator(), g = c.createGain(); o.type = type === "no" ? "sawtooth" : "triangle"; o.frequency.value = f;
      var t = c.currentTime + i * 0.09, vol = type === "tick" ? 0.04 : 0.12;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.2);
    });
  } catch (x) {}
}
function confetti() {
  try { if (matchMedia("(prefers-reduced-motion: reduce)").matches) return; } catch (x) {}
  var cv = document.createElement("canvas"); cv.className = "confetti"; document.body.appendChild(cv);
  var W = cv.width = innerWidth, H = cv.height = innerHeight, ctx = cv.getContext("2d"), cs = getComputedStyle(document.documentElement);
  var cols = ["--mz", "--cerr", "--ref", "--nasb", "--mi", "--mus"].map(function (v) { return cs.getPropertyValue(v).trim() || "#888"; }), ps = [];
  for (var i = 0; i < 150; i++) ps.push({ x: W / 2 + (Math.random() - .5) * W * .5, y: H * .4, vx: (Math.random() - .5) * 12, vy: -Math.random() * 11 - 4, r: Math.random() * 7 + 4, c: cols[i % 6], a: Math.random() * 6 });
  var t0 = performance.now();
  (function step(t) { ctx.clearRect(0, 0, W, H); ps.forEach(function (p) { p.vy += .33; p.x += p.vx; p.y += p.vy; p.a += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); }); if (t - t0 < 2000) requestAnimationFrame(step); else cv.remove(); })(t0);
}
function starsHtml(n) { var s = ""; for (var i = 1; i <= 3; i++) s += i <= n ? "★" : '<span class="off">★</span>'; return '<div class="stars" aria-label="' + n + ' yıldız">' + s + '</div>'; }

// ---------- görseller ----------
function badges(list) { return '<div class="badges">' + list.map(function (b) { return '<span class="badge" style="--role:var(--' + (b[2] || "accent") + ')">' + (b[0] ? '<span class="ar">' + b[0] + '</span>' : '') + b[1] + '</span>'; }).join("") + '</div>'; }
// Zamir makinesi: tablodan bir zamir seç; munfasıl şekli, isme, harfe ve fiile bitişik şekilleri gör
function ekHl(form, ek) {
  var c = ek.replace(/ـ/g, "").split(" / "), more = [];
  c.forEach(function (s) { if (/^هُ/.test(s)) more.push(s.replace(/^هُ/, "هِ")); });
  c = c.concat(more).sort(function (a, b) { return b.length - a.length; });
  for (var i = 0; i < c.length; i++) { var s = c[i]; if (form.slice(-s.length) === s && form.length > s.length) return form.slice(0, -s.length) + '<b>' + s + '</b>'; }
  return form;
}
function zamirMakine() {
  var v = LIVE.zt == null ? 0 : LIVE.zt, z = ZT[v], rc = ZT_ROWS[z[0]][2];
  var head = '<div class="zt-c hd"></div><div class="zt-c hd">Tekil</div><div class="zt-c hd">İkil</div><div class="zt-c hd">Çoğul</div>';
  var rows = ZT_ROWS.map(function (r, ri) {
    var cells = ZT.map(function (x, i) { return [x, i]; }).filter(function (p) { return p[0][0] === ri; });
    return '<div class="zt-c rh" style="--role:var(--' + r[2] + ')"><b>' + r[0] + '</b><span class="ar">' + r[1] + '</span></div>' +
      cells.map(function (p) { return '<button class="zt-b' + (p[1] === v ? " on" : "") + (p[0][1] === 1 && ri === 4 ? " span2" : "") + '" style="--role:var(--' + r[2] + ')" data-zt="' + p[1] + '"><span class="ar">' + p[0][3] + '</span></button>'; }).join("");
  }).join("");
  var line = function (lbl, arr, tr) { return '<div class="zt-l"><span class="lbl">' + lbl + '</span><span class="ar">' + arr.join(" · ") + '</span><small>' + tr + '</small></div>'; };
  return '<div id="makine" class="makine"><div class="lbl">Bir zamir seç</div><div class="zt-grid">' + head + rows + '</div>' +
    '<div class="mk-out zt-out" style="--role:var(--' + rc + ')"><span class="muted">' + z[2] + ' · bitişik ek <span class="ar">' + z[4] + '</span></span><span class="ar">' + z[3] + '</span>' +
      '<div class="zt-lines">' +
        line("İsme bitişik", [ekHl(z[5], z[4])], z[10]) +
        line("Harfe bitişik", [ekHl(z[8], z[4]), ekHl(z[9], z[4])], "lâm ve bâ ile") +
        line("Fiile bitişik (mef'ûl)", [ekHl(z[6], z[4]), ekHl(z[7], z[4])], z[11]) +
        line("Munfasıl cümlede", [z[12]], "zamir mübtedâ, ardından haber") +
      '</div></div></div>';
}
function vizU1() {
  function col(t, ar, c, list, ico) { return '<div style="--role:var(--' + c + ')"><b>' + t + ' <span class="ar">' + ar + '</span></b>' + icon("person", "fillrole", ico) + '<span class="ar hlb">' + list + '</span></div>'; }
  return '<div class="gorev" style="width:100%;max-width:860px">' +
    col("Konuşan", "المُتَكَلِّمُ", "accent", "أَنَا · نَحْنُ", 1) +
    col("Karşıdaki", "المُخَاطَبُ", "muz", "أَنْتَ · أَنْتِ · أَنْتُمَا · أَنْتُمْ · أَنْتُنَّ", 1) +
    col("Orada olmayan", "الغَائِبُ", "mun", "هُوَ · هِيَ · هُمَا · هُمْ · هُنَّ", 1) + '</div>' +
    '<p class="cap">On iki zamir, ama üçü iki işi birden görür: <span class="ar">هُمَا</span> ve <span class="ar">أَنْتُمَا</span> erkek ve kadın ikil için; <span class="ar">نَحْنُ</span> ikil ve çoğul için. Haberi zamire uydur: <span class="ar">هُنَّ طَالِبَاتٌ</span>.</p>';
}
function vizU2() {
  return '<div class="steps3" style="width:100%;max-width:760px;direction:rtl">' +
    '<div style="direction:ltr;text-align:center"><span class="lbl">İsim</span><span class="ar" style="font-size:1.8rem">كِتَابٌ</span><small class="muted">tenvin var</small></div>' +
    '<div style="direction:ltr;text-align:center"><span class="lbl">+ zamir</span><span class="ar" style="font-size:1.8rem;color:var(--mi)">ـهُمْ</span><small class="muted">muzâfun ileyh olur</small></div>' +
    '<div style="direction:ltr;text-align:center"><span class="lbl">Sonuç</span><span class="ar" style="font-size:1.8rem">كِتَابُ<b style="color:var(--mi)">هُمْ</b></span><small class="muted">tenvin düştü</small></div></div>' +
    '<div class="lbl">Kesre ya da <bdi>ي</bdi>\'den sonra <bdi>ـهُ</bdi> → <bdi>ـهِ</bdi></div><div class="vs">' +
    '<div class="fcard" style="--role:var(--mi)"><span class="ar">لَ<b>هُ</b> · كِتَابُ<b>هُمْ</b></span><b class="t">Öncesi fetha ya da damme → <bdi>ـهُ</bdi></b></div>' +
    '<div class="fcard" style="--role:var(--mi)"><span class="ar">بِ<b>هِ</b> · عَلَيْ<b>هِمْ</b></span><b class="t">Öncesi kesre ya da <bdi>ي</bdi> → <bdi>ـهِ</bdi></b></div></div>';
}
function vizU3() {
  return '<div class="lbl">Benim · beni</div><div class="vs">' +
    '<div class="fcard" style="--role:var(--mi)"><span class="ar">كِتَابِ<b>ي</b></span><b class="t">İsimde <bdi>ـي</bdi> (benim kitabım)</b></div>' +
    '<div class="fcard" style="--role:var(--nasb)"><span class="ar">نَصَحَ<b>نِي</b></span><b class="t">Fiilde <bdi>ـنِي</bdi> (beni öğütledi)</b><small>araya nûn-ı vikâye girer</small></div></div>' +
    '<div class="lbl">Tek hareke anlamı değiştirir</div><div class="vs">' +
    '<div class="fcard" style="--role:var(--nasb)"><span class="ar">نَصَحَ<b>نَا</b></span><b class="t">bizi öğütledi · mef\'ûl</b><small>lâm fethalı</small></div>' +
    '<div class="fcard" style="--role:var(--ref)"><span class="ar">نَصَحْ<b>نَا</b></span><b class="t">öğütledik · fâil</b><small>lâm sakin</small></div></div>';
}
function vizU4() {
  return '<div class="fork"><div class="fcard" style="--role:var(--accent)"><span class="ar">فَأَخَذُوهُمْ</span><small>hepsini yakaladılar</small></div><span class="arr">←</span><div class="outs">' +
    '<div class="fcard" style="--role:var(--ref)"><span class="ar">أَخَذُ<b>وا</b></span><b class="t"><bdi>ـوا</bdi> → onlar aldı · fâil (ref)</b></div>' +
    '<div class="fcard" style="--role:var(--nasb)"><span class="ar">ـ<b>هُمْ</b></span><b class="t"><bdi>ـهُمْ</bdi> → onları · mef\'ûl (nasb)</b></div></div></div>' +
    badges([["أَهْلِكَ", "isme bitişik", "mi"], ["عَلَيْهِ", "harfe bitişik", "mi"], ["دَعَاكَ", "fiile bitişik", "nasb"], ["فَقَتَلَهَا", "fiile bitişik", "nasb"], ["أَبِي هُرَيْرَةَ", "zamir değil: Ebû", "x"]]);
}
var VIZ = { u1: vizU1, u2: vizU2, u3: vizU3, u4: vizU4 };

// ---------- durum ----------
var ST = { tab: "ozet", tr: store.get("tr", true), items: store.get("items", {}) };
var TABS = ["ozet", "u1", "u2", "u3", "u4", "oyun", "quiz"];
var hashT = location.hash.replace("#", "");
ST.tab = TABS.indexOf(hashT) >= 0 ? hashT : store.get("tab", "ozet");
if (TABS.indexOf(ST.tab) < 0) ST.tab = "ozet";
var main = document.getElementById("main");
var LIVE = {};
function saveItems() { store.set("items", ST.items); }
function unitById(id) { return UNITS.filter(function (u) { return u.id === id; })[0]; }

// Alıştırmaları maddelere aç
function expand(ex) {
  if (ex._items) return ex._items;
  var out = [];
  if (ex.type === "dp") {
    ex.rows.forEach(function (r) {
      out.push({ kind: "pick", q: r.s + " ← (müsennâ)", o: shuffle(r.d), a: r.d[0], tr: r.tr[1], why: r.why });
      out.push({ kind: "pick", q: r.s + " ← (cem)", o: shuffle(r.p), a: r.p[0], tr: r.tr[2], why: r.why });
    });
  } else if (ex.type === "bank") {
    var n = ex.parts ? ex.parts.filter(function (p) { return typeof p !== "string"; }).length : ex.items.length;
    for (var i = 0; i < n; i++) out.push({ kind: "bank" });
  } else if (ex.items) {
    ex.items.forEach(function (it) { var c = {}; for (var k in it) c[k] = it[k]; c.kind = ex.type; out.push(c); });
  }
  ex._items = out;
  return out;
}
function subCls(ex) { var a = []; if (ex.cls) a.push(["c", ex.cls]); if (ex.cls2) a.push(["d", ex.cls2]); return a; }
function allScorable(u) {
  var n = 0, ok = 0;
  u.ex.forEach(function (ex, ei) {
    expand(ex).forEach(function (it, ii) { n++; if (ST.items[u.id + "-" + ei + "-" + ii] === 1) ok++; });
    subCls(ex).forEach(function (sc) { sc[1].items.forEach(function (it, ii) { n++; if (ST.items[u.id + "-" + ei + "-" + sc[0] + ii] === 1) ok++; }); });
  });
  return { n: n, ok: ok };
}
function mark(key, good) {
  var prev = ST.items[key];
  if (good) { if (prev !== 1) { ST.items[key] = 1; saveItems(); addXP(prev === 2 ? 2 : 5, true); beep("ok"); } }
  else { if (prev !== 1) { ST.items[key] = 2; saveItems(); } beep("no"); }
  updateProgress();
}
function updateProgress() {
  UNITS.forEach(function (u) {
    var p = allScorable(u), el = document.querySelector('nav.tabs [data-tab="' + u.id + '"] .pc');
    if (el) el.textContent = Math.round(p.ok / p.n * 100) + "%";
    var bar = document.getElementById("prog-" + u.id);
    if (bar) { bar.style.width = (p.ok / p.n * 100) + "%"; var t = document.getElementById("progt-" + u.id); if (t) t.textContent = p.ok + " / " + p.n; }
  });
}

// ---------- sekmeler ----------
function renderTabs() {
  document.getElementById("tabs").innerHTML = '<button role="tab" data-tab="ozet">Özet</button>' +
    UNITS.map(function (u) { return '<button role="tab" data-tab="' + u.id + '"><span class="num">' + u.no + '</span>' + u.short + ' <span class="pc">0%</span></button>'; }).join("") +
    '<button role="tab" data-tab="oyun">Oyunlar</button><button role="tab" data-tab="quiz">Quiz Provası</button>';
}
function setTab(t) {
  if (t !== "oyun") stopGame();
  if (t !== "quiz") stopQuiz();
  ST.tab = t; store.set("tab", t);
  document.querySelectorAll("nav.tabs button").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.tab === t ? "true" : "false"); });
  render();
  var sel = document.querySelector('nav.tabs button[data-tab="' + t + '"]');
  if (sel) { try { sel.scrollIntoView({ block: "nearest", inline: "nearest" }); } catch (x) {} }
}
function render() {
  LIVE = {};
  if (ST.tab === "ozet") main.innerHTML = renderOzet();
  else if (ST.tab === "oyun") main.innerHTML = renderGames();
  else if (ST.tab === "quiz") main.innerHTML = renderQuiz();
  else main.innerHTML = renderUnit(unitById(ST.tab));
  updateProgress();
}

// ---------- özet ----------
var CHECK = [
  "On iki munfasıl zamiri sayabiliyorum: أَنَا، نَحْنُ، أَنْتَ، أَنْتِ، أَنْتُمَا، أَنْتُمْ، أَنْتُنَّ، هُوَ، هِيَ، هُمَا، هُمْ، هُنَّ.",
  "هُمَا، أَنْتُمَا ve نَحْنُ'un hem erkek hem kadın için kullanıldığını biliyorum.",
  "Zamire göre haberi tekil, ikil ya da çoğul yapabiliyorum: هُمَا طَالِبَتَانِ.",
  "Her munfasıl zamirin bitişik ekini biliyorum: هُوَ → ـهُ، أَنْتُمْ → ـكُمْ، نَحْنُ → ـنَا.",
  "İsme bitişen zamirin muzâfun ileyh olduğunu, tenvinin düştüğünü biliyorum: كِتَابُهُمْ.",
  "Kesre ya da ي'den sonra ـهُ'nun ـهِ olduğunu biliyorum: بِهِ، عَلَيْهِمْ.",

      return '<div class="item' + (res === true ? " ok" : res === false ? " no" : "") + '"><span class="qn tabular">' + (ii + 1) + '</span><div class="combo-line">' + (it.pre ? '<span>' + it.pre + '</span>' : '') + slotBtn(ii) + (it.h ? '<span>' + it.h + '</span>' : '') + '</div>' + (res === true ? trAfter(it) + (it.why ? '<div class="trline">' + it.why + '</div>' : '') : '') + '</div>';
    }).join("") + '</div>';
  }
  return '<div class="bank">' + ex.bank.map(function (b, bi) { return '<button class="tile" data-act="bsel" data-key="' + key + '" data-bi="' + bi + '" aria-pressed="' + (L.sel === bi ? "true" : "false") + '"' + (used[bi] ? " disabled" : "") + '>' + b + '</button>'; }).join("") + '</div>' + body +
    '<div class="row-btns"><button class="btn small solid" data-act="bcheck" data-key="' + key + '">Kontrol et</button><button class="btn small" data-act="breset" data-key="' + key + '">Sıfırla</button></div>' + (L.msg ? '<div class="fb">' + L.msg + '</div>' : '');
}
// okuma (diyalog) alıştırması
function renderReading(u, ex, ei) {
  return readingText(ex) +
    '<div class="stack">' + ex.qa.map(function (q, qi) {
      var k = u.id + "-" + ei + "-q" + qi, open = LIVE[k] && LIVE[k].open;
      return '<div class="qa"><div class="ar">' + ["أ", "ب", "ج", "د"][qi] + ' ـ ' + q.q + '</div>' + (open ? '<div class="ar" style="color:var(--accent)">' + q.a + '</div><div class="trline">' + q.tr + '</div>' : '<div><button class="btn small" data-act="qa" data-key="' + k + '">Örnek cevabı göster</button></div>') + '</div>';
    }).join("") + '</div>' +
    subCls(ex).map(function (sc) {
      return '<div class="exer-head"><div class="ar">' + sc[1].ar + '</div><div><b>' + sc[1].tr + '</b></div></div><div class="items">' +
        sc[1].items.map(function (it, ii) { var key = u.id + "-" + ei + "-" + sc[0] + ii; return '<div class="item" id="it-' + key + '">' + clsInner(key, it, ii, sc[1].opts) + '</div>'; }).join("") + '</div>';
    }).join("");
}
function clsInner(key, it, ii, opts) {
  var L = LIVE[key] || (LIVE[key] = {}), c = L.ch, right = opts.filter(function (o) { return o[0] === it.a; })[0];
  return '<span class="qn tabular">' + (ii + 1) + '</span><div class="q">' + it.s + '</div><div class="cls-btns">' + opts.map(function (b) {
    var cl = c ? (b[0] === it.a ? " sel-ok" : (b[0] === c ? " sel-no" : "")) : "";
    return '<button class="opt lat' + cl + '" data-act="rcls" data-key="' + key + '" data-ii="' + ii + '" data-v="' + b[0] + '"' + (c ? " disabled" : "") + '>' + b[1] + ' <span class="ar" style="font-weight:400">' + b[2] + '</span></button>';
  }).join("") + '</div>' + (c ? '<div class="fb">' + (c === it.a ? '<span class="ok">Doğru.</span> ' : '<span class="no">Yanlış.</span> Doğrusu: <b>' + right[1] + '</b>. ') + (it.why || '') + '</div>' : '');
}

// ---------- olaylar ----------
main.addEventListener("click", function (ev) {
  var b = ev.target.closest("button"); if (!b) return;
  var d = b.dataset, key = d.key;
  if (d.go) { setTab(d.go); window.scrollTo({ top: 0 }); return; }
  if (d.trtoggle) { ST.tr = !ST.tr; store.set("tr", ST.tr); var y = window.scrollY; render(); window.scrollTo({ top: y }); return; }
  if (d.snd) { SND.on = !SND.on; store.set("snd", SND.on); render(); if (SND.on) beep("ok"); return; }
  if (d.zt != null) { LIVE.zt = +d.zt; var mk = document.getElementById("makine"); if (mk) mk.outerHTML = zamirMakine(); beep("tick"); return; }
  if (d.flip) { LIVE.fu = !LIVE.fu; b.classList.toggle("up", LIVE.fu); return; }
  if (d.fnext || d.fprev || d.fshuf) {
    var fi = LIVE.fi || 0;
    if (d.fshuf) { KARTLAR.sort(function () { return Math.random() - .5; }); fi = 0; }
    else fi = (fi + (d.fnext ? 1 : -1) + KARTLAR.length) % KARTLAR.length;
    var y2 = window.scrollY; LIVE = { fi: fi, fu: false }; main.innerHTML = renderOzet(); window.scrollTo({ top: y2 }); return;
  }
  if (!d.act) return;
  var L = LIVE[key] || (LIVE[key] = {}), o;
  switch (d.act) {
    case "pick":
      o = itemFromKey(key); L.ch = +d.i;
      var ai = typeof o.it.a === "number" ? o.it.a : o.it.o.indexOf(o.it.a);
      L.res = L.ch === ai ? "ok" : "no"; mark(key, L.ch === ai); rerenderItem(key); break;
    case "cls": o = itemFromKey(key); L.ch = d.v; L.res = d.v === o.it.a ? "ok" : "no"; mark(key, d.v === o.it.a); rerenderItem(key); break;
    case "retry": LIVE[key] = {}; rerenderItem(key); break;
    case "tag":
      o = itemFromKey(key);
      var roles = o.ex.roles, cur = L.tags[+d.ci], idx = cur ? roles.indexOf(cur) : -1;
      L.tags[+d.ci] = roles[(idx + 1) % roles.length]; L.res = null; rerenderItem(key); break;
    case "find": L.tags[+d.ci] = !L.tags[+d.ci]; L.res = null; rerenderItem(key); break;
    case "tcheck":
      o = itemFromKey(key);
      var cs = chunks(o.it.c), good = cs.every(function (c, i) { if (c.r === "-") return true; if (o.it.kind === "find") return !!L.tags[i] === (c.r === "y"); return L.tags[i] === c.r; });
      L.res = good ? "ok" : "no"; mark(key, good); rerenderItem(key); break;
    case "tshow":
      o = itemFromKey(key); L.tags = chunks(o.it.c).map(function (c) { return o.it.kind === "find" ? c.r === "y" : c.r; }); L.res = "ok"; rerenderItem(key); break;
    case "cycle":
      o = itemFromKey(key);
      var sl = o.it.p.filter(function (x) { return typeof x !== "string"; }), si = +d.si;
      L.sel[si] = (L.sel[si] + 1) % sl[si].o.length; L.res = null; rerenderItem(key); break;
    case "ccheck":
      o = itemFromKey(key);
      var gc = o.it.ok.some(function (cmb) { return cmb.every(function (v, i) { return L.sel[i] === v; }); });
      L.res = gc ? "ok" : "no"; mark(key, gc); rerenderItem(key); break;
    case "cshow": o = itemFromKey(key); L.sel = o.it.ok[0].slice(); L.res = "ok"; rerenderItem(key); break;
    case "bsel": L.sel = L.sel === +d.bi ? -1 : +d.bi; rerenderExercise(key); break;
    case "bput":
      var ii = +d.ii;
      if (L.sel >= 0) { L.fill = L.fill.map(function (f) { return f === L.sel ? -1 : f; }); L.fill[ii] = L.sel; L.sel = -1; }
      else if (L.fill[ii] >= 0) L.fill[ii] = -1;
      if (L.res) L.res[ii] = null; L.msg = ""; rerenderExercise(key); break;
    case "breset": LIVE[key] = { fill: L.fill.map(function () { return -1; }), sel: -1 }; rerenderExercise(key); break;
    case "bcheck":
      var pb = key.split("-"), ub = unitById(pb[0]), exb = ub.ex[+pb[1]];
      var acc = exb.parts ? exb.parts.filter(function (p) { return typeof p !== "string"; }) : exb.items;
      L.res = acc.map(function (it, i) { return L.fill[i] >= 0 && it.a.indexOf(L.fill[i]) >= 0; });
      L.res.forEach(function (r, i) { if (L.fill[i] >= 0) mark(ub.id + "-" + pb[1] + "-" + i, r); });
      var nOk = L.res.filter(Boolean).length;
      L.msg = nOk === acc.length ? '<span class="ok">Hepsi doğru!</span>' : '<span class="no">' + nOk + ' / ' + acc.length + ' doğru.</span> Kırmızı kutuları değiştir.';
      if (nOk === acc.length) confetti();
      rerenderExercise(key); break;
    case "qa": L.open = true; rerenderExercise(key); break;
    case "it": L.t = d.v; if (L.res !== "ok") L.res = null; rerenderItem(key); break;
    case "ic": L.c = d.v; if (L.res !== "ok") L.res = null; rerenderItem(key); break;
    case "icheck":
      o = itemFromKey(key);
      var oc = o.ex.only === "c";
      if (!L.c || (!oc && !L.t)) { L.res = "eksik"; rerenderItem(key); break; }
      var gi = L.c === o.it.c && (oc || L.t === o.it.t);
      L.res = gi ? "ok" : "no"; mark(key, gi); rerenderItem(key); break;
    case "ishow": o = itemFromKey(key); L.t = o.it.t; L.c = o.it.c; L.res = "ok"; rerenderItem(key); break;
    case "rcls":
      var pr = key.split("-"), exr = unitById(pr[0]).ex[+pr[1]], sub = pr[2].charAt(0) === "c" ? exr.cls : exr.cls2, itr = sub.items[+d.ii];
      L.ch = d.v; mark(key, d.v === itr.a);
      document.getElementById("it-" + key).innerHTML = clsInner(key, itr, +d.ii, sub.opts); break;
  }
});
main.addEventListener("change", function (ev) {
  var t = ev.target; if (!t.dataset || t.dataset.chk == null) return;
  var ch = store.get("check", {}); ch[t.dataset.chk] = t.checked; store.set("check", ch);
  var all = CHECK.every(function (_, i) { return ch[i]; }); if (all && t.checked) { confetti(); toast("Hepsi işaretli: quize hazırsın!"); }
});
function rerenderExercise(key) {
  var p = key.split("-"), u = unitById(p[0]), ei = +p[1], el = document.getElementById("ex-" + u.id + "-" + ei);
  if (!el) return;
  var tmp = document.createElement("div"); tmp.innerHTML = renderExercise(u, u.ex[ei], ei); el.replaceWith(tmp.firstChild);
}
