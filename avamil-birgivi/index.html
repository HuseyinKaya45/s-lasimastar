<meta charset="utf-8">
<meta name="author" content="Hüseyin KAYA – Marmara Üniversitesi İlahiyat Fakültesi">
<title>Avâmil-i Birgivî</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Alegreya+Sans:wght@400;500;700&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: medrese defteri — dar üst şerit + sol fihrist (ders listesi) + geniş metin sayfası; renkler kitabın kırmızı başlık (lâl) mürekkebinden */
:root{
  --paper:#eef0ec; --surface:#fafaf7; --sunk:#e4e7e1; --ink:#1c2230; --muted:#5a6272; --rule:#cfd3cb;
  --lal:#b0281f; --lal-soft:#f6dedb;
  --raf:#22468a; --raf-soft:#dde5f4; --nasb:#8a5c0c; --nasb-soft:#f3e6c9; --jar:#2d6a4c; --jar-soft:#d9ece2; --jazm:#6b3a86; --jazm-soft:#eadff1;
  --ok:#2d6a4c; --bad:#b0281f;
  --f-ar:"Amiri","Noto Naskh Arabic","Traditional Arabic","Scheherazade New",serif;
  --f-disp:"Alegreya",Georgia,"Times New Roman",serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --ar-scale:1;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151d; --surface:#181d27; --sunk:#202633; --ink:#e6e8ec; --muted:#9aa2b2; --rule:#2e3544;
  --lal:#ee7d70; --lal-soft:#3a2224;
  --raf:#93b2ee; --raf-soft:#1e2a44; --nasb:#e2b75c; --nasb-soft:#3a3020; --jar:#79c9a0; --jar-soft:#1c3328; --jazm:#c79ae0; --jazm-soft:#33253d;
  --ok:#79c9a0; --bad:#ee7d70; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151d; --surface:#181d27; --sunk:#202633; --ink:#e6e8ec; --muted:#9aa2b2; --rule:#2e3544;
  --lal:#ee7d70; --lal-soft:#3a2224;
  --raf:#93b2ee; --raf-soft:#1e2a44; --nasb:#e2b75c; --nasb-soft:#3a3020; --jar:#79c9a0; --jar-soft:#1c3328; --jazm:#c79ae0; --jazm-soft:#33253d;
  --ok:#79c9a0; --bad:#ee7d70; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--raf)}
:focus-visible{outline:2px solid var(--lal);outline-offset:2px;border-radius:4px}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;font-size:calc(1.35em * var(--ar-scale));line-height:1.9}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;text-wrap:balance;margin:0;line-height:1.2}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ---------- üst şerit ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--rule)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand b{font-family:var(--f-disp);font-size:1.25rem;white-space:nowrap}
.brand .ar{color:var(--lal);font-size:1.35rem;line-height:1}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:none;padding:7px 11px;border-radius:7px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--surface)}
.tools{display:flex;gap:6px;align-items:center;margin-left:auto}
.search{position:relative}
.search input{width:min(240px,46vw);padding:7px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
.ibtn{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:6px 9px;cursor:pointer;line-height:1;min-width:36px}
.ibtn:hover{background:var(--sunk)}
.ibtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.results{position:absolute;right:0;top:calc(100% + 6px);width:min(420px,92vw);max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);box-shadow:0 10px 30px rgb(0 0 0 / .18);padding:6px;z-index:40}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.results button:hover,.results button:focus{background:var(--sunk)}
.results .ar{font-size:1.15rem;line-height:1.5}

/* ---------- genel ---------- */
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px;max-width:1240px;margin:0 auto}
.view[hidden]{display:none!important}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{background:var(--sunk)}
.btn.lal{background:var(--lal);border-color:var(--lal);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;border:1px solid transparent;white-space:nowrap}
.pill.raf{background:var(--raf-soft);color:var(--raf)} .pill.nasb{background:var(--nasb-soft);color:var(--nasb)}
.pill.jar{background:var(--jar-soft);color:var(--jar)} .pill.jazm{background:var(--jazm-soft);color:var(--jazm)}
.pill.tabi,.pill.none{background:var(--sunk);color:var(--muted)}
.pill.lal{background:var(--lal-soft);color:var(--lal)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;z-index:60;font-weight:500;max-width:90vw}

/* ---------- ana sayfa ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:12px 28px;border-bottom:1px solid var(--rule)}
.hero h1{font-size:clamp(2rem,4.4vw,3.3rem)}
.hero h1 .ar{display:block;color:var(--lal);font-size:clamp(2.4rem,5.4vw,4rem);line-height:1.5;font-weight:700}
.hero p{max-width:60ch}
.hundred{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;direction:rtl}
.hundred button{aspect-ratio:1;max-width:100%;min-width:0;border:0;border-radius:5px;cursor:pointer;padding:2px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hundred .n{position:absolute;top:2px;left:4px;font-family:var(--f-body);font-size:.62rem;font-variant-numeric:tabular-nums;opacity:.75;direction:ltr;line-height:1}
.hundred .lb{font-family:var(--f-ar);font-size:clamp(.62rem,1.25vw,.98rem);line-height:1.15;text-align:center;word-break:break-word;padding-top:6px}
.hundred button.amil{background:var(--lal-soft);color:var(--lal)} .hundred button.mamul{background:var(--raf-soft);color:var(--raf)} .hundred button.irab{background:var(--nasb-soft);color:var(--nasb)}
.hundred button.done.amil{background:var(--lal);color:var(--surface)} .hundred button.done.mamul{background:var(--raf);color:var(--surface)} .hundred button.done.irab{background:var(--nasb);color:var(--surface)}
.hundred button:hover{outline:2px solid var(--ink);outline-offset:1px}
.hcap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
@media (max-width:560px){.hundred .lb{font-size:.6rem}.hundred .n{display:none}.hundred .lb{padding-top:0}}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:.88rem}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.babs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:28px}
.bab{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bab .ar{color:var(--lal);font-size:1.5rem;line-height:1.5}
.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:6px;transition:width .4s}
.bab ul{margin:0;padding-left:18px;color:var(--muted);font-size:.92rem}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:28px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:18px;min-width:0}
.panel h3{font-size:1.2rem;margin-bottom:10px}
.quote{border-right:3px solid var(--lal);padding-right:14px;margin:0}
.statrow{display:flex;gap:26px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-disp);font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.1}

/* ---------- dersler ---------- */
.lessons{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.toc{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));max-height:calc(100vh - 90px);overflow:auto;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:10px}
.toc details{border-bottom:1px solid var(--rule);padding-block:4px}
.toc details:last-child{border-bottom:0}
.toc summary{cursor:pointer;font-weight:700;font-family:var(--f-disp);padding:6px;list-style:none;display:flex;justify-content:space-between;gap:8px}
.toc summary::-webkit-details-marker{display:none}
.toc .grp{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 6px 2px}
.toc a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;text-decoration:none;color:var(--ink)}
.toc a:hover{background:var(--sunk)}
.toc a[aria-current="true"]{background:var(--ink);color:var(--surface)}
.toc a .ar{font-size:1.12rem;line-height:1.35}
.toc a .n{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:2ch}
.toc a[aria-current="true"] .n{color:inherit}
.toc a.done .n::after{content:" ✓";color:var(--ok)}
.tocbtn{display:none}
.lesson{min-width:0}
.crumb{font-size:.88rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.lhead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;padding-block:6px 18px;border-bottom:1px solid var(--rule)}
.lhead h2{font-size:clamp(1.5rem,3vw,2rem)}
.lhead .big{font-family:var(--f-ar);font-size:calc(clamp(2.4rem,6vw,3.6rem) * var(--ar-scale));color:var(--lal);line-height:1.4;direction:rtl}
.lhead .no{font-family:var(--f-disp);font-size:.95rem;color:var(--muted)}
.matn{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px 20px;margin-top:18px}
.matn .ar{font-size:calc(1.55rem * var(--ar-scale))}
.sec{margin-top:26px}
.sec>h3{font-size:1.15rem;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.exnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.exnav button{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-family:var(--f-ar);font-size:1rem}
.exnav button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sentence{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:22px 20px 16px;text-align:center}
.sentence .s{font-family:var(--f-ar);direction:rtl;font-size:calc(clamp(1.7rem,4.4vw,2.5rem) * var(--ar-scale));line-height:2.1}
.w{cursor:pointer;border-radius:6px;padding:0 3px;transition:background .15s}
.w:hover{background:var(--sunk)}
.w.sel{background:var(--sunk);box-shadow:inset 0 -2px 0 var(--ink)}
.am{color:var(--lal);font-weight:700}
.mm{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.35em}
.mm.raf{text-decoration-color:var(--raf);color:var(--raf)} .mm.nasb{text-decoration-color:var(--nasb);color:var(--nasb)}
.mm.jar{text-decoration-color:var(--jar);color:var(--jar)} .mm.jazm{text-decoration-color:var(--jazm);color:var(--jazm)} .mm.none{text-decoration-color:var(--raf);color:var(--raf)}
.trl{color:var(--muted);margin-top:6px;font-style:italic;font-family:var(--f-disp)}
.keys{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:12px;font-size:.82rem;color:var(--muted)}
.keys i{font-style:normal;font-weight:700}
.popir{margin-top:14px;text-align:right;background:var(--paper);border-radius:8px;padding:10px 14px}
.tbl{overflow-x:auto;margin-top:14px}
table{border-collapse:collapse;width:100%;background:var(--surface)}
th,td{border:1px solid var(--rule);padding:8px 12px;vertical-align:middle}
th{background:var(--sunk);font-weight:700;color:var(--lal);font-family:var(--f-ar);font-size:1.1rem}
td.ar{font-size:calc(1.25rem * var(--ar-scale));line-height:1.6}
.irab{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.irab .it{display:grid;grid-template-columns:minmax(0,1fr);padding:10px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--rule)}
.irab .it.hl{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.irab .it .ar{font-size:calc(1.22rem * var(--ar-scale));line-height:2}
.irab .it .ar b{color:var(--lal)}
.term{border-bottom:1px dotted var(--muted);cursor:help;position:relative}
.term:hover,.term:focus{background:var(--sunk);outline:none}
.term:hover::after,.term:focus::after{content:attr(data-tr);position:absolute;bottom:calc(100% + 4px);right:50%;transform:translateX(50%);background:var(--ink);color:var(--surface);font-family:var(--f-body);direction:ltr;font-size:.82rem;line-height:1.3;width:max-content;max-width:min(260px,70vw);white-space:normal;text-align:center;padding:5px 9px;border-radius:6px;z-index:5;pointer-events:none}
.trbox{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px 18px}
.trbox p{margin:0 0 6px}
.fn{font-size:.95rem}
.fn ol{margin:0;padding-right:22px}
.fn .ar{font-size:calc(1.1rem * var(--ar-scale))}
.lfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:30px;padding-top:16px;border-top:1px solid var(--rule)}
.note textarea{width:100%;min-height:80px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);padding:10px;resize:vertical}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:700}
.chk input{width:18px;height:18px;accent-color:var(--ok)}
.sigs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sig{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px;text-align:center}
.sig .ar{color:var(--lal);font-size:1.3rem;line-height:1.5}

/* ---------- metin ---------- */
.reader{max-width:860px;margin:0 auto}
.reader .tools2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.page{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:clamp(18px,4vw,44px);box-shadow:0 1px 0 var(--rule)}
.page h2{font-family:var(--f-ar);color:var(--lal);text-align:center;font-size:calc(2rem * var(--ar-scale));margin:26px 0 10px;direction:rtl;line-height:1.6}
.page h3{font-family:var(--f-ar);color:var(--lal);font-size:calc(1.5rem * var(--ar-scale));direction:rtl;margin:20px 0 4px;line-height:1.6}
.page .p{font-family:var(--f-ar);direction:rtl;font-size:calc(1.5rem * var(--ar-scale));line-height:2.15;text-align:justify;margin:0 0 6px}
.page .p .q{color:var(--raf)}
.page .tr{direction:ltr;font-family:var(--f-disp);font-style:italic;color:var(--muted);margin:0 0 14px;font-size:1rem}
.page .go{font-family:var(--f-body);font-size:.8rem;margin-inline-start:8px;border:1px solid var(--rule);border-radius:999px;padding:1px 9px;background:var(--paper);cursor:pointer;vertical-align:middle;direction:ltr}
.page .orn{text-align:center;color:var(--lal);letter-spacing:.6em;margin:18px 0}
.ez{filter:blur(6px);cursor:pointer;transition:filter .2s}
.ez.open{filter:none}

/* ---------- kartlar ---------- */
.cards{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.deckbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.boxes{display:flex;gap:6px;align-items:flex-end;height:46px}
.boxes div{width:34px;background:var(--sunk);border-radius:5px 5px 0 0;position:relative;display:flex;align-items:flex-end;justify-content:center}
.boxes div i{display:block;width:100%;background:var(--raf);border-radius:5px 5px 0 0}
.boxes div span{position:absolute;bottom:-18px;font-size:.72rem;color:var(--muted)}
.flash{perspective:1400px;cursor:pointer;min-height:330px}
.flash .inner{position:relative;min-height:330px;transition:transform .55s;transform-style:preserve-3d}
.flash.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .big{font-family:var(--f-ar);font-size:calc(clamp(2.2rem,7vw,3.4rem) * var(--ar-scale));color:var(--lal);line-height:1.5;direction:rtl}
.face .s{font-family:var(--f-ar);font-size:calc(1.5rem * var(--ar-scale));direction:rtl;line-height:2}
.grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grade button{padding:12px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);cursor:pointer;font-weight:700}
.grade .g1{color:var(--bad)} .grade .g3{color:var(--ok)}
@media (prefers-reduced-motion: reduce){.flash .inner{transition:none}.bar i{transition:none}}

/* ---------- sınav ---------- */
.quiz{max-width:820px;margin:0 auto}
.qset{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.qset fieldset{border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;background:var(--surface);margin:0;min-width:0}
.qset legend{font-weight:700;padding:0 6px;font-family:var(--f-disp)}
.qset label{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.qprog{flex:1;height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--lal)}
.qcard{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:24px}
.qcard .qq{font-family:var(--f-disp);font-size:1.2rem;margin-bottom:14px}
.qcard .s{font-family:var(--f-ar);direction:rtl;font-size:calc(clamp(1.6rem,4vw,2.2rem) * var(--ar-scale));line-height:2.1;text-align:center;margin:8px 0 16px}
.opts{display:grid;gap:8px}
.opts button{text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);cursor:pointer;line-height:1.4}
.opts button.ar{text-align:right;font-size:calc(1.2rem * var(--ar-scale));line-height:1.8}
.opts button:hover:not(:disabled){border-color:var(--ink)}
.opts button.ok{border-color:var(--ok);background:var(--jar-soft)}
.opts button.no{border-color:var(--bad);background:var(--lal-soft)}
.tokbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl}
.tokbtns button{font-family:var(--f-ar);font-size:calc(1.5rem * var(--ar-scale));padding:2px 14px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);cursor:pointer;line-height:1.9}
.tokbtns button.ok{border-color:var(--ok);background:var(--jar-soft)} .tokbtns button.no{border-color:var(--bad);background:var(--lal-soft)}
.fb{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--paper)}
.fb.good{border-left:4px solid var(--ok)} .fb.badf{border-left:4px solid var(--bad)}
.spark{width:100%;height:70px}

/* ---------- sözlük / hakkında ---------- */
.dict{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dict .d{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.dict .d .ar.h{color:var(--lal);font-size:1.5rem;line-height:1.5}
.terms{columns:2;column-gap:28px}
.terms div{break-inside:avoid;display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px solid var(--rule)}
.terms .ar{font-size:1.12rem;line-height:1.6}
.filter{padding:9px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);width:min(360px,100%)}
.mss{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mss .m{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px}
.mss .code{font-family:var(--f-ar);color:var(--lal);font-size:1.8rem;line-height:1;float:right;margin-left:10px}
.works{columns:2;column-gap:24px;padding:0;list-style:none}
.works li{break-inside:avoid;padding:4px 0;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:10px}
.works .ar{font-size:1.1rem;line-height:1.6}
textarea.io{width:100%;min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem;border:1px solid var(--rule);border-radius:8px;background:var(--paper);padding:10px}

/* ---------- duyarlı ---------- */
@media (max-width:960px){
  .hero{grid-template-columns:minmax(0,1fr);gap:24px}
  .babs{grid-template-columns:minmax(0,1fr)}
  .split{grid-template-columns:minmax(0,1fr)}
  .lessons{grid-template-columns:minmax(0,1fr)}
  .toc{position:static;max-height:none}
  .toc[data-collapsed="true"]{display:none}
  .tocbtn{display:inline-flex}
  .dict,.mss{grid-template-columns:minmax(0,1fr)}
  .terms,.works{columns:1}
  .qset{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .brand .ar{display:none}
  .search input{width:38vw}
  .sigs{grid-template-columns:minmax(0,1fr)}
}

 {id:"i2", kind:"huruf", ar:"وَالثَّانِي: الْمُعْرَبُ بِالْحُرُوفِ الْمَحْضَةِ", tr:"2. Sadece harflerle i'râb (isimlerde)", count:3, page:86,
  matn:"وَالثَّانِي: إِمَّا تَامُّ الْإِعْرَابِ، وَهُوَ أَنْ يَكُونَ رَفْعُهُ بِالْوَاوِ، وَنَصْبُهُ بِالْأَلِفِ، وَجَرُّهُ بِالْيَاءِ، وَذَلِكَ الْأَسْمَاءُ السِّتَّةُ [الْمُعْتَلَّةُ] الْمُضَافَةُ إِلَى غَيْرِ يَاءِ الْمُتَكَلِّمِ مُفْرَدَةً مُكَبَّرَةً، وَهِيَ: أَبُوهُ وَأَخُوهُ وَحَمُوهَا وَهَنُوهُ وَفُوهُ وَذُو مَالٍ؛ نَحْوُ: «جَاءَنَا أَبُو الْقَاسِمِ»، وَ«صَدَّقْنَا أَبَا الْقَاسِمِ»، وَ«آمَنَّا بِأَبِي الْقَاسِمِ». وَإِمَّا نَاقِصُ الْإِعْرَابِ، فَهُوَ عَلَى قِسْمَيْنِ: قِسْمٌ رَفْعُهُ بِالْوَاوِ، وَنَصْبُهُ وَجَرُّهُ بِالْيَاءِ، وَذَلِكَ جَمْعُ الْمُذَكَّرِ السَّالِمُ، وَأُولُو، وَعِشْرُونَ وَأَخَوَاتُهَا؛ نَحْوُ: «جَاءَنَا الْمُرْسَلُونَ»، وَ«صَدَّقْنَا الْمُرْسَلِينَ»، وَ«آمَنَّا بِالْمُرْسَلِينَ». وَقِسْمٌ رَفْعُهُ بِالْأَلِفِ، وَنَصْبُهُ وَجَرُّهُ بِالْيَاءِ، وَذَلِكَ التَّثْنِيَةُ، وَاثْنَانِ، وَكِلَا مُضَافًا إِلَى مُضْمَرٍ؛ نَحْوُ: «جَاءَنَا الِاثْنَانِ كِلَاهُمَا»، أَيْ: الْكِتَابُ وَالسُّنَّةُ، وَ«اتَّبَعْنَا الِاثْنَيْنِ كِلَيْهِمَا»، وَ«عَمِلْنَا بِالِاثْنَيْنِ كِلَيْهِمَا».",
  fn:["[الْمُعْتَلَّةُ] زِيَادَةٌ مِنْ (ل).","فِي (ج) وَ(ل) وَ(ف): «وَأَخَوَاتُهُ». وَفِي تُحْفَةِ الْإِخْوَانِ لِلْغَلِيبُولِي «وَأَخَوَاتُهَا» أَيْ: نَظَائِرُهَا، وَهِيَ: ثَلَاثُونَ إِلَى تِسْعِينَ. (ص: ٣١٥)","فِي (ج) وَ(ل): «وَعَلِمْنَا»."],

 {id:"i3", kind:"hadhf1", ar:"وَالثَّالِثُ: الْمُعْرَبُ بِالْحَرَكَاتِ مَعَ الْحَذْفِ", tr:"3. Hareke + hazf ile i'râb (fiillerde)", count:2, page:90,
  matn:"وَالثَّالِثُ: لَا يَكُونُ إِلَّا تَامَّ الْإِعْرَابِ، وَهُوَ قِسْمَانِ: قِسْمٌ رَفْعُهُ بِالضَّمَّةِ، وَنَصْبُهُ بِالْفَتْحَةِ، وَجَزْمُهُ بِحَذْفِ الْحَرَكَةِ، وَهُوَ الْفِعْلُ الْمُضَارِعُ الَّذِي لَمْ يَتَّصِلْ بِآخِرِهِ ضَمِيرٌ، وَهُوَ حَرْفٌ صَحِيحٌ؛ نَحْوُ: «نُحِبُّ أَنْ نُشَفَّعَ وَلَمْ نُحْرَمْ». وَقِسْمٌ رَفْعُهُ بِالضَّمَّةِ، وَنَصْبُهُ بِالْفَتْحَةِ، وَجَزْمُهُ بِحَذْفِ الْآخِرِ، وَذَلِكَ الْمُضَارِعُ الَّذِي لَمْ يَتَّصِلْ بِآخِرِهِ ضَمِيرٌ، وَهُوَ حَرْفُ عِلَّةٍ؛ نَحْوُ: «نَدْعُو اللهَ تَعَالَى أَنْ يَعْفُوَ عَنَّا، وَلَمْ يَرْمِنَا فِي النَّارِ».",

/* ===== MUKADDİME (metnin başı) ===== */
const MUQADDIMA = {
 matn:"بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ. الْحَمْدُ لِلّٰهِ رَبِّ الْعَالَمِينَ، وَالصَّلَاةُ وَالسَّلَامُ عَلَى مُحَمَّدٍ وَآلِهِ أَجْمَعِينَ. وَبَعْدُ، فَاعْلَمْ أَنَّهُ لَا بُدَّ لِكُلِّ طَالِبِ مَعْرِفَةِ الْإِعْرَابِ مِنْ مَعْرِفَةِ مِئَةِ شَيْءٍ، سِتُّونَ مِنْهَا تُسَمَّى: «عَامِلًا»، وَثَلَاثُونَ مِنْهَا تُسَمَّى: «مَعْمُولًا»، وَعَشَرَةٌ مِنْهَا تُسَمَّى: «عَمَلًا» وَ«إِعْرَابًا». فَأُبَيِّنُ لَكَ بِإِذْنِ اللهِ -تَعَالَى- هَذِهِ الثَّلَاثَةَ عَلَى طَرِيقِ الْإِيجَازِ فِي ثَلَاثَةِ أَبْوَابٍ: الْبَابُ الْأَوَّلُ: فِي الْعَامِلِ. الْبَابُ الثَّانِي: فِي الْمَعْمُولِ. الْبَابُ الثَّالِثُ: فِي الْإِعْرَابِ.",
 tr:"Rahmân ve Rahîm olan Allah'ın adıyla. Hamd âlemlerin Rabbi Allah'a; salât ve selâm Muhammed'e ve onun bütün âline olsun. Bundan sonra bil ki i'râbı öğrenmek isteyen herkesin yüz şeyi bilmesi gerekir: Bunlardan altmışına 'âmil', otuzuna 'ma'mûl', onuna da 'amel' ve 'i'râb' denir. Allah Teâlâ'nın izniyle bu üçünü kısaca üç bâbda sana açıklayacağım: Birinci bâb âmil, ikinci bâb ma'mûl, üçüncü bâb i'râb hakkındadır.",

const normTr = s => String(s).toLocaleLowerCase("tr").replace(/[âä]/g,"a").replace(/[îı]/g,"i").replace(/[ûü]/g,"u").replace(/ö/g,"o").replace(/ş/g,"s").replace(/ç/g,"c").replace(/ğ/g,"g").replace(/[''`]/g,"");

/* ---------- amel yardımcıları ---------- */
function amelInfo(code){
  if (!code) return {tr:"—", ar:"", c:"none"};
  const mah = code.endsWith("*"); const base = AMEL[code.replace("*","")] || {tr:code, ar:code, c:"none"};
  return mah ? {tr: base.tr.split(" (")[0] + " (mahallen)", ar: base.ar + " مَحَلًّا", c: base.c} : base;
}
function amelPill(code){ if (code==="tabi") return `<span class="pill tabi">Tâbi' – metbû'una uyar</span>`; const a = amelInfo(code); return `<span class="pill ${a.c}">${esc(a.tr)}</span>`; }

/* ---------- terim ipuçları ---------- */
const termRe = (() => {
  const parts = TERMS.map(([ar]) => strip(ar)).filter(Boolean)
    .sort((a,b)=>b.length-a.length)
    .map(t => t.split("").map(ch => ch===" " ? "\\s+" : ch.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "[\\u064B-\\u065F\\u0670]*").join(""));
  return new RegExp("(" + parts.join("|") + ")", "g");
})();
const termMap = {}; TERMS.forEach(([ar,tr]) => { const k = strip(ar).replace(/\s+/g," "); if (!termMap[k]) termMap[k]=tr; });
function glossify(text){
  const t = A(text);
  let out = "", last = 0;
  t.replace(termRe, (m, _g, off) => {
    out += esc(t.slice(last, off));
    const tr = termMap[strip(m).replace(/\s+/g," ")] || "";
    out += `<span class="term" tabindex="0" data-tr="${esc(tr)}">${esc(m)}</span>`;
    last = off + m.length; return m;
  });
  return out + esc(t.slice(last));
}
function irabHTML(word, text){
  return `<b>${esc(A(word))}:</b> ${glossify(text)}`;
}

/* ---------- cümle işaretleme ---------- */
function marks(ex, amelCode){
  const s = ex.s; const R = [];
  let firstA = -1;
  (ex.a||[]).forEach(a => {
    let i = s.indexOf(a);
    while (i > -1){ const ws = s.lastIndexOf(" ", i-1) + 1; if (i - ws <= 2){ R.push({s:i, e:i+a.length, r:"a"}); if (firstA<0||i<firstA) firstA=i; } i = s.indexOf(a, i+a.length); }
  });
  let ptr = firstA > -1 ? firstA : 0;
  const rowAmels = (ex.rows||[]).map(r => r[2]);
  (ex.m||[]).forEach((m, k) => {
    let i = ex.mLast ? s.lastIndexOf(m) : s.indexOf(m, ptr);
    if (i < 0) i = s.indexOf(m);
    if (i < 0) return;
    // âmil aralığıyla çakışmayan ilk konumu bul
    while (i > -1 && R.some(r => r.r==="a" && i < r.e && i+m.length > r.s && !(r.s===i && r.e===i+m.length && false))){ const nx = s.indexOf(m, i+1); if (nx<0) break; i = nx; }
    let code = ex.case || rowAmels[k] || amelCode || "";
    if (code === "all") code = "";
    if (code === "in") code = k===0 ? "nasb" : "raf";
    if (code === "ls") code = k===0 ? "raf" : "nasb";
    if (code === "j2") code = "jazm";
    if (code === "rn") code = k===0 ? "raf" : "nasb";
    R.push({s:i, e:i+m.length, r:"m", c: amelInfo(code).c});
    ptr = i + m.length;
  });
  return R;
}
function sentenceHTML(ex, amelCode, opts={}){
  const s = ex.s, R = marks(ex, amelCode);
  const words = []; let pos = 0;
  s.split(" ").forEach((w, wi) => { words.push({w, s:pos, e:pos+w.length, i:wi}); pos += w.length + 1; });
  return words.map(wd => {
    let html = "", cur = wd.s;
    const segs = R.filter(r => r.s < wd.e && r.e > wd.s).sort((a,b)=> a.s-b.s || (a.r==="a"?-1:1));
    segs.forEach(r => {
      const a = Math.max(r.s, wd.s), b = Math.min(r.e, wd.e);
      if (a < cur) return;
      html += esc(A(s.slice(cur, a)));
      const cls = r.r==="a" ? "am" : "mm " + r.c;
      html += `<span class="${cls}">${esc(A(s.slice(a,b)))}</span>`;
      cur = b;
    });
    html += esc(A(s.slice(cur, wd.e)));
    return opts.plain ? html : `<span class="w" tabindex="0" data-w="${esc(wd.w)}">${html}</span>`;
  }).join(" ");
}
function matchIr(ex, word){
  const nw = norm(word);
  return (ex.ir||[]).map((r,i)=>({r,i})).filter(({r}) => { const k = norm(r[0]); return k===nw || (k.length>1 && nw.includes(k)) || (nw.length>2 && k.includes(nw)); });
}

}

function sparkline(vals){

    <line x1="${p}" x2="${w-p}" y1="${y(50)}" y2="${y(50)}" stroke="var(--rule)" stroke-dasharray="3 3"/>

    <circle cx="${x(n-1)}" cy="${y(vals[n-1])}" r="4" fill="var(--lal)"/>
    <text x="${Math.min(x(n-1), w-30)}" y="${Math.max(y(vals[n-1])-8, 12)}" fill="var(--ink)" font-size="12" font-weight="700">${vals[n-1]}</text></svg>`;
}

function renderReader(){

  function quoted(s){
    let t = A(s);
    let h = esc(t).replace(/«([^»]+)»/g, '«<span class="q">$1</span>»').replace(/﴿([^﴾]+)﴾/g, '﴿<span class="q">$1</span>﴾');
    if (RD.ez) return t.split(" ").map(w => `<span class="ez">${esc(w)}</span>`).join(" ");

    <div class="page">
      <h2>${A("بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ")}</h2>
      ${P(MUQADDIMA.matn.replace(/^بِسْمِ[^.]+\.\s*/,""), null, MUQADDIMA.tr)}${FN(MUQADDIMA.fn)}
      <div class="orn">✻ ✻ ✻</div>`;
  BABS.forEach(b => {
    h += `<h2>${A(b.ar)}</h2>${P(b.matn, null, b.trIntro)}${FN(b.fn)}`;

      h += FN(g.fn);
      if (b.no < 3) g.items.forEach(it => {
        if (it.pre) h += P(it.pre);
        if (it.matn) h += P(it.matn, it.id, `${it.tr}${it.mana?" — "+it.mana:""}. ${it.ex? it.ex.map(e=>e.t).join(" / "):""}`);
        if (it.post) h += P(it.post);
        h += FN(it.fn);
      });
      if (g.after) h += P(g.after);
      if (g.post) h += P(g.post);
    });
    h += `<div class="orn">✻ ✻ ✻</div>`;
  });
  h += `</div></div>`;
  $("#v-metin").innerHTML = h;
  $("#rTr").onclick = () => { RD.tr=!RD.tr; renderReader(); };

  if ($("#rOpen")) $("#rOpen").onclick = () => $$(".ez").forEach(x=>x.classList.add("open"));

  $$(".ez").forEach(x => x.onclick = () => x.classList.toggle("open"));

/* ===================== KARTLAR (Leitner) ===================== */
let CK = {scope:"all", cur:null, flip:false};
function deck(){ return ITEMS.filter(r => CK.scope==="all" || String(r.b.no)===CK.scope || (CK.scope==="star" && S.stars[r.it.id])); }
function nextCard(){
  const d = deck(); if (!d.length) return null;
  const weighted = []; d.forEach(r => { const bx = S.box[r.it.id]||1; const w = [0,16,8,4,2,1][bx]; for (let i=0;i<w;i++) weighted.push(r); });
  let c; let guard = 0; do { c = pick(weighted); } while (CK.cur && c.it.id===CK.cur.it.id && d.length>1 && guard++<20);
  return c;
}
function cardFront(r){
  const ex = r.it.ex && r.it.ex[0];
  return `<div class="label">${esc(r.g.tr)}</div><div class="big">${A(r.it.ar)}</div>${ex?`<div class="s">${sentenceHTML(ex, r.it.amel||r.g.amel, {plain:true})}</div>`:""}<div class="small muted">Kartı çevirmek için dokun</div>`;
}
function cardBack(r){
  const it = r.it, ex = it.ex && it.ex[0];
  let body = `<h3>${esc(it.tr)}</h3>`;
  if (it.mana) body += `<div>${esc(it.mana)}</div>`;
  if (r.b.no<3) body += `<div>${amelPill(it.amel||r.g.amel)}</div>`;
  if (it.sig) body += `<div class="ar" style="font-size:1.2rem">${it.sig.map(A).join(" · ")}</div><div class="small muted">ref' · nasb · ${it.id.match(/^i[34]/)?"cezm":"cer"}</div>`;
  if (ex) body += `<div class="trl">${esc(ex.t)}</div>`;
  if (ex && ex.rows) body += `<div class="small">Ma'mûl: <span class="ar" style="font-size:1.15rem">${ex.rows.map(x=>A(x[1])).join("، ")}</span></div>`;
  return body;
}
function renderCards(){
  if (!CK.cur) CK.cur = nextCard();
  const d = deck(); const counts=[0,0,0,0,0,0]; d.forEach(r => counts[S.box[r.it.id]||1]++);
  const mx = Math.max(1,...counts);
  const r = CK.cur;
  $("#v-kart").innerHTML = `<div class="cards">
    <div class="deckbar">
      <div><h2 style="font-size:1.6rem">Tekrar kartları</h2><p class="small muted" style="margin:4px 0 0">Leitner usulü: bildiğin kart üst kutuya çıkar ve daha seyrek gelir; bilemediğin 1. kutuya döner.</p></div>
      <select id="ckScope" class="filter" style="width:auto" aria-label="Deste">
        <option value="all">Bütün kitap (${ITEMS.length})</option><option value="1">1. bâb: Âmiller</option><option value="2">2. bâb: Ma'mûller</option><option value="3">3. bâb: İ'râb</option><option value="star">Yıldızlılar</option>
      </select>
    </div>
    <div class="row" style="justify-content:center;gap:24px;padding-bottom:16px">
      <div class="boxes" aria-label="Kutulardaki kart sayısı">${[1,2,3,4,5].map(i=>`<div title="${i}. kutu: ${counts[i]} kart" style="height:46px"><i style="height:${Math.max(3,counts[i]/mx*46)}px;opacity:${.35+i*.13}"></i><span>${i}</span></div>`).join("")}</div>
      <div class="small muted">${d.length} kart · ${counts[4]+counts[5]} pekişmiş</div>
    </div>
    ${r ? `<div class="flash ${CK.flip?"flip":""}" id="flash" tabindex="0" role="button" aria-label="Kartı çevir">
      <div class="inner"><div class="face">${cardFront(r)}</div><div class="face back">${cardBack(r)}</div></div></div>
    <div class="grade" ${CK.flip?"":"hidden"} id="grade">
      <button class="g1" data-g="1">Bilemedim</button><button data-g="2">Zorlandım</button><button class="g3" data-g="3">Bildim</button>
    </div>
    <div class="row" style="justify-content:space-between"><span class="small muted">Bu kart: ${S.box[r.it.id]||1}. kutu</span><button class="btn ghost small" data-go="ders" data-id="${r.it.id}">Dersini aç</button></div>`
    : `<div class="panel"><p>Bu destede kart yok. Yıldızlı destesi için derslerde ☆ işaretini kullan.</p></div>`}
  </div>`;
  $("#ckScope").value = CK.scope;
  $("#ckScope").onchange = e => { CK.scope = e.target.value; CK.cur = null; CK.flip = false; renderCards(); };
  if (!r) return;
  const flip = () => { CK.flip = !CK.flip; $("#flash").classList.toggle("flip", CK.flip); $("#grade").hidden = !CK.flip; };
  $("#flash").onclick = flip; $("#flash").onkeydown = e => { if (e.key===" "||e.key==="Enter"){ e.preventDefault(); flip(); } };
  $$("#grade button").forEach(b => b.onclick = () => {
    const g = +b.dataset.g, id = r.it.id, bx = S.box[id]||1;
    S.box[id] = g===1 ? 1 : g===2 ? bx : Math.min(5, bx+1);
    if (S.box[id] >= 4) S.learned[id] = true;
    save(); CK.cur = nextCard(); CK.flip = false; renderCards();
  });
}

/* ===================== SINAV ===================== */
const QTYPES = [
  {id:"amel", tr:"Âmilin ameli (ne yapar?)", b:[1]},
  {id:"nev", tr:"Âmilin nev'i (hangi gruptan?)", b:[1]},
  {id:"findA", tr:"Cümlede âmili bul", b:[1,2]},
  {id:"findM", tr:"Cümlede ma'mûlü bul", b:[1,2]},
  {id:"irab", tr:"Kelimenin i'râbı", b:[1,2,3]},
  {id:"mamul", tr:"Ma'mûlün türü", b:[2]},
  {id:"alamet", tr:"İ'râb alâmeti", b:[3]},
  {id:"mana", tr:"Cümlenin Türkçe anlamı", b:[1,2,3]}
];
let QZ = {scope:"all", n:10, types: QTYPES.map(t=>t.id), qs:null, i:0, score:0, answered:false, wrong:[]};
function poolFor(bno){ return ITEMS.filter(r => QZ.scope==="all" || String(r.b.no)===QZ.scope).filter(r => !bno || bno.includes(r.b.no)); }
function makeQ(type){
  const T = QTYPES.find(t=>t.id===type); const pool = poolFor(T.b); if (!pool.length) return null;
  const r = pick(pool), it = r.it, ex = it.ex && pick(it.ex);
  if (type==="amel"){
    const right = amelInfo(it.amel).tr; const all = [...new Set(Object.keys(AMEL).map(k=>AMEL[k].tr))];
    return {type, rec:r, q:`<span class="ar" style="font-size:1.8rem;color:var(--lal)">${A(it.ar)}</span> ne amel eder?`, opts: shuffle([right, ...shuffle(all.filter(x=>x!==right)).slice(0,3)]), right, why:`${it.tr}: ${right}.`};
  }
  if (type==="nev"){
    const right = r.g.tr; const all = BABS[0].groups.map(g=>g.tr);
    return {type, rec:r, q:`<span class="ar" style="font-size:1.8rem;color:var(--lal)">${A(it.ar)}</span> hangi gruptandır?`, opts: shuffle([right, ...shuffle(all.filter(x=>x!==right)).slice(0,3)]), right, why:`${it.tr} → ${right}`};
  }
  if ((type==="findA"||type==="findM") && ex){
    const R = marks(ex, it.amel||r.g.amel).filter(m => m.r===(type==="findA"?"a":"m"));
    if (!R.length) return null;
    const words=[]; let p=0; ex.s.split(" ").forEach(w=>{words.push({w,s:p,e:p+w.length}); p+=w.length+1;});
    if (words.length<2) return null;
    const right = words.map((w,i)=>R.some(m=>m.s<w.e&&m.e>w.s)?i:-1).filter(i=>i>-1);
    return {type, rec:r, ex, words, right, q: type==="findA" ? "Bu cümledeki <b style='color:var(--lal)'>âmil</b> hangi kelimede?" : "Bu cümledeki <b style='color:var(--raf)'>ma'mûl</b> hangi kelimede? (birden fazlaysa birini seçmen yeterli)", why: `Âmil: ${ (ex.rows||[]).map(x=>strip(x[0])).filter(Boolean).join("، ")||"—" } · Ma'mûl: ${(ex.rows||[]).map(x=>strip(x[1])).join("، ")||"—"}`};
  }
  if (type==="irab" && ex && ex.ir && ex.ir.length){
    const target = pick(ex.ir); const others = shuffle(ITEMS.flatMap(x=>(x.it.ex||[]).flatMap(e=>(e.ir||[]).map(i=>i[1])))).filter(t=>norm(t)!==norm(target[1]));
    const uniq = [...new Set(others)].slice(0,3);
    return {type, rec:r, ex, q:`Bu cümlede <b class="ar" style="font-size:1.4rem">«${A(target[0])}»</b> kelimesinin i'râbı hangisidir?`, opts: shuffle([target[1], ...uniq]), right: target[1], ar:true, showS:true, why:`${strip(target[0])}: ${strip(target[1])}`};
  }
  if (type==="mamul" && ex){
    const right = it.tr; const all = BABS[1].groups.flatMap(g=>g.items.map(i=>i.tr));
    return {type, rec:r, ex, showS:true, mark:"m", q:"Renkli işaretli kelime hangi ma'mûldür?", opts: shuffle([right, ...shuffle(all.filter(x=>x!==right)).slice(0,3)]), right, why:`${right} — ${r.g.tr}`};
  }
  if (type==="alamet" && ex && it.sig && ["raf","nasb","jar"].includes(ex.case)){
    const k = {raf:0,nasb:1,jar:2}[ex.case]; const right = strip(it.sig[k]);
    const all = BABS[2].alamat.map(a=>strip(a.ar));
    return {type, rec:r, ex, showS:true, mark:"m", q:"İşaretli kelimenin i'râb alâmeti nedir?", opts: shuffle([right, ...shuffle(all.filter(x=>x!==right)).slice(0,3)]), right, ar:true, why:`${it.tr}: ${["ref'","nasb","cer"][k]} hâlinde alâmet ${right}.`};
  }
  if (type==="mana" && ex){
    const right = ex.t; const all = ITEMS.flatMap(x=>(x.it.ex||[]).map(e=>e.t)).filter(t=>t!==right);
    return {type, rec:r, ex, showS:true, q:"Bu cümlenin Türkçe anlamı hangisidir?", opts: shuffle([right, ...shuffle([...new Set(all)]).slice(0,3)]), right, why:right};
  }
  return null;
}
function buildQuiz(){
  const qs = []; let guard = 0;
  while (qs.length < QZ.n && guard++ < 400){
    const q = makeQ(pick(QZ.types)); if (q && !qs.some(x=>x.rec===q.rec && x.type===q.type)) qs.push(q);
  }
  return qs;
}
function renderQuiz(){
  const v = $("#v-sinav");
  if (!QZ.qs){
    v.innerHTML = `<div class="quiz"><h2 style="font-size:1.6rem;margin-bottom:6px">Sınav</h2><p class="muted" style="margin-top:0">Sorular kitabın kendi örneklerinden her seferinde yeniden üretilir.</p>
      <div class="qset">
        <fieldset><legend>Kapsam</legend>
          ${[["all","Bütün kitap"],["1","1. bâb – Âmil"],["2","2. bâb – Ma'mûl"],["3","3. bâb – İ'râb"]].map(([k,t])=>`<label><input type="radio" name="qsc" value="${k}" ${QZ.scope===k?"checked":""}> ${t}</label>`).join("")}
          <label style="margin-top:8px">Soru sayısı <select id="qn" class="filter" style="width:auto">${[10,20,30].map(n=>`<option ${QZ.n===n?"selected":""}>${n}</option>`).join("")}</select></label>
        </fieldset>
        <fieldset><legend>Soru türleri</legend>${QTYPES.map(t=>`<label><input type="checkbox" name="qt" value="${t.id}" ${QZ.types.includes(t.id)?"checked":""}> ${t.tr} <span class="small muted">(${t.b.map(x=>x+".").join(" ")} bâb)</span></label>`).join("")}</fieldset>
      </div>
      <div class="row" style="margin-top:16px"><button class="btn lal" id="qStart">Sınavı başlat</button><span class="small muted" id="qWarn"></span></div>
      ${S.hist.length?`<div class="panel" style="margin-top:22px"><h3>Geçmiş</h3>${sparkline(S.hist.slice(-12).map(h=>Math.round(h.score/h.total*100)))}<p class="small muted">${S.hist.slice(-5).reverse().map(h=>`${new Date(h.at).toLocaleDateString("tr-TR")}: ${h.score}/${h.total}`).join(" · ")}</p></div>`:""}
    </div>`;
    $$("input[name=qsc]").forEach(x=>x.onchange=()=>QZ.scope=x.value);
    $("#qn").onchange = e => QZ.n = +e.target.value;
    $$("input[name=qt]").forEach(x=>x.onchange=()=>QZ.types=$$("input[name=qt]:checked").map(y=>y.value));
    $("#qStart").onclick = () => {
      if (!QZ.types.length){ $("#qWarn").textContent = "En az bir soru türü seç."; return; }
      const qs = buildQuiz(); if (!qs.length){ $("#qWarn").textContent = "Bu kapsamla seçilen türlerde soru üretilemiyor. Kapsamı genişlet ya da başka tür seç."; return; }
      Object.assign(QZ, {qs, i:0, score:0, answered:false, wrong:[], saved:false}); renderQuiz();
    };
    return;
  }
  if (QZ.i >= QZ.qs.length){
    const tot = QZ.qs.length, pct = Math.round(QZ.score/tot*100);
    if (!QZ.saved){ S.hist.push({at:Date.now(), score:QZ.score, total:tot}); S.hist = S.hist.slice(-50); QZ.wrong.forEach(q => S.box[q.rec.it.id] = 1); save(); QZ.saved = true; }
    v.innerHTML = `<div class="quiz"><div class="qcard" style="text-align:center">
      <div class="label">Sonuç</div><div style="font-family:var(--f-disp);font-size:3.4rem;font-weight:700;color:${pct>=70?"var(--ok)":"var(--lal)"}">${QZ.score} / ${tot}</div>
      <p>${pct>=90?"Mükemmel! Bu konular yerine oturmuş.":pct>=70?"Güzel; birkaç konuyu tekrar etmek yeter.":"Tekrar zamanı: yanlış yaptığın konular kart destesinde 1. kutuya alındı."}</p>
      ${QZ.wrong.length?`<p class="label" style="margin-top:14px">Tekrar edilecek dersler</p><div class="row" style="justify-content:center">${[...new Set(QZ.wrong.map(q=>q.rec.it.id))].map(id=>`<button class="btn ghost small" data-go="ders" data-id="${id}">${esc(BYID[id].it.tr)}</button>`).join("")}</div>`:""}
      <div class="row" style="justify-content:center;margin-top:18px"><button class="btn lal" id="qAgain">Yeni sınav</button><button class="btn ghost" id="qSet">Ayarlar</button><button class="btn ghost" data-go="kart">Kartlara geç</button></div>
    </div></div>`;
    $("#qAgain").onclick = () => { Object.assign(QZ,{qs:buildQuiz(), i:0, score:0, answered:false, wrong:[], saved:false}); renderQuiz(); };
    $("#qSet").onclick = () => { QZ.qs = null; QZ.saved=false; renderQuiz(); };
    return;
  }
  const q = QZ.qs[QZ.i];
  let body = "";
  if (q.type==="findA"||q.type==="findM"){
    body = `<div class="tokbtns" dir="rtl">${q.words.map((w,i)=>`<button data-tok="${i}">${esc(A(w.w))}</button>`).join("")}</div><div class="trl" style="text-align:center">${esc(q.ex.t)}</div>`;
  } else {
    if (q.showS) body += `<div class="s">${q.mark ? sentenceHTML({...q.ex, a:[]}, q.rec.it.amel||q.rec.g.amel, {plain:true}) : esc(A(q.ex.s))}</div>`;
    body += `<div class="opts">${q.opts.map((o,i)=>`<button data-opt="${i}" class="${q.ar?"ar":""}">${q.ar?esc(A(o)):esc(o)}</button>`).join("")}</div>`;
  }
  v.innerHTML = `<div class="quiz"><div class="qhead"><span class="small muted">Soru ${QZ.i+1} / ${QZ.qs.length}</span><div class="qprog"><i style="width:${QZ.i/QZ.qs.length*100}%"></i></div><span class="small"><b>${QZ.score}</b> doğru</span></div>
    <div class="qcard"><div class="label">${esc(QTYPES.find(t=>t.id===q.type).tr)}</div><div class="qq">${q.q}</div>${body}<div id="fb"></div></div>
    <div class="row" style="justify-content:space-between;margin-top:12px"><button class="btn ghost small" id="qQuit">Sınavı bitir</button><button class="btn" id="qNext" hidden>Sonraki →</button></div></div>`;
  const finish = ok => {
    QZ.answered = true; if (ok) QZ.score++; else QZ.wrong.push(q);
    $("#fb").innerHTML = `<div class="fb ${ok?"good":"badf"}"><b>${ok?"Doğru.":"Yanlış."}</b> <span class="${q.type==="irab"?"ar":""}">${esc(q.why)}</span> <button class="go btn ghost small" data-go="ders" data-id="${q.rec.it.id}" style="margin-inline-start:8px">Derse git</button></div>`;
    $("#qNext").hidden = false; $("#qNext").focus();
  };
  $$("[data-opt]").forEach(b => b.onclick = () => {
    if (QZ.answered) return; const ok = q.opts[+b.dataset.opt] === q.right;
    $$("[data-opt]").forEach(x => { x.disabled = true; if (q.opts[+x.dataset.opt]===q.right) x.classList.add("ok"); });
    if (!ok) b.classList.add("no"); finish(ok);
  });
  $$("[data-tok]").forEach(b => b.onclick = () => {
    if (QZ.answered) return; const ok = q.right.includes(+b.dataset.tok);
    $$("[data-tok]").forEach(x => { x.disabled = true; if (q.right.includes(+x.dataset.tok)) x.classList.add("ok"); });
    if (!ok) b.classList.add("no"); finish(ok);
  });
  $("#qNext").onclick = () => { QZ.i++; QZ.answered=false; renderQuiz(); };
  $("#qQuit").onclick = () => { QZ.qs = QZ.qs.slice(0, QZ.i + (QZ.answered?1:0)); if (!QZ.qs.length){ QZ.qs=null; } QZ.i = QZ.qs ? QZ.qs.length : 0; renderQuiz(); };
}

    <div class="dict">${defs.map(r=>`<div class="d"><div class="row" style="justify-content:space-between"><button class="btn ghost small" data-go="ders" data-id="${r.it.id}">${esc(r.it.tr)}</button><span class="ar h">${A(r.it.ar)}</span></div><div class="ar" style="font-size:1.12rem">${A(r.it.def)}</div></div>`).join("")||"<p class='muted'>Sonuç yok.</p>"}</div>
    <h3 style="margin:26px 0 10px">İ'râb terimleri <span class="small muted">(${terms.length})</span></h3>
    <div class="terms">${terms.map(([a,t])=>`<div><span>${esc(t)}</span><span class="ar">${A(a)}</span></div>`).join("")}</div>`;
  const inp = $("#dq"); inp.oninput = () => { DQ = inp.value; const p = inp.selectionStart; renderDict(); const n=$("#dq"); n.focus(); n.setSelectionRange(p,p); };

/* ===================== ARAMA ===================== */
const IDX = [];
ITEMS.forEach(r => {
  IDX.push({id:r.it.id, kind:"Ders", tr:r.it.tr, ar:r.it.ar, hay: norm(r.it.ar)+" "+normTr(r.it.tr+" "+(r.it.mana||"")+" "+r.g.tr)});
  (r.it.ex||[]).forEach(e => IDX.push({id:r.it.id, kind:"Misal", tr:e.t, ar:e.s, hay: norm(e.s)+" "+normTr(e.t)}));
});
TARIFAT.forEach(t => IDX.push({view:"sozluk", kind:"Ta'rîf", tr:t.tr, ar:t.ar, hay: norm(t.ar)+" "+normTr(t.tr+" "+t.trDef)}));
const qIn = $("#q"), res = $("#results");
qIn.oninput = () => {
  const q = qIn.value.trim(); if (q.length < 2){ res.hidden = true; return; }
  const nq = /[؀-ۿ]/.test(q) ? norm(q) : normTr(q);
  const hits = IDX.filter(x => x.hay.includes(nq)).slice(0, 30);
  res.innerHTML = hits.length ? hits.map(h=>`<button ${h.view?`data-go="${h.view}"`:`data-go="ders" data-id="${h.id}"`}><span class="label">${h.kind}</span><div class="ar">${esc(A(h.ar))}</div><div class="small">${esc(h.tr)}</div></button>`).join("") : `<div class="small muted" style="padding:10px">“${esc(q)}” için sonuç yok.</div>`;
  res.hidden = false;
};
qIn.onkeydown = e => { if (e.key==="Escape"){ res.hidden=true; qIn.blur(); } if (e.key==="Enter"){ const b = res.querySelector("button"); if (b) b.click(); } };
document.addEventListener("click", e => { if (!e.target.closest(".search")) res.hidden = true; else if (e.target.closest(".results button")){ res.hidden = true; qIn.value=""; } });

window.__AV = {ITEMS, marks};
applySettings();

go(h0 || "ana", undefined, false);
})();
