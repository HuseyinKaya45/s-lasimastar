:root {
  --baslik: "Cormorant Garamond", Georgia, serif;
  --govde: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --arap: "Scheherazade New", "Amiri", "Traditional Arabic", serif;
  --bg: #f6f1e6; --yuzey: #fffdf7; --yumusak: #efe7d6; --cizgi: #e2d8c3;
  --murekkep: #2a2823; --soluk: #6d675b; --vurgu: #1e6b58; --vurgu-acik: #d7ebe4; --altin: #a8781f; --altin-acik: #f6e7c4;
  --dogru: #2c7a4b; --dogru-acik: #dcf0e2; --yanlis: #b23c2a; --yanlis-acik: #f8e0da; --karaoke: #fbe39a;
  --golge: 0 1px 2px rgba(60, 45, 20, .06), 0 6px 18px rgba(60, 45, 20, .07);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141716; --yuzey: #1d2120; --yumusak: #252a29; --cizgi: #343b39;
    --murekkep: #ebe6da; --soluk: #a49f93; --vurgu: #63c4a8; --vurgu-acik: #1f3a33; --altin: #e2b35a; --altin-acik: #3a3020;
    --dogru: #6fcf91; --dogru-acik: #1e3a28; --yanlis: #f08672; --yanlis-acik: #43231d; --karaoke: #4d4216;
    --golge: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  --bg: #141716; --yuzey: #1d2120; --yumusak: #252a29; --cizgi: #343b39;
  --murekkep: #ebe6da; --soluk: #a49f93; --vurgu: #63c4a8; --vurgu-acik: #1f3a33; --altin: #e2b35a; --altin-acik: #3a3020;
  --dogru: #6fcf91; --dogru-acik: #1e3a28; --yanlis: #f08672; --yanlis-acik: #43231d; --karaoke: #4d4216;
  --golge: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--murekkep); font: 17px/1.55 var(--govde); }
button, textarea, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.ar { font-family: var(--arap); direction: rtl; unicode-bidi: isolate; }
.sar { font-family: var(--arap); font-size: 1.25em; direction: rtl; unicode-bidi: isolate; }
.ar-ic { font-family: var(--arap); font-size: 1.2em; direction: rtl; unicode-bidi: isolate; }
.soluk { color: var(--soluk); }
.kucuk { font-size: .88rem; }
h1, h2, h3 { font-family: var(--baslik); font-weight: 700; line-height: 1.15; margin: 0; }

/* üst bölüm */
.ust { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); background: var(--bg); border-bottom: 1px solid var(--cizgi); }
.ust-ic { max-width: 1040px; margin: 0 auto; padding: 10px 16px 0; }
.ust-satir { display: flex; align-items: center; gap: 12px; }
.logo { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1; }
.logo h1 { font-size: 1.35rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo .ar { font-size: 1.3rem; color: var(--vurgu); white-space: nowrap; }
.puan { display: flex; align-items: center; gap: 6px; background: var(--altin-acik); color: var(--altin); border-radius: 999px; padding: 3px 12px; font-weight: 700; font-size: .95rem; white-space: nowrap; }
.ikon-btn { border: 1px solid var(--cizgi); background: var(--yuzey); border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; font-size: 1.05rem; }
.sekmeler { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
.sekmeler::-webkit-scrollbar { display: none; }
.sekme { border: 0; background: none; padding: 8px 12px 9px; border-bottom: 3px solid transparent; white-space: nowrap; color: var(--soluk); font-weight: 600; font-size: .95rem; display: flex; flex-direction: column; align-items: center; gap: 0; }
.sekme small { font-family: var(--arap); font-weight: 400; font-size: .85rem; line-height: 1.2; }
.sekme[aria-selected="true"] { color: var(--vurgu); border-bottom-color: var(--vurgu); }
.sekme .nokta { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--dogru); margin-left: 4px; vertical-align: middle; }

main { max-width: 1040px; margin: 0 auto; padding: 18px 16px 80px; }
.kart { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 16px; padding: 18px 20px; box-shadow: var(--golge); margin-bottom: 18px; }
.kart > h2 { font-size: 1.55rem; margin-bottom: 4px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.kart > h2 .ar { font-size: 1.3rem; color: var(--vurgu); font-weight: 400; }
.kart > .aciklama { color: var(--soluk); margin: 2px 0 14px; }
.yigin > * + * { margin-top: 12px; }
.btn { border: 1px solid var(--cizgi); background: var(--yuzey); border-radius: 10px; padding: 7px 14px; font-weight: 600; font-size: .95rem; }
.btn:hover { border-color: var(--vurgu); }
.btn.dolu { background: var(--vurgu); border-color: var(--vurgu); color: var(--yuzey); }
.btn.kucuk { padding: 4px 10px; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: default; }
.satir-btn { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
textarea, input[type="text"] { width: 100%; border: 1px solid var(--cizgi); border-radius: 10px; background: var(--bg); padding: 9px 12px; resize: vertical; }
textarea.ar, input.ar { font-size: 1.35rem; line-height: 1.8; }
textarea:focus, input:focus, button:focus-visible { outline: 2px solid var(--vurgu); outline-offset: 1px; }
.not { background: var(--altin-acik); border-radius: 12px; padding: 10px 14px; font-size: .95rem; }
.not b { color: var(--altin); }
.ileride { display: inline-block; font-size: .78rem; font-weight: 700; color: var(--altin); border: 1px solid var(--altin); border-radius: 6px; padding: 0 6px; margin-inline-start: 4px; }

/* ayarlar */
.ayarlar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.ayar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ayar .lbl { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--soluk); }
.seg { display: inline-flex; border: 1px solid var(--cizgi); border-radius: 10px; overflow: hidden; background: var(--yuzey); }
.seg button { border: 0; background: none; padding: 5px 11px; font-size: .88rem; font-weight: 600; color: var(--soluk); }
.seg button + button { border-inline-start: 1px solid var(--cizgi); }
.seg button[aria-pressed="true"] { background: var(--vurgu); color: var(--yuzey); }
.anahtar { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; font-weight: 600; cursor: pointer; user-select: none; }
.anahtar input { accent-color: var(--vurgu); width: 17px; height: 17px; }

/* oynatıcı */
.oynatici { position: sticky; top: var(--ust-h, 96px); z-index: 10; background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 16px; box-shadow: var(--golge); padding: 10px 14px; margin-bottom: 16px; }
.oy-ust { display: flex; align-items: center; gap: 10px; }
.oy-btn { border: 0; background: var(--yumusak); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 1rem; flex: none; }
.oy-btn.buyuk { width: 50px; height: 50px; background: var(--vurgu); color: var(--yuzey); font-size: 1.25rem; }
.oy-orta { flex: 1; min-width: 0; }
.oy-orta input[type="range"] { width: 100%; accent-color: var(--vurgu); margin: 0; }
.oy-zaman { display: flex; justify-content: space-between; font-size: .8rem; color: var(--soluk); font-variant-numeric: tabular-nums; }
.oy-alt { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 8px; }
.tekrar-kutu { display: flex; align-items: center; gap: 10px; margin-top: 8px; background: var(--altin-acik); border-radius: 10px; padding: 8px 12px; font-weight: 600; }
.tekrar-cubuk { flex: 1; height: 6px; background: var(--cizgi); border-radius: 3px; overflow: hidden; }
.tekrar-cubuk i { display: block; height: 100%; width: 0; background: var(--altin); }
.p-atla { display: flex; gap: 4px; flex-wrap: wrap; }
.p-atla button { border: 1px solid var(--cizgi); background: var(--yuzey); border-radius: 8px; min-width: 30px; height: 28px; font-size: .85rem; font-weight: 700; color: var(--soluk); }
.p-atla button.aktif { background: var(--vurgu-acik); color: var(--vurgu); border-color: var(--vurgu); }

/* okuma metni */
.paragraf { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 16px; padding: 14px 18px 16px; margin-bottom: 14px; box-shadow: var(--golge); scroll-margin-top: 220px; }
.p-bas { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.p-no { width: 30px; height: 30px; border-radius: 50%; background: var(--vurgu); color: var(--yuzey); display: grid; place-items: center; font-weight: 700; flex: none; }
.p-bas h3 { font-size: 1.3rem; flex: 1; min-width: 160px; }
.kelime-cip { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.cip { display: inline-flex; align-items: baseline; gap: 6px; background: var(--yumusak); border-radius: 8px; padding: 2px 9px; font-size: .88rem; }
.cip .ar { font-size: 1.15rem; }
details > summary { cursor: pointer; color: var(--soluk); font-size: .92rem; font-weight: 600; }
.birim { display: flex; gap: 10px; align-items: flex-start; padding: 7px 8px; border-radius: 12px; cursor: pointer; transition: background .2s; }
.birim + .birim { border-top: 1px dashed var(--cizgi); }
.birim:hover { background: var(--yumusak); }
.birim.calan { background: var(--karaoke); }
.birim.dinlendi .bcal { color: var(--dogru); }

.kel { border: 0; background: none; font: inherit; color: inherit; padding: 0 2px; border-radius: 6px; cursor: pointer; }

const SES_AUDIO={/*__SES__*/};
const sesKey=t=>String(t).normalize('NFC').replace(/[ـ‍]/g,'').replace(/\s+/g,' ').trim();

function sesVoice(){if(!('speechSynthesis' in window))return null;try{return speechSynthesis.getVoices().find(v=>/^ar([-_]|$)/i.test(v.lang))||null;}catch(e){return null;}}

function sesStop(){try{if(SES_A){SES_A.pause();SES_A=null;}if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}}
function sesPlay(t,onend,warn){
  sesStop();let done=false;const fin=()=>{if(!done){done=true;if(onend)onend();}};
  const d=SES_AUDIO[sesKey(t)];

   ["أَمّا اليَوْمَ، فَقَدْ أَصْبَحَ التَّعْليمُ حَقًّا لِكُلِّ مُواطِنٍ؛ فَكَثُرَ عَدَدُ الطُّلّابِ، وَانْتَشَرَتِ المَدارِسُ في كُلِّ مَكانٍ، وَشاعَ القَوْلُ: «التَّعْليمُ كَالماءِ وَالهَواءِ».", "Bugün ise eğitim her vatandaşın hakkı oldu; öğrenci sayısı arttı, okullar her yere yayıldı ve “Eğitim su ve hava gibidir” sözü yaygınlaştı.", "m57-2"]],
  [["كانَ طُلّابُ العِلْمِ -في الماضي- يُسافِرونَ مِنْ بَلَدٍ إِلى بَلَدٍ؛ لِطَلَبِ العِلْمِ، وَكانوا يُواجِهونَ في سَفَرِهِمْ كَثيرًا مِنَ التَّعَبِ؛ فَكانوا يَرْكَبونَ الجِمالَ أَيّامًا وَأَشْهُرًا.", "Geçmişte ilim talebeleri ilim tahsil etmek için ülkeden ülkeye yolculuk eder, yolculuklarında çok yorgunlukla karşılaşırlardı; günlerce, aylarca deveye binerlerdi.", "m57-3"]],
  [["أَمّا اليَوْمَ، فَالمَدارِسُ وَالجامِعاتُ كَثيرَةٌ، في كُلِّ مَدينَةٍ وَقَرْيَةٍ تَقْريبًا، حَيْثُ يَذْهَبُ الطّالِبُ إِلى مَدْرَسَتِهِ، أَوْ جامِعَتِهِ بِالسَّيّارَةِ، أَوْ سَيْرًا عَلى الأَقْدامِ.", "Bugün ise okullar ve üniversiteler hemen her şehirde ve köyde çoktur; öğrenci okuluna ya da üniversitesine arabayla veya yürüyerek gider.", "m57-4"],
   ["وَمِنْ ناحِيَةٍ أُخْرى، يَسْتَطيعُ الطّالِبُ أَنْ يَتَعَلَّمَ، وَهُوَ في بَيْتِهِ عَنْ طَريقِ الشَّبَكَةِ الدَّوْلِيَّةِ.", "Öte yandan öğrenci evindeyken internet aracılığıyla öğrenebilir.", "m57-5"]],
  [["مِنَ الاخْتِلافاتِ أَيْضًا، أَنَّ المُعَلِّمَ كانَ لا يَطْلُبُ أَجْرًا عَلى عَمَلِهِ في الماضي؛ لِأَنَّهُ كانَ يَطْلُبُ الأَجْرَ مِنَ اللهِ. وَكانَ هَدَفُ الطّالِبِ طَلَبَ العِلْمِ.", "Farklılıklardan biri de, geçmişte öğretmenin işi için ücret istememesidir; çünkü ecri Allah’tan beklerdi. Öğrencinin hedefi de ilim tahsil etmekti.", "m57-6"],
   ["أَمّا اليَوْمَ، فَقَدِ اخْتَلَفَ الأَمْرُ، فَالمُعَلِّمُ يَطْلُبُ كَثيرًا مِنَ الأَجْرِ، وَالطّالِبُ يُفَكِّرُ في الشَّهادَةِ قَبْلَ العِلْمِ؛ لِأَنَّها وَسيلَةٌ إِلى العَمَلِ.", "Bugün ise durum değişti: Öğretmen yüksek ücret istiyor, öğrenci de ilimden önce diplomayı düşünüyor; çünkü diploma iş bulmanın aracıdır.", "m57-7"]]] },

  [1, "الحَمْدُ لِلّهِ، فَقَدْ رَجَعَ المُسْلِمونَ مَرَّةً أُخْرى إِلى طَلَبِ العِلْمِ؛ فَها هِيَ المَدارِسُ وَالجامِعاتُ تَنْتَشِرُ في جَميعِ بِلادِ المُسْلِمينَ.", "Elhamdülillah, Müslümanlar yeniden ilim talebine döndü; işte okullar ve üniversiteler bütün İslâm ülkelerine yayılıyor.", "d59-9"],

  ["ما عَدَدُ مَراحِلِ التَّعْليمِ في بَلَدِكَ؟", "Senin ülkende eğitim kaç aşamadır?"], ["ما هذِهِ المَراحِلُ؟", "Bu aşamalar nelerdir?"], ["كَمْ كانَ عُمْرُكَ عِنْدَما الْتَحَقْتَ بِالمَدْرَسَةِ؟", "Okula başladığında kaç yaşındaydın?"], ["هَلْ يَلْتَحِقُ كُلُّ الطُّلّابِ بِالجامِعاتِ؟ وَلِماذا؟", "Bütün öğrenciler üniversiteye girer mi? Niçin?"]] },
 { t: "tablo", ar: "المَراحِلُ التَّعْليمِيَّةُ", tts: false, bas: ["المَرْحَلَةُ", "عُمْرُ الطّالِبِ", "سَنَواتُ الدِّراسَةِ"], satir: [["حَضانَةٌ", "١-٣", "٢"], ["رَوْضَةٌ", "٣-٤", "٢"], ["تَمْهيدِيٌّ", "٥-٦", "١"], ["ابْتِدائِيٌّ", "٦-١٢", "٦"], ["مُتَوَسِّطٌ", "١٣-١٥", "٣"], ["ثانَوِيٌّ", "١٦-١٨", "٣"], ["مَعْهَدٌ", "١٩-", "٢-٣"], ["جامِعَةٌ", "١٩-", "٤-٦"]] },
 { t: "metin", paragraf: [
  [["لِلتَّعْليمِ مَراحِلُ مُخْتَلِفَةٌ، يَمُرُّ بِها الطّالِبُ خِلالَ دِراسَتِهِ، فَإِذا أَنْهى مَرْحَلَةً تَعْليمِيَّةً، انْتَقَلَ إِلى المَرْحَلَةِ الَّتي بَعْدَها.", "Eğitimin, öğrencinin öğrenimi boyunca geçtiği farklı aşamaları vardır; bir aşamayı bitirince ondan sonrakine geçer."],
   ["وَتَتَكَوَّنُ مَراحِلُ التَّعْليمِ في كَثيرٍ مِنَ الدُّوَلِ العَرَبِيَّةِ مِنْ أَرْبَعِ مَراحِلَ؛ هِيَ: المَرْحَلَةُ الابْتِدائِيَّةُ، فَالمَرْحَلَةُ المُتَوَسِّطَةُ، فَالمَرْحَلَةُ الثّانَوِيَّةُ، ثُمَّ المَرْحَلَةُ الجامِعِيَّةُ.", "Birçok Arap ülkesinde eğitim dört aşamadan oluşur: ilkokul, ardından ortaokul, ardından lise, sonra üniversite."],
   ["وَفي بَعْضِ البِلادِ العَرَبِيَّةِ، يَلْتَحِقُ التَّلاميذُ قَبْلَ المَدْرَسَةِ الابْتِدائِيَّةِ بِالحَضانَةِ، فَالرَّوْضَةِ، ثُمَّ التَّمْهيدِيِّ.", "Bazı Arap ülkelerinde öğrenciler ilkokuldan önce kreşe, ardından anaokuluna, sonra hazırlık sınıfına giderler."]],
  [["يَلْتَحِقُ التَّلاميذُ بِالمَدْرَسَةِ الابْتِدائِيَّةِ -عادَةً- في السّادِسَةِ مِنْ أَعْمارِهِمْ. وَتَبْلُغُ سَنَواتُ الدِّراسَةِ في المَرْحَلَةِ الابْتِدائِيَّةِ سِتَّ سَنَواتٍ.", "Öğrenciler ilkokula genellikle altı yaşında başlar. İlkokulda öğrenim süresi altı yıldır."],
   ["وَتَبْلُغُ سَنَواتُ الدِّراسَةِ في المَرْحَلَةِ المُتَوَسِّطَةِ ثَلاثَ سَنَواتٍ، وَكَذلِكَ في المَرْحَلَةِ الثّانَوِيَّةِ. أَمّا المَرْحَلَةُ الجامِعِيَّةُ، فَتَتَراوَحُ بَيْنَ أَرْبَعِ وَسِتِّ سَنَواتٍ.", "Ortaokulda öğrenim süresi üç yıldır, lisede de öyle. Üniversite ise dört ile altı yıl arasında değişir."]],
  [["بَعْدَ أَنْ يُنْهِيَ الطّالِبُ المَرْحَلَةَ الثّانَوِيَّةَ، يَلْتَحِقُ بِالجامِعاتِ، أَوِ المَعاهِدِ، إِذا حَصَلَ عَلى تَقْديرٍ طَيِّبٍ.", "Öğrenci liseyi bitirdikten sonra, iyi bir derece alırsa üniversitelere ya da enstitülere (yüksekokullara) girer."],
   ["وَبَعْدَ أَنْ يَحْصُلَ الطّالِبُ عَلى الشَّهادَةِ الجامِعِيَّةِ بِتَقْديرِ جَيِّدٍ جِدًّا أَوْ مُمْتازٍ، يَلْتَحِقُ بِالدِّراساتِ العُلْيا؛ لِلْحُصولِ عَلى شَهادَةِ الماجِسْتيرِ، ثُمَّ شَهادَةِ الدُّكْتوراه.", "Öğrenci üniversite diplomasını iyi ya da pekiyi dereceyle aldıktan sonra, yüksek lisans, sonra doktora diploması almak için lisansüstü öğrenime girer."]],
  [["مِنْ ناحِيَةٍ أُخْرى، في البِلادِ العَرَبِيَّةِ نَوْعانِ مِنَ التَّعْليمِ، هُما: التَّعْليمُ الحُكومِيُّ، وَتُشْرِفُ عَلَيْهِ الدَّوْلَةُ؛ فَتَبْني المَدارِسَ، وَتُوَفِّرُ الكُتُبَ وَالمُدَرِّسينَ،", "Öte yandan Arap ülkelerinde iki tür eğitim vardır: Devlet eğitimi; onu devlet yönetir: okulları yapar, kitapları ve öğretmenleri sağlar;"],
   ["وَالتَّعْليمُ الأَهْلِيُّ، وَتُشْرِفُ عَلَيْهِ بَعْضُ الجَمْعِيّاتِ وَالأَفْرادِ.", "ve özel eğitim; onu bazı dernekler ve kişiler yönetir."]]],

// ---------- yardımcılar ----------
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
var VURGU = /\[\[(.+?)\]\]/g;

// Türkçe metindeki Arapça parçaları sarar

function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function karistir(a, tohum) { a = a.slice(); var h = tohum == null ? Math.random() * 4e9 : hash(String(tohum)); for (var i = a.length - 1; i > 0; i--) { h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0; var j = h % (i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
var tT = 0;
function toast(m) { var t = document.getElementById("toast"); t.textContent = m; t.classList.add("goster"); clearTimeout(tT); tT = setTimeout(function () { t.classList.remove("goster"); }, 2400); }
var AC = null;
function bip(tur) {
  if (!ST.efekt) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    var seq = tur === "ok" ? [[660, .07], [990, .1]] : tur === "no" ? [[210, .16]] : [[523, .08], [659, .08], [784, .08], [1046, .18]], t = AC.currentTime;
    seq.forEach(function (p) { var o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = p[0]; o.type = tur === "no" ? "sawtooth" : "sine"; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + p[1]); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + p[1] + .02); t += p[1]; });
  } catch (e) {}
}

// ---------- ses ----------
var ses = new Audio(); ses.preload = "auto";

  var bin = atob(b64), u = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);

}
var Q = { liste: [], k: -1, bitis: 0, cb: null, id: 0, segs: null, sj: 0 };
ses.addEventListener("timeupdate", function () { if (Q.segs && ses.currentTime >= Q.bitis) segSonraki(); });

// timeupdate seyrek gelir; parça sonunu her karede yokla ki sonraki satıra taşmasın
function tik() { if (!Q.segs) return; if (ses.currentTime >= Q.bitis) segSonraki(); if (Q.segs) requestAnimationFrame(tik); }
function segSonraki() {
  Q.sj++;
  if (Q.sj < Q.segs.length) { ses.currentTime = Q.segs[Q.sj][0]; Q.bitis = Q.segs[Q.sj][1]; return; }
  ses.pause(); Q.segs = null; var f = Q.segBitti; Q.segBitti = null; if (f) setTimeout(f, 120);
}
function segCal(id, bitti) {
  if (!sesHazirla() || !ZAMAN[id]) { if (bitti) setTimeout(bitti, 300); return false; }
  Q.segs = ZAMAN[id]; Q.sj = 0; Q.segBitti = bitti; ses.currentTime = Q.segs[0][0]; Q.bitis = Q.segs[0][1]; ses.playbackRate = ST.hiz;
  var p = ses.play(); if (p && p.catch) p.catch(function () {}); tik(); return true;
}
function sure(o) { if (o.s && ZAMAN[o.s]) return ZAMAN[o.s].reduce(function (t, a) { return t + a[1] - a[0]; }, 0); return Math.max(1.2, temiz(o.m || "").length / 12); }
// o: {s: kayıt parçası, m: metin} — kayıt varsa onu, yoksa gömülü okunuşu çalar
function cal1(o, bitti) {
  if (o.s && ZAMAN[o.s]) return segCal(o.s, bitti);
  if (o.m && o.tts !== false) return sesPlay(temiz(o.m), bitti, toast);
  if (bitti) setTimeout(bitti, 200); return false;
}
function durdur() { Q.id++; Q.liste = []; Q.segs = null; Q.segBitti = null; try { ses.pause(); } catch (e) {} if (window.sesStop) sesStop(); vurgu(null); }
// liste: [{o, el, bekle}] sırayla çalar; bekle>0 ise o satırda öğrenci konuşur (rol)
function kuyruk(liste, bitti) {
  durdur(); var id = Q.id, k = 0;
  (function adim() {
    if (id !== Q.id) return;
    if (k >= liste.length) { vurgu(null); if (bitti) bitti(); return; }
    var x = liste[k++]; vurgu(x.el, x.bekle);
    if (x.bekle) { setTimeout(adim, x.bekle * 1000); return; }
    cal1(x.o, function () { if (id === Q.id) setTimeout(adim, 250); });
  })();
}
function vurgu(sel, sende) {
  document.querySelectorAll(".calan,.sende").forEach(function (e) { e.classList.remove("calan"); e.classList.remove("sende"); });
  if (!sel) return; var e = document.querySelector(sel); if (!e) return;
  e.classList.add(sende ? "sende" : "calan"); e.classList.add("dinlendi");
  var r = e.getBoundingClientRect(); if (r.top < 120 || r.bottom > innerHeight - 40) e.scrollIntoView({ block: "center", behavior: "smooth" });

  if (oge(b) === 1 && ["sirala", "esle", "dinle", "diyalog", "metin"].indexOf(b.t) >= 0) return A[k] ? 1 : 0;
  for (var i = 0; i < oge(b); i++) if (A[k + ":" + i] != null) n++;
  return n;
}

// puanlanan öğeler: doğru-yanlış, seçim, boşluk, ses seçme, sınıflandırma (öğe başına); sıralama ve eşleştirme (blok başına)

function dPuan(d) {
  var t = 0, ok = 0;
  d.bloklar.forEach(function (b, j) {

    if (PUANLI.indexOf(b.t) >= 0) b.ogeler.forEach(function (_, i) { t++; var a = A[k + ":" + i]; if (a && a.ok) ok++; });
    else if (b.t === "sirala" || b.t === "esle") { t++; if (A[k] === true) ok++; }
  });
  return { t: t, ok: ok };
}
function dAd(d) { return d.etiket || "Ders " + d.no; }
function dBas(d) { return dAd(d) + (d.tr && d.tr !== dAd(d) ? " · " + esc(d.tr) : ""); }
function puan() { var p = 0; Object.keys(A).forEach(function (k) { var v = A[k]; if (v === true || (v && v.ok)) p += 10; else if (v === 1) p += 5; }); return p; }

  var once = d ? dYapilan(d) : 0; A[k] = v; cevapKaydet(); ustGuncelle();
  if (d && dYapilan(d) === dToplam(d) && once < dToplam(d)) { setTimeout(function () { toast("Tebrikler! " + dAd(d) + " tamamlandı."); bip("win"); }, 500); sekmelerCiz(); }
}

    case "sn-bas": SN = { s: karistir(havuz()).slice(0, 15), i: 0, p: 0, c: null }; ciz(true); break;
    case "sn": var q = SN.s[SN.i]; SN.c = el.dataset.v; if (SN.c === q.d) { SN.p++; bip("ok"); } else bip("no"); ciz(); break;

  }
});
// gömülü okunuş listesi (ses_topla.mjs okur)
window.SES_LISTE = function () {
  var L = [];
  var ekle = function (s) { if (s && /[؀-ۿ]/.test(s)) L.push(temiz(s)); };
  DERSLER.forEach(function (d) {
    d.bloklar.forEach(function (b) {
      if (b.t === "diyalog") b.satir.forEach(function (s) { if (!s[3] || !ZAMAN[s[3]]) ekle(s[1]); });
      if (b.t === "metin") b.paragraf.forEach(function (p) { p.forEach(function (s) { if (!s[2] || !ZAMAN[s[2]]) ekle(s[0]); }); });
      if ((b.t === "ornek" || b.t === "tekrar") && b.tts !== false) b.ogeler.forEach(function (s) { if (!s[2] || !ZAMAN[s[2]]) ekle(s[0]); });
      if (b.t === "tablo" && b.tts !== false) b.satir.forEach(function (r, ri) { r.forEach(function (c, ci) { if (c !== "×" && !(b.ses && ZAMAN[b.ses[ri][ci]])) ekle(c); }); });
      if (b.t === "acik" || b.t === "resim") (b.ogeler || b.resimler).forEach(function (s) { ekle(s[1]); });
      if (b.t === "sessec") b.ogeler.forEach(function (s, i) { [0, 1].forEach(function (j) { if (!(b.ses && ZAMAN[b.ses[i][j]])) ekle(s[j]); }); });
    });
  });
  KELIME.forEach(function (w) { ekle(w[0]); });
  return L.filter(function (x, n) { return L.indexOf(x) === n; });
};
