.wrap{max-width:1080px;margin:0 auto;padding:0 14px}

.muted{color:var(--muted)}.small{font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}

.tw{overflow-x:auto}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--soft);color:var(--muted)}
.badge.good{background:var(--good-bg);color:var(--good)}.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.info{background:var(--info-bg);color:var(--accent)}

.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--accent)}

.toast.show{opacity:1}
.opts{display:flex;flex-wrap:wrap;gap:4px 14px}
#printarea{display:none}
@media print{body *{visibility:hidden}#printarea,#printarea *{visibility:visible}
 #printarea{display:block;position:absolute;inset-inline-start:0;top:0;width:100%;color:#000;background:#fff;padding:24px}}

/* ===== SHA-256 / helpers ===== */
const K256=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(str){
  const m=new TextEncoder().encode(str),l=m.length,n=((l+9+63)>>6)<<6,b=new Uint8Array(n);
  b.set(m);b[l]=0x80;const dv=new DataView(b.buffer);
  dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l*8/4294967296));
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w=new Uint32Array(64);
  for(let i=0;i<n;i+=64){
    for(let t=0;t<16;t++)w[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){const a=w[t-15],c=w[t-2];
      const s0=((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3),s1=((c>>>17)|(c<<15))^((c>>>19)|(c<<13))^(c>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0}
    let [a,b2,c,d,e,f,g,hh]=h;
    for(let t=0;t<64;t++){
      const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)),ch=(e&f)^(~e&g),t1=(hh+S1+ch+K256[t]+w[t])>>>0;
      const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)),mj=(a&b2)^(a&c)^(b2&c),t2=(S0+mj)>>>0;
      hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b2;b2=a;a=(t1+t2)>>>0}
    h=[h[0]+a,h[1]+b2,h[2]+c,h[3]+d,h[4]+e,h[5]+f,h[6]+g,h[7]+hh].map(x=>x>>>0)}
  return h.map(x=>x.toString(16).padStart(8,"0")).join("");
}
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v);
const seal=o=>sha256(canon(o));
const hashPin=(pin,salt)=>{let x=salt+pin;for(let i=0;i<1500;i++)x=sha256(x+salt);return x};
const rnd=()=>Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x=>x.toString(16).padStart(2,"0")).join("");
/* bidi isolation helpers: keep Latin ids, dates and ranges intact inside Arabic text */
const L=x=>"⁦"+x+"⁩";
const TC="رقم الهوية الوطنية التركية ("+L("T.C.")+")";

/* =====================================================================

  ageDecayYears:5,
  impW:{1:1,2:3,3:6},
  critW:{age:3,loc:2,edu:2,marital:2,kids:2},
  eduLevels:["الابتدائية","المتوسطة","الثانوية","دبلوم (سنتان بعد الثانوية)","بكالوريوس","ماجستير","دكتوراه"],

  consentText:"قدّمتُ هذا الطلب بمحض إرادتي وبشخصي بغرض التعارف من أجل الزواج. وأوافق على معالجة بياناتي لغرض التعارف وحده وفي النطاق الذي تحدده الجهة، وعلى عرضها على المرشحين الذين يُرى أنهم مناسبون في صورة ملخّص تعريفي محدود. لا تُشارَك بيانات الاتصال الخاصة بي ما لم أوافق أنا والطرف الآخر كلٌّ على حدة على التعارف. ويحق لي الانسحاب من طلبي في أي وقت دون إبداء أي سبب، ولستُ ملزماً بقبول التعارف مع أي أحد.",

    {id:"q_aile",label:"العيش مع أحد أفراد الأسرة بعد الزواج",opts:["أرغب","لا أرغب","لا يهم"],weight:2,sensitive:false,enabled:true},
    {id:"q_calisma",label:"توقعك بشأن عمل شريك الحياة",opts:["أن يعمل","ألا يعمل","لا يهم"],weight:2,sensitive:false,enabled:true},

const IMP=[["0","غير مهم"],["1","قليل الأهمية"],["2","مهم"],["3","إلزامي (استبعادي)"]];

const SCHEMA=[
 {sec:"عام"},
 {k:"institution",label:"اسم الجهة",type:"text"},
 {k:"minAge",label:"الحد الأدنى لسن التقديم",type:"int",min:HARD.minAgeFloor,max:40,help:`الحد الأدنى ${HARD.minAgeFloor}؛ ولا يمكن خفضه دونه.`},
 {k:"maxAge",label:"الحد الأقصى لسن التقديم",type:"int",min:25,max:99},
 {k:"matchGender",label:"قاعدة الجنس في المطابقة",type:"sel",opts:[["karsi","مع الجنس الآخر"],["serbest","دون قيد"]],help:"تحدده الجهة المختصة وفق التشريعات النافذة وسياسة الجهة."},
 {sec:"المطابقة"},
 {k:"minScore",label:"الحد الأدنى لدرجة التوافق (0–100)",type:"int",min:0,max:100},
 {k:"topN",label:"أقصى عدد من الأشخاص المقترحين لكل مرشح",type:"int",min:1,max:20},
 {k:"aggregator",label:"طريقة دمج الدرجتين في الاتجاهين",type:"sel",opts:[["geom","المتوسط الهندسي"],["min","الأدنى منهما"],["avg","المتوسط الحسابي"]]},
 {k:"ageDecayYears",label:"البُعد عن تفضيل العمر الذي تصبح عنده الدرجة صفراً (سنوات)",type:"int",min:1,max:15},
 {sec:"الإجراءات والأمان"},
 {k:"maxActiveIntros",label:"أقصى عدد لعمليات التعارف النشطة للمرشح في وقت واحد",type:"int",min:1,max:5},

 {k:"responseDays",label:"مهلة انتظار الرد (بالأيام)",type:"int",min:1,max:60},
 {k:"meetingMode",label:"صيغة اللقاء الأول (نص)",type:"text"},
 {k:"retentionDays",label:"مدة الاحتفاظ بالسجلات المغلقة (بالأيام)",type:"int",min:30,max:3650},
 {k:"fairGapPct",label:"عتبة تنبيه العدالة (فرق بالنقاط المئوية)",type:"int",min:1,max:60},
 {k:"sessionLockMinutes",label:"القفل التلقائي (بالدقائق)",type:"int",min:1,max:60}

const RNG=(a,b)=>L(a+"–"+b);

/* =====================================================================
   DATA STORE
   ===================================================================== */

function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(DB))}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2=n=>String(n).padStart(2,"0");
const dStr=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const todayStr=()=>dStr(new Date());
const fmtD=s=>s?L(s.split("-").reverse().join(".")):"—";
const fmtT=ts=>{const d=new Date(ts);return L(dStr(d).split("-").reverse().join(".")+" "+pad2(d.getHours())+":"+pad2(d.getMinutes()))};

  if(r.getMonth()<b.getMonth()||(r.getMonth()===b.getMonth()&&r.getDate()<b.getDate()))a--;return a}

function validTC(n){if(!/^[1-9]\d{10}$/.test(n))return false;const d=n.split("").map(Number);
  const d10=(((d[0]+d[2]+d[4]+d[6]+d[8])*7)-(d[1]+d[3]+d[5]+d[7]))%10;
  return ((d10+10)%10===d[9])&&(d.slice(0,10).reduce((a,b)=>a+b,0)%10===d[10])}

/* ---- Audit log ---- */
function logEv(action,detail){
  const prev=DB.audit.length?DB.audit[DB.audit.length-1].hash:"GENESIS";
  const e={i:DB.audit.length+1,ts:Date.now(),user:SESSION?SESSION.id:"sistem",role:SESSION?SESSION.role:"-",action,detail:detail||"",prev};
  e.hash=sha256(prev+"|"+e.i+"|"+e.ts+"|"+e.user+"|"+e.role+"|"+e.action+"|"+e.detail);
  DB.audit.push(e);save();return e;
}
function verifyChain(audit){
  let prev="GENESIS";
  for(const e of audit){
    const h=sha256(prev+"|"+e.i+"|"+e.ts+"|"+e.user+"|"+e.role+"|"+e.action+"|"+e.detail);
    if(e.prev!==prev||e.hash!==h)return {ok:false,at:e.i};
    prev=e.hash}
  return {ok:true,n:audit.length};
}

/* ---- Parameter validation ---- */
function validateParams(p){
  const E=[];
  SCHEMA.forEach(s=>{if(s.type==="int"&&(!Number.isInteger(p[s.k])||p[s.k]<s.min||p[s.k]>s.max))E.push(`${s.label}: يجب أن يكون عدداً صحيحاً بين ${s.min} و${s.max}.`)});
  if(p.minAge<HARD.minAgeFloor)E.push(`لا يمكن خفض الحد الأدنى للسن دون ${HARD.minAgeFloor}.`);
  if(p.maxAge<=p.minAge)E.push("يجب أن يكون الحد الأقصى للسن أكبر من الحد الأدنى.");
  [1,2,3].forEach(i=>{if(!Number.isInteger(p.impW[i])||p.impW[i]<0||p.impW[i]>20)E.push("يجب أن تكون أوزان الأهمية أعداداً صحيحة بين 0 و20.")});
  if(!(p.impW[1]<=p.impW[2]&&p.impW[2]<=p.impW[3]))E.push("يجب أن تكون أوزان الأهمية تصاعدية (قليل الأهمية ≤ مهم ≤ إلزامي).");
  Object.keys(CRIT_LABEL).forEach(k=>{if(!Number.isInteger(p.critW[k])||p.critW[k]<0||p.critW[k]>10)E.push(`يجب أن يكون وزن «${CRIT_LABEL[k]}» بين 0 و10.`)});
  if(!Array.isArray(p.eduLevels)||p.eduLevels.length<2)E.push("يجب تعريف مستويين تعليميين على الأقل.");
  const ids=new Set();(p.questions||[]).forEach(q=>{
    if(!q.id||ids.has(q.id))E.push("يجب أن تكون معرّفات الأسئلة فريدة.");ids.add(q.id);
    if(!q.label.trim())E.push("لا يجوز أن يكون نص السؤال فارغاً.");
    if(!Array.isArray(q.opts)||q.opts.length<2)E.push(`يجب أن يتضمن السؤال «${q.label}» خيارين على الأقل.`);
    if(!Number.isInteger(q.weight)||q.weight<0||q.weight>10)E.push(`يجب أن يكون وزن «${q.label}» بين 0 و10.`)});
  if(!p.consentText||p.consentText.trim().length<40)E.push("لا يجوز أن يكون نص الموافقة الصريحة فارغاً أو قصيراً جداً.");
  return E;
}

/* =====================================================================
   MATCHING ENGINE
   ===================================================================== */
function critList(P,a,b){
  const L=Object.keys(CRIT_LABEL).map(k=>({k,label:CRIT_LABEL[k],w:P.critW[k]}));
  const sens=a.consent.sensitive&&b.consent.sensitive;
  P.questions.filter(q=>q.enabled&&(!q.sensitive||sens)).forEach(q=>L.push({k:"q:"+q.id,label:q.label,w:q.weight,q}));
  return L;
}
function satisfy(a,b,c,P,today){
  const pr=a.prefs;
  if(c.k==="age"){const ba=ageOn(b.dogum,today);let s;
    if(ba>=pr.ageMin&&ba<=pr.ageMax)s=1;else{const d=ba<pr.ageMin?pr.ageMin-ba:ba-pr.ageMax;s=Math.max(0,1-d/P.ageDecayYears)}
    return {s,imp:+pr.ageImp,note:`${ba} سنة (المطلوب من ${pr.ageMin} إلى ${pr.ageMax})`}}
  if(c.k==="loc"){const s=pr.locMode==="fark_etmez"?1:(b.il.trim().toLowerCase()===a.il.trim().toLowerCase()?1:0);
    return {s,imp:+pr.locImp,note:pr.locMode==="fark_etmez"?"لا يهم":`${b.il} (يشترط الإقامة في المحافظة نفسها)`}}
  if(c.k==="edu"){const d=(+b.edu)-(+pr.eduMin);const s=d>=0?1:Math.max(0,1+d/3);
    return {s,imp:+pr.eduImp,note:`${P.eduLevels[+b.edu]||"؟"} (الحد الأدنى ${P.eduLevels[+pr.eduMin]||"؟"})`}}
  if(c.k==="marital"){const s=pr.maritalOk.includes(b.medeni)?1:0;return {s,imp:+pr.maritalImp,note:MEDENI.find(x=>x[0]===b.medeni)[1]}}
  if(c.k==="kids"){const s=(b.cocuk>0&&!pr.kidsOk)?0:1;return {s,imp:+pr.kidsImp,note:b.cocuk>0?`لديه أطفال (${b.cocuk})`:"ليس لديه أطفال"}}
  const q=c.q,mine=a.qa[q.id],theirs=b.qa[q.id];
  if(!mine||!mine.accept||mine.accept.length===0)return {s:1,imp:0,note:"لم يُحدَّد تفضيل"};
  if(!theirs||!theirs.ans)return {s:0.5,imp:+mine.imp,note:"لا توجد إجابة"};
  return {s:mine.accept.includes(theirs.ans)?1:0,imp:+mine.imp,note:theirs.ans};
}
function scoreDir(a,b,P,today){
  let num=0,den=0;const why=[];
  for(const c of critList(P,a,b)){
    const r=satisfy(a,b,c,P,today);
    if(r.imp===3&&r.s<1)return {hard:true,why:[{label:c.label,s:r.s,imp:r.imp,note:r.note}]};
    const w=c.w*(r.imp===0?0:P.impW[r.imp]);num+=w*r.s;den+=w;
    why.push({label:c.label,s:r.s,imp:r.imp,note:r.note})}
  return {hard:false,score:den?num/den*100:100,why};
}
function activeIntroCount(id){return DB.intros.filter(i=>ACTIVE_INTRO.includes(i.status)&&(i.a===id||i.b===id)).length}
function pairBlocked(a,b){return DB.blocked.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a))}
function poolable(x,P,today){
  return x.status==="aktif"&&!x.safetyBlock&&x.consent.data&&(!x.cooldownUntil||today>=x.cooldownUntil)&&activeIntroCount(x.id)<P.maxActiveIntros;
}
function pairOk(a,b,P,today){
  if(a.id===b.id)return "الشخص نفسه";
  if(!poolable(a,P,today)||!poolable(b,P,today))return "ليس في المجموعة";
  if(P.matchGender==="karsi"&&a.cins===b.cins)return "قاعدة الجنس";
  if(pairBlocked(a.id,b.id))return "سبق رفضه/منعه";
  if(DB.intros.some(i=>(i.a===a.id&&i.b===b.id)||(i.a===b.id&&i.b===a.id)))return "سبق اقتراحه";
  return null;
}
function scorePair(a,b,P,today){
  const ab=scoreDir(a,b,P,today),ba=scoreDir(b,a,P,today);
  if(ab.hard||ba.hard)return {hard:true};
  const s1=ab.score,s2=ba.score;
  const s=P.aggregator==="min"?Math.min(s1,s2):P.aggregator==="avg"?(s1+s2)/2:Math.sqrt(s1*s2);
  return {hard:false,score:s,sa:s1,sb:s2,whyA:ab.why,whyB:ba.why};
}
function runMatching(){
  const P=DB.params,today=todayStr();
  const pool=DB.applicants.filter(x=>poolable(x,P,today));
  const all=[];let considered=0;
  for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++){
    const a=pool[i],b=pool[j];if(pairOk(a,b,P,today))continue;considered++;
    const r=scorePair(a,b,P,today);if(r.hard||r.score<P.minScore)continue;
    all.push({a:a.id,b:b.id,score:Math.round(r.score*10)/10,sa:Math.round(r.sa),sb:Math.round(r.sb)})}
  // best topN for each applicant
  const per={};all.forEach(p=>{(per[p.a]=per[p.a]||[]).push(p);(per[p.b]=per[p.b]||[]).push(p)});
  const keep=new Set();Object.values(per).forEach(L=>L.sort((x,y)=>y.score-x.score).slice(0,P.topN).forEach(p=>keep.add(p.a+"|"+p.b)));
  const sug=all.filter(p=>keep.has(p.a+"|"+p.b)).sort((x,y)=>y.score-x.score);
  const withAny=new Set();sug.forEach(p=>{withAny.add(p.a);withAny.add(p.b)});
  const run={id:(DB.runs.length?DB.runs[DB.runs.length-1].id+1:1),ts:Date.now(),user:SESSION.id,paramSeal:seal(P),pool:pool.length,considered,suggestions:sug,
    noMatch:pool.filter(x=>!withAny.has(x.id)).map(x=>x.id)};
  DB.runs.push(run);if(DB.runs.length>5)DB.runs.shift();
  logEv("ESLESTIRME_CALISTIRILDI",`التشغيل ${run.id}؛ المجموعة ${pool.length}؛ الاقتراحات ${sug.length}؛ الختم ${L(run.paramSeal.slice(0,12))}`);
  return run;
}

function readApplicant(a){
  const f=$('form[data-form="applicant"]');if(!f)return;const g=n=>f.elements[n];const P=DB.params;
  ["ad","soyad","kimNo","dogum","cins","telefon","eposta","il","ilce","medeni","edu","is","meslek","tanitim","notes"].forEach(k=>{if(g(k))a[k]=g(k).value.trim()});
  if(g("cocuk"))a.cocuk=Math.max(0,parseInt(g("cocuk").value,10)||0);
  const pr=a.prefs;
  pr.ageMin=parseInt(g("p_ageMin").value,10)||pr.ageMin;pr.ageMax=parseInt(g("p_ageMax").value,10)||pr.ageMax;
  ["p_ageImp","p_locImp","p_eduImp","p_maritalImp","p_kidsImp"].forEach(k=>pr[k.slice(2)]=+g(k).value);
  pr.locMode=g("p_locMode").value;pr.eduMin=g("p_eduMin").value;pr.kidsOk=g("p_kidsOk").checked;
  pr.maritalOk=MEDENI.map(x=>x[0]).filter(k=>g("p_mar_"+k).checked);
  P.questions.filter(q=>q.enabled).forEach(q=>{
    a.qa[q.id]={ans:g(`q_${q.id}_ans`).value,accept:q.opts.filter((o,i)=>g(`q_${q.id}_acc_${i}`).checked),imp:g(`q_${q.id}_imp`).value}});
  if(g("c_data")){const had=a.consent.data;a.consent.data=g("c_data").checked;a.consent.sensitive=g("c_sens").checked;a.consent.contactShare=g("c_contact").checked;
    if(a.consent.data&&!had){a.consent.ts=Date.now();a.consent.version=P.consentVersion}}
  ["inPerson","idVerified","voluntary","notMarried","protective","protectiveFound"].forEach(k=>{if(g("k_"+k))a.checks[k]=g("k_"+k).checked});
}

function vMatch(){
  const run=DB.runs[DB.runs.length-1];const P=DB.params;
  let h=`<div class="row"><h1 class="sp">المطابقة</h1>${can.edit()?`<button class="b" data-act="runmatch">تشغيل المطابقة</button>`:""}</div>
  <div class="note info small">يُنتج النظام <b>اقتراحات</b> فحسب؛ ولا يتطابق أي مرشح تلقائياً ولا يُبلَّغ تلقائياً. يختار الموظف أحد الاقتراحات ويبدأ <b>إجراء التعارف</b>؛ ولا يُشارَك أي شيء قبل أن يُبلغ كل من الطرفين قراره على حدة. تُحسب الدرجات وفق <b>التفضيلات التي حددها المرشحون أنفسهم</b> ومعاملات الجهة.</div>`;
  if(!run)return h+`<div class="card muted">لم تُشغَّل المطابقة بعد.</div>`;
  const aq=(ctx.mq||"").toLowerCase();
  const L=run.suggestions.filter(p=>!aq||(nm(getA(p.a))+" "+nm(getA(p.b))+p.a+p.b).toLowerCase().includes(aq));
  const stale=run.paramSeal!==seal(P);
  h+="@@WHY@@";
  h+=`<div class="card"><div class="row"><div class="sp">التشغيل #${run.id} · ${fmtT(run.ts)} · المجموعة ${run.pool} · الأزواج المفحوصة ${run.considered} · الاقتراحات ${run.suggestions.length}</div><span class="badge ${stale?"warn":"good"}">${stale?"تغيّرت المعاملات، أعد التشغيل":"المعاملات حالية"}</span></div>
   <div class="row" style="margin-top:8px"><input id="mq" placeholder="اسم المرشح أو رقمه" value="${esc(ctx.mq||"")}" style="max-width:260px"></div>
   <div class="tw"><table><tr><th>الدرجة</th><th>المرشح 1</th><th>المرشح 2</th><th>من 1 إلى 2</th><th>من 2 إلى 1</th><th></th></tr>
   ${L.slice(0,200).map(p=>{const a=getA(p.a),b=getA(p.b);const ok=a&&b&&!pairOk(a,b,P,todayStr());
    return `<tr><td><b>${p.score}</b><div class="bar"><i style="width:${p.score}%"></i></div></td><td>${esc(nm(a))}<div class="small muted">${L_(p.a)} · ${a?ageOn(a.dogum,todayStr()):""} · ${esc(a?a.il:"")}</div></td>
    <td>${esc(nm(b))}<div class="small muted">${L_(p.b)} · ${b?ageOn(b.dogum,todayStr()):""} · ${esc(b?b.il:"")}</div></td><td>${p.sa}</td><td>${p.sb}</td>
    <td><button class="b ghost sm" data-act="why" data-a="${p.a}" data-b="${p.b}">لماذا؟</button> ${can.edit()?`<button class="b sm" data-act="startintro" data-a="${p.a}" data-b="${p.b}" ${ok?"":"disabled"}>بدء التعارف</button>`:""}</td></tr>`}).join("")||`<tr><td colspan="6" class="muted">لا توجد اقتراحات.</td></tr>`}</table></div></div>`;
  let whyHtml="";
  if(ctx.why){const a=getA(ctx.why.a),b=getA(ctx.why.b);const r=scorePair(a,b,P,todayStr());
    const rows=(w)=>w.map(x=>`<tr><td>${esc(x.label)}</td><td>${x.s>=1?"✔":x.s>0?"≈":"✘"}</td><td>${["غير مهم","قليل","مهم","إلزامي"][x.imp]}</td><td class="small">${esc(x.note)}</td></tr>`).join("");
    whyHtml=`<div class="card"><h3>تفاصيل التوافق: ${esc(nm(a))} ↔ ${esc(nm(b))}</h3>${r.hard?`<p>أحد التفضيلات الإلزامية غير متحقق.</p>`:`<div class="grid g2"><div><b>على أي أساس ينظر ${esc(nm(a))} (${Math.round(r.sa)})</b><div class="tw"><table><tr><th>المعيار</th><th></th><th>الأهمية</th><th>الطرف الآخر</th></tr>${rows(r.whyA)}</table></div></div>
     <div><b>على أي أساس ينظر ${esc(nm(b))} (${Math.round(r.sb)})</b><div class="tw"><table><tr><th>المعيار</th><th></th><th>الأهمية</th><th>الطرف الآخر</th></tr>${rows(r.whyB)}</table></div></div></div>`}</div>`}
  h=h.replace("@@WHY@@",whyHtml);
  if(run.noMatch.length)h+=`<div class="card"><h3>المرشحون الذين لم تظهر لهم اقتراحات في هذا التشغيل (${run.noMatch.length})</h3><p class="small muted">هم من ضيّقوا تفضيلاتهم كثيراً (مثل كثرة «إلزامي») أو لم يوجد في المجموعة مرشح مناسب لهم. يمكن اقتراح لقاء المرشح ومراجعة تفضيلاته.</p><div>${run.noMatch.map(id=>`<a href="#" data-act="open" data-id="${id}">${esc(nm(getA(id)))}</a>`).join(" · ")}</div></div>`;
  return h;
}

/* ---- Fairness report ---- */
function groupStats(keyFn,label){
  const P=DB.params,run=DB.runs[DB.runs.length-1];const G={};
  DB.applicants.filter(a=>a.status==="aktif"||a.status==="beklemede").forEach(a=>{const k=keyFn(a);if(!k)return;const g=G[k]=G[k]||{n:0,none:0,intros:0,acc:0,decided:0};
    g.n++;if(run&&run.noMatch.includes(a.id))g.none++;
    DB.intros.filter(i=>i.a===a.id||i.b===a.id).forEach(i=>{g.intros++;const s=i.a===a.id?"a":"b";if(i.resp[s].dec){g.decided++;if(i.resp[s].dec==="kabul")g.acc++}})});
  const tot=Object.values(G).reduce((x,g)=>({n:x.n+g.n,none:x.none+g.none}),{n:0,none:0});const base=tot.n?tot.none/tot.n*100:0;
  return `<div class="card"><h3>${label}</h3><div class="tw"><table><tr><th>المجموعة</th><th>المرشحون</th><th>دون اقتراحات</th><th>عمليات التعارف</th><th>نسبة القبول</th><th></th></tr>
   ${Object.entries(G).sort().map(([k,g])=>{const pct=g.n?g.none/g.n*100:0;const gap=pct-base;return `<tr><td>${esc(k)}</td><td>${g.n}</td><td>${g.none} (${L(Math.round(pct)+"%")})</td><td>${g.intros}</td><td>${g.decided?L(Math.round(g.acc/g.decided*100)+"%"):"—"}</td><td>${g.n>=5&&gap>P.fairGapPct?`<span class="badge warn">أعلى من المعدل العام بمقدار ${Math.round(gap)} نقطة مئوية</span>`:""}</td></tr>`}).join("")||`<tr><td colspan="6" class="muted">لا توجد بيانات.</td></tr>`}</table></div></div>`;
}
function vFair(){
  const P=DB.params;const run=DB.runs[DB.runs.length-1];
  return `<h1>تقرير العدالة</h1><div class="note info small">مؤشرات إجمالية (غير شخصية) لمتابعة ما إذا كانت عملية المطابقة تمنح فرصاً أقل لبعض الفئات بصورة منهجية. تستند إلى آخر تشغيل للمطابقة فقط${run?` (#${run.id})`:""}. عتبة التنبيه ${P.fairGapPct} نقطة مئوية (معامل قابل للتعديل). هذا التقرير <b>إشارة تنبيه</b> وليس دليلاً على التمييز؛ ويبحث الموظفون والمدقق معاً في أسبابه.</div>

function readParamsForm(){
  const f=$('form[data-form="params"]');const P=JSON.parse(JSON.stringify(DB.params));
  SCHEMA.forEach(s=>{if(!s.k)return;const el=f.elements[s.k];if(!el)return;P[s.k]=s.type==="int"?parseInt(el.value,10):el.value});
  [1,2,3].forEach(i=>P.impW[i]=parseInt(f.elements["iw"+i].value,10));
  Object.keys(CRIT_LABEL).forEach(k=>P.critW[k]=parseInt(f.elements["cw_"+k].value,10));
  P.eduLevels=f.elements.edu.value.split("\n").map(x=>x.trim()).filter(Boolean);
  P.questions.forEach((q,i)=>{q.label=f.elements["ql_"+i].value.trim();q.opts=f.elements["qo_"+i].value.split(/[,،]/).map(x=>x.trim()).filter(Boolean);
    q.weight=parseInt(f.elements["qw_"+i].value,10);q.sensitive=f.elements["qs_"+i].checked;q.enabled=f.elements["qe_"+i].checked});
  P.consentText=f.elements.consentText.value;P.consentVersion=f.elements.consentVersion.value.trim()||"1";
  return P;
}
function applyParams(P,reason,src){
  const E=validateParams(P);if(E.length){alert("المعاملات غير صالحة:\n• "+E.join("\n• "));return false}
  if(!reason||reason.trim().length<5){alert("سبب التعديل إلزامي (5 أحرف على الأقل).");return false}
  if(canon(P)===canon(DB.params)){toast("لا يوجد تغيير.");return false}
  DB.params=P;const s=seal(P);
  DB.paramHistory.push({ver:DB.paramHistory.length+1,ts:Date.now(),user:SESSION.id,reason:reason.trim(),seal:s,params:JSON.parse(JSON.stringify(P))});
  logEv("PARAMETRE_DEGISTI",`الإصدار ${DB.paramHistory.length}؛ الختم ${s}؛ ${src||"النموذج"}؛ السبب: ${reason.trim()}`);
  toast("طُبّقت المعاملات.");return true;
}

function download(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function seedDemo(){
  const P=DB.params;const ils=["أنقرة","إسطنبول","إزمير","بورصة","قونية"],erk=["أحمد","محمد","مصطفى","علي","عمر","بلال","جاسم","كريم"],kad=["عائشة","فاطمة","زينب","إيمان","مريم","أسماء","بشرى","سلمى"],sy=["الحسن","القاسم","الخطيب","النجار","الشامي","العلي","الحداد","الدوسري"];
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const tc=()=>{const d=[1+Math.floor(Math.random()*9)];for(let i=1;i<9;i++)d.push(Math.floor(Math.random()*10));
    const d10=(((d[0]+d[2]+d[4]+d[6]+d[8])*7)-(d[1]+d[3]+d[5]+d[7]))%10;d.push((d10+10)%10);d.push(d.reduce((x,y)=>x+y,0)%10);return d.join("")};
  for(let n=0;n<40;n++){
    const a=newApplicant();a.demo=true;const k=n%2===0;a.cins=k?"K":"E";a.ad=pick(k?kad:erk);a.soyad=pick(sy);a.kimNo=tc();
    const age=22+Math.floor(Math.random()*14);const dt=new Date();dt.setFullYear(dt.getFullYear()-age);dt.setDate(dt.getDate()-Math.floor(Math.random()*300));a.dogum=dStr(dt);
    a.telefon="05"+Math.floor(100000000+Math.random()*899999999);a.il=pick(ils);a.edu=String(2+Math.floor(Math.random()*5));a.meslek=pick(["معلم","مهندس","ممرض","تاجر","موظف حكومي","محاسب"]);
    a.tanitim="سجل تجريبي: نص تعريفي قصير.";a.is="calisiyor";a.medeni=Math.random()<.9?"hic":"bosanmis";a.cocuk=a.medeni==="hic"?0:1;
    a.prefs.ageMin=Math.max(P.minAge,age-6);a.prefs.ageMax=age+7;a.prefs.ageImp=pick([1,2,2,3]);a.prefs.locMode=pick(["fark_etmez","ayni_il"]);a.prefs.locImp=pick([0,1,2,3]);
    a.prefs.eduMin=String(Math.max(0,+a.edu-1));a.prefs.eduImp=pick([0,1,2]);a.prefs.maritalOk=Math.random()<.7?["hic"]:["hic","bosanmis","dul"];a.prefs.maritalImp=pick([1,2,3]);a.prefs.kidsOk=Math.random()<.6;a.prefs.kidsImp=pick([1,2]);
    P.questions.filter(q=>q.enabled).forEach(q=>{const ans=pick(q.opts);const acc=q.opts.filter(o=>o===ans||o===DONTCARE||Math.random()<.35);a.qa[q.id]={ans,accept:acc,imp:String(pick([0,1,1,2,2,3]))}});
    a.consent={data:true,sensitive:false,contactShare:Math.random()<.7,ts:Date.now(),version:P.consentVersion};
    a.checks={inPerson:true,idVerified:true,protective:true,protectiveFound:false,voluntary:true,notMarried:true};
    a.status="aktif";hist(a,"أُنشئت بيانات تجريبية");DB.applicants.push(a)}
  logEv("DENEME_VERISI","أُضيف 40 مرشحاً تجريبياً");save();
}

  if(a==="plan"){const i=it();const d=prompt("تاريخ اللقاء (سنة-شهر-يوم، YYYY-MM-DD):",addDays(todayStr(),7));if(!d||!/^\d{4}-\d\d-\d\d$/.test(d))return;const tm=prompt("الساعة (HH:MM):","14:00");if(!tm)return;const pl=prompt("المكان (عام، وبعلم الموظف):","");if(!pl)return;
    i.meeting={date:d,time:tm,place:pl,mode:DB.params.meetingMode};i.status="bulusma_planli";i.history.push({ts:Date.now(),user:SESSION.id,text:`جُدول اللقاء: ${L(d+" "+tm)} ${pl}`});logEv("GORUSME_PLANLANDI",`${L(i.id)} ${L(d+" "+tm)}`);save();render();return}
  if(a==="outcome"){const i=it();const get=side=>{const r=prompt(`${nm(getA(i[side]))}: اكتب أحد الخيارين لنتيجة اللقاء: استمرار / انتهاء`,"استمرار");if(!r)return null;const v=r.trim().toLowerCase();return Object.keys(OUT).find(k=>OUT[k]===r.trim()||k===v)||null};
    const o1=get("a");if(!o1){alert("إدخال غير صالح.");return}const o2=get("b");if(!o2){alert("إدخال غير صالح.");return}
    i.outcome={a:o1,b:o2};i.history.push({ts:Date.now(),user:SESSION.id,text:`النتيجة: ${OUT[o1]} / ${OUT[o2]}`});
    if(o1==="devam"&&o2==="devam"){i.status="devam_ediyor"}
    else{i.status="bitti";[i.a,i.b].forEach(id=>{const x=getA(id);x.cooldownUntil=addDays(todayStr(),DB.params.cooldownDays)})}
    logEv("GORUSME_SONUCU",`${L(i.id)} ${OUT[o1]}/${OUT[o2]}`);save();render();return}
  if(a==="endintro"){const i=it();const r=reason("ملاحظة الانتهاء:");if(!r)return;i.status="bitti";[i.a,i.b].forEach(id=>{getA(id).cooldownUntil=addDays(todayStr(),DB.params.cooldownDays)});i.history.push({ts:Date.now(),user:SESSION.id,text:"انتهى: "+r});logEv("TANISTIRMA_BITTI",L(i.id));save();render();return}
  if(a==="decision"){const i=it();if(!confirm("هل أعلن كل من المرشحين بنفسه قرار الزواج؟ ستُستكمل السجلات ويُخرجان من المجموعة."))return;
    i.status="kararverdi";[i.a,i.b].forEach(id=>{const x=getA(id);x.closedAt=Date.now();setStatus(x,"tamamlandi","اتُّخذ قرار الزواج ("+L(i.id)+")")});i.history.push({ts:Date.now(),user:SESSION.id,text:"أُعلن قرار الزواج؛ يُحال إلى إجراءات عقد الزواج"});logEv("EVLENME_KARARI",L(i.id));save();render();return}
  if(a==="complaint"){const i=it();const r=reason("شكوى / بلاغ أمني (اكتب المعلومات الضرورية فقط):");if(!r)return;i.status="sikayet";i.history.push({ts:Date.now(),user:SESSION.id,text:"شكوى: "+r});
    [i.a,i.b].forEach(id=>{const x=getA(id);if(x.status==="aktif")setStatus(x,"inceleme","قيد المراجعة بسبب شكوى: "+L(i.id))});logEv("SIKAYET",L(i.id)+" — "+r);save();render();return}
  if(a==="closecomplaint"){const i=it();const r=reason("سبب إغلاق الشكوى ونتيجتها:");if(!r)return;i.status="bitti";i.history.push({ts:Date.now(),user:SESSION.id,text:"أُغلقت الشكوى: "+r});
    [i.a,i.b].forEach(id=>{const x=getA(id);if(x.status==="inceleme"){setStatus(x,"aktif","انتهت المراجعة: "+r);x.cooldownUntil=addDays(todayStr(),DB.params.cooldownDays)}});logEv("SIKAYET_KAPATILDI",L(i.id)+" — "+r);save();render();return}
  if(a==="saveseal"){DB.officialSeal=$("#offseal").value.trim().toLowerCase();logEv("RESMI_MUHUR_TANIMLANDI",DB.officialSeal);save();render();return}
  if(a==="addq"){const P=readParamsForm();P.questions.push({id:"q_"+rnd().slice(0,6),label:"سؤال جديد",opts:["نعم","لا"],weight:2,sensitive:false,enabled:true});ctx.draft=P;render();return}
  if(a==="delq"){const P=readParamsForm();P.questions.splice(+t.dataset.i,1);ctx.draft=P;render();return}
  if(a==="exportparams"){download("tanistirma-parametreleri.json",JSON.stringify(readParamsForm(),null,2));return}
  if(a==="exportall"){logEv("YEDEK_ALINDI","نسخة احتياطية كاملة");download("tanistirma-yedek-"+todayStr()+".json",JSON.stringify(DB));return}
  if(a==="exportaudit"){download("denetim-gunlugu-"+todayStr()+".json",JSON.stringify({audit:DB.audit,chain:verifyChain(DB.audit),paramSeal:seal(DB.params)},null,2));return}
  if(a==="exportpkg"){
    const cnt=o=>Object.entries(o).map(([k,v])=>({k,n:v}));const by=(arr,fn)=>arr.reduce((r,x)=>{const k=fn(x);r[k]=(r[k]||0)+1;return r},{});
    const pk={tarih:todayStr(),kurum:DB.params.institution,parametreler:DB.params,parametreMuhru:seal(DB.params),parametreGecmisi:DB.paramHistory.map(x=>({ver:x.ver,ts:x.ts,user:x.user,reason:x.reason,seal:x.seal})),
      adayDurumlari:by(DB.applicants,a=>a.status),tanistirmaDurumlari:by(DB.intros,i=>i.status),eslestirmeKosulari:DB.runs.map(r=>({id:r.id,ts:r.ts,user:r.user,paramSeal:r.paramSeal,havuz:r.pool,oneri:r.suggestions.length,onerisiz:r.noMatch.length})),
      denetimGunlugu:DB.audit,zincir:verifyChain(DB.audit)};
    logEv("DENETIM_PAKETI","تم التصدير");download("denetim-paketi-"+todayStr()+".json",JSON.stringify(pk,null,2));return}
  if(a==="seed"){if(!can.admin())return;seedDemo();toast("أُضيف 40 مرشحاً تجريبياً.");render();return}
  if(a==="unseed"){if(!can.admin())return;if(!confirm("هل تُحذف جميع المرشحين التجريبيين وعمليات التعارف المرتبطة بهم؟"))return;
    const ids=new Set(DB.applicants.filter(x=>x.demo).map(x=>x.id));DB.applicants=DB.applicants.filter(x=>!x.demo);DB.intros=DB.intros.filter(i=>!ids.has(i.a)&&!ids.has(i.b));DB.blocked=DB.blocked.filter(p=>!ids.has(p[0])&&!ids.has(p[1]));DB.runs=[];
    logEv("DENEME_VERISI_SILINDI",ids.size+" مرشحاً");save();render();return}
  if(a==="toggleuser"){const u=DB.users.find(x=>x.id===t.dataset.id);if(u.active&&u.role==="admin"&&DB.users.filter(x=>x.active&&x.role==="admin").length<2){alert("لا يمكن تعطيل آخر مدير مفعّل.");return}
    u.active=!u.active;logEv("KULLANICI_DURUMU",`${u.name}: ${u.active?"مفعّل":"معطّل"}`);save();render();return}
  if(a==="resetpin"){const u=DB.users.find(x=>x.id===t.dataset.id);const p=prompt(`الرمز السري الجديد لـ ${u.name} (6 أرقام على الأقل):`);if(!p||!/^\d{6,}$/.test(p)){if(p!==null)alert("يجب أن يتكوّن الرمز السري من 6 أرقام على الأقل.");return}
    u.salt=rnd();u.hash=hashPin(p,u.salt);u.fails=0;u.lockUntil=0;logEv("PIN_DEGISTI",u.name);save();toast("حُدّث الرمز السري.");return}
  if(a==="wipe"){if(!can.admin())return;if(prompt("ستُحذف جميع البيانات. للتأكيد اكتب «حذف»:")==="حذف"){localStorage.removeItem(KEY);DB=null;SESSION=null;toast("حُذفت جميع البيانات.");render()}return}
});

DB=load();
if(DB&&!DB.paramHistory)DB=null;
render();
</script>
