<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bir Harfle Üç Bab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Amiri:wght@400;700&display=swap">
<style>
/* Düzen: üstte sekmeler; her bab kendi rengiyle (mercan hemze, kobalt şedde, firuze elif) aynı iskeletle anlatılır. */
:root {
  --paper: #F3F6FA;
  --card: #FFFFFF;
  --ink: #17213A;
  --muted: #5B667C;
  --line: #D8DFEA;
  --soft: #E9EEF6;
  --ifal: #B5402B;
  --tefil: #2848A6;
  --mufaale: #0D7A73;
  --ek: #7C879D;
  --good: #1F7A3E;
  --bad: #B3261E;
  --good-bg: #E3F3E8;
  --bad-bg: #FBE6E4;
  --bab: var(--tefil);
  --f-display: "Alegreya", Georgia, "Times New Roman", serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-ar: "Amiri", "Scheherazade New", "Traditional Arabic", "Noto Naskh Arabic", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F141E; --card: #171E2C; --ink: #E7EBF3; --muted: #9DA8BC; --line: #2B3448; --soft: #1E2738;
    --ifal: #F2866F; --tefil: #93A9FF; --mufaale: #52D0C3; --ek: #8C98AF;
    --good: #6FD08E; --bad: #FF8A80; --good-bg: #16301F; --bad-bg: #3A1C1A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F141E; --card: #171E2C; --ink: #E7EBF3; --muted: #9DA8BC; --line: #2B3448; --soft: #1E2738;
  --ifal: #F2866F; --tefil: #93A9FF; --mufaale: #52D0C3; --ek: #8C98AF;
  --good: #6FD08E; --bad: #FF8A80; --good-bg: #16301F; --bad-bg: #3A1C1A; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; }
.wrap { max-width: 1060px; margin: 0 auto; padding-inline: 16px; padding-block: 0 64px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h2 { font-size: 1.7rem; }
h3 { font-size: 1.22rem; }
p { margin: 0; }
.ar { font-family: var(--f-ar); direction: rtl; unicode-bidi: isolate; line-height: 1.9; }
.z { color: var(--bab); font-weight: 700; }
.e { color: var(--ek); }
.muted { color: var(--muted); }
.lbl { font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.b-ifal { --bab: var(--ifal); }
.b-tefil { --bab: var(--tefil); }
.b-mufaale { --bab: var(--mufaale); }

/* başlık */
header.top { padding-block: 28px 18px; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: end; }
header.top h1 { font-size: clamp(2rem, 5vw, 3.1rem); font-weight: 800; letter-spacing: -.01em; }
header.top p { color: var(--muted); max-width: 60ch; margin-top: 6px; }
.seal { display: flex; gap: 10px; direction: rtl; font-family: var(--f-ar); font-size: 2.1rem; line-height: 1; }
.seal span { width: 58px; height: 58px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 50%; background: var(--card); }
.seal span.i { color: var(--ifal); border-color: var(--ifal); }
.seal span.t { color: var(--tefil); border-color: var(--tefil); }
.seal span.m { color: var(--mufaale); border-color: var(--mufaale); }

/* sekmeler */
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-block: 8px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: none; font: inherit; font-weight: 700; font-size: .98rem; color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 8px 15px; cursor: pointer; }
nav.tabs button .ar { font-size: 1.05rem; margin-inline-start: 6px; }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
nav.tabs button[aria-selected="true"].b-ifal { background: var(--ifal); }
nav.tabs button[aria-selected="true"].b-tefil { background: var(--tefil); }
nav.tabs button[aria-selected="true"].b-mufaale { background: var(--mufaale); }
nav.tabs button[aria-selected="true"] .ar, nav.tabs button[aria-selected="true"] { color: var(--paper); }
button:focus-visible, select:focus-visible, input:focus-visible, .opt:focus-visible { outline: 3px solid var(--bab); outline-offset: 2px; }

section.panel { display: grid; gap: 22px; padding-top: 26px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
.stack { display: grid; gap: 12px; min-width: 0; }
.btn { font: inherit; font-weight: 700; border: 1.5px solid var(--bab); color: var(--bab); background: transparent; padding: 8px 16px; border-radius: 10px; cursor: pointer; }
.btn.solid { background: var(--bab); color: var(--card); }
.btn:hover { filter: brightness(1.08); }
.btn.small { padding: 4px 10px; font-size: .88rem; }

/* giriş: üç ekleme yeri */
.places { display: grid; gap: 14px; }
.place { display: grid; grid-template-columns: 170px 1fr; gap: 18px; align-items: center; padding: 14px 16px; border-radius: 12px; background: var(--soft); }
.place .ar.big { font-size: 2.5rem; text-align: center; line-height: 1.5; }
.place h3 { color: var(--bab); }
.slot { display: inline-block; border-bottom: 3px solid var(--bab); }
.rule-list { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; counter-reset: k; }
.rule-list li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; }
.rule-list li::before { counter-increment: k; content: counter(k); font-family: var(--f-display); font-weight: 800; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--paper); }

/* bab kimlik kartı */
.id-card { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 22px; align-items: center; border-top: 5px solid var(--bab); }
.vezin { text-align: center; }
.vezin .ar { font-size: clamp(3.2rem, 9vw, 4.8rem); line-height: 1.4; }
.vezin .tr { font-family: var(--f-display); font-size: 1.4rem; font-weight: 700; color: var(--bab); }
.fact { display: grid; grid-template-columns: 130px 1fr; gap: 8px 14px; }
.fact dt { color: var(--muted); font-weight: 700; font-size: .92rem; }
.fact dd { margin: 0; }
.motto { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--soft); font-weight: 500; }
.motto b { color: var(--bab); }

/* emsile satırı */
.emsile { display: flex; flex-wrap: wrap; direction: rtl; gap: 6px 14px; justify-content: center; font-family: var(--f-ar); font-size: 1.85rem; line-height: 1.9; }
.emsile .w { display: grid; justify-items: center; }
.emsile .w small { font-family: var(--f-body); font-size: .72rem; color: var(--muted); direction: ltr; line-height: 1.2; letter-spacing: .03em; }
.emsile .glue { color: var(--muted); font-size: 1.4rem; align-self: start; }

/* çapa kelimeler */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 13px; font-weight: 700; cursor: pointer; font: inherit; font-weight: 700; color: var(--ink); }
.chip small { color: var(--muted); font-weight: 400; margin-inline-start: 4px; }
.chip[aria-pressed="true"] { border-color: var(--bab); background: var(--bab); color: var(--card); }
.chip[aria-pressed="true"] small { color: var(--card); }
.word-detail { min-height: 96px; padding: 14px 16px; border-radius: 12px; border: 1.5px dashed var(--line); display: grid; gap: 4px; }
.word-detail .ar { font-size: 2rem; }

/* kalıp tablosu */
.pattern-table { width: 100%; border-collapse: collapse; }
.pattern-table td, .pattern-table th { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: middle; }
.pattern-table th { font-size: .78rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.pattern-table td.ar { font-size: 1.7rem; text-align: center; }
.pattern-table td.vz { font-size: 1.35rem; color: var(--muted); }
.tbl-scroll { overflow-x: auto; }

/* mânâlar */
.meaning { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; background: var(--card); }
.meaning h3 { font-size: 1.08rem; color: var(--bab); }
.pair { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; direction: rtl; }
.pair .ar { font-size: 1.5rem; }
.pair .arrow { color: var(--bab); font-size: 1.2rem; }
.meaning .gloss { font-size: .93rem; color: var(--muted); }

/* makine */
.machine-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.field { display: grid; gap: 4px; }
.field label { font-size: .8rem; font-weight: 700; color: var(--muted); }
select, input[type="text"] { font: inherit; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); max-width: 100%; }
input.ar-in { font-family: var(--f-ar); font-size: 1.3rem; direction: rtl; width: 120px; padding-block: 2px; }
.root-show { display: flex; gap: 8px; direction: rtl; }
.root-show span { font-family: var(--f-ar); font-size: 1.6rem; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 10px; background: var(--soft); }
.mean-line { font-size: .98rem; }
.mean-line b { color: var(--bab); }
.forms { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.form { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: center; display: grid; gap: 2px; background: var(--card); }
.form .ar { font-size: 1.85rem; line-height: 1.7; }
.form .lbl { font-size: .68rem; }
.form .tr { font-size: .85rem; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: .88rem; color: var(--muted); }
.legend i { font-style: normal; font-weight: 700; }
.conj { width: 100%; border-collapse: collapse; min-width: 520px; }
.conj th, .conj td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: center; }
.conj th { font-size: .75rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.conj td.ar { font-size: 1.5rem; }
.conj td.who { font-size: .85rem; color: var(--muted); }
.conj td.who .ar { font-size: 1.15rem; color: var(--ink); }
.warn { color: var(--bad); font-size: .9rem; }

/* dikkat kutuları */
.notes { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
.notes li { padding-inline-start: 18px; position: relative; }
.notes li::before { content: ""; position: absolute; left: 0; top: .62em; width: 8px; height: 8px; border-radius: 2px; background: var(--bab); transform: rotate(45deg); }
.quran { border-inline-start: 4px solid var(--bab); padding: 10px 14px; background: var(--soft); border-radius: 0 10px 10px 0; display: grid; gap: 4px; }
.quran .ar { font-size: 1.65rem; }
.quran .src { font-size: .82rem; color: var(--muted); }

/* karşılaştırma */
.cmp { width: 100%; border-collapse: collapse; min-width: 640px; }
.cmp th, .cmp td { padding: 10px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; }
.cmp thead th { font-family: var(--f-display); font-size: 1.15rem; }
.cmp thead th.b-ifal, .cmp thead th.b-tefil, .cmp thead th.b-mufaale { color: var(--bab); border-bottom: 3px solid var(--bab); }
.cmp td.ar { font-size: 1.6rem; }
.cmp th[scope="row"] { text-align: start; font-size: .92rem; color: var(--muted); }
.cmp .tr { display: block; font-size: .85rem; color: var(--muted); }
.tri { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.tri .card { padding: 14px; display: grid; gap: 4px; border-top: 4px solid var(--bab); }
.tri .ar { font-size: 1.9rem; }

/* sınav */
.quiz-start { display: flex; flex-wrap: wrap; gap: 10px; }
.quiz-box { display: grid; gap: 16px; }
.q-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.progress { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; flex: 1 1 200px; }
.progress div { height: 100%; background: var(--bab); width: 0; transition: width .3s ease; }
.q-prompt { font-size: 1.15rem; font-weight: 500; }
.q-show { font-size: 2.6rem; text-align: center; padding-block: 6px; }
.q-show.trw { font-family: var(--f-display); font-weight: 800; font-size: 2.3rem; direction: ltr; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.opt { font: inherit; text-align: center; padding: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; cursor: pointer; font-weight: 700; }
.opt .ar { font-size: 1.7rem; font-weight: 400; }
.opt:hover:not([disabled]) { border-color: var(--bab); }
.opt.ok { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.opt.no { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.opt[disabled] { cursor: default; }
.explain { padding: 12px 14px; border-radius: 12px; background: var(--soft); }
.explain b.okk { color: var(--good); }
.explain b.nok { color: var(--bad); }
.score-big { font-family: var(--f-display); font-size: 3rem; font-weight: 800; color: var(--bab); }
.best { font-size: .9rem; color: var(--muted); }
.tabular { font-variant-numeric: tabular-nums; }

@media (max-width: 720px) {
  header.top { grid-template-columns: 1fr; }
  .seal { justify-content: flex-start; }
  .seal span { width: 48px; height: 48px; font-size: 1.7rem; }
  .id-card { grid-template-columns: 1fr; }
  .place { grid-template-columns: 1fr; text-align: center; }
  .fact { grid-template-columns: 1fr; gap: 2px; }
  .fact dd { margin-bottom: 8px; }
  .emsile { font-size: 1.5rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="lbl">Sülâsî Mezîd · Bir harf ilâvesiyle</div>
      <h1>Bir Harfle Üç Bab</h1>
      <p>Üç harfli köke tek bir harf ekleyince üç ayrı bab doğar: başa hemze <b class="ar" style="color:var(--ifal)">أ</b>, ortaya bir ayn daha <b class="ar" style="color:var(--tefil)">ّ</b>, fâ'dan sonra elif <b class="ar" style="color:var(--mufaale)">ا</b>. Türkçede zaten bildiğin kelimeler bu üç kalıbın çapası olacak.</p>
    </div>
    <div class="seal" aria-hidden="true"><span class="i">أ</span><span class="t">ـّـ</span><span class="m">ا</span></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Bölümler">
    <button role="tab" id="tab-giris" data-tab="giris" aria-selected="true">Giriş</button>
    <button role="tab" id="tab-ifal" data-tab="ifal" class="b-ifal" aria-selected="false">İf'âl <span class="ar">إفعال</span></button>
    <button role="tab" id="tab-tefil" data-tab="tefil" class="b-tefil" aria-selected="false">Tef'îl <span class="ar">تفعيل</span></button>
    <button role="tab" id="tab-mufaale" data-tab="mufaale" class="b-mufaale" aria-selected="false">Mufâale <span class="ar">مفاعلة</span></button>
    <button role="tab" id="tab-karsilastir" data-tab="karsilastir" aria-selected="false">Karşılaştır</button>
    <button role="tab" id="tab-sinav" data-tab="sinav" aria-selected="false">Sınav</button>
  </nav>

  <main id="main"></main>
</div>

<script>
(function () {
"use strict";
// ---------- harekeler ----------
var F = "َ", K = "ِ", D = "ُ", S = "ْ", SH = "ّ", TF = "ً", TD = "ٌ";
function z(s) { return '<span class="z">' + s + '</span>'; }
function e(s) { return '<span class="e">' + s + '</span>'; }
function plain(h) { return String(h).replace(/<[^>]+>/g, ""); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

var FORM_NAMES = {
  mazi: "Mâzî", muzari: "Muzâri", masdar: "Masdar", masdar2: "2. masdar", fail: "İsm-i fâil",
  meful: "İsm-i mef'ûl", emir: "Emir", nehy: "Nehy"
};
var FORM_TR = {
  mazi: "yaptı", muzari: "yapıyor / yapar", masdar: "yapmak", masdar2: "yapmak (2. masdar)", fail: "yapan",
  meful: "yapılan", emir: "yap!", nehy: "yapma!"
};
var ORDER = ["mazi", "muzari", "masdar", "fail", "meful", "emir", "nehy"];

// ---------- kalıp üretici ----------
// Kökler sahîh-sâlim seçildi; zayıf, mehmûz ve (İf'âl / Mufâale için) mudâaf kökler kural dışıdır.
var GEN = {
  ifal: {
    mazi: function (f, a, l) { return z("أَ") + f + S + a + F + l + F; },
    muzari: function (f, a, l) { return e("يُ") + f + S + a + K + l + D; },
    masdar: function (f, a, l) { return z("إِ") + f + S + a + F + e("ا") + l + TF + e("ا"); },
    fail: function (f, a, l) { return e("مُ") + f + S + a + K + l + TD; },
    meful: function (f, a, l) { return e("مُ") + f + S + a + F + l + TD; },
    emir: function (f, a, l) { return z("أَ") + f + S + a + K + l + S; },
    nehy: function (f, a, l) { return e("لَا تُ") + f + S + a + K + l + S; },
    maziStem: function (f, a, l) { return z("أَ") + f + S + a + F; },
    muzStem: function (f, a, l) { return f + S + a + K; }
  },
  tefil: {
    mazi: function (f, a, l) { return f + F + z(a + SH + F) + l + F; },
    muzari: function (f, a, l) { return e("يُ") + f + F + z(a + SH + K) + l + D; },
    masdar: function (f, a, l) { return z("تَ") + f + S + a + K + z("ي") + l + TF + e("ا"); },
    fail: function (f, a, l) { return e("مُ") + f + F + z(a + SH + K) + l + TD; },
    meful: function (f, a, l) { return e("مُ") + f + F + z(a + SH + F) + l + TD; },
    emir: function (f, a, l) { return f + F + z(a + SH + K) + l + S; },
    nehy: function (f, a, l) { return e("لَا تُ") + f + F + z(a + SH + K) + l + S; },
    maziStem: function (f, a, l) { return f + F + z(a + SH + F); },
    muzStem: function (f, a, l) { return f + F + z(a + SH + K); }
  },
  mufaale: {
    mazi: function (f, a, l) { return f + F + z("ا") + a + F + l + F; },
    muzari: function (f, a, l) { return e("يُ") + f + F + z("ا") + a + K + l + D; },
    masdar: function (f, a, l) { return e("مُ") + f + F + z("ا") + a + F + l + F + e("ةً"); },
    masdar2: function (f, a, l) { return f + K + a + F + z("ا") + l + TF + e("ا"); },
    fail: function (f, a, l) { return e("مُ") + f + F + z("ا") + a + K + l + TD; },
    meful: function (f, a, l) { return e("مُ") + f + F + z("ا") + a + F + l + TD; },
    emir: function (f, a, l) { return f + F + z("ا") + a + K + l + S; },
    nehy: function (f, a, l) { return e("لَا تُ") + f + F + z("ا") + a + K + l + S; },
    maziStem: function (f, a, l) { return f + F + z("ا") + a + F; },
    muzStem: function (f, a, l) { return f + F + z("ا") + a + K; }
  }
};
function letters(root) { return Array.from(root); }
function gen(bab, root, form) {
  var r = letters(root);
  var g = GEN[bab][form];
  return g ? g(r[0], r[1], r[2]) : "";
}

var PRONOUNS = [
  ["هُوَ", "o (eril)"], ["هُمَا", "o ikisi (eril)"], ["هُمْ", "onlar (eril)"],

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  try {
    var u = new SpeechSynthesisUtterance(plain(text));
    u.lang = "ar-SA"; u.rate = 0.8;
    var vs = speechSynthesis.getVoices().filter(function (v) { return /^ar/i.test(v.lang); });
    if (vs.length) u.voice = vs[0];
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (x) {}
}

function emsileLine(b, root) {
  var R = BABS[b];
  var parts = [];
  function w(form, extra) {
    return '<span class="w"><span>' + gen(b, root, form) + '</span><small>' + FORM_NAMES[form] + (extra || "") + '</small></span>';
  }
  parts.push(w("mazi"), w("muzari"), w("masdar"));
  var rt = R.roots.filter(function (x) { return x.r === root; })[0];
  if (b === "mufaale" && rt && rt.m2) parts.push('<span class="glue">وَ</span>' + w("masdar2"));
  parts.push('<span class="glue">فَهُوَ</span>' + w("fail"));
  parts.push('<span class="glue">وَذَاكَ</span>' + w("meful"));
  parts.push(w("emir"), w("nehy"));
  return '<div class="emsile">' + parts.join("") + '</div>';
}

    '</div>' +
    '<div class="legend"><span><i style="color:var(--bab)">Renkli</i>: babın ilâvesi</span><span><i style="color:var(--ek)">Gri</i>: çekim ekleri</span><span><i>Siyah</i>: kök harfleri</span></div>' +
    '<div><button class="btn small" data-conj="' + b + '" aria-expanded="' + (state.showConj[b] ? "true" : "false") + '">' + (state.showConj[b] ? "14 sîgayı gizle" : "Mâzî ve muzâri 14 sîga çekimini göster") + '</button></div>' +
    (state.showConj[b] ?
      '<div class="tbl-scroll"><table class="conj"><thead><tr><th>Şahıs</th><th>Mâzî</th><th>Muzâri</th></tr></thead><tbody>' +
        conj.map(function (c) { return '<tr><td class="who"><span class="ar">' + c.pr[0] + '</span> · ' + c.pr[1] + '</td><td class="ar">' + c.mazi + '</td><td class="ar">' + c.muzari + '</td></tr>'; }).join("") +
      '</tbody></table></div>' : '');
}
function customWarning(b, root) {
  var r = letters(root);
  var weak = /[اويءأإؤئى]/;
  if (r.some(function (c) { return weak.test(c); })) return "Bu kökte illetli harf ya da hemze var. Mu'tel ve mehmûz köklerde kalıp ses değişimine uğrar; burada gösterilen düz kalıp yanlış olabilir.";
  if (b !== "tefil" && r[1] === r[2]) return "Bu kök mudâaf (2. ve 3. harf aynı). Bu babda idgâm olur; gösterilen düz kalıp yanlış olabilir.";
  return "";
}

function showWord(b, idx) {
  var list = WORDS.filter(function (w) { return w.bab === b; });
  var w = list[idx]; if (!w) return;
  var B = BABS[b];
  var chips = document.querySelectorAll("#chips-" + b + " .chip");
  chips.forEach(function (c, i) { c.setAttribute("aria-pressed", i === idx ? "true" : "false"); });
  var box = document.getElementById("wd-" + b);
  box.innerHTML =
    '<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:baseline">' +
      '<b style="font-family:var(--f-display);font-size:1.6rem">' + esc(w.w) + '</b>' +
      '<span class="ar">' + gen(b, w.root.r, w.form) + '</span>' +
      (CAN_SPEAK ? '<button class="btn small" data-say="' + esc(plain(gen(b, w.root.r, w.form))) + '">Dinle</button>' : '') +
    '</div>' +
    '<p>Kök <span class="ar" style="font-size:1.2rem">' + letters(w.root.r).join(" ") + '</span> · ' + B.name + ' babının <b>' + FORM_NAMES[w.form].toLowerCase() + '</b>i' +
      ' · fiil: <span class="ar" style="font-size:1.2rem">' + gen(b, w.root.r, "mazi") + '</span> ' + w.root.t + '</p>' +
    '<p class="muted">' + formHint(b, w.form) + '</p>' +
    '<div><button class="btn small" data-load="' + b + ':' + w.root.r + '">Bu kökü kalıp makinesine yükle</button></div>';
}
function formHint(b, f) {
  var H = {
    ifal: { masdar: "İ…â… kalıbı: başta kesreli hemze, son harften önce uzun â.", fail: "Mu + sakin harf + i: muzâriden türer, sondan önceki harf kesreli.", meful: "Mu + sakin harf + e: fâilin kesresi fethaya döner." },
    tefil: { masdar: "Te…î… kalıbı: başta تَ, sondan önce uzun î; şedde masdarda görünmez.", fail: "Mu + şeddeli orta harf + i: muallim, müderris gibi.", meful: "Mu + şeddeli orta harf + e: mukaddes, mükemmel gibi." },
    mufaale: { masdar: "Mu…â…e(t) kalıbı: başta مُ, fâ'dan sonra uzun â, sonda ة.", masdar2: "Fi…â… kalıbı: ikinci masdar; cihâd, cidâl, hilâf gibi.", fail: "Mu…â…i…: misâfir, muhâcir, muhâfız gibi.", meful: "Mu…â…e…: mübârek, muhâtab gibi." }
  };
  return (H[b] && H[b][f]) || "";
}

// ---------- karşılaştırma ----------
function renderKarsilastir() {
  var rows = [["mazi", "فعل"], ["muzari", "فعل"], ["masdar", "فعل"], ["fail", "فعل"], ["meful", "فعل"], ["emir", "فعل"], ["nehy", "فعل"]];
  var trio = [
    { r: "حكم", mc: "حَكَمَ", t: "hükmetti", m: { ifal: ["sağlamlaştırdı", "ihkâm, muhkem"], tefil: ["hakem yaptı", "tahkîm"], mufaale: ["yargıladı", "muhâkeme"] } },
    { r: "عرض", mc: "عَرَضَ", t: "sundu", m: { ifal: ["yüz çevirdi", "i'râz"], tefil: ["maruz bıraktı", "ta'rîz"], mufaale: ["karşı çıktı", "muâraza, muârız"] } },
    { r: "كرم", mc: "كَرُمَ", t: "değerli oldu", m: { ifal: ["ikram etti", "ikrâm, mükrem"], tefil: ["onurlandırdı", "tekrîm, mükerrem"], mufaale: ["cömertlikte yarıştı", "mükârame"] } }
  ];
  return '' +
  '<section class="panel">' +
    '<div class="card stack">' +
      '<div class="lbl">Yan yana</div><h2>Üç babın bütün kalıpları</h2>' +
      '<p class="muted">Aynı satırda üç babın neyi paylaştığına bak: muzâri harfi hep ötreli, muzâri, emir ve fâilde sondan önceki harf hep kesreli, mef\'ûlde hep fethalı.</p>' +
      '<div class="tbl-scroll"><table class="cmp"><thead><tr><th></th>' +
        BAB_KEYS.map(function (b) { return '<th class="b-' + b + '">' + BABS[b].name + '</th>'; }).join("") +
      '</tr></thead><tbody>' +
        rows.map(function (row) {
          return '<tr><th scope="row">' + FORM_NAMES[row[0]] + '<span class="tr">' + FORM_TR[row[0]] + '</span></th>' +
            BAB_KEYS.map(function (b) {
              var x = gen(b, "فعل", row[0]);
              if (b === "mufaale" && row[0] === "masdar") x += ' ، ' + gen(b, "فعل", "masdar2");
              return '<td class="ar b-' + b + '">' + x + '</td>';
            }).join("") + '</tr>';
        }).join("") +
        '<tr><th scope="row">Türkçe masdar</th>' + BAB_KEYS.map(function (b) { return '<td class="b-' + b + '"><b>' + BABS[b].trKalip.replace(/_/g, "·") + '</b></td>'; }).join("") + '</tr>' +
        '<tr><th scope="row">Asıl mânâ</th><td class="b-ifal">geçişli yapma</td><td class="b-tefil">geçişli yapma, çokluk</td><td class="b-mufaale">karşılıklılık</td></tr>' +
      '</tbody></table></div>' +
    '</div>' +
    '<div class="stack">' +
      '<div><div class="lbl">Tek kök, üç bab</div><h2>Aynı kök, üç ayrı yön</h2><p class="muted">Bir kök üç babın hepsine girebilir. Anlamın nasıl kaydığına dikkat et.</p></div>' +
      trio.map(function (t) {
        return '<div class="card stack"><p><span class="ar" style="font-size:1.6rem">' + t.mc + '</span> <b>' + t.t + '</b> <span class="muted">(mücerred)</span></p><div class="tri">' +
          BAB_KEYS.map(function (b) {
            return '<div class="card b-' + b + '"><div class="lbl">' + BABS[b].name + '</div><div class="ar">' + gen(b, t.r, "mazi") + '</div><p><b>' + t.m[b][0] + '</b></p><p class="muted">Türkçede: ' + t.m[b][1] + '</p></div>';
          }).join("") + '</div></div>';
      }).join("") +
    '</div>' +
    '<div class="card stack">' +
      '<div class="lbl">Ayırt etme ipuçları</div><h2>Bir kelimeyi gördüğünde sor</h2>' +
      '<ol class="rule-list">' +
        '<li><div>Mâzîde <b>başta hemze</b> var ve ikinci harf sakin mi? <b style="color:var(--ifal)">İf\'âl</b>.</div></li>' +
        '<li><div>Ortada <b>şedde</b> var ve başında ek yok mu? <b style="color:var(--tefil)">Tef\'îl</b>.</div></li>' +
        '<li><div>İlk harften sonra <b>uzun â</b> var mı? <b style="color:var(--mufaale)">Mufâale</b>.</div></li>' +
        '<li><div>Başta <span class="ar">مُ</span> varsa, ondan sonraki yapıya bak: sakin harf İf\'âl, şedde Tef\'îl, uzun â Mufâale. Sonra son harften önceki harekeye bak: kesre fâil, fetha mef\'ûl.</div></li>' +
      '</ol>' +
    '</div>' +
  '</section>';
}

// ---------- sınav ----------
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

function qWordBab(only) {
  var useTrap = Math.random() < 0.25;
  var babOpts = BAB_KEYS.map(function (b) { return { label: BABS[b].name, key: b }; }).concat([{ label: "Başka bir bab / mücerred", key: "other" }]);
  if (useTrap) {
    var t = pick(TRAPS);
    return { kind: "Kelimenin babı", prompt: "Bu Türkçe kelime hangi babdan geliyor?", show: esc(t.w), showCls: "trw", opts: babOpts, ans: "other",
      explain: '<span class="ar" style="font-size:1.4rem">' + t.ar + '</span> · ' + t.why, babColor: only };
  }
  var pool = WORDS.filter(function (w) { return !only || w.bab === only; });
  var w = pick(pool);
  return { kind: "Kelimenin babı", prompt: "Bu Türkçe kelime hangi babdan geliyor?", show: esc(w.w), showCls: "trw", opts: babOpts, ans: w.bab,
    explain: '<span class="ar" style="font-size:1.4rem">' + gen(w.bab, w.root.r, w.form) + '</span> · kök <span class="ar">' + letters(w.root.r).join(" ") + '</span>, ' + BABS[w.bab].name + ' babının ' + FORM_NAMES[w.form].toLowerCase() + 'i. ' + formHint(w.bab, w.form), babColor: w.bab };
}
function qSiga(only) {
  var b = only || pick(BAB_KEYS);
  var rt = pick(BABS[b].roots);
  var f = pick(ORDER);
  var others = shuffle(ORDER.filter(function (x) { return x !== f; })).slice(0, 3);
  var opts = shuffle([f].concat(others)).map(function (k) { return { label: FORM_NAMES[k], key: k }; });
  return { kind: "Sîga bulma", prompt: "Bu kelime hangi sîga? <span class=\"muted\">(" + BABS[b].name + " babı, kök " + letters(rt.r).join(" ") + ")</span>", show: plain(gen(b, rt.r, f)), showCls: "ar", opts: opts, ans: f,
    explain: '<span class="ar" style="font-size:1.4rem">' + gen(b, rt.r, f) + '</span> · ' + sigaClue(b, f), babColor: b };
}
function sigaClue(b, f) {
  var C = {
    mazi: "Mâzî: harf-i mudâraa yok, son harf fethalı.",
    muzari: "Muzâri: başta ötreli harf-i mudâraa (يُ), sonda ötre.",
    masdar: { ifal: "Masdar: başta kesreli hemze (إِ), sondan önce uzun â.", tefil: "Masdar: başta تَ, sondan önce ي.", mufaale: "Masdar: başta مُ, sonda ة." }[b],
    fail: "İsm-i fâil: başta مُ, son harften önceki harf kesreli.",
    meful: "İsm-i mef'ûl: başta مُ, son harften önceki harf fethalı.",
    emir: "Emir: harf-i mudâraa yok, son harf sakin." + (b === "ifal" ? " İf'âl emri fethalı hemzeyle başlar." : ""),
    nehy: "Nehy: başta لَا, ardından muzâri, son harf sakin."
  };
  return C[f];
}
function qKalip(only) {
  var b = only || pick(BAB_KEYS);
  var rt = pick(BABS[b].roots);
  var f = pick(["mazi", "muzari", "masdar", "fail", "meful", "emir"]);
  var correct = gen(b, rt.r, f);
  var cand = [{ h: correct, key: "ok" }];
  BAB_KEYS.forEach(function (o) { if (o !== b) cand.push({ h: gen(o, rt.r, f), key: o + ":" + f }); });
  var f2 = pick(ORDER.filter(function (x) { return x !== f; }));
  cand.push({ h: gen(b, rt.r, f2), key: b + ":" + f2 });
  var seen = {};
  cand = cand.filter(function (c) { var p = plain(c.h); if (seen[p]) return false; seen[p] = 1; return true; });
  var opts = shuffle(cand).map(function (c) { return { label: '<span class="ar">' + plain(c.h) + '</span>', key: c.key }; });
  return { kind: "Doğru kalıp", prompt: "<span class=\"ar\" style=\"font-size:1.3rem\">" + letters(rt.r).join(" ") + "</span> kökünden <b>" + BABS[b].name + "</b> babının <b>" + FORM_NAMES[f].toLowerCase() + "</b>i hangisi?", show: "", opts: opts, ans: "ok",
    explain: '<span class="ar" style="font-size:1.4rem">' + correct + '</span> · ' + sigaClue(b, f) + ' Renkli harf babın ilâvesidir.', babColor: b };
}
function qMana(only) {
  var b = only || pick(BAB_KEYS);
  var B = BABS[b];
  var fv = pick(B.fevaid);
  var others = shuffle(B.fevaid.filter(function (x) { return x !== fv; })).slice(0, 3);
  var opts = shuffle([fv].concat(others)).map(function (x) { return { label: x.n, key: x.n }; });
  return { kind: "Mânâ türü", prompt: B.name + " babı burada fiile hangi anlamı katıyor?",
    show: '<span style="font-size:1.6rem">' + fv.ex[0][0] + ' <span class="muted" style="font-family:var(--f-body);font-size:1rem">(' + fv.ex[0][1] + ')</span> ← ' + '<span style="color:var(--bab)">' + fv.ex[1][0] + '</span> <span class="muted" style="font-family:var(--f-body);font-size:1rem">(' + fv.ex[1][1] + ')</span></span>', showCls: "ar", showHtml: true,
    opts: opts, ans: fv.n, explain: '<b>' + fv.n + '</b>: ' + fv.d, babColor: b };
}
function buildQuiz(only) {
  var makers = [qWordBab, qWordBab, qWordBab, qSiga, qSiga, qKalip, qKalip, qKalip, qMana, qMana];
  return shuffle(makers).map(function (m) { return m(only); });
}
function startQuiz(only) {
  state.quiz = { only: only || null, qs: buildQuiz(only), i: 0, score: 0, answered: null, wrong: [] };
  setTab("sinav");
}
function renderSinav() {
  var Q = state.quiz;
  var best = store.get("best", {});
  var intro = '' +
    '<div class="card stack">' +
      '<div class="lbl">Sınav</div><h2>Hangisini çalışmak istersin?</h2>' +
      '<p class="muted">Her sınav 10 soru: Türkçe kelimenin babını bulma, sîgayı tanıma, doğru kalıbı seçme ve mânâ türü. Karma sınavda başka babdan tuzak kelimeler de çıkar.</p>' +
      '<div class="quiz-start">' +
        BAB_KEYS.map(function (b) { return '<button class="btn b-' + b + '" data-quiz="' + b + '">' + BABS[b].name + (best[b] != null ? ' · en iyi ' + best[b] + '/10' : '') + '</button>'; }).join("") +
        '<button class="btn solid" data-quiz="karma" style="--bab:var(--ink)">Karma sınav' + (best.karma != null ? ' · en iyi ' + best.karma + '/10' : '') + '</button>' +
      '</div>' +
    '</div>';
  if (!Q) return '<section class="panel">' + intro + '</section>';
  if (Q.i >= Q.qs.length) {
    var key = Q.only || "karma";
    var prev = best[key];
    if (prev == null || Q.score > prev) { best[key] = Q.score; store.set("best", best); }
    var msg = Q.score >= 9 ? "Kalıplar yerine oturmuş. Şimdi karma sınavla tuzakları dene." : Q.score >= 6 ? "İyi gidiyor. Yanlışların açıklamasını oku ve bir tur daha çöz." : "Önce bab sayfasındaki Emsile satırını sesli oku, Türkçe çapalara bak, sonra tekrar dene.";
    return '<section class="panel ' + (Q.only ? "b-" + Q.only : "") + '"><div class="card stack" style="text-align:center;justify-items:center">' +
      '<div class="lbl">' + (Q.only ? BABS[Q.only].name : "Karma") + ' sınavı bitti</div>' +
      '<div class="score-big tabular">' + Q.score + ' / ' + Q.qs.length + '</div>' +
      '<p>' + msg + '</p>' +
      (Q.wrong.length ? '<div class="stack" style="text-align:start;width:100%"><div class="lbl">Tekrar bak</div>' + Q.wrong.map(function (w) { return '<div class="explain">' + w + '</div>'; }).join("") + '</div>' : '') +
      '<div class="quiz-start" style="justify-content:center"><button class="btn solid" data-quiz="' + (Q.only || "karma") + '">Yeni 10 soru</button><button class="btn" data-quizmenu="1">Sınav menüsü</button></div>' +
    '</div></section>';
  }
  var q = Q.qs[Q.i];
  var ansd = Q.answered;
  return '<section class="panel b-' + (q.babColor || Q.only || "tefil") + '"><div class="card quiz-box">' +
    '<div class="q-top"><span class="lbl">' + q.kind + ' · soru <span class="tabular">' + (Q.i + 1) + '/' + Q.qs.length + '</span></span><div class="progress" aria-hidden="true"><div style="width:' + (Q.i / Q.qs.length * 100) + '%"></div></div><span class="tabular"><b>' + Q.score + '</b> doğru</span></div>' +
    '<p class="q-prompt">' + q.prompt + '</p>' +
    (q.show ? '<div class="q-show ' + (q.showCls === "trw" ? "trw" : "ar") + '">' + q.show + '</div>' : '') +
    '<div class="opts">' +
      q.opts.map(function (o, i) {
        var cls = "";
        if (ansd) { if (o.key === q.ans) cls = " ok"; else if (o.key === ansd) cls = " no"; }
        return '<button class="opt' + cls + '" data-opt="' + i + '"' + (ansd ? " disabled" : "") + '>' + o.label + '</button>';
      }).join("") +
    '</div>' +
    (ansd ? '<div class="explain">' + (ansd === q.ans ? '<b class="okk">Doğru.</b> ' : '<b class="nok">Yanlış.</b> ') + q.explain + '</div>' +
      '<div><button class="btn solid" data-next="1" id="next-btn">' + (Q.i + 1 < Q.qs.length ? "Sonraki soru" : "Sonucu gör") + '</button></div>' : '') +
  '</div></section>';
}

// ---------- yönlendirme ----------
function setTab(t) {
  state.tab = t; store.set("tab", t);
  document.querySelectorAll("nav.tabs button").forEach(function (bt) { bt.setAttribute("aria-selected", bt.dataset.tab === t ? "true" : "false"); });
  render();
  var sel = document.querySelector('nav.tabs button[data-tab="' + t + '"]');
  if (sel && sel.scrollIntoView) { try { sel.scrollIntoView({ block: "nearest", inline: "nearest" }); } catch (x) {} }
}
function render() {
  var t = state.tab;
  if (t === "giris") main.innerHTML = renderGiris();
  else if (BABS[t]) { main.innerHTML = renderBab(t); renderMachine(t); }
  else if (t === "karsilastir") main.innerHTML = renderKarsilastir();
  else if (t === "sinav") main.innerHTML = renderSinav();
}

document.querySelector("nav.tabs").addEventListener("click", function (ev) {
  var bt = ev.target.closest("button[data-tab]"); if (!bt) return;
  if (bt.dataset.tab === "sinav" && state.quiz && state.quiz.i >= state.quiz.qs.length) state.quiz = null;
  setTab(bt.dataset.tab);
  window.scrollTo({ top: 0 });
});

main.addEventListener("click", function (ev) {
  var t = ev.target.closest("button"); if (!t) return;
  var d = t.dataset;
  if (d.go) { setTab(d.go); window.scrollTo({ top: 0 }); }
  else if (d.word) { var p = d.word.split(":"); showWord(p[0], +p[1]); }
  else if (d.load) { var q = d.load.split(":"); state.sel[q[0]] = q[1]; renderMachine(q[0]); document.getElementById("machine-" + q[0]).scrollIntoView({ behavior: "smooth", block: "start" }); }
  else if (d.conj) { state.showConj[d.conj] = !state.showConj[d.conj]; renderMachine(d.conj); }
  else if (d.custom) {
    var inp = document.getElementById("in-" + d.custom);
    var val = Array.from((inp.value || "").replace(/[\sً-ْـ]/g, ""));
    if (val.length !== 3 || !val.every(function (c) { return /[ء-ي]/.test(c); })) {
      inp.setCustomValidity("3 Arapça harf yaz"); inp.reportValidity(); setTimeout(function () { inp.setCustomValidity(""); }, 1500); return;
    }
    state.sel[d.custom] = val.join(""); renderMachine(d.custom);
  }
  else if (d.speak) { var el = document.getElementById(d.speak); if (el) speak(el.textContent.replace(/[A-Za-zÇçĞğİıÖöŞşÜüÂâÎîÛû'\.\-0-9]/g, " ")); }
  else if (d.say) { speak(d.say); }
  else if (d.quiz) { startQuiz(d.quiz === "karma" ? null : d.quiz); window.scrollTo({ top: 0 }); }
  else if (d.quizmenu) { state.quiz = null; render(); }
  else if (d.opt != null && state.quiz && !state.quiz.answered) {
    var Q = state.quiz, qq = Q.qs[Q.i], o = qq.opts[+d.opt];
    Q.answered = o.key;
    if (o.key === qq.ans) Q.score++;
    else Q.wrong.push('<b>' + qq.kind + ':</b> ' + (qq.show && qq.showCls === "trw" ? '<b>' + qq.show + '</b> · ' : '') + qq.explain);
    render();
    var nb = document.getElementById("next-btn"); if (nb) nb.focus({ preventScroll: true });
  }
  else if (d.next) { state.quiz.i++; state.quiz.answered = null; render(); }
});
main.addEventListener("change", function (ev) {
  var s = ev.target;
  if (s.tagName === "SELECT" && s.id.indexOf("sel-") === 0) { var b = s.id.slice(4); state.sel[b] = s.value; renderMachine(b); }
});
main.addEventListener("keydown", function (ev) {
  if (ev.key === "Enter" && ev.target.classList && ev.target.classList.contains("ar-in")) {
    var b = ev.target.id.slice(3); var btn = document.querySelector('[data-custom="' + b + '"]'); if (btn) btn.click();
  }
});

setTab(state.tab);
})();
</script>
</body>
