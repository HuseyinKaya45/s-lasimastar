<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İzafet ve İ'rabı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Amiri:wght@400;700&display=swap">
<style>

/* Düzen: her ders aynı sırayla akar: hedefler, örnekler, görsel, kaide, alıştırmalar. Hal renkleri (merfû, mansûb, mecrûr) ve tür renkleri her yerde aynıdır. */
:root {
  --paper: #F4F6F2;
  --card: #FFFFFF;
  --ink: #1B2420;
  --muted: #5E6A63;
  --line: #D9E0DA;
  --soft: #EAEFEA;
  --accent: #1E5B4F;
  --ref: #B3402F;
  --nasb: #A86A0E;
  --cerr: #2D5FA8;
  --muf: #6B6152;
  --mus: #0F8A7A;
  --mzs: #5A4FB0;
  --mns: #B23A75;
  --tks: #1E7A46;
  --mz: #1D6E8C;
  --mi: #8A3F9E;
  --y: #1E5B4F;
  --x: #7E8A84;
  --good: #1F7A3E;
  --bad: #B3261E;
  --good-bg: #E2F2E6;
  --bad-bg: #FBE7E4;
  --role: var(--accent);
  --f-display: "Alegreya", Georgia, "Times New Roman", serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-ar: "Amiri", "Scheherazade New", "Traditional Arabic", "Noto Naskh Arabic", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111614; --card: #19201D; --ink: #E6ECE8; --muted: #9FACA5; --line: #2C3632; --soft: #202925;
    --accent: #6CC3AE; --ref: #F28B78; --nasb: #EDB45C; --cerr: #8DB4F5; --muf: #CDBB95; --mus: #5ED1C2; --mzs: #ABA3F5; --mns: #F28DC0; --tks: #6FD69A; --mz: #6CC7E6; --mi: #D49BEA; --y: #6CC3AE; --x: #98A39D;
    --good: #6FD08E; --bad: #FF8A80; --good-bg: #17301F; --bad-bg: #3A1D1A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111614; --card: #19201D; --ink: #E6ECE8; --muted: #9FACA5; --line: #2C3632; --soft: #202925;
  --accent: #6CC3AE; --ref: #F28B78; --nasb: #EDB45C; --cerr: #8DB4F5; --muf: #CDBB95; --mus: #5ED1C2; --mzs: #ABA3F5; --mns: #F28DC0; --tks: #6FD69A; --mz: #6CC7E6; --mi: #D49BEA; --y: #6CC3AE; --x: #98A39D;
  --good: #6FD08E; --bad: #FF8A80; --good-bg: #17301F; --bad-bg: #3A1D1A; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; }
.wrap { max-width: 1060px; margin: 0 auto; padding-inline: 16px; padding-block: 0 72px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h2 { font-size: 1.65rem; }
h3 { font-size: 1.2rem; }
p { margin: 0; }
.ar { font-family: var(--f-ar); direction: rtl; unicode-bidi: isolate; line-height: 1.9; }
.muted { color: var(--muted); }
.lbl { font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.tabular { font-variant-numeric: tabular-nums; }
.r-ref { --role: var(--ref); color: var(--ref); } .r-nasb { --role: var(--nasb); color: var(--nasb); } .r-cerr { --role: var(--cerr); color: var(--cerr); } .r-muf { --role: var(--muf); color: var(--muf); } .r-mus { --role: var(--mus); color: var(--mus); } .r-mzs { --role: var(--mzs); color: var(--mzs); } .r-mns { --role: var(--mns); color: var(--mns); } .r-tks { --role: var(--tks); color: var(--tks); } .r-mz { --role: var(--mz); color: var(--mz); } .r-mi { --role: var(--mi); color: var(--mi); } .r-good { --role: var(--good); color: var(--good); } .r-bad { --role: var(--bad); color: var(--bad); } .r-y { --role: var(--y); color: var(--y); }
.r-x { --role: var(--x); color: var(--x); }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* üst */
header.top { padding-block: 26px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: end; }
header.top h1 { font-size: clamp(2rem, 5.4vw, 3.2rem); font-weight: 800; letter-spacing: -.01em; }
header.top .h1ar { font-family: var(--f-ar); font-size: clamp(1.5rem, 4vw, 2.1rem); color: var(--accent); direction: rtl; line-height: 1.5; }
header.top p { color: var(--muted); max-width: 62ch; margin-top: 6px; }
.xpbox { display: grid; gap: 4px; min-width: 210px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.xpbox .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: .9rem; }
.xpbox b.rank { font-family: var(--f-display); font-size: 1.1rem; }
.xpbar { height: 6px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.xpbar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--ref), var(--nasb), var(--cerr), var(--mus), var(--mzs), var(--mns), var(--tks)); transition: width .5s ease; }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-block: 8px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: none; font-weight: 700; font-size: .96rem; color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
nav.tabs button .num { font-family: var(--f-display); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--ink); font-size: .85rem; }
nav.tabs button .pc { font-size: .72rem; color: var(--muted); font-weight: 500; }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
nav.tabs button[aria-selected="true"] .num { background: var(--paper); color: var(--ink); }
nav.tabs button[aria-selected="true"] .pc { color: var(--paper); opacity: .8; }

section.panel { display: grid; gap: 22px; padding-top: 24px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; }
.stack { display: grid; gap: 12px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.btn { font-weight: 700; border: 1.5px solid var(--accent); color: var(--accent); background: transparent; padding: 7px 15px; border-radius: 10px; cursor: pointer; }
.btn.solid { background: var(--accent); color: var(--card); }
.btn.small { padding: 4px 10px; font-size: .88rem; }
.btn:hover { filter: brightness(1.08); }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* cümle parçaları */
.sent { display: flex; flex-wrap: wrap; gap: 6px; direction: rtl; align-items: flex-end; }
.chunk { display: inline-grid; justify-items: center; gap: 0; }
.chunk .w { font-family: var(--f-ar); font-size: 1.7rem; line-height: 1.6; padding: 0 10px; border-radius: 10px; background: color-mix(in srgb, var(--role) 13%, transparent); color: var(--ink); border-bottom: 3px solid var(--role); }
.chunk .t { font-size: .68rem; font-weight: 700; color: var(--role); letter-spacing: .04em; text-transform: uppercase; direction: ltr; }
.chunk.r-x .w { background: transparent; border-bottom-color: transparent; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 12px; height: 12px; border-radius: 3px; background: var(--role); display: inline-block; }
.trline { font-size: .92rem; color: var(--muted); }
.ex-list { display: grid; gap: 14px; }
.ex-item { display: grid; gap: 2px; padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
.ex-item:last-child { border-bottom: 0; padding-bottom: 0; }
.pairgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px 18px; }

/* ders başlığı */
.unit-hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; border-top: 5px solid var(--role); }
.unit-no { font-family: var(--f-display); font-weight: 800; font-size: 3.4rem; color: var(--role); line-height: 1; }
.unit-hero .ar.big { font-size: clamp(1.9rem, 5vw, 2.6rem); line-height: 1.5; }
.goals { margin: 0; padding-inline-start: 20px; display: grid; gap: 2px; }
.prog { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.prog div { height: 100%; background: var(--role); width: 0; transition: width .4s; }

/* kaide */
.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: k; }
.rules li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
.rules li::before { counter-increment: k; content: counter(k); font-family: var(--f-display); font-weight: 800; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--paper); }
.rules .exs { display: flex; flex-wrap: wrap; gap: 4px 16px; direction: rtl; font-family: var(--f-ar); font-size: 1.35rem; color: var(--accent); }
details.kaide { border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; }
details.kaide summary { cursor: pointer; font-weight: 700; }
details.kaide .ar { font-size: 1.3rem; }

/* görseller */
.viz { display: grid; gap: 10px; justify-items: center; }
.viz svg { width: 100%; max-width: 640px; height: auto; display: block; }
.viz .cap { font-size: .9rem; color: var(--muted); text-align: center; max-width: 60ch; }
svg .s-ref { fill: var(--ref); } svg .s-nasb { fill: var(--nasb); } svg .s-cerr { fill: var(--cerr); } svg .s-muf { fill: var(--muf); } svg .s-mus { fill: var(--mus); } svg .s-mzs { fill: var(--mzs); } svg .s-mns { fill: var(--mns); } svg .s-tks { fill: var(--tks); }
svg .s-ink { fill: var(--ink); } svg .s-muted { fill: var(--muted); } svg .s-card { fill: var(--card); } svg .s-soft { fill: var(--soft); } svg .s-good { fill: var(--good); } svg .s-bad { fill: var(--bad); }
svg .k-ink { stroke: var(--ink); } svg .k-muted { stroke: var(--muted); } svg .k-fiil { stroke: var(--fiil); } svg .k-line { stroke: var(--line); } svg .k-good { stroke: var(--good); } svg .k-bad { stroke: var(--bad); }
svg text { font-family: var(--f-body); }
svg text.a { font-family: var(--f-ar); }
.svg-scroll { overflow-x: auto; width: 100%; }

/* harita (giriş) */
.tree { display: grid; gap: 18px; justify-items: center; }
.node { border-radius: 14px; padding: 10px 16px; text-align: center; background: var(--card); border: 2px solid var(--role); display: grid; gap: 0; }
.node .ar { font-size: 1.5rem; line-height: 1.6; color: var(--role); }
.node small { color: var(--muted); font-size: .8rem; }
.node.root { --role: var(--accent); }
.tree-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; width: 100%; max-width: 760px; }
.branch { display: grid; gap: 12px; justify-items: center; padding: 14px; border-radius: 16px; background: var(--soft); position: relative; }
.branch .kids { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; direction: rtl; }
.branch .kids .node { padding: 6px 12px; }
.branch .kids .node .ar { font-size: 1.2rem; }
.branch .sample { font-family: var(--f-ar); font-size: 1.3rem; direction: rtl; }
.branch button { margin-top: 2px; }
.map-units { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.map-units .card { display: grid; gap: 6px; align-content: start; border-top: 5px solid var(--role); }
.map-units .card .ar { font-size: 1.5rem; color: var(--role); }

/* alıştırmalar */
.exer { display: grid; gap: 14px; }
.exer-head { display: grid; gap: 4px; }
.exer-head .ar { font-size: 1.35rem; color: var(--accent); }
.exer-head .cnt { font-size: .85rem; color: var(--muted); }
.exbox { background: var(--soft); border-radius: 10px; padding: 8px 12px; font-size: .95rem; }
.exbox .ar { font-size: 1.25rem; }
.items { display: grid; gap: 12px; }
.item { display: grid; gap: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.item.ok { border-color: var(--good); }
.item.no { border-color: var(--bad); }
.item .qn { font-family: var(--f-display); font-weight: 800; color: var(--muted); font-size: .95rem; }
.item .q { font-family: var(--f-ar); font-size: 1.55rem; direction: rtl; line-height: 1.8; }
.item .q u { text-decoration: none; border-bottom: 2px dashed var(--accent); padding-inline: 18px; }
.item .q u.filled { padding-inline: 2px; border-bottom-style: solid; color: var(--accent); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; direction: rtl; }
.opt { font-family: var(--f-ar); font-size: 1.35rem; line-height: 1.6; padding: 4px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; text-align: right; }
.opt.lat { font-family: var(--f-body); font-size: 1rem; font-weight: 700; padding: 8px 16px; }
.opt.block { flex: 1 1 100%; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt.sel-ok { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.opt.sel-no { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.opt[disabled] { cursor: default; }
.fb { font-size: .95rem; }
.fb .ok { color: var(--good); font-weight: 700; } .fb .no { color: var(--bad); font-weight: 700; }
.fb .ar { font-size: 1.2rem; }
.tile-line { min-height: 58px; border: 2px dashed var(--line); border-radius: 12px; padding: 6px; display: flex; flex-wrap: wrap; gap: 6px; direction: rtl; align-items: center; }
.tile-line.okk { border-style: solid; border-color: var(--good); background: var(--good-bg); }
.tile-line.nok { border-style: solid; border-color: var(--bad); background: var(--bad-bg); }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; direction: rtl; }
.tile { font-family: var(--f-ar); font-size: 1.4rem; line-height: 1.5; padding: 2px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; box-shadow: 0 2px 0 var(--line); }
.tile:hover:not([disabled]) { border-color: var(--accent); }
.tile[disabled] { opacity: .25; cursor: default; box-shadow: none; }
.tile.inl { background: var(--soft); }
.tagbtn { display: inline-grid; justify-items: center; cursor: pointer; border: 0; background: transparent; padding: 0; }
.tagbtn .w { font-family: var(--f-ar); font-size: 1.55rem; line-height: 1.6; padding: 0 10px; border-radius: 10px; border: 1.5px dashed var(--line); }
.tagbtn .t { font-size: .68rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); min-height: 1.1em; }
.tagbtn.has .w { border-style: solid; border-color: var(--role); background: color-mix(in srgb, var(--role) 13%, transparent); }
.tagbtn.has .t { color: var(--role); }
.tagbtn.wrong .w { outline: 2px solid var(--bad); outline-offset: 2px; }
.slot { font-family: var(--f-ar); font-size: 1.5rem; line-height: 1.6; padding: 0 12px; border-radius: 10px; border: 1.5px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); cursor: pointer; min-width: 64px; }
.slot.empty { color: var(--muted); border-style: dashed; }
.slot.wrong { border-color: var(--bad); background: var(--bad-bg); }
.slot.right { border-color: var(--good); background: var(--good-bg); }
.combo-line { display: flex; flex-wrap: wrap; gap: 8px; direction: rtl; align-items: center; font-family: var(--f-ar); font-size: 1.5rem; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; direction: rtl; padding: 10px; border-radius: 12px; background: var(--soft); }
.bank .tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--card); }
.cls-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.passage { font-family: var(--f-ar); font-size: 1.45rem; line-height: 2.1; direction: rtl; text-align: justify; }
.passage-tr { font-size: .98rem; color: var(--muted); }
.qa { display: grid; gap: 6px; padding: 10px 12px; border-radius: 10px; background: var(--soft); }
.qa .ar { font-size: 1.35rem; }

/* oyunlar */
.game-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
.game-card { display: grid; gap: 8px; align-content: start; border-top: 5px solid var(--role); }
.game-card .ico { font-family: var(--f-ar); font-size: 1.9rem; color: var(--role); direction: rtl; line-height: 1.4; }
.hud { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline; font-variant-numeric: tabular-nums; }
.hud b { font-family: var(--f-display); font-size: 1.45rem; color: var(--accent); }
.time-bar { height: 10px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.time-bar div { height: 100%; background: var(--accent); transition: width 1s linear; }
.time-bar.low div { background: var(--bad); }
.target { font-family: var(--f-ar); font-size: clamp(1.7rem, 6vw, 2.5rem); text-align: center; line-height: 1.8; padding: 12px; border-radius: 16px; background: var(--soft); direction: rtl; }
.target.flash-ok { background: var(--good-bg); }
.target.flash-no { background: var(--bad-bg); animation: shake .35s; }
.q-end { display: inline-block; min-width: 34px; border: 2px dashed var(--accent); border-radius: 8px; color: var(--accent); font-family: var(--f-body); font-size: 1rem; vertical-align: middle; line-height: 1.6; text-align: center; }
.big2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.big2 button, .big3 button { border: 0; border-radius: 14px; padding: 14px 6px; font-weight: 800; font-family: var(--f-display); font-size: 1.15rem; color: var(--card); background: var(--role); cursor: pointer; display: grid; gap: 2px; justify-items: center; }
.big2 button .ar, .big3 button .ar { font-weight: 400; font-size: 1.4rem; line-height: 1.3; }
.big2 button small { font-family: var(--f-body); font-weight: 500; font-size: .75rem; opacity: .85; }
.big3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.big3 button { --role: var(--accent); font-family: var(--f-ar); font-size: 1.8rem; font-weight: 400; }
.gfb { min-height: 3em; text-align: center; }
.gfb .ar { font-size: 1.3rem; }
.score-big { font-family: var(--f-display); font-size: 3rem; font-weight: 800; color: var(--accent); }
.stars { font-size: 2.1rem; letter-spacing: .15em; color: var(--muf); }
.stars .off { color: var(--line); }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
@keyframes pop { 0% { transform: scale(.92); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
.pop { animation: pop .3s; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 12px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
canvas.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
@media (max-width: 720px) {
  header.top { grid-template-columns: 1fr; }
  .unit-hero { grid-template-columns: 1fr; }
  .tree-row { grid-template-columns: 1fr; }
  .chunk .w { font-size: 1.45rem; }
  .item .q { font-size: 1.35rem; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* --- bu programa özel --- */
.viz { grid-template-columns: minmax(0, 1fr); }
.viz > * { max-width: 100%; min-width: 0; }
.chunk.r-dash .w { background: transparent; border-bottom-color: transparent; color: var(--muted); }
.sent .plain { font-family: var(--f-ar); font-size: 1.55rem; line-height: 1.6; color: var(--muted); align-self: center; padding: 0 2px; }
.tagbtn.findbtn.on .w { border-style: solid; border-color: var(--y); background: color-mix(in srgb, var(--y) 14%, transparent); }
.tagbtn.findbtn.miss .w { outline: 2px dashed var(--good); outline-offset: 2px; }
.srcline { font-size: .85rem; color: var(--muted); }
.sumgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }

// Alıştırmaları maddelere aç
function expand(ex) {
  if (ex._items) return ex._items;
  var out = [];
  if (ex.type === "dp") {
    ex.rows.forEach(function (r) {
      out.push({ kind: "pick", q: r.s + " ← (müsennâ)", o: shuffle(r.d), a: r.d[0], tr: r.tr[1], why: r.why });
      out.push({ kind: "pick", q: r.s + " ← (cem)", o: shuffle(r.p), a: r.p[0], tr: r.tr[2], why: r.why });
    });
  } else if (ex.type === "bank") {
    var n = ex.parts ? ex.parts.filter(function (p) { return typeof p !== "string"; }).length : ex.items.length;
    for (var i = 0; i < n; i++) out.push({ kind: "bank" });
  } else if (ex.items) {
    ex.items.forEach(function (it) { var c = {}; for (var k in it) c[k] = it[k]; c.kind = ex.type; out.push(c); });
  }
  ex._items = out;
  return out;
}
function subCls(ex) { var a = []; if (ex.cls) a.push(["c", ex.cls]); if (ex.cls2) a.push(["d", ex.cls2]); return a; }
function allScorable(u) {
  var n = 0, ok = 0;
  u.ex.forEach(function (ex, ei) {
    expand(ex).forEach(function (it, ii) { n++; if (ST.items[u.id + "-" + ei + "-" + ii] === 1) ok++; });
    subCls(ex).forEach(function (sc) { sc[1].items.forEach(function (it, ii) { n++; if (ST.items[u.id + "-" + ei + "-" + sc[0] + ii] === 1) ok++; }); });
  });
  return { n: n, ok: ok };
}
function mark(key, good) {
  var prev = ST.items[key];
  if (good) { if (prev !== 1) { ST.items[key] = 1; saveItems(); addXP(prev === 2 ? 2 : 5, true); beep("ok"); } }
  else { if (prev !== 1) { ST.items[key] = 2; saveItems(); } beep("no"); }
  updateProgress();
}
function updateProgress() {
  UNITS.forEach(function (u) {
    var p = allScorable(u), el = document.querySelector('nav.tabs [data-tab="' + u.id + '"] .pc');
    if (el) el.textContent = Math.round(p.ok / p.n * 100) + "%";
    var bar = document.getElementById("prog-" + u.id);
    if (bar) { bar.style.width = (p.ok / p.n * 100) + "%"; var t = document.getElementById("progt-" + u.id); if (t) t.textContent = p.ok + " / " + p.n; }
  });
}

    '<button role="tab" data-tab="oyun">Oyunlar</button><button role="tab" data-tab="quiz">Quiz Provası</button>';
}
function setTab(t) {
  if (t !== "oyun") stopGame();
  if (t !== "quiz") stopQuiz();
  ST.tab = t; store.set("tab", t);
  document.querySelectorAll("nav.tabs button").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.tab === t ? "true" : "false"); });
  render();
  var sel = document.querySelector('nav.tabs button[data-tab="' + t + '"]');
  if (sel) { try { sel.scrollIntoView({ block: "nearest", inline: "nearest" }); } catch (x) {} }
}
function render() {
  LIVE = {};
  if (ST.tab === "ozet") main.innerHTML = renderOzet();
  else if (ST.tab === "oyun") main.innerHTML = renderGames();
  else if (ST.tab === "quiz") main.innerHTML = renderQuiz();
  else main.innerHTML = renderUnit(unitById(ST.tab));

      legendHtml(rolesUsed) + '<div class="ex-list">' + exHtml + '</div>' + '<p class="muted">' + ({ u1: "Mavi kelime muzâf, mor kelime muzâfun ileyh.", u2: "Muzâfın rengi haline göre değişiyor; muzâfun ileyh hep mecrûr.", u3: "Nunun düştüğü yere bak; arkadan gelen haberde nun kalıyor.", u4: "Parçadan üç örnek." })[u.id] + '</p>' + '</div>' +

function renderExercise(u, ex, ei) {

  else if (ex.type === "bank") body = renderBank(u, ex, ei);
  else {
    if (ex.reading) body += readingText(ex);
    if (ex.type === "tag") body += legendHtml(ex.roles);
    body += '<div class="items">' + its.map(function (it, ii) { var k = u.id + "-" + ei + "-" + ii; return '<div class="item ' + statusCls(k) + '" id="it-' + k + '">' + itemInner(u, ei, ii, it, ex) + '</div>'; }).join("") + '</div>';
  }
  return '<div class="card exer" id="ex-' + u.id + '-' + ei + '"><div class="exer-head"><div class="ar">' + (ex.num || AR_NUM[ei]) + ' ـ ' + ex.ar + '</div><div><b>' + ex.tr + '</b>' + (ex.extra ? '<span class="extra-tag">Ek alıştırma</span>' : '') + '</div></div>' +
    (ex.exHtml ? '<div class="exbox"><span class="lbl">مِثَالٌ · Örnek</span><div>' + ex.exHtml + '</div></div>' : '') + body + '</div>';
}
function statusCls(k) { return ""; }
function readingText(ex) {
  var body = ex.dialog ? '<div class="stack" style="gap:4px">' + ex.dialog.map(function (d) { return '<p class="passage" style="text-align:right"><b class="' + (d[0] === "مَرْيَمُ" ? "r-mun" : "r-muz") + '">' + d[0] + ':</b> ' + d[1] + '</p>'; }).join("") + '</div>' : '<p class="passage">' + ex.text + '</p>';
  return '<div class="card stack" style="background:var(--soft);border:0"><h3 class="ar" style="font-size:1.6rem;color:var(--accent)">' + ex.title + '</h3>' + body +

}
function trAfter(it) { return it.tr && typeof it.tr === "string" ? '<div class="trline">' + it.tr + '</div>' : ''; }
function retryBtn(key) { return '<div><button class="btn small" data-act="retry" data-key="' + key + '">Tekrar dene</button></div>'; }
function optsFor(it, ex) { return it.opts || ex.opts || [["i", "İsim cümlesi", "اسْمِيَّةٌ", "x"], ["f", "Fiil cümlesi", "فِعْلِيَّةٌ", "x"]]; }

      }).join("") + '</div>' +
      (chosen != null ? '<div class="fb">' + (chosen === ansIdx ? '<span class="ok">Doğru.</span> ' : '<span class="no">Yanlış.</span> Doğrusu: <span class="ar">' + it.o[ansIdx] + '</span> ') + (it.why || '') + '</div>' + trAfter(it) + retryBtn(key) : '');

      var cls = c ? (b[0] === it.a ? " sel-ok" : (b[0] === c ? " sel-no" : "")) : "";

    }).join("") + '</div>' +
      (c ? '<div class="fb">' + (c === it.a ? '<span class="ok">Doğru.</span> ' : '<span class="no">Yanlış.</span> Doğrusu: <b>' + right[1] + '</b>. ') + (it.why || '') + '</div>' + trAfter(it) + retryBtn(key) : '');
  }

    var line = cs.map(function (ch, ci) {

        var on = !!L.tags[ci], target = ch.r === "y";

      (res === "ok" ? '<div class="fb"><span class="ok">Doğru.</span> ' + (it.why || '') + '</div>' + trAfter(it) :
        '<div class="row-btns"><button class="btn small solid" data-act="tcheck" data-key="' + key + '">Kontrol et</button>' + (res === "no" ? '<button class="btn small" data-act="tshow" data-key="' + key + '">Doğrusunu göster</button>' : '') + '</div>' +

}
function gameOver(t, lines) {
  return '<div class="card stack" style="text-align:center;justify-items:center"><div class="lbl">' + t + ' bitti</div>' + (G.stars != null ? starsHtml(G.stars) : '') + '<div class="score-big tabular">' + G.final + '</div>' + (G.record ? '<p><b>Yeni rekor!</b></p>' : '') + lines.map(function (l) { return '<p>' + l + '</p>'; }).join("") +
    '<p class="muted">Kazandığın: +' + G.xp + ' rütbe puanı</p><div class="row-btns" style="justify-content:center"><button class="btn solid" data-gstart="' + G.id + '"' + (G.deck ? ' data-deck="' + G.deck + '"' : '') + '>Tekrar oyna</button><button class="btn" data-gmenu="1">Başka oyun</button></div></div>';
}
function gameBody() { return { avci: bodyAvci, hal: bodySpeed, dy: bodySpeed, kur: bodyKur, hafiza: bodyHaf }[G.id](); }
function starsBy(ok, n) { return ok >= n - 1 ? 3 : ok >= Math.ceil(n * 0.66) ? 2 : 1; }

// doğru şekil
function bodyAvci() {
  if (G.over) return gameOver("Doğru Şekil", ['<b class="tabular">' + G.ok + ' / ' + G.list.length + '</b> doğru.']);
  var it = G.list[G.i], done = G.ans != null;
  return '<div class="card stack">' + gameHead("Doğru Şekil") + '<div class="hud"><span>Cümle <b>' + (G.i + 1) + '/' + G.list.length + '</b></span><span>Puan <b>' + G.score + '</b></span></div>' +
    '<div class="target">' + (done ? poolHtml(it) : poolHtml(it, "blank")) + '</div>' +
    (done ? '<div class="fb" style="text-align:center">' + (G.ans === it.w ? '<span class="ok">Doğru! +10</span> ' : '<span class="no">Yanlış.</span> Doğrusu: <span class="ar">' + it.w + '</span>. ') + '<br>' + why(it) + '</div>' + (ST.tr ? '<p class="trline" style="text-align:center">' + it.tr + '</p>' : '') +
      '<div style="text-align:center"><button class="btn solid" data-gnext="1" id="g-next">' + (G.i + 1 < G.list.length ? "Sonraki" : "Sonucu gör") + '</button></div>' :
      '<p class="muted" style="text-align:center">Boşluğa hangisi gelir?</p><div class="big3">' + it.opts.map(function (f) { return '<button data-ga="' + f + '">' + f + '</button>'; }).join("") + '</div>') + '</div>';
}
// hız oyunları: hal yarışı ve doğru/yanlış
function nextSpeed() {
  var g = 0, it;
  if (G.id === "hal") { do { it = pick(POOL); g++; } while (G.cur && it.w === G.cur.w && g < 10); G.cur = { html: poolHtml(it), a: it.c, fb: why(it) }; }
  else { do { it = pick(DY_POOL); g++; } while (G.cur && it[0] === G.cur.w && g < 10); G.cur = { w: it[0], html: it[0], a: it[1] ? "d" : "y", fb: '<span class="ar">' + it[0] + '</span>: ' + arWrap(it[2]) }; }
}
function bodySpeed() {
  var title = GAMES[G.id].name;
  if (G.over) return gameOver(title, ['Doğru: <b class="tabular">' + G.ok + ' / ' + G.n + '</b> · en uzun seri: <b class="tabular">' + G.maxCombo + '</b>']);
  return '<div class="card stack">' + gameHead(title) +
    '<div class="hud"><span>Süre <b id="g-time">' + G.t + '</b></span><span>Puan <b id="g-score">' + G.score + '</b></span><span>Çarpan <b id="g-combo">x' + Math.min(5, 1 + Math.floor(G.combo / 3)) + '</b></span></div>' +
    '<div class="time-bar' + (G.t <= 10 ? " low" : "") + '" id="g-tbar"><div style="width:' + (G.t / 60 * 100) + '%"></div></div>' +
    '<div class="target" id="g-target">' + G.cur.html + '</div><div class="gfb" id="g-fb"><span class="muted">Klavye: ' + SPEED[G.id].keys + '</span></div>' +
    '<div class="big5">' + G.opts.map(function (o, i) { return '<button style="--role:var(--' + o[3] + ')" data-gs="' + o[0] + '"><span class="ar">' + o[2] + '</span>' + o[1] + '<small>' + (i + 1) + '</small></button>'; }).join("") + '</div></div>';
}
function speedPick(v) {
  if (!G || G.over || G.lock) return;
  var c = G.cur, ok = c.a === v, tg = document.getElementById("g-target"), fb = document.getElementById("g-fb");
  G.n++;
  if (ok) {
    G.ok++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
    var m = Math.min(5, 1 + Math.floor((G.combo - 1) / 3)); G.score += 10 * m; beep("ok");
    fb.innerHTML = '<b style="color:var(--good)">Doğru +' + 10 * m + '</b> · önceki: ' + c.fb;
    tg.classList.remove("flash-no"); tg.classList.add("flash-ok"); nextSpeed(); tg.innerHTML = G.cur.html;
    setTimeout(function () { tg.classList.remove("flash-ok"); }, 180);
  } else {
    G.combo = 0; G.t = Math.max(0, G.t - 3); beep("no"); G.lock = true;
    fb.innerHTML = '<b style="color:var(--bad)">Yanlış, −3 sn.</b> ' + c.fb;
    void tg.offsetWidth; tg.classList.add("flash-no");
    setTimeout(function () { if (!G || G.over) return; G.lock = false; tg.classList.remove("flash-no"); nextSpeed(); tg.innerHTML = G.cur.html; fb.innerHTML = '<span class="muted">Klavye: ' + SPEED[G.id].keys + '</span>'; if (G.t <= 0) endGame(G.score); }, 1800);
  }
  hud();
}
// izafet kur
function bodyKur() {
  if (G.over) return gameOver("İzafet Kur", ['<b class="tabular">' + G.ok + ' / ' + G.list.length + '</b> doğru terkip.']);
  var it = G.list[G.i], done = G.ans != null;
  return '<div class="card stack">' + gameHead("İzafet Kur") + '<div class="hud"><span>Tur <b>' + (G.i + 1) + '/' + G.list.length + '</b></span><span>Puan <b>' + G.score + '</b></span></div>' +
    '<div class="target"><span style="color:var(--mz)">' + it[0] + '</span> + <span style="color:var(--mi)">' + it[4] + '</span><div class="muted" style="font-family:var(--f-body);font-size:1rem;direction:ltr">' + it[5] + '</div></div>' +
    '<div class="opts">' + it.o.map(function (o, oi) {
      var cls = done ? (o[1] ? " sel-ok" : (G.ans === oi ? " sel-no" : "")) : "";
      return '<button class="opt block' + cls + '" data-gk="' + oi + '"' + (done ? " disabled" : "") + '>' + o[0] + '</button>';
    }).join("") + '</div>' +
    (done ? '<div class="fb" style="text-align:center">' + (it.o[G.ans][1] ? '<span class="ok">Doğru! +10</span>' : '<span class="no">Yanlış.</span> ' + it.o[G.ans][2]) + '</div><div style="text-align:center"><button class="btn solid" data-gnext="1" id="g-next">' + (G.i + 1 < G.list.length ? "Sonraki" : "Sonucu gör") + '</button></div>' : '') + '</div>';
}
// hafıza
function bodyHaf() {
  if (G.over) return gameOver("Hafıza Kartları", ['<b class="tabular">' + G.moves + '</b> hamlede, <b class="tabular">' + G.secs + '</b> saniyede bitirdin.']);
  return '<div class="card stack">' + gameHead("Hafıza Kartları · " + HAFIZA[G.deck].name) +
    '<div class="hud"><span>Hamle <b id="g-moves">' + G.moves + '</b></span><span>Çift <b id="g-pairs">' + Object.keys(G.done).length + '/' + G.pairs + '</b></span><span>Süre <b id="g-clock">0 sn</b></span></div>' +
    '<div class="mem">' + G.cards.map(function (c, i) { var lat = /^[A-Za-zÇĞİÖŞÜçğıöşü]/.test(c.t); return '<button class="mcard' + (G.done[c.p] ? " done" : "") + '" data-gc="' + i + '" aria-label="Kart ' + (i + 1) + '"><div class="in"><div class="face back">؟</div><div class="face front' + (lat ? " lat" : "") + '">' + c.t + '</div></div></button>'; }).join("") + '</div></div>';
}
function flip(i) {
  if (!G || G.over || G.lock) return;
  var c = G.cards[i]; if (G.done[c.p] || G.open.indexOf(i) >= 0) return;
  G.open.push(i); document.querySelector('[data-gc="' + i + '"]').classList.add("up");
  if (G.open.length < 2) return;
  G.moves++; document.getElementById("g-moves").textContent = G.moves;
  var a = G.cards[G.open[0]], b = G.cards[G.open[1]];
  if (a.p === b.p) {
    G.done[a.p] = 1; beep("ok");
    G.open.forEach(function (j) { var e = document.querySelector('[data-gc="' + j + '"]'); e.classList.remove("up"); e.classList.add("done"); });
    G.open = []; document.getElementById("g-pairs").textContent = Object.keys(G.done).length + "/" + G.pairs;
    if (Object.keys(G.done).length === G.pairs) { G.secs = Math.floor((Date.now() - G.start) / 1000); G.stars = G.moves <= 9 ? 3 : G.moves <= 13 ? 2 : 1; setTimeout(function () { endGame(G.stars * 20 + Math.max(0, 60 - G.secs)); }, 500); }
  } else {
    G.lock = true; beep("no");
    setTimeout(function () { if (!G) return; G.open.forEach(function (j) { var e = document.querySelector('[data-gc="' + j + '"]'); if (e) e.classList.remove("up"); }); G.open = []; G.lock = false; }, 950);
  }
}

// ---------- QUIZ PROVASI ----------
var TOPIC = { u1: "İzafet terkibi", u2: "Muzâfın i'rabı", u3: "Nun düşer", u4: "Okuma" };
var Q = null, QT = null;
function stopQuiz() { if (QT) { clearInterval(QT); QT = null; } if (Q && !Q.done) Q = null; }
function quizBank() {
  var bank = { u1: [], u2: [], u3: [], u4: [] };
  UNITS.forEach(function (u) {
    u.ex.forEach(function (ex) {
      expand(ex).forEach(function (it) {
        if (it.kind === "pick") bank[u.id].push({ inst: ex.tr.split(".")[0] + ".", q: it.q.replace("___", "……"), o: it.o.slice(), a: it.o[it.a], why: it.why || "", tr: it.tr || "" });
        if (it.kind === "classify") bank[u.id].push({ inst: "Bu izafet doğru kurulmuş mu?", q: it.s, o: ex.opts.map(function (x) { return x[1]; }), a: ex.opts.filter(function (x) { return x[0] === it.a; })[0][1], why: it.why || "", tr: it.tr || "" });
        if (it.kind === "irab") bank[u.id].push({ inst: "Altı çizili kelimenin hali ne?", q: it.s.replace(/\[(.+?)\]/, '<b class="hl">$1</b>'), o: ["Merfû", "Mansûb", "Mecrûr"], a: HAL_TR[it.c], why: it.why || "", tr: it.tr || "" });
      });
    });
  });
  POOL.forEach(function (p) {
    var k = /müsennâ|cem/.test(p.role) ? "u3" : "u2";
    bank[k].push({ inst: "Boşluğa hangisi gelir?", q: poolHtml(p, "blank"), o: p.forms.slice(), a: p.w, why: why(p), tr: p.tr });
    if (k === "u2") bank.u4.push({ inst: "Altı çizili kelimenin hali ne?", q: poolHtml(p), o: ["Merfû", "Mansûb", "Mecrûr"], a: HAL_TR[p.c], why: why(p), tr: p.tr });
  });
  DY_POOL.forEach(function (d) { bank[/nun|ـِي|صَاحِبَيِ/.test(d[2]) ? "u3" : "u1"].push({ inst: "Bu izafet doğru kurulmuş mu?", q: d[0], o: ["Doğru", "Yanlış"], a: d[1] ? "Doğru" : "Yanlış", why: arWrap(d[2]) }); });
  KUR_POOL.forEach(function (k) { bank.u1.push({ inst: "İki kelimeden doğru izafeti seç (" + k[5] + ").", q: k[0] + " + " + k[4], o: kurOpts(k).map(function (x) { return x[0]; }), a: k[2] + " " + k[3], why: "" }); });
  return bank;
}
function startQuiz() {
  var bank = quizBank(), qs = [];
  ["u1", "u2", "u3", "u4"].forEach(function (k) {
    var seen = {}, got = 0;
    shuffle(bank[k]).forEach(function (q) { var sig = q.q.replace(/<[^>]+>/g, ""); if (got >= 5 || seen[sig]) return; seen[sig] = 1; got++; q.topic = k; q.o = shuffle(q.o); qs.push(q); });
  });
  Q = { qs: shuffle(qs), i: 0, ans: [], start: Date.now(), done: false };
  main.innerHTML = renderQuiz();
  QT = setInterval(function () { var el = document.getElementById("qz-clock"); if (el && Q && !Q.done) { var s = Math.floor((Date.now() - Q.start) / 1000); el.textContent = Math.floor(s / 60) + ":" + ("0" + s % 60).slice(-2); } }, 1000);
}
function renderQuiz() {
  var best = store.get("qbest", null);
  if (!Q) return '<section class="panel"><div class="card stack" style="text-align:center;justify-items:center"><div class="lbl">Quiz provası</div><h2>Gerçek quiz gibi: 20 soru</h2>' +
    '<p class="muted" style="max-width:60ch">Her konudan 5 soru gelir: boşluk doldurma, hal bulma, doğru-yanlış ve izafet kurma. Cevaplar sonda gösterilir. Sonunda konu konu puanını ve yanlışlarının açıklamasını görürsün. Her denemede sorular değişir.</p>' +
    (best != null ? '<p>En iyi sonucun: <b class="tabular">' + best + ' / 20</b></p>' : '') + '<button class="btn solid" data-qstart="1">Provayı başlat</button></div></section>';
  if (Q.done) {
    var by = {}; Q.qs.forEach(function (q, i) { by[q.topic] = by[q.topic] || [0, 0]; by[q.topic][1]++; if (Q.ans[i] === q.a) by[q.topic][0]++; });
    var tot = Q.qs.filter(function (q, i) { return Q.ans[i] === q.a; }).length;
    var col = { u1: "mz", u2: "ref", u3: "mus", u4: "mi" };
    var weak = Object.keys(by).filter(function (k) { return by[k][0] / by[k][1] < 0.8; });
    return '<section class="panel"><div class="card stack" style="text-align:center;justify-items:center"><div class="lbl">Quiz provası bitti · ' + Q.time + '</div>' + starsHtml(tot >= 18 ? 3 : tot >= 14 ? 2 : 1) + '<div class="score-big tabular">' + tot + ' / 20</div>' +
      '<p>' + (tot >= 18 ? "Konuya hâkimsin. Aferin!" : tot >= 14 ? "İyi gidiyorsun. Aşağıdaki zayıf konuya bir kez daha bak." : "Önce Özet'teki dört soruyu çalış, zayıf konunun alıştırmalarını çöz, sonra provayı tekrarla.") + '</p>' +
      '<div class="qz-bars">' + ["u1", "u2", "u3", "u4"].map(function (k) { var v = by[k] || [0, 5]; return '<div class="qz-bar" style="--role:var(--' + col[k] + ')"><span>' + TOPIC[k] + '</span><div class="tr2"><div style="width:' + (v[0] / v[1] * 100) + '%"></div></div><b class="tabular">' + v[0] + '/' + v[1] + '</b></div>'; }).join("") + '</div>' +
      (weak.length ? '<div class="row-btns" style="justify-content:center">' + weak.map(function (k) { return '<button class="btn small" data-go="' + k + '">' + TOPIC[k] + ' konusuna dön</button>'; }).join("") + '</div>' : '') +
      '<div class="row-btns" style="justify-content:center"><button class="btn solid" data-qstart="1">Yeni prova</button></div></div>' +
      '<div class="card stack"><div class="lbl">Cevap anahtarı</div><h2>Yanlışların</h2>' + (tot === 20 ? '<p>Hiç yanlışın yok.</p>' : '<div class="items">' + Q.qs.map(function (q, i) {
        if (Q.ans[i] === q.a) return "";
        return '<div class="item no"><span class="qz-type">' + TOPIC[q.topic] + ' · ' + q.inst + '</span>' + (q.q ? '<div class="q">' + q.q + '</div>' : '') + '<div class="fb"><span class="no">Senin cevabın:</span> ' + arw(Q.ans[i] || "boş") + '<br><span class="ok">Doğrusu:</span> ' + arw(q.a) + (q.why ? '<br>' + q.why : '') + '</div>' + (q.tr ? '<div class="trline">' + q.tr + '</div>' : '') + '</div>';
      }).join("") + '</div>') + '</div></section>';
  }
  var q = Q.qs[Q.i];
  return '<section class="panel"><div class="card stack"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div><div class="lbl">Quiz provası · ' + TOPIC[q.topic] + '</div><h2>Soru ' + (Q.i + 1) + ' / 20</h2></div><div class="hud"><span>Süre <b id="qz-clock">0:00</b></span></div></div>' +
    '<div class="progress prog"><div style="width:' + (Q.i / 20 * 100) + '%;--role:var(--accent)"></div></div>' +
    '<p><b>' + q.inst + '</b></p>' + (q.q ? '<div class="target" style="font-size:clamp(1.5rem,5vw,2.2rem)">' + q.q + '</div>' : '') +
    '<div class="opts">' + q.o.map(function (o, oi) { var lat = /^[A-Za-zÇĞİÖŞÜçğıöşü]/.test(o); return '<button class="opt block' + (lat ? " lat" : "") + (Q.ans[Q.i] === o ? " sel-ok" : "") + '" data-qa="' + oi + '">' + o + '</button>'; }).join("") + '</div>' +
    '<div class="row-btns"><button class="btn small" data-qprev="1"' + (Q.i === 0 ? " disabled" : "") + '>Önceki</button><button class="btn small" data-qskip="1">' + (Q.i < 19 ? "Sonraki" : "Bitir") + '</button></div></div></section>';
}
function arw(t) { return /[؀-ۿ]/.test(t) ? '<span class="ar">' + t + '</span>' : '<b>' + t + '</b>'; }
function quizNext() {
  if (Q.i < 19) { Q.i++; main.innerHTML = renderQuiz(); return; }
  var s = Math.floor((Date.now() - Q.start) / 1000); Q.time = Math.floor(s / 60) + " dk " + (s % 60) + " sn"; Q.done = true;
  if (QT) { clearInterval(QT); QT = null; }
  var tot = Q.qs.filter(function (q, i) { return Q.ans[i] === q.a; }).length, best = store.get("qbest", null);
  if (best == null || tot > best) store.set("qbest", tot);
  main.innerHTML = renderQuiz(); window.scrollTo({ top: 0 }); addXP(tot * 4); if (tot >= 18) confetti(); beep("win");
}

main.addEventListener("click", function (ev) {
  var b = ev.target.closest("button"); if (!b) return;
  var d = b.dataset;
  if (d.qstart) { startQuiz(); window.scrollTo({ top: 0 }); return; }
  if (d.qa != null && Q && !Q.done) { Q.ans[Q.i] = Q.qs[Q.i].o[+d.qa]; beep("tick"); setTimeout(quizNext, 180); return; }
  if (d.qprev && Q && Q.i > 0) { Q.i--; main.innerHTML = renderQuiz(); return; }
  if (d.qskip && Q) { quizNext(); return; }
  if (d.gstart) { startGame(d.gstart, d.deck); window.scrollTo({ top: 0 }); return; }
  if (d.gmenu) { stopGame(); redraw(); return; }
  if (!G) return;
  if (d.gs) speedPick(d.gs);
  else if (d.ga != null) { if (G.ans != null) return; G.ans = d.ga; if (d.ga === G.list[G.i].w) { G.ok++; G.score += 10; beep("ok"); } else beep("no"); redraw(); }
  else if (d.gnext) { G.i++; G.ans = null; if (G.i >= G.list.length) { G.stars = starsBy(G.ok, G.list.length); endGame(G.score); } else redraw(); }
  else if (d.gk != null) { if (G.ans != null) return; G.ans = +d.gk; if (G.list[G.i].o[G.ans][1]) { G.ok++; G.score += 10; beep("ok"); } else beep("no"); redraw(); }
  else if (d.gc != null) flip(+d.gc);
});
document.addEventListener("keydown", function (ev) {
  if (ST.tab !== "oyun" || !G || G.over || !SPEED[G.id]) return;
  var i = ["1", "2", "3"].indexOf(ev.key); if (i >= 0 && i < G.opts.length) { ev.preventDefault(); speedPick(G.opts[i][0]); }
});


document.getElementById("tabs").addEventListener("click", function (ev) {
  var b = ev.target.closest("button[data-tab]"); if (!b) return; setTab(b.dataset.tab); window.scrollTo({ top: 0 });
});
renderTabs(); renderXP(); setTab(ST.tab);
})();
</script>
</body>
