<style>
/* Layout: kitabın kapağındaki merdiven — 15 istasyonlu bir tırmanış haritası; her istasyonun kendi rengi, oyun salonu ve atölye ayrı odalar */
:root{
  --bg:#f4f5fa; --card:#ffffff; --sunk:#e9ebf3; --ink:#1a1f3a; --muted:#5d6380; --line:#d9dce8;
  --violet:#6a3fb5; --violet-soft:#ece5f8; --coral:#e8594a; --coral-soft:#fde6e2; --mint:#1f9d78; --mint-soft:#dcf3ea; --sun:#e6a417; --sun-soft:#fbf0d4;
  --raf:#2f64d6; --nasb:#d9771a; --jar:#1f9d78; --jazm:#a03fb5;
  --sl:46%; --ss:64%; --sb:95%;
  --f-disp:"Baloo Bhaijaan 2","Lexend",system-ui,sans-serif;
  --f-body:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-ar:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;
  --r:18px; --ar:1;
  --shadow:0 1px 2px rgb(26 31 58 / .06),0 6px 18px rgb(26 31 58 / .07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1222; --card:#181c33; --sunk:#22274a; --ink:#eceefa; --muted:#a3a8c7; --line:#2c3256;
  --violet:#b294f0; --violet-soft:#2b2350; --coral:#ff8a7c; --coral-soft:#3d2228; --mint:#5fd3ab; --mint-soft:#173a31; --sun:#f5c14d; --sun-soft:#3a311a;
  --raf:#86a8ff; --nasb:#ffad5c; --jar:#5fd3ab; --jazm:#d896ef; --sl:68%; --ss:70%; --sb:18%;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 8px 22px rgb(0 0 0 / .3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1222; --card:#181c33; --sunk:#22274a; --ink:#eceefa; --muted:#a3a8c7; --line:#2c3256;
  --violet:#b294f0; --violet-soft:#2b2350; --coral:#ff8a7c; --coral-soft:#3d2228; --mint:#5fd3ab; --mint-soft:#173a31; --sun:#f5c14d; --sun-soft:#3a311a;
  --raf:#86a8ff; --nasb:#ffad5c; --jar:#5fd3ab; --jazm:#d896ef; --sl:68%; --ss:70%; --sb:18%;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 8px 22px rgb(0 0 0 / .3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;font-weight:400}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--card)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-disp);font-weight:800;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;line-height:1.9;font-size:calc(1.3em * var(--ar))}
.muted{color:var(--muted)} .small{font-size:.85rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--muted)}
.st{--c:hsl(var(--h) var(--ss) var(--sl)); --c2:hsl(var(--h) 75% var(--sb))}

/* ---- üst çubuk ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;border:0;background:none;padding:0}
.logo .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--violet),var(--coral));color:#fff;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:1.05rem;letter-spacing:-.03em}
.logo b{font-family:var(--f-disp);font-size:1.15rem;line-height:1}
.logo span.s{display:block;font-size:.7rem;color:var(--muted);font-weight:500}
.nav{display:flex;gap:4px;margin-inline-start:12px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:none;padding:8px 14px;border-radius:12px;color:var(--muted);font-weight:500;white-space:nowrap;display:flex;gap:7px;align-items:center}
.nav button svg{width:18px;height:18px}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--violet-soft);color:var(--violet);font-weight:600}
.hud{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--sunk);font-weight:600;font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.xp{background:var(--violet-soft);color:var(--violet)} .chip.fire{background:var(--coral-soft);color:var(--coral)}
.ib{border:1px solid var(--line);background:var(--card);border-radius:12px;min-width:38px;height:38px;display:grid;place-items:center;padding:0 8px}
.ib:hover{background:var(--sunk)}
.ib[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}

/* ---- genel ---- */
.wrap{max-width:1180px;margin:0 auto;padding-block:26px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view[hidden]{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.pad{padding:20px}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:600;background:var(--violet);color:#fff;display:inline-flex;align-items:center;gap:8px;box-shadow:0 3px 0 rgb(0 0 0 / .18);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgb(0 0 0 / .18)}
.btn.coral{background:var(--coral)} .btn.mint{background:var(--mint)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:.88rem;border-radius:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin:34px 0 14px}
.sec-h h2{font-size:1.6rem}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.c{background:var(--c2);color:var(--c)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:11px 18px;border-radius:14px;z-index:90;font-weight:500;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.xpfly{position:fixed;z-index:95;font-family:var(--f-disp);font-weight:800;color:var(--violet);pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-60px) scale(1.4)}}

/* ---- harita ---- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:30px;align-items:center}
.hero h1{font-size:clamp(2.1rem,4.6vw,3.6rem)}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--violet),var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .arline{font-family:var(--f-ar);color:var(--violet);font-size:clamp(1.4rem,3vw,2rem);direction:rtl;margin-bottom:6px}
.hero p{max-width:56ch;color:var(--muted)}
.mapbox{position:relative;padding:10px}
.map{width:100%;height:auto;display:block;overflow:visible}
.map .node{cursor:pointer}
.map .node circle.b{transition:transform .2s;transform-box:fill-box;transform-origin:center}
.map .node:hover circle.b,.map .node:focus circle.b{transform:scale(1.08)}
.map text{font-family:var(--f-disp);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:26px}
.stat{padding:16px 18px}
.stat b{display:block;font-family:var(--f-disp);font-size:2rem;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .bar{height:8px;border-radius:9px;background:var(--sunk);overflow:hidden;margin-top:8px}
.stat .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--coral));border-radius:9px}
.stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.stcard{padding:16px;display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);width:100%}

.stcard .num{flex:0 0 52px;height:52px;border-radius:16px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:1.3rem}
.stcard .meta{min-width:0;flex:1}

.stars .off{color:var(--line)}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:16px;border:1px dashed var(--line);color:var(--muted);font-size:.85rem}
.badge .i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:1rem}
.badge.on{border-style:solid;border-color:var(--sun);color:var(--ink);background:var(--sun-soft)}
.badge.on .i{background:var(--sun);color:#fff}
.hundred{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:4px;direction:rtl}
.hundred button{aspect-ratio:1;border:0;border-radius:6px;background:var(--c2);color:var(--c);font-size:.62rem;font-weight:600;padding:0;font-variant-numeric:tabular-nums}
.hundred button.on{background:var(--c);color:#fff}

/* ---- istasyon ---- */
.band{border-radius:26px;padding:26px;background:linear-gradient(135deg,var(--c),hsl(calc(var(--h) + 35) var(--ss) var(--sl)));color:#fff;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;inset:auto -60px -80px auto;width:260px;height:260px;border-radius:50%;background:rgb(255 255 255 / .12)}
.band h1{font-size:clamp(1.8rem,4vw,2.6rem)}
.band .ar{font-size:calc(clamp(1.5rem,3.4vw,2.1rem) * var(--ar));line-height:1.6}
.band .row{position:relative;z-index:1}
.band .btn.ghost{background:rgb(255 255 255 / .16);color:#fff;border-color:rgb(255 255 255 / .35)}
.matn{padding:18px 22px}
.matn .ar{font-size:calc(1.45rem * var(--ar))}
.tree{display:flex;flex-direction:row-reverse;align-items:center;gap:0;overflow-x:auto;padding:6px 2px 10px}
.tree .root{flex:0 0 auto;padding:12px 18px;border-radius:16px;background:var(--c);color:#fff;font-family:var(--f-ar);font-size:1.2rem;font-weight:700;direction:rtl;max-width:220px;text-align:center;line-height:1.5}
.tree .branches{display:flex;flex-direction:column;gap:6px;border-right:3px solid var(--c);padding-right:0;margin-right:16px;position:relative}
.tree .branches::before{content:"";position:absolute;right:-19px;top:50%;width:16px;border-top:3px solid var(--c)}
.tree .leaf{display:flex;flex-direction:row-reverse;align-items:center;gap:0}
.tree .leaf::before{content:"";width:16px;border-top:3px solid var(--c);flex:0 0 16px}
.tree .leaf button{border:1.5px solid var(--c);background:var(--c2);color:var(--ink);border-radius:12px;padding:6px 12px;font-family:var(--f-ar);font-size:1.08rem;direction:rtl;white-space:nowrap}
.tree .leaf button:hover{background:var(--c);color:#fff}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.item{border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center;position:relative;box-shadow:var(--shadow)}
.item:hover{border-color:var(--c);transform:translateY(-2px)}
.item .n{position:absolute;top:8px;left:10px;font-size:.72rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.item .ok{position:absolute;top:8px;right:10px;color:var(--mint);font-weight:700}
.item .big{font-family:var(--f-ar);font-size:calc(1.7rem * var(--ar));color:var(--c);font-weight:700;line-height:1.7;direction:rtl}

.item .sub{font-size:.78rem;color:var(--muted);line-height:1.3}

/* ---- âmil paneli ---- */
.sheet{position:fixed;inset:0;z-index:70;display:flex;justify-content:flex-end;background:rgb(15 18 34 / .45);backdrop-filter:blur(2px)}
.sheet .panel{width:min(720px,100%);height:100%;overflow:auto;background:var(--bg);padding:22px;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));padding-right:max(22px,env(safe-area-inset-right,0px));animation:slide .25s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
.phead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.phead .big{font-family:var(--f-ar);font-size:calc(clamp(2.6rem,8vw,3.8rem) * var(--ar));color:var(--c);line-height:1.4;direction:rtl;font-weight:700}
.meaning{margin-top:16px;padding:16px}
.meaning .mh{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.meaning .mh .ar{color:var(--c);font-weight:700;font-size:calc(1.25rem * var(--ar))}
.ex{border-top:1px dashed var(--line);padding:10px 0;display:grid;gap:2px}
.ex:first-of-type{border-top:0}
.ex .s{font-family:var(--f-ar);direction:rtl;font-size:calc(1.5rem * var(--ar));line-height:2;text-align:right}
.ex .t{color:var(--muted);font-size:.92rem}
.ex .q{font-size:.72rem;font-weight:600;color:var(--mint);background:var(--mint-soft);border-radius:999px;padding:1px 8px;margin-inline-start:6px}
.am{color:var(--coral);font-weight:700;background:var(--coral-soft);border-radius:6px;padding:0 2px}
.mm{color:var(--raf);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.4em}
.say{border:0;background:var(--sunk);border-radius:10px;width:34px;height:34px;display:inline-grid;place-items:center}
.say:hover{background:var(--violet-soft);color:var(--violet)}

/* ---- oyun / etkinlik ---- */
.hub{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.gcard{padding:20px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;width:100%}
.gcard:hover{border-color:var(--violet);transform:translateY(-2px)}
.gcard .ico{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;color:#fff}
.gcard .ico svg{width:28px;height:28px}
.gcard h3{font-size:1.2rem}
.gcard .best{position:absolute;top:16px;right:16px}
.stage{max-width:820px;margin:0 auto}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ghead h2{font-size:1.5rem}
.prog{height:10px;border-radius:10px;background:var(--sunk);overflow:hidden;flex:1;min-width:120px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--coral));transition:width .3s}
.qbox{padding:26px;text-align:center}
.qbox .s{font-family:var(--f-ar);direction:rtl;font-size:calc(clamp(1.7rem,5vw,2.5rem) * var(--ar));line-height:2.1}
.qbox .big{font-family:var(--f-ar);font-size:calc(clamp(2.6rem,9vw,4rem) * var(--ar));color:var(--violet);line-height:1.5;font-weight:700}
.blank{display:inline-block;min-width:2.4em;border-bottom:3px dashed var(--violet);color:var(--violet)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:18px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px;font-weight:500;box-shadow:0 3px 0 var(--line);transition:transform .08s}
.opt.ar{font-family:var(--f-ar);font-size:calc(1.35rem * var(--ar));line-height:1.7;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--violet)}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.good{border-color:var(--mint);background:var(--mint-soft);box-shadow:0 3px 0 var(--mint)}
.opt.bad{border-color:var(--coral);background:var(--coral-soft);box-shadow:0 3px 0 var(--coral);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:16px;padding:12px 16px;border-radius:14px;font-weight:500}
.fb.good{background:var(--mint-soft);color:var(--mint)} .fb.bad{background:var(--coral-soft);color:var(--coral)}
.toks{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;direction:rtl}
.toks button{font-family:var(--f-ar);font-size:calc(1.6rem * var(--ar));border:2px solid var(--line);background:var(--card);border-radius:14px;padding:2px 16px;line-height:1.9;box-shadow:0 3px 0 var(--line)}
.toks button.good{border-color:var(--mint);background:var(--mint-soft)} .toks button.bad{border-color:var(--coral);background:var(--coral-soft)}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;perspective:900px}
.mcard{aspect-ratio:3/4;max-width:100%;border:0;background:none;padding:0;position:relative}
.mcard .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.mcard.flip .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:grid;place-items:center;padding:8px;text-align:center}
.mcard .f{background:linear-gradient(135deg,var(--violet),var(--coral));color:#fff;font-family:var(--f-disp);font-size:1.8rem;font-weight:800}
.mcard .b{background:var(--card);border:2px solid var(--line);transform:rotateY(180deg);font-size:.82rem;line-height:1.3}
.mcard .b.ar{font-family:var(--f-ar);font-size:calc(1.5rem * var(--ar));color:var(--violet);font-weight:700}
.mcard.done .b{border-color:var(--mint);background:var(--mint-soft)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:20px}
.bucket{border:2px dashed var(--c);background:var(--c2);border-radius:16px;padding:12px 10px;font-weight:600;color:var(--ink);font-size:.88rem;min-height:64px}
.bucket.good{border-style:solid;background:var(--mint-soft)} .bucket.bad{border-style:solid;background:var(--coral-soft);animation:shake .3s}
.timer{font-family:var(--f-disp);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}
.stairs{display:flex;align-items:flex-end;gap:3px;height:120px;margin:10px 0 18px;direction:ltr}
.stairs div{flex:1;background:var(--sunk);border-radius:6px 6px 0 0;position:relative}
.stairs div.on{background:linear-gradient(180deg,var(--violet),var(--coral))}
.stairs div.me::after{content:"";position:absolute;left:50%;top:-22px;width:16px;height:16px;transform:translateX(-50%);border-radius:50%;background:var(--sun);box-shadow:0 0 0 4px var(--sun-soft)}
.lab{padding:24px}
.lab .sent{font-family:var(--f-ar);direction:rtl;text-align:center;font-size:calc(clamp(2rem,6vw,3rem) * var(--ar));line-height:2;margin:10px 0}
.lab .end{display:inline-block;border-radius:8px;padding:0 3px;transition:background .3s}
.lab .end.raf{background:color-mix(in srgb,var(--raf) 18%,transparent);color:var(--raf)}
.lab .end.nasb{background:color-mix(in srgb,var(--nasb) 20%,transparent);color:var(--nasb)}
.lab .end.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6);opacity:.2}60%{transform:scale(1.25)}100%{transform:none}}
.lab .amil{color:var(--coral);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:500}
.chips button .ar{font-size:1.15rem;line-height:1.4}
.chips button[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}
.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:.85rem;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.tbl{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.95rem}

td.ar{font-size:calc(1.25rem * var(--ar));line-height:1.6;text-align:right}
tr.grp td{background:var(--c2);color:var(--c);font-weight:700;font-family:var(--f-disp)}
.search{padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);width:min(380px,100%)}

/* ===== VERİ: Cürcânî, el-Avâmilü'l-Mie — "Tavdîhu metni'l-Avâmili'l-Mie" (1442/2021) esas alınmıştır =====
   Örnek alanları: s = cümle, t = Türkçe, a = âmil (cümlede geçtiği biçim), m = ma'mûl(ler), q = âyet/hadis/şiir etiketi */
const AMEL = {

  rn:   {tr:"Ref' ve nasb eder", short:"Ref' · nasb", ar:"يَرْفَعُ وَيَنْصِبُ"},

const BOOK = {
 title:"تَوْضِيحُ مَتْنِ الْعَوَامِلِ الْمِئَةِ لِلْجُرْجَانِيِّ",

 authorTr:"İmam Abdülkâhir b. Abdurrahmân b. Muhammed el-Cürcânî eş-Şâfiî (ö. 471/1078)",
 date:"Şevval 1442 / Haziran 2021",
 khutba:"الْحَمْدُ لِلّٰهِ رَبِّ الْعَالَمِينَ، وَالصَّلَاةُ وَالسَّلَامُ عَلَى مُحَمَّدٍ، وَآلِهِ وَصَحْبِهِ أَجْمَعِينَ. أَمَّا بَعْدُ: فَإِنَّ الْعَوَامِلَ فِي النَّحْوِ -عَلَى مَا أَلَّفَهُ الشَّيْخُ الْإِمَامُ عَبْدُ الْقَاهِرِ بْنُ عَبْدِ الرَّحْمَنِ الْجُرْجَانِيُّ، رَحْمَةُ اللهِ تَعَالَى عَلَيْهِ- مِئَةُ عَامِلٍ. وَهِيَ تَنْقَسِمُ إِلَى قِسْمَيْنِ: لَفْظِيَّةٍ، وَمَعْنَوِيَّةٍ، فَاللَّفْظِيَّةُ مِنْهَا: تَنْقَسِمُ إِلَى قِسْمَيْنِ: سَمَاعِيَّةٍ، وَقِيَاسِيَّةٍ، فَالسَّمَاعِيَّةُ مِنْهَا: أَحَدٌ وَتِسْعُونَ عَامِلًا، وَالْقِيَاسِيَّةُ مِنْهَا: سَبْعَةُ عَوَامِلَ، وَالْمَعْنَوِيَّةُ مِنْهَا: عَدَدَانِ، فَالْجُمْلَةُ: مِئَةُ عَامِلٍ.",
 khutbaTr:"Hamd âlemlerin Rabbi Allah'a; salât ve selâm Muhammed'e, âline ve ashabının hepsine olsun. Şeyh İmam Abdülkâhir el-Cürcânî'nin telifine göre nahivdeki âmiller yüz tanedir. İki kısma ayrılır: lafzî ve ma'nevî. Lafzî olanlar da ikiye ayrılır: semâî ve kıyâsî. Semâî olanlar 91, kıyâsî olanlar 7, ma'nevî olanlar 2 âmildir. Toplam yüz âmil eder.",
 intro:"Arapça, Kur'an'ın, ibadetlerin ve İslâmî ilimlerin dilidir; onu bilmek Kur'an, Sünnet ve şer'î ilimleri anlamanın en önemli araçlarındandır. Arapça nahiv, sarf ve belâgattan oluşur; en büyük rüknü nahivdir. Nahivdeki muhtasar metinlerin öne çıkanlarından biri, özellikle mübtedîler için büyük önem taşıyan Cürcânî'nin el-Avâmilü'l-Mie'sidir. Tavdîh'in hazırlayıcısı metni önce ezberi kolaylaşsın diye renkli yazmış, sonra tablolar, şemalar ve bol misalle açıklamıştır."
};

function ranges(s, a, m){

  return R.sort((x,y)=>x.s-y.s);
}
function hl(s, a, m){

}

const amelKeys = [...new Set(ALL.map(amelOf))];
function qAmel(r){ const right = AMEL[amelOf(r)].tr; return {p:`<span class="eyebrow">Ne amel eder?</span><div class="big">${r.it.ar}</div>`, o:shuffle([right, ...shuffle(amelKeys.map(k=>AMEL[k].tr).filter(x=>x!==right)).slice(0,3)]), a:right, why:`${r.it.tr}: ${right}.`, r}; }
function qStation(r){ const right = r.st.tr; return {p:`<span class="eyebrow">Hangi gruptan?</span><div class="big">${r.it.ar}</div>`, o:shuffle([right, ...shuffle(STATIONS.map(s=>s.tr).filter(x=>x!==right)).slice(0,3)]), a:right, why:`${r.it.tr} → ${right} (${r.st.idx+1}. istasyon).`, r}; }
function qMeaning(r){ const m = pick(r.it.m); const right = m.tr; const pool = ALL.filter(x=>x!==r).flatMap(x=>x.it.m.map(y=>y.tr)).filter(t=>t!==right && !r.it.m.some(z=>z.tr===t)); return {p:`<span class="eyebrow">Manası / işlevi hangisi?</span><div class="big">${r.it.ar}</div>`, o:shuffle([right, ...shuffle([...new Set(pool)]).slice(0,3)]), a:right, why:`${r.it.tr}: ${right}`, r}; }
function qUse(r){ if (r.it.m.length < 2) return null; const mi = Math.floor(Math.random()*r.it.m.length), m = r.it.m[mi], e = pick(m.ex); const opts = shuffle(r.it.m.map(x=>x.ar)).slice(0,4); if (!opts.includes(m.ar)) opts[0] = m.ar; return {p:`<span class="eyebrow">Bu cümlede «${esc(strip(r.it.ar))}» hangi manada?</span><div class="s">${hl(e.s, e.a)}</div><div class="muted small">${esc(e.t)}</div>`, o:shuffle(opts), a:m.ar, ar:true, why:`${m.ar} — ${m.tr}`, r}; }
function qTrans(r){ const e = pick(r.it.m.flatMap(m=>m.ex)); const pool = ALL.flatMap(x=>x.it.m.flatMap(m=>m.ex.map(y=>y.t))).filter(t=>t!==e.t); return {p:`<span class="eyebrow">Türkçe anlamı hangisi?</span><div class="s">${hl(e.s, e.a, e.m)}</div>`, o:shuffle([e.t, ...shuffle([...new Set(pool)]).slice(0,3)]), a:e.t, why:e.t, r}; }
function qFind(r){
  const exs = r.it.m.flatMap(m=>m.ex).filter(e => e.a && e.s.split(" ").length >= 2); if (!exs.length) return null;
  const e = pick(exs); const R = ranges(e.s, e.a).filter(x=>x.k==="a"); if (!R.length) return null;
  const w = []; let p = 0; e.s.split(" ").forEach(t => { w.push({t, s:p, e:p+t.length}); p += t.length + 1; });
  const right = w.map((x,i)=> x.s < R[0].e && x.e > R[0].s ? i : -1).filter(i=>i>-1);
  return {tok:true, p:`<span class="eyebrow">Âmil hangi kelimede?</span><div class="muted small">${esc(e.t)}</div>`, w:w.map(x=>x.t), a:right, why:`Âmil: ${strip(e.a)} (${r.it.tr})`, r};
}
const GEN = [qAmel, qStation, qMeaning, qUse, qTrans, qFind];
function mixed(pool, n){ const out = []; let g = 0; while (out.length < n && g++ < 300){ const q = pick(GEN)(pick(pool)); if (q) out.push(q); } return out; }

  let open = [], found = 0, moves = 0, lock = false; const t0 = Date.now();
  go("oyun");
  $("#v-oyun").innerHTML = `<div class="stage"><div class="ghead"><div><span class="eyebrow">Eşleştir</span><h2>Hafıza Kartları</h2></div><div class="row"><span class="chip" id="mMoves">0 hamle</span><button class="btn ghost sm" data-go="oyun">Çık</button></div></div>
    <div class="mem">${cards.map((c,i)=>`<button class="mcard" data-m="${i}" aria-label="Kart ${i+1}"><span class="in"><span class="f">١٠٠</span><span class="b ${c.ar?"ar":""}">${c.ar?c.t:esc(c.t)}</span></span></button>`).join("")}</div>
    <p class="small muted" style="text-align:center;margin-top:14px">Arapça âmili, Türkçe manası/işleviyle eşleştir.</p></div>`;
  $$("[data-m]").forEach(b => b.onclick = () => {
    const i = +b.dataset.m; if (lock || b.classList.contains("flip") || b.classList.contains("done")) return;
    b.classList.add("flip"); open.push(i);
    if (open.length === 2){
      moves++; $("#mMoves").textContent = moves + " hamle"; const [x, y] = open; lock = true;
      if (cards[x].id === cards[y].id && cards[x].ar !== cards[y].ar){
        setTimeout(() => { [x,y].forEach(k => $(`[data-m="${k}"]`).classList.add("done")); open = []; lock = false; found++; beep("good"); addXp(5, b);
          if (found === P.length){ const sec = Math.round((Date.now()-t0)/1000); S.plays++; if (moves === P.length) S.perfect++; const sc = Math.max(1, 100 - (moves - P.length)*5 - Math.floor(sec/6)); S.best.hafiza = Math.max(S.best.hafiza||0, sc); save(); checkBadges(); confetti(); beep("win");
            $("#v-oyun").insertAdjacentHTML("beforeend", `<div class="stage"><div class="card done-box" style="margin-top:16px"><div class="score">${sc}</div><p>${moves} hamlede, ${sec} saniyede bitirdin.</p><div class="row" style="justify-content:center"><button class="btn coral" id="mAgain">Tekrar oyna</button><button class="btn ghost" data-go="oyun">Oyun salonu</button></div></div></div>`); $("#mAgain").onclick = memory; }
        }, 400);
      } else { beep("bad"); setTimeout(() => { [x,y].forEach(k => $(`[data-m="${k}"]`).classList.remove("flip")); open = []; lock = false; }, 900); }
    }
  });
}
function startTest(s){
  const P = s.items.map(it => it.rec);
  runQuiz({title: s.tr + " · İstasyon testi", kicker: (s.idx+1)+". istasyon", qs:mixed(P, 6), back:["istasyon", s.id, "İstasyona dön"],
    onDone: R => { if (R.score >= 5 && !S.test[s.id]){ S.test[s.id] = true; addXp(30); toast("Üçüncü yıldız kazandın! ★★★"); } },
    again: () => startTest(s)});
}

/* ===================== ETKİNLİKLER ===================== */
function startActivity(id){
  const A = ACTIVITIES.find(a => a.id === id); if (!A) return;
  let qs;
  if (A.type === "choose") qs = A.q.map(q => {
    const s = q.w ? hl(q.s, q.w) : esc(q.s).replace("____", '<span class="blank">؟</span>');
    return {p:`<span class="eyebrow">${A.ar}</span><div class="s">${s}</div>${q.t?`<div class="muted small">${esc(q.t)}</div>`:""}${A.bank?`<div class="small muted" style="margin-top:8px">Kitaptaki kelime bankası: <span class="ar" style="font-size:1.05rem">${A.bank}</span></div>`:""}`, o:q.o, a:q.o[q.a], ar:true, why:q.o[q.a] + (q.t?" — "+q.t:""), whyAr:false};
  });
  else qs = A.q.map((q, i) => ({p:`<span class="eyebrow">${A.ar}</span><div class="s">${esc(q[0])}</div><div class="muted small">Doğru dönüşümü seç</div>`, o:shuffle([q[1], ...A.wrong[i]]), a:q[1], ar:true, why:q[1]}));
  runQuiz({title:A.title, kicker:"Kitaptan etkinlik · s. "+A.page, qs: A.type==="transform" ? qs : shuffle(qs), back:["atolye","", "Atölyeye dön"], again:()=>startActivity(id)});
}

/* ===================== ATÖLYE: ÂMİL LABORATUVARI ===================== */
let LB = {s:0, a:1, last:null};
const END = {d:{raf:"ُ", nasb:"َ"}, dg:{raf:"ُ", nasb:"َ"}, n:{raf:"ٌ", nasb:"ًا"}, nt:{raf:"ٌ", nasb:"ً"}};
function renderLab(){
  const S0 = LAB_SENTENCES[LB.s], A = LAB_AMILS[LB.a];
  const fem = S0.mb[2] === "f";
  const amilWord = A.ar ? (fem && A.fem ? A.fem : A.ar) : "";
  const w = (x, c) => { const m = x[0].match(/^(.*?)(.[\u064B-\u0652]*)$/); return `${esc(m[1])}<span class="end ${c} ${LB.last!==null?"pop":""}">${esc(m[2] + END[x[1]][c])}</span>`; };
  $("#v-atolye").innerHTML = `
  <div class="sec-h" style="margin-top:0"><div><span class="eyebrow">Atölye</span><h2>Âmil Laboratuvarı</h2></div><span class="muted small">Bir cümle ve bir âmil seç; son harekelerin nasıl değiştiğini izle.</span></div>
  <div class="card lab">
    <span class="eyebrow">1 · Cümle (mübtedâ + haber)</span>
    <div class="chips" style="margin:8px 0 16px">${LAB_SENTENCES.map((x,i)=>`<button aria-pressed="${i===LB.s}" data-ls="${i}"><span class="ar">${esc(x.mb[0])+END[x.mb[1]].raf} ${esc(x.kh[0])+END[x.kh[1]].raf}</span></button>`).join("")}</div>
    <span class="eyebrow">2 · Âmil</span>
    <div class="chips" style="margin:8px 0 6px">${LAB_AMILS.map((x,i)=>`<button aria-pressed="${i===LB.a}" data-la="${i}">${x.ar?`<span class="ar">${x.ar}</span> · `:""}${esc(x.tr)}</button>`).join("")}</div>
    <div class="sent">${amilWord?`<span class="amil">${amilWord}</span> `:""}${w(S0.mb, A.mb)} ${w(S0.kh, A.kh)}</div>
    <div class="legend"><span><i style="background:var(--raf)"></i>merfû' (ref')</span><span><i style="background:var(--nasb)"></i>mansûb (nasb)</span><span><i style="background:var(--coral)"></i>âmil</span></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:18px">
      <div class="card pad" style="box-shadow:none"><span class="eyebrow">Mübtedâ şimdi</span><h3 style="margin-top:4px">${A.mb==="raf"?"Merfû'":"Mansûb"} <span class="muted small">(${A.ar ? (A.mb===A.kh && A.mb==="nasb" ? "1. mef'ûl" : A.mb==="nasb" ? "âmilin ismi" : "âmilin ismi") : "mübtedâ"})</span></h3></div>
      <div class="card pad" style="box-shadow:none"><span class="eyebrow">Haber şimdi</span><h3 style="margin-top:4px">${A.kh==="raf"?"Merfû'":"Mansûb"} <span class="muted small">(${A.ar ? (A.mb===A.kh && A.kh==="nasb" ? "2. mef'ûl" : "âmilin haberi") : "haber"})</span></h3></div>
      <div class="card pad" style="box-shadow:none"><span class="eyebrow">Kural</span><p style="margin:4px 0 0">${esc(A.note)}</p></div>
    </div>
    <p class="muted" style="text-align:center;margin:14px 0 0">${esc(S0.t)}</p>
  </div>
  <div class="sec-h"><h2>Kitaptan etkinlikler</h2><span class="muted small">Tavdîh'teki alıştırmalar, etkileşimli</span></div>
  <div class="hub">${ACTIVITIES.map(a => { const s = STB[a.st]; return `<button class="gcard st" style="${stStyle(s)}" data-act="${a.id}"><span class="tag c">${s.idx+1}. istasyon · s. ${a.page}</span><h3>${esc(a.title)}</h3><span class="ar" style="font-size:1.1rem;color:var(--c)">${a.ar}</span><span class="muted small">${esc(a.tr)} · ${a.q.length} soru</span></button>`; }).join("")}</div>`;
  $$("[data-ls]").forEach(b => b.onclick = () => { LB.s = +b.dataset.ls; LB.last = "s"; labUse(); renderLab(); });
  $$("[data-la]").forEach(b => b.onclick = () => { LB.a = +b.dataset.la; LB.last = "a"; labUse(); renderLab(); });
  $$("[data-act]").forEach(b => b.onclick = () => startActivity(b.dataset.act));
}
function labUse(){ S.labUses++; if (S.labUses % 5 === 0) addXp(5); else save(); checkBadges(); }

/* ===================== 100'LÜK TABLO ===================== */
let TQ = "";
function renderTable(){
  const f = r => !TQ || norm(r.it.ar).includes(norm(TQ)) || normTr(r.it.tr + " " + r.it.m.map(m=>m.tr).join(" ") + " " + r.st.tr).includes(normTr(TQ)) || r.it.m.some(m => norm(m.ar).includes(norm(TQ)));
  const rows = STATIONS.map(s => { const its = s.items.map(i=>i.rec).filter(f); if (!its.length) return ""; return `<tr class="grp st" style="${stStyle(s)}"><td colspan="5">${s.idx+1}. ${esc(s.tr)} <span class="ar" style="font-size:1rem;margin-inline-start:8px">${s.ar}</span></td></tr>` + its.map(r => { const m = r.it.m[0], e = m.ex[0]; return `<tr class="st" style="${stStyle(s)}"><td style="font-variant-numeric:tabular-nums;color:var(--muted)">${r.no}</td><td class="ar"><button class="btn ghost sm" data-item="${r.id}" style="font-family:var(--f-ar);font-size:1.15rem">${r.it.ar}</button></td><td>${esc(r.it.tr)}<div class="small muted">${r.it.m.map(x=>esc(x.tr)).join(" · ")}</div></td><td class="ar">${r.it.m.map(x=>x.ar).join("، ")}</td><td class="ar">${hl(e.s, e.a, e.m)}</td></tr>`; }).join(""); }).join("");
  $("#v-ozet").innerHTML = `<div class="sec-h" style="margin-top:0"><div><span class="eyebrow">Telhîs</span><h2>100 âmil tek tabloda</h2></div><input class="search" id="tq" type="search" placeholder="Ara: لن, cezm, istisnâ…" value="${esc(TQ)}" aria-label="Tabloda ara"></div>
   <div class="card tbl"><table><thead><tr><th>No</th><th>Âmil</th><th>Türkçe</th><th>Mana (kitaptan)</th><th>Misal</th></tr></thead><tbody>${rows || `<tr><td colspan="5" class="muted">“${esc(TQ)}” için sonuç yok.</td></tr>`}</tbody></table></div>`;
  const q = $("#tq"); q.oninput = () => { TQ = q.value; const p = q.selectionStart; renderTable(); const n = $("#tq"); n.focus(); n.setSelectionRange(p,p); };
}

/* ===================== BAŞLAT ===================== */
applyTheme(); hud(); checkBadges();
go((location.hash||"").slice(1) || "harita");
})();
</script>
