<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marriage Matchmaking System</title>
<style>
:root{
  --bg:#F3F5F8;--card:#fff;--ink:#16202C;--muted:#5B6877;--line:#D6DCE4;--soft:#E8ECF1;
  --accent:#1F4E8C;--accent-ink:#fff;--good:#1E7A46;--bad:#B3261E;--warn:#9A6200;
  --good-bg:#E2F2E6;--bad-bg:#FBE7E4;--warn-bg:#FFF3D6;--info-bg:#E6EEF9;
  --f:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161D;--card:#18212B;--ink:#E7EDF4;--muted:#9AA8B8;--line:#2B3744;--soft:#212C38;
  --accent:#7FB1F0;--accent-ink:#0B1624;--good:#6FD08E;--bad:#FF8A80;--warn:#F2C25C;
  --good-bg:#17301F;--bad-bg:#3A1D1A;--warn-bg:#3A2E10;--info-bg:#17283D;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.5 var(--f)}
h1,h2,h3{margin:0 0 .5em;line-height:1.25}h1{font-size:24px}h2{font-size:19px}h3{font-size:16px}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;gap:12px;align-items:center;min-height:54px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{font-weight:700;flex:1;min-width:200px}.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
nav.tabs{background:var(--card);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto}

main{padding:18px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px;font-weight:600}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-height:38px}
input[type=checkbox]{width:auto;min-height:0;margin-right:6px;vertical-align:middle}
.chk{display:flex;align-items:flex-start;gap:6px;margin:6px 0;color:var(--ink);font-weight:400;font-size:14.5px}

textarea{min-height:70px}
button.b,label.b{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer;min-height:38px;margin:0}
button.b.ghost,label.b.ghost{background:transparent;color:var(--accent)}
button.b.red{background:var(--bad);border-color:var(--bad);color:#fff}
button.b.sm{padding:4px 10px;min-height:30px;font-size:13.5px}
button.b:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.muted{color:var(--muted)}.small{font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.tw{overflow-x:auto}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--soft);color:var(--muted)}
.badge.good{background:var(--good-bg);color:var(--good)}.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.info{background:var(--info-bg);color:var(--accent)}
.note{border-radius:8px;padding:9px 12px;margin:8px 0;font-size:14px}
.note.good{background:var(--good-bg);color:var(--good)}.note.bad{background:var(--bad-bg);color:var(--bad)}
.note.warn{background:var(--warn-bg);color:var(--warn)}.note.info{background:var(--info-bg);color:var(--accent)}
.find{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.find .badge{flex:none;min-width:58px;text-align:center}
.stat{text-align:center}.stat b{display:block;font-size:28px;line-height:1.1}.stat span{font-size:12.5px;color:var(--muted)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
.login{max-width:420px;margin:60px auto}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--accent)}
.hidden{display:none}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:50;font-weight:600;opacity:0;transition:.25s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1}
.opts{display:flex;flex-wrap:wrap;gap:4px 14px}
#printarea{display:none}
@media print{body *{visibility:hidden}#printarea,#printarea *{visibility:visible}
 #printarea{display:block;position:absolute;left:0;top:0;width:100%;color:#000;background:#fff;padding:24px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand" id="brand">Marriage Matchmaking System</div>
  <div id="who" class="row"></div>
</div></header>
<nav class="tabs hidden" id="tabs"><div class="wrap" id="tabsin"></div></nav>
<div class="wrap"><main id="app"></main></div>
<div id="printarea"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =====================================================================
   FIXED SAFEGUARDS — cannot be changed by any parameter
   ===================================================================== */
const HARD={
  minAgeFloor:18,        // persons under 18 cannot be admitted to the system
  voluntary:true,        // participation is voluntary; no applications on behalf of others or under pressure
  mutualConsent:true,    // no contact details are shared until both sides separately say "I want to meet"
  noForce:true           // someone who declines cannot be forced into a match; declines are recorded without asking for a reason
};
const KEY="evlilik-tanistirma-v1";

/* ===== SHA-256 / helpers ===== */
const K256=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(str){
  const m=new TextEncoder().encode(str),l=m.length,n=((l+9+63)>>6)<<6,b=new Uint8Array(n);
  b.set(m);b[l]=0x80;const dv=new DataView(b.buffer);
  dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l*8/4294967296));
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w=new Uint32Array(64);
  for(let i=0;i<n;i+=64){
    for(let t=0;t<16;t++)w[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){const a=w[t-15],c=w[t-2];
      const s0=((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3),s1=((c>>>17)|(c<<15))^((c>>>19)|(c<<13))^(c>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0}
    let [a,b2,c,d,e,f,g,hh]=h;
    for(let t=0;t<64;t++){
      const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)),ch=(e&f)^(~e&g),t1=(hh+S1+ch+K256[t]+w[t])>>>0;
      const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)),mj=(a&b2)^(a&c)^(b2&c),t2=(S0+mj)>>>0;
      hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b2;b2=a;a=(t1+t2)>>>0}
    h=[h[0]+a,h[1]+b2,h[2]+c,h[3]+d,h[4]+e,h[5]+f,h[6]+g,h[7]+hh].map(x=>x>>>0)}
  return h.map(x=>x.toString(16).padStart(8,"0")).join("");
}
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v);
const seal=o=>sha256(canon(o));
const hashPin=(pin,salt)=>{let x=salt+pin;for(let i=0;i<1500;i++)x=sha256(x+salt);return x};
const rnd=()=>Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x=>x.toString(16).padStart(2,"0")).join("");

/* =====================================================================
   DEFAULT PARAMETERS
   ===================================================================== */
const DEFAULT_PARAMS=()=>({
  institution:"Marriage Matchmaking Unit",
  minAge:18, maxAge:60,
  matchGender:"karsi",
  minScore:60, topN:5, aggregator:"geom",
  maxActiveIntros:2, cooldownDays:30, responseDays:7,
  ageDecayYears:5,
  impW:{1:1,2:3,3:6},
  critW:{age:3,loc:2,edu:2,marital:2,kids:2},
  eduLevels:["Primary school","Middle school","High school","Associate degree","Bachelor's degree","Master's degree","Doctorate"],
  meetingMode:"Accompanied by a staff member, in a public place",
  consentVersion:"1",
  consentText:"I made this application of my own free will and in person, in order to meet someone for the purpose of marriage. I consent to my information being processed solely for matchmaking purposes and within the scope set by the institution, and to its being presented to suitable applicants as a limited introduction summary. My contact details will not be shared unless the other party and I have each separately agreed to meet. I may withdraw my application at any time without giving a reason; I am not obliged to accept a match with anyone.",
  retentionDays:365,
  fairGapPct:15,
  sessionLockMinutes:5,
  questions:[
    {id:"q_cocuk",label:"Do you want to have children?",opts:["Yes","No","Undecided"],weight:3,sensitive:false,enabled:true},
    {id:"q_yer",label:"Where you would like to live",opts:["Big city","City","Town / village","Doesn't matter"],weight:2,sensitive:false,enabled:true},
    {id:"q_aile",label:"Living with a member of your family after marriage",opts:["I would like to","I would not like to","Doesn't matter"],weight:2,sensitive:false,enabled:true},
    {id:"q_calisma",label:"Your expectation regarding your spouse working",opts:["Should work","Should not work","Doesn't matter"],weight:2,sensitive:false,enabled:true},
    {id:"q_sigara",label:"Smoking",opts:["I smoke","I do not smoke"],weight:2,sensitive:false,enabled:true},
    {id:"q_inanc",label:"Level of religious observance",opts:["High","Medium","Low"],weight:2,sensitive:true,enabled:false}
  ]
});
const IMP=[["0","Unimportant"],["1","Slightly important"],["2","Important"],["3","Mandatory (deal-breaker)"]];
const MEDENI=[["hic","Never married"],["bosanmis","Divorced"],["dul","Widowed"]];
const ISDURUM=[["calisiyor","Employed"],["ogrenci","Student"],["calismiyor","Not employed"],["emekli","Retired"]];
const SCHEMA=[
 {sec:"General"},
 {k:"institution",label:"Institution name",type:"text"},
 {k:"minAge",label:"Minimum application age",type:"int",min:HARD.minAgeFloor,max:40,help:`At least ${HARD.minAgeFloor}; cannot be lowered below this.`},
 {k:"maxAge",label:"Maximum application age",type:"int",min:25,max:99},
 {k:"matchGender",label:"Matching gender rule",type:"sel",opts:[["karsi","With the opposite gender"],["serbest","No restriction"]],help:"Determined by the competent authority in line with current legislation and institutional policy."},
 {sec:"Matching"},
 {k:"minScore",label:"Minimum compatibility score (0–100)",type:"int",min:0,max:100},
 {k:"topN",label:"Maximum number of people suggested per applicant",type:"int",min:1,max:20},
 {k:"aggregator",label:"Two-way score combination",type:"sel",opts:[["geom","Geometric mean"],["min","The lower one"],["avg","Arithmetic mean"]]},
 {k:"ageDecayYears",label:"Distance from the age preference at which the score drops to zero (years)",type:"int",min:1,max:15},
 {sec:"Process and safety"},
 {k:"maxActiveIntros",label:"Maximum simultaneous active introductions per applicant",type:"int",min:1,max:5},
 {k:"cooldownDays",label:"Waiting period before new suggestions after an introduction ends (days)",type:"int",min:0,max:365},
 {k:"responseDays",label:"Response waiting period (days)",type:"int",min:1,max:60},
 {k:"meetingMode",label:"First meeting format (text)",type:"text"},
 {k:"retentionDays",label:"Retention period for closed records (days)",type:"int",min:30,max:3650},
 {k:"fairGapPct",label:"Fairness warning threshold (percentage-point gap)",type:"int",min:1,max:60},
 {k:"sessionLockMinutes",label:"Automatic lock (minutes)",type:"int",min:1,max:60}
];
const CRIT_LABEL={age:"Age",loc:"Province of residence",edu:"Education",marital:"Marital status",kids:"Children"};

/* =====================================================================
   DATA STORE
   ===================================================================== */
let DB=null,SESSION=null,route={v:"dash"},ctx={};
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(DB))}
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2=n=>String(n).padStart(2,"0");
const dStr=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const todayStr=()=>dStr(new Date());
const fmtD=s=>s?s.split("-").reverse().join("."):"—";
const fmtT=ts=>{const d=new Date(ts);return fmtD(dStr(d))+" "+pad2(d.getHours())+":"+pad2(d.getMinutes())};
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return dStr(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);
function ageOn(birth,ref){const b=new Date(birth+"T00:00:00"),r=new Date(ref+"T00:00:00");let a=r.getFullYear()-b.getFullYear();
  if(r.getMonth()<b.getMonth()||(r.getMonth()===b.getMonth()&&r.getDate()<b.getDate()))a--;return a}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2800)}
function validTC(n){if(!/^[1-9]\d{10}$/.test(n))return false;const d=n.split("").map(Number);
  const d10=(((d[0]+d[2]+d[4]+d[6]+d[8])*7)-(d[1]+d[3]+d[5]+d[7]))%10;
  return ((d10+10)%10===d[9])&&(d.slice(0,10).reduce((a,b)=>a+b,0)%10===d[10])}
const maskId=n=>!n?"—":n.length>5?n.slice(0,3)+"•••••"+n.slice(-3):"•••";
const ROLE={admin:"Administrator",gorevli:"Case officer",denetci:"Auditor"};

/* ---- Audit log ---- */
function logEv(action,detail){
  const prev=DB.audit.length?DB.audit[DB.audit.length-1].hash:"GENESIS";
  const e={i:DB.audit.length+1,ts:Date.now(),user:SESSION?SESSION.id:"sistem",role:SESSION?SESSION.role:"-",action,detail:detail||"",prev};
  e.hash=sha256(prev+"|"+e.i+"|"+e.ts+"|"+e.user+"|"+e.role+"|"+e.action+"|"+e.detail);
  DB.audit.push(e);save();return e;
}
function verifyChain(audit){
  let prev="GENESIS";
  for(const e of audit){
    const h=sha256(prev+"|"+e.i+"|"+e.ts+"|"+e.user+"|"+e.role+"|"+e.action+"|"+e.detail);
    if(e.prev!==prev||e.hash!==h)return {ok:false,at:e.i};
    prev=e.hash}
  return {ok:true,n:audit.length};
}

/* ---- Parameter validation ---- */
function validateParams(p){
  const E=[];
  SCHEMA.forEach(s=>{if(s.type==="int"&&(!Number.isInteger(p[s.k])||p[s.k]<s.min||p[s.k]>s.max))E.push(`${s.label}: must be an integer between ${s.min} and ${s.max}.`)});
  if(p.minAge<HARD.minAgeFloor)E.push(`The minimum age cannot be lowered below ${HARD.minAgeFloor}.`);
  if(p.maxAge<=p.minAge)E.push("The maximum age must be greater than the minimum age.");
  [1,2,3].forEach(i=>{if(!Number.isInteger(p.impW[i])||p.impW[i]<0||p.impW[i]>20)E.push("Importance weights must be integers between 0 and 20.")});
  if(!(p.impW[1]<=p.impW[2]&&p.impW[2]<=p.impW[3]))E.push("Importance weights must be in ascending order (slightly ≤ important ≤ mandatory).");
  Object.keys(CRIT_LABEL).forEach(k=>{if(!Number.isInteger(p.critW[k])||p.critW[k]<0||p.critW[k]>10)E.push(`The ${CRIT_LABEL[k]} weight must be between 0 and 10.`)});
  if(!Array.isArray(p.eduLevels)||p.eduLevels.length<2)E.push("At least two education levels must be defined.");
  const ids=new Set();(p.questions||[]).forEach(q=>{
    if(!q.id||ids.has(q.id))E.push("Question IDs must be unique.");ids.add(q.id);
    if(!q.label.trim())E.push("Question text cannot be empty.");
    if(!Array.isArray(q.opts)||q.opts.length<2)E.push(`The question “${q.label}” must have at least 2 options.`);
    if(!Number.isInteger(q.weight)||q.weight<0||q.weight>10)E.push(`The weight of “${q.label}” must be between 0 and 10.`)});
  if(!p.consentText||p.consentText.trim().length<40)E.push("The explicit consent text cannot be empty or too short.");
  return E;
}

/* =====================================================================
   DATA MODEL
   ===================================================================== */
const newApplicant=()=>{DB.seq.a=(DB.seq.a||0)+1;const P=DB.params;
  return {id:`A-${new Date().getFullYear()}-${String(DB.seq.a).padStart(4,"0")}`,status:"taslak",createdAt:Date.now(),createdBy:SESSION.id,
  ad:"",soyad:"",kimNo:"",dogum:"",cins:"",telefon:"",eposta:"",il:"",ilce:"",medeni:"hic",cocuk:0,edu:"4",is:"calisiyor",meslek:"",tanitim:"",
  prefs:{ageMin:21,ageMax:35,ageImp:2,locMode:"fark_etmez",locImp:1,eduMin:"2",eduImp:1,maritalOk:["hic"],maritalImp:1,kidsOk:true,kidsImp:1},
  qa:{},consent:{data:false,sensitive:false,contactShare:false,ts:null,version:P.consentVersion},
  checks:{inPerson:false,idVerified:false,protective:false,protectiveFound:false,voluntary:false,notMarried:false},
  safetyBlock:false,safetyReason:"",cooldownUntil:"",notes:"",history:[],demo:false}};
const hist=(o,text)=>{o.history.push({ts:Date.now(),user:SESSION?SESSION.id:"sistem",text})};
const ACTIVE_INTRO=["yanit_bekliyor","kabul","bulusma_planli","devam_ediyor"];
const ST_A={taslak:["Draft",""],dogrulama:["Awaiting verification","warn"],aktif:["Active (in pool)","good"],beklemede:["On hold","info"],inceleme:["Under review","bad"],cekildi:["Withdrawn",""],engelli:["Safety block","bad"],tamamlandi:["Completed","good"],silindi:["Anonymised",""]};
const ST_I={yanit_bekliyor:["Awaiting response","warn"],reddedildi:["Declined",""],kabul:["Both sides accepted","good"],bulusma_planli:["Meeting scheduled","good"],devam_ediyor:["In progress","good"],bitti:["Ended",""],sikayet:["Complaint / review","bad"],zamanasimi:["Timed out",""],cekildi:["Applicant withdrew",""],kararverdi:["Decision to marry","good"]};
const nm=a=>a?(a.status==="silindi"?"(deleted record)":`${a.ad} ${a.soyad}`):"—";
const getA=id=>DB.applicants.find(x=>x.id===id);

/* ---- Applicant eligibility (can they be admitted to the pool?) ---- */
function checkApplicant(a,P){
  const F=[];const add=(l,id,t)=>F.push({lvl:l,id,txt:t});
  if(!a.ad.trim()||!a.soyad.trim())add("eksik","K-AD","First name and surname are missing.");
  if(!a.kimNo.trim())add("eksik","K-KIMLIK","Turkish national ID number (T.C. no) is missing.");else if(!validTC(a.kimNo.trim()))add("engel","K-TC","Turkish national ID number (T.C. no) is invalid.");
  if(!a.dogum)add("eksik","K-DOGUM","Date of birth is missing.");
  else{const y=ageOn(a.dogum,todayStr());
    if(y<HARD.minAgeFloor)add("engel","K-YAS-SABIT",`Aged ${y}; persons under ${HARD.minAgeFloor} cannot be admitted to the system.`);
    else if(y<P.minAge)add("engel","K-YAS",`Aged ${y}; the minimum application age is ${P.minAge}.`);
    else if(y>P.maxAge)add("engel","K-YAS-US",`Aged ${y}; the maximum application age is ${P.maxAge}.`)}
  if(!a.cins)add("eksik","K-CINS","Gender information is missing.");
  if(!a.il.trim())add("eksik","K-IL","Province of residence is missing.");
  if(!a.telefon.trim())add("eksik","K-TEL","Contact phone number is missing (visible to the case officer only).");
  if(!a.tanitim.trim())add("eksik","K-TANITIM","Short introduction text is missing (the summary shown to the other party).");
  if(a.checks.notMarried===false)add("eksik","K-MEDENI","No declaration was taken that the applicant has no existing marriage.");
  if(!a.consent.data)add("eksik","K-RIZA","The explicit consent text has not been approved.");
  if(!a.checks.voluntary)add("eksik","K-GONULLU","It has not been confirmed that the application was made of the applicant's own free will, without pressure.");
  if(!a.checks.inPerson)add("eksik","K-SAHSEN","It has not been confirmed that the applicant applied in person (applications on behalf of others are not accepted).");
  if(!a.checks.idVerified)add("eksik","K-ID","The identity document has not been verified by a case officer.");
  if(!a.checks.protective)add("eksik","K-KORUMA","It has not been marked that the protection/restraining order and security check was carried out.");
  if(a.checks.protectiveFound)add("engel","K-KORUMA-VAR","A protection/restraining order or security block was found; the applicant cannot be admitted to the pool.");
  if(a.safetyBlock)add("engel","K-GUVENLIK","A safety block is on record: "+(a.safetyReason||"—"));
  const sens=P.questions.some(q=>q.enabled&&q.sensitive);
  if(sens&&!a.consent.sensitive)add("bilgi","K-HASSAS","Because explicit consent was not given for sensitive (special-category) questions, these questions will not be used in matching.");
  const lv=F.map(f=>f.lvl);
  return {findings:F,status:lv.includes("engel")?"ENGEL":lv.includes("eksik")?"EKSIK":"UYGUN"};
}

/* =====================================================================
   MATCHING ENGINE
   ===================================================================== */
function critList(P,a,b){
  const L=Object.keys(CRIT_LABEL).map(k=>({k,label:CRIT_LABEL[k],w:P.critW[k]}));
  const sens=a.consent.sensitive&&b.consent.sensitive;
  P.questions.filter(q=>q.enabled&&(!q.sensitive||sens)).forEach(q=>L.push({k:"q:"+q.id,label:q.label,w:q.weight,q}));
  return L;
}
function satisfy(a,b,c,P,today){
  const pr=a.prefs;
  if(c.k==="age"){const ba=ageOn(b.dogum,today);let s;
    if(ba>=pr.ageMin&&ba<=pr.ageMax)s=1;else{const d=ba<pr.ageMin?pr.ageMin-ba:ba-pr.ageMax;s=Math.max(0,1-d/P.ageDecayYears)}
    return {s,imp:+pr.ageImp,note:`age ${ba} (wanted ${pr.ageMin}–${pr.ageMax})`}}
  if(c.k==="loc"){const s=pr.locMode==="fark_etmez"?1:(b.il.trim().toLowerCase()===a.il.trim().toLowerCase()?1:0);
    return {s,imp:+pr.locImp,note:pr.locMode==="fark_etmez"?"doesn't matter":`${b.il} (wants the same province)`}}
  if(c.k==="edu"){const d=(+b.edu)-(+pr.eduMin);const s=d>=0?1:Math.max(0,1+d/3);
    return {s,imp:+pr.eduImp,note:`${P.eduLevels[+b.edu]||"?"} (at least ${P.eduLevels[+pr.eduMin]||"?"})`}}
  if(c.k==="marital"){const s=pr.maritalOk.includes(b.medeni)?1:0;return {s,imp:+pr.maritalImp,note:MEDENI.find(x=>x[0]===b.medeni)[1]}}
  if(c.k==="kids"){const s=(b.cocuk>0&&!pr.kidsOk)?0:1;return {s,imp:+pr.kidsImp,note:b.cocuk>0?`has ${b.cocuk} child(ren)`:"no children"}}
  const q=c.q,mine=a.qa[q.id],theirs=b.qa[q.id];
  if(!mine||!mine.accept||mine.accept.length===0)return {s:1,imp:0,note:"no preference stated"};
  if(!theirs||!theirs.ans)return {s:0.5,imp:+mine.imp,note:"no answer"};
  return {s:mine.accept.includes(theirs.ans)?1:0,imp:+mine.imp,note:theirs.ans};
}
function scoreDir(a,b,P,today){
  let num=0,den=0;const why=[];
  for(const c of critList(P,a,b)){
    const r=satisfy(a,b,c,P,today);
    if(r.imp===3&&r.s<1)return {hard:true,why:[{label:c.label,s:r.s,imp:r.imp,note:r.note}]};
    const w=c.w*(r.imp===0?0:P.impW[r.imp]);num+=w*r.s;den+=w;
    why.push({label:c.label,s:r.s,imp:r.imp,note:r.note})}
  return {hard:false,score:den?num/den*100:100,why};
}
function activeIntroCount(id){return DB.intros.filter(i=>ACTIVE_INTRO.includes(i.status)&&(i.a===id||i.b===id)).length}
function pairBlocked(a,b){return DB.blocked.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a))}
function poolable(x,P,today){
  return x.status==="aktif"&&!x.safetyBlock&&x.consent.data&&(!x.cooldownUntil||today>=x.cooldownUntil)&&activeIntroCount(x.id)<P.maxActiveIntros;
}
function pairOk(a,b,P,today){
  if(a.id===b.id)return "same person";
  if(!poolable(a,P,today)||!poolable(b,P,today))return "not in the pool";
  if(P.matchGender==="karsi"&&a.cins===b.cins)return "gender rule";
  if(pairBlocked(a.id,b.id))return "previously declined/blocked";
  if(DB.intros.some(i=>(i.a===a.id&&i.b===b.id)||(i.a===b.id&&i.b===a.id)))return "previously suggested";
  return null;
}
function scorePair(a,b,P,today){
  const ab=scoreDir(a,b,P,today),ba=scoreDir(b,a,P,today);
  if(ab.hard||ba.hard)return {hard:true};
  const s1=ab.score,s2=ba.score;
  const s=P.aggregator==="min"?Math.min(s1,s2):P.aggregator==="avg"?(s1+s2)/2:Math.sqrt(s1*s2);
  return {hard:false,score:s,sa:s1,sb:s2,whyA:ab.why,whyB:ba.why};
}
function runMatching(){
  const P=DB.params,today=todayStr();
  const pool=DB.applicants.filter(x=>poolable(x,P,today));
  const all=[];let considered=0;
  for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++){
    const a=pool[i],b=pool[j];if(pairOk(a,b,P,today))continue;considered++;
    const r=scorePair(a,b,P,today);if(r.hard||r.score<P.minScore)continue;
    all.push({a:a.id,b:b.id,score:Math.round(r.score*10)/10,sa:Math.round(r.sa),sb:Math.round(r.sb)})}
  // best topN for each applicant
  const per={};all.forEach(p=>{(per[p.a]=per[p.a]||[]).push(p);(per[p.b]=per[p.b]||[]).push(p)});
  const keep=new Set();Object.values(per).forEach(L=>L.sort((x,y)=>y.score-x.score).slice(0,P.topN).forEach(p=>keep.add(p.a+"|"+p.b)));
  const sug=all.filter(p=>keep.has(p.a+"|"+p.b)).sort((x,y)=>y.score-x.score);
  const withAny=new Set();sug.forEach(p=>{withAny.add(p.a);withAny.add(p.b)});
  const run={id:(DB.runs.length?DB.runs[DB.runs.length-1].id+1:1),ts:Date.now(),user:SESSION.id,paramSeal:seal(P),pool:pool.length,considered,suggestions:sug,
    noMatch:pool.filter(x=>!withAny.has(x.id)).map(x=>x.id)};
  DB.runs.push(run);if(DB.runs.length>5)DB.runs.shift();
  logEv("ESLESTIRME_CALISTIRILDI",`run ${run.id}; pool ${pool.length}; suggestions ${sug.length}; seal ${run.paramSeal.slice(0,12)}`);
  return run;
}

function vMatch(){
  const run=DB.runs[DB.runs.length-1];const P=DB.params;
  let h=`<div class="row"><h1 class="sp">Matching</h1>${can.edit()?`<button class="b" data-act="runmatch">Run matching</button>`:""}</div>
  <div class="note info small">The system only produces <b>suggestions</b>; no applicant is matched or notified automatically. A case officer selects one of the suggestions and starts an <b>introduction process</b>; nothing is shared until both sides have separately stated their own decision. Scores are calculated from the applicants' <b>own stated preferences</b> and the institution's parameters.</div>`;
  if(!run)return h+`<div class="card muted">Matching has not been run yet.</div>`;
  const aq=(ctx.mq||"").toLowerCase();
  const L=run.suggestions.filter(p=>!aq||(nm(getA(p.a))+" "+nm(getA(p.b))+p.a+p.b).toLowerCase().includes(aq));
  const stale=run.paramSeal!==seal(P);
  h+="@@WHY@@";
  h+=`<div class="card"><div class="row"><div class="sp">Run #${run.id} · ${fmtT(run.ts)} · pool ${run.pool} · pairs examined ${run.considered} · suggestions ${run.suggestions.length}</div><span class="badge ${stale?"warn":"good"}">${stale?"parameters changed, run again":"current parameters"}</span></div>
   <div class="row" style="margin-top:8px"><input id="mq" placeholder="Applicant name or no." value="${esc(ctx.mq||"")}" style="max-width:260px"></div>
   <div class="tw"><table><tr><th>Score</th><th>Applicant 1</th><th>Applicant 2</th><th>1→2</th><th>2→1</th><th></th></tr>
   ${L.slice(0,200).map(p=>{const a=getA(p.a),b=getA(p.b);const ok=a&&b&&!pairOk(a,b,P,todayStr());
    return `<tr><td><b>${p.score}</b><div class="bar"><i style="width:${p.score}%"></i></div></td><td>${esc(nm(a))}<div class="small muted">${p.a} · ${a?ageOn(a.dogum,todayStr()):""} · ${esc(a?a.il:"")}</div></td>
    <td>${esc(nm(b))}<div class="small muted">${p.b} · ${b?ageOn(b.dogum,todayStr()):""} · ${esc(b?b.il:"")}</div></td><td>${p.sa}</td><td>${p.sb}</td>
    <td><button class="b ghost sm" data-act="why" data-a="${p.a}" data-b="${p.b}">Why?</button> ${can.edit()?`<button class="b sm" data-act="startintro" data-a="${p.a}" data-b="${p.b}" ${ok?"":"disabled"}>Start introduction</button>`:""}</td></tr>`}).join("")||`<tr><td colspan="6" class="muted">No suggestions.</td></tr>`}</table></div></div>`;
  let whyHtml="";
  if(ctx.why){const a=getA(ctx.why.a),b=getA(ctx.why.b);const r=scorePair(a,b,P,todayStr());
    const rows=(w)=>w.map(x=>`<tr><td>${esc(x.label)}</td><td>${x.s>=1?"✔":x.s>0?"≈":"✘"}</td><td>${["None","Low","Important","Mandatory"][x.imp]}</td><td class="small">${esc(x.note)}</td></tr>`).join("");
    whyHtml=`<div class="card"><h3>Compatibility details: ${esc(nm(a))} ↔ ${esc(nm(b))}</h3>${r.hard?`<p>A mandatory preference is not met.</p>`:`<div class="grid g2"><div><b>${esc(nm(a))} is looking for (${Math.round(r.sa)})</b><div class="tw"><table><tr><th>Criterion</th><th></th><th>Importance</th><th>Other party</th></tr>${rows(r.whyA)}</table></div></div>
     <div><b>${esc(nm(b))} is looking for (${Math.round(r.sb)})</b><div class="tw"><table><tr><th>Criterion</th><th></th><th>Importance</th><th>Other party</th></tr>${rows(r.whyB)}</table></div></div></div>`}</div>`}
  h=h.replace("@@WHY@@",whyHtml);
  if(run.noMatch.length)h+=`<div class="card"><h3>Applicants without suggestions in this run (${run.noMatch.length})</h3><p class="small muted">Applicants who have narrowed their preferences very much (e.g. many “mandatory” items) or for whom no suitable applicant exists in the pool. It may be advisable to talk with the applicant and ask them to review their preferences.</p><div>${run.noMatch.map(id=>`<a href="#" data-act="open" data-id="${id}">${esc(nm(getA(id)))}</a>`).join(" · ")}</div></div>`;
  return h;
}

/* ---- Fairness report ---- */
function groupStats(keyFn,label){
  const P=DB.params,run=DB.runs[DB.runs.length-1];const G={};
  DB.applicants.filter(a=>a.status==="aktif"||a.status==="beklemede").forEach(a=>{const k=keyFn(a);if(!k)return;const g=G[k]=G[k]||{n:0,none:0,intros:0,acc:0,decided:0};
    g.n++;if(run&&run.noMatch.includes(a.id))g.none++;
    DB.intros.filter(i=>i.a===a.id||i.b===a.id).forEach(i=>{g.intros++;const s=i.a===a.id?"a":"b";if(i.resp[s].dec){g.decided++;if(i.resp[s].dec==="kabul")g.acc++}})});
  const tot=Object.values(G).reduce((x,g)=>({n:x.n+g.n,none:x.none+g.none}),{n:0,none:0});const base=tot.n?tot.none/tot.n*100:0;
  return `<div class="card"><h3>${label}</h3><div class="tw"><table><tr><th>Group</th><th>Applicants</th><th>Without suggestions</th><th>Introductions</th><th>Acceptance rate</th><th></th></tr>
   ${Object.entries(G).sort().map(([k,g])=>{const pct=g.n?g.none/g.n*100:0;const gap=pct-base;return `<tr><td>${esc(k)}</td><td>${g.n}</td><td>${g.none} (${Math.round(pct)}%)</td><td>${g.intros}</td><td>${g.decided?Math.round(g.acc/g.decided*100)+"%":"—"}</td><td>${g.n>=5&&gap>P.fairGapPct?`<span class="badge warn">${Math.round(gap)} points above the overall rate</span>`:""}</td></tr>`}).join("")||`<tr><td colspan="6" class="muted">No data.</td></tr>`}</table></div></div>`;
}
function vFair(){

  return `<h1>Fairness report</h1><div class="note info small">Aggregate (non-personal) indicators for monitoring whether the matching process systematically gives some groups fewer opportunities. Based only on the latest matching run${run?` (#${run.id})`:""}. The warning threshold is ${P.fairGapPct} percentage points (a parameter). This report is a <b>warning signal</b>, not evidence of discrimination; case officers and the auditor investigate the cause together.</div>
  ${groupStats(a=>a.cins==="K"?"Female":a.cins==="E"?"Male":"",'By gender')}

function readParamsForm(){
  const f=$('form[data-form="params"]');const P=JSON.parse(JSON.stringify(DB.params));
  SCHEMA.forEach(s=>{if(!s.k)return;const el=f.elements[s.k];if(!el)return;P[s.k]=s.type==="int"?parseInt(el.value,10):el.value});
  [1,2,3].forEach(i=>P.impW[i]=parseInt(f.elements["iw"+i].value,10));
  Object.keys(CRIT_LABEL).forEach(k=>P.critW[k]=parseInt(f.elements["cw_"+k].value,10));
  P.eduLevels=f.elements.edu.value.split("\n").map(x=>x.trim()).filter(Boolean);
  P.questions.forEach((q,i)=>{q.label=f.elements["ql_"+i].value.trim();q.opts=f.elements["qo_"+i].value.split(",").map(x=>x.trim()).filter(Boolean);
    q.weight=parseInt(f.elements["qw_"+i].value,10);q.sensitive=f.elements["qs_"+i].checked;q.enabled=f.elements["qe_"+i].checked});
  P.consentText=f.elements.consentText.value;P.consentVersion=f.elements.consentVersion.value.trim()||"1";

function applyParams(P,reason,src){
  const E=validateParams(P);if(E.length){alert("Parameters are invalid:\n• "+E.join("\n• "));return false}
  if(!reason||reason.trim().length<5){alert("A reason for the change is required (at least 5 characters).");return false}
  if(canon(P)===canon(DB.params)){toast("No changes.");return false}
  DB.params=P;const s=seal(P);
  DB.paramHistory.push({ver:DB.paramHistory.length+1,ts:Date.now(),user:SESSION.id,reason:reason.trim(),seal:s,params:JSON.parse(JSON.stringify(P))});
  logEv("PARAMETRE_DEGISTI",`version ${DB.paramHistory.length}; seal ${s}; ${src||"form"}; reason: ${reason.trim()}`);

}

  return `<h1>Audit log</h1>${ch.ok?`<div class="note good">Chain verified: ${ch.n} entries, no corruption. Latest seal: <span class="mono">${DB.audit.length?DB.audit[DB.audit.length-1].hash:"—"}</span></div>`:`<div class="note bad"><b>Chain is broken at entry ${ch.at}.</b></div>`}
  <div class="card"><div class="row"><input id="aq" placeholder="Filter…" value="${esc(ctx.aq||"")}" style="max-width:320px"><button class="b ghost sm" data-act="exportaudit">Download log</button></div>
  <div class="tw"><table><tr><th>#</th><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr>${L.map(e=>`<tr><td>${e.i}</td><td class="small">${fmtT(e.ts)}</td><td>${esc(e.user)}<div class="small muted">${e.role}</div></td><td>${esc(e.action)}</td><td class="small">${esc(e.detail)}</td></tr>`).join("")}</table></div>
  <p class="small muted">Each entry contains the SHA-256 digest of the previous entry. Any later modification breaks the chain and becomes visible here. A browser-based design does not provide full tamper protection; in official use the log must be exported regularly and kept signed by the authority.</p></div>`;
}

function vAbout(){return `<h1>About, principles and limits</h1>
 <div class="card"><h3>What does it do?</h3><ul><li>Records applications made of their own free will by adults who wish to marry, and tracks identity and safety confirmations.</li><li>Calculates a two-way <b>compatibility score</b> based on the applicants' <b>own stated</b> preferences and importance levels and on the institution's parameters, and produces a list of suggestions.</li><li>A case officer starts an <b>introduction process</b> from a suggestion: separate decision of each side → scheduled meeting → outcome. Every step is written to the audit log.</li><li>Rules, weights, questions and the consent text are changed on the Parameters page; every change is versioned and sealed.</li></ul></div>
 <div class="card"><h3>Fixed safeguards (cannot be changed)</h3><ul><li>Persons under ${HARD.minAgeFloor} cannot be admitted to the system.</li><li>Participation is voluntary; applications are made in person, and applications on behalf of family or third parties are not accepted.</li><li>No contact details are shared unless both sides have separately said “I want to meet”; the system never matches anyone automatically.</li><li>An applicant who declines cannot be forced into a match, and the same pair is never suggested again. An applicant may withdraw at any time and may request deletion of their personal data.</li><li>A person with a protection/restraining order or a safety block is not admitted to the pool.</li><li>A match creates no obligation to marry.</li></ul></div>
 <div class="card"><h3>Fairness and data protection</h3><ul><li>The criteria come from the applicant's own preference; the institution only sets the weights. Matching must not be done on fields such as ethnic origin, race or political opinion.</li><li>Sensitive data such as religion is <b>off</b> by default; if enabled, it is used only with the applicant's separate explicit consent.</li><li>The fairness report monitors whether the process gives some groups fewer opportunities.</li><li>Every suggestion is explainable: the “Why?” screen shows which criteria were met.</li></ul></div>
 <div class="card"><h3>Limits (please read)</h3><ul>
  <li><b>This is a decision-support tool.</b> The compatibility score does not predict the success of a marriage; it only measures how far the applicants' stated preferences overlap. The final decision always rests with the applicants themselves.</li>
  <li><b>No official queries.</b> Because it runs offline, it cannot query the population registry, criminal records or protection orders; these are confirmations that the case officer carries out and ticks manually.</li>
  <li><b>Browser security is limited.</b> PIN and role checks run in the browser; someone with full access to the device can alter the data. The seal and chain reveal changes; they do not prevent them. Official use requires device management, disk encryption, signed backups and the institution's IT/KVKK (Turkish personal data protection law) approval.</li>
  <li>The legal compliance of personal data (KVKK, the Turkish personal data protection law) notices, authorisations, retention and destruction processes and of the matching policy is the responsibility of the institution and the competent authority; the default values are only a starting suggestion.</li></ul></div>`}

function seedDemo(){
  const P=DB.params;const ils=["Ankara","Istanbul","Izmir","Bursa","Konya"],erk=["Adam","Daniel","Michael","Ryan","Omar","Karim","Samir","Leo"],kad=["Emma","Sara","Laila","Nora","Maya","Hannah","Amira","Julia"],sy=["Hart","Reed","Cole","Frost","Bell","Shaw","Wood","Ford"];
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const tc=()=>{const d=[1+Math.floor(Math.random()*9)];for(let i=1;i<9;i++)d.push(Math.floor(Math.random()*10));
    const d10=(((d[0]+d[2]+d[4]+d[6]+d[8])*7)-(d[1]+d[3]+d[5]+d[7]))%10;d.push((d10+10)%10);d.push(d.reduce((x,y)=>x+y,0)%10);return d.join("")};
  for(let n=0;n<40;n++){
    const a=newApplicant();a.demo=true;const k=n%2===0;a.cins=k?"K":"E";a.ad=pick(k?kad:erk);a.soyad=pick(sy);a.kimNo=tc();
    const age=22+Math.floor(Math.random()*14);const dt=new Date();dt.setFullYear(dt.getFullYear()-age);dt.setDate(dt.getDate()-Math.floor(Math.random()*300));a.dogum=dStr(dt);
    a.telefon="05"+Math.floor(100000000+Math.random()*899999999);a.il=pick(ils);a.edu=String(2+Math.floor(Math.random()*5));a.meslek=pick(["Teacher","Engineer","Nurse","Shopkeeper","Civil servant","Accountant"]);
    a.tanitim="Demo record: short introduction text.";a.is="calisiyor";a.medeni=Math.random()<.9?"hic":"bosanmis";a.cocuk=a.medeni==="hic"?0:1;
    a.prefs.ageMin=Math.max(P.minAge,age-6);a.prefs.ageMax=age+7;a.prefs.ageImp=pick([1,2,2,3]);a.prefs.locMode=pick(["fark_etmez","ayni_il"]);a.prefs.locImp=pick([0,1,2,3]);
    a.prefs.eduMin=String(Math.max(0,+a.edu-1));a.prefs.eduImp=pick([0,1,2]);a.prefs.maritalOk=Math.random()<.7?["hic"]:["hic","bosanmis","dul"];a.prefs.maritalImp=pick([1,2,3]);a.prefs.kidsOk=Math.random()<.6;a.prefs.kidsImp=pick([1,2]);
    P.questions.filter(q=>q.enabled).forEach(q=>{const ans=pick(q.opts);const acc=q.opts.filter(o=>o===ans||o==="Doesn't matter"||Math.random()<.35);a.qa[q.id]={ans,accept:acc,imp:String(pick([0,1,1,2,2,3]))}});
    a.consent={data:true,sensitive:false,contactShare:Math.random()<.7,ts:Date.now(),version:P.consentVersion};
    a.checks={inPerson:true,idVerified:true,protective:true,protectiveFound:false,voluntary:true,notMarried:true};
    a.status="aktif";hist(a,"Demo data created");DB.applicants.push(a)}
  logEv("DENEME_VERISI","40 demo applicants added");save();
}

    logEv("GORUSME_SONUCU",`${i.id} ${o1}/${o2}`);save();render();return}

  if(a==="complaint"){const i=it();const r=reason("Complaint / safety report (record only necessary information):");if(!r)return;i.status="sikayet";i.history.push({ts:Date.now(),user:SESSION.id,text:"Complaint: "+r});
    [i.a,i.b].forEach(id=>{const x=getA(id);if(x.status==="aktif")setStatus(x,"inceleme","Under review due to complaint: "+i.id)});logEv("SIKAYET",i.id+" — "+r);save();render();return}
  if(a==="closecomplaint"){const i=it();const r=reason("Reason for closing the complaint and its outcome:");if(!r)return;i.status="bitti";i.history.push({ts:Date.now(),user:SESSION.id,text:"Complaint closed: "+r});
    [i.a,i.b].forEach(id=>{const x=getA(id);if(x.status==="inceleme"){setStatus(x,"aktif","Review concluded: "+r);x.cooldownUntil=addDays(todayStr(),DB.params.cooldownDays)}});logEv("SIKAYET_KAPATILDI",i.id+" — "+r);save();render();return}
  if(a==="saveseal"){DB.officialSeal=$("#offseal").value.trim().toLowerCase();logEv("RESMI_MUHUR_TANIMLANDI",DB.officialSeal);save();render();return}
  if(a==="addq"){const P=readParamsForm();P.questions.push({id:"q_"+rnd().slice(0,6),label:"New question",opts:["Yes","No"],weight:2,sensitive:false,enabled:true});ctx.draft=P;render();return}
  if(a==="delq"){const P=readParamsForm();P.questions.splice(+t.dataset.i,1);ctx.draft=P;render();return}
  if(a==="exportparams"){download("matchmaking-parameters.json",JSON.stringify(readParamsForm(),null,2));return}
  if(a==="exportall"){logEv("YEDEK_ALINDI","full backup");download("matchmaking-backup-"+todayStr()+".json",JSON.stringify(DB));return}
  if(a==="exportaudit"){download("audit-log-"+todayStr()+".json",JSON.stringify({audit:DB.audit,chain:verifyChain(DB.audit),paramSeal:seal(DB.params)},null,2));return}
  if(a==="exportpkg"){
    const cnt=o=>Object.entries(o).map(([k,v])=>({k,n:v}));const by=(arr,fn)=>arr.reduce((r,x)=>{const k=fn(x);r[k]=(r[k]||0)+1;return r},{});
    const pk={tarih:todayStr(),kurum:DB.params.institution,parametreler:DB.params,parametreMuhru:seal(DB.params),parametreGecmisi:DB.paramHistory.map(x=>({ver:x.ver,ts:x.ts,user:x.user,reason:x.reason,seal:x.seal})),
      adayDurumlari:by(DB.applicants,a=>a.status),tanistirmaDurumlari:by(DB.intros,i=>i.status),eslestirmeKosulari:DB.runs.map(r=>({id:r.id,ts:r.ts,user:r.user,paramSeal:r.paramSeal,havuz:r.pool,oneri:r.suggestions.length,onerisiz:r.noMatch.length})),
      denetimGunlugu:DB.audit,zincir:verifyChain(DB.audit)};
    logEv("DENETIM_PAKETI","exported");download("audit-package-"+todayStr()+".json",JSON.stringify(pk,null,2));return}
  if(a==="seed"){if(!can.admin())return;seedDemo();toast("40 demo applicants added.");render();return}
  if(a==="unseed"){if(!can.admin())return;if(!confirm("Delete all demo applicants and the introductions linked to them?"))return;
    const ids=new Set(DB.applicants.filter(x=>x.demo).map(x=>x.id));DB.applicants=DB.applicants.filter(x=>!x.demo);DB.intros=DB.intros.filter(i=>!ids.has(i.a)&&!ids.has(i.b));DB.blocked=DB.blocked.filter(p=>!ids.has(p[0])&&!ids.has(p[1]));DB.runs=[];
    logEv("DENEME_VERISI_SILINDI",ids.size+" applicants");save();render();return}
  if(a==="toggleuser"){const u=DB.users.find(x=>x.id===t.dataset.id);if(u.active&&u.role==="admin"&&DB.users.filter(x=>x.active&&x.role==="admin").length<2){alert("The last active administrator cannot be deactivated.");return}
    u.active=!u.active;logEv("KULLANICI_DURUMU",`${u.name}: ${u.active?"active":"inactive"}`);save();render();return}
  if(a==="resetpin"){const u=DB.users.find(x=>x.id===t.dataset.id);const p=prompt(`New PIN for ${u.name} (at least 6 digits):`);if(!p||!/^\d{6,}$/.test(p)){if(p!==null)alert("The PIN must be at least 6 digits.");return}
    u.salt=rnd();u.hash=hashPin(p,u.salt);u.fails=0;u.lockUntil=0;logEv("PIN_DEGISTI",u.name);save();toast("PIN updated.");return}
  if(a==="wipe"){if(!can.admin())return;if(prompt("All data will be deleted. Type DELETE to confirm:")==="DELETE"){localStorage.removeItem(KEY);DB=null;SESSION=null;toast("All data deleted.");render()}return}
});

DB=load();
if(DB&&!DB.paramHistory)DB=null;
render();
</script>
</body>
