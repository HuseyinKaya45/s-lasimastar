.sira-havuz, .sira-dizi { display: flex; flex-direction: column; gap: 8px; }
.sira-oge { border: 1.5px solid var(--cizgi); background: var(--yuzey); border-radius: 12px; padding: 6px 14px; text-align: right; font-size: 1.35rem; line-height: 1.8; font-family: var(--arap); direction: rtl; }
